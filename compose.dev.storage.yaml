# Object Storage configuration for Ghost development environment
# Use with: docker compose -f compose.dev.yaml -f compose.dev.storage.yaml up
#
# This file adds VersityGW (S3-compatible storage) and configures ghost-dev to use it.
# Without this file, Ghost uses local filesystem storage (the default).

services:
  versitygw-setup:
    image: ghcr.io/versity/versitygw:v1.7.0@sha256:c4cbd9d9cb8dedbb055ac788dbd02635651b9b1cebac95b095b3217231aa87ad
    container_name: ghost-dev-versitygw-setup
    entrypoint: ['/bin/sh', '-c', 'mkdir -p /data/ghost-dev /data/ghost-dev-redirects']
    volumes:
      - versitygw-data:/data

  versitygw:
    image: ghcr.io/versity/versitygw:v1.7.0@sha256:c4cbd9d9cb8dedbb055ac788dbd02635651b9b1cebac95b095b3217231aa87ad
    container_name: ghost-dev-versitygw
    ports:
      - '9000:9000' # S3 API
    environment:
      - ROOT_ACCESS_KEY=s3-user
      - ROOT_SECRET_KEY=s3-pass
      - VGW_PORT=:9000
      - VGW_BACKEND=posix
      - VGW_BACKEND_ARGS=/data
    volumes:
      - versitygw-data:/data
    depends_on:
      versitygw-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '9000']
      interval: 1s
      retries: 120

  ghost-dev:
    environment:
      # Object Storage - S3Storage adapter with VersityGW backend
      storage__media__adapter: S3Storage
      storage__media__staticFileURLPrefix: content/media
      storage__files__adapter: S3Storage
      storage__files__staticFileURLPrefix: content/files
      storage__S3Storage__bucket: ghost-dev
      storage__S3Storage__region: us-east-1
      storage__S3Storage__tenantPrefix: ab/ab1234567890abcdef1234567890abcd
      storage__S3Storage__forcePathStyle: 'true'
      storage__S3Storage__cdnUrl: http://127.0.0.1:9000/ghost-dev
      storage__S3Storage__staticFileURLPrefix: content/images
      storage__S3Storage__endpoint: http://versitygw:9000
      storage__S3Storage__accessKeyId: s3-user
      storage__S3Storage__secretAccessKey: s3-pass
      urls__media: http://127.0.0.1:9000/ghost-dev/ab/ab1234567890abcdef1234567890abcd
      urls__files: http://127.0.0.1:9000/ghost-dev/ab/ab1234567890abcdef1234567890abcd
    depends_on:
      versitygw:
        condition: service_healthy

volumes:
  versitygw-data:
