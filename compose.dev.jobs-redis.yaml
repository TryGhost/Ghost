# Separate from the cache Redis: the queue needs AOF persistence and noeviction.
# It listens on 6380 inside the container too, so host-run Ghost uses the same port.

services:
  redis-jobs:
    image: redis:7.4@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
    container_name: ghost-dev-redis-jobs
    command:
      [
        'redis-server',
        '--port',
        '6380',
        '--loglevel',
        'warning',
        '--appendonly',
        'yes',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '127.0.0.1:6380:6380'
    volumes:
      - redis-jobs-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -p
        - '6380'
        - --raw
        - incr
        - ping
      interval: 1s
      retries: 120

  ghost-dev:
    environment:
      adapters__jobs__active: BullMQJobsBackend
      adapters__jobs__BullMQJobsBackend__connection__host: redis-jobs
      adapters__jobs__BullMQJobsBackend__connection__port: 6380
      adapters__jobs__BullMQJobsBackend__prefix: ghost-dev
    depends_on:
      redis-jobs:
        condition: service_healthy

volumes:
  redis-jobs-data:
