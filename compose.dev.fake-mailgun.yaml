services:
  fake-mailgun:
    build:
      context: ./
      dockerfile: docker/fake-mailgun/Dockerfile
    init: true
    # Simulated analytics; change at runtime with PATCH http://127.0.0.1:4010/__fake/config
    environment:
      FAKE_MAILGUN_OPENED_RATE: '0.6'
      FAKE_MAILGUN_MAX_OPEN_DELAY_SECONDS: '300'
      FAKE_MAILGUN_CLICK_RATE: '0.1'
      FAKE_MAILGUN_MIN_CLICK_DELAY_MS: '1000'
      FAKE_MAILGUN_MAX_CLICK_DELAY_MS: '30000'
      # Ghost runs on the host; its site hostname only resolves there
      FAKE_MAILGUN_CLICK_HOST: host.docker.internal
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:4010:4010'
    depends_on:
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4010/v3/fake.mailgun.test/events').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 1s
      timeout: 5s
      retries: 30

  ghost-dev:
    environment:
      bulkEmail__mailgun__apiKey: fake-mailgun-api-key
      bulkEmail__mailgun__domain: fake.mailgun.test
      bulkEmail__mailgun__baseUrl: http://fake-mailgun:4010/v3
    depends_on:
      fake-mailgun:
        condition: service_healthy
