codecov:
  require_ci_to_pass: true
coverage:
  status:
    patch: false
    project:
      default: false
      e2e-tests:
        flags:
          - e2e-tests
        threshold: 0.2%
      unit-tests:
        flags:
          - unit-tests
        threshold: 0.2%
        # Run-to-run noise exceeds the threshold, so report without failing.
        informational: true
flags:
  e2e-tests:
    carryforward: true
  # ghost/core's unit tests only run when it's affected, so most PRs carry
  # the last report forward.
  unit-tests:
    carryforward: true
