name: PR Preview

on:
  pull_request_target:
    types: [labeled, unlabeled, closed]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Preview
    # A profile label enables a preview on its own; a bare label uses the default.
    if: >-
      github.event.action != 'closed'
      && (github.event.label.name == 'preview'
          || startsWith(github.event.label.name, 'preview:'))
      && (contains(github.event.pull_request.labels.*.name, 'preview')
          || contains(toJSON(github.event.pull_request.labels.*.name), '"preview:'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
    steps:
      # Only the trusted workflow commit; never the PR head or merge ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Check PR and image
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_JOB_NAME: Build Docker Images
        run: node scripts/dispatch-pr-preview.js check

      # Ghost-Moya re-reads the PR before acting, so a superseded request is skipped.
      - name: Dispatch deploy to Ghost-Moya
        if: steps.check.outputs.skip != 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.CANARY_DOCKER_BUILD }}
          repository: TryGhost/Ghost-Moya
          event-type: preview-deploy
          client-payload: >-
            {
              "pr_number": "${{ github.event.pull_request.number }}",
              "head_sha": "${{ steps.check.outputs.head_sha }}",
              "action": "deploy"
            }

  destroy:
    name: Destroy Preview
    # Tear down only when the last preview label is removed or the PR closes.
    if: >-
      (github.event.action == 'unlabeled'
       && (github.event.label.name == 'preview'
           || startsWith(github.event.label.name, 'preview:'))
       && !contains(github.event.pull_request.labels.*.name, 'preview')
       && !contains(toJSON(github.event.pull_request.labels.*.name), '"preview:'))
      || (github.event.action == 'closed'
          && (contains(github.event.pull_request.labels.*.name, 'preview')
              || contains(toJSON(github.event.pull_request.labels.*.name), '"preview:')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Only the trusted workflow commit; never the PR head or merge ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Re-check teardown eligibility
        id: recheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/dispatch-pr-preview.js teardown

      - name: Dispatch destroy to Ghost-Moya
        if: steps.recheck.outputs.skip != 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.CANARY_DOCKER_BUILD }}
          repository: TryGhost/Ghost-Moya
          event-type: preview-destroy
          client-payload: >-
            {
              "pr_number": "${{ github.event.pull_request.number }}",
              "action": "destroy"
            }
