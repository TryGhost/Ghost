name: PR Preview

on:
  pull_request_target:
    types: [labeled, unlabeled, closed]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Preview
    # A profile label enables a preview on its own; a bare label uses the default.
    if: >-
      github.event.action != 'closed'
      && (github.event.label.name == 'preview'
          || startsWith(github.event.label.name, 'preview:'))
      && (contains(github.event.pull_request.labels.*.name, 'preview')
          || contains(toJSON(github.event.pull_request.labels.*.name), '"preview:'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check PR and image
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_JOB_NAME: Build Docker Images
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] || exit 1
          # Read live rather than from the event, which may be stale by now.
          PR=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '{state, sha: .head.sha, repo: .head.repo.full_name, labels: [.labels[].name]}')

          if [ "$(jq -r '.state' <<< "$PR")" != "open" ] \
              || [ "$(jq '.labels | any(. == "preview" or startswith("preview:"))' <<< "$PR")" != "true" ]; then
            echo "::warning::PR is closed or no longer labelled, skipping dispatch"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Profile names and the default are defined in Ghost-Moya, which reads
          # the label itself; these checks only surface mistakes on the PR.
          PROFILES=$(jq -r '[.labels[] | select(startswith("preview:"))] | join(", ")' <<< "$PR")
          PROFILE_COUNT=$(jq '[.labels[] | select(startswith("preview:"))] | length' <<< "$PR")
          if [ "$PROFILE_COUNT" -gt 1 ]; then
            echo "::error::Multiple preview profile labels ($PROFILES) — remove all but one"
            exit 1
          fi
          # Validate the JSON strings before command substitution strips newlines.
          if ! jq -e '.labels | map(select(startswith("preview:"))) | all(test("^preview:[a-z0-9]+(-[a-z0-9]+)*\\z"))' <<< "$PR" > /dev/null; then
            echo "::error::Malformed profile label '${PROFILES}' — expected lowercase words separated by hyphens"
            exit 1
          fi

          if [ "$(jq -r '.repo' <<< "$PR")" != "$REPOSITORY" ]; then
            echo "::error::Fork PR images are not published to GHCR, so this PR cannot have a preview"
            exit 1
          fi

          HEAD_SHA=$(jq -r '.sha' <<< "$PR")
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1

          # CI dispatches a refresh to Ghost-Moya once the image is published, so
          # only an already-built head needs dispatching from here. A head can have
          # several CI runs (reopens, reruns), so any successful build counts.
          RUNS=$(gh api --paginate "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${HEAD_SHA}&per_page=100" \
            --jq '.workflow_runs[] | "\(.id) \(.status)"')
          BUILT="" PENDING=false FAILED=""
          while read -r RUN_ID RUN_STATUS; do
            [ -n "$RUN_ID" ] || continue
            JOB=$(gh api --paginate "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
              --jq ".jobs[] | select(.name == \"${BUILD_JOB_NAME}\") | \"\(.status) \(.conclusion // \"\")\"")
            case "$JOB" in
              "completed success") BUILT=$RUN_ID; break ;;
              "completed "*) FAILED=${JOB#completed } ;;
              "") [ "$RUN_STATUS" = completed ] || PENDING=true ;;
              *) PENDING=true ;;
            esac
          done <<< "$RUNS"

          if [ -z "$BUILT" ]; then
            if [ "$PENDING" = true ] || [ -z "$RUNS" ]; then
              echo "::notice::The image for ${HEAD_SHA} is not built yet; CI deploys the preview when it is"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::'${BUILD_JOB_NAME}' for ${HEAD_SHA} did not succeed (${FAILED:-not run}); push a fix to deploy the preview"
            exit 1
          fi

          echo "Image for ${HEAD_SHA} is built (CI run ${BUILT})"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      # Ghost-Moya re-reads the PR before acting, so a superseded request is skipped.
      - name: Dispatch deploy to Ghost-Moya
        if: steps.check.outputs.skip != 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.CANARY_DOCKER_BUILD }}
          repository: TryGhost/Ghost-Moya
          event-type: preview-deploy
          client-payload: >-
            {
              "pr_number": "${{ github.event.pull_request.number }}",
              "head_sha": "${{ steps.check.outputs.head_sha }}",
              "action": "deploy"
            }

  destroy:
    name: Destroy Preview
    # Tear down only when the last preview label is removed or the PR closes.
    if: >-
      (github.event.action == 'unlabeled'
       && (github.event.label.name == 'preview'
           || startsWith(github.event.label.name, 'preview:'))
       && !contains(github.event.pull_request.labels.*.name, 'preview')
       && !contains(toJSON(github.event.pull_request.labels.*.name), '"preview:'))
      || (github.event.action == 'closed'
          && (contains(github.event.pull_request.labels.*.name, 'preview')
              || contains(toJSON(github.event.pull_request.labels.*.name), '"preview:')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Re-check teardown eligibility
        id: recheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] || exit 1
          PR=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '{state, labels: [.labels[].name]}')

          KEEP_PREVIEW=$(echo "$PR" | jq '.state == "open" and (.labels | any(. == "preview" or startswith("preview:")))')
          if [ "$KEEP_PREVIEW" = "true" ]; then
            echo "Preview is still enabled, skipping teardown"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch destroy to Ghost-Moya
        if: steps.recheck.outputs.skip != 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.CANARY_DOCKER_BUILD }}
          repository: TryGhost/Ghost-Moya
          event-type: preview-destroy
          client-payload: >-
            {
              "pr_number": "${{ github.event.pull_request.number }}",
              "action": "destroy"
            }
