name: Koenig Demo

# Deploys the koenig-lexical demo (https://koenig.ghost.org) to GitHub Pages
# on main pushes that touch koenig/. Requires Pages to use the "GitHub Actions"
# source, with the custom domain set in repo settings, and the KLIPY API key
# secret to be present.

on:
  push:
    branches: [main]
    paths:
      - 'koenig/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/koenig-demo.yml'
  workflow_dispatch:

concurrency:
  group: koenig-demo
  cancel-in-progress: true

env:
  NODE_VERSION: 22.23.3

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.repository == 'TryGhost/Ghost'
    permissions:
      contents: read
    env:
      VITE_KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-args: --filter @tryghost/koenig-lexical...
          store-cache: 'false'

      - name: Build demo
        run: pnpm nx run @tryghost/koenig-lexical:build:demo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: koenig/koenig-lexical/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
