name: Koenig Demo

# Deploys the koenig-lexical demo (https://koenig.ghost.org) to GitHub Pages
# on main pushes that touch koenig/. Replaces the pages.yml workflow from the
# archived TryGhost/Koenig repo. Requires Pages to be enabled on this repo
# (gh-pages branch) and the KLIPY API key secret to be present.

on:
  push:
    branches: [main]
    paths:
      - 'koenig/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/koenig-demo.yml'
  workflow_dispatch:

concurrency:
  group: koenig-demo
  cancel-in-progress: true

env:
  NODE_VERSION: 22.23.1

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    if: github.repository == 'TryGhost/Ghost'
    permissions:
      contents: write
    env:
      VITE_KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @tryghost/koenig-lexical...

      - name: Build demo
        run: pnpm nx run @tryghost/koenig-lexical:build:demo

      - name: Add CNAME
        run: echo 'koenig.ghost.org' > koenig/koenig-lexical/dist/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./koenig/koenig-lexical/dist
