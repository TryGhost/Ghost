packages:
  - 'ghost/*'
  - 'apps/*'
  - 'e2e'
  - 'koenig/*'
  - 'packages/**'
  - '!packages/_template'
  - 'configs/*'
  - 'scripts'

strictDepBuilds: true
catalogMode: strict

minimumReleaseAge: 4320 # 3 days in minutes; matches Renovate's minimumReleaseAge
blockExoticSubdeps: true

ignoredOptionalDependencies:
  # sqlite3 was replaced by better-sqlite3 so it can be ignored
  # TODO: remove once knex-migrator no longer depends on sqlite3
  - sqlite3

allowBuilds:
  # Permitted builds are version-scoped. Adding or updating a permitted version
  # requires an explicit Platform security review.
  # sentry-cli's postinstall downloads its binary, which is only used for
  # sourcemap upload — that was gated on the old Koenig repo's IS_SHIPPING
  # publish flow and isn't part of dev or CI builds here.
  '@sentry/cli': false
  '@swc/core@1.15.43': true
  'better-sqlite3@12.11.1': true
  'core-js@2.6.12': true
  cpu-features: false
  'dtrace-provider@0.8.8': true
  'esbuild@0.25.12 || 0.28.2': true
  'fsevents@1.2.13 || 2.3.2 || 2.3.3': true
  'msw@2.14.6': true
  'nx@23.1.1': true
  'protobufjs@7.6.4': true
  're2@1.26.1': true
  'sharp@0.35.3': true
  ssh2: false

