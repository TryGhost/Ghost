  # make their way into the Ghost docker image, forcing a 1.x upgrade trims
  # the final dependency list
  'consolidate@0.15.1': ^1.0.4
  'debug@>=4.0.0 <4.3.1': ^4.3.1
  'debug@<2.6.9': ^2.6.9
