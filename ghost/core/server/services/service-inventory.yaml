        changing resource ownership; current CSV content and fake Writable tests do not
        demonstrate pool release under disconnect. Pin cleanup scheduling retry/concurrency and
        restart flags; successful scheduling flags survive independently of the jobs backend,
        and members exposes no cancellation/reset for them.
      - >-
        Preserve Stripe environment checks and mixed config capture: immutable config/URL
        values, captured mail/issuer/secrets/dialect and request-time settings access are
        different contracts. Direct token-provider constructors in settings/newsletters/ welcome
        emails remain separate owners. Keep these members obligations scoped to its migration;
        unrelated member business changes are not pilot prerequisites.
  members-events:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - members-events/index.js
    notes: >-
      Preserve guarded subscriptions, live members API lookup and the distinct page/click,
      email-open and comment update paths. Establish partial-init recovery, listener ownership,
      transaction/event ordering and cache behavior before changing lifecycle.
    contracts:
      exports:
        summary: >-
          CommonJS exports one eager wrapper with receiver-dependent synchronous init and
          clearLastSeenAtCache, both returning undefined. After init, lastSeenAtCache and
          lastSeenAtUpdater are mutable public properties. Deep CommonJS classes are constructible;
          update methods resolve undefined after work; subscribe and cache methods are synchronous.
          No readiness/reset/shutdown API exists. Deep tests cover selected methods; complete
          facade shape, return values and detached invocation are source-only.
        sources:
          - core/server/services/members-events/index.js
          - core/server/services/members-events/last-seen-at-updater.js
          - core/server/services/members-events/last-seen-at-cache.js
        tests:
          - test/unit/server/services/members-events/last-seen-at-updater.test.js
          - test/unit/server/services/members-events/last-seen-at-cache.test.js
      construction:
        summary: >-
          Boot is the only production init caller found. First init creates a cache with shared
          settings, publishes it, constructs/publishes an updater borrowing config, database and
          common events, then subscribes. A callback reads members.api when needed rather than
          capturing that implementation. Cache construction reads the current day/timezone; updater
          construction requires a truthy members getter and otherwise stores dependencies, creating
          a fallback cache only for direct construction without one. Neither constructor queries
          the database. Unit tests inject collaborators and pin the missing-getter error, not the
          root graph or partial construction.
        sources:
          - core/boot.js
          - core/server/services/members-events/index.js
          - core/server/services/members-events/last-seen-at-updater.js
          - core/server/services/members-events/last-seen-at-cache.js
        tests:
          - test/unit/server/services/members-events/last-seen-at-updater.test.js
          - test/unit/server/services/members-events/last-seen-at-cache.test.js
      consumers:
        summary: >-
          Runtime use is through shared DomainEvents: frontend middleware dispatches page views,
          link tracking dispatches clicks after writes or transaction executionPromise fulfillment,
          comments dispatches after notification work, and the email processor dispatches opens
          before awaiting open-event storage. Page/click writes manually emit common member.edited,
          reaching webhooks; email SQL bypasses model events. Tests directly access the updater and
          clear the cache. Real frontend/comment HTTP tests settle events and pin selected timestamp
          changes; click HTTP pins a valid timestamp and intercepted webhook payload. Processor units
          inject dispatch/storage fakes; real provider-open to member-update composition is unproven.
        sources:
          - core/frontend/web/site.js
          - core/server/services/link-tracking/link-click-repository.js
          - core/server/services/comments/comments-service.js
          - core/server/services/email-service/email-event-processor.js
          - core/server/services/email-service/events/email-opened-event.ts
          - core/server/services/members-events/last-seen-at-updater.js
          - core/server/services/webhooks/listen.js
          - core/shared/events/index.js
        tests:
          - test/e2e-frontend/members.test.js
          - test/e2e-api/members-comments/comments.test.js
          - test/e2e-server/click-tracking.isolated.test.js
          - test/unit/server/services/email-service/email-event-processor.test.js
      startup:
        summary: >-
          Foreground boot calls synchronous init in the service Promise.all argument list after
          members.init is invoked, before newsletter analytics setup and HTTP readiness. Subscribing
          does not read members.api or validate database readiness; the getter is used on later
          page/click/comment work. Email updates use the borrowed database directly. Before init,
          public collaborators are absent and no handlers exist. Booted tests prove usable completed
          composition, not exact ordering, early events, failed publication or retry after failure.
        sources:
          - core/boot.js
          - core/server/services/members-events/index.js
          - core/server/services/members-events/last-seen-at-updater.js
        tests:
          - test/integration/services/last-seen-at-updater.test.js
          - test/e2e-frontend/members.test.js
      lifetime:
        summary: >-
          Truthy lastSeenAtUpdater makes later init a no-op, retaining its dependencies, cache and
          anonymous subscriptions across same-process boots. Replacing wrapper properties does not
          retarget subscribed closures. The members getter observes the current API and db.knex is
          accessed per operation. Cache clear drops IDs only; it neither changes listeners nor resets
          the remembered day. Cache membership expires lazily when checked after the current day
          changes. Tests pin cache clearing/rollover and direct-root daily suppression, not wrapper
          identity, replacement, repeated boot or in-flight shutdown.
        sources:
          - core/server/services/members-events/index.js
          - core/server/services/members-events/last-seen-at-updater.js
          - core/server/services/members-events/last-seen-at-cache.js
          - core/server/data/db/index.js
          - core/server/ghost-server.ts
        tests:
          - test/unit/server/services/members-events/last-seen-at-cache.test.js
          - test/integration/services/last-seen-at-updater.test.js
      configuration:
        summary: >-
          Only explicit false disables click subscription, selected once during subscribe; other
          event types remain registered. Timezone is read per update/cache check. Cache and email SQL
          default missing timezone to Etc/UTC; page/comment paths pass the returned value directly
          to moment. Cache days follow the current clock, while writes compare the event timestamp's
          day. Config is retained as an accessor, not a subtree; no production hot reload is implied.
          Units pin disabled/missing-config click delivery and selected timezone branches. Real DB
          integration pins CET midnight and same-day suppression with direct updater calls, not
          delayed/out-of-order events, DST, same-instance timezone changes or later config replacement.
        sources:
          - core/server/services/members-events/last-seen-at-updater.js
          - core/server/services/members-events/last-seen-at-cache.js
          - core/shared/config/validated.ts
        tests:
          - test/unit/server/services/members-events/last-seen-at-updater.test.js
          - test/unit/server/services/members-events/last-seen-at-cache.test.js
          - test/integration/services/last-seen-at-updater.test.js
      resources:
        summary: >-
          The graph owns a Set of member IDs and three or four DomainEvents handlers with no
          unsubscribe, timer, transport, pending-work registry or shutdown drain. Page/click work
          preemptively caches the ID, locks/rereads the row in a shared-database transaction, refreshes
          relations and saves, then emits member.edited before the transaction completes. Concurrent
          cached calls skip without awaiting the first write. Email opens use conditional raw SQL;
          comments read then update both fields if either is stale, without a shared transaction or
          monotonicity guard. Unit race tests program fake reads/transactions; real integration
          pins one update invocation under a shared cache, not independent-connection locking or
          rollback. DomainEvents allSettled is test tracking, not production drain.
        sources:
          - core/server/services/members-events/index.js
          - core/server/services/members-events/last-seen-at-updater.js
          - core/server/services/members-events/last-seen-at-cache.js
          - core/server/services/members/members-api/repositories/member-repository.js
          - core/server/ghost-server.ts
          - package.json
        tests:
          - test/unit/server/services/members-events/last-seen-at-updater.test.js
          - test/integration/services/last-seen-at-updater.test.js
      failures:
        summary: >-
          Root initialization throws synchronously. Failure before updater publication permits retry;
          subscription failure leaves a truthy updater and potentially partial listeners that later
          init will not repair. Page/click transaction failures evict the cached ID and reject; cache
          checks and preliminary timezone calculations can fail before that catch. Event handlers
          catch/log errors, and DomainEvents independently catches rejected handlers. Direct updater
          calls reject. Existing error-listener tests assert true without logging assertions; the
          retry test checks a second invocation after a synchronous fake transaction throw but does
          not await assert.rejects. Real comment HTTP pins same-day no-op, not concurrent/mixed-date
          writes, partial persistence or notification-before-event failure.
        sources:
          - core/server/services/members-events/index.js
          - core/server/services/members-events/last-seen-at-updater.js
          - core/server/services/members-events/last-seen-at-cache.js
          - core/server/services/comments/comments-service.js
          - package.json
        tests:
          - test/unit/server/services/members-events/last-seen-at-updater.test.js
          - test/e2e-api/members-comments/comments.test.js
    unverified: []
    blockers:
      - >-
        Add root export/identity, initial ordering, partial subscription failure, retry and
        repeated-boot tests. Specify subscriber ownership, unsubscribe and pending-work drain;
        cache clearing is not a lifecycle reset.
      - >-
        Characterize retained callbacks against members/database replacement, click-config
        capture, timezone changes, DST and delayed/out-of-order events. Cache and event days can
        differ; comments can overwrite a newer field when the other field is stale.
      - >-
        Establish real concurrent row locking, failed-write cache eviction and retry, skipped
        in-flight calls, and member.edited delivery relative to commit/rollback. Fake race and
        transaction tests do not prove those database/event guarantees.
      - >-
        Replace assert-true listener failure evidence with observable logs/state and awaited
        rejection assertions. Cover real email-open composition, raw-SQL no-webhook behavior,
        producer failures and comment mixed-date/concurrent updates without changing baseline
        behavior during the initialization migration.
  members-metafields:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - members-metafields/index.ts
    notes: >-
      Preserve the three boot-wired services, retained consumer identities, explicit write
      audiences and shared transactions. Characterize initialization and failure boundaries
      before changing composition; recorded contracts are not all regression-tested.
    contracts:
      exports:
        summary: >-
          Named runtime exports are synchronous init, mutable definitions/values/bindings,
          audience/access constants, canWrite, actingContext and adminWriteOrigin. Service
          bindings are undefined before init; class methods depend on their receiver. Definitions
          exposes asynchronous CRUD/reorder and addOne/findByKey/recordCreated helpers; values
          exposes synchronous unwrapWire plus asynchronous read/plan/apply/feed methods; bindings exposes asynchronous
          bind/remove/planning. HTTP tests assert selected serialized definitions, values, access
          rules and provenance; they do not pin the root export shape or init return timing.
        sources:
          - core/server/services/members-metafields/index.ts
          - core/server/services/members-metafields/access.ts
          - core/server/services/members-metafields/actions.ts
          - core/server/services/members-metafields/definitions-service.ts
          - core/server/services/members-metafields/values-service.ts
          - core/server/services/members-metafields/bindings-service.ts
        tests:
          - test/e2e-api/admin/member-custom-fields.test.ts
          - test/e2e-api/members/custom-fields.test.ts
      construction:
        summary: >-
          Init obtains the shared Knex getter, models and config, then publishes definitions,
          values and bindings sequentially; bindings retains that values instance. Definitions
          receives an action-recording closure over models.Action; definitions and values receive
          limit callbacks. Constructors store dependencies without querying or starting work.
          The shared DB getter can create the module-cached Knex client if not already loaded.
          No other production construction of these classes was found. Binding units construct
          the class with fake query/values collaborators, not the root or publication sequence.
        sources:
          - core/server/services/members-metafields/index.ts
          - core/server/services/members-metafields/definitions-service.ts
          - core/server/services/members-metafields/values-service.ts
          - core/server/services/members-metafields/bindings-service.ts
          - core/server/data/db/index.js
          - core/server/data/db/connection.ts
        tests:
          - test/unit/server/services/members-metafields/bindings-service.test.ts
      consumers:
        summary: >-
          Admin/member endpoints use definitions; members retains values for BREAD, account,
          member deletion and activity feeds, and definitions/values for CSV import/export.
          Webhooks read values through members BREAD. Member filtering and API serialization
          also deep-import helpers. No production calls to the exported bindings service were
          found in the inspected Core source after checkout collection was removed; it remains
          constructed and exported. Real HTTP asserts field/value visibility, CSV cells/import
          provenance, filter matches and filtered bulk actions. Binding units exercise planning
          with fake query/value collaborators, not a production consumer.
        sources:
          - core/server/api/endpoints/member-metafields.ts
          - core/server/api/endpoints/member-metafields-members.ts
          - core/server/api/endpoints/members.js
          - core/server/api/endpoints/utils/serializers/output/member-metafields.ts
          - core/server/services/members/api.js
          - core/server/services/members/members-api/members-api.js
          - core/server/services/members/members-api/services/member-bread-service.js
          - core/server/services/members/members-api/repositories/member-repository.js
          - core/server/services/members/members-api/repositories/event-repository.js
          - core/server/services/members/account-service.ts
          - core/server/services/members/service.js
          - core/server/services/members/import-export/index.ts
          - core/server/services/webhooks/index.js
          - core/server/models/member.js
          - core/server/services/members-metafields/filter.ts
          - core/server/services/members-metafields/index.ts
        tests:
          - test/e2e-api/admin/member-custom-fields.test.ts
          - test/e2e-api/members/custom-fields.test.ts
          - test/e2e-api/admin/members-import-custom-fields.test.ts
          - test/e2e-api/admin/members-exporter-custom-fields.test.ts
          - test/e2e-api/admin/members-filter-custom-fields.test.ts
          - test/unit/server/services/members-metafields/bindings-service.test.ts
      startup:
        summary: >-
          Boot calls init during initCore after database/settings/signing-key/i18n setup and
          before members/tiers composition. Initialization has no feature gate, database-ready
          validation or rollback. API callers assume exported instances exist. Definition reads
          remain available when direct definition writes are blocked by Labs/host limits.
          HTTP tests assert those direct route responses, not dependency ordering, pre-init
          calls or startup faults. Shipped ceiling validation runs at import.
        sources:
          - core/boot.js
          - core/server/services/members-metafields/index.ts
          - core/server/services/members-metafields/config.ts
          - core/server/web/api/endpoints/admin/routes.js
          - core/server/web/members/account/routes.ts
          - core/server/api/endpoints/member-metafields.ts
        tests:
          - test/e2e-api/admin/member-custom-fields.test.ts
          - test/e2e-api/members/custom-fields.test.ts
      lifetime:
        summary: >-
          Once all three bindings exist, init preserves them and their captured Knex/dependencies.
          There is no reset or shutdown hook. If construction throws after an assignment, a retry
          replaces earlier instances; retained members/CSV references would not follow that
          replacement. Definitions, bindings, values and change history
          live in tables, not an instance cache. Archiving hides values while retaining rows;
          deletion cascades values/bindings, and field-history names survive definition deletion.
          HTTP asserts selected archive/delete/readback outcomes, not identity, restart or retry.
        sources:
          - core/server/services/members-metafields/index.ts
          - core/server/services/members-metafields/values-service.ts
          - core/server/services/members-metafields/bindings-service.ts
          - core/server/services/members/service.js
          - core/server/data/schema/schema.js
        tests:
          - test/e2e-api/admin/member-custom-fields.test.ts
          - test/e2e-api/members/custom-fields.test.ts
      configuration:
        summary: >-
          Limit callbacks read members:metafields:maxDefinitions when adding definitions or
          planning value writes; the shipped fallback is captured and validated at import.
          The parser accepts nonnegative safe integers/numeric strings, including zero, and
          falls back to the shipped 100 for invalid input. Definitions count active and archived
          rows; lowering the limit does not remove them. HTTP asserts zero/string/fallback and
          next-request changes using test config mutation, not production hot reload of the
          immutable config tree. Constructors retain Knex; schema/type/key rules are imported.
        sources:
          - core/server/services/members-metafields/index.ts
          - core/server/services/members-metafields/config.ts
          - core/server/services/members-metafields/definitions-service.ts
          - core/server/services/members-metafields/values-service.ts
          - core/server/services/members-metafields/schema.ts
          - core/shared/config/defaults.json
          - core/shared/config/SCHEMA.md
        tests:
          - test/e2e-api/admin/member-custom-fields.test.ts
      resources:
        summary: >-
          The root owns no timers, subscriptions, queue, transport or database pool; it borrows
          shared Knex. Definition add/reorder use transactions; addOne and value applyWrite join
          a supplied transaction or open one, while bind/remove use the supplied executor.
          Value changes and their history rows share a transaction; the members service
          composes larger writes around it, and CSV import uses per-row transactions. Definition actions
          are separate post-write work. Real HTTP proves batch rollback on a later name conflict,
          successful value/history writes and cascades; validation refusals do not prove rollback
          after a value/history write fails. Import failure units use fake commit/rollback.
        sources:
          - core/server/services/members-metafields/definitions-service.ts
          - core/server/services/members-metafields/values-service.ts
          - core/server/services/members-metafields/bindings-service.ts
          - core/server/services/members-metafields/actions.ts
          - core/server/services/members/members-api/services/member-bread-service.js
          - core/server/services/members/import-export/import/importer.ts
          - core/server/data/db/connection.ts
          - core/server/data/schema/schema.js
        tests:
          - test/e2e-api/admin/member-custom-fields.test.ts
          - test/e2e-api/members/custom-fields.test.ts
          - test/e2e-api/admin/members-import-custom-fields.test.ts
          - test/unit/server/services/members/import-export/import/error-handling.test.ts
      failures:
        summary: >-
          Invalid plans reject before writes; malformed value leaves are logged/omitted and
          malformed history field lists become empty, while invalid definition decoding rejects
          the read. Bindings skip unresolved/invalid rows and return ordered good plans plus the
          first failure. Definition action failures are logged after data writes. Multi-property definition edits are not atomic; limit
          counting deliberately permits concurrent overshoot, and applying a plan does not
          revalidate its captured definition. HTTP asserts selected refusals/corrupt reads and
          successful actions; fake binding/import tests assert continuation/reporting.
          Action failure, partial edits, stale plans and concurrency guarantees remain untested.
        sources:
          - core/server/services/members-metafields/definitions-service.ts
          - core/server/services/members-metafields/values-service.ts
          - core/server/services/members-metafields/bindings-service.ts
          - core/server/services/members-metafields/actions.ts
          - core/server/services/members/import-export/import/importer.ts
        tests:
          - test/e2e-api/admin/member-custom-fields.test.ts
          - test/e2e-api/members/custom-fields.test.ts
          - test/unit/server/services/members-metafields/bindings-service.test.ts
          - test/unit/server/services/members/import-export/import/error-handling.test.ts
    unverified: []
    blockers:
      - >-
        Pin the real root exports, pre-init behavior, synchronous publication, repeated-init
        identities and partial-construction retry. Cover retained members/CSV consumers,
        including shared database replacement/restart;
        constructor units and successful HTTP boot do not establish those lifecycle contracts.
      - >-
        Add real database failure assertions for member/value/history writes after
        work has begun, and for post-write action-log failure. Preserve the narrower existing
        definition-batch rollback evidence; prevalidation refusals and fake transaction tests
        do not establish these outcomes or event delivery relative to commit/rollback.
      - >-
        Characterize concurrent definition edits/deletion, deliberately approximate limit
        enforcement, and plans applied after definition access/status changes. Multi-property
        edits can retain earlier writes after later failure, and feed rows/count use separate
        reads; no atomicity or snapshot guarantee should be introduced by the migration.
      - >-
        Characterize binding resolution against real archived/malformed rows before retaining
        or changing that API during migration. Existing binding units use fake query/value
        collaborators; they do not establish database behavior or in-flight work settlement.
        Confirm ownership of the constructed bindings service now that the inspected
        production consumers were removed.
  mentions:
