          The root borrows DB/models/services/metrics and owns retained cursors, newsletter
          pending-update maps and a provider-ID cache without eviction. Recurring timers and
          queues belong to jobs; root has no stop/abort/drain. Default backend clears timers
          and pending work and waits only to its shutdown deadline, without canceling running
          provider/DB work. Awaited startFetch includes recursive continuation, but not detached
          metadata writes or dispatched DomainEvents subscribers; newsletter failures/complaints
          include a 70ms yield, not an event drain. Job units prove a handler awaits an injected
          executor and fake-time recurring dispatch reaches the real backend once; wrapper
          continuation is tested separately. Neither proves real analytics provider work and
          downstream events settle before GhostServer shutdown or restart.
        sources:
