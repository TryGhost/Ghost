      failures:
        summary: >-
          Source-checked: construction failure can leave didInit true and partial fields;
          a rejected controller.init promise is not joined. Receive dispatch errors
          propagate, whereas controller processing and sender event-preparation errors
          are logged/swallowed. Discovery fetch and parser failures warn and return null;
          individual POST failures are logged and later targets continue. Discovery units
          assert null for an invalid Link endpoint, warning rather than error logging for a
          failed fetch, and null without a warning when content type is missing. A dispatched-job
          integration asserts that an invalid earlier endpoint does not prevent delivery to a
          later linked page; it does not establish completion timing for the whole job.
          Routing HEAD failures become false. API rejects invalid new mentions, retains
          existing mentions on transient metadata failure, deletes after three hard
          failures and resets the count after success. Controller units assert swallowed
          API/URL errors; sender Nock tests assert selected HTTP/network rejection and
          continuation after one failed send. Metadata units inject 429/503/timeout/404
          errors; API units assert survival/deletion/restoration through an in-memory
          repository, not persisted counters. Real HTTP covers target deletion and
          selected verification outcomes, not construction failure or atomic DB/event work.
        sources:
