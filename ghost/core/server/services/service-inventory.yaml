          Boot initializes the wrapper. Theme activation for boot/API/override awaits api.activateTheme
          before the frontend bridge; theme upload copies settings through api. The custom
          settings endpoint lists/updates through the current wrapper property. The data
          importer indirectly triggers activation without awaiting it. Global template options
          and local preview keys independently read the shared cache. No other runtime root
          or deep-constructor caller was found. HTTP cases cover edits and successful theme-copy
          activation; middleware tests replace the cache reader, leaving the complete import
          and rendering paths untested.
