        Record data-object quirks before migration: ClickEvent without id overwrites its generated
        event_id with undefined, and repository getAll reconstructs no saved event ID/timestamp.
        save replaces event_id after persistence; no constructor/getAll assertion pins these boundaries.
  machine-payments:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - machine-payments/index.js
    notes: >-
      Preserve the boot/request initialization boundary, per-rail availability and one-request
      content unlock. Root lifecycle, credential rotation, provider resources and failures after
      settlement remain migration blockers despite substantial deep implementation coverage.
    contracts:
      exports:
        summary: >-
          CommonJS exports an eager wrapper instance with public service initially null, init,
          isEnabled, isPurchasable and async challengeOrFulfill, plus the wrapper constructor.
          Methods require their receiver. init resolves the implementation; availability methods
          return false until initialization completes, while challengeOrFulfill awaits init itself.
          The deep class exposes synchronous eligibility; getTerms resolves payment terms and
          challengeOrFulfill resolves a Fetch Response. Adapters expose canHandle/challenge/fulfill.
          Deep tests assert
          402 challenges, 200 paid markdown with private/no-store, 403 rejection and 503 unavailable
          responses; they do not pin root export shape, receiver or publication contracts.
        sources:
          - core/server/services/machine-payments/index.js
          - core/server/services/machine-payments/service.ts
          - core/server/services/machine-payments/types.ts
        tests:
          - test/unit/server/services/machine-payments/service.test.js
          - test/unit/server/services/machine-payments/adapters.test.js
      construction:
        summary: >-
          First init creates a deposit-address store, payment recorder, event repository retaining
          models.MachinePaymentEvent, content loader retaining the URL facade, pricing, MPP and
          x402 adapters. It awaits x402 config validation, includes that adapter only when ready,
          then publishes MachinePaymentsService with settings/labs facades and a Stripe-status
          callback. Creation occurs even when machine payments is disabled. ContentLoader and
          the store lazily retain Post/Settings models. No other production deep construction was
          found; tests construct these classes directly with fake providers and, separately, real
          database models, so they do not establish the wrapper's composition or readiness.
        sources:
          - core/server/services/machine-payments/index.js
          - core/server/services/machine-payments/content-loader.ts
          - core/server/services/machine-payments/stripe/deposit-address-store.ts
          - core/server/services/machine-payments/events/machine-payment-event-repository.ts
        tests:
          - test/integration/services/machine-payments/content-loader.test.js
          - test/integration/services/machine-payments/orchestration.test.js
      consumers:
        summary: >-
          Boot initializes the root; each site app retains it in machinePaymentsService. The
          entry markdown controller obtains that root from the app, checks isPurchasable and
          supplies render callbacks to challengeOrFulfill only on explicit .md paid/tier requests.
          It copies Fetch status/headers/body to Express; already-authorized members never receive
          their full body as an unpaid preview. HTML ghost_head uses shared eligibility directly,
          not the initialized root, for markdown alternate links. LLMS discovery uses its own
          public-preview path, not this service. Frontend HTTP tests cover delegation, rendered
          markdown/header copying, previews and HTML credential isolation but stub fulfillment;
          controller units cover the authorized-member refusal with a fake root.
        sources:
          - core/boot.js
          - core/frontend/web/site.js
          - core/frontend/services/routing/controllers/entry/markdown.ts
          - core/frontend/services/routing/controllers/entry.ts
          - core/frontend/helpers/ghost_head.js
          - core/shared/machine-payments.ts
          - core/frontend/services/llms/service.js
        tests:
          - test/e2e-frontend/machine-payments-markdown.test.js
          - test/unit/frontend/services/routing/controllers/entry.test.ts
          - test/e2e-frontend/llms-routes.test.js
      startup:
        summary: >-
          Boot awaits init in its service group after Stripe initialization. x402 init validates
          and captures config without loading its runtime. Root service publication precedes
          enabled-only prewarming of both configured network addresses, even if x402 was excluded;
          Promise.allSettled waits for both and logs rejections before opening availability gates.
          Disabled boot still constructs the graph, then request-time enablement can use it without
          prewarming. MPP loads mppx on request; x402 loads its runtime on first dispatch, which can
          be challenge or fulfill. Frontend HTTP setup boots Ghost, but tests do not isolate
          concurrent root init, prewarm completion/failure, partial publication or request-init races.
        sources:
          - core/boot.js
          - core/server/services/machine-payments/index.js
          - core/server/services/machine-payments/adapters/mpp-adapter.ts
          - core/server/services/machine-payments/adapters/x402-adapter.ts
        tests:
          - test/unit/server/services/machine-payments/adapters.test.js
          - test/e2e-frontend/machine-payments-markdown.test.js
      lifetime:
        summary: >-
          Concurrent root init calls share one stored promise; success retains one graph and later
          init resolves it, while a rejected promise prevents retry. No reset/stop/dispose exists.
          The store retains addresses by network and deduplicates only same-instance in-flight
          creation. Store/recorder clients refresh on secret-key change when needed; MPP builds
          a Stripe client each run but its retained Mppx cache key omits that client's credentials.
          MPP keeps one replay store across runtime rebuilds. x402 attempts configuration once,
          retains runtime/facilitator/scheme and bounds route apps at 128; its cache key includes
          route, recipient, price, network and challenge/fulfill mode, not description/mimeType.
          Tests assert same-network deduplication, Mppx reuse, lazy x402 loading and LRU eviction
          with fake runtimes, not root restart, rotation, cross-process races or cleanup.
        sources:
          - core/server/services/machine-payments/index.js
          - core/server/services/machine-payments/adapters/mpp-adapter.ts
          - core/server/services/machine-payments/adapters/x402-adapter.ts
          - core/server/services/machine-payments/stripe/deposit-address-store.ts
          - core/server/services/machine-payments/stripe/payment-recorder.ts
        tests:
          - test/unit/server/services/machine-payments/adapters.test.js
          - test/unit/server/services/machine-payments/deposit-address-store.test.ts
      configuration:
        summary: >-
          Eligibility reads labs, machine_payments_enabled === true, llms_enabled !== false and
          Stripe connectivity each call. Pricing reads current settings, validates positive safe
          integer minor units, and uses configured currency, first active paid tier currency, then
          USD; default amount is 100. SPT uses configured fiat; Tempo maps the same minor-unit
          amount to USDC without FX, while x402 accepts USD only. MPP reads current profile/secret
          settings and config getters
          per run; x402 captures a feature-local parsed config once, defaults to enabled Base
          mainnet/base/HTTPS facilitator, and rejects unsupported networks and the known mainnet
          pairing with the x402.org testnet facilitator.
          Stripe preview clients read endpoint overrides on construction. Config's validated tree
          is immutable; test stubs/set/reset do not imply production reload. Deposit addresses
          persist as a network map with legacy strings treated as Tempo-only. Deep tests cover
          selected gates, configured pricing, adapter config and endpoint options; Admin HTTP
          tests reject amount 0 and two-letter currency, not every default/setting transition.
        sources:
          - core/shared/machine-payments.ts
          - core/shared/config/SCHEMA.md
          - core/shared/config/defaults.json
          - core/server/services/machine-payments/pricing.ts
          - core/server/services/machine-payments/service.ts
          - core/server/services/machine-payments/adapters/mpp-adapter.ts
          - core/server/services/machine-payments/adapters/x402-adapter.ts
          - core/server/services/machine-payments/stripe/stripe-client-options.ts
          - core/server/services/machine-payments/stripe/deposit-address-store.ts
          - core/server/models/settings.js
          - core/server/data/schema/default-settings/default-settings.json
          - core/server/api/endpoints/utils/serializers/input/settings.js
        tests:
          - test/unit/server/services/machine-payments/service.test.js
          - test/unit/server/services/machine-payments/eligibility.test.ts
          - test/unit/server/services/machine-payments/adapters.test.js
          - test/unit/server/services/machine-payments/stripe-client-options.test.js
          - test/unit/server/services/machine-payments/deposit-address-store.test.ts
          - test/integration/services/machine-payments/content-loader.test.js
          - test/integration/services/machine-payments/orchestration.test.js
          - test/e2e-api/admin/settings.test.js
      resources:
        summary: >-
          The graph borrows database models, settings/labs and URL facades; owns address/in-flight
          maps, provider clients, MPP replay memory and x402 route apps. Requests can mint/persist
          addresses, call payment providers, load full published content, persist events and record
          crypto PaymentIntents; no member session or tier is granted. Installed Stripe uses
          shared keep-alive agents and default request timeouts; x402's per-app middleware starts
          facilitator discovery, with SDK fetch deadlines/retry timers; MPP's in-memory replay
          map has no expiry/size bound and Tempo uses RPC clients. Ghost supplies no cancellation,
          drain or cleanup registration for these resources. Event rows are append-only through
          the model, unique by protocol/reference, cascade with posts and enter optional backups.
          Real-DB tests prove sequential duplicate reuse and different-protocol separation, not
          concurrent unique-conflict recovery, SDK resources, restart replay or shutdown.
        sources:
          - core/server/services/machine-payments/index.js
          - core/server/services/machine-payments/content-loader.ts
          - core/server/services/machine-payments/adapters/mpp-adapter.ts
          - core/server/services/machine-payments/adapters/x402-adapter.ts
          - core/server/services/machine-payments/stripe/deposit-address-store.ts
          - core/server/services/machine-payments/stripe/payment-recorder.ts
          - core/server/services/machine-payments/events/machine-payment-event-repository.ts
          - core/server/models/machine-payment-event.js
          - core/server/data/schema/schema.js
          - core/server/data/exporter/table-lists.js
          - core/boot.js
        tests:
          - test/unit/server/services/machine-payments/deposit-address-store.test.ts
          - test/unit/server/services/machine-payments/adapters.test.js
          - test/integration/services/machine-payments/content-loader.test.js
          - test/integration/services/machine-payments/orchestration.test.js
      failures:
        summary: >-
          Raw eligibility and full-content deliverability precede settlement; full load precedes
          fulfill despite older comments saying otherwise. First matching adapter handles credentials.
          Fulfill errors become 403 for statusCode 403 or logged 503 otherwise. Ledger save follows
          settlement: failure logs/returns 503; duplicate returns 403 before recorder/rendering.
          Recording errors log and still serve content; ledger rows are not updated with later
          recorder ids. Challenges run allSettled and use any returned response, else 503; x402
          logs/returns null on challenge failure, and MPP can retain SPT after address failure.
          Pricing, raw/full content lookup, canHandle and render exceptions propagate. No rollback
          joins provider settlement, database ledger and response delivery. Source also caches a
          new address before persistence and marks x402 runtime loaded before constructing its
          facilitator/scheme. Store/recorder update their key marker before constructing a replacement
          Stripe client; a factory throw can leave the old client associated with the new marker.
          These are untested source-only failure edges. Tests assert null-content rejection, replay
          refusal, invocation order,
          unavailable challenge and selected adapter failures, not these partial-failure channels.
        sources:
          - core/server/services/machine-payments/service.ts
          - core/server/services/machine-payments/content-loader.ts
          - core/server/services/machine-payments/adapters/mpp-adapter.ts
          - core/server/services/machine-payments/adapters/x402-adapter.ts
          - core/server/services/machine-payments/stripe/deposit-address-store.ts
          - core/server/services/machine-payments/events/machine-payment-event-repository.ts
        tests:
          - test/unit/server/services/machine-payments/service.test.js
          - test/unit/server/services/machine-payments/adapters.test.js
          - test/unit/server/services/machine-payments/content-loader.test.js
          - test/integration/services/machine-payments/orchestration.test.js
    unverified: []
    blockers:
      - Pin root export/receiver behavior, concurrent boot/request init, prewarm gating, disabled boot then enablement, partial publication and retained rejection before changing initialization.
      - Resolve and test MPP retaining an old Stripe client when only active credentials change; characterize failed store/recorder client replacement, address reuse across account changes and captured x402 config versus live settings.
      - Resolve and test address caching before failed persistence, two-network or multi-instance persistence races, provider failure retry and x402 partial runtime construction.
      - Enforce awaited load/settle/ledger/record sequencing with deferred failures; current callOrder assertions prove invocation order, not completion barriers. Cover charged-but-no-content, ledger failure, recorder continuation, render failure and durable replay across restart/concurrent requests.
      - Define ownership and bounds for MPP replay memory, cached apps, SDK requests/retry timers and shared agents, including cancellation/drain on shutdown and graph replacement.
      - Add a coherent real-root HTTP/provider-fake/real-database contract for paid posts and pages, mixed tiers, signed-in previews, pricing/default currency, both-credential precedence and provider failures; existing HTTP tests stub fulfillment and deep orchestration tests stub persistence/providers.
  media-inliner:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - media-inliner/index.js
    notes: >-
      Preserve the boot-owned inliner, retained job handlers and per-import media consumers.
      Root replacement and shared transport/storage ownership need contracts before lifecycle
      migration; successful job completion does not mean every resource was inlined.
    contracts:
      exports:
        summary: >-
          The CommonJS index re-exports a stable object with receiver-independent async init
          and synchronous getInstance. getInstance throws IncorrectUsageError until publication;
          there is no shutdown/reset. The deep module exports ExternalMediaInliner, including
          receiver-dependent importUrl and inline plus processing helpers and static findMatches.
          importUrl resolves stored/failed result objects; inline resolves undefined. Unit tests
          pin injected importUrl stages and helpers, not root export shape or pre-init access.
        sources:
          - core/server/services/media-inliner/index.js
          - core/server/services/media-inliner/service.js
          - core/server/services/media-inliner/external-media-inliner.js
          - core/server/services/media-inliner/types.ts
        tests:
          - test/unit/server/services/media-inliner/test/external-media-inliner.test.js
      construction:
        summary: >-
          Importing the root creates no inliner. Every init loads the class/models, obtains
          media/image/file adapters and creates a new inliner with retained models and a storage
          callback. The async function has no await, so assignment occurs before its fulfilled
          promise is returned. Construction only stores references, but importing its request
          dependency creates shared HTTP/HTTPS agents. Root tests stub adapter lookup and exercise
          the resulting selector; they do not assert publication timing or instance identity.
        sources:
          - core/server/services/media-inliner/service.js
          - core/server/services/media-inliner/external-media-inliner.js
          - core/server/lib/request-external.js
        tests:
          - test/unit/server/services/media-inliner/service.test.ts
      consumers:
        summary: >-
          Boot passes the current instance to a retained external-media job handler. Admin
          db.inlineMedia dispatches explicit/default domains and returns after enqueue, not
          completion. Content import instead reads getInstance when creating each run's
          PostMediaInliner, which retains that instance and caches URL promises across its rows.
          Handler/endpoint units use stubs; a real job integration proves a stored feature-image
          URL and completion log. CSV HTTP tests cover real referenced-media composition,
          reuse, skipped local URLs and unsupported-row isolation, with network interception.
        sources:
          - core/boot.js
          - core/server/services/jobs-service/register-job-handlers.ts
          - core/server/services/jobs-service/jobs-service.ts
          - core/server/api/endpoints/db.js
          - core/server/services/content-import/index.ts
          - core/server/services/content-import/import/importer.ts
          - core/server/services/content-import/import/media.ts
        tests:
          - test/unit/server/services/jobs-service/register-job-handlers.test.ts
          - test/unit/api/endpoints/db.test.js
          - test/integration/services/media-inliner/external-media-inliner-job.test.ts
          - test/e2e-api/admin/posts-importer.test.js
          - test/unit/server/services/content-import/import/media.test.ts
      startup:
        summary: >-
          Required boot initialization awaits media init in the service Promise.all before
          retrieving the instance, registering job handlers and starting job delivery. Rejection
          prevents those later steps but does not undo other services' concurrent initialization.
          Direct getInstance has only a publication guard; the class accepts incomplete injected
          dependencies. Successful boot/job/CSV tests do not pin deferred or rejected media init,
          adapter-construction failure or cleanup after partial startup.
        sources:
          - core/boot.js
          - core/server/services/media-inliner/service.js
          - core/server/services/media-inliner/external-media-inliner.js
          - core/server/services/jobs-service/register-job-handlers.ts
        tests:
          - test/integration/services/media-inliner/external-media-inliner-job.test.ts
          - test/e2e-api/admin/posts-importer.test.js
      lifetime:
        summary: >-
          Each successful init replaces the root instance, without disposing the previous one.
          A failed init before assignment leaves any old instance available. Previously registered
          handlers and running imports retain old instances; future getInstance calls return the
          replacement. The inliner has no shared URL cache or concurrency guard; inline downloads
          duplicate occurrences independently. Content import owns a separate cache per run.
          Deep module caches retain the file-type function and reusable VM context; match input
          references are cleared in finally. No root replacement/restart assertions were found.
        sources:
          - core/server/services/media-inliner/service.js
          - core/server/services/media-inliner/external-media-inliner.js
          - core/server/services/jobs-service/register-job-handlers.ts
          - core/server/services/content-import/index.ts
          - core/server/services/content-import/import/media.ts
        tests: []
      configuration:
        summary: >-
          Storage adapter identities are captured at init; allowed upload extensions are read
          through config.get per selection. Images take precedence and need allowed contents,
          with SVG sanitization before selection; media/files use extension membership. Network
          agent options are captured when request-external loads, while its environment/site-URL
          guards read the accessor per request. These are immutable-config access/capture rules,
          not production hot reload. Root units cover storage choices; class units cover SVG,
          conversions, URL formatting, CDN paths and regex matching. Body patterns are regexes
          with bounded VM execution; simple fields use literal startsWith(domain).
        sources:
          - core/server/services/media-inliner/service.js
          - core/server/services/media-inliner/external-media-inliner.js
          - core/server/lib/image/image-content.ts
          - core/server/lib/image/svg-sanitizer.ts
          - core/server/lib/request-external.js
          - core/shared/config/validated.ts
        tests:
          - test/unit/server/services/media-inliner/service.test.ts
          - test/unit/server/services/media-inliner/test/external-media-inliner.test.js
      resources:
        summary: >-
          The inliner borrows models, storage and shared request agents. It buffers each download,
          may load the HEIC codec and writes files before updating models, without a transaction
          or rollback linking those effects. It owns no timer/listener, pending-request registry
          or cancellation/drain hook. Jobs owns queued work and delegates shutdown to its backend;
          no media-specific abort is passed to downloads. Request defaults include redirects and
          a 10-second timeout; test mode changes timeout/retries. Existing intercepted requests,
          fake storage units and real stored-URL integration do not exercise pending shutdown,
          production retry policy, socket disposal or orphan-file cleanup.
        sources:
          - core/server/services/media-inliner/external-media-inliner.js
          - core/server/services/media-inliner/service.js
          - core/server/lib/request-external.js
          - core/server/services/jobs-service/jobs-service.ts
          - core/boot.js
        tests:
          - test/integration/services/media-inliner/external-media-inliner-job.test.ts
          - test/unit/server/services/media-inliner/test/external-media-inliner.test.js
      failures:
        summary: >-
          Download errors normally log and become null; importUrl maps download, extraction and
          storage exceptions into typed failures. Selector/content-check errors and invalid SVGs
          return null and therefore become unsupported. HEIC conversion errors log and retain the
          original body/type; missing codec loading escapes as extraction failure. Legacy inlining
          rethrows result.error, including falsy values, to per-resource catches that log and
          continue. Query-list failures escape inline; previous writes remain. Regex timeouts skip
          that pattern for later post bodies, while other patterns continue. Units pin injected
          importUrl stage mappings, selector/SVG rejection, selected error logs and timeout
          skipping; HEIC failure/absent-codec paths remain source-only. Handler units pin
          rejection forwarding. CSV tests prove row isolation for unsupported files and no post
          after an injected unexpected throw, not rollback of already-stored remote media or every
          error stage.
        sources:
          - core/server/services/media-inliner/external-media-inliner.js
          - core/server/services/media-inliner/service.js
          - core/server/services/jobs-service/register-job-handlers.ts
          - core/server/services/content-import/import/media.ts
          - core/server/services/content-import/import/importer.ts
        tests:
          - test/unit/server/services/media-inliner/test/external-media-inliner.test.js
          - test/unit/server/services/jobs-service/register-job-handlers.test.ts
          - test/e2e-api/admin/posts-importer.test.js
    unverified: []
    blockers:
      - >-
        Pin pre-init access, synchronous publication, repeated init, failed replacement and
        retained handlers/imports. Awaited boot wiring is source evidence; add pending/rejected
        init contracts before changing construction or introducing an idempotency guard.
      - >-
        Characterize configuration replacement separately from adapter capture, including pending
        validation/downloads. Preserve regex body matching versus literal field matching and
        per-import caching; these belong to different consumers, not one root-wide cache.
      - >-
        Test query failures, stored-file/model-write partial failure and overlapping jobs/imports.
        Existing completion/URL assertions do not establish atomic writes, cleanup, exactly-once
        downloads or that every resource succeeded. Keep per-resource best-effort behavior explicit.
      - >-
        Establish shared request/storage ownership and pending-work shutdown before adding disposal.
        Production timeout/retry/redirect behavior differs from the test harness; cancellation
        and orphan cleanup cannot be inferred from a bounded request or successful queue drain.
  member-attribution:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - member-attribution/index.js
    notes: >-
      Preserve the three exposed collaborators, retained consumers and different configuration
      timing. Attribution computes and reads data; its consumers own event persistence, mail,
      subscriptions and HTTP handling.
    contracts:
      exports:
        summary: >-
          CommonJS exports one wrapper with receiver-dependent synchronous init returning
          undefined. First init exposes attributionBuilder, outboundLinkTagger and service.
          Deep modules export constructible service/builder/translator/tagger/history classes;
          Attribution itself is produced by builder.build/getAttribution. Service methods mix
          synchronous URL/event mapping with async history/context/resource queries. Returned
          Attribution objects expose fields, getResource and async fetchResource. Tagging returns
          copied URLs or async HTML. There is no readiness getter, reset or shutdown. Deep-class
          tests cover behavior, not the root export shape or receiver requirements.
        sources:
          - core/server/services/member-attribution/index.js
          - core/server/services/member-attribution/member-attribution-service.js
          - core/server/services/member-attribution/attribution-builder.js
          - core/server/services/member-attribution/outbound-link-tagger.js
          - core/server/services/member-attribution/url-history.js
        tests:
          - test/unit/server/services/member-attribution/service.test.ts
          - test/unit/server/services/member-attribution/attribution.test.ts
          - test/unit/server/services/member-attribution/outbound-link-tagger.test.ts
      construction:
        summary: >-
          Import retains shared URL service/utilities, settings and config. Boot is the only
          production init caller found. init creates URL and referrer translators, builder,
          tagger and service with borrowed model classes and callbacks. ReferrerTranslator
          constructs its own parser with site/admin URLs. Constructors perform no database
          query or subscription. Builder and tagger are published before service; a constructor
          failure can leave partial properties, but the service guard is assigned last so retry
          attempts reconstruction. No root constructor-failure or retry test was found.
        sources:
          - core/server/services/member-attribution/index.js
          - core/server/services/member-attribution/url-translator.js
          - core/server/services/member-attribution/referrer-translator.js
          - core/server/services/member-attribution/attribution-builder.js
          - core/server/services/member-attribution/outbound-link-tagger.js
          - core/server/services/member-attribution/member-attribution-service.js
          - core/boot.js
        tests: []
      consumers:
        summary: >-
          Members API construction retains service in its router controller, BREAD service and
          event repository: signup tokens/checkout metadata use history attribution, Admin adds
          use context attribution, member reads enrich creation/subscription events, and activity
          feeds map loaded event relations. Staff retains service for notification attribution;
          EmailRenderer retains service and tagger for links. Content API post/page HTML mapping
          retains the wrapper and reads outboundLinkTagger per call. HTTP tests pin token data,
          checkout metadata, member read/feed attribution and subscription persistence; staff
          and renderer units use injected fakes. Browser history capture is a separate producer,
          not another server constructor.
        sources:
          - core/server/services/members/api.js
          - core/server/services/members/members-api/members-api.js
          - core/server/services/members/members-api/controllers/router-controller.js
          - core/server/services/members/members-api/services/member-bread-service.js
          - core/server/services/members/members-api/repositories/event-repository.js
          - core/server/services/staff/index.js
          - core/server/services/staff/staff-service.js
          - core/server/services/email-service/email-service-wrapper.js
          - core/server/services/email-service/email-renderer.js
          - core/server/api/endpoints/utils/serializers/output/mappers/posts.js
          - core/frontend/src/member-attribution/member-attribution.js
        tests:
          - test/e2e-api/members/send-magic-link.test.js
          - test/e2e-api/members/create-stripe-checkout-session.test.js
          - test/e2e-api/admin/members.test.js
          - test/e2e-api/members/webhooks.test.js
          - test/unit/server/services/staff/staff-service.test.js
          - test/unit/server/services/email-service/email-renderer.test.js
      startup:
        summary: >-
          Boot loads core models/settings and routing before the service group, and evaluates
          synchronous memberAttribution.init before staff, members and email init in its
          Promise.all argument list. Those consumers capture collaborators during construction;
          making attribution initialization asynchronous would require explicit dependency
          sequencing. Full-app readiness follows the group. There is no pre-init access guard;
          methods/properties are missing until publication. Booted service/HTTP tests exercise
          real composition but do not assert order, pre-init behavior or partial startup cleanup.
        sources:
          - core/boot.js
          - core/server/services/member-attribution/index.js
          - core/server/services/staff/index.js
          - core/server/services/members/api.js
          - core/server/services/email-service/email-service-wrapper.js
        tests:
          - test/e2e-server/services/member-attribution.test.js
          - test/e2e-api/members/send-magic-link.test.js
      lifetime:
        summary: >-
          A truthy service keeps the whole graph across repeat init and same-process boots.
          Replacing wrapper properties does not retarget retained consumers or Attribution
          objects, which retain their URL translator. There is no root history/result cache;
          histories and attributions are created per operation. Event reads query current rows
          ordered created_at then id descending and fetch current resources; missing resources
          degrade to saved URL/null attribution. Booted tests pin deleted resources and current
          post/page/tag/author URLs. Unit event mocks ignore query callbacks, so they do not pin
          the deterministic ordering or concurrent event-write/read behavior.
        sources:
          - core/server/services/member-attribution/index.js
          - core/server/services/member-attribution/member-attribution-service.js
          - core/server/services/member-attribution/attribution-builder.js
          - core/server/services/member-attribution/url-history.js
          - core/server/services/member-attribution/url-translator.js
        tests:
          - test/e2e-server/services/member-attribution.test.js
          - test/unit/server/services/member-attribution/service.test.ts
      configuration:
        summary: >-
          ReferrerParser captures site/admin URLs at init; source-tracking and outbound-tagging
          settings plus tagger site URL are callbacks read during use. Shared URL utilities are
          retained separately and configured frozen; accessor reads do not establish production
          hot reload. Disabling source tracking substitutes empty history/context attribution,
          but does not gate persisted-event reads or addPostAttributionTracking. History rejects
          the whole malformed array, excludes entries at least 24 hours old and iterates reverse
          input order without sorting. Builder prefers latest post, then other identified content,
          then URL; referrer selection uses the latest match and earliest UTM-bearing entry.
          Units pin algorithms, URL/tagging rules and fixed callbacks; booted subdirectory tests
          use test config replacement, not same-instance capture/reload contracts.
        sources:
          - core/server/services/member-attribution/index.js
          - core/server/services/member-attribution/member-attribution-service.js
          - core/server/services/member-attribution/referrer-translator.js
          - core/server/services/member-attribution/url-history.js
          - core/server/services/member-attribution/attribution-builder.js
          - core/server/services/member-attribution/outbound-link-tagger.js
          - core/shared/url-utils.ts
        tests:
          - test/unit/server/services/member-attribution/history.test.ts
          - test/unit/server/services/member-attribution/attribution.test.ts
          - test/unit/server/services/member-attribution/referrer-translator.test.ts
          - test/unit/server/services/member-attribution/outbound-link-tagger.test.ts
          - test/e2e-server/services/member-attribution.test.js
      resources:
        summary: >-
          The graph owns parser/translator objects and callback references, with no timers,
          event subscriptions, network client, pending-query registry or cleanup hook. URL/model
          reads borrow shared services/database and accept no caller transaction options. Members'
          repository owns creation-event writes, length fitting and transaction propagation;
          Staff owns notification subscriptions, and email/checkout callers own external effects.
          A real transaction test reads member attribution before commit and another pins long
          UTM truncation; neither proves rollback. History objects carry UTM fields, but this
          service's three event-reading methods rebuild only attribution/referrer fields, omitting
          stored UTM. Tests for UTM persistence do not prove its return on those reader surfaces.
        sources:
          - core/server/services/member-attribution/index.js
          - core/server/services/member-attribution/member-attribution-service.js
          - core/server/services/member-attribution/referrer-translator.js
          - core/server/services/member-attribution/url-translator.js
          - core/server/services/member-attribution/attribution-builder.js
          - core/server/lib/link-replacer.js
          - core/server/services/members/members-api/repositories/member-repository.js
          - core/server/services/staff/staff-service.js
        tests:
          - test/e2e-api/admin/members.test.js
          - test/e2e-api/members/webhooks.test.js
      failures:
        summary: >-
          Root init throws synchronously without rollback. Invalid history normally becomes
          empty; path-resolution rejection degrades to URL attribution, while explicit resource
          lookup, event queries, callbacks and parser failures otherwise propagate. Integration
          lookup exceptions are swallowed; a null integration instead yields Integration: undefined.
          LinkReplacer catches tokenization/replacement errors and returns unchanged HTML, whereas
          direct URL tagging can throw and its initial enabled check lies outside that catch.
          Staff catches failures in fallback event reads and still sends, but provided-attribution
          enrichment failure reaches the subscriber catch and skips that notification. Units pin
          missing-resource fallbacks and HTML preservation; most injected fault/consumer boundaries
          and root retry behavior remain untested.
        sources:
          - core/server/services/member-attribution/index.js
          - core/server/services/member-attribution/member-attribution-service.js
          - core/server/services/member-attribution/url-translator.js
          - core/server/services/member-attribution/outbound-link-tagger.js
          - core/server/services/member-attribution/attribution-builder.js
          - core/server/lib/link-replacer.js
          - core/server/services/staff/staff-service.js
        tests:
          - test/unit/server/services/member-attribution/attribution.test.ts
          - test/unit/server/services/member-attribution/url-translator.test.ts
          - test/unit/server/services/member-attribution/outbound-link-tagger.test.ts
    unverified: []
    blockers:
      - >-
        Pin root exports, synchronous startup dependency order, pre-init use, repeated init,
        partial constructor failures and retained references. Existing booted tests establish
        successful use, not restart/replacement or cleanup semantics.
      - >-
        Test setting changes and captured URLs on the same graph using valid history and nonempty
        context. Current disabled-context unit short-circuits on absent context; history-gating
        cases already supply invalid histories. Test callback/parser/model faults and distinguish
        URL-resolution fallback, integration lookup suppression and consumer error handling.
      - >-
        Pin latest-event ordering with actual competing rows, relation-selection arguments,
        transaction visibility and pending-query ownership. Existing query mocks skip the ordering
        callback, and the first-relation fake ignores the selected model. Keep caller persistence
        and event subscriptions outside the attribution lifecycle; do not infer rollback or drain.
      - >-
        Characterize UTM reader omissions separately from history/checkout/persistence coverage,
        and verify retained Staff/email and Content API tagging through real-root consumers.
        Preserve URL encoding, blocked-domain/internal-link rules and degradation boundaries;
        no setting reload or expanded output contract is implied by this migration.
  member-welcome-emails:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - member-welcome-emails/index.js
      - member-welcome-emails/service.js
    notes: >-
      Preserve the nested singleton, caller initialization, locale listener and separate
      welcome-content and sender caches while establishing boot ownership. General automation
      sends currently share this implementation; its source TODO leaves their eventual owner open.
    contracts:
      exports:
        summary: >-
          The CommonJS barrel exports service (the wrapper singleton) and constants; it has
          no own init. Deep service.js exports the same receiver-dependent synchronous init
          wrapper, with api and i18n created on first use. The private implementation exposes
          async load/send, automation send, active check, preview/test-send and shared-sender
          edit/verification methods. Welcome/test sends resolve undefined; automation send
          returns the bulk transport result; previews return html/plaintext/subject and sender
          edits return models/meta. The renderer is a separate exported class. Integration
          tests assert automation result identity and HTTP preview/204/verification responses,
          not the barrel shape, receiver contract or every method's return value.
        sources:
          - core/server/services/member-welcome-emails/index.js
          - core/server/services/member-welcome-emails/service.js
          - core/server/services/member-welcome-emails/constants.ts
          - core/server/services/member-welcome-emails/member-welcome-email-renderer.js
        tests:
          - test/integration/services/member-welcome-emails.test.js
          - test/e2e-api/admin/automated-emails.test.ts
          - test/e2e-api/admin/automations.test.js
      construction:
        summary: >-
          First init creates ghost-namespace i18n, subscribes to settings.locale.edited,
          constructs a model-backed SingleUseTokenProvider, then constructs the private
          implementation. That initializes email-address and constructs GhostMailer,
          MailgunClient, renderer and MagicLink. The renderer creates isolated Handlebars,
          registers shared email helpers, synchronously reads partials/wrapper and compiles
          the template. These implementation/renderer production constructors are reached
          only here; tests construct the renderer directly. Lexical rendering additionally
          initializes a shared renderer and retains a separate PostsService graph through
          its deep factory. No root construction-count or partial-failure test was found.
        sources:
          - core/server/services/member-welcome-emails/service.js
          - core/server/services/member-welcome-emails/member-welcome-email-renderer.js
          - core/server/services/members/single-use-token-provider.js
          - core/server/lib/mail/ghost-mailer.js
          - core/server/lib/mailgun/mailgun-client.js
          - core/server/lib/magic-link/magic-link.js
          - core/server/lib/lexical.js
          - core/server/services/posts/posts-service-instance.js
        tests: []
      consumers:
        summary: >-
          Automated-email and automation-preview endpoints retain the deep wrapper and read
          api after init for previews, tests and sender changes. AutomationsService injects
          that wrapper into both pollers; Stripe's paid-welcome callback resolves its api
          when deciding whether a signup email is needed. Models, member enrollment,
          automation repositories/seeders and analytics deep-import constants only. No
          production caller of the barrel or direct private implementation construction was
          found. HTTP tests use real root methods for selected previews, test sends and
          shared sender persistence; mail is stubbed. Poll and Stripe tests instead inject
          fake welcome services/callbacks, proving selected forwarding and gating only.
        sources:
          - core/server/api/endpoints/automated-emails.js
          - core/server/api/endpoints/automation-email-previews.js
          - core/server/api/endpoints/automated-email-design.js
          - core/server/services/automations/service.ts
          - core/server/services/automations/poll.ts
          - core/server/services/automations/welcome-email-automation-poll.ts
          - core/server/services/stripe/stripe-service.js
          - core/server/services/stripe/services/webhook/checkout-session-event-service.js
          - core/server/services/email-analytics/index.ts
          - core/server/services/automations/database-automations-repository.ts
          - core/server/services/members/members-api/repositories/member-repository.js
          - core/server/models/automation.js
          - core/server/models/welcome-email-automated-email.js
          - core/server/data/seeders/importers/automation-action-revisions-importer.ts
          - core/server/data/seeders/importers/automations-importer.ts
        tests:
          - test/e2e-api/admin/automated-emails.test.ts
          - test/e2e-api/admin/automations.test.js
          - test/integration/services/automations/welcome-email-automation-poll.test.ts
          - test/unit/server/services/automations/poll.test.ts
          - test/unit/server/services/stripe/services/webhooks/checkout-session-event-service.test.js
      startup:
        summary: >-
          Boot has no direct welcome init. It initializes AutomationsService, which dispatches
          a poll after yielding the event loop; nonempty legacy batches or eligible new sends
          reach welcome init.
          Requests and Stripe checks can initialize it independently. Settings, models and
          mail configuration must already be usable. Legacy polling claims runs before init
          and loadMemberWelcomeEmails; new polling initializes immediately before each
          eligible send without loading legacy content. Direct welcome send before loading
          finds empty slots, whereas active checks and previews query models independently.
          Fake-wrapper poll tests assert no init/load for empty batches and init/load for
          populated batches; they do not enforce real boot readiness or dependency ordering.
        sources:
          - core/boot.js
          - core/server/services/automations/service.ts
