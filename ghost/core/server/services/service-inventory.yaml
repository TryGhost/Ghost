          Boot initializes api after database/settings setup and before awaited themes.init,
          including backend-only boots. Theme activation populates both caches; init alone
          leaves listSettings empty and the shared cache unchanged. Pre-init api use has no
          guard. Boot theme loading catches/logs activation failure and continues, so readiness
