          - test/e2e-api/admin/email-previews.test.js
          - test/e2e-api/admin/emails.test.js
          - test/e2e-api/admin/email-retry.test.ts
          - test/integration/services/email-service/batch-sending.test.js
          - test/unit/server/services/jobs-service/register-job-handlers.test.ts
      startup:
        summary: >-
          Boot initializes email-address first, invokes members/attribution/feedback before
          email-service in the required-service array, then registers handlers and starts jobs
          after that group settles. This relies on sibling publication timing; the array does
          not await each initializer before invoking the next. Background recovery runs after
          readiness, is skipped for test-prefixed environments and catches/logs its failure
          before continuing. scheduleEmail awaits dispatch, not completion of a send; emailJob
          refetches and transactionally claims pending/failed email status. VM boot tests hold
          email init and assert dependent jobs remain stopped, propagate its exact failure,
          cover the test-environment skip and hold recovery before later background work.
          Real-boot HTTP tests assert jobs readiness and a usable server while controlled
          recovery remains pending, then continuation after release. They do not exercise real
          recovery work or prove the sibling publication assumptions. Job units assert dispatch
          payload and rejection; integration manually invokes recovery on a booted root
          and asserts pending batches submit, submitted batches skip, and orphan batches fail
          the parent without another provider call.
        sources:
          - core/boot.js
          - core/server/services/email-service/email-service-wrapper.js
          - core/server/services/email-service/batch-sending-service.js
          - core/server/services/email-service/email-service.js
          - core/server/services/jobs-service/register-job-handlers.ts
        tests:
