          - core/server/api/endpoints/invites.js
          - core/server/api/endpoints/utils/validators/input/invites.js
          - core/server/models/invite.js
        tests:
          - test/e2e-api/admin/invites.test.js
          - test/e2e-api/admin/host-limits.test.ts
          - test/unit/server/models/invite.test.js
      startup:
        summary: >-
          The instance is available at import with no explicit boot initialization. Calls
          need the database, settings and API pipelines ready; mail sending also needs the
          email-address service. The API mail handler lazily constructs its own shared mailer
          on first send. Real HTTP tests run after Ghost boot and replace send entirely, so
          do not establish the email-address/transport boundary or direct pre-boot invocation.
        sources:
          - core/boot.js
          - core/server/services/invites/index.js
          - core/server/api/endpoints/mail.js
          - core/server/lib/mail/ghost-mailer.js
        tests:
          - test/e2e-api/admin/invites.test.js
      lifetime:
        summary: >-
          The eager instance and dependency references survive in the module cache. Each add
          keeps its invite and email data local. Resending first destroys the previous invite
          with that email, then creates a replacement; the workflow has no transaction,
          per-email concurrency guard or retry. API mail independently retains its mailer
          across calls with no reset. Existing tests reuse an email for successive role
          invitations but do not assert old-token invalidation or concurrent resend behavior.
        sources:
          - core/server/services/invites/invites.js
          - core/server/api/endpoints/mail.js
        tests:
          - test/e2e-api/admin/invites.test.js
      configuration:
        summary: >-
          add reads current title, admin URL and default email domain. Inviter name/email
          selects the staff or integration template, reply-to and subject; signup links use
          the encoded stored token. Templates are read per render. Invite creation reads
          current db_hash and assigns one-week expiry. API-mail transport configuration is
          captured when its mailer is constructed; sender policy stays live in GhostMailer.
        sources:
          - core/server/services/invites/invites.js
          - core/server/models/invite.js
          - core/server/lib/mail/email-content-generator.js
          - core/server/lib/mail/ghost-mailer.js
          - core/server/api/endpoints/mail.js
        tests: []
      resources:
        summary: >-
          The root borrows models, template filesystem work and API-mail sending. It awaits
          delete, create, render, send and the final sent-status edit sequentially. It owns
          no timers, subscriptions or cleanup hook. The nested API-mail handler owns the
          transport and can launch an unawaited warning notification on direct-mail failure;
          neither service supplies explicit transport cleanup or outstanding-send drainage.
        sources:
          - core/server/services/invites/invites.js
          - core/server/api/endpoints/mail.js
          - core/server/lib/mail/ghost-mailer.js
          - core/server/lib/mail/email-content-generator.js
          - core/server/ghost-server.ts
        tests: []
      failures:
        summary: >-
          Model, rendering and mail failures reject add. EmailError gets a resend-help suffix
          and warning log on the same error before rejection. Destruction or creation is not
          rolled back after later failure; failed mail in the normal API flow leaves the replacement pending, while
          a sent-status edit can fail after mail was delivered. An unbound add rejects inside
          the chain after persistence, when it first reads this. Malformed arguments or a
          synchronously throwing model lookup can fail before the catch. No retry or compensation exists.
        sources:
          - core/server/services/invites/invites.js
          - core/server/models/invite.js
          - core/server/api/endpoints/mail.js
        tests: []
    unverified: []
    blockers:
      - >-
        Characterize resend and partial failures with real persistence: existing invite
        deletion, replacement creation, template failure, mail rejection and post-send status
        failure. Include unbound invocation, which can mutate persistence before rejecting.
        Define concurrency/retry expectations before changing ownership.
      - >-
        Assert mail recipient, subject, reply-to, HTML/text and signup URL through the real
        consumer for staff and integration invites. Existing send stubs do not test payloads
        or provider delivery; add live settings and retained-instance contracts.
      - >-
        Resolve API-mail orchestration and transport ownership without moving business logic
        into HTTP. Preserve role/limit checks and successful behavior while introducing boot
        composition; test readiness and shutdown of pending work separately.
