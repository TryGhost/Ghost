          - test/unit/server/services/content-import/import/post-repository.test.ts
          - test/unit/server/services/content-import/import/staged-file.test.ts
      consumers:
        summary: >-
          Boot owns init. The Admin posts upload endpoint retains the root, forwards upload
          metadata/mapping and the current user's email, and returns HTTP 202 with import_id
          and total after staging, preflight and dispatch. Authentication, feature flag,
          upload validation and content-import permission belong to HTTP/API layers. Jobs
          registration awaits root handleJob for content-csv-import; the separate
          site-content-import job is outside this root. Production shutdown does not call
          its test-facing allSettled. Real booted HTTP tests assert role/flag gates, report
          mail through a mocked transport, persisted posts/relations and intercepted remote
          media. The handler unit only reaches the real root's pre-init error. Webhook tests
          include a normal-publish control, then assert two imported rows including an
          update, two completion emails, no Email rows and bounded webhook silence.
