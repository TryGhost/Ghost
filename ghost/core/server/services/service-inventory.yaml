        tests:
          - test/unit/server/models/member-feedback.test.ts
      failures:
        summary: >-
          init rejects without clearing published properties; a failure after service publication
          makes later init skip controller repair. Link building propagates serialization/URL
          failures. Redirect catches errors and passes them to next; a unit pins repository
          rejection identity and no redirect. Add rejects invalid numeric score, absent member
          context or missing post, otherwise propagating repository/ID-conversion failures;
          there is no retry or compensation. Browse swallows any permission-check failure and
          continues without member data, but propagates query failures. Units pin allowed/denied
          browse delegation. HTTP tests pin invalid-score 422, missing-post 404 and authentication
          401; the malformed/unknown UUID cases omit the key and fail before member lookup.
          Initialization, write/read failures and concurrent submissions lack direct coverage.
        sources:
