      startup:
        summary: >-
          Boot runs the scheduling adapter, awaits Stripe, then calls gifts init before members,
          tiers and staff initialization; their facades/getters defer use. It passes initialized
          delivery/service instances into analytics and job registration before starting jobs.
          A boot harness holds Stripe unresolved and asserts gifts and jobs have not started,
