          - core/shared/custom-theme-settings-cache/custom-theme-settings-bread-service.js
          - core/shared/custom-theme-settings-cache/custom-theme-settings-cache.js
        tests: []
      construction:
        summary: >-
          Import loads the model registry and shared cache and constructs an empty wrapper.
          Every init replaces api with a new implementation and BREAD repository using the
          shared CustomThemeSetting model/cache; construction performs no setting query or
          activation. No alternate runtime implementation construction was found. Unit tests
          inject a fake model and separate cache; API tests explicitly re-init and activate.
        sources:
