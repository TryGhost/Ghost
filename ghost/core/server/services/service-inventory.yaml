          - core/server/services/members/jobs/index.js
          - core/server/services/signing-keys/index.ts
          - core/server/services/update-check/index.js
          - core/server/services/tinybird-sync/tinybird-sync-service.ts
        tests:
          - test/unit/server/services/jobs-service/register-job-handlers.test.ts
          - test/unit/server/services/jobs-service/retained-consumer.test.ts
      configuration:
        summary: >-
          The wrapper looks up the jobs adapter on first init; reinit reuses the same
          service and backend. Checked-in defaults select InMemoryJobsBackend with
          concurrency 3. Registration declares separate queue limits. Boot passes
          server:shutdownTimeout to jobs shutdown when its cleanup task runs; the in-memory
          backend otherwise waits 10 seconds.
        sources:
          - core/server/services/jobs-service/index.ts
          - core/server/services/jobs-service/register-job-handlers.ts
          - core/shared/config/defaults.json
          - core/server/adapters/jobs/InMemoryJobsBackend.ts
          - core/boot.js
        tests:
          - test/unit/server/services/jobs-service/index.test.js
          - test/unit/server/services/jobs-service/register-job-handlers.test.ts
          - test/unit/server/adapters/jobs/in-memory-jobs-backend.test.ts
          - test/e2e-server/boot-readiness.isolated.test.ts
      resources:
        summary: >-
          The in-memory backend reads recurring schedules in local time and keeps the first
          registration per job type. Shutdown stops accepting work, clears recurring timers,
          drops queued work and bounds the wait for active deliveries, then discards its
          queues so a re-boot starts with empty lanes. Enqueue or schedule before start
          throws; after shutdown both are dropped. A passed deadline does not cancel active
          deliveries, and an early drain leaves its deadline timer pending. GhostServer
          drains HTTP before starting its concurrent cleanup tasks, and jobs shut down in a
          cleanup task after the HTTP drain.
        sources:
          - core/server/adapters/jobs/InMemoryJobsBackend.ts
          - core/server/services/jobs-service/jobs-service.ts
          - core/boot.js
          - core/server/ghost-server.ts
        tests:
