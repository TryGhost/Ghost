          - test/unit/server/services/content-import/import/importer.test.ts
          - test/e2e-api/admin/posts-importer.test.js
      construction:
        summary: >-
          First init constructs one private ContentCSVImporter, ImportRunStore,
          BookshelfPostsRepository with its relation resolver, and GhostMailer; successful
          later calls retain that graph. The repository retains models. Converter factories
          and the current media-inliner implementation are resolved per job, with a new
          PostMediaInliner/cache for that job. Dispatch resolves the current jobs instance;
          staging and removal each resolve the imports storage adapter. Class tests assert
          per-run converter/media construction and injected model transaction arguments;
          filesystem tests exercise the stager with LocalStorageBase. No test pins real root
          construction count, dependency retention or cleanup after acquisition failure.
        sources:
          - core/server/services/content-import/index.ts
          - core/server/services/content-import/import/importer.ts
          - core/server/services/content-import/import/post-repository.ts
          - core/server/services/content-import/import/relations.ts
