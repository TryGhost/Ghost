        tests:
          - test/unit/server/services/gifts/gift-service-interface.test.ts
          - test/unit/server/services/gifts/gift-controller.test.ts
      construction:
        summary: >-
          First init composes Gift/Delivery Bookshelf repositories over shared models/knex,
          checkout adapter, GhostMailer transport, MailgunClient, email service with its private
          Handlebars renderer, two SignedFlushSchedulers, delivery service, gift service and
          controller. Each scheduler registers itself during construction. Members/staff API
          dependencies and Stripe API resolve through getters; tiers and settings are retained
          facades. These production implementations are constructed only here, with the renderer
          constructed by the email service. Classes/codecs are test deep imports; events, job
          definitions and the analytics tag also have production deep consumers. No root
          construction-count or partial-construction rollback assertion was found.
        sources:
          - core/server/services/gifts/index.ts
          - core/server/services/gifts/gift-checkout-adapter.js
          - core/server/services/gifts/gift-email-service.ts
          - core/server/services/gifts/gift-email-renderer.ts
          - core/server/adapters/scheduling/signed-flush-scheduler.ts
          - core/server/lib/mail/ghost-mailer.js
          - core/server/lib/mailgun/mailgun-client.js
        tests: []
      consumers:
        summary: >-
          Members checkout/continuation, magic-link redemption, subscription presentation,
          member-event browsing and import reassignment resolve the root service at use time;
          Stripe completion/refund handlers likewise use getters. Members endpoints resolve
          controller and preview handlers resolve service. Job handlers retain GiftService;
          email analytics retains GiftDeliveryService for outcomes; four event handlers close
          over the original implementations. Admin signed flush endpoints dispatch deep events
          and return before work finishes. HTTP tests exercise checkout/webhook persistence,
