  tags-public:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - tags-public/index.js
    notes: >-
      Preserve the optional tags browse cache and its endpoint/invalidation identity.
      Existing cold-boot coverage does not establish restart or asynchronous adapter ownership.
    contracts:
      exports:
        summary: >-
          CommonJS index forwards one TagsPublicServiceWrapper. Before init it has no api;
          receiver-dependent async init resolves undefined and publishes a mutable api object
          containing cache, including undefined when disabled. It exposes no tag query, reset,
          stop or disposer. Units assert enabled/disabled cache identity and endpoint bindings,
          not exact module shape, method receiver or returned values.
        sources:
          - core/server/services/tags-public/index.js
          - core/server/services/tags-public/service.js
        tests:
          - test/unit/server/services/public-response-caches.test.ts
      construction:
        summary: >-
          Import constructs only the wrapper. First init requires the shared config, adapter
          manager and common event bus; a truthy tagsPublicCache flag obtains cache:tagsPublic
          and registers an anonymous reset callback before api publication. There is no await
          in init, so publication is synchronous before the returned promise settles. Manager
          identity is requested name plus selected class. No other production constructor or
          deep consumer was found. Units stub config/adapter lookup and assert the exact adapter
          name and identity, with the posts flag opposite to catch cross-wiring.
        sources:
          - core/server/services/tags-public/service.js
          - core/server/services/adapter-manager/index.ts
          - core/server/services/adapter-manager/adapter-manager.ts
        tests:
          - test/unit/server/services/public-response-caches.test.ts
      consumers:
        summary: >-
          Boot initializes the root; tags browse captures api.cache when its endpoint loads.
          The shared pipeline preserves the adapter identity and memoizes the controller wrapper.
          Tags read is uncached. Content routes and frontend get/routing-data calls reach these
          public methods through API getters; query implementation belongs to TagPublic/model
          and API serializers. Binding units assert enabled/disabled browse and uncached read.
          Isolated HTTP proves a repeated browse avoids another model call despite a raw DB
          edit, changed fields misses, and explicit site.changed refreshes. Frontend tests use
          API fakes; this cohort does not establish their real cache composition or ordinary
          Admin mutation-to-invalidation wiring.
        sources:
          - core/boot.js
          - core/server/api/endpoints/index.js
          - core/server/api/endpoints/tags-public.js
          - core/server/models/tag-public.js
          - core/server/web/api/endpoints/content/routes.js
          - core/frontend/services/proxy.js
          - core/frontend/services/routing/config.ts
          - core/frontend/services/routing/api-adapter.ts
          - core/frontend/services/data/fetch-data.js
          - core/frontend/helpers/get.js
          - core/server/web/parent/middleware/emit-events.js
        tests:
          - test/unit/server/services/public-response-caches.test.ts
          - test/e2e-server/public-response-caches.isolated.test.ts
          - test/unit/frontend/services/data/fetch-data.test.js
          - test/unit/frontend/helpers/get.test.ts
      startup:
        summary: >-
          Boot validates adapters and prepares models/config before awaiting tags init in its
          service group, before the full app mounts. Content router/API construction is lazy,
          normally loading this endpoint after initialization. The isolated HTTP suite drives
          that cold boot with MemoryCache enabled. Source-only: early endpoint import captures
          undefined for the retained descriptor/pipeline and later init cannot repair it. Init
          does not await external cache readiness or register rollback after later boot failure.
        sources:
          - core/boot.js
          - core/server/services/tags-public/service.js
          - core/server/api/endpoints/index.js
          - core/server/api/endpoints/tags-public.js
          - core/server/web/api/app.js
          - core/server/web/api/endpoints/content/app.js
          - core/shared/express.js
        tests:
          - test/e2e-server/public-response-caches.isolated.test.ts
      lifetime:
        summary: >-
          Any truthy api stops repeated init, including a disabled first initialization. The
          same module retains its adapter, entries and listener without stop/reset support.
          Clearing the manager cache does not replace root, listener or endpoint references.
          MemoryCache stores response references and swaps its backing object on reset. Units
          assert repeated enabled init preserves adapter/data with one new listener and directly
          invoke that callback; HTTP also emits on the real bus. Same-module reboot, forced
          api mutation, response-reference mutation and concurrent fill/reset remain source-only.
        sources:
          - core/server/services/tags-public/service.js
          - core/server/services/adapter-manager/adapter-manager.ts
          - core/server/adapters/cache/MemoryCache.js
          - core/server/api/endpoints/tags-public.js
          - core/server/lib/common/events.js
          - core/server/ghost-server.ts
        tests:
          - test/unit/server/services/public-response-caches.test.ts
          - test/e2e-server/public-response-caches.isolated.test.ts
      configuration:
        summary: >-
          hostSettings:tagsPublicCache:enabled is read once using truthiness; missing/falsy
          disables. Feature-specific adapter options fall back to the shared MemoryCache
          default. Production config is frozen; test overrides do not imply hot reload. Tags
          has no custom cache key: the pipeline serializes configured frame.options, including
          copied request context, with sorted object keys before validation/input normalization.
          HTTP cache coverage checks a fields variant, not every option/context. Separate query
          privacy HTTP asserts hidden filter/order/selectors are ignored and public identifiers,
          visibility, slug order and post counts remain; it does not enable this response cache.
        sources:
          - core/server/services/tags-public/service.js
          - core/server/services/adapter-manager/utils.ts
          - core/shared/config/defaults.json
          - core/shared/config/SCHEMA.md
          - core/server/api/endpoints/tags-public.js
          - core/server/api/endpoints/utils/serializers/input/tags.js
          - core/server/api/endpoints/utils/api-filter-utils.ts
        tests:
          - test/unit/server/services/public-response-caches.test.ts
          - test/e2e-server/public-response-caches.isolated.test.ts
          - test/e2e-api/content/tag-query-security.test.js
      resources:
        summary: >-
          Root owns an unremoved event callback and borrows the manager-cached adapter. Default
          MemoryCache is unbounded with no TTL, timer or I/O. Optional memory-ttl wraps TTLCache
          with unref'd expiry timers cleared on reset. Redis can share a process store/client,
          registers an error listener and tracks lookup timers, coalesced reads and background
          refreshes; timing out does not cancel lookup. Neither root nor manager drains/closes
          these resources. Adapter units assert selected memory operations and fake-store Redis
          timeout/reset/refresh results, not a real tags request with those adapters or shutdown.
        sources:
          - core/server/services/tags-public/service.js
          - core/server/services/adapter-manager/adapter-manager.ts
          - core/server/adapters/cache/MemoryCache.js
          - core/server/adapters/cache/AdapterCacheMemoryTTL.js
          - core/server/adapters/cache/memory-ttl.js
          - core/server/adapters/cache/Redis.js
          - core/server/adapters/lib/redis/AdapterCacheRedis.js
          - core/server/adapters/lib/redis/redis-store-factory.js
          - core/server/ghost-server.ts
        tests:
          - test/unit/server/adapters/cache/adapter-cache-memory-ttl.test.js
          - test/unit/server/adapters/lib/redis/adapter-cache-redis.test.js
      failures:
        summary: >-
          Source-only: dependency/adapter/listener errors reject init before api, without
          disposing acquired shared resources. Reset is called without return/await/catch;
          synchronous throws escape emit and asynchronous rejection is unobserved. Built-in
          Redis reset instead catches/logs, so failure may retain stale entries. Pipeline hits
          return before validation/serialization/permissions; misses propagate query/cache
          failure unless the adapter swallows it. Redis loader rejection can yield undefined
          and cause a second response-loader call through the pipeline. Fake-store units do
          not cover that combined path. Tag HTTP tests assert missing identifier 400 and internal
          visibility 404, without injecting root/cache failures or proving cached authorization.
        sources:
          - core/server/services/tags-public/service.js
          - core/server/api/endpoints/tags-public.js
          - core/server/adapters/lib/redis/AdapterCacheRedis.js
          - core/server/lib/common/events.js
          - core/boot.js
        tests:
          - test/unit/server/adapters/lib/redis/adapter-cache-redis.test.js
          - test/e2e-api/content/tag-query-security.test.js
    unverified: []
    blockers:
      - >-
        Protect browse binding and shared pipeline identity together while keeping read uncached.
        Extend cold-boot MemoryCache evidence to ordinary Admin invalidation and relevant frontend
        composition; early endpoint import and cached permission/context behavior remain untested.
      - >-
        Define same-process restart and rollback ownership: disabled init also sets the guard,
        manager reset leaves retained references, and listeners/cache resources have no disposer.
        Current tests manually restore global state rather than exercise production restart.
      - >-
        Cover asynchronous invalidation, in-flight fills and background refresh across reset.
        An older MemoryCache response can be stored after reset; Redis background refresh can
        publish using a newer prefix. These are source risks, not reproduced stale HTTP responses.
      - >-
        Cover adapter construction, reset, query and cache failures through the actual pipeline,
        including swallowed Redis loader errors and repeated work. Bound/drain optional adapter
        resources without closing shared clients; selected fake-store tests do not establish this.
