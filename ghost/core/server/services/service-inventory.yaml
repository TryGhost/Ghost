          - test/unit/server/services/automations/service.test.ts
          - test/e2e-api/admin/automations.test.js
          - test/integration/services/automations/database-automations-repository.test.ts
      construction:
        summary: >-
          Loading the root constructs AutomationsService and imports the separately cached API,
          which immediately constructs its repository with the shared Knex handle and parsed
          fakeWaitHoursMultiplier. It also loads shared request transport and other wrappers.
          First init constructs a SoonestTimer, two independently serialized event handlers and
          scheduler registration, launches an unawaited immediate enqueue, then publishes its
          private guard. No DB query or poll is required to finish for publication. Subscribing or
          registering can fail after earlier subscriptions exist, without rollback. API stats
          calls construct short-lived Tinybird clients; polling lazily initializes the retained
          welcome-email wrapper. Units construct the class with fake events/scheduler and check
          two subscriptions after repeated init; they do not assert root import acquisition,
          retained collaborator identity or partial-init cleanup/retry.
        sources:
          - core/server/services/automations/index.ts
          - core/server/services/automations/service.ts
          - core/server/services/automations/automations-api.ts
          - core/server/services/automations/database-automations-repository.ts
          - core/server/services/member-welcome-emails/service.js
          - core/server/lib/request-external.js
        tests:
          - test/unit/server/services/automations/service.test.ts
      consumers:
        summary: >-
          Boot retains the root and injects the API into email analytics. Admin automation,
          statistics, run/history and action-link controllers import that API directly; member
          repository and link tracking retain it for signup and transactional click recording.
          Scheduler registration retains the service. Member signup captures member/tier data:
          with an outer transaction, new automation creation runs in a detached post-commit
          callback; otherwise it is awaited. Legacy signup writes its run in the caller's
          transaction and dispatches after commit. Member-flow tests use the real member API,
          signed poll HTTP, subscriptions, DB and renderer, asserting two email payloads/counts
          while replacing scheduler/provider sends. Analytics integration asserts persisted
          delivery/open results with provider events and cursors substituted. These establish
          selected wiring, not replacement compatibility or a durable signup-to-run outbox.
        sources:
          - core/server/lib/after-commit.ts
          - core/boot.js
          - core/server/api/endpoints/automations.ts
          - core/server/api/endpoints/automation-performance-stats.ts
          - core/server/api/endpoints/automation-runs.ts
          - core/server/api/endpoints/automation-run-history.ts
          - core/server/api/endpoints/automation-action-links.ts
          - core/server/services/members/members-api/members-api.js
          - core/server/services/members/members-api/repositories/member-repository.js
          - core/server/services/link-tracking/index.js
          - core/server/services/link-tracking/link-click-tracking-service.js
          - core/server/services/email-analytics/index.ts
          - core/server/services/email-analytics/automation-email-analytics-batch-processor.ts
        tests:
          - test/e2e-api/members/automations.test.js
          - test/unit/server/services/members/members-api/repositories/member-repository.test.js
          - test/integration/services/email-analytics/automation-email-analytics.test.js
      startup:
        summary: >-
          Boot loads both compositions during initServices and calls automations init after
          dependent service initialization, job-handler registration and awaited jobs.start,
          before conditional post rescheduling. Boot's await of synchronous init cannot establish
          first-poll completion. Both new and legacy pollers are subscribed regardless of the
          automations flag; that flag chooses signup enrollment paths, not whether persisted
          work is processed. Browsing the repository also creates missing default automations
          and copies eligible legacy email content, so it is not a read-only readiness check.
          Boot units hold jobs startup and assert synchronous init error identity/short-circuit;
          real boot HTTP holds jobs startup and asserts maintenance before automation init.
          Service units assert deferred dispatch, and Admin HTTP checks default creation/copying.
          None asserts failed first-poll recovery or first-poll completion as readiness.
        sources:
          - core/boot.js
          - core/server/services/automations/service.ts
          - core/server/services/automations/automations-api.ts
          - core/server/services/automations/database-automations-repository.ts
          - core/server/services/members/members-api/repositories/member-repository.js
        tests:
          - test/unit/boot-email-analytics.test.ts
          - test/e2e-server/boot-readiness.isolated.test.ts
          - test/unit/server/services/automations/service.test.ts
          - test/e2e-api/admin/automations.test.js
      lifetime:
        summary: >-
          Successful init keeps its original callbacks, scheduler, key owner and timer; there is
          no reset, stop or restart hook. The separate repository persists for module lifetime;
          persisted runs, revisions and claim markers survive process replacement. New steps use 30-minute claims,
          lock-token-checked updates and transactional completion/next-step insertion; next
          actions use the current graph/revision, not a whole-run snapshot. Enrollment locks the
          member and avoids a second run for the same automation/member. Real DB integration
          holds locks to test same-member duplicate prevention and different-member concurrency;
          selected-tier fetch tests are sequential. SQLite repository tests assert stale/fresh
          claim handling and refusal of an obsolete lock owner, not multi-process execution.
          Same-process restart, legacy concurrent claiming, crash recovery, long sends exceeding
          claims and automatic wakeup solely for a fresh lock's expiry remain unpinned.
        sources:
          - core/server/services/automations/service.ts
          - core/server/services/automations/database-automations-repository.ts
          - core/server/services/automations/welcome-email-automation-poll.ts
          - core/server/services/automations/constants.ts
          - core/server/services/automations/stale-lock-cutoff.ts
        tests:
          - test/unit/server/services/automations/service.test.ts
          - test/unit/server/services/automations/database-automations-repository.test.ts
          - test/integration/services/automations/database-automations-repository.test.ts
      configuration:
        summary: >-
          API import captures the parsed positive integer fake wait multiplier, otherwise wait
          hours use real milliseconds. Init captures API URL and site UUID/API-URL fallback for
          scheduler jitter, but retrieves the current scheduler key for each future enqueue.
          Polls read current member status/preferences, action revision and settings; click
          tracking needs automationAnalytics plus email_track_clicks, while opens use
          email_track_opens and recipient open tracking additionally requires a Mailgun ID.
          API stats checks current Tinybird config, wrapper instance/token and
          site ID; shared request agents and frozen URL helpers retain earlier configuration.
          Welcome-email caches/transports belong to that wrapper. Parser/timing units assert
          value validation and cadence; fake poll units assert tracking arguments. HTTP stats
          tests use test configuration overrides/provider responses, not production hot reload
          or full captured-versus-accessor replacement coverage.
        sources:
          - core/server/services/automations/automations-api.ts
          - core/server/services/automations/fake-wait-hours-multiplier.ts
          - core/server/services/automations/service.ts
          - core/server/services/automations/scheduler-poll-time.ts
          - core/server/services/automations/poll.ts
          - core/server/services/automations/database-automations-repository.ts
          - core/server/services/member-welcome-emails/service.js
          - core/server/services/stats/utils/tinybird.js
          - core/server/lib/request-external.js
          - core/shared/url-utils.ts
        tests:
          - test/unit/server/services/automations/fake-wait-hours-multiplier.test.ts
          - test/unit/server/services/automations/scheduler-poll-time.test.ts
          - test/unit/server/services/automations/poll.test.ts
          - test/e2e-api/admin/automations.test.js
      resources:
        summary: >-
          The service owns two DomainEvents subscriptions and a referenced SoonestTimer with
          chained long delays, but stores no disposer or poll-drain handle and registers no
          GhostServer cleanup. It borrows DB, scheduler, welcome-email transports/caches and
          recurring analytics jobs; shared HTTP agents are created by request-external. Each
          poller serializes itself and coalesces at most one extra invocation; the two pollers
          can overlap. Installed DomainEvents dispatch is synchronous and its allSettled tracking
          is test-only. oneAtATime starts a queued invocation without awaiting/returning it, so
          the original promise can settle while queued work remains. Its named completion test
          holds only the first invocation. Timer units cover earliest-date replacement and long
          delays with fake time, not disposal. Tinybird requests disable retries and use a 35s
          request timeout; member search adds bounded batches, a between-batch soft budget and
          a 3s POST abort signal. No root shutdown cancels these requests or stops new polling.
        sources:
          - core/server/services/automations/service.ts
          - core/server/lib/soonest-timer.ts
          - core/shared/one-at-a-time.ts
          - core/server/services/automations/poll.ts
          - core/server/services/automations/welcome-email-automation-poll.ts
          - core/server/services/automations/automation-member-search.ts
          - core/server/services/stats/utils/tinybird.js
          - core/server/lib/request-external.js
          - core/server/services/member-welcome-emails/service.js
          - core/server/services/email-analytics/jobs/index.js
          - core/server/ghost-server.ts
          - package.json
        tests:
          - test/unit/server/services/automations/service.test.ts
          - test/unit/shared/one-at-a-time.test.ts
      failures:
        summary: >-
          Synchronous init failure reaches boot; later poll-level rejection is swallowed by
          oneAtATime. Scheduler/key failure logs after the local timer is armed. New polling logs
          per-step failures and continues peers; send/advance failures retry after ten minutes
          up to ten attempts, but recipient or analytics-scheduling failure is logged and allows
          completion without retrying the sent mail. Email sending is outside DB transactions:
          failure advancing an already sent step can retry its send. Legacy polling sends before
          its recipient/completion transaction, retries that failure, and discards per-run rejected
          allSettled results. Tests assert selected stubbed retry/continuation paths; legacy DB
          integration injects completion failure and asserts recipient rollback plus retry with
          fake sending. Real execution/history HTTP asserts a recorded send followed by final
          advancement failure using a fake sender. Browse falls back to SQL on unusable Tinybird
          stats, while performance/run endpoints fail; intercepted HTTP asserts fallback without
          retry and retains zero stats for a successful empty response. These do not guarantee
          exactly-once delivery, crash recovery or drain completion.
        sources:
          - core/server/services/automations/service.ts
          - core/shared/one-at-a-time.ts
          - core/server/services/automations/poll.ts
          - core/server/services/automations/welcome-email-automation-poll.ts
          - core/server/services/automations/database-automations-repository.ts
          - core/server/services/automations/automations-api.ts
          - core/server/services/automations/tinybird-automation-stats.ts
        tests:
          - test/unit/server/services/automations/poll.test.ts
          - test/integration/services/automations/welcome-email-automation-poll.test.ts
          - test/e2e-api/admin/automation-run-history-execution.test.ts
          - test/e2e-api/admin/automations.test.js
          - test/e2e-api/admin/automation-performance-stats.test.ts
          - test/e2e-api/admin/automation-runs.test.ts
    unverified: []
    blockers:
      - >-
        Preserve both composition paths and retained callers; pin import-time repository and
        transport acquisition, synchronous init/dispatch return behavior, dependency capture,
        root identity and partial-subscription/registration failure before changing lifecycle.
        Current boot barrier/error tests already cover orchestration with substituted services.
      - >-
        Define stop-accepting, timer cancellation, subscription/scheduler ownership and in-flight
        draining before supporting reinitialization. The oneAtATime completion promise does not
        include a held queued invocation; add that assertion before relying on it for draining.
        Existing event settlement and timer tests do not establish production shutdown.
      - >-
        Preserve failure/recovery semantics across both pollers: detached post-commit signup,
        fetch/lookup/claim failure, fresh-lock recovery without another event, partial init,
        legacy concurrent claims and sends that outlive locks remain lifecycle obligations.
        Sending and completion are separate effects; test crash/advance-failure duplication
        boundaries rather than promising exactly-once provider delivery.
      - >-
        Characterize captured multiplier/URL/site identity versus accessor-based flags, keys and
        wrapper dependencies. Keep the existing API validation, statistics fallback, run history,
        tracking transactions and HTTP-owned add gates/soft count limit intact during migration;
        do not move further business policy into HTTP or make unrelated gaps pilot prerequisites.
  comments:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - comments/index.js
    notes: >-
      Preserve API/controller replacement, current-wrapper consumers and notification timing.
      Account for the nested mail transport and external event subscribers. This background
      audit is separate from the eight-service pilot; recorded does not mean fully tested.
    contracts:
      exports:
        summary: >-
          CommonJS exports one wrapper whose receiver-dependent synchronous init returns
          undefined and adds api/controller. The API exposes comment/query/moderation/vote/report
          methods plus a synchronous enabled getter and synchronous access checks. Domain
          operations return promises. Controller request methods accept frames, return models,
          pages, count maps or no result, and set
          invalidation headers; destroy rejects rather than deleting. The HTTP adapter owns
          serialization/status codes. Units assert selected controller arguments, errors and
          headers with fake services, not the complete root shape or init return timing.
        sources:
          - core/server/services/comments/index.js
          - core/server/services/comments/comments-service.js
          - core/server/services/comments/comments-controller.js
          - core/server/services/comments/comments-stats-service.js
          - core/server/api/endpoints/comments-members.js
          - core/server/api/endpoints/utils/serializers/output/mappers/comments.js
        tests:
          - test/unit/server/services/comments/comments-controller.test.js
      construction:
        summary: >-
          Every init constructs GhostMailer, CommentsService, CommentsStats and CommentsController.
          The service constructs its email helper, which constructs an isolated Handlebars
          renderer. API publication precedes stats/controller construction; there is no guard or
          acquisition rollback. Models, settings/helper/URL facades and members.contentGating are
          retained; stats retains the DB module, while reply mail reads emailService.renderer at
          send time. No other production construction of these comments classes was found.
          Units instantiate deep classes with fakes; the DB integration invokes the real root
          and asserts pinned projections, not construction count or transport ownership.
        sources:
          - core/server/services/comments/index.js
          - core/server/services/comments/comments-service.js
          - core/server/services/comments/comments-service-emails.js
          - core/server/services/comments/comments-service-email-renderer.js
          - core/server/lib/mail/ghost-mailer.js
        tests:
          - test/unit/server/services/comments/comments-service.test.js
          - test/unit/server/services/comments/comments-service-emails.test.js
          - test/integration/services/comments-service.test.js
      consumers:
        summary: >-
          Admin/member comment, reply, report and reaction endpoints retain the wrapper and
          resolve its current controller/API per call. Members BREAD similarly uses current api
          for bulk hiding; the Content post mapper reads api.enabled. Creation/replies dispatch
          MemberCommentEvent to members-events after notifications; comments registers no event
          subscriber. HTTP asserts selected CRUD/moderation, redaction, vote access, private-site
          guards, headers and bulk-hide results. Mail-intercepted comment/reply tests await test
          DomainEvents settlement and assert member timestamps; none pins wrapper replacement
          through all consumers or production subscriber completion before the response.
        sources:
