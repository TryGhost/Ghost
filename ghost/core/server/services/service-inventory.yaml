        summary: >-
          The integrations endpoint is the only production factory caller found. Module
          evaluation constructs once with shared Integration and ApiKey models and retains
          the result in a private constant. The constructor only stores references; it makes
          no query or subscription. The factory could create independent instances, but no
          other runtime constructor or direct service unit test was found.
        sources:
          - core/server/services/integrations/integrations-service.js
          - core/server/api/endpoints/integrations.js
        tests: []
      consumers:
        summary: >-
          The endpoint delegates ordinary integration edits and API-key refresh requests to
          this retained instance; browse/read/add/destroy use models directly. Both edit routes
          run through Admin authentication, API permissions and input/output serialization.
          HTTP tests exercise ordinary field/webhook edits, successful admin-key rotation and
          missing-integration edits. The rotation case checks the new secret and a refreshed
          action, but not old-token rejection, content keys or mismatched integration/key IDs.
        sources:
          - core/server/api/endpoints/integrations.js
          - core/server/web/api/endpoints/admin/routes.js
          - core/server/api/endpoints/utils/serializers/input/integrations.js
          - core/server/api/endpoints/utils/serializers/output/mappers/integrations.js
          - core/server/models/integration.js
        tests:
          - test/e2e-api/admin/integrations.test.js
      startup:
        summary: >-
          Admin router construction accesses the lazy endpoint getter. Normal backend/API mounts
          defer this router construction until an Admin API request, so boot does not explicitly
          construct the service before readiness. Direct factory construction can occur earlier
          because dependencies are merely stored. There is no pre-use guard. Existing HTTP
          tests exercise completed request composition, not construction timing, concurrent
          first-request behavior or dependency failure during lazy router creation.
        sources:
          - core/boot.js
          - core/server/api/endpoints/index.js
          - core/shared/express.js
          - core/server/web/parent/backend.js
          - core/server/web/api/app.js
          - core/server/web/api/endpoints/admin/app.js
          - core/server/web/api/endpoints/admin/routes.js
          - core/server/api/endpoints/integrations.js
          - core/server/services/integrations/integrations-service.js
        tests:
          - test/e2e-api/admin/integrations.test.js
      lifetime:
        summary: >-
          Module caching retains the endpoint's instance and model references across requests
          and same-process boots. Each edit queries current rows and keeps no per-integration
          cache. Ordinary edit mutates the caller's options with require true; key rotation
          instead clones options for refresh and uses fresh relation options for the reread.
          Replacing a module export would not update the endpoint's private reference. There
          is no serialization, deduplication or concurrency guard around edits/rotations.
        sources:
          - core/server/services/integrations/integrations-service.js
          - core/server/api/endpoints/integrations.js
        tests: []
      configuration:
        summary: >-
          The factory retains model dependencies and reads no application configuration itself.
          Truthy options.keyid selects rotation and ignores edit data: it reads the key by
          keyid alone, refreshes that key and then reads the integration named by options.id
          with api_keys/webhooks. The service does not compare the key's integration_id with
          options.id. Ordinary edits forward data and options to the model. HTTP serialization
          limits editable fields and formats admin secrets as id:secret; these are separate
          boundaries, not validation implemented by the service factory. The ApiKey unit test
          stubs model edit and pins generated secret length and forwarded data/options; it does
          not exercise service composition, association checks or persisted rotation.
        sources:
          - core/server/services/integrations/integrations-service.js
          - core/server/api/endpoints/integrations.js
          - core/server/api/endpoints/utils/serializers/input/integrations.js
          - core/server/api/endpoints/utils/serializers/output/mappers/integrations.js
          - core/server/models/api-key.js
        tests:
          - test/e2e-api/admin/integrations.test.js
          - test/unit/server/models/api-key.test.ts
      resources:
        summary: >-
          The instance owns only borrowed model references; edits use the shared database and
          model event/action machinery. It creates no timer, network client or listener and
          has no pending-query drain. Rotation has no service-level transaction joining key
          lookup, refresh and integration reread. Lookup/reread omit caller transaction options,
          although refresh receives them. ApiKey.onUpdated starts refreshed-action recording
          without returning its promise; success of rotation does not itself await that write.
          The action plugin catches/logs ordinary Action.add rejection. With a caller transaction
          it waits for a truthy committed event, then inserts the action outside that transaction.
          HTTP tests observe a later action row, not write timing or failure handling.
        sources:
          - core/server/services/integrations/integrations-service.js
          - core/server/models/api-key.js
          - core/server/models/integration.js
          - core/server/models/base/plugins/crud.js
          - core/server/models/base/plugins/actions.js
          - core/server/models/base/plugins/events.js
        tests:
          - test/e2e-api/admin/integrations.test.js
      failures:
        summary: >-
          Key lookup rejection escapes unchanged; an absent key yields NotFoundError before
          the wrapping catch. Refresh, key serialization and subsequent integration-read
          failures become InternalServerError, potentially after the secret changed. A null
          integration reread is returned without a service error. Ordinary edits translate
          errors whose message is NotFound or EmptyResponse to Integration NotFoundError and
          rethrow others. Ordinary action-write rejection is logged without rejecting or rolling
          back rotation. HTTP coverage pins deleted-integration 404/context; no direct test
          covers the other service-level failure stages, option mutation or partial writes.
        sources:
          - core/server/services/integrations/integrations-service.js
          - core/server/models/api-key.js
          - core/server/models/base/plugins/crud.js
          - core/server/models/base/plugins/actions.js
          - core/server/api/endpoints/integrations.js
        tests:
          - test/e2e-api/admin/integrations.test.js
    unverified: []
    blockers:
      - >-
        Pin factory/instance exports, retained endpoint identity, composition timing and options
        mutation before moving construction to boot. Existing HTTP tests use a fully booted
        endpoint and do not establish pre-init, receiver or same-process restart behavior.
      - >-
        Add key-rotation failure contracts for absent/rejected key lookup, refresh failure,
        null/rejected integration reread and action-record failure. Assert stored secrets and
        errors together; a successful HTTP rotation and later action lookup do not prove atomicity
        or that the action is awaited. Preserve or explicitly change transaction propagation.
      - >-
        Characterize integration/key association and concurrent rotations through authorized
        HTTP calls, including content keys and old-token rejection. Source shows independent
        key/integration lookups; do not assume the facade or existing successful path tests
        establish association validation or protection against lost/repeated rotation results.
      - >-
        Keep ordinary edit error translation and relation/model behavior distinct from the
        rotation branch. Add direct model-failure injection and pending-operation ownership
        evidence before introducing cleanup or promising rollback that does not exist today.
  internal-keys:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - internal-keys/index.ts
    notes: >-
      Preserve the shared mutable key map, lazy database reads and explicit invalidation;
      changing promise retention or rotation behavior needs separate tests and a decision.
    contracts:
      exports:
        summary: >-
          The TypeScript default export is one AutoFillingMap from integration slugs to API-key
          promises; CommonJS consumers use .default. Other exports are types only. The full
          inherited Map surface remains available, including set, delete and clear; get is an
          instance method requiring its receiver. There is no init or shutdown export.
        sources:
          - core/server/services/internal-keys/index.ts
          - core/server/lib/auto-filling-map.ts
          - core/frontend/services/proxy.js
        tests: []
      construction:
        summary: >-
          Import loads the model registry and constructs an empty map, without querying keys.
          A cache miss calls Integration.getApiKeyBySlug with the fixed slug-to-type mapping
          and stores its returned promise immediately. The model joins integrations and
          api_keys and returns a flat id/secret object. No alternate runtime map construction
          for this capability was found; tests inject their own maps.
        sources:
          - core/server/services/internal-keys/index.ts
          - core/server/lib/auto-filling-map.ts
          - core/server/models/integration.js
        tests:
          - test/unit/server/lib/auto-filling-map.test.ts
          - test/unit/server/models/integration.test.js
      consumers:
        summary: >-
          Frontend proxy getFrontendKey exposes the content secret to content_api_key,
          comments and ghost_head helpers. Post scheduling retains the map; boot supplies it
          to gifts' two SignedFlushSchedulers and automations' scheduled poll callback. Auth
          reset reads the old scheduler key, rotates secrets transactionally and clears the
          same map before deleting sessions and rescheduling with the previous key.
        sources:
          - core/frontend/services/proxy.js
          - core/frontend/helpers/content_api_key.js
          - core/frontend/helpers/comments.js
          - core/frontend/helpers/ghost_head.js
          - core/boot.js
          - core/server/services/post-scheduling/index.ts
          - core/server/services/post-scheduling/post-scheduling.ts
          - core/server/services/gifts/index.ts
          - core/server/adapters/scheduling/signed-flush-scheduler.ts
          - core/server/services/automations/service.ts
          - core/server/services/auth/reset-authentication.ts
        tests:
          - test/unit/frontend/helpers/content-api-key.test.ts
          - test/unit/server/services/auth/reset-authentication.test.ts
          - test/unit/server/adapters/scheduling/signed-flush-scheduler.test.ts
      startup:
        summary: >-
          This root has no readiness check. The first get needs initialized models/database and
          seeded integration keys. Foreground boot supplies the map after initCore; post
          scheduling may read it in rescheduleAll when the adapter requests boot rebuilding.
          Gift recovery and automations scheduling can also read it, while frontend helpers
          defer access until rendering. Acquiring the map alone does not establish key readiness.
        sources:
          - core/boot.js
          - core/server/services/internal-keys/index.ts
          - core/server/services/post-scheduling/post-scheduling.ts
          - core/server/services/gifts/index.ts
          - core/server/adapters/scheduling/signed-flush-scheduler.ts
          - core/server/services/automations/service.ts
          - core/frontend/services/proxy.js
        tests: []
      lifetime:
        summary: >-
          All callers share one process-local map. Same-slug concurrent reads share its promise;
          fulfilled and rejected promises remain until explicit delete/clear. Invalidation
          makes later get calls reload but does not cancel an outstanding query or invalidate
          an already retained key object. A promise settling after clear does not repopulate
          the map. Server shutdown does not clear the map. Helper tests
          prove memoized success and invalidation; auth tests use an injected map to check
          previous-key forwarding and session-before-reschedule ordering, not successful
          cache invalidation or the real root's database connection.
        sources:
          - core/server/services/internal-keys/index.ts
          - core/server/lib/auto-filling-map.ts
          - core/server/services/auth/reset-authentication.ts
          - core/boot.js
        tests:
          - test/unit/server/lib/auto-filling-map.test.ts
          - test/unit/server/services/auth/reset-authentication.test.ts
      configuration:
        summary: >-
          ghost-scheduler selects an admin key and ghost-internal-frontend selects a content
          key. There are no config flags or environment gates in the root. The first miss reads
          current database values; external changes do not automatically refresh a cached key.
          Auth reset is the production invalidation caller found, after its transaction commits.
        sources:
          - core/server/services/internal-keys/index.ts
          - core/server/models/integration.js
          - core/server/services/auth/reset-authentication.ts
        tests:
          - test/unit/server/models/integration.test.js
          - test/unit/server/services/auth/reset-authentication.test.ts
      resources:
        summary: >-
          The map owns cached promises and their key objects and borrows the model/database
          owner for queries; it acquires no connection, timer, listener or scheduler itself.
          clear/delete release only map references and do not drain lookups. Scheduler resources
          and derived signed jobs belong to consumers, which must rebuild them after rotation.
        sources:
          - core/server/services/internal-keys/index.ts
          - core/server/lib/auto-filling-map.ts
          - core/server/models/integration.js
          - core/server/services/auth/reset-authentication.ts
          - core/server/adapters/scheduling/signed-flush-scheduler.ts
        tests: []
      failures:
        summary: >-
          Missing rows reject with NotFoundError; database failures propagate and remain cached
          as rejected promises. Frontend proxy logs lookup failures and returns null; scheduling
          event callbacks log them; PostScheduling and SignedFlushScheduler rescheduleAll
          reject. Future automation polls catch key failure after arming an in-memory timer.
          Auth reset cannot start rotation
          if the previous-key lookup fails; transaction failure leaves the cache intact, whereas
          session/reschedule failure happens after commit and invalidation. No root retry exists.
        sources:
          - core/server/models/integration.js
          - core/server/lib/auto-filling-map.ts
          - core/frontend/services/proxy.js
          - core/server/services/post-scheduling/post-scheduling.ts
          - core/server/adapters/scheduling/signed-flush-scheduler.ts
          - core/server/services/automations/service.ts
          - core/server/services/auth/reset-authentication.ts
        tests:
          - test/unit/server/models/integration.test.js
          - test/unit/server/services/auth/reset-authentication.test.ts
    unverified: []
    blockers:
      - >-
        Add real-root contracts for slug/type mapping, promise identity, rejected lookup
        retention, pre-database access and repeated boot. Generic map/model tests and frontend
        tests that set the exported map directly do not prove lazy root lookup wiring.
      - >-
        Test rotation through actual retained frontend and scheduler consumers, including a
        pending lookup during invalidation and post-commit session/reschedule failures.
        Existing reset tests inject their own cache; neither clear nor rotation revokes
        promises/key objects already held by callers or updates already signed jobs by itself.
      - >-
        Decide cache ownership and invalidation for restart and external key changes before
        adding a lifecycle initializer. There is no automatic expiry, failure eviction or
        shutdown clear, and TypeScript slug types do not enforce valid keys at runtime.
  invitations:
    kind: directory
    disposition: relocate
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - invitations/index.js
    notes: >-
      Move acceptance under invites ownership; preserve the transaction, token lookup and
      HTTP validation boundary without adding a lifecycle to this stateless function.
    contracts:
      exports:
        summary: >-
          CommonJS exports an object with a lazy accept getter. It returns the cached accept
          function, also available by deep import. Successful acceptance resolves undefined;
          the API serializer supplies the success message. There is no init or shutdown.
        sources:
          - core/server/services/invitations/index.js
          - core/server/services/invitations/accept.js
          - core/server/api/endpoints/utils/serializers/output/authentication.js
        tests: []
      construction:
        summary: >-
          Accessing the getter imports shared models and security helpers. Each call decodes
          the first invitation token, opens a transaction, locks a sent invite, checks expiry
          and existing user, deletes the invite and creates the user in that order. Email and
          role come from the stored invite, not request email; name and password come from
          the request. There is no application instance or request state retained by the root.
        sources:
          - core/server/services/invitations/accept.js
          - core/server/models/base/index.js
          - core/server/models/base/plugins/events.js
          - core/server/models/user.js
        tests:
          - test/unit/server/services/invitations/accept.test.js
      consumers:
        summary: >-
          The authentication endpoint is the only production caller found. Its POST route
          uses invitations.accept after input validation and setup checks. The separate GET
          invitation lookup queries models directly and does not call this service. Unit
          tests deep-import accept; HTTP tests use the real root through the endpoint.
        sources:
          - core/server/api/endpoints/authentication.js
          - core/server/web/api/endpoints/admin/routes.js
          - core/server/api/endpoints/utils/validators/input/invitations.js
        tests:
          - test/unit/server/services/invitations/accept.test.js
          - test/legacy/api/admin/authentication.test.js
      startup:
        summary: >-
          No explicit boot call initializes this module. Invocation needs the shared database
          and models ready. HTTP requires completed setup and nonempty token, password and
          name; direct callers bypass these API checks. Existing HTTP tests boot Ghost before
          acceptance, but do not establish pre-boot or setup-disabled behavior for this root.
        sources:
          - core/boot.js
          - core/server/services/invitations/accept.js
          - core/server/api/endpoints/authentication.js
          - core/server/api/endpoints/utils/validators/input/invitations.js
        tests:
          - test/legacy/api/admin/authentication.test.js
      lifetime:
        summary: >-
          The module caches the function and shared models; invocation-local transaction,
          invite and user variables are not shared. Persisted invite deletion provides the
          successful-use boundary. There is no reset, replay cache or service-level retry.
          Existing tests do not assert concurrent acceptance, token reuse or failed creation
          leaving the invite available.
        sources:
          - core/server/services/invitations/index.js
          - core/server/services/invitations/accept.js
        tests: []
      configuration:
        summary: >-
          The function reads the current clock and stored expiry at invocation. Only expires
          strictly less than Date.now is rejected. It looks up the decoded token and sent
          status without regenerating or verifying a token signature. DB configuration,
          password policy and user defaults belong to the shared model layer; no root feature
          flag or configuration snapshot exists.
        sources:
          - core/server/services/invitations/accept.js
          - core/server/models/user.js
          - core/server/data/db/index.js
        tests: []
      resources:
        summary: >-
          Each invocation borrows the shared database for one transaction and row locks;
          the database transaction owns release. User creation and role attachment receive
          the transaction. Model change events are deferred until commit; this function adds
          no timers, subscriptions, transport, cancellation or drain hook. Unit tests replace
          the transaction and prove call ordering and selected option forwarding, not actual
          rollback, lock behavior, event delivery or shutdown while acceptance is pending.
        sources:
          - core/server/services/invitations/accept.js
          - core/server/models/user.js
          - core/server/models/base/bookshelf.js
          - core/server/models/base/plugins/events.js
          - core/server/ghost-server.ts
        tests:
          - test/unit/server/services/invitations/accept.test.js
      failures:
        summary: >-
          Missing sent invite or expired invite produces NotFoundError; an existing user
          produces ValidationError. Decode, database and user-validation errors propagate.
          Errors inside the transaction reject it; the service does not catch or retry them.
          HTTP tests assert missing-token-match 404, duplicate-user 422 and successful 200.
          They do not prove expiry boundaries, malformed input, rollback after deletion,
          emitted-event outcomes or successful staff role assignment.
        sources:
          - core/server/services/invitations/accept.js
          - core/server/models/base/index.js
          - core/server/api/endpoints/utils/validators/input/invitations.js
        tests:
          - test/legacy/api/admin/authentication.test.js
    unverified: []
    blockers:
      - >-
        Add real-database contracts for rollback when user creation or role attachment fails,
        concurrent acceptance, token reuse and committed model events. Current units stub
        the transaction and do not even assert destroy's options or forUpdate flags.
      - >-
        Assert decoded-token lookup, stored email/role authority, created user/password and
        expiry boundary behavior. Current HTTP success assertions stop at the response.
      - >-
        Preserve lazy exports and API validation/setup checks during relocation; decide how
        the invites owner exposes acceptance without request state or first-request setup.
  invites:
    kind: directory
    disposition: retain
    status: audited
