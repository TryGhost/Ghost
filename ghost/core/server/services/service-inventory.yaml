          - core/server/services/audience-feedback/audience-feedback-controller.js
          - core/server/services/audience-feedback/audience-feedback-service.js
          - core/server/services/audience-feedback/feedback-repository.js
          - core/server/services/audience-feedback/feedback.js
          - core/server/services/members/middleware.js
        tests:
          - test/unit/server/services/audience-feedback/audience-feedback-controller.test.js
          - test/e2e-api/members/feedback.test.js
    unverified: []
    blockers:
      - >-
        Pin wrapper exports, receiver requirements, pre-init behavior, repeated init and retained
        consumers. Preserve publication before email initialization; test partial failures and
        retry because the service guard can conceal an unfinished controller.
      - >-
        Characterize simultaneous submissions and failing writes. Read-then-add has no uniqueness
        or transaction protection, so sequential ID/timestamp assertions do not rule out duplicate
        rows or conflicting updates. Pin repository model calls, ID conversion, transaction and
        pending-query ownership before changing construction or promising atomicity/cleanup.
      - >-
        Cover the real Admin browse boundary, member-data privacy, pagination/score parsing,
        ignored order and model-result mapping; existing repository tests only use empty results.
