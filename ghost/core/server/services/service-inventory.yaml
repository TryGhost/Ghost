          - test/unit/server/services/jobs-service/jobs-service.test.ts
          - test/unit/server/ghost-server.test.ts
          - test/e2e-server/boot-readiness.isolated.test.ts
      failures:
        summary: >-
          Invalid declarations, duplicate handler types and conflicting queue limits fail.
          Dispatch and recurring scheduling propagate payload serialization, validation
          and backend errors.
          Deliveries for unknown job types are logged and dropped. Handler errors are
          logged, reported and rethrown to the backend; the in-memory backend logs them and
          continues other deliveries without retrying. A recurring tick whose enqueue throws
          is logged and the schedule keeps running. A real-boot test rejects jobs.start with a
          Ghost error and asserts the same failed-readiness error, listener closure at the
          requested exit and exit code 2; process.exit is stubbed. It does not cover plain-error
          wrapping, every cleanup task before exit or all boot failure stages.
        sources:
          - core/server/ghost-server.ts
          - core/boot.js
          - core/server/services/jobs-service/jobs-service.ts
          - core/server/adapters/jobs/InMemoryJobsBackend.ts
        tests:
          - test/e2e-server/boot-failure.isolated.test.ts
          - test/unit/server/services/jobs-service/jobs-service.test.ts
          - test/unit/server/adapters/jobs/in-memory-jobs-backend.test.ts
    unverified: []
    blockers:
      - >-
        Before changing consumer wiring, add contract tests for the boot-injected email
        and site-importer references, dispatch-time lookups and boot-supplied scheduling
        references identified above. The cited consumer tests do not cover these paths.
        Custom jobs adapters need their own evidence.
      - >-
        Recurring scheduling guards in gifts, members, signing keys, email analytics and
        Tinybird survive backend shutdown, which removes their timers. Recurrence after
        in-process restart is not established; resolve this legacy limitation explicitly.
      - >-
        Timed-out handlers can outlive cleanup, and an early drain leaves its deadline
        timer pending. Do not claim cancellation or safe dependency disposal from bounded
        shutdown alone. Domain handlers such as the site importer may absorb their own
        failures, so settlement is not proof of successful domain work. Cross-service drain
        ordering and failures outside the tested jobs-start boundary remain open.
  limits.ts:
    kind: file
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - limits.ts
    notes: >-
      Boot loads host policy into an eagerly exported, widely retained instance. Preserve
      per-consumer enforcement and existing configuration quirks; the route guard is HTTP
      support alongside this application-owned instance, not a reason to move policy into API.
    contracts:
      exports:
        summary: >-
          Named TypeScript exports are limitService, synchronous receiver-independent init
          returning undefined, and requireFeature, which returns async Express middleware.
          Callers use the instance's synchronous isLimited/isDisabled, async throwing and
          boolean checks, and public limits map; the theme installer reads an allowlist
          directly. Package instance methods depend on their receiver. Middleware awaits a
          check then calls next(), or passes its error to next(err). HTTP tests exercise that
          guard, but no test pins the root's exact export or receiver surface.
        sources:
          - core/server/services/limits.ts
          - core/server/services/themes/installer.js
          - core/server/web/api/endpoints/admin/routes.js
        tests:
          - test/e2e-api/admin/member-custom-fields.test.ts
      construction:
        summary: >-
          Import constructs one empty LimitService from the workspace package. Every init
          reloads that same object with current host limits, subscription, help link, the
          shared db module and Ghost errors. There is no initialized guard, promise or
          configurable factory. Loading synchronously constructs per-limit implementations;
          neither construction nor loading queries the database. Core init tests stub
          loadLimits and test error handling, without asserting its full argument object.
        sources:
          - core/server/services/limits.ts
          - core/server/data/db/index.js
        tests:
          - test/unit/server/services/limits.test.js
      consumers:
        summary: >-
          Models gate publishing, staff invites/reactivation/promotion and integration creation;
          imports become Contributors whenever staff is configured. API-key authentication
          exempts internal/core integrations, whereas limited webhooks retain only internal
          integrations. Retained dependencies in newsletters, email, settings and settings
          helpers govern active newsletters, send/retry checks, Stripe connection, private-site
          settings and social/analytics availability. Theme endpoints/installer and file/media
          validators enforce values/sizes. Only member-metafield mutation routes use
          requireFeature; reads remain open.
          HTTP assertions cover integration creation/authentication, newsletter add/reactivation,
          member-limit publishing, staff invitations, theme/file limits and member-field guards.
          Privacy, social/analytics, importer demotion and several user-model paths remain source-only.
        sources:
          - core/server/models/post.js
          - core/server/models/user.js
          - core/server/models/invite.js
          - core/server/models/integration.js
          - core/server/data/importer/importers/data/users-importer.js
          - core/server/services/auth/api-key/admin.js
          - core/server/services/auth/api-key/content.js
          - core/server/services/webhooks/index.js
          - core/server/services/webhooks/webhook-trigger.js
          - core/server/services/newsletters/index.js
          - core/server/services/newsletters/newsletters-service.js
          - core/server/services/email-service/email-service-wrapper.js
          - core/server/services/email-service/email-service.js
          - core/server/services/settings/settings-service.js
          - core/server/services/settings/settings-bread-service.js
          - core/server/services/settings-helpers/index.js
          - core/server/services/settings-helpers/settings-helpers.js
          - core/server/services/themes/installer.js
          - core/server/api/endpoints/themes.js
          - core/server/api/endpoints/utils/validators/input/files.js
          - core/server/api/endpoints/utils/validators/input/media.js
          - core/server/web/api/endpoints/admin/routes.js
        tests:
          - test/e2e-api/admin/host-limits.test.ts
          - test/e2e-api/admin/member-custom-fields.test.ts
          - test/e2e-api/admin/newsletters.test.js
          - test/e2e-api/admin/key-authentication.test.js
          - test/e2e-api/content/key-authentication.test.js
          - test/e2e-api/admin/posts-legacy.test.js
      startup:
        summary: >-
          initCore awaits init before settings initialization: settings enforce public-site
          privacy and derive social/analytics availability using loaded limits. The eager
          instance is callable before init and has no limits then. The root does not await a
          loadLimits return value; the current package method is synchronous. Boot-based
          authentication/newsletter/email tests exercise configured startup, but do not assert
          the ordering or pre-init contract explicitly. Public-site startup tests stub the
          limit method, so they do not prove real configuration reaches that consumer.
        sources:
          - core/boot.js
          - core/server/services/limits.ts
          - core/server/services/settings/settings-service.js
          - core/server/services/settings-helpers/settings-helpers.js
        tests:
          - test/e2e-api/admin/key-authentication.test.js
          - test/e2e-api/content/key-authentication.test.js
          - test/e2e-api/admin/newsletters.test.js
          - test/e2e-api/admin/posts-legacy.test.js
          - test/unit/server/services/settings/settings-service.test.js
      lifetime:
        summary: >-
          Module caching retains the exported instance and callers' references across init.
          Each load replaces its limits map and creates new limit objects, rather than
          updating old ones; an already-started check can finish against its former object.
          There is no automatic host-config subscription, reset/stop, query cancellation or
          cross-request reservation. Core host-limit helpers explicitly call init after
          changing/restoring config, and tests assert removal of a prior limit. Retained
          references, concurrent checks/reloads and restart identity are source-only findings.
        sources:
          - core/server/services/limits.ts
          - core/server/services/newsletters/index.js
          - core/server/services/settings-helpers/index.js
          - core/server/services/email-service/email-service-wrapper.js
          - core/server/services/themes/installer.js
        tests:
          - test/e2e-api/admin/host-limits.test.ts
      configuration:
        summary: >-
          init uses hostSettings:limits or {}, a billing URL only when enabled is boolean true,
          otherwise https://ghost.org/help/, and a truthy subscription object supplies start
          with interval fixed to month. Package loading recognizes configured names and chooses
          allowlist, max, maxPeriodic, then flag by property presence. Unknown names are ignored;
          noncanonical names can load without their supplied settings. Flags use truthiness,
          so string false disables too. Scalar policy is captured on load, allowlist arrays
          are retained, and counts/current monthly period are evaluated per check. API config
          separately exposes host configuration, not proof a limit loaded. Tests pin several
          quirks and billing-enabled output, not every default or configuration boundary.
        sources:
          - core/server/services/limits.ts
          - core/server/api/endpoints/config.js
          - core/server/api/endpoints/utils/public-config/config.js
          - core/server/services/settings/settings-service.js
        tests:
          - test/e2e-api/admin/host-limits.test.ts
      resources:
        summary: >-
          The root and its limit objects retain policy/dependency references and own no timers,
          subscriptions or transport. Count checks borrow the shared lazy knex connection or
          supplied transaction and await queries; newsletters forwards transaction context for
          add/reactivation. Counts cover members, active newsletters, email totals since the
          current billing-period start, and non-Contributor staff excluding inactive users plus
          non-Contributor invites. Uploads supply
          bytes instead of querying. No counter cache, lock, reservation, shutdown or drain
          is supplied. HTTP tests exercise database-backed refusals with/without newsletter
          transactions, without proving concurrent capacity or complete SQL count semantics.
        sources:
          - core/server/services/limits.ts
          - core/server/data/db/index.js
          - core/server/data/db/connection.ts
          - core/server/services/newsletters/newsletters-service.js
          - core/server/services/email-service/email-service.js
          - core/server/api/endpoints/utils/validators/input/files.js
          - core/server/api/endpoints/utils/validators/input/media.js
        tests:
          - test/e2e-api/admin/host-limits.test.ts
          - test/e2e-api/admin/newsletters.test.js
      failures:
        summary: >-
          Only synchronous loadLimits IncorrectUsageError is warned and swallowed; other
          synchronous errors escape unchanged. Config reads occur outside that catch. Loading
          resets the map before building entries, so failure retains any successful prefix and
          omits the failed entry and following entries. Core tests assert exact warning/error
          identity, and HTTP tests pin a first-entry failure leaving subsequent policy absent.
          Invalid nonempty dates can register periodic limits; that test does not exercise
          their query. Check failures reject callers; boolean checks convert only HostLimitError
          to true. HTTP middleware forwards errors, endpoint wrappers can reword them, and
          webhook preparation logs a failed check and sends nothing. There is no retry or rollback.
        sources:
          - core/server/services/limits.ts
          - core/server/services/webhooks/webhook-trigger.js
          - core/server/services/auth/api-key/content.js
          - core/server/api/endpoints/newsletters.js
          - core/server/api/endpoints/settings.js
        tests:
          - test/unit/server/services/limits.test.js
          - test/e2e-api/admin/host-limits.test.ts
          - test/e2e-api/admin/member-custom-fields.test.ts
          - test/unit/server/services/newsletters/service.test.js
          - test/unit/server/services/email-service/email-service.test.js
    unverified: []
    blockers:
      - >-
        Pin root construction/export identity, pre-init behavior, exact load arguments and boot
        ordering, including strict billing-enabled/default help and subscription defaults.
        Characterize retained callers, the public theme allowlist and in-flight checks across
        reload/restart before replacing the shared instance or map.
      - >-
        Characterize failed reload after earlier valid entries and recovery, config-read failure
        and query rejection. First-entry failure tests do not prove atomic load or rollback.
        Treat string false, noncanonical names, invalid periodic dates and partial loading as
        recorded compatibility hazards; fix them separately from initialization if desired.
      - >-
        Extend real-root consumer assertions for staff reactivation/promotion/import, integration
        creation, public-site/social/analytics policy, media/thumbnail uploads, theme-install
        exceptions and webhook filtering. Existing helper, webhook and theme-install tests use
        injected/stubbed limits; add targeted tests for the retained production compositions.
      - >-
        Verify counted-query boundaries, periodic history and recipient addedCount through real
        consumers, plus retry/resume differences and concurrent capacity decisions. A max-zero
        refusal and package query stubs do not prove date filtering, staff exclusions or safe
        concurrent check-then-write behavior. Initialization must keep borrowing database/transaction
        ownership without adding untested cancellation or cleanup behavior.
      - >-
        Keep host-policy business logic outside HTTP while deciding ownership of requireFeature
        alongside the new service pattern; moving the root wholesale into API would conflict
        with the placement rules. Recorded facets do not establish migration readiness.
  link-redirection:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - link-redirection/index.js
    notes: >-
      Preserve frontend redirects, optional cache behavior and initialization before link
      tracking. Cache ownership, partial construction and subdirectory round trips need
      explicit contracts before changing this guarded wrapper.
    contracts:
      exports:
        summary: >-
          CommonJS exports one eager wrapper with receiver-dependent async init and initially
          absent service/linkRedirectRepository. Successful init publishes both without returning
          either. The deep service exposes async slug/create/filter/request operations and a
          synchronous relativeRedirectPrefix; only handleRequest is bound. Deep LinkRedirect
          objects retain mutable URL references and ObjectIDs, while RedirectEvent carries the
          original request URL, link and timestamp. Units exercise deep methods and DTOs, not
          root identity, detached init or the whole pre-init surface.
        sources:
          - core/server/services/link-redirection/index.js
          - core/server/services/link-redirection/link-redirects-service.js
          - core/server/services/link-redirection/link-redirect.ts
          - core/server/services/link-redirection/redirect-event.js
        tests:
          - test/unit/server/services/link-redirection/link-redirects-service.test.js
          - test/unit/server/services/link-redirection/link-redirect-repository.test.js
      construction:
        summary: >-
          The first init loads shared models, chooses an optional adapter, constructs/publishes
          a repository, then constructs the service with the site URL. Its async body has no
          await, so publication is synchronous; the service guard retains both on later calls.
          Cache-enabled repository construction immediately adds a site.changed listener. A
          later construction failure can leave that repository/listener published and retry
          creates another. There is no pending promise, rollback or teardown. Construction and
          partial-publication behavior are source-only.
        sources:
          - core/server/services/link-redirection/index.js
          - core/server/services/link-redirection/link-redirect-repository.js
          - core/server/services/adapter-manager/index.ts
        tests: []
      consumers:
        summary: >-
          Frontend route mounting reads the /r/ prefix and captures the bound handleRequest.
          Link tracking requires both published objects and retains them for newsletter and
          automation link creation, click events, projections and updates. Its post repository
          uses the retained redirect repository to reconstruct rows. Newsletter integration
          proves generated links exist in the database and resolve through real frontend HTTP
          to the stored destination; its nonempty click assertion does not pin the individual
          relation because supplied member_id/link_id options are ignored. Wrapper tests inject
          redirection dependencies; none prove retained consumers after root replacement.
        sources:
          - core/frontend/web/routers/link-redirects.js
          - core/frontend/web/site.js
          - core/server/services/link-tracking/index.js
          - core/server/services/link-tracking/link-click-tracking-service.js
          - core/server/services/link-tracking/post-link-repository.js
          - core/server/services/link-tracking/link-click-repository.js
          - core/server/models/base/plugins/sanitize.js
          - core/server/models/base/plugins/crud.js
        tests:
          - test/integration/services/email-service/batch-sending.test.js
          - test/unit/server/services/link-tracking/index.test.ts
      startup:
        summary: >-
          Boot awaits this init after route/custom redirects and before themes, Express route
          mounting, the main services phase and readiness. Despite the frontend-phase name,
          initialization also runs when frontend is disabled. Link tracking explicitly rejects
          if service is absent. No redirect rows are loaded during initialization. Successful
          newsletter composition exercises completed boot; lifecycle tests do not cover this
          wrapper's ordering, failed adapter/repository construction or backend-only startup.
        sources:
          - core/boot.js
          - core/server/services/link-redirection/index.js
          - core/frontend/web/routers/link-redirects.js
          - core/server/services/link-tracking/index.js
        tests:
          - test/integration/services/email-service/batch-sending.test.js
          - test/unit/server/services/link-tracking/index.test.ts
      lifetime:
        summary: >-
          The wrapper keeps its first successful graph across init calls and has no reset.
          Persistence outlives the graph; optional adapter caching stores positive results only.
          Clearing shared events leaves the guarded repository without its invalidator. Slugs
          use four random bytes and repeat lookup until unused, without an attempt limit or a
          transaction joining lookup/save; from has an index, not a unique constraint. Automation
          deduplication instead relies on a unique revision/destination-hash pair and rereads a
          concurrent winner after a duplicate error. Real MySQL tests prove convergence for
          concurrent same/different revisions, not ordinary slug races or root/cache lifetime.
        sources:
          - core/server/services/link-redirection/index.js
          - core/server/services/link-redirection/link-redirects-service.js
          - core/server/services/link-redirection/link-redirect-repository.js
          - core/server/data/schema/schema.js
        tests:
          - test/integration/services/link-redirection/automation-redirects.test.ts
          - test/unit/server/services/link-redirection/link-redirects-service.test.js
      configuration:
        summary: >-
          Init captures cache enablement/adapter and service base URL; later init does not refresh
          them. Repository URL helpers run per operation but shared URL utilities freeze site,
          subdirectory and Admin URL values at construction; test replacement is not production
          hot reload. Persistence strips the subdirectory and request query. Destination hashes
          use full URL.href, and edited means updated_at exceeds created_at by more than one
          second. Cache serialization keeps a subdirectory-bearing pathname: save/read keys differ
          and cached reconstruction can prefix the subdirectory again. Units pin root-URL cache
          results, timestamp thresholds and UUID substitution. The cache-hit fake supplies an
          absolute from URL rather than the serialized pathname, so no real serialization round
          trip or subdirectory behavior is pinned.
        sources:
          - core/server/services/link-redirection/index.js
          - core/server/services/link-redirection/link-redirect-repository.js
          - core/server/services/link-redirection/link-redirects-service.js
          - core/server/models/redirect.js
          - core/shared/url-utils.ts
          - core/shared/config/validated.ts
        tests:
          - test/unit/server/services/link-redirection/link-redirect-repository.test.js
          - test/unit/server/services/link-redirection/link-redirects-service.test.js
          - test/integration/services/link-redirection/automation-redirects.test.ts
      resources:
        summary: >-
          The repository borrows models and an adapter-manager-owned cache, registering an
          anonymous site.changed listener when enabled; it owns no timer, pool or outbound
          request. Cache writes and resets are not awaited, and no listener disposal or pending
          operation drain exists. RedirectEvent dispatch precedes destination substitution and
          HTTP 302; shared DomainEvents logs ordinary async subscriber failures without making
          them part of the response. Newsletter integration waits for test-only allSettled,
          while production redirect completion does not await analytics. The reset unit checks
          one invocation on an injected emitter, not resource ownership across restart.
        sources:
          - core/server/services/link-redirection/link-redirect-repository.js
          - core/server/services/link-redirection/link-redirects-service.js
          - core/server/lib/common/events.js
          - core/server/services/adapter-manager/index.ts
          - core/server/ghost-server.ts
          - package.json
        tests:
          - test/unit/server/services/link-redirection/link-redirect-repository.test.js
          - test/integration/services/email-service/batch-sending.test.js
      failures:
        summary: >-
          Repository/cache lookup and malformed-row errors propagate without a cache-error DB
          fallback. A synchronous cache write/serialization error can reject after persistence;
          rejected cache write/reset promises are detached. handleRequest catches errors into
          next, and missing rows call next without redirecting. It sets noindex/nofollow and
          replaces or removes UUID placeholders only when present; request m must match the
          hexadecimal UUID shape. Automation duplicate-key recovery returns a reread winner or
          rethrows, while other saves fail directly. Units pin that recovery and placeholder
          output with fakes, not cache faults, malformed stored rows, analytics failures or
          Express error responses. No-prefix unit cases simply inject a missing row; they do
          not prove route matching or service-side prefix validation.
        sources:
          - core/server/services/link-redirection/index.js
          - core/server/services/link-redirection/link-redirect-repository.js
          - core/server/services/link-redirection/link-redirects-service.js
          - core/frontend/web/routers/link-redirects.js
          - package.json
        tests:
          - test/unit/server/services/link-redirection/link-redirects-service.test.js
          - test/unit/server/services/link-redirection/link-redirect-repository.test.js
    unverified: []
    blockers:
      - >-
        Pin root exports, synchronous publication, failed/repeated init, retained frontend/link
        tracking consumers and backend-only boot. Decide how to restore invalidation after an
        event-bus reset and dispose partially constructed repositories without changing identity.
      - >-
        Add real cache composition contracts for hits, misses, disabled caching, edits and
        site.changed, including subdirectories. Source and an isolated actual-repository/URL-helper
        diagnostic show different save/read keys and duplicated subdirectory in cached link.from;
        this does not establish a changed HTTP destination. Preserve or deliberately fix that
        behavior separately; root-URL fakes do not protect it.
      - >-
        Cover cache read/write/reset failure channels, malformed model/cache rows, partial
        persistence and Express next/error behavior. Cache writes and invalidation are not
        awaited, so request success is not proof of settled cache work or safe shutdown.
      - >-
        Keep tested automation revision/hash uniqueness distinct from unprotected ordinary
        slug lookup/save. Test ordinary concurrent collisions, partial automation saves and
        cache-enabled races; existing real concurrency coverage uses caching disabled.
      - >-
        Strengthen redirect-event and newsletter click assertions to prove exact link/member
        delivery and behavior when analytics fails. Cover frontend subdirectory matching,
        query/placeholder encoding and unrelated encoded destination components using the real
        HTTP boundary; current method fakes do not establish those composition contracts.
