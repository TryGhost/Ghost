      construction:
        summary: >-
          Import loads shared URL utilities, URL service and permissions dependencies. Boot is
          the only production init caller found. init constructs a model-backed repository,
          a link service with a new home URL, then a controller retaining both. The constructors
          store dependencies without querying. A truthy service guards repeat calls. Repository
          publication precedes URL/service construction, and service publication precedes
          controller construction; there is no rollback of partial initialization. No other
