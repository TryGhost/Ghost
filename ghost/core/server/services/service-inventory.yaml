          init. Mail transport captures config then; email rendering reads settings, URL/from/
          reply-to/translation helpers per send and the bulk client resolves config/settings per
          call. The retained shared URL facade freezes base URLs. Config is immutable; injected
          test getters do not establish production hot reload.
          There is no root feature gate: checkout's member caller checks paid-members enablement,
          then GiftService validates tier, duration and Portal plans, preserving the cadence-only
