          - test/e2e-api/admin/automations.test.js
          - test/e2e-api/admin/automation-member-search.test.ts
      failures:
        summary: >-
          Missing config/site logs and publishes null; other initialization/signing errors
          propagate. JWT verification errors mean expired and trigger regeneration, with no
          fallback to static credentials if signing fails. Query build errors occur before
          fetch's catch, while caught request/parse errors log and return null. Automations
          catches preparation/token failures: browse falls back to database stats, but performance/
          runs report failure when their client/data is unavailable. Stats consumers separately
          catch query failures and use empty/zero results. Unit tests assert invalid-JWT expiry
          and fake HTTP/JSON failures returning null. Browse HTTP tests assert database fallback
          for missing configuration/token, empty local tokens, signing stubs and intercepted
          failed/malformed responses; performance/runs assert selected 500/no-SQL-fallback
          paths. Real signing-constructor faults, cleanup and provider rejection remain uncovered.
        sources:
          - core/server/services/tinybird/tinybird-service-wrapper.js
          - core/server/services/tinybird/tinybird-service.js
          - core/server/services/stats/utils/tinybird.js
          - core/server/services/stats/posts-stats-service.js
          - core/server/services/stats/content-stats-service.js
          - core/server/services/automations/automations-api.ts
          - core/server/services/automations/tinybird-automation-stats.ts
        tests:
          - test/unit/server/services/tinybird/tinybird-service.test.js
          - test/unit/server/services/stats/utils/tinybird.test.js
          - test/e2e-api/admin/automations.test.js
          - test/e2e-api/admin/automation-performance-stats.test.ts
          - test/e2e-api/admin/automation-runs.test.ts
    unverified: []
    blockers:
      - >-
        Pin root/barrel compatibility, init/reset return and receiver behavior, repeated
        construction and disabled/failed initialization with real boot consumers. Cover
        analytics gates changing after initial stats boot and settings readiness, including
        missing settings site_uuid when a configured site override exists.
      - >-
        Decide how migration preserves retained stats tokens alongside reread endpoint/site
        values and automation's current-instance lookup. Existing replacement tests use fake
        HTTP; add the relevant consumer paths before changing publication or reset semantics.
      - >-
        Protect exact token precedence, scope allowlist, captured site/workspace, cache signing
        counts, default lifetimes, the exact refresh boundary and custom options on a cached
        token. Define incomplete/local credentials and real signing failure behavior; current
        equality and selected-scope assertions are not complete cache/authentication contracts.
      - >-
        Cover query construction faults through retained stats consumers, and distinguish
        empty valid data from unavailability across stats and automations. Preserve browse's
        database fallback versus performance/run failures; intercepted HTTP cannot establish
        provider acceptance, production deadlines or shared transport disposal on stop/reset.
  tinybird-sync:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - tinybird-sync/index.ts
    notes: >-
      Eager composition exposes incremental automation-data sync and recurring registration.
      Jobs-service owns scheduling; preserve cursor, retry and shutdown behavior before migration.
    contracts:
      exports:
        summary: >-
          Named TypeScript exports scheduleJob and sync are receiver-independent async functions
          from one eagerly created closure, both resolving undefined. There is no public instance,
          init, reset or shutdown. The deep factory returns those two functions; sync helpers and
          the empty TinybirdSyncJob subclass are support, not separate application compositions.
          Factory units invoke the returned functions, but never import the real root; exact root
          shape, unbound calls and import identity are source-only.
        sources:
          - core/server/services/tinybird-sync/index.ts
          - core/server/services/tinybird-sync/tinybird-sync-service.ts
          - core/server/services/tinybird-sync/jobs/tinybird-sync-job.ts
        tests:
          - test/unit/server/services/tinybird-sync/index.test.ts
      construction:
        summary: >-
          The root calls createTinybirdSyncService at import with config/settings/logging
          facades, the current shared knex, Math.random and global fetch references, and date/ID
          factories. Construction only creates the scheduled flag and closures; no sync or
          recurring job begins until called. Each sync with valid ingest config launches both table helpers in
          parallel with one resolved ingest configuration; each helper pages its own cursor and
          serially posts its chunks. Production construction is only the root. Factory units
          use injected dependencies, SQLite and fake fetch; no real root composition test exists.
        sources:
          - core/server/services/tinybird-sync/index.ts
          - core/server/services/tinybird-sync/tinybird-sync-service.ts
          - core/server/services/tinybird-sync/sync-table-to-tinybird.ts
          - core/server/data/db/index.js
        tests:
          - test/unit/server/services/tinybird-sync/index.test.ts
      consumers:
        summary: >-
          Boot imports the root for job-handler registration and later recurring scheduling.
          The handler awaits sync through the retained root namespace and declares a dedicated
          tinybird-sync queue with concurrency one. No runtime direct factory/helper consumer
          or HTTP/CLI entry was found. Handler units assert one exact injected sync call and
          the queue declaration, not a real queued upload or deferred completion. The background
          boot harness asserts scheduling is reached after sibling email-analytics registration
          failures, using a stub root. Persisted cursor data also appears in the exporter backup
          table list; the exporter test asserts its output key, not a populated cursor round-trip.
        sources:
          - core/boot.js
          - core/server/services/jobs-service/register-job-handlers.ts
          - core/server/services/tinybird-sync/jobs/tinybird-sync-job.ts
          - core/server/data/exporter/table-lists.js
        tests:
          - test/unit/server/services/jobs-service/register-job-handlers.test.ts
          - test/unit/boot-email-analytics.test.ts
          - test/integration/exporter/exporter.test.js
      startup:
        summary: >-
          Normal boot prepares database/settings, imports this root during handler registration,
          then awaits jobs-service start. After reporting ready, it starts background setup
          without awaiting it; test environments skip recurring setup. Tinybird scheduling
          follows awaited activitypub.init, so an earlier rejection can prevent reaching it.
          Valid ingest configuration permits registration and sync without a labs gate.
          Factory units assert the fixed random cron, job class and missing-config no-op;
          the stub boot test
          proves reachability only, not complete startup readiness or failure ordering.
        sources:
          - core/boot.js
          - core/server/services/tinybird-sync/tinybird-sync-service.ts
          - core/server/services/tinybird-sync/get-ingest-config.ts
          - core/server/services/jobs-service/cron.ts
          - core/server/services/jobs-service/jobs-service.ts
        tests:
          - test/unit/server/services/tinybird-sync/index.test.ts
          - test/unit/boot-email-analytics.test.ts
      lifetime:
        summary: >-
          The scheduled flag is set before registration; a second call rejects, while a rejected
          scheduleRecurring clears it for retry. Successful registration has no reset. Default
          backend shutdown removes recurring timers, so same-process restart can retain a true
          root flag without a timer; direct sync calls also have no overlap guard. Scheduled
          deliveries are serialized only as strongly as the selected jobs backend supports,
          per process for the default backend. Watermarks persist by table_name alone, survive
          new closures and are not reset for changed site/destination. SQLite tests assert
          cursor ties across batches/later invocations; factory tests cover completed duplicate
          registration and backend rejection/retry, not pending races, root restart or overlap.
        sources:
          - core/server/services/tinybird-sync/tinybird-sync-service.ts
          - core/server/services/tinybird-sync/sync-table-to-tinybird.ts
          - core/server/services/jobs-service/index.ts
          - core/server/services/jobs-service/jobs-service.ts
          - core/server/adapters/jobs/InMemoryJobsBackend.ts
          - core/server/data/schema/schema.js
        tests:
          - test/unit/server/services/tinybird-sync/index.test.ts
          - test/unit/server/services/tinybird-sync/sync-table-to-tinybird.test.ts
      configuration:
        summary: >-
          scheduleJob and sync reread the captured config/settings facades. A pass retains
          its resolved endpoint, auth and site. Ingest requires a parseable
          tracker URL containing /.ghost/analytics/, a nonempty sync auth key and a configured
          stats.id or settings site UUID. It rewrites the path and remaps development loopback
          hosts to the gateway. Factory limits are 5000 rows, 9 MiB/1000 messages per chunk and
          a five-minute request signal; each table fixes its cutoff at now minus sixty seconds.
          Helper tests assert selected URL rewrites, site fallback and invalid URL/key rejection.
          SQLite/fake-fetch tests assert selected payload/cursor/chunk behavior; timeout coverage
          spies on AbortSignal.timeout only. Fixture-field inclusion tests are not an exact
          allowlist assertion. Immutable config and captured fetch/knex are not hot reload tests.
        sources:
          - core/server/services/tinybird-sync/index.ts
          - core/server/services/tinybird-sync/get-ingest-config.ts
          - core/server/services/tinybird-sync/tinybird-sync-service.ts
          - core/server/services/tinybird-sync/sync-table-to-tinybird.ts
          - core/server/lib/db-types/date.ts
          - core/shared/config/loader.ts
        tests:
          - test/unit/server/services/tinybird-sync/get-ingest-config.test.ts
          - test/unit/server/services/tinybird-sync/index.test.ts
          - test/unit/server/services/tinybird-sync/sync-table-to-tinybird.test.ts
          - test/unit/server/services/tinybird-sync/sync-targets.test.ts
      resources:
        summary: >-
          The root borrows knex and native global fetch, owns only closure state, and supplies
          jobs-service with recurring work. The default backend owns timers/queues and bounded
          draining; boot registers its shutdown, which does not abort active handlers after
          its deadline. Sync has no stop signal or disposer and creates timeout signals per
          upload. Successful fetch responses are not explicitly consumed/cancelled; transport
          lifetime remains with native fetch. Cursor writes use shared database connections.
          Generic backend tests assert recurring ticks stop and a released delivery can finish
          after shutdown; they do not exercise an upload or cursor write during shutdown.
          Sync tests use fake fetch and establish request contents/options, not transport cleanup.
        sources:
          - core/server/services/tinybird-sync/index.ts
          - core/server/services/tinybird-sync/sync-table-to-tinybird.ts
          - core/server/services/jobs-service/jobs-service.ts
          - core/server/adapters/jobs/InMemoryJobsBackend.ts
          - core/boot.js
        tests:
          - test/unit/server/adapters/jobs/in-memory-jobs-backend.test.ts
          - test/unit/server/services/tinybird-sync/index.test.ts
          - test/unit/server/services/tinybird-sync/sync-table-to-tinybird.test.ts
      failures:
        summary: >-
          Incomplete ingest config resolves without work. Individual table
          failures settle independently, then log without rejecting sync; a failed table can
          therefore coexist with a completed recurring delivery and retry on a later tick.
          Config or final error-logging exceptions still reject. Registration failure
          propagates and resets the flag, but logging/random exceptions after setting it
          and before the try do not. Boot catches scheduling failures only once reached.
          A helper advances its watermark only after all batch chunks succeed; accepted chunks
          can replay if a later chunk or watermark write fails. There is no upload/database
          transaction, locking, tombstone sync or guarantee against commits delayed beyond the
          safety lag. SQLite tests assert a missing table is logged without rejecting and a
          503 preserves the prior last_synced_id; they do not cover partial-chunk/write failures,
          long transactions, concurrent passes, native aborts or provider acceptance.
        sources:
          - core/server/services/tinybird-sync/tinybird-sync-service.ts
          - core/server/services/tinybird-sync/sync-table-to-tinybird.ts
          - core/server/services/jobs-service/jobs-service.ts
          - core/server/adapters/jobs/InMemoryJobsBackend.ts
          - core/boot.js
        tests:
          - test/unit/server/services/tinybird-sync/index.test.ts
          - test/unit/server/services/tinybird-sync/sync-table-to-tinybird.test.ts
    unverified: []
    blockers:
      - >-
        Add real-root and boot lifecycle coverage before changing eager composition. Preserve
        captured knex/fetch and receiver-independent exports. Resolve successful scheduling
        state surviving cleared backend timers on restart, pending registration/shutdown races,
        and startup being skipped after an earlier background-service failure.
      - >-
        Cover pass overlap, per-process versus cross-process serialization, late commits beyond
        the safety lag, updates around cursor ties and partial delivery/watermark write failure.
        Define replay, remote deduplication and deletion expectations; SQLite/fake-fetch cursor
        tests do not establish MySQL concurrency or exactly-once delivery.
      - >-
        Define progress when endpoint/site configuration changes because watermarks are keyed
        only by table. Pin missing-site/invalid-override fallback, exact field allowlists for
        both targets, changing cutoffs across passes, production batch/byte limits and a single
        oversized event. Current chunking sends an individually oversized line rather than
        rejecting it.
      - >-
        Cover upload cancellation and cursor writes during bounded shutdown, response-body
        disposal, real request deadlines and native-fetch failures. Retain table-failure
        continuation and registration retry, including exceptions before its protected await;
        current units do not prove provider ingestion or clean resource release.
  update-check:
    kind: directory
    disposition: review
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - update-check/index.js
    notes: >-
      Each permitted invocation constructs a checker and mail collaborators. Boot owns job
      registration and scheduling; decide the final capability owner without moving this
      business logic into the HTTP layer.
    contracts:
      exports:
        summary: >-
          CommonJS exports an async function with scheduleJobs(jobsService). It exposes no
          checker instance, init or shutdown. The implementation file exports the checker
          constructor; the TypeScript default job export has type update-check and an empty
          serializable payload.
        sources:
          - core/server/services/update-check/index.js
          - core/server/services/update-check/update-check-service.js
          - core/server/services/update-check/jobs/update-check-job.ts
        tests:
          - test/unit/server/services/update-check/schedule-update-check.test.ts
          - test/unit/server/services/update-check/jobs/update-check-jobs.test.ts
      construction:
        summary: >-
          Every invocation passing the environment/force gate constructs GhostMailer, its
          configured transport, NotificationEmailService and UpdateCheckService. The persisted
          next_update_check gate runs afterwards, so an early check still constructs these
          objects. The checker captures internal settings read/edit, users browse and
          notifications add pipeline functions. Only the root constructs the checker in
          runtime code; unit tests also construct it directly.
        sources:
          - core/server/services/update-check/index.js
          - core/server/services/update-check/update-check-service.js
          - core/server/lib/mail/ghost-mailer.js
          - core/server/api/endpoints/index.js
        tests: []
      consumers:
        summary: >-
          Boot calls scheduleJobs and centrally registers UpdateCheckJob with a handler that
          awaits the root with rethrowErrors true on the shared default jobs lane. The current
          in-memory backend invokes that handler in-process; no separate update-check worker,
          CLI or HTTP consumer was found. The checker itself calls API pipelines with internal
          context to read/write the due date, resolve active Owner/Administrator recipients
          for alerts and store notifications. Alerts await notification email before storage.
        sources:
          - core/boot.js
          - core/server/services/jobs-service/register-job-handlers.ts
          - core/server/services/jobs-service/jobs-service.ts
          - core/server/adapters/jobs/InMemoryJobsBackend.ts
          - core/server/services/update-check/update-check-service.js
          - core/server/api/endpoints/settings.js
          - core/server/api/endpoints/users.js
          - core/server/api/endpoints/notifications.js
        tests:
          - test/unit/server/services/jobs-service/register-job-handlers.test.ts
          - test/unit/server/services/update-check.test.js
          - test/integration/jobs/update-check.test.ts
      startup:
        summary: >-
          Foreground boot registers the handler and starts jobs before mounting the app and
          signalling readiness. Unawaited background startup skips test environments; otherwise
          it reaches update-check after recovery, other schedules and ActivityPub. scheduleJobs
          awaits a random daily recurring registration before optionally enqueueing a forced
          boot check. Enqueue completion does not wait for checking. There is no root readiness
          guard; direct calls rely on initialized API/settings and mail dependencies.
        sources:
          - core/boot.js
          - core/server/services/update-check/index.js
          - core/server/services/jobs-service/jobs-service.ts
          - core/server/lib/mail/ghost-mailer.js
        tests:
          - test/unit/server/services/update-check/schedule-update-check.test.ts
          - test/unit/boot-email-analytics.test.ts
          - test/integration/jobs/update-check.test.ts
      lifetime:
        summary: >-
          The root retains no checker or local scheduling flag. Repeated calls create fresh
          collaborators; concurrent checks have no local exclusion and share the persisted due
          date and notifications. Repeated scheduling generates another cron and repeats a
          forced enqueue. The in-memory jobs backend keeps the first recurring schedule per
          type until shutdown clears it. Jobs init reuses its instance and clears handlers;
          a subsequent boot must register handlers, restart jobs and schedule again.
        sources:
          - core/server/services/update-check/index.js
          - core/server/services/update-check/update-check-service.js
          - core/server/services/jobs-service/index.ts
          - core/server/services/jobs-service/jobs-service.ts
          - core/server/adapters/jobs/InMemoryJobsBackend.ts
          - core/boot.js
        tests:
          - test/unit/server/adapters/jobs/in-memory-jobs-backend.test.ts
          - test/unit/server/services/jobs-service/jobs-service.test.ts
      configuration:
        summary: >-
          Invocation defaults reread forceUpdate and endpoint; explicit options override them.
          Without forceUpdate only config environments production/development pass. A checker
          captures endpoint, notification groups, site URL, version and error policy, then
          reads next_update_check per check; force also bypasses that due-date gate. Requests
          use GET with only ghost_version in the query and a one-second request timeout; this
          root has no privacy flag gate. Custom notifications match configured groups plus all.
          Mail transport/options are read at construction; recipients and mail template site
          details are resolved when sending. scheduleJobs separately rereads forceUpdate.
        sources:
          - core/server/services/update-check/index.js
          - core/server/services/update-check/update-check-service.js
          - core/shared/config/helpers.ts
          - core/shared/config/defaults.json
          - core/server/lib/mail/ghost-mailer.js
          - core/server/lib/mail/index.js
          - core/server/lib/mail/email-content-generator.js
          - core/server/services/notifications/notification-email.ts
        tests:
          - test/unit/server/services/update-check.test.js
          - test/unit/server/services/update-check/schedule-update-check.test.ts
          - test/unit/shared/config/helpers.test.ts
          - test/integration/jobs/update-check.test.ts
      resources:
        summary: >-
          Jobs owns recurring timers and queued deliveries. Boot registers jobs shutdown with
          the configured timeout; the in-memory backend clears timers, drops waiting jobs and
          waits for active handlers until that deadline, without cancelling their requests or
          sends. The root awaits check, which normally awaits request, settings writes and
          sequential notification/email work. Each allowed invocation owns a mail transport,
          but neither the root nor GhostMailer exposes disposal. The request function and
          template generator are shared imports; no update-check cancellation hook exists.
        sources:
          - core/boot.js
          - core/server/services/jobs-service/jobs-service.ts
          - core/server/adapters/jobs/InMemoryJobsBackend.ts
          - core/server/services/update-check/index.js
          - core/server/services/update-check/update-check-service.js
          - core/server/lib/mail/ghost-mailer.js
          - core/server/lib/mail/index.js
          - core/server/services/notifications/notification-email.ts
        tests:
          - test/unit/server/adapters/jobs/in-memory-jobs-backend.test.ts
          - test/unit/server/services/jobs-service/jobs-service.test.ts
          - test/unit/server/services/notifications/notification-email.test.ts
      failures:
        summary: >-
          Scheduling failures reject to boot, which logs and continues to later background
          services. A request 404 becomes an empty result with a next-day due date. Other
          check errors call updateCheckError: it starts an unawaited next-day settings edit,
          annotates/logs the error and rethrows only when configured. Default alert recipient
          or send errors log and continue to notification storage; job mode rethrows and stops
          that check. Successful responses write the due date before notification work, so a
          later failure can leave partial state. Constructor failures bypass the checker
          error handler. Jobs logs/reports
          propagated delivery errors; its in-memory backend catches them and continues other
          work without retrying that delivery.
        sources:
          - core/boot.js
          - core/server/services/update-check/index.js
          - core/server/services/update-check/update-check-service.js
          - core/server/services/jobs-service/register-job-handlers.ts
          - core/server/services/jobs-service/jobs-service.ts
          - core/server/adapters/jobs/InMemoryJobsBackend.ts
        tests:
          - test/unit/server/services/update-check.test.js
          - test/unit/server/services/jobs-service/jobs-service.test.ts
          - test/unit/server/adapters/jobs/in-memory-jobs-backend.test.ts
    unverified: []
    blockers:
      - >-
        Choose the application/jobs capability owner and preserve the internal API pipeline
        behavior before changing composition. Current direct checker tests do not establish
        root export shape, construction count, pre-init behavior, environment/force gates,
        explicit overrides or live configuration changes end-to-end.
      - >-
        Add update-check-specific repeated/concurrent scheduling and restart/drain contracts.
        Generic backend tests cover first-registration wins, shutdown and queue restart, not
        this root's forced dispatches, actual recurring checks or overlapping due-date writes.
      - >-
        Characterize recurring registration and forced enqueue failures, including the partial
        state when enqueue fails after scheduling succeeds. Existing boot coverage continues
        after email analytics errors, not update-check scheduling errors or earlier ActivityPub
        failure; daily cron tests do not bound seconds/minutes or assert registration ordering.
      - >-
        updateCheckError neither awaits nor catches settings.edit. Its rejection can escape
        after check/job completion and is not drained as part of the handler. Decide and test
        this behavior before migration; helper tests use resolving stubs and only check calls,
        error annotation and rethrow, not timestamp persistence or failed writes.
      - >-
        Characterize request timeout/404/malformed/error responses, settings and notification
        write failures, invalid notification groups, and alert lookup/render/send failures in
        default and job modes. Successful job integration and helper-level rethrow tests do not
        prove that the real handler reports a failed update check or preserves later work.
      - >-
        Decide ownership and disposal for per-check mail transports and in-flight HTTP/email
        work, including shutdown timeout and late completion. Existing tests do not prove
        transport release or cancellation, and the one-second request option is not evidence
        of an overall deadline or of dependency-level retry/socket cleanup behavior.
  url:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - url/index.js
    notes: >-
      One eager LazyUrlService owns ordered router registrations. Preserve readiness,
      real serializer/model composition and the different forward, reverse and enumeration
      contracts; registration/reset and same-process restart still need lifecycle coverage.
    contracts:
      exports:
        summary: >-
          CommonJS exports one mutable LazyUrlService instance; the deep module exports the
          constructor both directly and as LazyUrlService. Receiver-dependent registration,
          reset, readiness, field/relation requirements, forward URL and ownership methods are
          synchronous; resolveUrl and getRoutableResources return promises. No init/stop exists.
          Forward misses use /404/, reverse misses null, and enumeration returns a fresh array.
          Class units assert selected results and readiness, not barrel identity, unbound
          methods or the entire runtime surface.
        sources:
          - core/server/services/url/index.js
          - core/server/services/url/lazy-url-service.ts
          - core/server/services/url/routable-resources.js
        tests:
          - test/unit/server/services/url/lazy-url-service.test.ts
      construction:
        summary: >-
          Import constructs the service with createFindResource(models), retaining the models
          facade and shared URL helper. Its constructor requires a lookup function and builds
          empty router/relation/diagnostic state plus static base/exclusion filters. Lookup
          dereferences model properties per call; enumeration resolves models/schema/database
          helpers when called. Construction itself performs no resource query or registration.
          Units construct injected implementations and exercise model-hook calls with fake
          models; they do not establish eager barrel timing or shared module identity.
        sources:
          - core/server/services/url/index.js
          - core/server/services/url/lazy-url-service.ts
          - core/server/services/url/lazy-find-resource.ts
          - core/server/services/url/routable-resources.js
        tests:
          - test/unit/server/services/url/lazy-url-service.test.ts
          - test/unit/server/services/url/lazy-find-resource.test.js
      consumers:
        summary: >-
          API serializers/search ask the retained root for fields/relations and URLs; frontend
          proxy/helpers/metadata, RouterManager and sitemap retain it too. Sitemap consumes and
          clears fresh enumeration arrays, then uses forward URLs to exclude /404/ resources.
          Service consumers include feedback, comments, imports, email, pings, machine payments,
          attribution, members, mentions, stats and webhooks. Real database integration drives
          input serializer/model/output mapper/root with manually registered primary-tag routes:
          full/narrow fields, internal/no tags, forced ID removal, relation IDs and tied tag order.
          HTTP asserts a page comment URL after uploading filtered routes and sitemap URLs after
          post/tag/author renames. Those cases do not protect every retained service/helper or
          every reverse consumer; wider wiring here is source-checked.
        sources:
          - core/server/api/endpoints/utils/serializers/input/utils/url.js
          - core/server/api/endpoints/utils/serializers/output/utils/url.js
          - core/server/api/endpoints/utils/serializers/input/comments.js
          - core/server/api/endpoints/search-index.js
          - core/server/api/endpoints/search-index-public.js
          - core/frontend/services/proxy.js
          - core/frontend/services/sitemap/site-map-manager.js
          - core/frontend/services/routing/router-manager.js
          - core/frontend/helpers/authors.js
          - core/frontend/helpers/tags.js
          - core/frontend/meta/url.js
          - core/frontend/meta/author-url.js
          - core/server/services/audience-feedback/index.js
          - core/server/services/comments/index.js
          - core/server/services/content-import/index.ts
          - core/server/services/email-service/email-service-wrapper.js
          - core/server/services/indexnow-ping/index.ts
          - core/server/services/machine-payments/index.js
          - core/server/services/member-attribution/index.js
          - core/server/services/members/api.js
          - core/server/services/mentions/service.js
          - core/server/services/slack-ping/index.ts
          - core/server/services/stats/service.js
          - core/server/services/webhooks/index.js
        tests:
          - test/integration/url-serialization.test.js
          - test/e2e-api/members-comments/comments-lazy-url-parity.test.js
          - test/e2e-frontend/sitemap-slug-rename.test.js
      startup:
        summary: >-
          Boot imports the root before dynamic routing, passes it to RouterManager even in
          backend-only mode, and awaits route-settings start/read before synchronous router
          registration. App maintenance checks hasFinished along with its other maintenance
          gates. Each individual registration sets readiness, rather than a separate completed
          graph publication. Reverse/enumeration need models/database; forward routing needs
          registered routes and caller-supplied records. Units pin new/one-registration/reset
          readiness. VM orchestration tests assert shared URL/router dependency identity,
          awaited route-settings start and original-error propagation in both frontend modes.
          Isolated HTTP tests assert backend-only configured post/tag URLs, changed URLs after
          upload through the same Content API consumer, and frontend-only canonical rendering.
          They do not establish atomic readiness across all registrations or top-level boot
          awaiting a pending initDynamicRouting call.
        sources:
          - core/boot.js
          - core/app.js
          - core/server/services/route-settings/dynamic-routing-service.js
          - core/frontend/services/routing/router-manager.js
          - core/server/services/url/lazy-url-service.ts
        tests:
          - test/e2e-server/boot-frontend-only.isolated.test.ts
          - test/e2e-server/boot-backend-only.isolated.test.ts
          - test/unit/boot-dynamic-routing.test.ts
          - test/unit/server/services/url/lazy-url-service.test.ts
          - test/e2e-api/members-comments/comments-lazy-url-parity.test.js
          - test/e2e-frontend/sitemap-slug-rename.test.js
      lifetime:
        summary: >-
          Registrations append in priority order without deduplication. reset replaces the
          router array and clears readiness/derived relations/diagnostic counters, retaining
          collaborators; onRouterUpdated only clears derived relations. Reverse memoization
          stores record/null per type and lookup within one call, not across requests. Bridge
          reads settings before reset/re-registration; its units hold/reject that read and
          assert fake reset/reload sequencing, not real HTTP availability. Class tests pin
          first-router ownership, reset and same-call lookup counts. Normal boot/stop cleanup,
          retained consumers during reset and overlapping lookups/reloads are source-only.
        sources:
          - core/server/services/url/lazy-url-service.ts
          - core/bridge.js
          - core/frontend/services/routing/router-manager.js
          - core/server/ghost-server.ts
        tests:
          - test/unit/server/services/url/lazy-url-service.test.ts
          - test/unit/bridge.test.js
      configuration:
        summary: >-
          Registration captures filter/type/permalink; current registrations determine fetched
          fields/relations. Forward routing applies published post/page and public-tag gates;
          authors have no base filter. Excluded fields are stripped before router filters.
          Reverse lookup scopes publication/visibility through model queries and validates
          captured segments against that router's permalink. Enumeration applies type gates,
          including published-post joins for tags/authors, not collection filters. Units pin
          these with fake models/URL helpers; integration pins actual primary-tag composition,
          selected columns/relations and public-tag inclusion/internal-tag exclusion. Shared
          URL bases are frozen; test config replacement is not production hot reload. This
          service passes no timezone to replacePermalink, whose package default is UTC; the
          timezone bridge event only invalidates required relations, with no cited boundary test.
        sources:
          - core/server/services/url/lazy-url-service.ts
          - core/server/services/url/config.js
          - core/server/services/url/lazy-find-resource.ts
          - core/server/services/url/routable-resources.js
          - core/server/services/url/router-filter.ts
          - core/shared/url-utils.ts
          - core/bridge.js
          - package.json
        tests:
          - test/unit/server/services/url/lazy-url-service.test.ts
          - test/unit/server/services/url/lazy-find-resource.test.js
          - test/unit/server/services/url/router-filter.test.ts
          - test/unit/server/services/url/routable-resources.test.js
          - test/integration/url-serialization.test.js
      resources:
        summary: >-
          The root owns router/filter/diagnostic memory, with no timer, subscription, network
          client or pool. Diagnostics count distinct causes without an explicit map bound.
          Borrowed model queries and enumeration have no root cancellation/drain. SQLite
          enumeration accumulates batches of 999 until an empty batch, with no cross-batch
          snapshot; other databases fetch once. Units assert fetch options and a synthetic
          result/empty SQLite pair, not real SQLite limits or concurrent writes. Real database
          integration checks selected returned records/fields. Sitemap caches and bridge
          settings subscriptions belong to consumers and are not reset/disposed by this root.
        sources:
          - core/server/services/url/lazy-url-service.ts
          - core/server/services/url/lazy-find-resource.ts
          - core/server/services/url/routable-resources.js
          - core/frontend/services/sitemap/site-map-manager.js
          - core/bridge.js
        tests:
          - test/unit/server/services/url/routable-resources.test.js
          - test/integration/url-serialization.test.js
      failures:
        summary: >-
          Thin forward records log structured errors at occurrence counts 1,10,100 and onward,
          then return /404/; unexpected URL/logger errors propagate. Units assert exact error
          details/counts and unexpected-error propagation; real model integration asserts
          missing tags degrades with a report. NQL evaluation errors warn and fail matching.
          Reverse misses and malformed path escapes return null; template construction, lookup
          and enumeration failures can reject. Matcher units pin selected malformed values and
          captures, not all invalid templates. Unknown enumeration types reject in real database
          integration. Failed bridge settings reads preserve fake routing state; faults after
          reset and query failure/recovery through real consumers lack equivalent assertions.
        sources:
          - core/server/services/url/lazy-url-service.ts
          - core/server/services/url/router-filter.ts
          - core/server/services/url/permalink-matcher.ts
          - core/server/services/url/lazy-find-resource.ts
          - core/server/services/url/routable-resources.js
          - core/bridge.js
        tests:
          - test/unit/server/services/url/lazy-url-service.test.ts
          - test/unit/server/services/url/router-filter.test.ts
          - test/unit/server/services/url/permalink-matcher.test.js
          - test/unit/bridge.test.js
          - test/integration/url-serialization.test.js
    unverified: []
    blockers:
      - >-
        Preserve the tested frontend-only/backend-only routing and VM startup barriers. Protect
        eager root identity, complete readiness across registration, partial registration
        failure, stop and same-process restart. Normal
        boot/stop does not reset URL registrations, and bridge.init appends settings listeners;
        define ownership before replacing the root or retaining this missing cleanup.
      - >-
        Exercise retained API/frontend/service consumers across reload and replacement, with
        pending queries and failures after reset. A reverse lookup already iterating the old
        array can continue after reset; current sequencing fakes do not prove atomic routing
        publication or protect stale results and overlapping reloads.
      - >-
        Characterize cross-router canonical ownership, subdirectory and timezone boundaries
        using actual URL helpers/models. Reverse lookup rechecks only its matched router, not
        the first forward owner; forward/reverse/enumeration gates deliberately differ. The
        date units inject a UTC helper and do not protect site-timezone changes.
      - >-
        Preserve exact serializer field/relation forwarding and response cleanup for all
        consumers before migrating. Existing database and HTTP cases cover important selected
        paths, not every service, author/page shape, malformed route or model-query failure.
        Add resource-bound and concurrent-write coverage before changing enumeration/cleanup.
  users.js:
    kind: file
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - users.js
    notes: >-
      Two endpoint modules currently construct this business service. Preserve transaction
      behavior and bound methods when moving composition under boot.
    contracts:
      exports:
        summary: >-
          CommonJS exports the Users constructor, not an initialized instance. Instances expose
          lockAll, assignTagToUserPosts and destroyUser; only assignTagToUserPosts is bound in
          the constructor. lockAll resolves an object with count, while tagging and destruction resolve
          without a result. Tests construct the class and cover locking/tagging calls, not
          export shape or detached invocation.
        sources:
          - core/server/services/users.js
        tests:
          - test/unit/server/services/users/users-service.test.js
      construction:
        summary: >-
          Authentication and users endpoints each construct and retain a separate Users at
          module evaluation. The constructor captures mutable models, auth, apiMail and
          apiSettings references and binds one method; current methods only use models.
          destroyUser constructs a PostRevisions helper per call. No other runtime constructor
          was found. These composition and identity boundaries have no direct assertions.
        sources:
          - core/server/services/users.js
          - core/server/api/endpoints/authentication.js
          - core/server/api/endpoints/users.js
          - core/server/lib/post-revisions.ts
        tests: []
      consumers:
        summary: >-
          Admin user deletion calls the users endpoint's retained instance. Authentication
          reset passes its own instance to auth.resetAuthentication, which calls lockAll inside
          a transaction shared with key rotation and audit creation; session deletion and
          rescheduling happen afterward. assignTagToUserPosts has no external runtime caller
          found. HTTP tests prove deletion, owner reassignment, internal tagging and successful
          authentication reset; reset orchestration units inject lockAll rather than this class.
        sources:
          - core/server/api/endpoints/users.js
          - core/server/api/endpoints/authentication.js
          - core/server/services/auth/reset-authentication.ts
          - core/server/web/api/endpoints/admin/routes.js
          - core/server/services/users.js
        tests:
          - test/e2e-api/admin/users.test.js
          - test/legacy/api/admin/users.test.js
          - test/legacy/api/admin/authentication.test.js
          - test/unit/server/services/auth/reset-authentication.test.ts
      startup:
        summary: >-
          Users has no init or readiness guard and performs no I/O during construction. Endpoint
          evaluation constructs it; boot does not initialize it explicitly. Normal endpoint loading
          occurs through the lazy Admin router, potentially after readiness. The update-check job
          can separately force api.users.browse while composing its checker, constructing the
          users endpoint and its otherwise-unused Users instance outside an Admin request. HTTP composition
          also resolves mail/settings API collaborators; the settings endpoint constructs its
          BREAD helper at import, and authentication resolves its scheduling adapter then. These
          endpoint dependencies are not used by Users methods. HTTP tests use completed boot,
          not premature endpoint import or composition failure.
        sources:
          - core/server/services/users.js
          - core/server/api/endpoints/users.js
          - core/server/api/endpoints/authentication.js
          - core/server/api/endpoints/settings.js
          - core/server/services/settings/settings-service.js
          - core/server/api/endpoints/index.js
          - core/server/services/update-check/index.js
          - core/shared/express.js
          - core/server/web/parent/backend.js
          - core/server/web/api/app.js
          - core/server/web/api/endpoints/admin/app.js
          - core/server/web/api/endpoints/admin/routes.js
          - core/boot.js
        tests:
          - test/e2e-api/admin/users.test.js
          - test/legacy/api/admin/authentication.test.js
      lifetime:
        summary: >-
          Endpoint module caching retains two instances and their collaborators. No init/reset,
          pending-operation guard or instance-local result cache exists. lockAll clones options
          when opening its own transaction and otherwise uses the caller's transaction.
          destroyUser always opens a new transaction and overwrites the caller's transacting
          field; it does not reuse an outer transaction. The lock unit proves no nested callback
          when an outer transaction is supplied, not lifetime, concurrency or options isolation.
        sources:
          - core/server/services/users.js
          - core/server/api/endpoints/users.js
          - core/server/api/endpoints/authentication.js
        tests:
          - test/unit/server/services/users/users-service.test.js
      configuration:
        summary: >-
          This root reads no configuration or settings values. Operations use current model
          results and per-call id/context/transacting options; retained auth/mail/settings
          collaborators are presently unused. Tagging derives an internal tag from the current
          author slug, reuses it by hash slug, avoids already-tagged posts and inserts new links
          with sort_order zero. Unit tests pin reuse/skip behavior and HTTP tests pin tag name
          and position; they do not cover concurrent tag creation or author changes.
        sources:
          - core/server/services/users.js
        tests:
          - test/unit/server/services/users/users-service.test.js
          - test/legacy/api/admin/users.test.js
      resources:
        summary: >-
          The service borrows shared models/database transactions; it creates no pool, timer,
          subscription or mail transport. lockAll sequentially awaits model locks without sending
          mail. Deletion nulls revision authors, tags posts and records actions, reassigns posts,
          removes the staff API key and destroys the user within its transaction. Tagging emits
          PostsBulkAddTagsEvent before that transaction commits; dispatch does not await handlers
          and has no compensation; no current Core subscriber was found despite the collection
          update comment. Tests prove selected persisted outcomes and mocked helper
          arguments, not full rollback, event settlement or shutdown drain.
        sources:
          - core/server/services/users.js
          - core/server/lib/post-revisions.ts
          - core/server/models/user.js
          - core/server/models/relations/authors.js
          - core/shared/events-ts/posts-bulk-add-tags-event.ts
          - package.json
        tests:
          - test/unit/server/services/users/users-service.test.js
          - test/unit/server/lib/post-revisions.test.ts
          - test/e2e-api/admin/users.test.js
          - test/legacy/api/admin/authentication.test.js
      failures:
        summary: >-
          Model/helper failures reject and stop later work; only ApiKey.NotFoundError is ignored
          during deletion. Managed transaction callbacks provide the database rollback boundary,
          but cannot undo an already-dispatched tag event. The users endpoint returns the async
          deletion promise inside try without awaiting it, so that catch does not remap its
          rejected promise. Authentication reset failures after commit can leave users locked
          despite a failed response. Existing success tests and fake-transaction short-circuit
          tests do not establish rollback or those partial-failure responses.
        sources:
          - core/server/services/users.js
          - core/server/api/endpoints/users.js
          - core/server/services/auth/reset-authentication.ts
          - core/server/api/endpoints/authentication.js
        tests:
          - test/unit/server/services/auth/reset-authentication.test.ts
          - test/e2e-api/admin/users.test.js
          - test/legacy/api/admin/authentication.test.js
    unverified: []
    blockers:
      - >-
        Pin the two retained endpoint instances, bound tagging method and model-reference
        behavior before sharing composition. Test repeated boot and import prerequisites;
        moving construction must account for currently retained but unused API collaborators.
      - >-
        Add real transaction failure tests across lockAll and each deletion stage, including
        revision authors, tags/actions, coauthors, API keys, roles and user deletion. Current
        unit transactions are callback fakes and the reset failure test proves short-circuiting,
        not database rollback. Preserve caller transaction/options behavior explicitly.
      - >-
        Characterize tag-event delivery before commit and failed transactions. Existing units
        replace dispatch; source search found no current Core subscriber, so collection updates
        cannot be inferred from the producer comment. Record concurrent
        deletion/tag creation and pending-operation shutdown rather than inferring safety from
        the absence of owned timers.
      - >-
        Pin deletion error identity and HTTP status for failures inside the async service,
        optional missing API keys, and authentication reset failures after commit. Root lock
        tests simulate user.lock; model units assert save arguments, while real reset HTTP
        coverage proves a successful fixture path, not suspended-user rollback or recovery.
  verification:
    kind: directory
    disposition: review
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - verification/verification-webhook-service.ts
    notes: >-
      Members retains this eager webhook sender through VerificationTrigger. Its owner remains
      under review; preserve signed delivery and the trigger's delivery-before-persistence
      contract without treating test config replacement as production hot reload.
    contracts:
      exports:
        summary: >-
          The deep TypeScript module exports VerificationWebhookService and an eager
          verificationWebhookService. There is no index, init, reset or shutdown API. The
          receiver-dependent async sendVerificationWebhook accepts amountTriggered, threshold
          and method, returning false for missing URL/type, true for a fulfilled request, or
          rejecting on failure. Payload types are compile-time constraints, not runtime
          validation. Unit tests construct injected instances; HTTP tests reach the real
          singleton but do not pin export shape or unbound invocation.
        sources:
          - core/server/services/verification/verification-webhook-service.ts
        tests:
          - test/unit/server/services/verification/verification-webhook-service.test.ts
          - test/e2e-api/admin/members.test.js
      construction:
        summary: >-
          Module import loads config, logging, signed-webhook helpers and the shared request
          module, then constructs one sender. The constructor only retains dependencies; it
          does not read feature config or send. Callers can construct the exported class with
          all three injected dependencies. Members is the only runtime importer found and
          binds the singleton method when constructing its trigger. Tests exercise injected
          construction and real consumer behavior, without a direct construction/identity test.
        sources:
          - core/server/services/verification/verification-webhook-service.ts
          - core/server/services/members/service.js
          - core/server/lib/signed-webhook.ts
        tests:
          - test/unit/server/services/verification/verification-webhook-service.test.ts
          - test/e2e-api/admin/members.test.js
      consumers:
        summary: >-
          VerificationTrigger is the sender's sole direct runtime consumer. Member-created
          events, member-import bookkeeping and newsletter preflight reach that trigger;
          methods identify admin, api, import or removed_recipients. The trigger awaits true
          before editing email_verification_required and updating the cache; false/rejection
          leaves it unmarked. Real HTTP tests assert a signed admin payload, removed-recipient
          payload/blocking and import delivery followed by suppression of another sequential
          delivery. They do not establish concurrent deduplication or every source's real
          transport behavior; trigger units use an injected webhook callback.
        sources:
          - core/server/services/members/service.js
          - core/server/services/verification-trigger.js
          - core/server/services/members/import-export/import/importer.ts
          - core/server/services/email-service/email-service.js
          - core/server/api/endpoints/members.js
        tests:
          - test/e2e-api/admin/members.test.js
          - test/legacy/api/admin/members-importer.test.js
          - test/unit/server/services/verification-trigger.test.js
      startup:
        summary: >-
          The sender is usable immediately after import and has no readiness/configuration
          guard beyond per-call URL/type checks. Boot initializes members in the required
          service batch after core settings and Stripe; members constructs its trigger after
          publishing its API and binds this sender before later asynchronous migration work.
          Standalone sender calls need no settings/database, whereas the trigger's queries and
          persistence do. HTTP tests use completed boot and do not characterize import timing,
          pre-boot direct sends or partial members initialization.
        sources:
          - core/boot.js
          - core/server/services/members/service.js
          - core/server/services/verification/verification-webhook-service.ts
        tests:
          - test/e2e-api/admin/members.test.js
          - test/legacy/api/admin/members-importer.test.js
      lifetime:
        summary: >-
          Module caching retains the singleton, and the private members trigger guard retains
          its bound sender across repeated initialization. Each send snapshots config and builds
          local body, timestamp and options; it keeps no delivery state or in-flight promise.
          There is no deduplication, cancellation or reset. Concurrent trigger calls can each
          send before either persists the required flag. Sequential suppression is tested in
          the importing consumer; singleton identity, restart and overlapping sends are not.
        sources:
          - core/server/services/verification/verification-webhook-service.ts
          - core/server/services/verification-trigger.js
          - core/server/services/members/service.js
        tests:
          - test/legacy/api/admin/members-importer.test.js
      configuration:
        summary: >-
          Each send calls the retained config accessor for webhookType, webhookUrl,
          webhookSecret and siteId. URL/type require nonempty strings, without trimming;
          non-string siteId becomes null, and absent/non-string/empty secret sends unsigned.
          The helper JSON-serializes once, signs timestamp:body using base64 HMAC-SHA256 when
          configured, and adds byte length, content type/version and timestamp headers.
          Retry-limit selection reads process.env.NODE_ENV per send. Tests configure the
          already-booted sender through test set/reset and verify signed payloads; this is
          accessor behavior, not a production reload facility. Unsigned/default/type boundaries
          and most headers are source-only.
        sources:
          - core/server/services/verification/verification-webhook-service.ts
          - core/server/lib/signed-webhook.ts
          - core/shared/config/validated.ts
          - core/shared/config/SCHEMA.md
        tests:
          - test/unit/server/services/verification/verification-webhook-service.test.ts
          - test/e2e-api/admin/members.test.js
      resources:
        summary: >-
          Each send awaits shared HTTP infrastructure with a 30-second request timeout and
          retry.limit zero in test environments or five elsewhere. The installed request/got
          defaults exclude POST from normal retries, so that option alone does not establish
          retry delivery. The request module owns a shared DNS cache/resolver and unref'd
          housekeeping timers; this root owns no dedicated transport, timer or listener.
          It exposes no abort, outstanding-request tracking or shutdown drain. Trigger event
          subscriptions and database work belong to its consumer. Existing tests intercept
          successful HTTP or inject a rejection; they do not exercise timeout/retry/drain.
        sources:
          - core/server/services/verification/verification-webhook-service.ts
          - core/server/lib/signed-webhook.ts
          - core/server/services/verification-trigger.js
          - core/server/ghost-server.ts
          - package.json
        tests: []
      failures:
        summary: >-
          Missing URL/type warns and resolves false; only missing type is unit-tested. Request
          throw/rejection is logged then rethrown, provided logging succeeds. Log prefixes use
          URL origin or an invalid-URL placeholder; error.message is appended unchanged.
          Config reads, serialization/signing and pre-request logging are outside the delivery
          catch. VerificationTrigger catches sender rejection and resolves needsVerification
          false without persisting; subsequent persistence/cache failures reject after remote
          delivery without compensation. Tests prove a logged injected request rejection and
          no-write trigger behavior, not preparation failures, post-delivery failure or exact
          error identity through the full composition.
        sources:
          - core/server/services/verification/verification-webhook-service.ts
          - core/server/lib/signed-webhook.ts
          - core/server/services/verification-trigger.js
        tests:
          - test/unit/server/services/verification/verification-webhook-service.test.ts
          - test/unit/server/services/verification-trigger.test.js
    unverified: []
    blockers:
      - >-
        Settle members ownership before relocation or a managed lifecycle. Pin the eager
        export, retained bound sender, repeated boot and direct pre-boot behavior; an audited
        entry does not establish migration readiness or authorize changing these contracts.
      - >-
        Cover missing/invalid URL and type, unsigned/non-string secrets, null/non-string siteId,
        all wire headers, exact request-error identity and preparation/logging failures. Current
        sanitization tests cover the destination prefix, not redaction of appended error text.
      - >-
        Characterize actual POST retry, timeout/redirect and pending-request shutdown behavior
        before relying on retry.limit or adding cleanup. Shared DNS/request resources need
        explicit ownership; a request timeout is not a service drain or cancellation API.
      - >-
        Test overlapping trigger sources and successful remote delivery followed by failed
        persistence/cache publication. Sequential suppression and intercepted successful
        deliveries do not prove exactly-once delivery, atomic state change or recovery.
      - >-
        Keep current source/config snapshots distinct from a future reload design. Feature
        schema validation and stricter input handling can change warn/false/reject behavior;
        introducing them during lifecycle migration needs separate compatibility evidence.
  verification-trigger.js:
    kind: file
    disposition: relocate
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - verification-trigger.js
    notes: >-
      Members owns this trigger and its event subscription. Preserve threshold calculations,
      the webhook-before-persistence sequence and caller-specific failure behavior before
      relocation; concurrent triggers and listener cleanup remain open contracts.
    contracts:
      exports:
        summary: >-
          CommonJS exports the VerificationTrigger constructor, not a singleton or init API.
          Instances expose async getImportThreshold, checkVerificationRequired,
          testImportThreshold and testRemovedRecipientsThreshold plus underscore methods,
          callback fields and threshold getters. Methods require their receiver except the
          constructor-bound event handler. checkVerificationRequired returns true when
          sending requires verification; getImportThreshold has no production caller found.
        sources:
          - core/server/services/verification-trigger.js
          - core/server/services/members/service.js
        tests:
          - test/unit/server/services/verification-trigger.test.js
      construction:
        summary: >-
          Members is the only runtime constructor found. After constructing its API it
          creates the trigger once, retaining that API's event repository, shared Settings,
          live configuration/cache callbacks, recipient queries and a bound webhook sender.
          The constructor synchronously subscribes to MemberCreatedEvent only if unverified
          then; it does not query counts or send a request. Tests usually stub subscription
          and construct the class directly, with two cases exercising actual dispatch.
        sources:
          - core/server/services/verification-trigger.js
          - core/server/services/members/service.js
          - core/server/services/verification/verification-webhook-service.ts
        tests:
          - test/unit/server/services/verification-trigger.test.js
      consumers:
        summary: >-
          Members exports the retained trigger and closes over it for inline/deferred imports.
          Import bookkeeping checks thresholds after row writes. Member-add HTTP calls check
          before adding and disables welcome mail when required. EmailService retains the
          trigger and checks with newsletterSend true before sending. MemberCreatedEvent
          reaches the bound API/admin handler after member signup-event persistence; transactional
          dispatch waits for commit. HTTP tests cover real member creation, intercepted signed
          webhook requests and newsletter blocking;
          importer failure tests instead inject a throwing trigger.
        sources:
          - core/server/services/members/service.js
          - core/server/services/members/import-export/import/importer.ts
          - core/server/api/endpoints/members.js
          - core/server/services/email-service/email-service-wrapper.js
          - core/server/services/email-service/email-service.js
          - core/server/services/members/members-api/repositories/member-repository.js
          - core/server/services/verification-trigger.js
        tests:
          - test/e2e-api/admin/members.test.js
          - test/integration/services/email-service/batch-sending.test.js
          - test/unit/server/services/email-service/email-service.test.js
          - test/unit/server/services/members/import-export/import/error-handling.test.ts
      startup:
        summary: >-
          Boot invokes members.init before emailService.init in the required service batch.
          Members synchronously publishes the trigger before its later Stripe migration await,
          so email construction can capture it. No trigger readiness guard exists; callbacks
          assume settings, models and the members event repository are usable. Later members
          initialization failure can leave the published trigger and subscription in place.
          Existing HTTP coverage uses complete boot, not this partial-initialization boundary.
        sources:
          - core/boot.js
          - core/server/services/members/service.js
          - core/server/services/email-service/email-service-wrapper.js
          - core/server/services/verification-trigger.js
        tests:
          - test/e2e-api/admin/members.test.js
      lifetime:
        summary: >-
          The private members variable retains one trigger across repeated init; its exported
          property can be replaced without changing the import closures or EmailService's
          retained reference. No reset/unsubscribe exists. Initial verified state determines
          subscription presence permanently for that instance. Later verification/config
          changes affect callbacks but do not add or remove the listener. The required-setting
          check suppresses already completed triggers; it is not a pending-request guard,
          so overlapping events/checks can send before either writes the setting.
        sources:
          - core/server/services/members/service.js
          - core/server/services/verification-trigger.js
          - core/server/services/email-service/email-service.js
          - core/server/ghost-server.ts
        tests: []
      configuration:
        summary: >-
          Thresholds and verified/required state are read live through callbacks. Only finite
          numeric thresholds enable checks; comparisons trigger strictly above the boundary.
          API/admin use recent source totals against max(configured threshold, all-time
          source-member signup-event total),
          with a pagination-based current-event adjustment. Imports compare recent imports
          against max(configured threshold, that signup-event total minus recent imports); the separate
          getImportThreshold helper does not subtract imports. These event totals are not a
          count of current members. Removed-recipient checks run
          only for newsletter sends, use a cheap recent-volume bound, then count distinct
          addresses absent from members up to threshold plus one. Recent query windows use 30
          days. Unit tests pin threshold arithmetic and query arguments against fake totals;
          HTTP tests pin selected triggering outcomes, not the real signup
          query meaning, every date boundary or all removed-recipient query semantics.
        sources:
          - core/server/services/verification-trigger.js
          - core/server/services/members/service.js
          - core/server/services/members/members-api/repositories/event-repository.js
        tests:
          - test/unit/server/services/verification-trigger.test.js
          - test/e2e-api/admin/members.test.js
      resources:
        summary: >-
          An unverified instance owns a bound listener retained by shared DomainEvents. Queries
          borrow shared database/model/repository owners; the webhook sender uses shared HTTP
          infrastructure with a 30-second request timeout and explicit retry-limit options.
          The trigger creates no timer or dedicated connection and retains no cancellation,
          pending-work queue or shutdown hook. DomainEvents catches/logs handler rejections;
          allSettled tracks test delivery only and is not a production drain. Dispatch units
          use fake repositories and HTTP tests intercept delivery; neither establishes
          timeout/retry behavior or resource cleanup.
        sources:
          - core/server/services/verification-trigger.js
          - core/server/services/members/service.js
          - core/server/services/verification/verification-webhook-service.ts
          - core/server/lib/signed-webhook.ts
          - core/server/ghost-server.ts
          - package.json
        tests:
          - test/unit/server/services/verification-trigger.test.js
          - test/e2e-api/admin/members.test.js
      failures:
        summary: >-
          False or rejected webhook delivery resolves needsVerification false without writing
          the setting. Successful delivery is followed by awaited Settings.edit, then an
          explicit synchronous cache update; persistence/cache errors reject after delivery
          without compensation. Optional throwOnTrigger produces EMAIL_VERIFICATION_NEEDED
          after state change, but current runtime callers request no throw. Count/callback
          errors reject direct callers; event delivery logs them. Import bookkeeping reports
          failures while keeping committed rows/results, whereas HTTP/email checks propagate.
          Unit tests prove payloads, no-write delivery failures and exact setting/cache arguments,
          not persistence failures, concurrency or atomic state publication.
        sources:
          - core/server/services/verification-trigger.js
          - core/server/services/members/import-export/import/importer.ts
          - core/server/api/endpoints/members.js
          - core/server/services/email-service/email-service.js
        tests:
          - test/unit/server/services/verification-trigger.test.js
          - test/unit/server/services/members/import-export/import/error-handling.test.ts
          - test/e2e-api/admin/members.test.js
    unverified: []
    blockers:
      - >-
        Pin retained trigger identity, members-to-email boot ordering, construction failure
        and repeated boot/cleanup. Test initially verified then unverified and the reverse:
        subscription presence is captured at construction while the decisions read live state.
      - >-
        Characterize simultaneous events, import completion and newsletter checks through
        webhook delivery and setting/cache publication. No shared promise or atomic guard
        establishes single delivery. Existing HTTP cases settle events between operations.
      - >-
        Restore precise first-crossing coverage. The member HTTP test adds another member
        past the threshold and accepts an inexact reported count. Its sibling-writer race
        explanation predates the repository awaiting signup-event persistence before dispatch;
        it is not evidence of that race today. Pin transactional publication and pagination
        behavior with current production composition, rather than preserving stale commentary.
      - >-
        Cover successful delivery followed by Settings.edit or cache-update failure, changed
        verification state while delivery is pending, malformed callbacks and retry behavior.
        Assert direct request, event-handler and import-bookkeeping outcomes separately;
        source-only failure channels are not all exercised by the existing delivery tests.
      - >-
        Establish event-listener and in-flight request/query ownership before relocation or
        lifecycle disposal. A raw DomainEvents listener cannot be removed through a trigger
        API today; test-only allSettled and a request timeout do not establish shutdown drain.
  webhooks:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - webhooks/index.js
      - webhooks/webhooks-service.js
    notes: >-
      Boot owns event dispatch; a separate deep factory supplies the Admin management endpoint.
      Preserve both compositions and distinguish transaction-deferred events from durable delivery.
    contracts:
      exports:
        summary: >-
          CommonJS root exports synchronous, receiver-independent listen, returning undefined.
          It exposes no trigger instance, init or disposer. The deep webhooks-service factory
          returns a fresh receiver-dependent WebhooksService with async add; the trigger class
          and serialize/payload/listener factories are private support. The endpoint retains
          one management instance and uses its add, while edit/destroy call the model directly.
          HTTP tests cover selected management results; the one factory unit only asserts an
          injected add error is rethrown. Exact root shape, returns and receivers are source-only.
        sources:
          - core/server/services/webhooks/index.js
          - core/server/services/webhooks/webhooks-service.js
          - core/server/services/webhooks/webhook-trigger.js
          - core/server/api/endpoints/webhooks.js
        tests:
          - test/unit/server/services/webhooks/webhook-service.test.js
          - test/e2e-api/admin/webhooks.test.js
      construction:
        summary: >-
          Every listen call requires models/limits/events/URL/member dependencies, creates a
          serializer and payload closure plus WebhookTrigger, then registers event callbacks.
          Transport is selected once per trigger unless injected. Member metafields use a
          callback reading membersService.api when invoked, rather than a captured member API.
          The management endpoint constructs its own service at module evaluation, normally
          reached during lazy Admin router setup. No other production constructor/deep consumer
          was found. Units test injected trigger and serializer construction, including transport
          choice; repeated real-root composition and dependency replacement are untested.
        sources:
          - core/server/services/webhooks/index.js
          - core/server/services/webhooks/webhook-trigger.js
          - core/server/services/webhooks/serialize.js
          - core/server/api/endpoints/webhooks.js
          - core/server/api/endpoints/index.js
          - core/server/web/api/app.js
          - core/server/web/api/endpoints/admin/app.js
          - core/shared/express.js
        tests:
          - test/unit/server/services/webhooks/trigger.test.js
          - test/unit/server/services/webhooks/serialize.test.js
      consumers:
        summary: >-
          Boot calls listen. Common model events drive post/page/tag/member delivery; response
          finish with full cache invalidation emits site.changed. Listeners skip importing and
          launch trigger without awaiting it. The Admin endpoint separately adds definitions
          and authorizes management. HTTP suites exercise selected publish/add/edit payloads
          through real API/model composition and a Nock-backed receiver; custom-field tests
          assert current/previous values and omissions. Import suppression is checked after
          importer settlement plus a bounded wait, not a webhook drain. These tests establish
          intercepted payloads, not durable delivery, every event or external receiver behavior.
          A focused local run completed custom-field payload assertions but reproducibly timed
          out draining DomainEvents after the create-with-fields case; settlement remains a gap.
        sources:
          - core/boot.js
          - core/server/services/webhooks/listen.js
          - core/server/models/post.js
          - core/server/models/tag.js
          - core/server/models/member.js
          - core/server/web/parent/middleware/emit-events.js
          - core/server/api/endpoints/webhooks.js
        tests:
          - test/e2e-webhooks/posts.test.js
          - test/e2e-webhooks/pages.test.js
          - test/e2e-webhooks/tags.test.js
          - test/e2e-webhooks/members.test.js
          - test/e2e-webhooks/site.test.js
          - test/e2e-webhooks/zapier-custom-fields.test.ts
          - test/e2e-webhooks/posts-importer.test.ts
          - test/e2e-api/admin/webhooks.test.js
      startup:
        summary: >-
          Importing the root defers model/service construction until listen. Boot prepares
          models, limits and dynamic routing before invoking listen alongside service init;
          member access is deferred until serialization. Listen registers synchronously and
          does not wait for any delivery. Management construction has no boot hook and can
          occur on the first Admin request. Existing HTTP suites exercise a normal booted
          pipeline, not explicit settings/member/URL readiness failures, listener registration
          ordering or rollback after a later initializer fails.
        sources:
          - core/boot.js
          - core/server/services/webhooks/index.js
          - core/server/services/webhooks/listen.js
          - core/server/web/parent/backend.js
          - core/server/web/api/app.js
          - core/server/web/api/endpoints/admin/routes.js
        tests:
          - test/e2e-webhooks/members.test.js
          - test/e2e-api/admin/webhooks.test.js
      lifetime:
        summary: >-
          Registration skips any event already having a callback named processWebhookTrigger;
          repeated listen therefore creates new collaborators but retains previous callbacks
          and triggers for registered events. No unsubscribe/reset exists. Each trigger queries
          definitions afresh, builds one payload, and awaits sends serially; separate events
          can overlap without a shared queue. Models are retained by reference across async
          serialization. Model transactions defer event emission until committed=true, using
          mutable model state, not a persisted delivery record. Units assert one payload for
          two hooks, not serial completion. Members HTTP tests capture an emitted model then
          call the serializer directly; they do not prove rollback-safe network delivery.
        sources:
          - core/server/services/webhooks/index.js
          - core/server/services/webhooks/listen.js
          - core/server/services/webhooks/webhook-trigger.js
          - core/server/services/webhooks/serialize.js
          - core/server/lib/common/events.js
          - core/server/models/base/plugins/events.js
          - core/server/models/base/bookshelf.js
        tests:
          - test/unit/server/services/webhooks/trigger.test.js
          - test/e2e-api/members/webhooks.test.js
      configuration:
        summary: >-
          The trigger captures transport according to security:allowWebhookInternalIPs:
          default false uses request-external; true uses @tryghost/request. Existing listeners
          retain that choice. Limits are consulted per event; URL relations and the current
          members API are read during serialization. Every delivery reads stored target/secret,
          sends current Ghost Content-Version rather than stored api_version, and optionally
          signs JSON body plus timestamp with HMAC-SHA256. Request options ask for two seconds
          and retry limit five outside tests, zero in tests; installed Got excludes POST from
          retry methods, so the limit alone does not enable retries. Units assert transport,
          body/headers and exact signature; they do not assert production timing/retry policy.
          Test config replacement does not establish hot reload of captured collaborators.
        sources:
          - core/server/services/webhooks/index.js
          - core/server/services/webhooks/webhook-trigger.js
          - core/server/services/webhooks/serialize.js
          - core/server/services/limits.ts
          - core/server/lib/request-external.js
          - core/shared/config/defaults.json
        tests:
          - test/unit/server/services/webhooks/trigger.test.js
          - test/unit/server/services/webhooks/serialize.test.js
          - test/e2e-webhooks/site.test.js
      resources:
        summary: >-
          The root retains common EventEmitter callbacks and borrows shared models/services
          and HTTP transports. There is no jobs-service queue, delivery outbox, replay worker,
          in-flight registry, stop hook or drain. Transaction event deferral is memory-only.
          request-external owns shared keep-alive agents; @tryghost/request owns a shared DNS
          cache with unref'd cleanup timers. Neither is disposed by this root. Trigger awaits
          each request and a 410 destroy, but last-triggered edits are launched without awaiting
          persistence. Success-only Nock transport tests use fake models/payload/limits and
          prove POST routing for both clients, not socket cleanup or database completion.
        sources:
          - core/server/services/webhooks/index.js
          - core/server/services/webhooks/listen.js
          - core/server/services/webhooks/webhook-trigger.js
          - core/server/lib/common/events.js
          - core/server/lib/request-external.js
          - core/server/models/base/plugins/events.js
          - core/server/data/schema/schema.js
        tests:
          - test/integration/services/webhook-request.test.ts
      failures:
        summary: >-
          Lookup/payload failures log and return without sends. Ordinary asynchronous request
          failures call onError and allow the loop to continue; JSON/HMAC/model-getter, synchronous
          request or callback/logger exceptions outside preparation can reject an unobserved
          trigger. Update/destroy rejection only warns. Source reveals a transport mismatch:
          default request-external retains HTTP status on error.response.statusCode, while
          onError reads error.statusCode for 410 removal and status persistence; the alternate
          request wrapper flattens response fields. Existing tests inject shaped errors or only
          intercept 200, so this is an uncovered source finding, not a reproduced delivery bug.
          Management rejects duplicates and translates selected foreign-key errors; check/add
          has no atomic uniqueness guard. HTTP tests assert duplicate/orphan 422 and selected
          management statuses; units assert payload failure logging and injected error text.
        sources:
          - core/server/services/webhooks/webhook-trigger.js
          - core/server/services/webhooks/webhooks-service.js
          - core/server/models/webhook.js
          - core/server/lib/request-external.js
          - core/server/data/schema/schema.js
          - core/server/api/endpoints/webhooks.js
        tests:
          - test/unit/server/services/webhooks/trigger.test.js
          - test/unit/server/services/webhooks/webhook-service.test.js
          - test/integration/services/webhook-request.test.ts
          - test/e2e-api/admin/webhooks.test.js
    unverified: []
    blockers:
      - >-
        Protect both real compositions, root exports, lazy management construction and repeated
        listen/partial registration behavior. Decide how retained listener dependencies, captured
        transport and event-time member access survive restart without duplicates or leaked listeners.
      - >-
        Add real commit/rollback-to-delivery coverage and deferred-request assertions for ordering,
        failure continuation and shutdown. Preserve import suppression and current/previous payloads
        without assuming mutable event models are snapshots or intercepted sends are durable.
        On committed=false the model retains ghostEvents; reuse would skip registering another
        transaction callback. No production reuse path or reproduction has been established.
      - >-
        Reproduce and resolve default-transport error status handling, especially 410 deletion
        and recorded status, using actual Got errors. Pin POST retry behavior, timeouts, transport
        policy and signature compatibility; test overrides and success-only requests hide these gaps.
      - >-
        Cover persistence failures, unawaited last-triggered writes, synchronous/post-preparation
        exceptions and concurrent duplicate creation. Define delivery/replay and disposal ownership
        before adding a lifecycle; existing code has no durable queue or drain.
