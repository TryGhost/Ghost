          - core/server/adapters/scheduling/signed-flush-scheduler.ts
          - core/server/adapters/scheduling/error-capture.ts
          - core/server/adapters/scheduling/scheduling-default.ts
          - core/server/services/jobs-service/register-job-handlers.ts
          - core/server/ghost-server.ts
          - package.json
        tests:
          - test/unit/server/services/gifts/gift-delivery-service.test.ts
          - test/unit/server/adapters/scheduling/signed-flush-scheduler.test.ts
      failures:
        summary: >-
          Checkout persists gift/delivery before Stripe and attempts pending-row deletion on
          session failure; later session-binding failure has no compensation. Completion commits
          before best-effort dispatch/staff/buyer notices. Redemption updates member/gift/delivery
          and automation in a transaction; external transactions defer notification through an
          unreturned executionPromise continuation. Reminders commit their marker before mail,
          count per-gift failures and propagate poll failure; cleanup catches each phase and
          continues. Delivery claims pending or hour-stale sending rows, records acceptance with
          one persistence retry, and excludes failed/cancelled rows from recovery. Best-effort
          buyer/analytics failures do not undo acceptance. Unit fakes assert selected failure
          results/calls, not SQL rollback. Booted job tests assert expiry, reminder mail/markers,
          repeated-run suppression and injected failure logs; event integration asserts durable
          acceptance/cancellation with mail mocked, not exactly-once external delivery.
        sources:
          - core/server/services/gifts/gift-service.ts
          - core/server/services/gifts/gift-delivery-service.ts
          - core/server/services/gifts/gift-delivery-bookshelf-repository.ts
          - core/server/services/gifts/gift-bookshelf-repository.ts
          - core/server/services/gifts/gift-email-service.ts
          - core/server/services/gifts/index.ts
          - core/server/data/schema/schema.js
        tests:
          - test/unit/server/services/gifts/gift-service-interface.test.ts
          - test/unit/server/services/gifts/gift-service.test.ts
          - test/unit/server/services/gifts/gift-delivery-service.test.ts
          - test/integration/services/gifts/clean-gifts.test.ts
          - test/integration/services/gifts/send-gift-reminders.test.ts
          - test/integration/services/members/send-gift-reminders.test.js
          - test/integration/services/gifts/gift-delivery-processing.test.ts
    unverified: []
    blockers:
      - >-
        Add real-root export, repeated-init/changed-options, pre-init and partial-failure contracts.
        Failure after mail/scheduler construction can leave retained resources; failure after
        service publication suppresses retry and can leave missing subscriptions. Existing boot
        dependency fakes prove Stripe ordering, not construction rollback or readiness guards.
      - >-
        Define and test shutdown/restart ownership across domain handlers, unawaited boot recovery,
        external-transaction continuations, mail transport and signed scheduler registrations.
        Captured controller/job/event/analytics implementations do not follow replacement bindings.
        Per-invocation recovery limits do not bound overlapping recovery calls globally.
      - >-
        Cover production recovery's reschedule flag, error continuation, initial delivery/reminder
        registrations and key rotation using real root wiring. Only delivery callbacks are rebuilt
        by recoverPendingDeliveries; reminders rely on existing callbacks, key rotation or the daily
        job after restart. Deep scheduler tests and HTTP tests with dispatch stubbed do not prove
        the full callback-to-delivery path.
      - >-
        Characterize recurring-job concurrent scheduling, retry after rejection and same-process
        backend restart. Successful module flags are never reset; current cron regex bounds hours
        but not seconds/minutes. The production error wrapper can leave a signed time marked armed
        after a reported adapter failure; daily recovery is the backstop, not immediate retry.
      - >-
        Protect transaction/side-effect boundaries with real persistence fault tests: checkout
        delivery creation, Stripe session binding, member/gift/automation redemption, refund races
        and import reassignment. Unit transaction tokens/fulfilled executionPromise and invocation
        order do not prove commit/rollback; sequential webhook duplicate-row coverage does not prove
        concurrent completion or notification uniqueness.
      - >-
        Preserve and decide failure semantics explicitly: reminders may be missed after their
        marker commits; buyer notices have no durable retry; recipient mail can repeat after a
        crash or a send outlasting the one-hour stale threshold. Claims have no heartbeat/fencing
        token, and acceptance can precede failed persistence. Existing claim races and mocked mail
        are not evidence of crash-safe or exactly-once transport behavior.
      - >-
        Cover failed template/partial loads retained in renderer caches, real-root mail/config
        capture and delivery/analytics failure interaction. Existing policy/transport fakes and
        test config changes do not establish replacement behavior or production hot reload.
  i18n.js:
    kind: file
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - i18n.js
    notes: >-
      Preserve the live delegating functions and translation options while establishing
      ownership of repeated initialization and locale listeners. Other translation
      instances have separate owners and are not consumers of this facade.
    contracts:
      exports:
        summary: >-
          CommonJS exports init, changeLanguage, dir and t; no instance, reset or shutdown
          is exposed. init synchronously returns undefined. The other arrow functions
          assert initialization, forward all arguments to the current private instance and
          return its result without depending on their receiver. changeLanguage returns
          the library promise; t and dir return their synchronous library results. Consumer
          tests assert translated nickname text, not the facade export shape, init return,
          receiver independence or dir behavior.
        sources:
          - core/server/services/i18n.js
          - package.json
        tests:
          - test/unit/server/services/members/members-api/services/payments-service.test.js
      construction:
        summary: >-
          Import creates only the facade and debug helper. Every init lazily loads the
          workspace i18n package, shared events and settings cache, creates a fresh ghost
          namespace translator, publishes it, then adds an anonymous locale listener.
          Boot is the only production init caller found. Email-service, member welcome
          emails and theme translation construct independent package instances; they do
          not initialize or share this facade's private translator.
        sources:
          - core/server/services/i18n.js
          - core/boot.js
          - core/server/services/email-service/email-service-wrapper.js
          - core/server/services/member-welcome-emails/service.js
          - core/frontend/services/theme-engine/i18next/theme-i18n.js
          - package.json
        tests: []
      consumers:
        summary: >-
          Members mail callbacks, donation payment nicknames, comment email subjects and
          rendering, staff device-verification mail, gifts mail/renderers and gift-preview
          controllers retain t. Stripe keeps the module and reads t at use time. Retained
          facade functions still delegate to the latest translator. No production caller
          of this root's dir or changeLanguage was found. Real-root consumer tests cover
          English gift labels/previews, French donation labels and booted signup subjects;
          comment-renderer locale tests instead inject a separate package translator.
        sources:
          - core/server/services/members/api.js
          - core/server/services/members/members-api/services/payments-service.js
          - core/server/services/comments/comments-service-emails.js
          - core/server/services/comments/comments-service-email-renderer.js
          - core/server/services/auth/session/index.js
          - core/server/services/auth/session/session-service.js
          - core/server/services/gifts/index.ts
          - core/server/services/gifts/gift-email-service.ts
          - core/server/services/gifts/gift-email-renderer.ts
          - core/server/web/gift-preview/controller.js
          - core/server/services/stripe/stripe-api.js
        tests:
          - test/unit/server/services/members/members-api/services/payments-service.test.js
          - test/unit/server/services/stripe/stripe-api.test.js
          - test/unit/server/web/gift-preview/controller.test.js
          - test/e2e-api/members/send-magic-link.test.js
          - test/unit/server/services/comments/comments-service-emails-renderer.test.ts
      startup:
        summary: >-
          initCore awaits init after settings and signing keys, before frontend/application
          services. The current package initializes synchronously from local resources,
          so init's undefined return does not leave translation loading pending. Requiring
          or retaining t before init is safe; invoking it is not. init itself has no settings
          readiness guard and falls back to English if the cache is uninitialized. Existing
          unit consumers manually init; signup HTTP tests exercise booted English output.
        sources:
          - core/boot.js
          - core/server/services/i18n.js
          - core/shared/settings-cache/cache-manager.js
          - package.json
        tests:
          - test/unit/server/services/stripe/stripe-api.test.js
          - test/unit/server/web/gift-preview/controller.test.js
          - test/e2e-api/members/send-magic-link.test.js
      lifetime:
        summary: >-
          Exports remain stable across init while the private translator is replaced. Each
          init appends a listener that dereferences the latest variable, so old listeners
          repeatedly change the newest translator rather than pinning old translators.
          No guard, listener removal or GhostServer cleanup exists. Language changes retain
          loaded locale bundles in the current translator. A library t returned through
          changeLanguage is bound to that instance, unlike the exported delegating t.
        sources:
          - core/server/services/i18n.js
          - core/server/lib/common/events.js
          - core/server/ghost-server.ts
          - package.json
        tests: []
      configuration:
        summary: >-
          init captures settings locale or en and fixes the ghost namespace. Later model locale
          edits pass their value directly to changeLanguage; per-call options are forwarded and
          settings are not reread by t. The package loads requested/fallback locale files lazily,
          falls back through English and Norwegian no to nb, uses phrase keys and single-brace
          interpolation, and escapes interpolation by default for ghost. Many consumers explicitly
          disable escaping. Independent email/theme translators have their own locale listeners;
          manually changing this facade does not change them. Core tests pin French donation
          nicknames, unescaped titles and English gift labels; Stripe's translated-label case
          stubs t. Locale loading/fallback and listener behavior here are source-only.
        sources:
          - core/server/services/i18n.js
          - core/server/data/schema/default-settings/default-settings.json
          - core/server/services/members/api.js
          - core/server/services/members/members-api/services/payments-service.js
          - core/server/services/email-service/email-service-wrapper.js
          - core/server/services/member-welcome-emails/service.js
          - core/bridge.js
          - package.json
        tests:
          - test/unit/server/services/members/members-api/services/payments-service.test.js
          - test/unit/server/services/stripe/stripe-api.test.js
      resources:
        summary: >-
          The root owns its translator reference and locale subscriptions on the borrowed
          process EventEmitter. Nested i18next state includes resources, translation/format
          state and internal listeners; local JSON reads are synchronous. This configured
          path installs no remote backend, watcher, timer or dedicated connection. Locale
          resources are not pinned in require's cache. No root operation drains, unsubscribes
          or resets state; settings changes are delivered immediately or after transaction
          commit, with rolled-back changes suppressed by the model event layer.
        sources:
          - core/server/services/i18n.js
          - core/server/lib/common/events.js
          - core/server/models/settings.js
          - core/server/models/base/plugins/events.js
          - core/server/ghost-server.ts
          - package.json
        tests: []
      failures:
        summary: >-
          Pre-init calls synchronously assert. Dependency, settings or factory exceptions
          escape init and abort boot; a factory failure leaves any prior instance intact,
          while listener-registration failure occurs after replacement. Unreadable or invalid
          locale JSON is treated as missing by the package, with English/key fallback.
          The locale callback neither catches errors nor returns/awaits changeLanguage;
          synchronous exceptions escape raw event delivery and can interrupt later listeners.
          The current local-resource path changes language synchronously despite returning
          a promise. The facade adds no retry, rollback or error translation.
        sources:
          - core/server/services/i18n.js
          - core/server/lib/common/events.js
          - core/server/models/base/plugins/events.js
          - core/boot.js
          - package.json
        tests: []
    unverified: []
    blockers:
      - >-
        Pin exact exports/returns, pre-init assertions, importing before init, retained t
        across re-init, and real boot ordering. Existing manually initialized consumers
        and English signup output do not characterize replacement or failure boundaries.
      - >-
        Characterize repeated init and same-process stop/reboot listener counts, callback
        multiplicity and cleanup without affecting independent email/theme subscribers.
        Preserve the distinction between a retained delegating t and an instance-bound
        translator returned by changeLanguage; there is no production cleanup today.
      - >-
        Exercise real settings edits and transaction commit/rollback through retained mail,
        gift and payment consumers, including fallback locales, direction and escaping.
        Direct French changeLanguage coverage does not test the settings listener; package
        translation tests and separate renderer instances do not prove this root's wiring.
      - >-
        Cover failed first/repeated init, registration failure after publication, malformed
        locale events and callback failures. Decide the contract before introducing any
        asynchronous resource loader: boot and raw event delivery currently rely on local
        synchronous initialization and do not own pending language-change work.
  identity-tokens:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - identity-tokens/index.js
    notes: >-
      Staff identity-token issuance is boot-owned; preserve the captured issuer and identity
      provider while keeping signing-key selection live.
    contracts:
      exports:
        summary: >-
          The CommonJS root re-exports IdentityTokenServiceWrapper with static async init and
          writable instance, initially undefined. The implementation file separately exports
          the IdentityTokenService constructor and getTokenForUser instance method; there is
          no validation API or shutdown hook.
        sources:
          - core/server/services/identity-tokens/index.js
          - core/server/services/identity-tokens/identity-token-service-wrapper.js
          - core/server/services/identity-tokens/identity-token-service.ts
        tests: []
      construction:
        summary: >-
          The wrapper is the only production construction site found. First init captures the
          absolute admin URL and signingKeys.getInstance().forPurpose(staff), then publishes
          IdentityTokenService synchronously within the async method. A truthy instance makes
          later calls return without reconstructing dependencies.
        sources:
          - core/server/services/identity-tokens/identity-token-service-wrapper.js
          - core/server/services/signing-keys/signing-key-service.ts
        tests: []
      consumers:
        summary: >-
          Boot calls init. The authenticated identities endpoint reads the current instance
          for each request, passing the user's email and loaded role; failed role loading logs
          a warning and passes null. ActivityPub instead retains the instance supplied during
          its initialization and uses it to sign an Owner token for remote configuration.
          Existing API tests verify Owner/Administrator JWTs through HTTP JWKS and reject an
          Editor; they do not cover wrapper replacement or ActivityPub's real token connection.
        sources:
          - core/boot.js
          - core/server/api/endpoints/identities.js
          - core/server/web/api/endpoints/admin/routes.js
          - core/server/services/activitypub/activity-pub-service-wrapper.js
          - core/server/services/activitypub/activity-pub-service.ts
        tests:
          - test/legacy/api/admin/identities.test.js
      startup:
        summary: >-
          initCore awaits signing-key initialization before initServices awaits identity init
          with other prerequisites. ActivityPub background init checks instance and logs then
          returns if it is absent; the identities endpoint dereferences it without that guard.
          Importing this root alone does not initialize signing keys or issue a token.
        sources:
          - core/boot.js
          - core/server/services/identity-tokens/identity-token-service-wrapper.js
          - core/server/api/endpoints/identities.js
          - core/server/services/activitypub/activity-pub-service-wrapper.js
        tests: []
      lifetime:
        summary: >-
          Normal repeated initialization retains one process-local instance, issuer and
          purpose provider, with no reset path. The provider closes over its SigningKeyService
          and reads that service's settings cache on use. Each token call allocates its own
          claims object; no user or role is stored on the shared service.
        sources:
          - core/server/services/identity-tokens/identity-token-service-wrapper.js
          - core/server/services/identity-tokens/identity-token-service.ts
          - core/server/services/signing-keys/signing-key-service.ts
        tests: []
      configuration:
        summary: >-
          The issuer URL is captured at construction; the retained provider supplies a key
          per call. Tokens use email as sub, include role only for string arguments, and use
          RS256, a five-minute expiry and the provider's kid. The unit test verifies a token's
          subject, role, issuer and kid, but not live rotation or exact expiry.
        sources:
          - core/server/services/identity-tokens/identity-token-service-wrapper.js
          - core/server/services/identity-tokens/identity-token-service.ts
          - core/server/services/signing-keys/signing-key-service.ts
        tests:
          - test/unit/server/services/identity-tokens/identity-token-service.test.ts
      resources:
        summary: >-
          This service stores only issuer and provider references; it acquires no timer,
          listener, network client or database connection. Signing uses the shared key
          service and its public-key metadata cache. The wrapper has no cleanup registration
          or tracking of in-flight token calls; key storage and rotation belong to dependencies.
        sources:
          - core/server/services/identity-tokens/identity-token-service-wrapper.js
          - core/server/services/identity-tokens/identity-token-service.ts
          - core/server/services/signing-keys/signing-key-service.ts
          - core/server/lib/public-jwk.ts
        tests: []
      failures:
        summary: >-
          Dependency lookup or construction failure rejects init before instance assignment,
          leaving a later call able to try again. Missing/invalid signing keys and JWT signing
          failures reject token issuance without a local retry or fallback. The endpoint only
          catches role lookup failures; ActivityPub catches token/request failures in its own
          remote-configuration methods.
        sources:
          - core/server/services/identity-tokens/identity-token-service-wrapper.js
          - core/server/services/identity-tokens/identity-token-service.ts
          - core/server/api/endpoints/identities.js
          - core/server/services/activitypub/activity-pub-service.ts
        tests: []
    unverified: []
    blockers:
      - >-
        Add wrapper-level contracts for pre-init use, failed initialization/retry and retained
        consumers across issuer changes, signing-key rotation and repeated boot without
        reloading modules. Current constructor/API tests do not prove these lifetimes.
      - >-
        Characterize optional-role and exact-expiry behavior, concurrent token calls and
        signing failures through real consumers. ActivityPub's unit tests inject a fake token
        service, so they cannot catch a broken root-to-provider connection.
  indexnow-ping:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: c2999f4e13da6360bceced808bb52c4a04b5ad03
    entryPoints:
      - indexnow-ping/index.ts
    notes: >-
      Preserve post-event gating, live settings and request error reporting. Root lifecycle,
      verification-route compatibility and production retry behavior still need contracts.
    contracts:
      exports:
        summary: >-
          The TypeScript default export is one wrapper exposing synchronous init and a public
          writable service field, initially undefined. CommonJS boot uses .default; init
          returns no instance. The implementation exports IndexNowPingService for direct
          construction and exposes its dependencies, bound listener and operation methods.
        sources:
          - core/server/services/indexnow-ping/index.ts
          - core/server/services/indexnow-ping/indexnow-ping-service.ts
          - core/boot.js
        tests: []
      construction:
        summary: >-
          Import constructs only the wrapper. First init loads shared settings/config, URL
          services, request, logging and model events, constructs the implementation, assigns
          service, then subscribes. Later init calls skip construction and subscription.
          The wrapper is the only runtime construction path found; class tests inject fakes
          except for the real request helper.
        sources:
          - core/server/services/indexnow-ping/index.ts
          - core/server/services/indexnow-ping/indexnow-ping-service.ts
        tests: []
      consumers:
        summary: >-
          Boot is the only runtime root importer. Post model events invoke the listener for
          post.published and post.published.edited, after commit when a transaction is supplied.
          Import events and events without changed SEO fields return early; others pass post
          JSON plus authors and tags to a detached ping. No runtime deep constructor or direct
          ping caller was found. The frontend key-verification middleware independently reads
          the same setting; it does not import this service.
        sources:
          - core/boot.js
          - core/server/models/post.js
          - core/server/models/base/plugins/events.js
          - core/server/services/indexnow-ping/indexnow-ping-service.ts
          - core/server/services/indexnow-ping/constants.ts
          - core/server/services/content-import/import/importer.ts
          - core/frontend/web/middleware/serve-indexnow-key.js
        tests:
          - test/unit/server/services/indexnow-ping/indexnow-ping-service.test.js
      startup:
        summary: >-
          Boot initializes settings and dynamic routing before calling init in its required
          service Promise.all, before readiness, including backend-only boot. Subscription
          completes synchronously without checking key availability or sending a request;
          disabled/private/development configurations still subscribe. The settings model
          generates the key as a default, and frontend middleware serves its matching path.
          Synchronous init failure rejects required startup.
        sources:
          - core/boot.js
          - core/server/services/indexnow-ping/index.ts
          - core/server/services/indexnow-ping/indexnow-ping-service.ts
          - core/server/models/settings.js
          - core/frontend/web/site.js
          - core/frontend/web/middleware/serve-indexnow-key.js
        tests: []
      lifetime:
        summary: >-
          The wrapper retains one implementation and its bound listener. Direct subscribeEvents
          removes that same callback before registering it for each event, but cannot remove
          another instance's callback. Repeated wrapper init does not restore externally
          removed listeners. Neither wrapper nor implementation exposes reset, unsubscribe or
          shutdown. EventEmitter delivery is synchronous; ping completion is detached, with no
          serialization, deduplication of pending work or retained completion handle.
        sources:
          - core/server/services/indexnow-ping/index.ts
          - core/server/services/indexnow-ping/indexnow-ping-service.ts
          - core/server/lib/common/events.js
          - core/boot.js
          - core/server/ghost-server.ts
        tests: []
      configuration:
        summary: >-
          Each ping reads live environment, site privacy, privacy.useIndexNow, key and URL
          providers. Development, pages, private sites, disabled privacy and listed default
          slugs skip delivery. SEO fields and the IndexNow endpoint are module constants.
          Requests carry url, key and keyLocation with a five-second request timeout. Key
          lookup accepts any truthy value, while the verification middleware requires an exact
          matching 32-character lowercase hex path. Class tests cover representative gates
          and the url query, but not live changes, keyLocation or the verification route.
        sources:
          - core/server/services/indexnow-ping/indexnow-ping-service.ts
          - core/server/services/indexnow-ping/constants.ts
          - core/frontend/web/middleware/serve-indexnow-key.js
          - core/server/models/settings.js
        tests:
          - test/unit/server/services/indexnow-ping/indexnow-ping-service.test.js
      resources:
        summary: >-
          The implementation owns two model-event registrations and starts untracked HTTP
          requests. Boot registers no cleanup; no cancellation or drain is exposed. The shared
          request dependency owns DNS lookup/cache state and unref'ed cache-maintenance timers;
          HTTP timeout and retry work belongs to that helper and Got. This root creates no
          database connection, dedicated HTTP agent, scheduler or durable queue. Its borrowed
          settings, URL services and event bus outlive individual deliveries.
        sources:
          - core/server/services/indexnow-ping/index.ts
          - core/server/services/indexnow-ping/indexnow-ping-service.ts
          - core/server/lib/common/events.js
          - core/boot.js
          - core/server/ghost-server.ts
          - package.json
        tests: []
      failures:
        summary: >-
          Subscription failure leaves service assigned, so another init skips retry.
          Missing/unresolved URLs and absent keys warn and return; 200/202 log success, 429
          logs rate_limited, 403/422 key_validation_failed and other errors ping_failed.
          Ordinary URL-resolution/request errors are logged and swallowed. Model access in
          the synchronous listener can throw; config gates precede ping's try and their
          rejection is silently swallowed by the listener. Production GETs inherit Got
          retries despite the no-retry comment; the request helper disables retries under
          test environments. Class HTTP tests establish final classification, not production
          attempts, timeout duration or event-to-persistence failure isolation.
        sources:
          - core/server/services/indexnow-ping/index.ts
          - core/server/services/indexnow-ping/indexnow-ping-service.ts
          - core/server/models/base/plugins/events.js
          - package.json
          - vitest.config.ts
        tests:
          - test/unit/server/services/indexnow-ping/indexnow-ping-service.test.js
    unverified: []
    blockers:
      - >-
        Add root/boot contracts for exports, initialization identity, disabled first init,
        partial subscription failure and restart after listener removal. The class subscription
        test only checks event names and call count on a fake bus, not callback identity or
        duplicate prevention. Decide listener disposal and pending-request drain ownership.
      - >-
        Pin the real post-model/event/URL-service boundary, including transactional publication,
        import suppression and author/tag-filtered routes. Current tests invoke the class with
        fake models and URL services; no assertion establishes full publishing-path behavior.
        Characterize synchronous model errors, pre-try config failures and logging failures.
      - >-
        Cover live setting changes, complete query encoding/keyLocation, subdirectory sites
        and the actual key-verification route. The route and ping accept different key shapes;
        existing getApiKey tests deliberately accept a non-hex key. Test the generated-key
        contract before changing either side.
      - >-
        Resolve the no-retry comment against actual transport behavior: production Got GETs
        permit two retries for eligible statuses/errors, while test mode disables retries.
        Characterize production backoff/timeouts and stop with pending requests; the current
        HTTP classification tests do not establish these lifecycle contracts.
  integrations:
