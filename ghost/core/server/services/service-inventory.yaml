  email-analytics:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - email-analytics/index.ts
      - email-analytics/jobs/index.js
    notes: >-
      Preserve independent newsletter, automation and gift pipelines and their separate
      scheduling entry point. Distinguish job completion, cursor persistence and downstream
      event settlement; partial initialization and same-process restart remain obligations.
    contracts:
      exports:
        summary: >-
          Named TypeScript exports are synchronous init and guarded getNewsletters,
          getAutomations and getGifts. Getters return retained wrappers; init returns undefined.
          Wrappers expose service plus startFetch and individual count-returning fetch methods;
          service exposes mutable status references, scheduling/cancellation and detailed fetch
          results. The CommonJS jobs entry exports three receiver-independent async scheduling
          functions, all no-ops in test environments. Root units substitute wrapper constructors
          and assert pre-init guards, distinct identities, constructor arguments and repeated
          init retention. Admin HTTP snapshots assert initial newsletter status, not scheduling
          or cancellation completion. Exact return/receiver behavior is otherwise source-only.
        sources:
          - core/server/services/email-analytics/index.ts
          - core/server/services/email-analytics/email-analytics-service-wrapper.ts
          - core/server/services/email-analytics/email-analytics-service.ts
          - core/server/services/email-analytics/jobs/index.js
          - core/server/api/endpoints/emails.js
        tests:
          - test/unit/server/services/email-analytics/index.test.ts
          - test/e2e-api/admin/emails.test.js
          - test/e2e-api/admin/__snapshots__/emails.test.js.snap
      construction:
        summary: >-
          Init constructs one Queries retaining the supplied knex, newsletter storage/event
          processor, and three wrappers with separate job names, tags and cursor seeds. Each
          wrapper constructs an EmailAnalyticsService; each fetch creates a batch processor,
          while newsletter storage, pending updates and provider-ID cache are shared across its
          fetches. MailgunClient and its SDK client are created per provider fetch. The separate
          jobs entry eagerly constructs a scheduler borrowing models/config; its callback
          resolves the current jobs instance per registration. Boot is the production root
          initializer; no other deep implementation composition was found. Root units check
          injected constructor arguments/counter registration, not real constructor failures.
        sources:
          - core/server/services/email-analytics/index.ts
          - core/server/services/email-analytics/email-analytics-service-wrapper.ts
          - core/server/services/email-analytics/email-analytics-service.ts
          - core/server/services/email-analytics/jobs/index.js
          - core/server/services/email-analytics/jobs/email-analytics-job-scheduler.ts
          - core/server/services/email-analytics/fetch-mailgun-events.ts
          - core/server/services/email-analytics/lib/queries.ts
          - core/server/services/email-service/email-event-processor.js
          - core/server/services/email-service/newsletter-email-event-storage.js
          - core/server/lib/mailgun/mailgun-client.js
        tests:
          - test/unit/server/services/email-analytics/index.test.ts
          - test/unit/server/services/email-analytics/fetch-mailgun-events.test.ts
      consumers:
        summary: >-
          Boot passes the three wrappers to jobs handlers that retain them and return startFetch
          in separate two-slot queues. Background boot schedules all three; newsletter sends,
          automation sends and accepted gift deliveries request their own schedule with the
          recent-send lookup bypass. The Admin emails endpoint reads current newsletter service
          status and requests backfill/cancel via root getters. Booted-backend integration tests
          dispatch each job with Mailgun fetching stubbed, assert recipient/outcome and selected
          aggregate writes, its cursor progress and unchanged sibling cursor rows. Automation
          integration also asserts replay does not double-count opens. These are database/job
          composition tests, not live transport, real cron or HTTP backfill/cancel coverage.
        sources:
          - core/boot.js
          - core/server/services/jobs-service/register-job-handlers.ts
          - core/server/services/email-service/email-service-wrapper.js
          - core/server/services/email-service/email-service.js
          - core/server/services/automations/service.ts
          - core/server/services/automations/poll.ts
          - core/server/services/gifts/index.ts
          - core/server/services/gifts/gift-delivery-service.ts
          - core/server/api/endpoints/emails.js
          - core/server/web/api/endpoints/admin/routes.js
        tests:
          - test/integration/services/email-analytics/jobs.test.ts
          - test/integration/services/email-analytics/automation-email-analytics.test.js
          - test/unit/server/services/email-analytics/jobs.test.ts
          - test/e2e-api/admin/emails.test.js
      startup:
        summary: >-
          Boot initializes analytics synchronously after constructing gifts and invoking
          members.init earlier in the service group, then registers handlers and starts jobs. Analytics init
          itself is not feature-gated. Background scheduling starts after server readiness,
          skips test environments and uses allSettled so individual scheduling failures are
          logged without suppressing later background services. Scheduler registration requires
          both enable flags and recent eligible sends, unless its caller bypasses that lookup.
          Boot VM tests use mocked collaborators: they assert initializer invocation ordering
          and continuation after two scheduling failures; separate held-promise cases prove
          waits for Stripe, async peer initializers and jobs startup. Separate VM cases cover
          selected environment/recovery barriers without asserting analytics schedule calls;
          scheduler units establish those gates. Real-boot HTTP remains ready while controlled
          newsletter recovery is held, with analytics scheduling disabled in that test. These
          do not exercise partial analytics construction or real background provider readiness.
        sources:
          - core/boot.js
          - core/server/services/email-analytics/index.ts
          - core/server/services/email-analytics/jobs/index.js
          - core/server/services/email-analytics/jobs/email-analytics-job-scheduler.ts
          - core/server/services/jobs-service/register-job-handlers.ts
        tests:
          - test/unit/boot-email-analytics.test.ts
          - test/e2e-server/boot-background.isolated.test.ts
          - test/unit/server/services/email-analytics/email-analytics-job-scheduler.test.ts
          - test/integration/services/email-analytics/jobs.test.ts
      lifetime:
        summary: >-
          Publication is sequential and only newsletters guards init: a later constructor
          failure leaves partial state that retry cannot complete. No reset/disposer exists.
          Wrappers retain restored/fetching flags and in-memory cursors; jobs-table cursors and
          backfill metadata survive process replacement. Scheduler flags survive successful
          registration, with rejection clearing the flag, but have no shutdown reset. Wrapper
          units hold a fetch to assert overlapping startFetch skips while a sibling progresses,
          and hold a continuation to prove the returned promise remains pending. Direct fetch
          methods bypass that guard. First restoration is marked attempted before awaiting it;
          overlapping initial calls and retry after restoration failure are not characterized.
          Constructor-fake root tests prove normal identity retention, not same-module reboot.
        sources:
