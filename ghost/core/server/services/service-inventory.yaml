      failures:
        summary: >-
          Read maps a missing model to NotFound; limit and ordinary model errors propagate;
          coded errors mentioning unique become the duplicate-name validation error.
          Add/edit persist before verification messages, and opt-in creation sends before
          its transaction finishes. Token creation, message generation/sending, reread or
          a later verification send can fail after earlier work; token validation consumes
          usage before property validation or model update. Creating a custom reply-to
          requiring verification dereferences an absent newsletter in the preparation
          method. Units pin selected propagation/allowlist behavior with fakes, and HTTP
          pins duplicate/limit/address errors. They do not cover these partial failures.
