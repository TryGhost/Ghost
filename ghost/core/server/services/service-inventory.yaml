          open-throughput metrics with threshold 500. Root captures optional site Mailgun tag,
          pipeline names/seeds and collaborators; wrappers/processors retain config/settings
          facades and read processing/metric options during work. Each provider fetch rereads
          Mailgun config or settings, with configured bulkEmail.mailgun taking precedence, and
          optional fallback domain. Mailgun requests use AND tags, OR event types, ascending
          pages of 300 and a configured SDK timeout of 60 seconds. Gifts omit the opens pass.
          Scheduler units assert flag gates, bypasses and seeded five-minute cron values; fetch
          units assert request options with a stubbed client. Nock Mailgun units assert selected
          paging/domain-safe cursors, not timeout completion. Test overrides do not establish
          production hot reload of captured tags, collaborators or registered schedules.
