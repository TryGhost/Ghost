          sender retains jobs/request/discovery/callbacks, API retains repository and
          helpers, and metadata retains all added mappers. Registered jobs and
          recommendations retain concrete objects if wrapper fields are later replaced.
          A jobs unit constructs a real controller with a fake API and real in-memory
          backend, retains it across jobs shutdown/restart, and asserts stable jobs
          identity plus exact first/second delivery to the current handler. It does not
