      construction:
        summary: >-
          Import eagerly constructs a SingleUseTokenProvider, NewslettersService,
          GhostMailer and MagicLink. Shared models, URL facade, limits and email-address
          wrapper are retained; the captured labs object is unused by current methods.
          Constructor mail configuration/transport failure can reject the import. There is
          no init hook or lazy factory. Members init requires its API factory, whose
          module requires this root; the Admin endpoint can also require it through the
          lazy API getter. This timing/identity graph is source-only: class units construct
