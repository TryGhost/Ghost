        summary: >-
          The root owns a GhostMailer transport and MagicLink/token-provider objects, but
          no listeners, timers, queue or response cache directly. Selected mail transports
          own their network/process resources; the root neither closes them nor tracks
          pending sends. Members jobs delete shared tokens older than 24 hours; newsletters
          owns neither cleanup scheduling nor deletion. Token creation writes independently of
