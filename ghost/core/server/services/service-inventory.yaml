          - test/unit/server/services/recommendations/service/incoming-recommendation-controller.test.ts
      construction:
        summary: >-
          Import constructs only the root wrapper. Enabled init requires mentions API/sender,
          captures model constructors and composes WellknownService, a fresh SettingsBREADService
          and enabler, repositories, metadata/outgoing/incoming services and controllers. It
          uses BookshelfClickEventRepository for both click and subscription models. Two
          GhostMailers are constructed: one inside SettingsBREADService and one for incoming
          notifications. Metadata borrows the shared oEmbed and external-request objects; the
          renderer retains the staff wrapper. No other production root construction or deep
          composition was found. Service units use in-memory repositories and fake dependencies;
          booted API/email tests exercise normal composition, not individual constructor failures.
        sources:
          - core/server/services/recommendations/recommendation-service-wrapper.js
          - core/server/services/recommendations/service/recommendation-service.ts
          - core/server/services/recommendations/service/incoming-recommendation-service.ts
          - core/server/services/recommendations/service/incoming-recommendation-email-renderer.ts
          - core/server/services/settings/settings-service.js
          - core/server/services/settings/settings-bread-service.js
          - core/server/lib/mail/ghost-mailer.js
        tests:
