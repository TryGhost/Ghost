          - test/unit/server/services/email-service/batch-sending-service.test.js
          - test/integration/services/email-service/resume-interrupted-sends.test.js
      lifetime:
        summary: >-
          Wrapper identity, implementation graph and translation listener persist without
          reset/dispose. Pre-stop sets the batch sender's shutdown flag; repeated wrapper init
          clears it through onStart and registers callbacks on the supplied server. Registration
          has no same-server deduplication. These restart behaviors are source-only. Cleanup
          waits with allSettled for a snapshot of tracked sendEmail work. That tracking spans
          preparation/submission but ends before emailJob writes the final parent Email status.
          Batch units hold preparation or sendBatch pending and assert drain stays pending;
          they also assert pre-stop stops further claims and sibling workers settle before an
          error surfaces. Accounting integration resumes frozen recipients using a newly
          constructed batch sender, not the same stopped wrapper. Renderer retains its first
          template-compilation promise, including rejection. Body caches are per sendBatches
          invocation; analytics owns separate provider-ID and pending-event maps. No cited test
          establishes same-wrapper restart, listener removal or final parent-write drain.
        sources:
          - core/server/services/email-service/email-service-wrapper.js
          - core/server/services/email-service/batch-sending-service.js
          - core/server/services/email-service/email-renderer.js
          - core/server/services/email-service/email-event-processor.js
          - core/server/services/email-service/newsletter-email-event-storage.js
        tests:
          - test/unit/server/services/email-service/batch-sending-service.test.js
          - test/integration/services/email-service/recipient-accounting.test.ts
      configuration:
        summary: >-
          Init captures batchCreationConcurrency, sibling instances and the initial locale;
          batch construction selects retry policy from NODE_ENV, with retries disabled by
          default in development/test. Retained config/settings facades are read per operation
          for Mailgun credentials, batch size/window/tag/message IDs, warming, recovery age,
          verification message and rendering settings. Configured Mailgun overrides settings;
          each request creates an SDK client with a 60-second timeout. Locale edits request
          translation changes without awaiting them; renderer helpers retain that translation
          function while reading locale/timezone/settings later. Preflight counts the audience
          and warming allocation before publication. createEmail requires matching newsletter/
          filter values, uses those counts without rechecking limits or recounting, and writes
          through the supplied transaction. Units assert transaction forwarding, no recount or
          dispatch, retained counts including zero, and rejection of missing/mismatched preflight.
          New rows capture tracking/filter/source/count data; prepared membership freezes at
          prepared_at. Tests assert selected injected options, concurrency validation, warming
          enablement/day values, recovery cutoff filters and configured message-ID payloads.
          Test overrides do not establish production hot reload or retained-reference rebinding.
        sources:
          - core/server/services/email-service/email-service-wrapper.js
          - core/server/services/email-service/email-service.js
          - core/server/services/email-service/email-renderer.js
          - core/server/services/email-service/helpers/register-helpers.js
          - core/server/services/email-service/batch-sending-service.js
          - core/server/services/email-service/domain-warming-service.ts
          - core/server/services/email-service/mailgun-email-provider.js
          - core/server/lib/mailgun/mailgun-client.js
        tests:
          - test/unit/server/services/email-service/recipient-preparation.test.ts
          - test/unit/server/services/email-service/domain-warming-service.test.ts
          - test/unit/server/services/email-service/email-service.test.js
          - test/unit/server/services/email-service/mailgun-email-provider.test.js
          - test/e2e-api/admin/email-previews.test.js
      resources:
        summary: >-
          Delivery borrows jobs, DB/models, image cache/storage and sibling services. It owns
          its locale listener, compiled template promise, active-send set and per-send body
          cache. Posts saves the publication and pending email in one transaction, opening one
          or joining the caller's. Scheduling follows its own transaction's completion;
          caller-owned transactions register a detached callback on executionPromise fulfillment
          through afterCommit. There is no durable outbox for this callback. Preparation retains
          the selected audience IDs, bounds page workers, writes
          each page transactionally with a stable batch identity, verifies uncertain commits,
          and drains workers on failure. Retry waits own timers/abort listeners; aborting those
          waits does not cancel an active transaction/provider request. Two workers submit
          batches per email; jobs registers two concurrent email handlers. Rendering can read
          templates/images/posts and persist tracking links through borrowed helpers; image
          lookup has shared cache/in-flight work and its own request timeout. The installed
          Mailgun SDK uses bundled Axios with configured request timeouts and default HTTP agents;
          its timeout path destroys the request, but this wrapper exposes no cancellation or
          agent-disposal handle. This is source evidence, not tested deadline/shutdown behavior.
          Analytics deep
          objects own an unbounded provider-ID map, pending timestamp maps and metric
          registrations; domain-event dispatch does not await subscribers. Units exercise
          bounded preparation workers, drain gates and cached-image fallback using fakes;
          these do not prove provider socket disposal or whole-server shutdown completion.
        sources:
          - core/server/lib/after-commit.ts
          - core/server/services/posts/posts-service.js
          - core/server/services/email-service/email-service-wrapper.js
          - core/server/services/email-service/batch-sending-service.js
          - core/server/services/email-service/recipient-preparation.ts
          - core/server/services/email-service/email-renderer.js
          - core/server/services/email-service/email-event-processor.js
          - core/server/services/email-service/newsletter-email-event-storage.js
          - core/server/services/jobs-service/register-job-handlers.ts
          - core/server/lib/mailgun/mailgun-client.js
          - package.json
          - core/server/lib/image/index.js
          - core/server/lib/image/cached-image-size-from-url.js
          - core/server/lib/image/image-size.js
        tests:
          - test/integration/services/email-service/atomic-publish.test.ts
          - test/unit/server/services/email-service/recipient-preparation.test.ts
          - test/unit/server/services/email-service/batch-sending-service.test.js
          - test/unit/server/services/email-service/email-renderer.test.js
      failures:
        summary: >-
          Wrapper failures after subscription/cleanup registration are not rolled back; service
          publication before controller can prevent retry after a later failure. createEmail
          rejects mismatched preflight with UpdateCollisionError; it inserts without dispatching.
          scheduleEmail converts dispatch failure to a failed row and logs analytics-scheduling
          failure. retryEmail rereads persisted eligibility, rejects a non-failed parent or any
          submitting batch, then claims transactionally and restores failed status on dispatch
          rejection. Status responses expose retryable for failed sends. Eligibility and claim
          are separate reads; these are not a cross-process ownership guarantee.
          Recovery isolates individual emails, fails stale/unsendable ones and requeues eligible
          work without rechecking limits. Batch failures use bounded retries, preserve selected
          non-retryable integrity errors and normally persist failed status; shutdown leaves
          interrupted parents submitting. Provider acceptance before failed DB persistence is
          uncertain, not an exactly-once guarantee. Unit tests assert dispatch compensation,
          preflight mismatch and stale/unknown-outcome retry rejection with a fake status service;
          SQLite status tests read changed batch state and reject invalid stored status. Selected
          retry/drain failures and real-DB orphan handling are asserted with a
          mocked provider. Renderer caches compilation rejection but tolerates image failures.
          Analytics storage flushes maps sequentially and clears only after full success;
          dispatch/storage effects are not atomic. Its integration asserts selected delivered
          timestamps in sequential/batched modes with fetch/cursor stubs, not live-provider
          semantics or a global rollback/drain guarantee.
        sources:
          - core/server/services/email-service/sending-status-serializers.ts
          - core/server/services/email-service/sending-status.ts
          - core/server/services/email-service/sending-status-service.ts
          - core/server/services/email-service/email-service-wrapper.js
          - core/server/services/email-service/email-service.js
          - core/server/services/email-service/batch-sending-service.js
          - core/server/services/email-service/sending-service.js
          - core/server/services/email-service/mailgun-email-provider.js
          - core/server/services/email-service/email-renderer.js
          - core/server/services/email-service/email-event-processor.js
          - core/server/services/email-service/newsletter-email-event-storage.js
        tests:
          - test/unit/server/services/email-service/sending-status.test.ts
          - test/unit/server/services/email-service/sending-status-service.test.ts
          - test/unit/server/services/email-service/email-service.test.js
          - test/unit/server/services/email-service/batch-sending-service.test.js
          - test/unit/server/services/email-service/mailgun-email-provider.test.js
          - test/unit/server/services/email-service/email-renderer.test.js
          - test/integration/services/email-service/resume-interrupted-sends.test.js
          - test/integration/services/email-service/newsletter-email-event-storage.test.js
    unverified: []
    blockers:
      - >-
        Add wrapper identity/initialization assertions: missing dependencies, repeated init,
        captured versus current sibling references, partial publication and retry after each
        acquisition boundary. Existing wrapper units only assert URL-helper dispatch.
      - >-
        Preserve the tested boot email-init, jobs-readiness and pending-recovery barriers;
        characterize sibling publication timing and actual recovery failure/late-work behavior.
        The VM harness substitutes dependency implementations, and the real-boot HTTP witness
        controls recovery and subsequent external effects rather than exercising provider work.
      - >-
        Characterize locale-listener ownership, overlapping language changes and rejected
        changes; cleanup never removes the listener. Verify template compilation rejection
        retention and whether any supported lifecycle can recover from it.
      - >-
        Verify whole-server shutdown through final parent status persistence and late work.
        Batch cleanup snapshots sendEmail promises before emailJob's final write; current
        gated units cover nested work, not that final write or work admitted after the snapshot.
      - >-
        Test same-process restart through the retained wrapper: re-arming after stop, cleanup
        registration on the new server, repeated init on one server and restart while earlier
        work is pending. Captured consumers remain attached to the original graph. Accounting
        integration reconstructs a sender; existing wrapper units only assert URL-helper calls.
      - >-
        Preserve uncertainty at provider acceptance/database persistence and recovery boundaries;
        no tested cross-process ownership fence or exactly-once guarantee exists. Verify SDK
        deadline/socket settlement and DB failure behavior before changing shutdown ownership;
        the delivery wrapper currently provides no provider-request cancellation handle.
      - >-
        Characterize immutable-config replacement against captured helpers, concurrency/retry
        policy and queued/rendered snapshots. In particular, prepared recipients and cached
        bodies have different lifetimes from call-time provider/settings reads.
      - >-
        Retain analytics deep-export obligations: metric/provider-cache ownership, partial
        flush failure, concurrent pending-map changes and unawaited subscriber work. The
        delivery wrapper's cleanup does not own these separately composed objects.
      - >-
        Source-only recovery edge: stale and fresh queries use strict less-than/greater-than
        around one cutoff, so an exactly equal created_at matches neither query. This has
        not been reproduced and is not covered by the filter-string unit assertions.
