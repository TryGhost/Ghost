          - test/unit/server/services/stats/utils/tinybird.test.js
          - test/e2e-api/admin/stats.test.js
      construction:
        summary: >-
          Import constructs only the wrapper. First init synchronously builds six collaborators
          from shared knex/models/URL and publishes api, then conditionally obtains cache:stats.
          Although init is async, it contains no await; later calls return when api is truthy.
          StatsService.create conditionally initializes Tinybird and creates a query client for
          web analytics, without running a statistics query. Three factory tests stub Tinybird
          init and assert its gate and client presence; no focused real wrapper construction,
          optional-cache failure or retry test was found.
        sources:
          - core/server/services/stats/service.js
          - core/server/services/stats/stats-service.js
          - core/server/services/stats/mrr-stats-service.js
          - core/server/services/stats/members-stats-service.js
          - core/server/services/stats/subscription-stats-service.js
          - core/server/services/stats/referrers-stats-service.js
          - core/server/services/stats/posts-stats-service.js
          - core/server/services/stats/content-stats-service.js
          - core/server/services/adapter-manager/adapter-manager.ts
        tests:
          - test/unit/server/services/stats/stats.test.ts
      consumers:
        summary: >-
          Boot initializes the wrapper; lazy Admin stats endpoint construction captures cache,
          while each query reads api live. Explore retains the wrapper and reads api.mrr under
          its growth/live-Stripe gates. Automations destructures the deep query factory and
          supplies its current Tinybird instance per operation. Real Admin HTTP snapshots pin
          counts/MRR/subscriptions/referrers and selected empty-input shapes; trial/incomplete
          subscription tests compare before/after results. Several top-post/referrer/growth
          tests assert only array shape, and invalid-ID cases do not assert empty counts.
          Explore units inject the stats graph; automation composition is separately recorded
          under Tinybird. Configured stats-cache hits/identity/keys are not covered here.
