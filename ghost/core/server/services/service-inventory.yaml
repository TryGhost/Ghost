          - core/server/services/invites/index.js
          - core/server/services/invites/invites.js
          - core/server/lib/mail/index.js
        tests: []
      consumers:
        summary: >-
          The invites endpoint is the only production consumer found. It retains the root
          and calls add for POST; browse, read and delete use models directly. Validation
