      resources:
        summary: >-
          The service owns two shared-emitter subscriptions and outbound requests, with no
          cancellation or drain bookkeeping. The wrapper borrows shared settings, routing and
          image helpers; image adapter lifetime remains outside this root. Production requests
          use request-external's shared configurable HTTP/HTTPS agents, keep-alive by default,
          DNS checks and per-request timeout. No Slack cleanup is registered and the helper
          exposes no lifecycle disposal hook; stopping Ghost does not await these sends.
        sources:
          - core/server/services/slack-ping/index.ts
          - core/server/services/slack-ping/slack-ping-service.ts
          - core/server/lib/request-external.js
          - core/server/lib/image/index.js
          - core/boot.js
          - core/server/ghost-server.ts
        tests:
          - test/unit/server/services/slack-ping/slack-ping-service.test.js
      failures:
        summary: >-
          Errors before service assignment permit a later init attempt; subscription errors
          leave service assigned and can leave partial listeners, so later init skips retry.
          Request promise rejection is wrapped in InternalServerError, logged and swallowed;
          direct ping therefore resolves after a logged failure. Synchronous settings, model,
          formatting, URL/icon or request-invocation errors occur outside that catch and can
          propagate through the synchronous emitter, even after a post commit, interrupting later
          callbacks without undoing persistence. The service itself provides no
          retry/replay; successful slack/test API response does not report asynchronous failure.
        sources:
          - core/server/services/slack-ping/index.ts
          - core/server/services/slack-ping/slack-ping-service.ts
          - core/server/lib/common/events.js
          - core/server/models/base/plugins/events.js
          - core/server/api/endpoints/slack.js
        tests:
          - test/unit/server/services/slack-ping/slack-ping-service.test.js
    unverified: []
    blockers:
      - >-
        Add root export, construction, idempotence and partial-subscription failure contracts.
        Existing tests construct the implementation; registration assertions check on calls
        against a fake emitter, not removeListener, callback counts or repeated subscriptions.
      - >-
        Exercise real boot, post publication and slack/test through the actual emitter and
        wrapper. The API test mocks emission; class tests use fake URL/image/cache dependencies
        and inject @tryghost/request, while production injects request-external. They do not
        establish real routing, constructor wiring, startup readiness or production HTTP policy.
      - >-
        Characterize changed settings on a retained instance, custom username/title/icon,
        custom excerpts and default-slug suppression. The existing missing-URL case only checks
        helper calls; it does not assert no request. Tag forwarding is tested against a stub,
        not a real collection-filter route.
      - >-
        Decide and test listener ownership across restart/replacement and externally cleared
        emitters. Stable callbacks only prevent duplication for the same implementation object;
        the wrapper guard cannot recover a cleared listener set or finish failed registration.
      - >-
        Characterize pending sends, overlapping events and shutdown with the real request helper.
        The request-error test observes one log through an alternate injected transport; it
        does not prove exact error context, direct-ping settlement, timeout behavior, cancellation
        or shared-agent disposal. Keep per-request timeout distinct from an overall deadline.
      - >-
        Add synchronous failure contracts for malformed models/settings and throwing URL/icon
        or request dependencies. Those failures bypass the request rejection handler and can
        escape model/API event emission even when Slack is disabled or the post is later skipped.
  staff:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - staff/index.js
    notes: >-
      Preserve event-driven staff notifications and direct email/rendering consumers. Decide
      partial-initialization recovery and ownership of subscriptions, mail transport and pending
      deliveries before changing lifetime.
    contracts:
      exports:
        summary: >-
          CommonJS exports one eagerly constructed wrapper with a synchronous init method that
          uses this and returns undefined. api is initially absent; successful initialization
          exposes StaffService and its emails helper. Stripe, gifts and recommendations depend
          on api.emails. No reset or shutdown method is exposed.
        sources:
          - core/server/services/staff/index.js
          - core/server/services/staff/staff-service.js
          - core/server/services/stripe/stripe-service.js
          - core/server/services/gifts/index.ts
          - core/server/services/recommendations/service/incoming-recommendation-email-renderer.ts
        tests: []
      construction:
        summary: >-
          The root is the only production StaffService constructor found. First init creates
          GhostMailer and StaffService, which creates StaffServiceEmails, a private Handlebars
          environment, partials and helpers. It captures memberAttribution.service and shared
          model/settings/URL helpers, assigns api, then subscribes. A retained api skips all
          subsequent construction and subscription work. Direct implementation construction
          outside this root is confined to tests in the searched repository.
        sources:
          - core/server/services/staff/index.js
          - core/server/services/staff/staff-service.js
          - core/server/services/staff/staff-service-emails.js
          - core/server/lib/mail/ghost-mailer.js
        tests: []
      consumers:
        summary: >-
          Boot initializes the root. Member and subscription events from the members repository
          and milestone events from the milestone repository drive its four subscribers.
          Stripe donation checkout and gifts resolve api.emails through getters when sending;
          recommendations uses it for HTML/text rendering while owning a separate mailer.
          E2E tests assert signup, subscription, donation, gift and recommendation emails through
          these consumers up to a mocked mail transport. Milestone mail coverage dispatches
          a constructed event directly; no provider delivery is proved.
        sources:
          - core/boot.js
          - core/server/services/staff/staff-service.js
          - core/server/services/members/members-api/repositories/member-repository.js
          - core/server/services/milestones/bookshelf-milestone-repository.js
          - core/server/services/stripe/stripe-service.js
          - core/server/services/stripe/services/webhook/checkout-session-event-service.js
          - core/server/services/gifts/index.ts
          - core/server/services/gifts/gift-service.ts
          - core/server/services/recommendations/recommendation-service-wrapper.js
          - core/server/services/recommendations/service/incoming-recommendation-email-renderer.ts
        tests:
          - test/unit/server/services/staff/index.test.js
          - test/e2e-api/members/send-magic-link.test.js
          - test/e2e-api/members/webhooks.test.js
          - test/e2e-api/members/donation-checkout-session.test.js
          - test/e2e-api/members/gift-subscriptions.test.js
          - test/e2e-server/services/recommendation-emails.test.js
      startup:
        summary: >-
          Foreground boot invokes staff init before mounting the app and notifying readiness.
          Email-address initialization runs earlier; the synchronous member-attribution init
          appears before staff in the Promise.all argument list, making its service available
          before staff captures it. Stripe and gifts are composed earlier but defer reading
          api.emails. Staff init registers listeners and prepares rendering/transport objects;
          it does not send or verify delivery. Direct use before init has no readiness guard.
        sources:
          - core/boot.js
          - core/server/services/staff/index.js
          - core/server/services/member-attribution/index.js
          - core/server/services/stripe/stripe-service.js
          - core/server/services/gifts/index.ts
        tests: []
      lifetime:
        summary: >-
          Wrapper, api, emails, transport and captured attribution instance survive repeat init
          and server stop. init guards subscriptions using api, not a completed-startup flag.
          Calling api.subscribeEvents directly registers four more handlers without a guard.
          Events may run concurrently; this root keeps no delivery queue or deduplication state.
          Direct email methods await sequential recipient sends, while event dispatch does not
          await notification completion.
        sources:
          - core/server/services/staff/index.js
          - core/server/services/staff/staff-service.js
          - core/server/services/staff/staff-service-emails.js
          - core/server/services/members/members-api/repositories/member-repository.js
          - core/server/services/milestones/bookshelf-milestone-repository.js
          - core/server/ghost-server.ts
        tests: []
      configuration:
        summary: >-
          GhostMailer captures transport/options on construction, while notifications read
          current eligible users, site settings, sender helper and URL helper when composing
          each message. Mail sending also reads the current email-address service and tracking settings.
          The attribution object and renderer remain captured. Partials load at construction;
          HTML files are read per render and text modules load through require. Existing tests
          cover configured addresses, transport choice and rendered content, not changes on one
          retained staff instance or during delivery.
        sources:
          - core/server/services/staff/index.js
          - core/server/services/staff/staff-service-emails.js
          - core/server/lib/mail/ghost-mailer.js
          - core/server/models/user.js
          - core/server/services/settings-helpers/settings-helpers.js
        tests:
          - test/unit/server/services/staff/staff-service.test.js
          - test/unit/server/lib/mail/ghost-mailer.test.js
      resources:
        summary: >-
          Staff owns its mailer/transport, renderer and four DomainEvents subscriptions; models,
          settings and attribution are borrowed. Neither wrapper nor implementation stores
          unsubscribe handles or pending delivery promises, and boot registers no staff cleanup.
          GhostMailer exposes no close/drain method. Provider-specific connections, queued sends
          and disposal are therefore outside the implemented staff lifecycle. Unit tests assert
          four subscriptions but do not establish cleanup or transport shutdown.
        sources:
          - core/server/services/staff/index.js
          - core/server/services/staff/staff-service.js
          - core/server/services/staff/staff-service-emails.js
          - core/server/lib/mail/ghost-mailer.js
          - core/boot.js
          - core/server/ghost-server.ts
        tests:
          - test/unit/server/services/staff/staff-service.test.js
      failures:
        summary: >-
          Construction failures throw synchronously before api assignment; subscription failure
          occurs after assignment and leaves later init guarded out. Event handlers catch/log
          notification failures without retry. Historical attribution lookup failure warns and
          continues, but supplied-attribution resolution failure aborts that notification.
          Recipient lookup, rendering or send failure rejects direct email calls and stops later
          recipients, including the loops that await sends before Promise.allSettled. Gifts
          catch staff-mail failures; donation handling propagates them after saving the donation.
          Invalid milestone content warns and skips. Mail-library failure tests and a gift test
          cover parts of this, not staff initialization, event errors or multi-recipient failure.
        sources:
          - core/server/services/staff/index.js
          - core/server/services/staff/staff-service.js
          - core/server/services/staff/staff-service-emails.js
          - core/server/lib/mail/ghost-mailer.js
          - core/server/services/gifts/gift-service.ts
          - core/server/services/stripe/services/webhook/checkout-session-event-service.js
        tests:
          - test/unit/server/services/staff/staff-service.test.js
          - test/unit/server/lib/mail/ghost-mailer.test.js
          - test/unit/server/services/gifts/gift-service.test.ts
    unverified: []
    blockers:
      - >-
        Add exact root/consumer export and identity contracts, repeat-init subscription counts,
        use-before-init behavior and real boot dependency ordering. Making member-attribution
        init asynchronous could leave staff retaining an unavailable dependency.
      - >-
        Decide and test startup failure recovery. Mailer creation can precede a renderer failure
        without disposal; api assignment precedes subscription completion, so partial listener
        registration can prevent retries. No test exercises either partial-initialization path.
      - >-
        Decide restart, subscription disposal, provider transport cleanup and pending-delivery
        drain ownership. Test captured attribution replacement and retained api.emails consumers;
        server stop currently does not reset staff or wait for its detached event work.
      - >-
        Add live-versus-captured configuration tests on the same instance, including transport
        changes, sender/settings and recipient preferences while delivery is pending. Existing
        fixed-input mail tests do not establish these timing boundaries.
      - >-
        Add failure contracts for supplied versus historical attribution, missing event models,
        multiple recipients, template errors and event-handler logging. The apparent
        Promise.allSettled loops still stop at the first rejected awaited send; decide whether
        that is intended before changing behavior. Donation failure propagation also needs a test.
      - >-
        Add real milestone persistence-to-mail coverage. Staff tests manually construct milestone
        events; the production entity carries reason metadata beside milestone, while the email
        helper and suppression fixtures read milestone.meta.reason. Existing milestone E2E tests
        do not assert delivery, and email_sent_at is set before delivery completes. Current
        suppressed paths also leave emailSentAt null, so the metadata mismatch has not been
        shown to cause incorrect delivery.
  stats:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - stats/index.js
      - stats/utils/tinybird.js
    notes: >-
      Boot publishes a composite statistics API before obtaining its optional cache. Preserve
      retained API/cache/query-client relationships and method-specific empty/error results.
    contracts:
      exports:
        summary: >-
          CommonJS exports one wrapper with mutable api/cache initially null and receiver-dependent
          async init resolving undefined. The deep StatsService constructor/create factory exposes
          six mutable collaborators and async forwarding methods; Explore reaches api.mrr directly.
          The separate deep Tinybird module exports create returning receiver-independent
          buildRequest/parseResponse/fetch closures. Factory units assert class identity/client
          presence; selected HTTP responses pin data/meta serialization. Exact wrapper/barrel
          shape, init result and receiver behavior remain source-only.
        sources:
          - core/server/services/stats/index.js
          - core/server/services/stats/service.js
          - core/server/services/stats/stats-service.js
          - core/server/services/stats/utils/tinybird.js
          - core/server/services/explore-ping/explore-ping-service.ts
        tests:
