          init captures a derived home URL from shared URL utilities; audience feedback does
          not read an application-config facade per operation or refresh that base on re-init.
          buildLink normalizes model/plain input, supplies type posts to the retained URL
          service, and uses the captured base when its URL contains /404/. Redirect fetches the
          current post with tags/authors; absent posts bypass URL lookup. Hash links encode
          UUID/key. Email links use post ID under the captured base/subdirectory and preserve
          literal member placeholders. Units pin these URL shapes, fallback and model input;
          HTTP redirects check Location patterns without exercising slug/routing changes.
          Browse defaults limit/page to 10/1, parses score and always orders newest first;
