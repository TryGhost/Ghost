    entryPoints:
      - gifts/index.ts
      - gifts/jobs/index.js
    notes: >-
      Preserve the gift, delivery and controller composition together with recurring jobs,
      signed callbacks and payment/member consumers. Record durable state separately from
      process state and distinguish mail transport acceptance from provider delivery outcomes.
    contracts:
      exports:
        summary: >-
          Named TypeScript exports are synchronous init(options), asynchronous
          recoverPendingDeliveries(), and initially undefined service, deliveryService and
          controller bindings; there is no default export, reset or shutdown. Init returns
          undefined and recovery before init resolves without work. The separate CommonJS jobs
          module exports scheduleGiftCleanupJob and scheduleGiftReminderJob. Implementations
          expose checkout, redemption, continuation, lifecycle, presentation and event capabilities;
          controller methods accept API frames and retain their GiftService. Class tests assert
          selected DTOs and controller forwarding/authentication, not the real root export shape.
