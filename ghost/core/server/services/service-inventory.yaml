        summary: >-
          Re-init discards api state but reuses the shared value cache; retained old instances
          and pending operations remain usable. Activation tracks one promise, skips matching
          concurrent name/settings and waits for a prior activation, but multiple differing
          waiters can then start together. Updates are not serialized with activation or one
