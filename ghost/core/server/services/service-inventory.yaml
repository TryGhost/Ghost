        tests:
          - test/unit/server/services/email-suppression-list/email-suppression-list.test.ts
          - test/e2e-api/members/member-projection.test.ts
      construction:
        summary: >-
          Module evaluation constructs one MailgunClient retaining config and settings accessors,
          then one suppression list retaining that client and models.Suppression. Constructors
          perform no provider requests or subscriptions; the SDK client is created later when
          a removal asks for it. No other runtime construction of the suppression list was
          found. init replaces even an injected Suppression field with the shared model;
          this eager composition and model replacement lack dedicated assertions.
        sources:
          - core/server/services/email-suppression-list/service.js
          - core/server/services/email-suppression-list/mailgun-email-suppression-list.js
          - core/server/lib/mailgun/mailgun-client.js
        tests: []
      consumers:
        summary: >-
          Members retains the root in its BREAD and account services: reads/browse attach local
          suppression, add/email edits derive email_disabled, and account removal reenables mail.
          Admin removal resolves the root at request time and checks its boolean result. Boot
          injects it into newsletter analytics storage for provider complaint/unsubscribe cleanup.
          EmailEventProcessor dispatches bounce/complaint events; this root persists suppression
          then emits EmailSuppressedEvent, whose members subscriber disables the address.
          Integration tests cover this chain with fetched provider events stubbed. HTTP tests
          cover local projection/removal; storage unit tests inject cleanup stubs, not the root.
        sources:
          - core/boot.js
          - core/server/services/members/api.js
          - core/server/services/members/members-api/members-api.js
          - core/server/services/members/members-api/services/member-bread-service.js
          - core/server/services/members/account-service.ts
          - core/server/api/endpoints/members-account.ts
          - core/server/api/endpoints/members.js
          - core/server/services/email-analytics/index.ts
          - core/server/services/email-service/newsletter-email-event-storage.js
          - core/server/services/email-service/email-event-processor.js
        tests:
          - test/integration/services/mailgun-email-suppression-list.test.js
          - test/e2e-api/admin/members.test.js
          - test/e2e-api/members/member-projection.test.ts
          - test/e2e-api/members/session-auth.test.ts
          - test/unit/server/services/email-service/newsletter-email-event-storage.test.js
          - test/unit/server/services/members/members-api/services/members-bread-service.test.js
      startup:
        summary: >-
          Boot imports the root and calls init in the required service batch after core
          settings/models and Stripe. Members and newsletter analytics capture it earlier in
          that batch. init is async but contains no await: it refreshes the model and registers
          both subscriptions synchronously, then resolves undefined. Queries/removals have no
          readiness guard; only event handling requires init. Booted integration tests exercise
          the resulting composition, not pre-init calls or partial subscription failure.
        sources:
          - core/boot.js
          - core/server/services/email-suppression-list/mailgun-email-suppression-list.js
          - core/server/services/members/service.js
          - core/server/services/email-analytics/index.ts
        tests:
          - test/integration/services/mailgun-email-suppression-list.test.js
      lifetime:
        summary: >-
          Module caching and retained consumer references keep the same root and MailgunClient.
          Every init overwrites the model field and adds two fresh event handlers without a
          guard, unsubscribe or shutdown. Old handlers read this.Suppression when invoked, so
          model replacement affects them too. Persistence outlives the instance; duplicate rows
          retain their original reason/time but still cause a new suppression event. The
          duplicate-row integration case proves member disabling, not restart or listener counts.
        sources:
          - core/server/services/email-suppression-list/service.js
          - core/server/services/email-suppression-list/mailgun-email-suppression-list.js
          - core/server/models/suppression.js
          - core/server/data/schema/schema.js
        tests:
          - test/integration/services/mailgun-email-suppression-list.test.js
      configuration:
        summary: >-
          Reads use local suppression rows and need no provider config. MailgunClient rereads
          bulkEmail and settings accessors for each provider operation: any truthy config
          mailgun object wins; otherwise all three settings credentials must be present.
          getInstance constructs a fresh SDK client using baseUrl origin and timeout 60000;
          removal targets the primary domain. Accessor rereads can see replacement config
          trees, not in-place mutation or an established production reload facility. Client
          tests cover precedence and changed settings on fetchEvents, not root removal or
          configuration changes between its three awaited provider calls.
        sources:
          - core/server/services/email-suppression-list/service.js
          - core/server/services/email-suppression-list/mailgun-email-suppression-list.js
          - core/server/lib/mailgun/mailgun-client.js
          - core/shared/config/validated.ts
        tests:
          - test/unit/server/lib/mailgun/mailgun-client.test.js
      resources:
        summary: >-
          The root owns two shared DomainEvents subscriptions per init and borrows the shared
          model/database pool. Removal creates transient SDK clients and HTTP work; no root
          timer, transport handle, pending-work registry or disposal API exists. The installed
          SDK forwards the timeout to its HTTP client. DomainEvents dispatch does not await
          consumers and catches/logs rejected handlers; allSettled tracks test delivery only.
          Suppression persistence and member disabling are separate writes with no shared
          transaction. Integration tests explicitly settle events, not production shutdown.
        sources:
          - core/server/services/email-suppression-list/mailgun-email-suppression-list.js
          - core/server/lib/mailgun/mailgun-client.js
          - core/server/services/members/members-api/members-api.js
          - core/server/ghost-server.ts
          - package.json
        tests:
          - test/integration/services/mailgun-email-suppression-list.test.js
      failures:
        summary: >-
          Reads log query/mapping failures and return unsuppressed; one bulk failure defaults
          the whole result. Bounce handling accepts only integer 605/607; complaints always
          attempt a row. Duplicate-key errors still dispatch, while other insert failures log
          and stop. removeEmail awaits bounce, complaint and unsubscribe removal, then deletes
          the row; thrown failures return false. Provider false results are ignored, so failed
          remote cleanup can still yield local deletion and true. Individual cleanup methods
          return undefined after fulfilled calls, false after caught throws. Integration covers
          accepted/ignored events and duplicate-row recovery; Admin's failure test stubs the
          root false result and does not cover the real provider failure chain.
        sources:
          - core/server/services/email-suppression-list/mailgun-email-suppression-list.js
          - core/server/lib/mailgun/mailgun-client.js
          - core/server/services/members/account-service.ts
          - core/server/api/endpoints/members.js
        tests:
          - test/integration/services/mailgun-email-suppression-list.test.js
          - test/e2e-api/admin/members.test.js
    unverified: []
    blockers:
      - >-
        Characterize root identity, pre-init calls, model refresh and repeated/partial init.
        Each init currently duplicates listeners, and there is no unsubscribe or production
        drain. Pin concurrent event/removal behavior and separate persistence/member-write
        failures before introducing disposal or changing event ordering.
      - >-
        Cover the real provider-to-root failure contract: MailgunClient returns false for
        unconfigured or failed deletion, but removeEmail ignores it and may report success.
        MemberAccountService also ignores a false root result and reenables mail, unlike the
        Admin endpoint. These source-established gaps need explicit resolution, not accidental
        changes hidden inside lifecycle migration; current success and stubbed-failure tests
        do not establish remote cleanup.
      - >-
        Add direct read/bulk contracts for failure fallback, empty/duplicate/mixed addresses,
        result order, case matching and quoting in the interpolated filter. Cover mapping
        failures and invalid inputs separately; tests of helper data classes and single-member
        projection do not establish bulk suppression behavior.
      - >-
        Pin provider-removal call order, partial success, config/settings changes, malformed
        provider configuration and primary/fallback-domain behavior. Existing Mailgun client
        tests exercise fetching, not removal. Establish timeout, retry/redirect, sockets and
        pending-operation ownership for the installed SDK before promising safe shutdown.
      - >-
        Preserve integer bounce filtering and duplicate-row redispatch deliberately. Tests
        cover 605/607, selected 4xx/5xx values and one existing bounce row, not missing/string
        codes, changed reason/time, database failures or logging failures. No shared transaction
        makes provider removal, suppression deletion and member reenabling atomic.
  explore-ping:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: c2999f4e13da6360bceced808bb52c4a04b5ad03
    entryPoints:
      - explore-ping/index.ts
    notes: >-
      Preserve the environment gate, payload and nonblocking boot ping. Decide how the common
      pattern represents a fresh instance per eligible init and owns unfinished outbound work.
    contracts:
      exports:
        summary: >-
          The TypeScript root exposes named createService and async init exports, consumed by
          CommonJS boot. Neither exposes a retained service instance or a stop/reset method.
          The implementation class and dependency type are deep exports; only tests construct
          that class directly outside the factory in the searched repository.
        sources:
          - core/server/services/explore-ping/index.ts
          - core/server/services/explore-ping/explore-ping-service.ts
          - core/boot.js
        tests: []
      construction:
        summary: >-
          Every createService call constructs ExplorePingService and a fresh posts service,
          including PostStats, PostsExporter and PostEmailHandler. Posts composition captures
          emailService.service, though this consumer only uses stats. Other dependencies are
          shared module objects. Every eligible init calls the factory, even when ping is disabled or
          its URL is absent. The environment guard does not prevent module-scope imports.
        sources:
          - core/server/services/explore-ping/index.ts
          - core/server/services/posts/posts-service-instance.js
          - core/server/services/posts/posts-service.js
          - core/server/services/posts/posts-exporter.js
          - core/server/services/posts/post-email-handler.js
          - core/server/services/posts/stats/post-stats.js
        tests: []
      consumers:
        summary: >-
          Boot is the only production root caller found; no request, job or CLI consumer or
          second composition path was found. Payload collection consumes posts.stats,
          members.stats and statsService.api.mrr. Missing MRR availability silently produces
          an empty array. Implementation tests inject these shapes and do not verify the real
          roots remain compatible.
        sources:
          - core/boot.js
          - core/server/services/explore-ping/index.ts
          - core/server/services/explore-ping/explore-ping-service.ts
          - core/server/services/members/service.js
          - core/server/services/stats/service.js
        tests: []
      startup:
        summary: >-
          Foreground boot calls init after database/settings setup, before app mounting and
          readiness. Only production/development proceed. Member stats already exists at import;
          stats init appears earlier in the same Promise.all list and currently sets api without
          awaiting. Explore init launches ping and resolves without awaiting payload collection
          or HTTP completion; direct factory use has no environment or readiness guard.
        sources:
          - core/boot.js
          - core/shared/config/helpers.ts
          - core/server/services/explore-ping/index.ts
          - core/server/services/members/service.js
          - core/server/services/stats/service.js
        tests: []
      lifetime:
        summary: >-
          No instance, completion promise, success state or deduplication guard is retained by
          the root. Repeated eligible init creates independent pings that can overlap; there is
          no implemented schedule or retry at this layer. An instance retains dependency
          references but reads their mutable properties during each ping. Server stop neither
          drains these pings nor prevents later calls.
        sources:
          - core/server/services/explore-ping/index.ts
          - core/server/services/explore-ping/explore-ping-service.ts
          - core/boot.js
          - core/server/ghost-server.ts
        tests: []
      configuration:
        summary: >-
          Ping reads URL then enabled state once; payload reads version/site metadata before
          awaiting three post queries, growth permission afterwards, then strict-true Stripe
          live mode after member count. Disabled growth omits both growth fields; unavailable
          MRR or non-live Stripe yields an empty array. Post queries count published/sent posts;
          member count includes all members. Tests vary injected settings after construction,
          but do not establish changes during pending work or real-root configuration wiring.
        sources:
          - core/server/services/explore-ping/explore-ping-service.ts
          - core/server/services/posts/stats/post-stats.js
          - core/server/services/members/stats/members-stats.js
          - core/server/services/stats/mrr-stats-service.js
          - core/server/data/schema/default-settings/default-settings.json
        tests:
          - test/unit/server/services/explore-ping/explore-ping-service.test.js
      resources:
        summary: >-
          The owned posts helpers acquire no separate connections or listeners on construction;
          their queries use shared database resources. Outbound work uses shared @tryghost/request.
          Explore stores no abort handle or pending-work registry, supplies no request timeout,
          and registers no boot cleanup. There are no service-owned timers or subscriptions;
          transport/DNS resources remain with the shared request dependency.
        sources:
          - core/server/services/explore-ping/index.ts
          - core/server/services/explore-ping/explore-ping-service.ts
          - core/server/services/posts/posts-service-instance.js
          - core/server/services/posts/stats/post-stats.js
          - core/server/services/posts/posts-exporter.js
          - core/server/services/posts/post-email-handler.js
          - core/boot.js
          - core/server/ghost-server.ts
          - package.json
        tests: []
      failures:
        summary: >-
          Factory failure rejects awaited init and can fail boot; ping rejection is detached.
          Missing URL warns, disabled ping skips. Any post-query/date failure nulls all post
          fields; member or MRR failure nulls both growth fields. Request rejection warns and
          fulfills, while payload setup or serialization errors can reject ping outside these
          catches and reach boot's unhandled-rejection logger. Tests assert null fallback for
          post/member failure and request-error logging, but not MRR failure or detached rejection.
        sources:
          - core/server/services/explore-ping/index.ts
          - core/server/services/explore-ping/explore-ping-service.ts
          - core/boot.js
        tests:
          - test/unit/server/services/explore-ping/explore-ping-service.test.js
    unverified: []
    blockers:
      - >-
        Add root export/factory and boot contracts for environment gating, repeated init,
        construction failure and nonblocking completion. Current tests instantiate only the
        implementation; the shared config helper's tests do not prove the root uses its gate.
      - >-
        Exercise payload collection with the real service roots and database. Changing stats'
        facade can silently replace MRR with an empty array while injected-shape tests pass.
        Preserve member stats availability and stats initialization ordering explicitly.
      - >-
        Decide ownership of overlapping pings, unfinished queries/requests, cancellation and
        shutdown. No service drain exists, and the request has no configured timeout; current
        tests do not establish stalled-request, HTTP-status, redirect or transport cleanup behavior.
      - >-
        Add pending-work configuration contracts: URL/enabled state are checked before queries,
        growth permission and Stripe mode later. Setting changes do not cancel a launched ping.
        Cover real post/member count semantics and unavailable versus failed MRR distinctly.
      - >-
        Characterize detached payload/serialization failures, MRR rejection, post-date errors
        and sibling queries continuing after Promise.all rejects. Existing fallback assertions
        do not prove warning details for statistics failures or boot's error handling.
  export-requests:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - export-requests/export-requests-service.ts
    notes: >-
      Move the eager deep-module singleton to the common composition pattern while preserving
      per-request configuration and zero retries.
    contracts:
      exports:
        summary: >-
          The TypeScript module exports named ExportRequestsService and exportRequestsService;
          there is no index, init or shutdown API. The constructor accepts config, logging and
          request overrides. requestExport requires its receiver and resolves undefined after
          delivery; it does not return a job ID or inspect the response body. Unit tests use
          constructed instances; the HTTP tests exercise the named singleton through the endpoint.
        sources:
          - core/server/services/export-requests/export-requests-service.ts
          - core/server/api/endpoints/exports.js
        tests:
          - test/unit/server/services/export-requests/export-requests-service.test.ts
          - test/e2e-api/admin/exports-request.test.ts
      construction:
        summary: >-
          Module evaluation eagerly constructs one instance with shared config, logger and
          request dependencies, retaining those dependency objects without sending a request.
          The exports endpoint destructures and retains that singleton. Repository searches
          found no other runtime constructor or direct consumer; tests construct isolated
          instances with overrides. Construction timing and retained identity are source-only.
        sources:
          - core/server/services/export-requests/export-requests-service.ts
          - core/server/api/endpoints/exports.js
        tests: []
      consumers:
        summary: >-
          POST /exports is the only runtime requestExport caller found. The endpoint validates
          known boolean components with at least one selected, normalizes all six keys and
          takes the requester from authenticated context. It awaits delivery before returning
          202. Routing applies Admin authentication and db exportContent permission without
          a feature flag; integration tokens are absent from the normal allowlist. GET archive
          downloads use a separate exporter. HTTP tests cover owner/admin success, unauthorized,
          editor, author and integration-token rejection, payload normalization, requester
          spoofing and invalid components. Staff-token behavior is source-only.
        sources:
          - core/server/api/endpoints/exports.js
          - core/server/services/exports/export-components.ts
          - core/server/web/api/endpoints/admin/routes.js
          - core/server/web/api/endpoints/admin/middleware.js
          - core/server/api/endpoints/utils/permissions.js
        tests:
          - test/e2e-api/admin/exports-request.test.ts
      startup:
        summary: >-
          Boot does not initialize this root explicitly. Its normal import occurs while the
          lazy Admin API router builds, potentially on the first Admin API request after boot;
          building the route imports the singleton. Core config, authentication and permissions
          must already be usable for the HTTP path.
          Direct class use has no readiness guard and validates export configuration only on
          requestExport. The HTTP suite uses completed boot; it does not pin lazy construction
          timing or initialization failure.
        sources:
          - core/boot.js
          - core/shared/express.js
          - core/server/web/parent/backend.js
          - core/server/web/api/app.js
          - core/server/web/api/endpoints/admin/app.js
          - core/server/web/api/endpoints/admin/routes.js
          - core/server/api/endpoints/index.js
          - core/server/services/export-requests/export-requests-service.ts
          - package.json
        tests:
          - test/e2e-api/admin/exports-request.test.ts
      lifetime:
        summary: >-
          The module cache owns singleton identity and the endpoint keeps its imported reference;
          replacing an export does not update that reference. There is no reset, reinit or
          disposal hook and no mutable job state. Every call builds its own signed payload;
          overlapping or repeated calls can send independently with no deduplication, pending
          promise, local persistence or completion tracking. These lifetime boundaries are
          established from source, not identity, concurrency or restart assertions.
        sources:
          - core/server/services/export-requests/export-requests-service.ts
          - core/server/api/endpoints/exports.js
          - core/boot.js
          - core/server/ghost-server.ts
        tests: []
      configuration:
        summary: >-
          Each call reads webhook URL, signing secret and site ID through the retained config
          object's get method, then captures those values for that request. URL and secret
          require nonempty strings; string/number site IDs are normalized to a nonempty string.
          There is no captured configuration subtree. Later get calls observe a replacement
          tree, but config set/reset is test support rather than production hot reload.
          Public config omits the signing secret. Tests cover initial values, numeric IDs,
          missing settings and secret omission, not explicit same-instance replacement.
        sources:
          - core/server/services/export-requests/export-requests-service.ts
          - core/shared/config/validated.ts
          - core/server/api/endpoints/utils/public-config/config.js
        tests:
          - test/unit/server/services/export-requests/export-requests-service.test.ts
          - test/e2e-api/admin/exports-request.test.ts
      resources:
        summary: >-
          The service creates no database record, worker or own timer. It awaits the shared
          request dependency with a 30-second request-timeout option and retry limit zero.
          Installed dependency source shows shared DNS cache/timers and transport-owned
          requests; this root exposes no cancellation or disposal. HTTP shutdown bounds the
          incoming request drain but does not pass cancellation to the outbound delivery.
          Unit tests assert retry options; HTTP tests intercept outbound transport. Timeout,
          redirects, DNS/socket cleanup and pending-delivery shutdown are not exercised.
        sources:
          - core/server/services/export-requests/export-requests-service.ts
          - core/server/lib/signed-webhook.ts
          - core/server/api/endpoints/exports.js
          - core/server/ghost-server.ts
          - package.json
        tests:
          - test/unit/server/services/export-requests/export-requests-service.test.ts
          - test/e2e-api/admin/exports-request.test.ts
      failures:
        summary: >-
          Missing URL rejects with NotFoundError; missing secret/site ID logs and rejects with
          IncorrectUsageError. Rejected delivery logs the transport message and becomes a
          generic status-502 InternalServerError. Config reads, signing/serialization and
          pre-send logging are outside that catch; logger failure can also replace the intended
          error. A resolved request supplies no confirmation of archive generation or
          compensation for ambiguous delivery. Unit and HTTP tests prove configuration errors,
          the signed wire payload and failed-delivery mapping; pre-send exceptions, real
          timeout behavior and remote completion are outside their coverage.
        sources:
          - core/server/services/export-requests/export-requests-service.ts
          - core/server/lib/signed-webhook.ts
          - core/server/api/endpoints/exports.js
        tests:
          - test/unit/server/services/export-requests/export-requests-service.test.ts
          - test/e2e-api/admin/exports-request.test.ts
    unverified: []
    blockers:
      - >-
        Pin singleton publication, lazy Admin-router construction and retained endpoint identity
        across repeated boot before changing composition. Existing HTTP tests use completed
        boot and injected-class tests do not establish the module lifecycle. Cover partial
        initialization separately.
      - >-
        Add same-instance configuration replacement tests, including changes while a request
        is pending. Current test config set/reset rebuilds immutable trees; it does not
        establish production hot reload. Pin staff-token authorization separately.
      - >-
        Establish pending-delivery and shared transport ownership before adding disposal.
        Retry limit zero is asserted, but actual timeout, redirect and shutdown behavior is
        not. The installed transport follows redirects; zero retries alone is not proof of
        one outbound request or safe cancellation after a lost response.
      - >-
        Characterize overlapping requests, ambiguous delivery and pre-send config/signing/logging
        failures without treating local 202 as completed export generation. There is no local
        job persistence, idempotency or compensation; the host's behavior is outside this
        repository and intercepted HTTP tests cannot prove remote completion.
  exports:
    kind: directory
    disposition: relocate
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - exports/site-exporter.ts
      - exports/export-components.ts
    notes: >-
      Relocate caller-constructed archive support to server/lib/site-export. Preserve
      operation-owned streams, partial-export policy and temporary-file cleanup.
    contracts:
      exports:
        summary: >-
          There is no index. TypeScript exports the SiteExporter class, type-only dependencies,
          and synchronous/asynchronous component arrays. as const is compile-time readonly;
          the arrays are not frozen at runtime, and the async list is a separate initial copy
          with media appended. Receiver-dependent createArchive returns a new Archiver stream
          synchronously; no init/stop/reset exists. Units consume real archives from constructed
          classes, but do not assert complete module shape or runtime constant mutation behavior.
        sources:
          - core/server/services/exports/site-exporter.ts
          - core/server/services/exports/export-components.ts
        tests:
          - test/unit/server/services/exports/site-exporter.test.ts
      construction:
        summary: >-
          SiteExporter retains the supplied dependency object without executing or validating
          its callbacks. Each Admin download constructs it anew; createArchive lazily loads
          Archiver, creates per-archive cleanup state and starts asynchronous population before
          returning. The endpoint retains its own PostsService and other service wrappers, while
          callbacks read current members/theme/route/redirect APIs. Units inject dependencies;
          real download HTTP exercises current endpoint construction, not constructor timing,
          dependency replacement or multiple archives on one retained exporter.
        sources:
          - core/server/services/exports/site-exporter.ts
          - core/server/api/endpoints/exports.js
          - core/server/services/posts/posts-service-instance.js
        tests:
          - test/unit/server/services/exports/site-exporter.test.ts
          - test/e2e-api/admin/exports-download.test.js
      consumers:
        summary: >-
          The exports endpoint is the sole production class consumer. Its response serializer
          wraps the archive in the shared stream-response pipeline with zip/attachment headers
          and no-transform. Export requests separately imports the asynchronous component list;
          that provider request does not use SiteExporter. Real HTTP asserts selected full/subset
          zip entries, JSON shape/posts, the members CSV header, analytics beyond the default page limit,
          one valid nested theme zip and successful import-surface statuses. It does not compare
          fully restored data. The members CSV split-count assertion can pass with only a header
          and terminator; unit composition asserts filenames rather than all contents.
        sources:
          - core/server/api/endpoints/exports.js
          - core/server/api/endpoints/utils/serializers/output/exports.js
          - core/server/api/endpoints/utils/serializers/output/stream-zip-response.ts
          - core/server/api/endpoints/utils/serializers/output/stream-response.ts
          - core/server/services/export-requests/export-requests-service.ts
        tests:
          - test/e2e-api/admin/exports-download.test.js
          - test/unit/server/services/exports/site-exporter.test.ts
      startup:
        summary: >-
          There is no boot hook. The Admin endpoint is normally loaded through lazy router/API
          getters and creates archives only on download. Callbacks require initialized member,
          theme, route and redirect APIs plus database/URL/settings dependencies; a failed
          component is ordinarily skipped. The HTTP route requires db.exportContent permission
          without a feature flag. Existing HTTP tests assert editor 403 and selected validation
          422 responses; successful real boot does not establish calls
          before dependency readiness, restart or partially initialized component recovery.
        sources:
          - core/server/api/endpoints/index.js
          - core/server/api/endpoints/exports.js
          - core/server/web/api/endpoints/admin/routes.js
          - core/server/web/api/app.js
          - core/shared/express.js
          - core/server/services/exports/site-exporter.ts
        tests:
          - test/e2e-api/admin/exports.test.js
          - test/e2e-api/admin/exports-download.test.js
      lifetime:
        summary: >-
          Every archive has a distinct selected-component Set and cleanup array. Population
          follows the synchronous list order, deduplicating selection; acquiring/appending a
          stream does not wait for its bytes to drain before later components are acquired.
          Archive close destroys acquired sources and launches cleanup without awaiting it.
          A source acquired after destruction is destroyed immediately; late theme staging
          runs its cleanup directly. Tests manually destroy archives and assert a fake source
          is destroyed and staged files disappear, including delayed theme acquisition. They
          do not establish physical database release or real socket disconnect/shutdown behavior.
        sources:
          - core/server/services/exports/site-exporter.ts
          - core/server/api/endpoints/utils/serializers/output/stream-response.ts
        tests:
          - test/unit/server/services/exports/site-exporter.test.ts
      configuration:
        summary: >-
          No config is read by SiteExporter itself. The API defaults absent selection to all
          synchronous components and rejects explicit empty/unknown/media selections. Routes
          selects both routes.yaml and redirects.yaml. Nested callbacks request limit:all and
          restricted post-field handling; members and posts capture reference/settings data
          before streaming, while content reads selected tables sequentially without a shared
          export transaction. Theme names are read when reached, and lazy ThemeStorage retains
          its configured path. Tests pin subset filenames, repeated query acceptance and at
          least twenty analytics rows, not a coherent cross-component snapshot or every limit.
        sources:
          - core/server/services/exports/export-components.ts
          - core/server/services/exports/site-exporter.ts
          - core/server/api/endpoints/exports.js
          - core/server/services/members/import-export/export/exporter.ts
          - core/server/services/posts/posts-exporter.js
          - core/server/data/exporter/exporter.js
          - core/server/services/themes/storage.js
          - core/server/services/themes/theme-storage.js
        tests:
          - test/unit/server/services/exports/site-exporter.test.ts
          - test/e2e-api/admin/exports.test.js
          - test/e2e-api/admin/exports-download.test.js
      resources:
        summary: >-
          Each operation owns a zip/compression stream, acquired CSV sources and theme staging
          cleanup callbacks; it borrows service/database/filesystem capabilities. Endpoint
          pipelines connect row streams to CSV transforms and the archive to HTTP. Members
          uses a database stream; posts uses a paged async generator. Content JSON is fully
          buffered and themes stage sequentially as files. Installed theme compression creates a
          file stream without an output-error handler and ignores its finalization promise;
          promise rejection does not itself destroy those streams. No root registry/cancel/drain tracks
          pending callbacks or cleanup. Unit stream errors/disconnects use local streams/files;
          full HTTP buffers the result. No slow-reader, bounded-memory, real DB-release or
          cleanup-failure assertion establishes complete resource safety.
        sources:
          - core/server/services/exports/site-exporter.ts
          - core/server/api/endpoints/exports.js
          - core/server/api/endpoints/utils/serializers/output/stream-response.ts
          - core/server/services/members/import-export/export/exporter.ts
          - core/server/services/posts/posts-exporter.js
          - core/server/data/exporter/exporter.js
          - core/server/services/themes/theme-storage.js
        tests:
          - test/unit/server/services/exports/site-exporter.test.ts
          - test/e2e-api/admin/exports-download.test.js
      failures:
        summary: >-
          Component acquisition failures log and skip; individual theme/YAML failures preserve
          siblings. Source-stream errors destroy the whole archive; population/finalization
          rejection also destroys it. Shared HTTP pipeline forwards stream errors to next.
          Cleanup promise rejections are swallowed; theme staging failures reaching its promise
          rejection cause the endpoint to await removal,
          whose failure can replace the original error. Pending JSON/YAML callbacks are not
          cancelled on close. Units assert selected skipped files and mid-stream rejection;
          CSV serializer tests assert response error identity through the same shared helper.
          They do not prove log/cleanup-failure behavior or all zip-specific HTTP error paths.
        sources:
          - core/server/services/exports/site-exporter.ts
          - core/server/api/endpoints/exports.js
          - core/server/api/endpoints/utils/serializers/output/stream-response.ts
        tests:
          - test/unit/server/services/exports/site-exporter.test.ts
          - test/unit/api/canary/utils/serializers/output/posts-export-csv.test.ts
          - test/unit/api/canary/utils/serializers/output/members-export-csv.test.ts
    unverified: []
    blockers:
      - >-
        Preserve class/deep-import/component compatibility while relocating, and cover repeated
        or overlapping archives plus retained callback dependencies. Successful download/import
        statuses are not full round-trip data equality or a dependency-readiness contract.
      - >-
        Add real HTTP disconnect/slow-reader coverage through archive, CSV transforms and database
        sources; pin late source acquisition, pending content/YAML work, multiple theme cleanups
        and cleanup/finalization errors. Current manual archive destruction proves selected local
        cleanup only; close does not await cleanup or cancel every nested operation.
      - >-
        Characterize component acquisition/drain ordering, partial-export reporting and coherent
        export expectations under concurrent writes/settings changes. Content buffering and
        multiple active streams have no global size/concurrency bound; endpoint temp-directory
        creation and cleanup failure need explicit ownership before moving composition. Nested
        theme-compression output errors, early stat failure and ignored finalization rejection
        need characterization; endpoint rejection handling does not cover every acquired stream.
      - >-
        Strengthen artifact assertions where needed: exact nonempty member rows, complete selected
        contents, sensitive-setting fixture preconditions and restored data. Existing HTTP checks
        protect useful headers/archives and acceptance, not every field or leak-prevention branch.
  gift-links:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: c2999f4e13da6360bceced808bb52c4a04b5ad03
    entryPoints:
      - gift-links/index.ts
    notes: >-
      Preserve deferred database binding, single live link per post, historical tokens and the
      public access/cache boundary. Root restart, transaction faults and cache-enabled revocation
      need stronger contracts before migration.
    contracts:
      exports:
        summary: >-
          Named TypeScript init and live service exports; RequestContext is type-only. service
          is undefined before synchronous receiver-independent init, which returns undefined.
          The deep class requires its receiver: getPost/ensure/create return a post id plus
          giftLinks, getPostByToken returns that shape or null, and removeAll returns a number.
          Deep serializers map token/createdAt to gift_links token/created_at and removal count
          to meta.count. Admin tests assert list/field allowlists, replacement and count shape;
          no focused test pins root exports, detached calls or binding identity.
        sources:
          - core/server/services/gift-links/index.ts
          - core/server/services/gift-links/service.ts
          - core/server/services/gift-links/models.ts
          - core/server/services/gift-links/serializers.ts
          - core/server/api/endpoints/utils/serializers/output/gift-links.ts
        tests:
          - test/e2e-api/admin/gift-links.test.ts
          - test/integration/services/gift-links.test.ts
      construction:
        summary: >-
          Import loads the class/action helper without constructing a service. First init reads
          the shared database knex and models, partially applies the best-effort action recorder
          and publishes one GiftLinksService retaining knex and the callback. Later init calls
          preserve it. No separate production deep construction was found. The constructor
          validates neither dependency nor database readiness; an early init can publish an
          unusable captured dependency. Integration tests construct the class with real model
          knex and matching recorder wiring; they do not enforce the root's deferred construction.
        sources:
          - core/server/services/gift-links/index.ts
          - core/server/services/gift-links/service.ts
          - core/server/services/gift-links/actions.ts
          - core/server/data/db/index.js
          - core/server/data/db/connection.ts
        tests:
          - test/integration/services/gift-links.test.ts
      consumers:
        summary: >-
          Boot initializes the root. Admin posts/pages gift-link endpoints use the live binding
          for browse/ensure/create and site-wide removal, with permission checks and actor mapping
          in the endpoint. Public posts/pages reads use gift-link-access to resolve internal
          context before the posts response cache, then apply a paid-member shim for the matched post.
          Pages currently has no response cache but resolves the same key data.
          Frontend entry lookup supplies that context; HTTP Content API gift query parameters
          do not. Verified frontend renders set no-store/noindex/no-referrer and feed toast and
          analytics helpers without exposing a member. Real HTTP tests pin access/redirects,
          response headers, toast overrides and rendered analytics attributes, not analytics
          ingestion. Admin role tests cover Owner success and Author/Contributor browse denial,
          not every mutation/role or integration actor path.
        sources:
          - core/boot.js
          - core/server/api/endpoints/gift-links.ts
          - core/server/web/api/endpoints/admin/routes.js
          - core/server/api/endpoints/posts-public.js
          - core/server/api/endpoints/pages-public.js
          - core/server/api/endpoints/utils/gift-link-access.ts
          - core/frontend/services/data/entry-lookup.js
          - core/frontend/services/routing/controllers/entry.ts
          - core/frontend/services/routing/controllers/entry/gift-links.ts
          - core/frontend/web/middleware/frontend-caching.js
          - core/frontend/helpers/ghost_head.js
          - core/frontend/helpers/ghost_foot.js
        tests:
          - test/e2e-api/admin/gift-links.test.ts
          - test/e2e-api/content/gift-links.test.ts
          - test/e2e-frontend/gift-links.test.ts
          - test/e2e-frontend/gift-links-toast-override.test.ts
          - test/unit/api/endpoints/utils/gift-link-access.test.ts
      startup:
        summary: >-
          initCore calls init after database setup, settings, signing keys and i18n and before
          request serving. There is no awaited initialization work or root readiness check;
          consumers dereference service directly. Gift-access key resolution additionally needs
          the live-link tables, while the paid-member shim reads Product models. Root and deep
          codec/serializer imports do not need service initialization. Frontend/Admin suites
          exercise booted composition, but no focused test covers pre-init access, failed/early
          init, publication timing or booting again with a different database instance.
        sources:
          - core/boot.js
          - core/server/services/gift-links/index.ts
          - core/server/api/endpoints/gift-links.ts
          - core/server/api/endpoints/utils/gift-link-access.ts
          - core/server/services/members/create-paid-member-shim.ts
        tests:
          - test/e2e-api/admin/gift-links.test.ts
          - test/e2e-frontend/gift-links.test.ts
      lifetime:
        summary: >-
          Service and captured knex survive repeated init; no reset/stop/rebinding exists. Reads
          query persisted state without a service cache. Mint inserts token history and upserts
          one live association in a transaction; create replaces access while keeping history,
          ensure returns an existing link or mints after a separate read, and removeAll deletes
          every live association but keeps history. Unique post_id enforces at most one live
          link, not concurrent ensure returning the same token. Tests pin sequential ensure,
          replaced-token rejection, removal scope/count and uniqueness. Concurrent Admin ensures
          assert one surviving returned token, without forcing both reads before mint or pinning
          which caller wins. Public key units stub token lookup; actual cached revocation is untested.
        sources:
          - core/server/services/gift-links/index.ts
          - core/server/services/gift-links/service.ts
          - core/server/data/schema/schema.js
          - core/server/api/endpoints/utils/gift-link-access.ts
          - core/server/api/endpoints/posts-public.js
        tests:
          - test/integration/services/gift-links.test.ts
          - test/e2e-api/admin/gift-links.test.ts
          - test/unit/api/endpoints/utils/gift-link-access.test.ts
      configuration:
        summary: >-
          The root/service read no feature config, settings or URL values. Database config is
          captured by the borrowed connection; tokens use 24 random bytes encoded base64url and
          creation time uses Date. No expiry, use count, visibility gate or automatic visibility
          revocation exists here. API permissions and frontend format/cache rules are consumer
          policy. Public key generation distinguishes no token, unresolved token and resolved
          post id; the latter reuses a cache variant across replacement tokens. URL-based toast
          assets use the separately frozen shared URL helpers, while branding/analytics settings
          are consumer reads. Tests pin URL-safe tokens, decoded minimum byte length and sampled
          uniqueness, not entropy mathematically; config test replacement is not hot reload evidence.
        sources:
          - core/server/services/gift-links/index.ts
          - core/server/services/gift-links/service.ts
          - core/server/services/gift-links/models.ts
          - core/server/services/gift-links/codec.ts
          - core/server/lib/db-types/date.ts
          - core/server/data/db/connection.ts
          - core/server/api/endpoints/gift-links.ts
          - core/server/api/endpoints/utils/gift-link-access.ts
          - core/frontend/services/routing/controllers/entry/markdown.ts
          - core/frontend/helpers/ghost_head.js
          - core/frontend/helpers/ghost_foot.js
          - core/shared/url-utils.ts
        tests:
          - test/unit/server/services/gift-links/gift-link-token.test.ts
          - test/unit/api/endpoints/utils/gift-link-access.test.ts
          - test/e2e-frontend/gift-links.test.ts
      resources:
        summary: >-
          No owned client, timer, worker, listener or memory cache. The service borrows the
          shared knex pool and owns per-mint transaction work; action history is a separate
          awaited model write after the command's database change. Database rows carry token
          history/live state, with foreign-key cascade deletion and no scheduled pruning here.
          The public response cache belongs to posts-public, and rendering/analytics belong to
          frontend consumers. There is no root drain or cleanup registration; shutdown depends
          on shared HTTP/database ownership. Real DB tests enforce live uniqueness and removal,
          not rollback, history retention/deletion cascades or in-flight shutdown.
        sources:
          - core/server/services/gift-links/service.ts
          - core/server/services/gift-links/actions.ts
          - core/server/data/db/connection.ts
          - core/server/data/schema/schema.js
          - core/server/models/action.js
          - core/server/services/posts-public/service.js
          - core/server/ghost-server.ts
          - core/boot.js
        tests:
          - test/integration/services/gift-links.test.ts
          - test/e2e-api/admin/gift-links.test.ts
      failures:
        summary: >-
          Missing posts throw NotFound; unknown or no-longer-live tokens return null. Query,
          codec, random generation and transaction errors propagate, without retries; action
          writes run after persistence and the production recorder logs/swallows failures, skipping
          writes when actor is absent. That boundary is enforced by action units and a real-DB
          deep-service test with a failing recorder. Gift access refuses missing key-resolution
          setup and rejects mismatched tokens; frontend strips invalid gifts with a 301 while
          other failures reach normal error handling. Product lookup failure logs and grants a
          paid shim with no tiers. Unit tests pin those helpers, but no forced mint rollback,
          delete failure, root failure or cache-enabled revoked-token response test was found.
        sources:
          - core/server/services/gift-links/service.ts
          - core/server/services/gift-links/actions.ts
          - core/server/services/gift-links/codec.ts
          - core/server/services/gift-links/models.ts
          - core/server/api/endpoints/utils/gift-link-access.ts
          - core/frontend/services/routing/controllers/entry.ts
          - core/frontend/services/routing/controllers/entry/gift-links.ts
          - core/server/services/members/create-paid-member-shim.ts
        tests:
          - test/unit/server/services/gift-links/actions.test.ts
          - test/integration/services/gift-links.test.ts
          - test/e2e-api/admin/gift-links.test.ts
          - test/unit/api/endpoints/utils/gift-link-access.test.ts
          - test/unit/server/services/members/create-paid-member-shim.test.ts
          - test/e2e-frontend/gift-links.test.ts
    unverified: []
    blockers:
      - >-
        Pin deferred root construction, live binding/identity, early and failed init, and
        repeated boot with shared database dependencies. Existing deep-service and booted HTTP
        tests do not establish safe rebinding or recovery from initialization before DB readiness.
      - >-
        Force transaction failures between history insertion and live-association upsert, and
        characterize overlapping ensure/create/removeAll, token collision and history retention.
        Concurrent HTTP ensures prove a single surviving returned token without forcing the race;
        they do not guarantee all callers retain access or that failed mint leaves no history.
      - >-
        Exercise real public cache population and token replacement/removal together, proving
        revoked/wrong-entry reads cannot use unlocked or anonymous cached responses. Current key
        tests stub lookup and do not drive a cache; public HTTP gift tests run without that cache.
      - >-
        Complete consumer permissions and failure coverage for mutation denials, integration actors,
        delete/codec failures and shutdown with in-flight commands. Keep business access policy in
        scope when migrating: permission checks, gift verification and the paid-member shim are
        currently wired through API support, not all contained in this root.
  gifts:
    kind: directory
    disposition: retain
