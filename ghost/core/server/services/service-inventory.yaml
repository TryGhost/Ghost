          per use, but the shared URL helper freezes site/subdirectory/admin URLs at
          import; this is not a URL hot-reload contract. Privacy is read from settings
          cache before enqueueing post events, not rechecked by sendWebmentions/sendAll.
          Source URL and current/previous HTML are captured before dispatch. Helper
          units assert missing-relation loading and post/page serializer selection;
          sender units assert fixed enablement gates, captured payload fields and
          destroyed-post previous data. Discovery/send/metadata request 15-second
          timeouts and retry limit three; shared transport test hooks replace these
          with five seconds/no retries. The installed Got defaults exclude POST retries; setting
          that limit alone does not enable them. Routing and transport units cover selected
          URL/status/form cases, not production retries or root configuration changes.
          Discovery resolves relative Link-header and HTML endpoints against the response URL;
