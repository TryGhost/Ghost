    contracts:
      exports:
        summary: >-
          CommonJS exports an eager wrapper with receiver-dependent async init(); repository,
          service and controller are absent until initialization publishes them. Deep modules
          export constructible classes. Service link methods are synchronous: buildLink and
          buildFallbackLink return URL objects, while buildEmailLink returns a string. Controller
