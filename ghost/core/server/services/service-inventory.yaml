          - test/unit/server/services/audience-feedback/feedback-repository.test.js
          - test/e2e-api/members/feedback.test.js
      resources:
        summary: >-
          This graph owns references and a URL, with no timer, subscription, provider client or
          shutdown hook. Repository operations borrow shared models/database; URL routing state
          and permission state belong to their shared dependencies. No feedback operation is
          tracked, cancelled or drained by this wrapper, and add/edit do not propagate caller
          transaction options. MemberFeedback forbids direct destroy, while schema foreign keys
          declare deletion with the member/post. Other subsystems read these rows directly for
          activity and post/member analytics; they do not own a feedback-service instance.
          Model tests pin missing-field validation and disabled destroy, not cleanup, cascades,
          transaction behavior or pending-query ownership.
        sources:
