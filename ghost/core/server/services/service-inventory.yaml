      configuration:
        summary: >-
          Initialization captures cache enablement and web-analytics client presence; the factory
          also initializes Tinybird whenever stats config is truthy, without a labs gate. Request-time
          date/filter options and config/settings lookups differ from those captured choices;
          test config replacement is not production hot reload. Member forwarding maps dateFrom
          to startDate; missing newsletter IDs return method-specific empty values. Real SQLite
          class tests pin selected MRR history/currency, member/gift deltas, custom-start output,
          subscription tier/cadence and referrer totals. Posts tests pin selected attribution,
          view fallback/backfill, page exclusion and UTC subscriber values. They use simplified
          schema and injected provider/URL collaborators, not complete root/MySQL composition.
        sources:
          - core/server/services/stats/stats-service.js
          - core/server/services/stats/service.js
          - core/server/services/stats/utils/tinybird.js
          - core/server/services/stats/utils/date-utils.js
          - core/server/services/stats/mrr-stats-service.js
          - core/server/services/stats/members-stats-service.js
          - core/server/services/stats/subscription-stats-service.js
          - core/server/services/stats/referrers-stats-service.js
          - core/server/services/stats/posts-stats-service.js
          - core/server/services/stats/content-stats-service.js
          - core/shared/config/loader.ts
        tests:
          - test/unit/server/services/stats/stats.test.ts
          - test/unit/server/services/stats/mrr.test.js
          - test/unit/server/services/stats/members.test.js
          - test/unit/server/services/stats/subscriptions.test.js
          - test/unit/server/services/stats/referrers.test.js
          - test/unit/server/services/stats/posts.test.js
          - test/e2e-server/services/stats/mrr-stats-service.test.js
      resources:
        summary: >-
          Components borrow knex/URL/query clients and own no pool, timer or subscription;
          the passed models facade is unused. Independent
          queries do not share a snapshot; enrichment fans out lookups, and date ranges can
          allocate uncapped daily series. Shared request-external owns agents; query options ask
          for 35-second timeout/zero retries, with POST AbortSignal. Optional cache adapters can
          own timers, background refresh and Redis clients; stats registers no cleanup or drain.
          Units assert query-client options with fake HTTP; SQLite/HTTP statistics assertions
          do not prove query cancellation, transport/cache release or consistent concurrent reads.
        sources:
          - core/server/services/stats/service.js
          - core/server/services/stats/utils/tinybird.js
          - core/server/services/stats/posts-stats-service.js
          - core/server/services/stats/content-stats-service.js
          - core/server/services/stats/members-stats-service.js
          - core/server/lib/request-external.js
          - core/server/adapters/cache/AdapterCacheMemoryTTL.js
          - core/server/adapters/lib/redis/AdapterCacheRedis.js
          - core/server/adapters/lib/redis/redis-store-factory.js
          - core/boot.js
        tests:
          - test/unit/server/services/stats/utils/tinybird.test.js
      failures:
        summary: >-
          A failed cache acquisition leaves api published and suppresses retry. Uncaught
          MRR/member/subscription/referrer query failures reject; posts/content methods commonly
          log and substitute different empty arrays, objects or zero-series shapes. Content
          has false url_exists when missing/not-ready, unlike posts' true default; thrown URL
          lookup changes content's existence fallback to true. Tinybird build errors precede
          its fetch catch; caught transport/parse errors return null. Posts view queries backfill
          on absent/empty provider data but return empty data on rejected fetch. Selected units
          pin fake provider/URL failure and fallback results. The first two content client tests
          invoke only stubs; they prove no production transport behavior. Root partial-failure
          recovery, real cache errors and many nested query failure channels lack assertions.
        sources:
          - core/server/services/stats/service.js
          - core/server/services/stats/utils/tinybird.js
          - core/server/services/stats/mrr-stats-service.js
          - core/server/services/stats/members-stats-service.js
          - core/server/services/stats/subscription-stats-service.js
          - core/server/services/stats/referrers-stats-service.js
          - core/server/services/stats/posts-stats-service.js
          - core/server/services/stats/content-stats-service.js
        tests:
          - test/unit/server/services/stats/utils/tinybird.test.js
          - test/unit/server/services/stats/posts.test.js
          - test/unit/server/services/stats/content.test.js
    unverified: []
    blockers:
      - >-
        Pin root identity, return/receiver behavior, synchronous publication and optional-cache
        acquisition across first/repeated/failed init and stop/reboot. The published-api guard
        currently prevents recovery after a cache failure; define that lifecycle explicitly
        before changing initialization or retaining old database/provider references.
      - >-
        Add real configured-cache consumer tests for early/later endpoint construction, shared
        identity, hits, invalidation/expiry, authorization and option isolation. The API pipeline
        returns cache hits before its permission stage; no role-isolation outcome is inferred.
        postReferrers
        allows date/order/limit/timezone options but its key contains only method and post ID;
        no existing stats HTTP assertion establishes correct distinct cached responses.
      - >-
        Protect captured web-analytics gates/token identity versus reread request configuration,
        and actual URL readiness/error behavior. Preserve method-specific empty/error/fallback
        distinctions, including rejected versus empty provider results, through real consumers
        rather than only injected collaborators or stub-self-asserting client tests.
      - >-
        Strengthen specific weak business assertions before moving composition: three member-
        attribution cases permit empty results; the page-growth fixture creates post-type events;
        referrer ranking tests re-sort actual output; four subscription-upgrade total assertions
        assign values instead of comparing them. Pin upgrade totals, true page attribution, filter/value
        forms, timezone/day boundaries, MySQL query failures and recovery. Existing real SQLite
        totals are useful evidence, not proof of every named contract or concurrent snapshots.
      - >-
        Establish ownership and limits for optional cache/HTTP resources, in-flight queries,
        unbounded date ranges and lookup fan-out. A stopped shared database or replaced token
        root does not reset this graph; no cancellation or cache/client disposal is exposed.
  stripe:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - stripe/index.js
    notes: >-
      Preserve the eager composite, stable API/controller references and deferred dependency
      getters. Configuration changes nested clients and remote registration; shutdown only
      removes an ephemeral webhook. These are separate lifetimes, not one disposable instance.
    contracts:
      exports:
        summary: >-
          CommonJS index forwards one StripeService instance with an added async init method. It
          exposes api, webhookController, webhookManager, billingPortalManager, migrations,
          models and async configure/connect/disconnect/shutdown methods. Configure, disconnect
          and shutdown require their receiver; connect does not, and added init closes over the
          module export. API configuration is synchronous; before configuration configured is
          false, mode reports live and testEnv dereferences absent config. Most operations have
          no shared readiness guard. Deep class units assert selected API arguments/results and
          controller status codes, not the real root shape, method binding, pre-init behavior or
          retained identity.
        sources:
          - core/server/services/stripe/index.js
          - core/server/services/stripe/service.js
          - core/server/services/stripe/stripe-service.js
          - core/server/services/stripe/stripe-api.js
          - core/server/services/stripe/webhook-controller.js
        tests:
          - test/unit/server/services/stripe/stripe-api.test.js
          - test/unit/server/services/stripe/webhook-controller.test.js
      construction:
        summary: >-
          Import eagerly constructs the service, API, migrations, webhook and billing managers,
          four event services and controller. Picked models and the API object are retained.
          Getter dependencies defer members repositories, donation repository, gifts service,
          staff emails until handler work; welcome-email capability is initialized on demand.
          The API retains the checkout-config module and reads its current service binding when a
          session uses the saved design; that service is initialized later than Stripe module construction. The SDK
          client and two rate buckets are acquired by each successful non-null API configure. No
          guard coalesces repeated or overlapping root init/configure, and no rollback covers
          partially configured collaborators. No focused real-root
          construction/dependency-capture or WebhookManager lifecycle test was found; injected
          handler tests do not protect these getters against eager capture.
        sources:
          - core/server/services/stripe/service.js
          - core/server/services/stripe/stripe-service.js
          - core/server/services/stripe/stripe-api.js
          - core/server/services/stripe/webhook-manager.js
          - core/server/services/stripe/services/webhook/checkout-session-event-service.js
          - core/server/services/stripe/services/webhook/invoice-event-service.js
          - core/server/services/stripe-checkout-config/index.ts
        tests:
