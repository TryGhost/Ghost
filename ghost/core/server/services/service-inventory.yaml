          - core/server/api/endpoints/stats.js
          - core/server/api/endpoints/index.js
          - core/server/web/api/endpoints/admin/routes.js
          - core/server/services/explore-ping/index.ts
          - core/server/services/explore-ping/explore-ping-service.ts
          - core/server/services/automations/automations-api.ts
        tests:
          - test/e2e-api/admin/stats.test.js
          - test/unit/server/services/explore-ping/explore-ping-service.test.js
          - test/e2e-api/admin/automations.test.js
      startup:
        summary: >-
          After model/settings setup and awaited Stripe startup, boot calls stats.init in its
          service Promise.all before Explore init, jobs registration/start and HTTP readiness.
          Captured knex and settings must be usable before queries; API construction before
          stats init captures a null cache even if api later becomes available. Factory errors
          reject boot; cache acquisition can fail after api publication. Existing HTTP suites
          exercise successful real boot and queries, not deferred readiness, early endpoint
