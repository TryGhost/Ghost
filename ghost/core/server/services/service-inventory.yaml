        Pin the root's exported fields, receiver requirements and retained consumers before
        replacing it. Preserve themes' cache reference, bound calculated-field/analytics methods
        and call-time proxy delegates; helper unit tests alone do not cover those identities.
      - >-
        Characterize methods before settings/limits readiness and failed calculated-field init
        or settings-event callbacks, including remaining cache entries/listeners. Existing
        repeated-init failures occur before cache replacement, not during helper evaluation.
      - >-
        Extend real address/domain composition beyond the existing managed/self-hosted sending
        cases to absent/unparseable mail.from and retained sender changes. Add signed-link
        generation-to-verification, Stripe key changes and caller-owned cache contracts. Other
        consumer tests often stub helper methods; distinguish live reads from frozen URLs, calculated settings
