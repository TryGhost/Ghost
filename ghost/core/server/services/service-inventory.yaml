          There is no catch/retry around helper dependencies. Invalid Stripe key type throws
          IncorrectUsageError; invalid URLs, missing signing keys, limit errors and truthy
          nonstring blocklist items can throw synchronously. Nonarray blocklists become empty,
          missing Stripe pairs return null, and an unparsed mail.from warns before fallback.
          Calculated-field exceptions can interrupt cache initialization or synchronous settings
          event delivery without undoing earlier work. Units pin nonarray/empty blocklist fallback
