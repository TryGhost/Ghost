        summary: >-
          Helpers own no timer, event subscription, database work or mail/provider client; URL,
          address parsing, HMAC and domain normalization are synchronous. They borrow shared
          cache and limit state. Settings-cache owns calculated-field listeners and reset, while
          mail/Stripe work and retained clients belong to callers. No cleanup or operation drain
          exists on this facade. Repeated-settings tests assert stable listener counts with real
          cache/events and fake DB/adapter input; they do not establish consumer shutdown or
