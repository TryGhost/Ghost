      resources:
        summary: >-
          Owns a RedirectEvent subscription, memoization cache and untracked async work; owns no
          database pool, timer or HTTP agent. Shared redirection owns its cache/listener, the
          default automations module imports shared request agents, and MembersEvents owns
          last-seen effects. No disposer or production drain is registered. Newsletter URL
