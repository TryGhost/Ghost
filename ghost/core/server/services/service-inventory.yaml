          - core/server/services/stats/service.js
          - core/server/services/stats/stats-service.js
          - core/server/api/endpoints/stats.js
          - core/server/web/api/endpoints/admin/routes.js
          - core/shared/express.js
        tests:
          - test/e2e-api/admin/stats.test.js
          - test/e2e-server/services/stats/mrr-stats-service.test.js
      lifetime:
        summary: >-
          The first published api/cache graph persists through subsequent init calls; no reset,
          shutdown or rebind exists. Components retain database/URL/query clients. The query
          client retains its token service while rereading config/settings facades; existing
          consumer units assert old token identity with new endpoint/site values and a new
          client's replacement token. Endpoint/pipeline retains the captured cache object;
          stats installs no invalidation listener. Adapter-manager clearCache does not update
          retained references. Pending query, cache refresh and stop/reboot behavior is source-only.
        sources:
          - core/server/services/stats/service.js
          - core/server/services/stats/stats-service.js
          - core/server/services/stats/utils/tinybird.js
          - core/server/api/endpoints/stats.js
          - core/server/services/adapter-manager/adapter-manager.ts
