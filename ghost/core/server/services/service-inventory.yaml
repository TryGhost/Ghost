          the inactive-load stub is called in test environments; they do not hold its
          promise or exercise active-theme init. Middleware units assert mounting an unmounted fake, skipping an already-mounted
          fake and missing-theme responses. Real HTTP exercises
          normal boot/activation/rendering, not missing/fatal-theme boot or an init barrier.
        sources:
          - core/boot.js
          - core/server/services/themes/index.js
          - core/server/services/themes/activate.js
          - core/server/services/themes/loader.js
          - core/server/services/themes/list.js
          - core/frontend/services/theme-engine/active.js
          - core/frontend/services/theme-engine/middleware/ensure-active-theme.js
        tests:
          - test/unit/boot-email-analytics.test.ts
          - test/unit/frontend/services/theme-engine/middleware.test.js
          - test/unit/frontend/services/theme-engine/active.test.js
          - test/e2e-api/admin/themes.test.js
          - test/e2e-frontend/theme-i18n.test.js
      lifetime:
        summary: >-
          Source-checked: there is no root init guard, reset or shutdown. Reinitializing
          reacquires the validation adapter and attempts to replace the active frontend object;
          the list, lazy storage and captured API functions have independent lifetimes.
          List.set deep-clones its input but get/getAll return live references, and
          list.init replaces the backing object; old references can survive replacement.
          Validation results are keyed only by theme name and destroy does not clear
          them. Adapter-manager caches instances by adapter name/class, so repeat init
          is not a guaranteed cache refresh. List units assert get/set/delete/reset
          values and validation units assert a second read skips checking; neither
          proves reference isolation, repeated root init or overlapping activation.
        sources:
          - core/server/services/themes/index.js
          - core/server/services/themes/list.js
          - core/server/services/themes/validate.js
          - core/server/services/themes/storage.js
          - core/server/services/adapter-manager/adapter-manager.ts
          - core/server/adapters/cache/MemoryCache.js
          - core/frontend/services/theme-engine/active.js
        tests:
          - test/unit/server/services/themes/list.test.ts
          - test/unit/server/services/themes/validate.test.js
      configuration:
        summary: >-
          Source-checked: init reads active_theme and skipBootChecks each call. Loaders
          read the content path each call; ThemeStorage captures it on first file use
          and translation singletons capture it at import. Validation reads labs,
          upload limits and environment per check and suppresses warnings in production;
          cached results bypass those reads. The HTTP uploader captures its compressed
          size limit at import. Activation reads the locale, derives package config and
          invalidates shared assets; bridge settings events refresh translations.
          Asset URL helpers are frozen at import, not a URL hot-reload contract.
          Validation units assert size options passed to fake gscan. Frontend HTTP
          asserts English/German output, interpolation, missing-key and English fallback
          while changing settings, after explicitly resetting both translation paths.
          These assertions do not prove production content-path/config replacement.
        sources:
          - core/server/services/themes/index.js
          - core/server/services/themes/loader.js
          - core/server/services/themes/validate.js
          - core/server/services/themes/theme-storage.js
          - core/server/web/api/middleware/upload.js
          - core/bridge.js
          - core/frontend/services/theme-engine/active.js
          - core/frontend/services/theme-engine/config/index.js
          - core/frontend/services/theme-engine/i18n/index.js
          - core/frontend/services/theme-engine/i18next/index.js
          - core/frontend/services/assets-minification/admin-auth-assets.js
          - core/shared/url-utils.ts
        tests:
          - test/unit/server/services/themes/validate.test.js
          - test/e2e-frontend/theme-i18n.test.js
      resources:
        summary: >-
          Source-checked: themes coordinates filesystem trees, extracted/downloaded
          temporary files, archive/read streams and the shared validation adapter;
          custom settings/models own DB work. Upload extraction/backup/staging cleanup
          runs after the main operation without being joined; fatal validation and
          GitHub download cleanup also detach removal. The download handler starts
          removal after piping, without waiting for stream completion or attaching
          stream error/abort cleanup. Site export owns its separate ZIP callback.
          Bridge owns raw locale/labs listeners; themes has no unsubscribe/drain or
          cancellation. GitHub uses the shared @tryghost/request DNS client, with test
          retries disabled, and sets no timeout itself. Installed gscan/ZIP sources
          expose additional extraction/archive cleanup boundaries. Exporter units
          manually destroy an archive with fake ZIP acquisition and assert eventual
          staged-file removal; normal download HTTP only checks headers/status.
        sources:
          - core/server/services/themes/storage.js
          - core/server/services/themes/theme-storage.js
          - core/server/services/themes/validate.js
          - core/server/services/themes/installer.js
          - core/server/adapters/storage/LocalStorageBase.ts
          - core/server/api/endpoints/exports.js
          - core/server/services/exports/site-exporter.ts
          - core/server/web/api/middleware/upload.js
          - core/bridge.js
          - core/frontend/services/theme-engine/engine.js
          - core/frontend/services/theme-engine/i18n/i18n.js
          - core/frontend/services/theme-engine/i18next/theme-i18n.js
          - package.json
        tests:
          - test/unit/server/services/exports/site-exporter.test.ts
          - test/e2e-api/admin/themes.test.js
          - test/e2e-api/admin/exports-download.test.js
      failures:
        summary: >-
          Source-checked: import/acquiring the cache can reject boot, but active-theme
          load/check/activation errors are logged and swallowed; even a fatal boot
          validation result proceeds to activation. API missing/fatal themes reject,
          while bridge engine/asset exceptions are logged and swallowed after custom
          settings activation. Upload stages before moving the live tree, and restores
          a backup only if the target is absent; later failures need not undo file,
          list, frontend or settings changes, and rollback errors can replace the
          original error. Validation units assert injected ZIP rejection, fatal-result
          predicates, cached result reuse and fallback after a throwing cache get;
          they do not test real fatal checkSafe cleanup or cache-set failure. Storage
          units assert copy-before-rename, no rename on failed copy and restore invocation
          before delete on promotion failure, using fake filesystem collaborators.
          HTTP asserts unknown-copy-theme 422 and a mocked limit's 403 before GitHub
          requests. Reporter units assert exact log/Sentry arguments for an entry limit.
        sources:
          - core/server/services/themes/index.js
          - core/server/services/themes/activate.js
          - core/server/services/themes/activation-bridge.js
          - core/server/services/themes/validate.js
          - core/server/services/themes/storage.js
          - core/server/services/themes/installer.js
          - core/server/services/themes/upload-size-limit-reporter.js
          - core/server/api/endpoints/themes.js
          - core/bridge.js
        tests:
          - test/unit/server/services/themes/validate.test.js
          - test/unit/server/services/themes/storage.test.ts
          - test/unit/server/services/themes/upload-size-limit-reporter.test.js
          - test/e2e-api/admin/themes.test.js
    unverified: []
    blockers:
      - >-
        Protect real root import/pre-init exports, cache acquisition failure, repeat
        initialization and retained deep consumers before changing construction. The
        existing operation tests do not pin these boundaries or the transitive import
        filesystem work. Preserve the distinct boot log-and-continue versus API reject
        behavior and verify the custom-settings prerequisite with held/failing work.
      - >-
        Characterize inactive-list loading and concurrent activate/upload/delete/init
        before adding lifecycle serialization or reset. Background scanning is unawaited
        and replaces the list; live references and name-only validation results can
        outlive removal/replacement. Importer activation is also unawaited and does not
        receive its caller's transaction, so import completion is not activation completion.
      - >-
        Cover settings/frontend/file partial failure boundaries before changing their
        ownership: custom settings activation precedes frontend activation, bridge errors
        can be swallowed, and the Admin setting is persisted afterward. Upload settings
        copy and promoted files are not rolled back together; restoration failure can
        replace the original error and is followed by detached backup deletion. Existing
        fake storage cases establish only their specific invocation order and failures.
      - >-
        Establish cleanup/drain ownership before moving archive or transport acquisition.
        Test actual download completion/abort/error, removal rejection and extraction
        failure; successful HTTP or manual exporter archive destruction does not cover
        themes' download stream. Installed gscan keeps extracted trees and can fail before
        returning a checked path, while cleanup uses the resolved theme path rather than
        necessarily the extraction root. ZIP compression lacks an output-stream error
        handler in the inspected dependency. These are source-derived risks, not reproduced
        regressions. No root disposal covers requests, shared adapter resources or detached work.
      - >-
        Pin configuration timing if dependency capture changes: separate loader/storage/
        translation paths, shared asset snapshots, cached warnings and live settings/labs.
        Theme-i18n HTTP resets captured paths manually; Nock GitHub cases do not exercise
        production retries, deadlines or DNS/socket disposal. Record these themes-specific
        obligations without making unrelated business fixes prerequisites for the pilot.
  tiers:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - tiers/index.js
      - tiers/service.js
    notes: >-
      Boot owns the tier repository and API. Tier data is cached; members also deep-imports the
      wrapper.
    contracts:
      exports:
        summary: >-
          Source establishes that CommonJS index and service export the same mutable wrapper
          instance, with receiver-dependent async init and no shutdown/reset. repository and api
          are absent before initialization and become public properties. The API exposes async
          browse/read/readDefaultTier/add/edit; browse returns one-page metadata, read returns
          null for a missing valid ID and readDefaultTier can return undefined. API units use
          the separate in-memory repository: they assert edited name, archived status, browse
          counts and a default-tier name, but only a truthy add/read result. Root export
          identity, property timing and missing-result shapes are source-only.
        sources:
          - core/server/services/tiers/index.js
          - core/server/services/tiers/service.js
          - core/server/services/tiers/tiers-api.js
          - core/server/services/tiers/tier-repository.js
          - core/server/services/tiers/in-memory-tier-repository.js
        tests:
          - test/unit/server/services/tiers/tiers-api.test.js
      construction:
        summary: >-
          The wrapper is constructed at import; init lazily creates TierRepository with Product
          and DomainEvents, and a slug collaborator calling Product.generateSlug. It awaits
          loading products with benefits, publishes repository then TiersAPI. This is the only
          production construction path found for these two implementations. Deep Tier and event
          classes support that graph; the in-memory tier repository is used by API units, not
          production composition. These wiring and publication claims are source-only; fully
          booted HTTP tests do not isolate construction.
        sources:
          - core/server/services/tiers/service.js
          - core/server/services/tiers/tier-repository.js
          - core/server/services/tiers/tiers-api.js
          - core/server/services/tiers/tier.js
          - core/server/services/tiers/in-memory-tier-repository.js
        tests: []
      consumers:
        summary: >-
          Source searches found boot, Admin/Content tier endpoints, post/page/
          preview/email-post serializers, members imports/access middleware/controllers, gifts
          and Stripe checkout previews. These consumers retain the wrapper and resolve api at
          use; members middleware deep-imports service.js, while payments deep-imports three
          tier event classes. The preview callback resolves the current api.read for each
          request. Its HTTP tests assert refusal of free, absent and malformed tiers, but do not
          test replacing the tiers API. Admin HTTP assertions cover serialized browse/add/edit
          fields, visibility and null trial-day updates, plus a persisted benefit capitalization
          check. Content HTTP assertions cover active/visibility filtering. The gift delivery
          unit proves API lookup at send time with an injected wrapper whose api is assigned
          after construction. It does not initialize the real root; other retained-consumer and
          event paths are source-checked rather than comprehensively protected by those tests.
        sources:
          - core/boot.js
          - core/server/api/endpoints/tiers.js
          - core/server/api/endpoints/tiers-public.js
          - core/server/api/endpoints/utils/serializers/input/tiers.js
          - core/server/api/endpoints/utils/serializers/output/tiers.js
          - core/server/api/endpoints/utils/serializers/output/posts.js
          - core/server/api/endpoints/utils/serializers/output/pages.js
          - core/server/api/endpoints/utils/serializers/output/previews.js
          - core/server/api/endpoints/utils/serializers/output/email-posts.js
          - core/server/services/members/service.js
          - core/server/services/members/api.js
          - core/server/services/members/middleware.js
          - core/server/services/members/members-api/members-api.js
          - core/server/services/members/members-api/controllers/member-controller.js
          - core/server/services/members/members-api/controllers/router-controller.js
          - core/server/services/members/members-api/services/payments-service.js
          - core/server/services/gifts/index.ts
          - core/server/services/gifts/gift-service.ts
          - core/server/services/gifts/gift-delivery-service.ts
          - core/server/services/stripe-checkout-config/index.ts
          - core/server/services/stripe-checkout-config/preview-service.ts
        tests:
          - test/e2e-api/admin/tiers.test.js
          - test/e2e-api/content/tiers.test.js
          - test/unit/server/services/gifts/gift-delivery-service.test.ts
          - test/e2e-api/admin/stripe-checkout-preview.test.ts
      startup:
        summary: >-
          Source establishes that initServices awaits Stripe, constructs gifts with the tiers
          wrapper, then awaits tiers.init alongside members.init. Tier loading must complete
          before that group and boot can finish; members and gifts deliberately retain the
          wrapper before its API is available. There is no pending-init promise: the guard only
          checks an already-published api, so overlapping calls can each load and publish a
          graph. These ordering and concurrency contracts have no focused test. HTTP fixtures
          separately call repository.init after inserting fixture rows; that refresh is not
          evidence that calling the guarded wrapper again reloads tiers.
        sources:
          - core/boot.js
          - core/server/services/tiers/service.js
          - core/server/services/members/members-api/members-api.js
          - core/server/services/gifts/index.ts
          - test/utils/fixture-utils.js
        tests: []
      lifetime:
        summary: >-
          Source establishes that successful sequential init calls retain the repository and API
          without reloading. The repository keeps tiers and an ID set; reads filter that cache
          and construct new Tier objects, but retain their benefits arrays, Date objects and
          ObjectIDs. Scalar edits on a read copy are separate until save, while nested mutation
          can affect cached data. External database changes are not observed until explicit
          repository.init; save caches its pre-write Tier copy without applying the returned
          model's normalization or timestamps. Default-tier selection uses the first matching
          cached row; members' name lookup takes the last. Repository units only assert add/edit
          call counts, a truthy read and no findOne; they do not establish clone isolation,
          saved values, reload or concurrent behavior.
        sources:
          - core/server/services/tiers/service.js
          - core/server/services/tiers/tier-repository.js
          - core/server/services/tiers/tier.js
          - core/server/services/tiers/tiers-api.js
          - core/server/models/product.js
          - core/server/services/members/service.js
        tests:
          - test/unit/server/services/tiers/tier-repository.test.js
      configuration:
        summary: >-
          Tiers itself does not read operator config. Product fields become cached Tier values
          at load/save. No root hot-reload/reset is provided. Source also establishes
          Mongo-object filtering, ignored pagination/order options, paid/active default
          selection and falsy price handling: new paid zero prices become 500/5000, while an API
          edit's zero prices retain existing values. Units assert the new-tier zero defaults;
          Admin HTTP asserts invalid-price rejection and null trial becoming zero. These tests
          do not cover zero-price edits.
        sources:
          - core/server/services/tiers/service.js
          - core/server/services/tiers/tier-repository.js
          - core/server/services/tiers/tiers-api.js
          - core/server/services/tiers/tier.js
        tests:
          - test/unit/server/services/tiers/tier.test.js
          - test/e2e-api/admin/tiers.test.js
      resources:
        summary: >-
          Source establishes retained cache/model references and borrowed model/database
          resources, with no timers, clients, subscriptions or cleanup registered by this root.
          Tier save awaits Product persistence, updates its cache and dispatches every queued
          event without clearing the queue or awaiting handlers. Members PaymentsService owns
          subscribers that create/update Stripe products/prices and their database mappings; it
          retains tier event payload references and has no subscription disposal here.
          DomainEvents catches/logs subscribed handler errors; its allSettled tracking is
          enabled by test environment at import, not a production drain. These nested completion
          and cleanup facts come from source, not the repository stub or HTTP response
          assertions.
        sources:
          - core/server/services/tiers/service.js
          - core/server/services/tiers/tier-repository.js
          - core/server/services/tiers/tier.js
          - core/server/services/tiers/tier-created-event.js
          - core/server/services/tiers/tier-price-change-event.js
          - core/server/services/tiers/tier-name-change-event.js
          - core/server/services/tiers/tier-activated-event.js
          - core/server/services/tiers/tier-archived-event.js
          - core/server/services/members/members-api/services/payments-service.js
          - package.json
        tests: []
      failures:
        summary: >-
          Source establishes propagated repository-load/slug/validation/database failures. A
          load failure before publication leaves the wrapper retryable. Failed row conversion
          during repository reload can retain the old store with a cleared/part-filled ID set. A
          rejected Product write prevents normal cache replacement and event dispatch, but no
          transaction joins cached tier state, tier persistence, async Stripe work and its
          mapping writes. Re-saving the same event-bearing Tier dispatches its old events again.
          Direct API edit of a missing valid ID dereferences null; malformed IDs and string
          filters reject. Admin HTTP asserts 422 responses/error snapshots for fractional,
          negative and excessive prices; API units only assert some error for free creation. The
          remaining failure/recovery paths are source-only, not demonstrated fault-injection or
          provider-completion contracts.
        sources:
          - core/server/services/tiers/service.js
          - core/server/services/tiers/tier-repository.js
          - core/server/services/tiers/tiers-api.js
          - core/server/services/tiers/tier.js
          - core/server/services/members/members-api/services/payments-service.js
        tests:
          - test/unit/server/services/tiers/tiers-api.test.js
          - test/e2e-api/admin/tiers.test.js
    unverified: []
    blockers:
      - >-
        Pin real root identity, pre-init access, boot prerequisites, concurrent initialization,
        sequential no-op behavior and partial-publication recovery. Include retained members/
        gifts consumers; a late-bound fake wrapper does not prove real boot wiring.
      - >-
        Characterize production repository clone boundaries, external-write/reload behavior,
        failed reload ID/store consistency, write races, database normalization/timestamps and
        default-tier ordering. The repository test changes the fetched object but saves the
        original; its call-count assertions do not prove edited data or cache isolation.
      - >-
        Pin missing/invalid ID results, filter/pagination behavior, zero-price edits and exact
        validation failures at the intended boundary. In-memory API tests keep original Tier
        objects and omit database/event behavior; several Tier setter rejection helpers are
        async calls that the tests neither await nor return.
      - >-
        Cover tier-event payload identity, duplicate dispatch on repeated saves and actual
        member payment subscription effects, including provider/mapping failures and shutdown.
        Existing event-presence units and HTTP tier responses do not establish Stripe
        completion, atomicity, retry safety, listener disposal or a production drain.
  tinybird:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: c2999f4e13da6360bceced808bb52c4a04b5ad03
    entryPoints:
      - tinybird/index.js
    notes: >-
      An optional token service is published through static methods. Preserve the different
      lifetimes of request-time initialization, retained stats clients and automation lookups.
    contracts:
      exports:
        summary: >-
          CommonJS index re-exports the wrapper class, with static synchronous init/reset and
          mutable instance; instance starts undefined, and disabled init/reset assigns null.
          Static methods reference the wrapper class directly rather than their receiver;
          both return undefined. The deep implementation is a constructible class exposing
          synchronous getToken, _generateToken and _isJWTExpired, with mutable configuration,
          capability flags and token-cache fields. getToken returns token/optional numeric exp
          or null. Units assert selected token shapes and static-token values; HTTP asserts
          the serialized token/null shapes and ISO expiration. Exact root exports, unbound
          static methods and reset behavior are source-only.
        sources:
          - core/server/services/tinybird/index.js
          - core/server/services/tinybird/tinybird-service-wrapper.js
          - core/server/services/tinybird/tinybird-service.js
          - core/server/api/endpoints/tinybird.js
          - core/server/api/endpoints/utils/serializers/output/tinybird.js
        tests:
          - test/unit/server/services/tinybird/tinybird-service.test.js
          - test/e2e-api/admin/tinybird.test.js
      construction:
        summary: >-
          Every configured init constructs a new TinybirdService from current tinybird config
          and settings site_uuid; no guard or shared instance reuse exists. Only the wrapper
          constructs it in production; units construct it directly. Construction captures
          flags and site ID, retains the config subtree and starts empty token-cache fields,
          without signing or contacting Tinybird. StatsService.create conditionally initializes
          the root, then creates a separate query client for web analytics using the published
          instance. Factory units stub init and assert its gate plus client presence; the
          retained-consumer test uses the real root and asserts replacement identity. Nested
          construction and absence of provider I/O at init are otherwise source-established.
        sources:
          - core/server/services/tinybird/tinybird-service-wrapper.js
          - core/server/services/tinybird/tinybird-service.js
          - core/server/services/stats/stats-service.js
          - core/server/services/stats/utils/tinybird.js
        tests:
          - test/unit/server/services/stats/stats.test.ts
          - test/unit/server/services/tinybird/consumer-configuration.test.ts
      consumers:
        summary: >-
          Three production root consumers were found: the Admin token endpoint initializes
          on each request, StatsService.create initializes and captures instance, and the
          automations API reads the current instance without initializing it. Stats passes
          its query client to posts/content statistics; automations builds clients for browse,
          performance, runs and member search. No production deep implementation constructor
          or wrapper-module import was found beyond the barrel. Token HTTP tests assert owner/
          admin success and unauthenticated/editor denial. Automation HTTP tests exercise
          real token composition and intercepted query responses for browse/performance/member
          search; run tests replace the token service. These establish selected HTTP results, not
          provider acceptance, every consumer or frontend token-refresh behavior.
        sources:
          - core/server/api/endpoints/tinybird.js
          - core/server/web/api/endpoints/admin/routes.js
          - core/server/api/endpoints/utils/serializers/output/tinybird.js
          - core/server/services/stats/stats-service.js
          - core/server/services/stats/utils/tinybird.js
          - core/server/services/stats/posts-stats-service.js
          - core/server/services/stats/content-stats-service.js
          - core/server/services/automations/automations-api.ts
          - core/server/services/automations/tinybird-automation-stats.ts
          - core/server/services/automations/automation-member-search.ts
        tests:
          - test/e2e-api/admin/tinybird.test.js
          - test/e2e-api/admin/automations.test.js
          - test/e2e-api/admin/automation-performance-stats.test.ts
          - test/e2e-api/admin/automation-runs.test.ts
          - test/e2e-api/admin/automation-member-search.test.ts
      startup:
        summary: >-
          Boot has no direct Tinybird init; its awaited stats.init calls StatsService.create.
          That initializes Tinybird when web_analytics_enabled or tinybird:stats config is
          truthy. The query client itself is created only for web analytics. The wrapper
          requires settings site_uuid even
          when a stats.id override exists, and requires only truthy root config, not a usable
          token/endpoint. Automations checks stats config and needs an already-published
          token service; it does not initialize the root when configuration becomes available.
          Factory units cover three gate combinations with stubbed init. An HTTP case resets
          Tinybird and calls the real stats factory with web
          analytics disabled, then asserts remote browse stats and no SQL run-stat query;
          it does not prove complete boot ordering or later gate transitions.
        sources:
          - core/boot.js
          - core/server/services/stats/service.js
          - core/server/services/stats/stats-service.js
          - core/server/services/tinybird/tinybird-service-wrapper.js
          - core/server/services/automations/automations-api.ts
        tests:
          - test/unit/server/services/stats/stats.test.ts
          - test/e2e-api/admin/automations.test.js
      lifetime:
        summary: >-
          Source establishes that root re-init/reset changes only the published reference,
          without disposing or revoking retained instances/tokens. Each implementation caches
          one JWT and expiration, refreshing on use when verification fails or less than five
          minutes remain. Later name/lifetime options are ignored while that cached token is
          usable; endpoint re-init discards the cache each request. Stats retains its original
          token service while rereading endpoint/site configuration, whereas a new stats client
          captures the new instance. The consumer test asserts that mixed lifetime with fake
          HTTP. Clock-controlled units assert repeated token equality and different tokens
          after 176/180 minutes; equality alone does not prove signing was skipped. Automation
          lookup after replacement and outstanding-query/reset behavior remain source-only.
        sources:
          - core/server/services/tinybird/tinybird-service-wrapper.js
          - core/server/services/tinybird/tinybird-service.js
          - core/server/services/stats/stats-service.js
          - core/server/services/stats/utils/tinybird.js
          - core/server/api/endpoints/tinybird.js
          - core/server/services/automations/automations-api.ts
        tests:
          - test/unit/server/services/tinybird/tinybird-service.test.js
          - test/unit/server/services/tinybird/consumer-configuration.test.ts
      configuration:
        summary: >-
          Site ID (stats.id or settings site_uuid) and JWT/local/static capability flags are
          captured at construction; token reads/signing use the retained config subtree.
          JWT takes precedence over local, then legacy stats token; local-enabled can return
          an undefined token without falling back. getToken defaults to 180 minutes, direct
          _generateToken to 60; signing includes a fixed pipe allowlist scoped to captured site
          ID. Request clients reread config/settings facades, including local endpoint/version.
          Immutable config replacement does not update an existing service's captured subtree.
          HTTP tests replace test config through disabled/key-A/key-B/disabled transitions and
          verify signatures/workspaces/ISO expiry; consumer units cover missing-site recovery.
          Scope units check each returned scope's type/site and three required resources, not
          the exact allowlist. Test setters and mutable unit config do not prove hot reload.
        sources:
          - core/server/services/tinybird/tinybird-service-wrapper.js
          - core/server/services/tinybird/tinybird-service.js
          - core/server/services/stats/utils/tinybird.js
          - core/server/api/endpoints/tinybird.js
          - core/shared/config/loader.ts
        tests:
          - test/unit/server/services/tinybird/tinybird-service.test.js
          - test/unit/server/services/tinybird/consumer-configuration.test.ts
          - test/e2e-api/admin/tinybird.test.js
      resources:
        summary: >-
          The token root owns configuration references and an in-memory JWT cache only: it
          has no database, provider client, event subscription, timer, refresh job or shutdown.
          Its stats/automation consumers borrow request-external, whose shared HTTP/HTTPS
          keep-alive agents outlive a query client. Query construction asks for a 35-second
          request timeout and zero retries; POST search additionally creates a timeout AbortSignal.
          No root reset drains/cancels those requests or closes shared agents. Client units
          assert request options and signal presence with fake HTTP, not elapsed timeout or
          socket release. A member-search HTTP case asserts a delayed ten-second intercepted
          response fails in less than five seconds, not an exact three-second deadline or
          socket cleanup. A browse case substitutes plain Got to bypass request-external's
          test retry hook and asserts the first failure falls back without consuming a second
          interceptor. The shared transport is replaced in that retry case; request-external's
          normal test hook changes request timeout to five seconds. These tests do not
          establish production timing/cleanup behavior.
        sources:
          - core/server/services/tinybird/tinybird-service-wrapper.js
          - core/server/services/tinybird/tinybird-service.js
          - core/server/services/stats/utils/tinybird.js
          - core/server/services/automations/automations-api.ts
          - core/server/services/automations/automation-member-search.ts
          - core/server/lib/request-external.js
        tests:
