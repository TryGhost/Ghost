          synchronous init returning undefined and public repositories, services and controllers.
          Fields are undefined before construction or when disabled on first init. The service
          barrel exports constructors and entities, not another application instance. Inner
          methods return promises; controllers serialize plain recommendation values into
          data/meta responses. Controller units with fake services assert selected serialized
          fields, pagination and validation; they do not assert root identity or initialization.
        sources:
          - core/server/services/recommendations/index.js
          - core/server/services/recommendations/recommendation-service-wrapper.js
          - core/server/services/recommendations/service/index.ts
          - core/server/services/recommendations/service/recommendation-controller.ts
          - core/server/services/recommendations/service/incoming-recommendation-controller.ts
        tests:
