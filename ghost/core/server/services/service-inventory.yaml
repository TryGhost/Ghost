        that guard. These source risks have not been reproduced by this audit.
  signing-keys:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: 82ba3d5b1133db2a042774e8bbc6f64fc540ac47
    entryPoints:
      - signing-keys/index.ts
    notes: >-
      Publish only after the initial key check; preserve live key reads and purpose separation.
      Recurrence ownership and restart remain migration blockers despite class-level rotation tests.
    contracts:
      exports:
        summary: >-
          Named runtime exports are async init, getInstance and scheduleCheckJob; the provider
          and purpose exports are types only. getInstance throws IncorrectUsageError before
          publication. The implementation exports SigningKeyService and rotation constants;
          CheckSigningKeysJob is a separate class consumed by handler registration. Root tests
          assert pre-init access fails; the full export list is source evidence.
        sources:
          - core/server/services/signing-keys/index.ts
          - core/server/services/signing-keys/signing-key-service.ts
          - core/server/services/signing-keys/check-signing-keys-job.ts
          - core/server/services/jobs-service/register-job-handlers.ts
        tests:
          - test/unit/server/services/signing-keys/index.test.ts
      construction:
        summary: >-
          The root is the only production construction site found. init creates a service
          using the shared settings cache, Settings model, model transaction function,
          logging and a scheduling callback. It awaits check before publishing the service;
          concurrent calls before publication have no shared promise guard. Importing the
          module alone creates neither the service nor a recurring job. Root tests verify no
          key check or published instance on import, publication after a held check completes,
          and retry after rejection. Dependency assembly and concurrent construction remain
          source evidence; the real rotation callback is exercised with storage doubles.
        sources:
          - core/server/services/signing-keys/index.ts
          - core/server/services/signing-keys/signing-key-service.ts
        tests:
          - test/unit/server/services/signing-keys/index.test.ts
      consumers:
        summary: >-
          Boot initializes the root and later supplies the jobs instance. Identity tokens and
          the staff JWKS app retain staff providers; members API construction retains a
          members provider for signing, verification and public keys. The check-signing-keys
          job handler instead resolves getInstance for each run. Handler tests register before
          root initialization, then verify deferred access, awaiting the check and propagation
          of its original rejection. Existing HTTP tests cover
          both JWKS responses and staff-token verification, not live rotation through those
          retained HTTP consumers.
        sources:
          - core/boot.js
          - core/server/services/identity-tokens/identity-token-service-wrapper.js
          - core/server/web/well-known.js
          - core/server/services/members/api.js
          - core/server/services/members/members-api/services/token-service.js
          - core/server/services/jobs-service/register-job-handlers.ts
        tests:
          - test/e2e-server/well-known.test.js
          - test/e2e-api/members/well-known.test.js
          - test/legacy/api/admin/identities.test.js
          - test/unit/server/services/jobs-service/register-job-handlers.test.ts
      startup:
        summary: >-
          initCore awaits init after settings and before token/JWKS consumers. check advances
          due rotation and initiates replacement of weak keys. After jobs startup,
          background boot calls scheduleCheckJob, which stores the jobs reference and checks
          rotation state. Registration is skipped in test environments, without jobs, or after
          a prior successful schedule; the guard is set only after registration resolves. Root
          tests cover idle/rotating state, test-environment suppression, registration awaiting,
          sequential deduplication and retry, plus rotation before and after jobs are supplied.
          Boot units hold settings initialization, settings synchronization and signing-key
          initialization pending; they also hold background registration and verify continuation
          after its rejection. Ordering before token/JWKS consumers and after jobs startup
          remains source evidence.
        sources:
          - core/boot.js
          - core/server/services/signing-keys/index.ts
          - core/server/services/signing-keys/signing-key-service.ts
        tests:
          - test/unit/server/services/signing-keys/index.test.ts
          - test/unit/boot-signing-keys.test.ts
          - test/unit/boot-email-analytics.test.ts
      lifetime:
        summary: >-
          service, jobs and scheduled survive repeated init with no reset/disposal hook.
          forPurpose creates new provider objects whose closures retain the same service and
          read its current settings on each call. Integration tests retain a provider while
          promoting and retiring keys, and race separate class instances; they do not exercise
          concurrent root init or jobs restart. Root tests additionally assert that sequential
          successful init calls retain the checked instance without checking again.
        sources:
          - core/server/services/signing-keys/index.ts
          - core/server/services/signing-keys/signing-key-service.ts
        tests:
          - test/integration/services/signing-keys.test.ts
          - test/unit/server/services/signing-keys/index.test.ts
      configuration:
        summary: >-
          Members and staff use distinct settings keys. Reads use unresolved settings rows
          and their timestamps; promotion/retirement recheck values and age under row locks.
          Keys below 2048 bits trigger rotation; generated replacements use 2048 bits,
          with 48 hours of advance publication and a two-hour old key grace period. JWKS orders active, next, previous; an unknown or missing kid
          falls back to the first published verification key. Recurrence uses randomly chosen
          seconds/minute in a six-field hourly cron, without a caller-supplied timezone. The
          root test pins the cron for controlled random values. Integration tests assert
          rotation transitions using the exported duration constants; they do not independently
          pin the literal delays or default RSA generation. Those details and the absence of
          a timezone option, along with unknown/missing-kid fallback, remain source evidence.
        sources:
          - core/server/services/signing-keys/signing-key-service.ts
          - core/server/services/signing-keys/index.ts
        tests:
          - test/integration/services/signing-keys.test.ts
          - test/unit/server/services/signing-keys/signing-key-service.test.ts
          - test/unit/server/services/signing-keys/index.test.ts
      resources:
        summary: >-
          The service borrows settings/models and opens transactions through the model owner;
          RSA generation is per rotation. The shared public-jwk helper caches public metadata
          promises by PEM digest, evicts failures and exposes no reset/size limit. Recurring
          checks are owned by the supplied jobs backend, not a timer in this root. The root
          has no stop, drain or cancellation hook for checks, rotation or its retained schedule.
          These ownership facts are source evidence. The cited public-key helper tests cover
          derived key data and cache identity, not failed-entry eviction or lifecycle cleanup.
        sources:
          - core/server/services/signing-keys/index.ts
          - core/server/services/signing-keys/signing-key-service.ts
          - core/server/lib/public-jwk.ts
          - core/server/services/jobs-service/jobs-service.ts
        tests:
          - test/unit/server/lib/public-jwk.test.ts
      failures:
        summary: >-
          Initial check failures reject init before publication and abort required boot.
          Signing without an active key throws IncorrectUsageError; malformed settings raise
          InternalServerError and crypto/database errors propagate. Each rotation step has its
          own transaction: no rollback spans the whole check. Background registration errors
          are logged by boot; a rotation callback error rejects after the new key is committed.
          Job check failures are passed to JobsService error handling. Root tests assert
          initial-check rejection without publication and successful retry, plus registration
          rejection and retry. Boot units assert initCore propagates the initial error and
          background boot logs registration failure and continues; handler tests assert the
          original check rejection escapes the registered handler. The class unit tests cover
          malformed settings. Other error paths, including a callback failure after commit,
          remain source evidence.
        sources:
          - core/boot.js
          - core/server/services/signing-keys/index.ts
          - core/server/services/signing-keys/signing-key-service.ts
          - core/server/services/jobs-service/register-job-handlers.ts
          - core/server/services/jobs-service/jobs-service.ts
        tests:
          - test/unit/server/services/signing-keys/signing-key-service.test.ts
          - test/unit/server/services/signing-keys/index.test.ts
          - test/unit/boot-signing-keys.test.ts
          - test/unit/boot-email-analytics.test.ts
          - test/unit/server/services/jobs-service/register-job-handlers.test.ts
    unverified: []
    blockers:
      - >-
        Concurrent root init has no in-flight guard. Add overlapping-call coverage before
        changing this behavior; sequential init tests and class transaction-race tests do not
        prove single root publication or partial-check cleanup. Sharing an in-flight init
        would be a new guarantee, not established baseline behavior.
      - >-
        Characterize scheduling failure after a rotation commits, concurrent registration and
        recurrence restoration across jobs restart. The module keeps scheduled after shutdown
        and has no wrapper reset; do not infer custom backend behavior from the default backend.
      - >-
        Verify staff/member token and HTTP JWKS consumers across live rotation, plus missing
        keys, unknown kid fallback and request errors. Empty verification-key lists currently
        cause a native dereference error; no focused assertion covers that case.
      - >-
        Decide ownership/drain of rotations and shared public-key cache lifetime during an
        in-process restart. Existing integration tests use injected keys and class instances,
        not root scheduling, shutdown or crypto-generation failure paths. The public-jwk
        failure test only checks repeated rejection, so it does not prove failed entries
        are evicted rather than returning the same rejected promise.
  slack-notifications:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - slack-notifications/index.js
    notes: >-
      Preserve captured milestone notification settings and event delivery. Listener disposal,
      shared HTTP resources and partial initialization remain migration blockers.
    contracts:
      exports:
        summary: >-
          The CommonJS root forwards one eagerly constructed wrapper exposing synchronous
          init. Its api is a private field; neither api nor service is public, and init
          returns no instance. The wrapper constructor has a static create factory; separate
          implementation files export subscriber and sender classes used directly by tests.
        sources:
          - core/server/services/slack-notifications/index.js
          - core/server/services/slack-notifications/service.js
          - core/server/services/slack-notifications/slack-notifications-service.js
          - core/server/services/slack-notifications/slack-notifications.js
        tests: []
      construction:
        summary: >-
          First init builds SlackNotifications and SlackNotificationsService, assigns the
          private api, then subscribes it to the shared DomainEvents bus. Both objects and
          the subscription are created even when notifications are disabled. The wrapper is
          the only runtime composition path found; later init calls return if api exists.
          Loading the sender also loads the shared external-request client.
        sources:
          - core/server/services/slack-notifications/service.js
          - core/server/services/slack-notifications/slack-notifications-service.js
          - core/server/services/slack-notifications/slack-notifications.js
          - core/server/lib/request-external.js
        tests:
          - test/unit/server/services/slack-notifications/index.test.js
      consumers:
        summary: >-
          Boot is the only runtime wrapper caller. Milestone repository saves dispatch
          MilestoneCreatedEvent after persistence without awaiting notification delivery.
          The subscriber accepts enabled notifications with a webhook URL and a value
          strictly greater than minThreshold. The sender skips initial and skipped reasons,
          formats eligible milestone data and posts it to the captured webhook. There is no
          direct HTTP, CLI or job caller of this root.
        sources:
          - core/boot.js
          - core/server/services/milestones/milestone.js
          - core/server/services/milestones/bookshelf-milestone-repository.js
          - core/server/services/slack-notifications/slack-notifications-service.js
          - core/server/services/slack-notifications/slack-notifications.js
        tests:
          - test/unit/server/services/slack-notifications/index.test.js
          - test/unit/server/services/slack-notifications/slack-notifications-service.test.js
          - test/unit/server/services/slack-notifications/slack-notifications.test.js
      startup:
        summary: >-
          Required-service boot invokes init while building its Promise.all prerequisites,
          before readiness and the later background milestone run. Subscription completes
          synchronously and does not check webhook reachability or send a notification.
          Importing the wrapper alone installs no listener. Synchronous init failures abort
          dependent startup; disabled configuration still installs the subscriber.
        sources:
          - core/boot.js
          - core/server/services/slack-notifications/service.js
          - core/server/services/slack-notifications/slack-notifications-service.js
        tests: []
      lifetime:
        summary: >-
          Repeated wrapper init retains its private api, sender and captured configuration,
          preventing another subscription on that wrapper. Neither wrapper nor subscriber
          exposes reset or shutdown. Direct subscriber subscribeEvents calls add another
          callback each time, and the shared bus retains those callbacks across server stop.
          There is no queue, deduplication or serialization of concurrent event deliveries.
        sources:
          - core/server/services/slack-notifications/service.js
          - core/server/services/slack-notifications/slack-notifications-service.js
          - core/server/ghost-server.ts
          - core/boot.js
        tests: []
      configuration:
        summary: >-
          First init captures site URL, enabled-and-URL truthiness, webhook URL and a parsed
          threshold, defaulting falsy threshold values to zero. A truthy nonnumeric string
          parses to NaN and suppresses delivery; the directly constructed subscriber applies
          no such fallback. The sender reads NODE_ENV and version when sending. Its shared
          request helper captures agent options and test hooks at import but reads config
          environment and site URL during request checks. Its request timeout is 10 seconds,
          overridden to 5 seconds by the import-time test hook.
        sources:
          - core/server/services/slack-notifications/service.js
          - core/server/services/slack-notifications/slack-notifications-service.js
          - core/server/services/slack-notifications/slack-notifications.js
          - core/server/lib/request-external.js
        tests:
          - test/unit/server/services/slack-notifications/slack-notifications.test.js
          - test/unit/server/lib/request-external.test.js
      resources:
        summary: >-
          The subscriber owns a milestone callback but retains no unsubscribe handle, and
          boot registers no cleanup for it. Delivery uses shared configurable HTTP/HTTPS agents, with keep-alive enabled by default,
          owned by request-external, with DNS checks, pooled sockets and per-request timeout
          work. Neither this wrapper nor the helper exposes a disposal hook. The root owns
          no database connection or timer and does not track, cancel or drain pending sends.
          DomainEvents.allSettled tracks test deliveries only; it supplies no production drain.
        sources:
          - core/server/services/slack-notifications/slack-notifications-service.js
          - core/server/services/slack-notifications/slack-notifications.js
          - core/server/lib/request-external.js
          - core/boot.js
          - core/server/ghost-server.ts
        tests:
          - test/unit/server/services/slack-notifications/slack-notifications-service.test.js
      failures:
        summary: >-
          Construction failures before api assignment permit another init attempt, but a
          subscription failure leaves api assigned and later init skips retry. Sender send
          logs URL_MISSING_INVALID and resolves for absent, non-string or invalid URLs;
          request failures reject direct sender calls. The subscriber catches and logs
          formatting or send rejection without propagating it to milestone persistence.
          Malformed event data can reject before its local catch; the shared DomainEvents
          subscriber wrapper catches and logs that rejection. There is no service-level
          retry or replay; transport failures use the shared request helper's policies.
        sources:
          - core/server/services/slack-notifications/service.js
          - core/server/services/slack-notifications/slack-notifications-service.js
          - core/server/services/slack-notifications/slack-notifications.js
          - core/server/lib/request-external.js
          - core/server/services/milestones/bookshelf-milestone-repository.js
        tests:
          - test/unit/server/services/slack-notifications/slack-notifications-service.test.js
          - test/unit/server/services/slack-notifications/slack-notifications.test.js
    unverified: []
    blockers:
      - >-
        Add wrapper contracts for exact exports, repeated init, changed configuration, disabled
        first init, partial subscription failure/retry and retained callbacks across restart.
        The existing root test proves one successful event reaches a webhook, not listener
        count, configuration lifetime or boot readiness.
      - >-
        Correct the threshold test: it sets isEnabled false and omits minThreshold, so its
        no-send assertion does not establish threshold behavior. Cover equality, values either
        side of the threshold, wrapper fallback and invalid parsing through real composition.
      - >-
        Characterize sender/request failures through the real subscriber, including malformed
        events, timeouts and pending sends during stop. Tests named Throws for invalid or
        absent URLs only assert logging after a resolved call; preserve that behavior unless
        changing it separately. Test-mode request overrides do not prove production transport
        behavior.
      - >-
        Decide listener removal, pending-send drain and shared HTTP-agent ownership. Current
        class tests create subscribers directly; successful callbacks and fake requests do
        not establish disposal, duplicate delivery prevention or restart behavior.
  slack-ping:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: c2999f4e13da6360bceced808bb52c4a04b5ad03
    entryPoints:
      - slack-ping/index.ts
    notes: >-
      Preserve live Slack settings, publish/test event behavior and request failure handling.
      Retained listeners, shared HTTP resources and partial initialization need contracts before
      changing ownership.
    contracts:
      exports:
        summary: >-
          TypeScript default-exports one eager wrapper with synchronous init and a public
          optional service property; CommonJS boot reads .default. init returns no instance.
          The named SlackPingService class exposes ping, settings/event methods and stable
          listener references. Neither class supplies reset or shutdown.
        sources:
