    unverified: []
    blockers:
      - >-
        Characterize partial root initialization and retry, including metric registration
        before publication and a later wrapper constructor failing after newsletters is set.
        Current identity tests replace all wrapper constructors with successful fakes.
      - >-
        Define shutdown/restart for retained wrappers and the separately composed scheduler.
        Successful schedule flags outlive backend timer clearing; registration after backend
        stop may resolve without a timer. Guards do not re-read config for existing schedules.
      - >-
        Test overlapping first startFetch calls while restoration is pending and failure on
        that first restore. Restoration is marked attempted before the await and is not retried;
        ordinary direct fetch methods bypass the wrapper guard and share newsletter buffers.
      - >-
        Cover HTTP backfill/cancel completion, detached metadata writes and DB failure status.
        Timestamp/metadata persistence can fail while calls resolve; status-write or processor
        construction failure can leave a fetch status running. Existing cancel assertions check
        calls/state, not durable cancellation before return or shutdown.
      - >-
        Verify actual analytics continuation and provider/DB work across job shutdown deadlines,
        plus downstream DomainEvents and pending newsletter updates. Injected waiting tests and
        successful booted job persistence do not prove a full drain or atomic replay behavior.
      - >-
        Preserve provider paging/cursor behavior and captured-versus-current configuration
        boundaries. Changing credentials/domain while retaining cursors or site tags has no
        migration coverage; batch failures can retain pending writes and emit events before
        final storage/aggregation without rollback of earlier effects.
  email-service:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - email-service/index.js
      - email-service/newsletter-email-event-storage.js
      - email-service/email-event-processor.js
    notes: >-
      Preserve the application-owned delivery wrapper, retained collaborators, newsletter
      queue and separate pre-stop/drain phases. Analytics separately constructs the two
      deep event-processing exports. Recorded facets include source-only lifecycle risks;
      the existing business tests do not establish migration readiness.
    contracts:
      exports:
        summary: >-
          CommonJS exports one EmailServiceWrapper instance. init is synchronous and publishes
          mutable renderer, service, controller and batchSendingService fields;
          registerShutdownTasks registers callbacks that resolve the retained batch sender when
          invoked. getPostUrl maps a post/page through the API URL helper. Implementation methods
          use their receiver. Analytics imports
          NewsletterEmailEventStorage and EmailEventProcessor constructors directly; other
          runtime support imports include SendEmailJob, event classes, sending-status serializers
          and welcome-email template helpers/styles. PostEmailHandler imports the implementation's
          two retry error-code constants. Wrapper units assert only the pages/posts
          argument passed to the URL helper, not root identity, initialized shape or URL output.
        sources:
          - core/server/services/posts/post-email-handler.js
          - core/server/services/email-service/index.js
          - core/server/services/email-service/email-service-wrapper.js
          - core/server/services/email-analytics/index.ts
          - core/server/services/jobs-service/register-job-handlers.ts
          - core/server/services/member-welcome-emails/member-welcome-email-renderer.js
          - core/server/api/endpoints/utils/serializers/output/emails.js
        tests:
          - test/unit/server/services/email-service/email-service-wrapper.test.js
      construction:
        summary: >-
          Root evaluation creates the wrapper; first init requires jobsService and builds
          Mailgun client/provider, translation, renderer, sender, segmenter, warming, batch
          sender, status service, EmailService and controller; EmailService retains that status
          service for retry eligibility reads. It captures members.api.members,
          members.verificationTrigger, email-address.service, attribution and feedback instances;
          link tracking is retained as a wrapper and resolved through its service field later.
          It subscribes to locale edits, retains batchSendingService, optionally registers
          GhostServer pre-stop/cleanup callbacks, then publishes renderer, service and controller
          in that order. A truthy service keeps the original graph, re-arms the retained batch
          sender and registers callbacks with the supplied GhostServer; it does not replace jobs.
          These exact construction/guard/publication
          contracts have no dedicated wrapper assertions. Analytics separately constructs its
          storage/processor with borrowed DB, members, suppression and metrics dependencies.
        sources:
          - core/server/services/email-service/email-service-wrapper.js
          - core/server/services/email-service/email-renderer.js
          - core/server/services/email-service/email-service.js
          - core/server/services/email-service/batch-sending-service.js
          - core/server/services/email-analytics/index.ts
        tests: []
      consumers:
        summary: >-
          Boot initializes the root, retains service in the send-email handler, and later calls
          recovery through the wrapper. PostsService and PostEmailHandler retain service for
          preflight/create/schedule/retry; email-preview and email endpoints resolve controller on each
          call. Output mapping resolves renderer/service and skips replacement when absent;
          comment email rendering resolves renderer for unsubscribe links. Analytics owns the
          deep processors; suppression and members last-seen consume their domain events;
          welcome rendering reuses helpers/styles. Real HTTP tests assert preview snapshots,
          two test-mail provider payloads with distinct message IDs, old-email placeholder
          removal, status responses and republish/retry results. Batch integration exercises
          HTTP publication through real composition/DB to a mocked provider. Atomic-publication
          integration holds an outer transaction and asserts no send dispatch before commit;
          insert/outer-transaction failures leave no email or published post. Its dispatch is
          stubbed, so these are persistence/scheduling assertions, not provider-delivery evidence.
          Handler units
          assert the injected job, two-slot email queue and rejection propagation. These do not
          prove every consumer survives root replacement or sibling reinitialization.
        sources:
          - core/boot.js
          - core/server/services/posts/posts-service-instance.js
          - core/server/services/posts/post-email-handler.js
          - core/server/api/endpoints/email-previews.js
          - core/server/api/endpoints/emails.js
          - core/server/api/endpoints/utils/serializers/output/mappers/emails.js
          - core/server/services/comments/comments-service-emails.js
          - core/server/services/jobs-service/register-job-handlers.ts
          - core/server/services/email-analytics/index.ts
          - core/server/services/email-suppression-list/mailgun-email-suppression-list.js
          - core/server/services/members-events/last-seen-at-updater.js
          - core/server/services/member-welcome-emails/member-welcome-email-renderer.js
        tests:
