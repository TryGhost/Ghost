          - core/server/api/endpoints/posts.js
          - core/server/web/api/endpoints/admin/routes.js
          - core/server/services/jobs-service/register-job-handlers.ts
          - core/server/services/content-import/index.ts
        tests:
          - test/e2e-api/admin/posts-importer.test.js
          - test/e2e-webhooks/posts-importer.test.ts
          - test/unit/server/services/jobs-service/register-job-handlers.test.ts
      startup:
        summary: >-
          Boot invokes synchronous init in required services after DB setup and the call to
          media-inliner.init, before handler registration, jobs start and HTTP readiness.
          Construction alone does not resolve the jobs instance or media implementation;
          dispatch and processing require them later. The request needs owner lookup when
          no caller email exists, readable local staging and settings for batch tags; jobs
          additionally need converters, models/storage and optional URL lookup. Real HTTP
          tests establish selected normal boot-to-job outcomes, while root/handler units
          establish early errors. Explicit construction-order, held readiness, failed-init
          retry and same-process boot contracts have no focused tests.
        sources:
          - core/boot.js
          - core/server/services/content-import/index.ts
          - core/server/services/content-import/import/importer.ts
          - core/server/services/jobs-service/register-job-handlers.ts
        tests:
          - test/unit/server/services/content-import/index.test.ts
          - test/unit/server/services/jobs-service/register-job-handlers.test.ts
          - test/e2e-api/admin/posts-importer.test.js
      lifetime:
        summary: >-
          There is no reset, stop, abort or public implementation accessor. The module retains
          its graph across init calls; run records are mutable, in memory and normally
          released after completion email. finish/fail alone do not settle waiters; release
          resolves them when the map becomes empty. Lazy age/count eviction excludes running
          runs. Media promises, including failed results, are cached by exact URL within one
          job, not across jobs. Store units assert retention/eviction and two-run release
          waiting; media units hold an import to prove sharing, and assert separate-instance
          isolation. Root retention, duplicate/concurrent job handling and late admissions
          during shutdown are source-only. The importer drain test awaits handle before
          checking settlement, so it cannot establish the final cleanup boundary.
        sources:
          - core/server/services/content-import/index.ts
          - core/server/services/content-import/import/store.ts
          - core/server/services/content-import/import/media.ts
          - core/server/services/content-import/import/importer.ts
        tests:
          - test/unit/server/services/content-import/import/store.test.ts
          - test/unit/server/services/content-import/import/media.test.ts
          - test/unit/server/services/content-import/import/importer.test.ts
      configuration:
        summary: >-
          Each request captures recipient, timezone-derived batch tags and mapping into its
          job; each execution reparses the staged source and rechecks the fixed 100-row cap.
          Timezone fallback validates nonempty string shape, not a valid timezone name.
          Local-media classification reads current config accessors for site/subdir/CDN URLs;
          this does not imply production hot reload of the immutable config tree. Admin URLs
          come through the shared frozen URL helper; published URLs query the retained URL
          service per result. Tests assert injected timezone tags, mapping forwarding, cap
          boundaries, local URL classification and real HTTP newer-timestamp/duplicate
          handling. They do not pin retained-root config capture/replacement. CSV defaults
          are published/public posts; explicit supported fields and supplied HTML/Markdown
          are validated/converted before writes, rather than inheriting site visibility.
        sources:
          - core/server/services/content-import/index.ts
          - core/server/services/content-import/import/importer.ts
          - core/server/services/content-import/import/post-data.ts
          - core/server/services/content-import/import/local-media-url.ts
          - core/server/services/content-import/import/post-link.ts
          - core/shared/url-utils.ts
          - core/shared/config/index.ts
        tests:
          - test/unit/server/services/content-import/import/importer.test.ts
          - test/unit/server/services/content-import/import/media.test.ts
          - test/e2e-api/admin/posts-importer.test.js
      resources:
        summary: >-
          The root retains a mailer and run store, borrows jobs/models/storage and owns staged
          uploads, extracted directories and per-job media caches. It registers no timer or
          event listener itself. Parsing buffers the complete CSV before applying the row
          cap; archive extraction uses the shared zip helper without explicit size limits.
          Asset groups store in parallel with rollback on storage failure; successfully
          stored assets/media are not compensated for later row or mail failures. Posts use
          individual DB transactions, not one import transaction. Handler finally awaits
          extracted-source cleanup and best-effort mail, releases the run, then awaits staged
          deletion: allSettled can finish before that last deletion. Units and filesystem
          integration assert selected cleanup, asset rollback and cache behavior; real HTTP
          tests assert file removal under injected storage failures and contributor/tag DB
          rollback under a rejected post write. They do not prove root/job shutdown drains
          mail, staged cleanup, providers or outstanding DB work.
        sources:
          - core/server/services/content-import/index.ts
          - core/server/services/content-import/import/importer.ts
          - core/server/services/content-import/import/assets.ts
          - core/server/services/content-import/import/source.ts
          - core/server/services/content-import/import/post-repository.ts
          - core/server/services/content-import/csv/parse.ts
          - core/server/data/importer/import-archive.ts
          - core/server/data/importer/content-files.ts
          - core/server/lib/mail/ghost-mailer.js
          - package.json
        tests:
          - test/unit/server/services/content-import/import/staged-file.test.ts
          - test/unit/server/services/content-import/import/assets.test.ts
          - test/integration/importer/content-import-source.test.ts
          - test/e2e-api/admin/posts-importer.test.js
      failures:
        summary: >-
          Owner lookup fails before staging; invalid/staging/parser/cap failures reject before
          dispatch, and dispatch failure releases the run with best-effort staged cleanup.
          Expected row validation, media and DB write failures are recorded and later rows
          continue. All attempted writes failing reports an aggregate but still marks the
          run complete; unexpected preparation/converter/media failures reject the handler.
          URL failures retain successful writes without links. Completion mail and returned
          source/staged cleanup errors are reported without rejecting successful work; the
          root reporter catches logging/reporting failures. Source preparation's own cleanup
          failure can mask its initial error. Injected importer tests assert these selected
          channels; fake repository transaction tests prove options/rejection, not rollback.
          Real HTTP proves narrow relation rollback and partial-asset failure outcomes, not
          concurrent deduplication or rollback of an already-written update's later timestamp.
        sources:
          - core/server/services/content-import/index.ts
          - core/server/services/content-import/import/importer.ts
          - core/server/services/content-import/import/source.ts
          - core/server/services/content-import/import/assets.ts
          - core/server/services/content-import/import/post-repository.ts
          - core/server/services/content-import/import/completion-email.ts
        tests:
          - test/unit/server/services/content-import/import/importer.test.ts
          - test/unit/server/services/content-import/import/post-repository.test.ts
          - test/e2e-api/admin/posts-importer.test.js
    unverified: []
    blockers:
      - >-
        Before changing composition, pin real init identity, failed acquisition/retry,
        retained mail/model collaborators versus late jobs/media/storage resolution, and
        normal boot availability. Calling init twice without asserting identity is insufficient.
      - >-
        Characterize the release-before-staged-deletion drain boundary with a held cleanup,
        then define root/job ownership for admission, cancellation, mail and filesystem drain.
        Existing allSettled coverage does not prove complete handler settlement or restart.
      - >-
        Preserve staged-file ownership when storage changes between stage/remove; cover
        cleanup failure masking, orphan recovery and bounded CSV/archive resources. The row
        cap is applied after full reads/extraction and does not itself bound bytes or memory.
      - >-
        Pin duplicate/concurrent jobs and concurrent source-ID/slug writes, partial import
        persistence and second timestamp-write rollback if these paths change. Existing real
        relation rollback and sequential duplicate tests do not establish those contracts.
      - >-
        Add focused retained-root settings/config and real dispatch-await coverage before
        changing those boundaries. Broader import policy, validation and pre-existing storage
        gaps belong to this service's later work and do not gate the eight-service pilot.
  custom-redirects:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - custom-redirects/index.js
    notes: >-
      Preserve the stable mounted redirect handler across uploads, boot's tolerant activation
      and stricter replacement validation. Repeated root initialization replaces the graph;
      persistence, activation and export are separate boundaries.
    contracts:
      exports:
        summary: >-
          CommonJS exports one object with receiver-independent init plus api/middleware getters.
          api is undefined before init; middleware throws before a manager exists. init returns
          the new service's initialization promise. The deep class has receiver-dependent async
          init, activate, replace and getAll; only getAll returns stored configuration. Parser,
          validation and backup helpers are also deep imports. Tests exercise deep service/parser
          methods and HTTP consumers, not root descriptors, pre-init access or detached API calls.
        sources:
          - core/server/services/custom-redirects/index.js
          - core/server/services/custom-redirects/redirects-service.ts
          - core/server/services/custom-redirects/redirect-config-parser.ts
          - core/server/services/custom-redirects/validation.js
          - core/server/services/custom-redirects/utils.ts
        tests:
          - test/unit/server/services/custom-redirects/redirects-service.test.ts
          - test/unit/server/services/custom-redirects/redirect-config-parser.test.ts
      construction:
        summary: >-
          Import loads dependencies without creating the manager/service. Every init replaces
          the private manager first, resolves the adapter-manager-cached redirects store, then
          publishes a new service before its asynchronous activation finishes. No guard or
          shared pending promise exists. The service retains store, manager, validator and a
          dry-run-manager factory. Adapter failure can leave a new empty manager alongside an
          older API. Boot is the sole runtime root init caller found; construction/publication
          and partial graph replacement are source-only.
        sources:
          - core/server/services/custom-redirects/index.js
          - core/server/services/custom-redirects/redirects-service.ts
          - core/server/services/adapter-manager/index.ts
          - core/server/services/adapter-manager/adapter-manager.ts
          - core/boot.js
        tests: []
      consumers:
        summary: >-
          Frontend mounting retains the current manager's bound handler after offers and tracked
          links, before static/dynamic content. Redirect upload/download and site export retain
          the root and read api per operation; file/S3 stores deep-import parsers and backup naming.
          Legacy HTTP proves two uploads update the mounted handler, disk data and backups. Admin
          HTTP proves YAML upload/download content, while site-export HTTP proves redirect-file
          presence and reupload success, not nonempty redirect equality or frontend precedence.
          Exporter failure units inject the export function, not this root.
        sources:
          - core/frontend/web/site.js
          - core/server/api/endpoints/redirects.js
          - core/server/api/endpoints/exports.js
          - core/server/services/exports/site-exporter.ts
          - core/server/adapters/redirects/FileStore.ts
          - core/server/adapters/redirects/S3RedirectsStore.ts
        tests:
          - test/legacy/api/admin/redirects.test.js
          - test/e2e-api/admin/redirects.test.js
          - test/e2e-api/admin/exports-download.test.js
          - test/unit/server/services/exports/site-exporter.test.ts
      startup:
        summary: >-
          Boot awaits custom redirects after route settings and before link redirection, themes,
          Express mounting and readiness, even with frontend disabled. Init reads the store before
          clearing/loading the new manager. The deep init catches/logs activation errors so unreadable
          storage normally allows boot with an empty new graph; adapter/construction failures
          occur outside that catch. API/middleware are already published while loading. Deep tests
          pin swallowed store failure and no clear on failed read, not pending root readiness,
          backend-only composition or early API calls.
        sources:
          - core/boot.js
          - core/server/services/custom-redirects/index.js
          - core/server/services/custom-redirects/redirects-service.ts
          - core/frontend/web/site.js
        tests:
          - test/unit/server/services/custom-redirects/redirects-service.test.ts
          - test/legacy/api/admin/redirects.test.js
      lifetime:
        summary: >-
          activate and replace mutate the retained manager, preserving its mounted handler within
          one graph. Re-init replaces the private graph while old mounted handlers keep their old
          manager. There is no watcher, event subscription, cross-instance notification or operation
          serialization. activate rereads storage; replace validates/dry-runs, awaits persistence,
          then loads its original array without rereading or cloning it. Concurrent operations or
          caller mutation during the await can diverge storage and active routes. The deep identity
          test only compares an injected stub method; real legacy uploads prove same-boot activation,
          not re-init, retained old APIs or concurrent consistency.
        sources:
          - core/server/services/custom-redirects/index.js
          - core/server/services/custom-redirects/redirects-service.ts
          - core/server/web/shared/dynamic-redirect-manager.js
          - core/frontend/web/site.js
        tests:
          - test/unit/server/services/custom-redirects/redirects-service.test.ts
          - test/legacy/api/admin/redirects.test.js
      configuration:
        summary: >-
          Each manager captures permanent max-age; the dry-run factory reads config when invoked.
          The subdirectory callback uses shared URL helpers, whose production URL values are frozen.
          Store selection/options are adapter-owned. FileStore prefers YAML over JSON, returns
          an empty list if neither exists and always writes JSON. S3 reads/writes JSON and treats
          NotFound/NoSuchKey as an empty list. Validation requires nonempty from/to and a
          compilable regex, without requiring boolean permanent. YAML parsing loads 302 before 301;
          serialization emits 301 before 302, retaining order within each group. Manager matching
          uses insertion order, optional case-insensitive regexes and trailing slashes; target query
          values override incoming ones and temporary redirects use max-age zero. Parser/manager
          tests pin selected encoding/status/order behavior; mixed overlaps and duplicate paths
          through full upload/download/activation remain uncovered.
        sources:
          - core/server/services/custom-redirects/index.js
          - core/server/services/custom-redirects/redirect-config-parser.ts
          - core/server/services/custom-redirects/validation.js
          - core/server/web/shared/dynamic-redirect-manager.js
          - core/shared/url-utils.ts
          - core/shared/config/validated.ts
          - core/server/services/adapter-manager/adapter-manager.ts
          - core/server/adapters/redirects/FileStore.ts
          - core/server/adapters/redirects/S3RedirectsStore.ts
        tests:
          - test/unit/server/services/custom-redirects/redirect-config-parser.test.ts
          - test/unit/server/services/custom-redirects/validation.test.ts
          - test/unit/server/web/shared/dynamic-redirect-manager.test.js
          - test/e2e-api/admin/redirects.test.js
      resources:
        summary: >-
          Each graph owns its manager/router and temporary dry-run managers, borrowing the cached
          redirects adapter; the root owns no timer, watcher, DB transaction or disposer. FileStore
          owns filesystem writes/backups; S3 store owns its SDK client and remote backup/write calls.
          Neither root nor stores expose pending-operation drain or client teardown. File and
          S3 backup names have second precision and can overwrite in that interval. Local store tests use
          temporary files; S3 integration requires GHOST_TEST_S3_AVAILABLE=1 and covers storage,
          not root lifecycle; its multi-backup test spaces writes apart. No shutdown or
          multi-instance update guarantee is inferred.
        sources:
          - core/server/services/custom-redirects/index.js
          - core/server/services/custom-redirects/redirects-service.ts
          - core/server/web/shared/dynamic-redirect-manager.js
          - core/server/adapters/redirects/FileStore.ts
          - core/server/adapters/redirects/S3RedirectsStore.ts
          - core/server/services/custom-redirects/utils.ts
          - core/server/ghost-server.ts
        tests:
          - test/unit/server/adapters/redirects/file-store.test.ts
          - test/integration/adapters/redirects/s3-redirects-store.test.ts
      failures:
        summary: >-
          activate preserves existing routes when reading fails, then clears before per-item
          validation/loading, skips/logs invalid entries and reports when none load. replace
          rejects batch/dry-run errors before writing; after persistence, live-manager failure
          rejects with partial activation and no rollback. Init swallows activation errors unless
          error handling itself throws. Units pin these stages using fake managers/in-memory storage.
          File tests prove selected backup failure recovery, but the JSON atomic-write failure fake
          fails the first backup write, not a later canonical move. HTTP success tests do not prove
          these fault paths. Site export can omit failed redirects while retaining other files.
        sources:
          - core/server/services/custom-redirects/index.js
          - core/server/services/custom-redirects/redirects-service.ts
          - core/server/services/custom-redirects/redirect-config-parser.ts
          - core/server/adapters/redirects/FileStore.ts
          - core/server/adapters/redirects/S3RedirectsStore.ts
          - core/server/services/exports/site-exporter.ts
          - core/server/api/endpoints/redirects.js
        tests:
          - test/unit/server/services/custom-redirects/redirects-service.test.ts
          - test/unit/server/adapters/redirects/file-store.test.ts
          - test/unit/server/services/exports/site-exporter.test.ts
          - test/unit/server/services/custom-redirects/redirect-config-parser.test.ts
    unverified: []
    blockers:
      - >-
        Pin root export/pre-init behavior, pending and failed initialization, backend-only boot
        and repeated/concurrent graph replacement. Real uploads establish one manager's activation,
        not replacement of a mounted handler; preserve tolerant store failures separately from
        construction errors that still reject boot.
      - >-
        Cover concurrent activate/replace and caller mutation while persistence is pending, with
        actual store/manager composition. Define ordering and cross-instance refresh before adding
        lifecycle ownership; there is no operation queue, watcher or notifier today.
      - >-
        Extend storage failure coverage to canonical writes/moves after successful backup, failed
        cleanup and remote partial/ambiguous writes. A rejected write can leave temporary files,
        and post-write activation failure can leave persisted config with only partial live routes.
        Existing injected store/manager tests do not establish end-to-end rollback or recovery.
      - >-
        Add real HTTP contracts for overlapping/duplicate redirects, status-group round trips,
        frontend precedence, regex captures and configured subdirectories. The manager's subdirectory
        unit uses an identity callback and preserves a prefix already in req.url, rather than
        proving root callback wiring. Preserve nonempty redirect values through site export/reimport.
      - >-
        Define ownership of borrowed adapters and pending writes before shutdown/re-init; no root
        drain or S3-client disposal exists. Conditional storage integration coverage is not proof
        of wrapper behavior or safe teardown.
  custom-theme-settings.js:
    kind: file
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - custom-theme-settings.js
    notes: >-
      Preserve boot-before-theme activation, API replacement and the shared render cache.
      Activation concurrency, partial writes and initial visibility handling need contracts.
    contracts:
      exports:
        summary: >-
          CommonJS exports one wrapper with synchronous init returning undefined. Its public
          api appears only after init and exposes activateTheme, listSettings, updateSettings
          and copySettingsBetweenThemes plus mutable working state. There is no reset, stop
          or drain export. The implementation and BREAD/cache classes are deep exports under
