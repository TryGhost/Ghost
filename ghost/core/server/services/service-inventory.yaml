          - test/e2e-api/members-comments/post-access.test.js
      startup:
        summary: >-
          Boot invokes synchronous comments.init in the service Promise.all array after invoking
          members/email-service initialization; it does not separately await either there.
          Content gating is already exported by the members module. Querying needs models/DB;
          notification paths additionally need settings, URL helpers, email-address policy and
          initialized i18n, with reply unsubscribe links requiring the email-service renderer.
          Init has no feature gate or readiness assertion. HTTP exercises normal booted paths;
          the integration calls the root and asserts pinned projections. Pre-init,
          prerequisite failures and partially initialized dependencies are not characterized.
        sources:
          - core/boot.js
          - core/server/services/comments/index.js
          - core/server/services/comments/comments-service-emails.js
          - core/server/services/members/service.js
