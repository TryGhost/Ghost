      lifetime:
        summary: >-
          Wrapper identity survives re-init, but API/controller/stats/email helper/renderer/mailer
          identities are replaced; retained old implementations and in-flight calls keep their
          old graph. There is no reset/shutdown or old-transport disposal. Comment, vote and report
          state lives in shared tables. Stats accesses db.knex when querying; notification helpers
          call retained settings/URL facades and current email-service renderer. HTML templates
          are read/compiled each render; text modules are require-cached. Existing tests exercise
          normal persistence/rendering and a real-root pinned query, not re-init or restart.
        sources:
          - core/server/services/comments/index.js
          - core/server/services/comments/comments-stats-service.js
          - core/server/services/comments/comments-service-emails.js
          - core/server/services/comments/comments-service-email-renderer.js
          - core/server/data/schema/schema.js
        tests:
          - test/integration/services/comments-service.test.js
          - test/unit/server/services/comments/comments-service-emails-renderer.test.ts
      configuration:
        summary: >-
          enabled reads comments_enabled each time and treats unknown values as off. Most member
          operations enforce it; site-wide Admin moderation, bulk status updates and counts do
          not. Mail content/sender/URLs call settings/helpers per send, but shared url-utils freezes
          site/subdirectory/admin URLs at import. The translator retained
          by the renderer forwards to current i18n. GhostMailer captures transport/options at
          construction, while address normalization occurs at send. HTTP tests stub settings
          and mutate test config to assert disabled/paid access and support-address output;
          renderer units assert selected English/German text. None establishes production
          config hot reload or transport refresh from the immutable config tree.
        sources:
          - core/server/services/comments/comments-service.js
          - core/server/services/comments/comments-service-emails.js
          - core/server/services/comments/comments-service-email-renderer.js
          - core/server/services/comments/comments-stats-service.js
          - core/server/services/settings-helpers/settings-helpers.js
          - core/server/services/i18n.js
          - core/server/lib/mail/ghost-mailer.js
          - core/shared/config/SCHEMA.md
          - core/shared/url-utils.ts
        tests:
          - test/e2e-api/members-comments/comments.test.js
          - test/unit/server/services/comments/comments-service-emails-renderer.test.ts
      resources:
        summary: >-
          The nested mailer owns a configured Nodemailer transport; comments has no close/drain
          hook, task queue or subscription. Notifications are awaited sequentially, with file
          reads per render; HTTP request draining is external. Models borrow the shared DB.
          Report notification reads post, member and owner concurrently, then renders/sends;
          units assert its template and mail payload, not the lookup timing. Votes join a supplied
          transaction or open one and lock the comment before replacing votes; create/reply/report
          do not establish a transaction spanning persistence and
          mail. Domain event subscribers run separately and test allSettled is not a production
          drain. Vote units assert arguments using fake transactions; HTTP mail replaces
          GhostMailer.sendMail, preserving normalization but bypassing transport/provider work.
        sources:
          - core/server/services/comments/index.js
          - core/server/services/comments/comments-service.js
          - core/server/services/comments/comments-service-emails.js
          - core/server/services/comments/comments-service-email-renderer.js
          - core/server/lib/mail/ghost-mailer.js
          - core/server/models/comment.js
          - core/server/services/members-events/last-seen-at-updater.js
          - core/server/ghost-server.ts
          - test/utils/e2e-framework-mock-manager.js
        tests:
          - test/unit/server/services/comments/comments-service-emails.test.js
          - test/unit/server/services/comments/comments-service.test.js
          - test/e2e-api/members-comments/comments.test.js
      failures:
        summary: >-
          Construction errors throw synchronously without cleanup; operation errors reject.
          A comment/reply is saved before mail, domain dispatch and the final read, so later
          failure can reject after persistence; mail failure prevents that domain dispatch and
          remaining recipients. Reports also persist before mail; a later duplicate request
          returns without retrying notification. Reaction controllers read after mutation before
          setting headers. HTTP asserts sequential duplicate-report suppression, access errors
          and successful mail/persistence; units assert notification recipient deduplication with
          fake email helpers. Post-write mail/read failures, retry effects and concurrent
          vote/report outcomes remain source-only and untested by those assertions.
        sources:
          - core/server/services/comments/index.js
          - core/server/services/comments/comments-service.js
          - core/server/services/comments/comments-controller.js
          - core/server/services/comments/comments-service-emails.js
          - core/server/lib/mail/ghost-mailer.js
        tests:
          - test/unit/server/services/comments/comments-service.test.js
          - test/e2e-api/members-comments/comments.test.js
          - test/e2e-api/members-comments/post-access.test.js
    unverified: []
    blockers:
      - >-
        Pin real-root exports, synchronous initialization, repeated replacement and retained
        wrapper/implementation behavior, including failed construction and in-flight calls.
        The Content post mapper currently treats missing api.enabled as not off; characterize
        that pre-init/facade-shape edge rather than assuming optional chaining protects it.
      - >-
        Cover actual composition when rendering, mail or the final read fails after comment/
        report persistence, including recipient continuation, event dispatch, request retries
        and omitted invalidation headers. Intercepted successful mail and fake recipient
        helpers do not establish those failure contracts or notification durability.
      - >-
        Establish mail-transport ownership on replacement/shutdown and behavior of pending
        notification/domain-event work. Comments closes no transport and registers no cleanup;
        test DomainEvents settlement and HTTP response assertions are not production drain
        guarantees. Preserve the email renderer/i18n/email-address prerequisites.
      - >-
        Add real transaction failure/concurrency evidence for votes, report deduplication and
        moderation races. Vote units use fake transaction callbacks; sequential report tests
        do not establish atomic deduplication. Keep access/visibility, counts, consumer headers
        and bulk-hide behavior covered when the root interface changes.
  content-import:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - content-import/index.ts
    notes: >-
      Preserve boot-created importer state, request validation, job dispatch, staging and
      completion reporting. Keep this background audit separate from the eight-service pilot.
    contracts:
      exports:
        summary: >-
          The TypeScript root exports synchronous init and Promise-returning importCSV,
          handleJob and allSettled functions. importCSV and handleJob throw synchronously
          before initialization; request-schema errors also throw synchronously, whereas
          accepted import preparation and handler failures reject promises. allSettled before
          init resolves. The deep ContentCSVImportJob class carries serializable upload,
          mapping, recipient and run metadata; it is a job definition, not another root.
          Units assert the pre-init handler/drain path and injected job serialization. A
          separately imported root in HTTP tests checks pre-init import, two successful init
          calls, schema errors and asynchronous unreadable-file rejection, not root identity.
        sources:
