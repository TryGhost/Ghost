          Activation reconciles current theme definitions with stored values: remove missing
          or changed types, reset invalid selects and add defaults. Definitions are shallowly
          copied for editing; updates accept only keys/values and validate select, boolean and
          six-digit color values. Public-cache visibility is evaluated on updates, but initial
