          - test/unit/server/services/mentions/mention-discovery-service.test.ts
          - test/unit/server/services/mentions/webmention-metadata.test.js
          - test/unit/server/services/mentions/mentions-api.test.js
          - test/e2e-api/webmentions/webmentions.test.js
          - test/integration/services/mentions/send-webmentions-job.test.ts
    unverified: []
    blockers:
      - >-
        Protect root import/pre-init shape, repeated init identity, partial construction
        and retry behavior at the real wrapper boundary. didInit is published before
        acquisition, and controller.init is unawaited. Existing service units test URL
        helpers; retained-controller jobs coverage does not cover this wrapper or sender.
      - >-
        Preserve the real mentions-to-recommendations startup dependency when changing
        construction timing. The boot await/rejection units fake recommendations and
        cannot detect it reading api/sendingService before asynchronous publication.
      - >-
        Cover listener/mapper ownership and overlapping work before introducing reset or
        shutdown. Raw event preparation and recommendation sendAll calls run outside the
        jobs backend's drain; queued processing can finish before domain subscribers.
        Repeated listen/addMapper calls accumulate registrations, and recursive mappers
        have no cycle guard. HTTP tests supply their own observation/settlement mechanisms.
      - >-
        Characterize configuration timing through the real wrapper if callbacks or
        dependency capture change: frozen shared URLs, routing's init snapshot, current
        privacy before enqueue, and source/HTML captured for jobs. Fixed fake getters and
        test configuration replacement do not prove production hot reload or privacy
        changes while jobs are pending.
      - >-
        Before changing repository or transport composition, add focused assertions for
        persisted revalidation counts and write/event failure ordering.
        Model writes and event delivery are not one transaction; lookup/create is not
        atomic and re-saving a new entity can redispatch its uncleared events. API units
        share in-memory entities and do not prove SQL uniqueness/filtering or persistence.
        Nock/test hooks do not establish production retry, timeout, cancellation or socket
        cleanup. These source-derived gaps are scoped to mentions, not pilot prerequisites.
  milestones:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - milestones/index.js
    notes: >-
      Preserve background startup, captured milestone configuration and live Stripe eligibility.
      Scheduling, failure and cleanup gaps remain migration blockers.
    contracts:
      exports:
        summary: >-
          CommonJS index forwards the cached service object, exposing mutable api, init, run,
          scheduleRun and initAndRun. Methods use this; api starts null and becomes a
          MilestonesService with checkMilestones. Runtime event consumers deep-import the
          MilestoneCreatedEvent class rather than the wrapper.
        sources:
          - core/server/services/milestones/index.js
          - core/server/services/milestones/service.js
          - core/server/services/milestones/milestones-service.js
          - core/server/services/milestones/milestone-created-event.js
        tests:
          - test/unit/server/services/milestones/index.test.ts
      construction:
        summary: >-
          Import loads models, repository and event dependencies and samples JOB_TIMEOUT.
          First init synchronously constructs BookshelfMilestoneRepository, MilestoneQueries
          and MilestonesService before its async method resolves; later calls retain api.
          Queries retain the shared db module and the repository retains models.Milestone and
          DomainEvents. InMemoryMilestoneRepository and direct implementation construction
          are used by tests, not another runtime composition path.
        sources:
          - core/server/services/milestones/service.js
          - core/server/services/milestones/milestone-queries.js
          - core/server/services/milestones/bookshelf-milestone-repository.js
          - core/server/services/milestones/in-memory-milestone-repository.js
        tests:
          - test/e2e-server/services/milestones.test.js
      consumers:
        summary: >-
          Background boot is the only runtime wrapper caller and invokes initAndRun. Staff
          and slack-notifications subscribe to the deep-imported milestone event for email
          and webhook delivery. Milestone creation records events; repository save dispatches
          them after its database write without awaiting consumers. The root has no HTTP or
          CLI caller and does not send mail itself.
        sources:
          - core/boot.js
          - core/server/services/milestones/milestone.js
          - core/server/services/milestones/bookshelf-milestone-repository.js
          - core/server/services/staff/staff-service.js
          - core/server/services/staff/staff-service-emails.js
          - core/server/services/slack-notifications/slack-notifications-service.js
        tests:
          - test/unit/server/services/milestones/milestone.test.ts
          - test/unit/server/services/staff/index.test.js
          - test/unit/server/services/slack-notifications/index.test.js
      startup:
        summary: >-
          Boot starts background services after mounting the app and notifying readiness,
          skips their main sequence in test environments, and does not await its completion.
          Milestones are started at the end of that sequence after earlier awaited services;
          initAndRun is itself unawaited. Direct run needs api initialized, whereas initAndRun
          initializes it before scheduling. Initialization performs composition, not a
          milestone query or readiness check.
        sources:
          - core/boot.js
          - core/server/services/milestones/service.js
        tests:
          - test/unit/boot-email-analytics.test.ts
          - test/e2e-server/services/milestones.test.js
      lifetime:
        summary: >-
          The wrapper and api survive repeated init and server stop; no reset or shutdown is
          exposed. Each scheduleRun or initAndRun creates another independent one-shot timer,
          with no recurring registration, deduplication or overlap guard. run checks members
          before eligible ARR and reads persisted milestones to avoid recreating an already
          recorded goal during serial runs. Repository events remain on the saved entity.
        sources:
          - core/server/services/milestones/service.js
          - core/server/services/milestones/milestones-service.js
          - core/server/services/milestones/bookshelf-milestone-repository.js
          - core/server/ghost-server.ts
        tests:
          - test/e2e-server/services/milestones.test.js
          - test/unit/server/services/milestones/milestones-service.test.js
      configuration:
        summary: >-
          First init retains the milestones config object and captures
          minDaysSinceImported, using 7 for a falsy value. Each run reads current Stripe keys
          after the members check; development accepts pk_test_ and other environments
          accept pk_live_. scheduleRun rereads NODE_ENV, forces 5000 ms in development and
          otherwise uses customTimeout or the import-time random delay of 0, 1, 2 or 3 days.
          Zero customTimeout selects that fallback. Database contents and the clock are read
          when checks execute.
        sources:
          - core/server/services/milestones/service.js
          - core/server/services/milestones/milestones-service.js
          - core/server/services/milestones/milestone-queries.js
          - core/shared/config/validated.ts
          - core/shared/config/defaults.json
        tests:
          - test/e2e-server/services/milestones.test.js
          - test/unit/server/services/milestones/milestones-service.test.js
      resources:
        summary: >-
          The service owns raw timeouts but stores no handle, does not unref them and has no
          cancellation or drain hook. Boot does not register milestone cleanup with
          GhostServer; jobs-service shutdown does not own these timers. Queries borrow the
          shared db module and the repository borrows the model layer; neither opens a
          dedicated connection or starts an encompassing transaction. Event subscriptions
          and delivery resources belong to staff and slack-notifications, and run completion
          does not await their delivery.
        sources:
          - core/server/services/milestones/service.js
          - core/server/services/milestones/milestone-queries.js
          - core/server/services/milestones/bookshelf-milestone-repository.js
          - core/server/data/db/index.js
          - core/boot.js
          - core/server/ghost-server.ts
          - core/server/services/staff/staff-service.js
          - core/server/services/slack-notifications/slack-notifications-service.js
        tests: []
      failures:
        summary: >-
          Construction errors reject init before api assignment, allowing another attempt.
          Direct run rejects on query, validation or save failure and does not proceed to ARR
          after members failure. scheduleRun awaits run in an async timer callback but never
          rejects its outer promise, so a run rejection leaves callers pending and produces
          an unhandled rejection; boot installs a logging handler. Earlier persisted goals
          are not rolled back as a group. Staff and Slack handlers catch and log notification
          failures after the milestone write, without making run await delivery or retry it.
        sources:
          - core/server/services/milestones/service.js
          - core/server/services/milestones/milestones-service.js
          - core/server/services/milestones/bookshelf-milestone-repository.js
          - core/boot.js
          - core/server/services/staff/staff-service.js
          - core/server/services/slack-notifications/slack-notifications-service.js
        tests:
          - test/unit/server/services/slack-notifications/slack-notifications-service.test.js
    unverified: []
    blockers:
      - >-
        The wrapper unit test only checks that initAndRun exists. Add exact export and identity
        coverage, init failure/retry, use before init and retained consumers across restart.
        Existing E2E coverage calls initAndRun directly; it does not establish the real boot
        readiness boundary or behavior when earlier background initialization fails.
      - >-
        Characterize the existing timer rejection and pending outer promise in an isolated
        process, then decide failure policy separately. No cancellation, drain, restart or
        overlapping-schedule contract is tested; each initAndRun currently adds a timer.
      - >-
        Add configuration timing coverage for captured milestone settings, import-age fallback,
        import-time random delay, explicit zero timeout and the development overrides. Current
        tests do not establish these boundaries or Stripe changes during a pending run.
      - >-
        Characterize overlapping runs and partial persistence before choosing a concurrency
        contract. Goal lookup and saves are not one transaction, the table has no unique
        goal constraint, and saving the same entity again redispatches its retained events.
        Persistence precedes notification completion; email_sent_at is not a delivery receipt.
      - >-
        Verify production repository behavior with multiple prior emailed goals. Bookshelf
        getLastEmailSent selects email_sent_at ASC, while the fake makes value descending primary and email date
        only breaks equal-value ties. The production repository and query unit tests only assert
        method presence, and the E2E test does not distinguish these ordering rules.
      - >-
        Add a production repository-to-event-to-notification contract. Staff/Slack tests
        dispatch events manually, implementation tests use the fake repository and E2E
        does not assert delivery; removing Bookshelf event dispatch could escape those tests.
  newsletters:
