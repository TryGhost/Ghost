        tests: []
      consumers:
        summary: >-
          Email initialization passes service itself to EmailRenderer, which retains it and
          builds both links on each render even when newsletter feedback buttons are disabled.
          Members GET redirects and Members POST/Admin GET endpoint queries retain the wrapper
          and read controller per call. POST authenticates by session or signed member UUID;
          GET redirect only forwards UUID/key. Admin browse requires post-browse permission and
          conditionally includes member details. No external repository consumer was found;
          getMemberByUuid has no caller. HTTP tests exercise submission and two redirect paths.
          Renderer units inject a fake link service and pin button inclusion/exclusion and
          preservation through link tracking, not real root wiring or a newsletter-click flow.
        sources:
