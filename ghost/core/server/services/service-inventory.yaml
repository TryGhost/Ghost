          - test/legacy/models/base/overrides.test.js
      resources:
        summary: >-
          The implementation owns an internal settings map and tracks activation work while
          borrowing the process cache and model/database. It creates no timer, subscription,
          worker or dedicated connection. Copy uses a model transaction for the destination
          check and inserts, with source rows read beforehand. Activation/update writes have
