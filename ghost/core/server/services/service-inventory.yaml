        tests: []
      construction:
        summary: >-
          First init obtains shared events, settings, URL helpers, blogIcon and request-external,
          constructs SlackPingService, assigns service and subscribes it. The image-library
          import also obtains image cache/storage adapters and constructs its shared helpers.
          The wrapper is the only runtime SlackPingService constructor found; tests inject
          collaborators directly. Initialization and subscription are not gated on a Slack URL.
        sources:
          - core/server/services/slack-ping/index.ts
          - core/server/services/slack-ping/slack-ping-service.ts
          - core/server/lib/image/index.js
          - core/server/lib/image/image-utils.js
          - core/server/lib/request-external.js
        tests: []
      consumers:
        summary: >-
          Boot is the only direct root caller. The shared model emitter invokes post.published
          with the post model and its authors/tags relations; imports are skipped. The authenticated Admin
          slack/test endpoint emits slack.test, whose listener sends a fixed test message.
          Both listeners discard the ping promise, so API/model completion does not establish
          webhook delivery. No CLI, scheduled job or alternate runtime deep constructor was
          found. Unit tests call handlers directly; the API test mocks event emission.
        sources:
          - core/boot.js
          - core/server/services/slack-ping/slack-ping-service.ts
          - core/server/models/post.js
          - core/server/models/base/plugins/events.js
          - core/server/api/endpoints/slack.js
          - core/server/web/api/endpoints/admin/routes.js
        tests:
          - test/unit/server/services/slack-ping/slack-ping-service.test.js
          - test/e2e-api/admin/slack.test.js
      startup:
        summary: >-
          Required-service boot calls init while assembling Promise.all prerequisites, after
          settings and dynamic routing and before readiness. Importing the wrapper does not
          subscribe; init installs callbacks synchronously without checking webhook delivery.
          A constructed service can receive events immediately; direct ping depends on its
          injected settings/URL/image helpers rather than an explicit readiness guard.
        sources:
          - core/boot.js
          - core/server/services/slack-ping/index.ts
          - core/server/services/slack-ping/slack-ping-service.ts
        tests: []
      lifetime:
        summary: >-
          Wrapper init returns early once service is assigned, retaining its dependencies and
          listener identities across same-process boots. subscribeEvents removes/re-adds its
          own bound post.published and slack.test callbacks; it cannot remove callbacks belonging
          to another instance. Wrapper init does not restore listeners removed elsewhere.
          There is no local queue, send deduplication or serialization, and server stop supplies
          no Slack-ping reset or unsubscribe.
        sources:
          - core/server/services/slack-ping/index.ts
          - core/server/services/slack-ping/slack-ping-service.ts
          - core/server/lib/common/events.js
          - core/boot.js
          - core/server/ghost-server.ts
        tests: []
      configuration:
        summary: >-
          Each ping reads Slack URL, username and site title; blank username falls back to Ghost.
          URL/image/icon helpers resolve current routing and settings. Post URL/description work
          happens before the missing-URL, page and default-slug gates. Descriptions prefer custom
          excerpts, otherwise strip HTML before the members-only marker and keep three sentences.
          request-external captures agent options and test hooks at import, but reads environment
          and site URL during request checks; its default request timeout is 10 seconds, 5 under
          the import-time test hook. Ping adds no local timeout or retry policy.
        sources:
