          Init throws synchronously; scheduler registration rejection propagates and permits
          retry. Wrapper startFetch logs and swallows ordinary fetch errors, permitting later ticks;
          its injected restore rejection test propagates, but real restoreScheduled catches
          read errors internally and the wrapper does not retry restoration. Direct service
          fetches reject provider/final-aggregation errors, rewind the in-memory cursor on
          fetch failure and retain prior published progress; intermediate aggregation errors
          log and continue. Service units assert these paths with fake queries/processors.
          SQLite query tests assert timestamp-write errors are swallowed and status-write
          errors reject; metadata writes also swallow errors in source. Cancel/completion
          metadata writes are not awaited. No transaction spans provider fetches, recipient
          writes, event dispatch, aggregation and cursors. Booted integrations establish selected
          stored results and replay behavior, not rollback or exactly-once side effects.
        sources:
