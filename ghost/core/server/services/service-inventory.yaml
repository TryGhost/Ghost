          - test/e2e-api/admin/newsletters.test.js
    unverified: []
    blockers:
      - >-
        Protect root identity, exact public surface, construction/readiness ordering and
        retained Admin/member consumers through stop/reboot and dependency failure before
        replacing eager composition. Define ownership/drain of the mail transport.
      - >-
        Cover real token issuance-to-HTTP-verification, root-specific expiry/reuse limits,
        wrong-flow consumption, failed property persistence, the mailer default-sender fallback
        and policy changes between
        issuance and use; fake token parsing and sent-mail snapshots do not establish this.
      - >-
        Protect opt-in rollback and ordinary add/edit persistence when reread, token writes
        or first/later mail sends fail. Establish concurrent limit/sort-order/opt-in behavior
        and the shared MagicLink transporter boundary; do not infer atomicity from success.
      - >-
        Characterize new-newsletter custom reply-to verification, missing edit input and
        genuine active editing at the host limit. Existing tests omit or misname these
        cases; keep legacy failures explicit rather than changing them during migration.
  notifications:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - notifications/index.js
      - notifications/notification-email.ts
    notes: >-
      Preserve the nested notifications export and per-user visibility contracts. Notification
      persistence is split with the API controller; settle its business-logic owner and the
      separately constructed email helper's ownership before migration.
    contracts:
      exports:
        summary: >-
          CommonJS index exports an object with one notifications instance, without init or
          shutdown. Its add method returns existing and new notification arrays; browse and
          destroyAll return arrays. destroy returns an array, a rejected promise, or a promise
          resolving undefined for an already-seen item. The implementation exports its
          constructor. The instance also exposes fetchAllNotifications, areNotificationsValid,
          wasSeen, dangerousDestroyAll and mutable dependency fields. Deep TypeScript exports
          provide NotificationEmailService and the HTML
          sanitizer. These do not share the index instance.
        sources:
          - core/server/services/notifications/index.js
          - core/server/services/notifications/notifications.js
          - core/server/services/notifications/notification-email.ts
          - core/server/services/notifications/sanitize-notification-html.ts
        tests: []
      construction:
        summary: >-
          Index import constructs Notifications with the shared settings cache and Settings
          model. The only other constructor calls found are tests. Each permitted update-check
          invocation independently constructs NotificationEmailService with a new GhostMailer,
          the shared template generator and a live site-URL callback. The notification API
          controller also eagerly constructs a SettingsBREADService, whose constructor creates
          another mailer and magic-link helper; those are not index-owned dependencies.
        sources:
          - core/server/services/notifications/index.js
          - core/server/services/notifications/notifications.js
          - core/server/services/notifications/notification-email.ts
          - core/server/services/update-check/index.js
          - core/server/api/endpoints/notifications.js
          - core/server/services/settings/settings-service.js
          - core/server/services/settings/settings-bread-service.js
          - core/server/models/base/listeners.js
          - core/server/models/index.js
        tests: []
      consumers:
        summary: >-
          The notification API controller is the only runtime index consumer found. Admin
          routes expose browse/add/dismiss through authenticated API pipelines; destroyAll is
          an internal endpoint without an HTTP route. Update-check awaits notification adds
          through the API, while the mail endpoint starts an unawaited warning add after direct
          transport failure. Update-check is the only runtime notification-email constructor
          consumer. HTTP serialization removes internal seen/version/time fields from responses.
        sources:
          - core/server/api/endpoints/notifications.js
          - core/server/web/api/endpoints/admin/routes.js
          - core/server/api/endpoints/utils/serializers/output/notifications.js
          - core/server/api/endpoints/mail.js
          - core/server/services/update-check/index.js
          - core/server/services/update-check/update-check-service.js
        tests:
          - test/e2e-api/admin/notifications.test.js
          - test/integration/jobs/update-check.test.ts
      startup:
        summary: >-
          This root has no boot hook or readiness guard. Construction stores dependencies;
          operations need a populated settings cache, and persistence needs the Settings model.
          Boot initializes database and settings before mounting the API. Reading before cache
          initialization is treated as corrupt notification data and starts an asynchronous
          reset rather than returning a readiness error. NotificationEmailService needs its
          injected mail/template dependencies ready; update-check invokes it from initialized
          jobs, after resolving recipients.
        sources:
          - core/boot.js
          - core/server/services/notifications/notifications.js
          - core/shared/settings-cache/cache-manager.js
          - core/server/services/notifications/notification-email.ts
          - core/server/services/update-check/update-check-service.js
          - core/server/services/jobs-service/register-job-handlers.ts
        tests: []
      lifetime:
        summary: >-
          The module-cached instance retains dependency references, not a private notification
          list. Operations reread the notifications setting; normal stored JSON is parsed into
          a fresh array by settings cache. add/destroy/destroyAll transform that data, while the
          API controller persists the complete resulting array. Dismissal retains records and
          adds the user to seenBy; legacy seen applies only without seenBy. Cache reinitialization
          preserves the cache-manager object, so the retained root reads its current store.
          A model listener prunes old seen records except explicit release notifications,
          using seen rather than seenBy. No notification-level serialization protects the
          concurrent read/replace operations.
        sources:
          - core/server/services/notifications/index.js
          - core/server/services/notifications/notifications.js
          - core/server/api/endpoints/notifications.js
          - core/shared/settings-cache/index.js
          - core/shared/settings-cache/cache-manager.js
          - core/server/models/settings.js
          - core/server/services/settings/settings-bread-service.js
          - core/server/models/base/listeners.js
          - core/server/models/index.js
        tests:
          - test/legacy/models/base/listeners.test.js
          - test/e2e-api/admin/notifications.test.js
          - test/unit/server/services/notifications/notifications.test.js
      configuration:
        summary: >-
          The index reads no config snapshot. Each operation reads current cached notification
          data; add reads the current Ghost version and time for defaults, while browse applies
          version/seen filters and sorts by addedAt. Sanitization uses a fixed semantic-tag and
          URL-scheme allowlist on add, browse and email rendering. The email helper captures
          dependencies, resolves its URL callback once per nonempty send, then renders and
          sends separately for each recipient; update-check resolves recipient addresses.
        sources:
          - core/server/services/notifications/notifications.js
          - core/server/services/notifications/sanitize-notification-html.ts
          - core/server/services/notifications/notification-email.ts
          - core/server/services/update-check/update-check-service.js
          - core/server/lib/mail/index.js
          - core/server/lib/mail/email-content-generator.js
        tests:
          - test/unit/server/services/notifications/notifications.test.js
          - test/unit/server/services/notifications/sanitize-notification-html.test.ts
          - test/unit/server/services/notifications/notification-email.test.ts
          - test/unit/server/services/update-check.test.js
      resources:
        summary: >-
          The Notifications instance borrows settings/model resources and creates no timer, listener, pool
          or queue. Normal API mutations await SettingsBREADService persistence; malformed
          non-array data instead triggers an untracked SettingsModel.edit reset from the read
          path. Model import registers a settings.notifications.edited listener which can
          start another whole-array settings write without the original edit awaiting it.
          NotificationEmailService borrows its injected mailer and template generator,
          awaits sequential sends and owns no cleanup. The per-check mail transport belongs to
          update-check's composition; the API's eager SettingsBREADService has separate mail
          resources. Neither path exposes notification-specific cancellation or drain.
        sources:
          - core/server/services/notifications/notifications.js
          - core/server/services/notifications/notification-email.ts
          - core/server/api/endpoints/notifications.js
          - core/server/services/settings/settings-bread-service.js
          - core/server/services/update-check/index.js
          - core/server/lib/mail/ghost-mailer.js
          - core/server/models/base/listeners.js
          - core/server/models/index.js
        tests:
          - test/unit/server/services/notifications/notifications.test.js
          - test/unit/server/services/notifications/notification-email.test.ts
      failures:
        summary: >-
          add throws ValidationError for a non-string new message. destroy rejects with
          NoPermissionError for an undismissible item and NotFoundError for an unknown ID.
          Only the outer stored array is validated; invalid members or version data can throw.
          A non-array read returns empty immediately while resetting storage; reset rejection
          is not caught or returned to that caller. The separate age-pruning listener calls
          errors.logError on write rejection, but that method is absent in the current errors
          package, replacing the write failure with TypeError.
          API write failures propagate. Email render,
          URL or send failures reject and stop later recipients after any earlier deliveries;
          update-check decides whether to continue notification storage or rethrow.
        sources:
          - package.json
          - core/server/services/notifications/notifications.js
          - core/server/services/notifications/notification-email.ts
          - core/server/api/endpoints/notifications.js
          - core/server/services/update-check/update-check-service.js
          - core/server/models/base/listeners.js
          - core/server/models/index.js
        tests:
          - test/unit/server/services/notifications/notifications.test.js
    unverified: []
    blockers:
      - >-
        Move persistence orchestration to its business owner only after characterizing the
        current root/API split. API add persists only when notificationsToAdd is nonempty;
        destroy always calls settings edit, including when the root returns undefined for an
        already-seen item. Keep HTTP permissions, statuses and serialization at the API layer.
      - >-
        Add export, construction, pre-init and same-process restart contracts for the retained
        root and both mail composition paths. Current constructor tests use fake caches; API
        tests cover HTTP behavior but not root identity, dependency rebinding or mail disposal.
      - >-
        Characterize concurrent add/dismiss/repair and failed persistence with real storage.
        Whole-array replacement has no notification-level lock or version check, so overlapping
        snapshots can lose additions or seenBy updates. Existing multi-user tests are sequential.
      - >-
        Decide and test read-path repair ownership. Invalid data and pre-init reads start a
        detached reset that may repeat, race a valid write, reject after the caller returns or
        outlive shutdown. The existing test proves only an empty result and a resolving stub
        call with the string '[]', not repair completion, internal context, failure or durability.
      - >-
        Add batch/deduplication, release replacement, ordering and dismissal edge contracts.
        Defaults generate one ID per add call, and duplicates are checked only against existing
        rows; missing IDs or duplicate IDs within a batch are not characterized. destroyAll
        sets seen without updating seenBy. Missing/undismissible/already-seen errors and malformed
        array entries/version values lack focused coverage.
      - >-
        Characterize notification-email partial delivery, live URL/template settings and render
        or send rejection. Helper tests prove successful recipient rendering, sanitization and
        empty-recipient behavior; successful job integration does not prove transport cleanup,
        failure propagation or shutdown draining. Decide the helper's owner separately from
        the cached notification list.
      - >-
        Include model-owned age pruning in concurrency, failure and shutdown contracts. It
        starts a separate whole-array write and ignores seenBy, so one user's dismissal can
        make an old custom notification eligible for global deletion. Legacy listener tests
        check counts after success, including a fixed delay; they do not cover races, drain
        or the unavailable errors.logError rejection handler.
  oembed:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - oembed/index.js
    notes: >-
      Preserve the shared instance, custom-provider precedence, metadata consumers and image
      side effects. Credentials and the image adapter are captured at import; request-time
      configuration and caller options have different scopes.
    contracts:
      exports:
        summary: >-
          CommonJS index forwards an eager OEmbedService instance; deep modules export its
          constructor and provider constructors. Fetch/scrape/image operations return promises
          and use receiver dependencies. Config, request client, imageStore and customProviders are mutable
          properties; synchronous registerProvider appends without validation or deduplication.
          Custom providers run before card-type dispatch and the first result other than null
          wins. Mention results skip thumbnail storage. Class tests pin selected metadata,
          provider lookup, YouTube rewriting, image behavior and custom-provider mention handling,
          not the complete root shape or return contracts across all custom providers/types.
        sources:
          - core/server/services/oembed/index.js
          - core/server/services/oembed/service.js
          - core/server/services/oembed/oembed-service.js
          - core/server/services/oembed/nft-oembed-provider.js
          - core/server/services/oembed/twitter-oembed-provider.js
        tests:
          - test/unit/server/services/oembed/oembed-service.test.js
      construction:
        summary: >-
          The service module is the only production constructor site found. Import obtains
          storage:images from the shared adapter manager, constructs OEmbedService, then registers
          NFT followed by Twitter with copied credentials. Construction stores dependencies;
          provider HTTP and image writes happen on calls. Dependency imports create shared request
          agents, and adapter lookup may construct a configured storage client. Deep-class tests
          inject dependencies; the Admin HTTP suite uses the real root but does not assert this
          construction graph, provider order, captured credentials or import-failure recovery.
        sources:
          - core/server/services/oembed/service.js
          - core/server/services/oembed/oembed-service.js
          - core/server/services/adapter-manager/adapter-manager.ts
          - core/server/adapters/storage/LocalImagesStorage.ts
          - core/server/adapters/storage/S3Storage.ts
          - core/server/lib/request-external.js
        tests:
          - test/unit/server/services/oembed/oembed-service.test.js
          - test/e2e-api/admin/oembed.test.js
      consumers:
        summary: >-
          The authenticated Admin oembed endpoint retains the instance and serializes image URLs.
          WebmentionMetadata retains it for mention metadata/body and optional original-page
          verification; recommendations injects it into a retained metadata service that calls it
          as fallback after its separate Ghost-site probe. Only composition registers providers
          in production searches.
          Admin HTTP assertions pin response/error shapes, URL mapping, charset handling and
          blocked destinations with mocked HTTP/DNS; most successful image processing is stubbed.
          Webmention tests stub root fetching to assert transient-error tagging. Recommendation
          tests inject a fake oembed service and pin fallback mapping, not the real root's mention
          payload or timeout propagation. Custom-provider results need not contain their expected
          metadata/body; WebmentionMetadata dereferences metadata without a guard.
        sources:
          - core/server/api/endpoints/oembed.js
          - core/server/api/endpoints/utils/validators/input/oembed.js
          - core/server/api/endpoints/utils/serializers/output/oembed.js
          - core/server/api/endpoints/utils/serializers/output/mappers/oembed.js
          - core/server/web/api/endpoints/admin/routes.js
          - core/server/services/mentions/webmention-metadata.js
          - core/server/services/recommendations/recommendation-service-wrapper.js
          - core/server/services/recommendations/service/recommendation-metadata-service.ts
        tests:
          - test/e2e-api/admin/oembed.test.js
          - test/unit/server/services/mentions/webmention-metadata.test.js
          - test/unit/server/services/recommendations/service/recommendation-metadata-service.test.ts
      startup:
        summary: >-
          There is no init or readiness gate: importing consumers performs composition, and calls
          can immediately fetch or write. Mentions imports its metadata implementation eagerly;
          recommendations requires oembed during init. Boot validates adapters in initCore before
          initServices but has no explicit oembed startup/drain registration. Missing provider
          config subtrees or adapter construction errors can reject the importing boot path.
          The Admin suite boots Ghost and exercises requests; it does not characterize early
          import, partial construction or repeat boot in the same module graph.
        sources:
          - core/boot.js
          - core/server/services/oembed/service.js
          - core/server/services/mentions/service.js
          - core/server/services/mentions/webmention-metadata.js
          - core/server/services/recommendations/recommendation-service-wrapper.js
        tests:
          - test/e2e-api/admin/oembed.test.js
      lifetime:
        summary: >-
          Module caching retains the same instance/provider array and captured adapter/client.
          There is no root result cache, in-flight deduplication, reset or shutdown. Adapter-cache
          clearing does not replace this retained imageStore. Each scrape parses the page afresh;
          concurrent calls share providers/dependencies. Bookmark page fetch and optional
          enrichment run together and allSettled waits for both; enrichment has its own abort
          deadline. Image writes get fresh UUID names rather than reuse existing files. Units
          assert distinct keys for repeated identical bytes and fallback after slow enrichment,
          not concurrent registration, repeated root imports or retained callers after replacement.
        sources:
          - core/server/services/oembed/oembed-service.js
          - core/server/services/oembed/service.js
          - core/server/services/adapter-manager/adapter-manager.ts
          - core/server/services/mentions/webmention-metadata.js
          - core/server/services/recommendations/service/recommendation-metadata-service.ts
        tests:
          - test/unit/server/services/oembed/oembed-service.test.js
      configuration:
        summary: >-
          Provider credentials are copied at import, while image allowlists are read per
          operation. Request-external captures agent sizing but reads env/site URL for
          destination checks; development and same-site exemptions apply. Test config replacement
          is not production hot reload. Page calls accept fetch options; custom/ordinary known
          providers, image downloads, favicon probes/HEAD and discovered oembed JSON do not inherit
          that whole option object. Recommendations does not pass its timeout to oembed fallback.
          Test-mode request hooks force zero retries and a 5s request timeout; production keeps
          dependency defaults unless overridden. Units pin selected timeout arguments, enrichment
          abort/fallback and configurable image extensions; they do not prove an overall deadline
          or production retry policy. Provider tests do not assert root credential wiring.
        sources:
          - core/server/services/oembed/service.js
          - core/server/services/oembed/oembed-service.js
          - core/server/services/oembed/extract-oembed.ts
          - core/server/services/oembed/twitter-oembed-provider.js
          - core/server/services/oembed/nft-oembed-provider.js
          - core/server/services/recommendations/service/recommendation-metadata-service.ts
          - core/server/lib/request-external.js
          - core/shared/config/validated.ts
          - package.json
        tests:
          - test/unit/server/services/oembed/oembed-service.test.js
          - test/unit/server/services/oembed/twitter-embed.test.js
          - test/unit/server/services/oembed/nft-oembed.test.ts
      resources:
        summary: >-
          This root owns no subscription or recurring timer. Calls borrow shared HTTP/HTTPS agents,
          allocate response/image buffers and favicon streams, and create enrichment abort timers.
          Favicon probing requests a byte range and destroys the stream on first data; other image
          downloads buffer the whole response before SVG limits/content checks. SVG conversion
          invokes native image processing with a 10s processing timeout; storage saveRaw writes a
          UUID path through the captured adapter, including filesystem writes or an S3 PutObject.
          No root cancellation, operation drain or saved-file compensation exists. Units exercise
          real conversion with fake storage and selected real local HTTP probes; the four-byte
          probe fixture does not prove early cancellation of a large/chunked response. HTTP tests
          restore real image fetching for private-address and nonimage cases, not successful
          persistence through real storage. Nested client/native cleanup remains uncharacterized.
        sources:
          - core/server/services/oembed/oembed-service.js
          - core/server/lib/request-external.js
          - core/server/adapters/storage/LocalStorageBase.ts
          - core/server/adapters/storage/S3Storage.ts
          - core/server/services/adapter-manager/adapter-manager.ts
          - core/boot.js
          - package.json
        tests:
          - test/unit/server/services/oembed/oembed-service.test.js
          - test/e2e-api/admin/oembed.test.js
      failures:
        summary: >-
          Private dispatch catches awaited failures, consults shouldRethrowFetchError, preserves
          ValidationErrors, otherwise logs and substitutes unknown-provider validation. Returned
          knownProvider/explicit-bookmark promises can reject outside that catch; knownProvider
          maps extractor errors itself. Enrichment failure is optional; scraper failure becomes
          unknown-provider and absent title is insufficient-metadata. Icon/image failures log and
          retain documented fallback URLs; optional Twitter enrichment failure logs but preserves
          its base embed. No rollback removes earlier saved files. Units pin selected rethrows,
          invalid schema/images and fallback behavior; several known-provider rejection tests use
          catch-only assertions. HTTP assertions strongly pin selected 422/error and private-address
          failures. Missing mention contentType, custom-provider shape mismatches and NFT parsed
          response assumptions remain source risks without reproductions in this audit.
        sources:
          - core/server/services/oembed/oembed-service.js
          - core/server/services/oembed/extract-oembed.ts
          - core/server/services/oembed/oembed-schema.ts
          - core/server/services/oembed/nft-oembed-provider.js
          - core/server/services/oembed/twitter-oembed-provider.js
          - core/server/services/mentions/webmention-metadata.js
        tests:
          - test/unit/server/services/oembed/oembed-service.test.js
          - test/unit/server/services/oembed/twitter-embed.test.js
          - test/e2e-api/admin/oembed.test.js
    unverified: []
    blockers:
      - >-
        Pin root shape, receiver requirements, single-instance identity, provider ordering and
        captured storage/credentials across early import, import failure and repeated boot.
        Existing class assertions and booted requests do not protect this composition contract.
      - >-
        Exercise real WebmentionMetadata and recommendation fallback with every custom provider
        and card type, missing contentType and JSON/non-HTML pages. Custom providers currently
        bypass mention/bookmark dispatch; the custom-mention unit only asserts no thumbnail
        processing. Characterize metadata/body compatibility before preserving or changing it.
      - >-
        Add provider transport/payload contracts: NFT calls Got json() then reads result.body,
        although the installed client's shortcut returns the parsed body; its sole unit only
        checks URL support. Twitter's success test checks fields already in the base embed, not
        tweet_data, the optional API request or bearer header. These are source/coverage risks,
        not demonstrated live-provider failures.
      - >-
        Pin branch-specific option forwarding, rethrow classification, retries and cancellation
        across page/enrichment, known/custom providers, discovery, probes, images and storage.
        Include returned-promise catch boundaries, caller timeout loss in recommendation fallback,
        production request hooks and large/chunked probe cancellation; test mode changes transport
        defaults. Strengthen catch-only rejection assertions before treating those cases as guards.
      - >-
        Characterize successful root-to-adapter writes, adapter changes with retained callers,
        partial persistence and shutdown with active streams/native work/shared clients. Existing
        fake saveRaw assertions prove names and calls, not filesystem/S3 completion or cleanup.
        Preserve content-based image validation, SVG conversion and private-destination guards
        without assuming the HTTP fixtures cover every dependency resource or DNS failure.
  offers:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - offers/index.js
    notes: >-
      Preserve offers API, frontend redirects and retained members consumers. Repeated init
      rebuilds composition and adds domain-event listeners; redirect publication and coupon
      side effects are separate from database transaction completion.
    contracts:
      exports:
        summary: >-
          The CommonJS index forwards one mutable object with receiver-dependent async init,
          initially null api and a middleware getter. Before init the getter throws through
          undefined redirectManager; afterward it returns that manager's bound handler. API
          methods are async and receiver-dependent, returning DTOs, arrays or null for absent
          offers. Deep modules expose constructible implementation/value classes and event
          identities. There is no reset/shutdown/readiness API. Domain/API tests exercise deep
          implementations; they do not pin root shape, unbound use or pre-init behavior.
        sources:
          - core/server/services/offers/index.js
          - core/server/services/offers/service.js
          - core/server/services/offers/offers-module.js
          - core/server/services/offers/application/offers-api.js
          - core/server/services/offers/application/offer-mapper.ts
          - core/server/web/shared/dynamic-redirect-manager.js
        tests:
          - test/unit/server/services/offers/application/offers-api.test.js
          - test/unit/server/services/offers/domain/models/offer.test.js
      construction:
        summary: >-
          Import loads shared config, URL helpers and models without constructing a redirect
          graph. Every init creates a DynamicRedirectManager, model-backed repository and
          OffersModule/API; it publishes redirectManager and this.api before awaiting module
          init. That module first subscribes to two offer events, then loads existing offers
          and adds temporary redirects, including archived offers. Boot is the only production
          root init caller found. No idempotency guard, shared pending promise or rollback
          protects concurrent/repeated construction. These publication details are source-only.
        sources:
          - core/server/services/offers/service.js
          - core/server/services/offers/offers-module.js
          - core/server/services/offers/offer-bookshelf-repository.js
          - core/boot.js
        tests: []
      consumers:
        summary: >-
          Admin and Content endpoints retain the root and dereference api per request; frontend
          mounting captures the current bound middleware. Members passes the current API to its
          BREAD, payment, repository and router collaborators for offer projection, checkout,
          availability, applying discounts and mapping imported Stripe coupons. Payments also
          subscribes to the deep OfferCreatedEvent and can create a Stripe coupon afterward.
          Admin/Content HTTP tests pin create/read/edit/archive, validation and projection; members
          tests cover availability
          and discount rules with Stripe mocked. The bulk-redemption integration constructs its
          own API. No test found pins root replacement or offer-event-to-frontend redirect wiring.
        sources:
          - core/server/api/endpoints/offers.js
          - core/server/api/endpoints/offers-public.js
          - core/frontend/web/site.js
          - core/server/services/members/api.js
          - core/server/services/members/members-api/members-api.js
          - core/server/services/members/members-api/services/member-bread-service.js
          - core/server/services/members/members-api/services/payments-service.js
          - core/server/services/members/members-api/repositories/member-repository.js
          - core/server/services/members/members-api/controllers/router-controller.js
        tests:
          - test/e2e-api/admin/offers.test.js
          - test/e2e-api/content/offers.test.js
          - test/e2e-api/members/member-offers.test.js
          - test/integration/services/offers-api.test.js
      startup:
        summary: >-
          Boot awaits offers init after core initialization and themes, before Express frontend
          mounting, members composition and readiness. This runs even with frontend disabled.
          The exported API can already be used while initial repository loading is pending;
          external callers receive no readiness guard. Boot propagates init rejection, while
          already-published API/managers/subscriptions remain. Current HTTP tests use completed
          boot; there are no pending-load, rejected-load or partial-publication lifecycle tests.
        sources:
          - core/boot.js
          - core/server/services/offers/service.js
          - core/server/services/offers/offers-module.js
          - core/frontend/web/site.js
        tests:
          - test/e2e-api/admin/offers.test.js
          - test/e2e-api/content/offers.test.js
      lifetime:
        summary: >-
          Re-init replaces published API/manager, but mounted middleware and members collaborators
          retain earlier objects. Each old OffersModule remains reachable through its event
          listeners, so later events update old and new redirect maps. Rows/redemptions persist
          independently; API reads query afresh with no root cache or operation serialization.
          Code-change events remove the old redirect and add the new one; archiving has no
          redirect-removal event. Transaction-scoped uniqueness checks and DB unique name/code/
          coupon indexes differ from concurrent retention-offer policy, which has no unique
          cadence constraint. Sequential HTTP retention tests do not establish concurrency.
        sources:
          - core/server/services/offers/service.js
          - core/server/services/offers/offers-module.js
          - core/server/services/offers/application/offers-api.js
          - core/server/services/offers/offer-bookshelf-repository.js
          - core/server/services/offers/domain/models/offer.js
          - core/server/data/schema/schema.js
          - core/frontend/web/site.js
          - core/server/services/members/api.js
        tests:
          - test/e2e-api/admin/offers.test.js
      configuration:
        summary: >-
          init captures custom-redirect permanent max-age; current offer redirects explicitly
          use permanent false, producing 302 with max-age zero. The subdirectory callback uses
          shared URL helpers per request. Offer rules come from data/value objects rather than
          retained config subtrees: signup requires a tier, retention forbids one, codes slugify,
          and only selected fields can update. Repository filtering allows status/redemption_type
          and maps status to active; availability additionally filters tier/cadence/type/redemptions.
          Unit and HTTP tests cover these policies and DTO boundaries. Real repository tests
          pin status/type mapping, redemption counts and last-redeemed values, not same-instance root
          reconfiguration. Config replacement in tests is not production hot reload.
        sources:
          - core/server/services/offers/service.js
          - core/server/web/shared/dynamic-redirect-manager.js
          - core/server/services/offers/domain/models/offer.js
          - core/server/services/offers/domain/models/offer-code.js
          - core/server/services/offers/application/offers-api.js
          - core/server/services/offers/application/offer-mapper.ts
          - core/server/services/offers/offer-bookshelf-repository.js
          - core/shared/config/validated.ts
        tests:
          - test/unit/server/services/offers/domain/models/offer.test.js
          - test/unit/server/services/offers/application/offers-api.test.js
          - test/e2e-api/admin/offers.test.js
          - test/e2e-api/members/member-offers.test.js
          - test/integration/services/offer-bookshelf-repository.test.js
      resources:
        summary: >-
          Each graph owns redirects and two shared DomainEvents subscriptions, borrowing models
          and database transactions. create/update/list start their own transaction; getOffer
          and ensureOfferForStripeCoupon reuse a supplied transaction. Repository save attaches
          event dispatch to transaction.executionPromise without awaiting it or handling rejection;
          nontransactional save dispatches immediately. Subscriber work, including payment-owned
          Stripe calls and coupon-ID persistence, is not awaited by API success. There is no
          unsubscribe or pending-work drain. Tests with fake transactions do not prove commit/
          rollback delivery; the members redemption case proves a row exists inside its real
          transaction, not offer-event ordering or provider rollback.
        sources:
          - core/server/services/offers/offers-module.js
          - core/server/services/offers/offer-bookshelf-repository.js
          - core/server/services/offers/application/offers-api.js
          - core/server/services/members/members-api/services/payments-service.js
          - core/server/services/members/members-api/repositories/member-repository.js
          - core/server/ghost-server.ts
          - package.json
        tests:
          - test/unit/server/services/offers/application/offers-api.test.js
          - test/e2e-api/members/member-offers.test.js
      failures:
        summary: >-
          Repository model/query failures normally propagate, while domain reconstruction errors
          log/report and yield null, so lists/startup omit malformed offers and reads can appear
          absent. A real repository test pins omission/logging of a signup offer with a missing
          product, not every malformed row or startup/read fallback. Count/last-redemption queries
          run outside that catch. API validation rejects;
          HTTP read/edit translates absent results to 404. Coupon import catches duplicate-key
          save errors, rereads the coupon offer and returns it or throws a logged InternalServerError;
          other save failures escape. Unit fakes pin these branches, not a real database race.
          Redirect callback failures are caught by DomainEvents; failed startup does not undo
          listeners/maps. Partial init, post-commit failures and failed rollback delivery remain
          source-only; successful HTTP create is not proof of coupon provisioning completion.
        sources:
          - core/server/services/offers/service.js
          - core/server/services/offers/offers-module.js
          - core/server/services/offers/offer-bookshelf-repository.js
          - core/server/services/offers/application/offers-api.js
          - core/server/api/endpoints/offers.js
          - core/server/api/endpoints/offers-public.js
          - core/server/services/members/members-api/services/payments-service.js
          - package.json
        tests:
          - test/unit/server/services/offers/application/offers-api.test.js
          - test/e2e-api/admin/offers.test.js
          - test/integration/services/offer-bookshelf-repository.test.js
    unverified: []
    blockers:
      - >-
        Pin root export/pre-init behavior, pending and failed initialization, repeated/concurrent
        init and retained frontend/members consumers. New composition must deliberately preserve
        or change publication timing and old listener/manager ownership, with cleanup evidence.
      - >-
        Add real frontend redirect contracts for initial rows, created/changed codes, archived
        offers, query strings and subdirectories. Shared redirect-helper or API tests do not prove
        offer-event wiring, startup races, or behavior after replacing the published manager.
      - >-
        Cover actual transaction commit/rollback and event delivery, including unhandled rejection
        from the detached executionPromise.then chain and payment coupon failures after commit.
        Define pending DB/provider work ownership before adding shutdown; no root drain exists.
      - >-
        Test concurrent coupon import and retention activation with the real database. Simulated
        duplicate errors and sequential retention assertions do not prove isolation, duplicate
        recovery visibility or one active retention offer per cadence under concurrent writes.
      - >-
        Extend the missing-product list test to other malformed rows, direct reads/startup,
        count-query/reporting errors and consumer fallbacks.
        Keep supplied-transaction reuse separate from operations that always open a transaction,
        and preserve the distinction between durable offer creation and later coupon provisioning.
  permissions:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - permissions/index.js
    notes: >-
      Preserve boot-loaded action definitions, per-check permission loading and model overrides.
      Returned maps and retained checks have different lifetimes; reload, early calls and failures
      still need focused contracts before changing initialization.
    contracts:
      exports:
        summary: >-
          CommonJS exports receiver-independent init, canThis and parseContext. Init returns a
          promise for the actual mutable action map. canThis synchronously builds a fresh chained
          result with nonenumerable, nonwritable action properties and object-type functions;
          invoking a handler returns a promise and may return a model override's result, including
          excludedAttrs. parseContext returns a new normalized object, retaining supplied user,
          key and member references, and integration only when api_key is supplied. Units pin chain methods and selected result/error
          shapes, not descriptors, detached exports or returned-map mutation.
        sources:
          - core/server/services/permissions/index.js
          - core/server/services/permissions/can-this.js
          - core/server/services/permissions/parse-context.js
          - core/server/services/permissions/actions-map-cache.js
          - core/server/models/post.js
        tests:
          - test/unit/server/services/permissions/index.test.js
          - test/unit/server/services/permissions/can-this.test.js
          - test/unit/server/services/permissions/parse-context.test.ts
      construction:
        summary: >-
          Import loads shared models, providers and one module-level empty actions cache without
          querying permissions or constructing a service class. Every init forwards the supplied
          options, or a new empty object, to Permission.findAll and rebuilds the map on fulfillment.
          Action/object pairs are deduplicated; object_id is not part of this map. canThis starts
          user/key loads and builds handlers against a cloned action map and model references at
          check creation. Units use a stubbed Permission query and forged models to assert map
          loading/deduplication; import purity, option identity and provider-query timing are source-only.
        sources:
          - core/server/services/permissions/index.js
          - core/server/services/permissions/actions-map-cache.js
          - core/server/services/permissions/can-this.js
          - core/server/services/permissions/providers.js
          - core/server/models/permission.js
        tests:
          - test/unit/server/services/permissions/index.test.js
          - test/unit/server/services/permissions/can-this.test.js
      consumers:
        summary: >-
          Boot initializes the root. The API permission stage normalizes context, bypasses public
          requests, invokes dynamically selected checks and removes returned excludedAttrs.
          Schedules, ownership transfer, member-field definitions, gift links and audience feedback
          call checks directly. Role serialization retains canThis and suppresses failed assignment
          checks; User.permissible requires the root lazily to avoid a model import cycle and checks
          role changes. Real HTTP tests pin selected token/session role outcomes, persisted user-role
          changes, assignable-role snapshots and gift browse denials. They do not establish every
          model/endpoint override, early caller, serializer failure or retained check after reload.
        sources:
          - core/boot.js
          - core/server/api/endpoints/utils/permissions.js
          - core/server/api/endpoints/schedules.js
          - core/server/api/endpoints/users.js
          - core/server/api/endpoints/member-metafields.ts
          - core/server/api/endpoints/gift-links.ts
          - core/server/services/audience-feedback/audience-feedback-controller.js
          - core/server/api/endpoints/utils/serializers/output/roles.js
          - core/server/models/user.js
        tests:
          - test/e2e-api/admin/api-tokens.test.js
          - test/e2e-api/admin/users.test.js
          - test/e2e-api/admin/roles.test.js
          - test/e2e-api/admin/gift-links.test.ts
      startup:
        summary: >-
          Boot awaits init in its main service Promise.all after database setup, before readiness;
          imports and parseContext need no populated map. canThis throws synchronously when the
          map is empty, including internal requests. An empty successful query therefore resolves
          init but leaves checks unavailable; no explicit ready flag is set. The pre-init unit
          stubs empty() rather than loading a fresh root. Booted HTTP suites establish successful
          composition, not empty data, init rejection, frontend-disabled ordering or the absence
          of authorization calls from other concurrently initializing services.
        sources:
          - core/boot.js
          - core/server/services/permissions/index.js
          - core/server/services/permissions/can-this.js
          - core/server/services/permissions/actions-map-cache.js
        tests:
          - test/unit/server/services/permissions/index.test.js
          - test/e2e-api/admin/api-tokens.test.js
      lifetime:
        summary: >-
          There is no init guard, in-flight sharing, invalidation subscription or stop/reset hook.
          Each successful load replaces the cache; overlapping queries publish in completion order.
          getAll clones it, but init returns its mutable object directly. Existing checks retain
          their handler set and one user/key permissions promise; calling a handler again does not
          reload authorization. New checks load fresh user/key data, while action definitions stay
          unchanged until init. These retention, mutation, concurrent reload and repeated-boot
          contracts are source-only; current units recreate checks against fixture maps.
        sources:
          - core/server/services/permissions/index.js
          - core/server/services/permissions/actions-map-cache.js
          - core/server/services/permissions/can-this.js
          - core/server/services/permissions/providers.js
        tests: []
      configuration:
        summary: >-
          No config/settings/URL values are read by the root; database rows define available chains.
          User providers require active status and merge/deduplicate individual and role permissions
          by action/object/object_id; API-key providers use their single role. Authorization matches
          action/object, with model-specific rules responsible for resource restrictions. Owner
          user roles bypass the generic user-permission check. When both user and key exist, user
          permissions win and model overrides receive apiKey:null, although both providers load.
          parseContext assigns public from key type after user/internal handling and copies member
          without making it nonpublic. Units pin ordinary normalization, inactive users, dedup and
          staff-key precedence; mixed internal/content-key contexts and every model rule are untested.
        sources:
          - core/server/services/permissions/parse-context.js
          - core/server/services/permissions/providers.js
          - core/server/services/permissions/can-this.js
          - core/server/models/role-utils.ts
          - core/server/models/role.js
          - core/server/models/relations/authors.js
          - core/server/models/post.js
        tests:
          - test/unit/server/services/permissions/parse-context.test.ts
          - test/unit/server/services/permissions/providers.test.ts
          - test/unit/server/services/permissions/can-this.test.js
          - test/e2e-api/admin/api-tokens.test.js
      resources:
        summary: >-
          Owns the action map and per-check handlers/promises; models borrow the shared database
          pool. No client, timer, worker, listener, transaction, drain or cleanup registration is
          created here. User and key reads begin independently and have no shared transaction or
          cancellation; a model override can perform further reads. Internal handlers immediately
          resolve without awaiting those already-started provider promises when an internal context
          also contains a user/key. Pending-query shutdown, unused checks and rejection handling in
          that mixed internal path have no focused coverage.
        sources:
          - core/server/services/permissions/can-this.js
          - core/server/services/permissions/providers.js
          - core/server/data/db/connection.ts
          - core/server/ghost-server.ts
          - core/server/models/relations/authors.js
          - core/server/models/user.js
        tests: []
      failures:
        summary: >-
          A rejected Permission query propagates while preserving the previous map; a failure
          during rebuilding can leave an empty/partial replacement. Missing users/keys and inactive
          users reject, as do denied checks; model override errors/results propagate. API support
          rewrites NoPermission messages, preserves Ghost errors and wraps other failures; role
          serialization instead omits roles on any check failure. Provider and canThis units pin
          selected missing/inactive/denied and override errors with fake queries, not DB failures,
          partial rebuild, return-map corruption or recovery after a failed boot/reload.
        sources:
          - core/server/services/permissions/index.js
          - core/server/services/permissions/actions-map-cache.js
          - core/server/services/permissions/providers.js
          - core/server/services/permissions/can-this.js
          - core/server/api/endpoints/utils/permissions.js
          - core/server/api/endpoints/utils/serializers/output/roles.js
        tests:
          - test/unit/server/services/permissions/providers.test.ts
          - test/unit/server/services/permissions/can-this.test.js
    unverified: []
    blockers:
      - >-
        Pin real uninitialized-root behavior, empty query results, init option forwarding, boot
        failure/recovery and authorization ordering against other boot tasks. The current pre-init
        test stubs cache.empty and does not establish a fresh module's state or readiness gate.
      - >-
        Characterize repeated/overlapping init, retained chains, per-check permission snapshots,
        returned-map mutation and partial rebuild errors. Preserve module import-cycle behavior;
        User.permissible deliberately loads permissions only when needed.
      - >-
        Extend real consumer contracts for excludedAttrs, model overrides, direct endpoint calls
        and role serializer failure policy. Existing token/role HTTP tests cover selected routes,
        not all authorization paths or changing roles/keys during a retained check.
      - >-
        Cover failed and unused provider promises, internal contexts also containing user/key,
        malformed/mixed context and pending database shutdown. Internal handlers bypass awaiting
        provider loads already started by canThis; no cancellation or root drain is present.
  post-scheduling:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - post-scheduling/index.ts
    notes: >-
      Preserve constructor event subscriptions, shared adapter identity, signed callback
      generation and boot/key-rotation rebuilding. The publishing callback belongs to the
      separate posts composition; the scheduler graph still lacks cleanup ownership.
    contracts:
      exports:
        summary: >-
          TypeScript default-exports one eagerly constructed PostScheduling instance;
          CommonJS boot reads .default. Its only public operation is receiver-dependent
          async rescheduleAll({previousKey} = {}), resolving undefined after database/key
          lookup and adapter call submission, not after those calls settle. The deep module
          default-exports the constructor; production constructs it only in the root. There
          is no init/reset/stop export. Class tests invoke rescheduleAll directly but do not
          assert root export shape, singleton identity or pending-adapter completion semantics.
        sources:
          - core/server/services/post-scheduling/index.ts
          - core/server/services/post-scheduling/post-scheduling.ts
          - core/boot.js
        tests:
          - test/unit/server/services/post-scheduling/post-scheduling.test.js
      construction:
        summary: >-
          Import captures the Admin API URL, resolves the adapter-manager's cached scheduling
          adapter and creates an ErrorCapturingSchedulingAdapter around it. The constructor
          retains URL/adapter/internal-keys, adds six common-event listeners for scheduled,
          rescheduled and unscheduled posts/pages, then registers itself on the adapter.
          Boot makes a separate error-capture wrapper around the same cached adapter; auth
          retains the underlying adapter for rotation. Constructor does not start it. The
          class unit titled starts the adapter only checks a post.scheduled job's arguments
          with run/execution/network stubbed; it does not assert registration or root identity.
        sources:
          - core/server/services/post-scheduling/index.ts
          - core/server/services/post-scheduling/post-scheduling.ts
          - core/server/services/adapter-manager/adapter-manager.ts
          - core/server/adapters/scheduling/error-capture.ts
          - core/server/api/endpoints/authentication.js
          - core/boot.js
        tests:
          - test/unit/server/services/post-scheduling/post-scheduling.test.js
      consumers:
        summary: >-
          Boot directly rebuilds the root. Post model changes emit the six subscribed event
          names; transactional events are deferred until committed, but their async handlers
          are not awaited. Adapter registration enables auth reset's rebuild with the previous
          key. Jobs call the signed Admin schedules endpoint, which delegates publishing to
          posts/post-scheduling, not this instance. That module reads/edits the appropriate API,
          applies time/status checks and has a process-local in-flight guard. Legacy HTTP
          tests manually call callbacks with automatic pings disabled: posts/pages publish,
          early/missing resources no-op, late unforced requests fail and overlapping requests
          yield one published response and one email row. A deferred-read unit additionally
          pins the overlap no-op while the first publish is pending; neither proves adapter delivery.
        sources:
          - core/boot.js
          - core/server/models/post.js
          - core/server/models/base/plugins/events.js
          - core/server/services/post-scheduling/post-scheduling.ts
          - core/server/services/auth/reset-authentication.ts
          - core/server/api/endpoints/authentication.js
          - core/server/web/api/endpoints/admin/routes.js
          - core/server/api/endpoints/schedules.js
          - core/server/services/posts/post-scheduling.js
        tests:
          - test/legacy/api/admin/schedules.test.js
          - test/unit/server/services/post-scheduling/post-scheduling.test.js
          - test/unit/server/services/auth/reset-authentication.test.ts
      startup:
        summary: >-
          Boot validates adapters before importing this eager root in initServices. It later
          calls the shared adapter's run without awaiting a possible promise, initializes
          dependent services, registers job handlers and awaits jobs.start. After synchronous
          automations init returns, it awaits post rescheduleAll only when rescheduleOnBoot
          is truthy. Rebuilding queries scheduled posts and pages concurrently and then reads
          the scheduler key. Boot harness tests keep jobs.start unresolved and assert neither
          automations nor rescheduling runs, propagate its rejection, and assert opt-out skips
          rescheduling. Modules are fakes, so real adapter readiness/root import ordering and
          outstanding adapter operations are not protected by those assertions.
        sources:
          - core/boot.js
          - core/server/services/post-scheduling/index.ts
          - core/server/services/post-scheduling/post-scheduling.ts
          - core/server/adapters/scheduling/error-capture.ts
        tests:
          - test/unit/boot-email-analytics.test.ts
      lifetime:
        summary: >-
          Module caching preserves the first URL/adapter graph and six listeners. There is
          no listener disposer, rebind or registration removal; constructing another instance
          adds another listener set. Reschedulers remain retained by the shared adapter.
          Database scheduled status is durable; the default adapter's queue, tombstones and
          running flag are process state. Normal rebuild unschedules then schedules using
          bootstrap=true, except adapters declaring strict-true idempotency dedupe skip the
          unschedule. Rotation always unschedules with the previous key and bootstrap=false.
          Class units assert those calls/flags, stable selected job keys and changed keys for
          time/key changes; they do not prove remote completion order, durable dedupe or restart.
        sources:
          - core/server/services/post-scheduling/post-scheduling.ts
          - core/server/adapters/scheduling/scheduling-default.ts
          - core/server/adapters/scheduling/error-capture.ts
          - core/server/services/adapter-manager/adapter-manager.ts
        tests:
          - test/unit/server/services/post-scheduling/post-scheduling.test.js
      configuration:
        summary: >-
          Root captures the URL and resolved adapter at import; later adapter-manager cache
          clearing does not rebind it. Shared URL bases/config are frozen, so repeated facade
          calls and test replacement are not hot reload. Internal keys are read per event or
          rebuild through a retained promise cache, cleared by auth rotation. Jobs use current
          published_at, previous published_at for unscheduling, PUT and oldTime metadata;
          callback URL/time determine the namespaced hash. JWTs start ten minutes before
          publish and normally expire six hours after; sufficiently overdue jobs instead
          expire six hours from signing, so later rebuilds can change their URL/hash even
          without changing the key or publish time. Tests compare selected arguments/hash
          behavior, not JWT boundaries or that overdue case.
        sources:
          - core/server/services/post-scheduling/index.ts
          - core/server/services/post-scheduling/post-scheduling.ts
          - core/server/adapters/scheduling/build-signed-job.ts
          - core/server/adapters/scheduling/utils.ts
          - core/server/adapters/scheduling/get-scheduler-idempotency-key.ts
          - core/server/services/internal-keys/index.ts
          - core/server/lib/auto-filling-map.ts
          - core/server/services/auth/reset-authentication.ts
          - core/shared/url-utils.ts
          - core/shared/config/loader.ts
        tests:
          - test/unit/server/services/post-scheduling/post-scheduling.test.js
          - test/unit/server/adapters/scheduling/get-scheduler-idempotency-key.test.ts
      resources:
        summary: >-
          This root owns subscriptions and its error-capture wrapper, borrowing the shared
          scheduler, models and key cache. The default adapter owns in-memory jobs/tombstones,
          recurring five-minute wakeups, per-job timers/immediates, retry timers and pending
          HTTP calls through shared request/DNS support. It has no stop/drain; neither this
          root nor boot registers scheduler cleanup with GhostServer. Default-adapter units
          use fake timers to assert selected queue/tombstone/ping behavior and a request fake
          for method/force flags and two 503 retries. They do not test root shutdown, network
          completion, persistent adapters or cleanup across same-process boot cycles.
        sources:
          - core/server/services/post-scheduling/post-scheduling.ts
          - core/server/adapters/scheduling/error-capture.ts
          - core/server/adapters/scheduling/scheduling-default.ts
          - core/server/services/adapter-manager/adapter-manager.ts
          - core/server/lib/common/events.js
          - core/boot.js
          - core/server/ghost-server.ts
        tests:
          - test/unit/server/adapters/scheduling/scheduling-default.test.js
      failures:
        summary: >-
          Adapter resolution/registration can fail import, and registration occurs after
          listeners were attached. Event handlers log key/normalization or synchronous raw
          adapter failures; they do not retry. Production error-capture reports synchronous
          throws and rejected scheduling promises without propagating them. Direct rebuild
          query/key/normalization failures reject, possibly after earlier jobs were submitted;
          adapter-wide rotation observes async rescheduler failures as settled results.
          Unschedule/schedule are not awaited, so persistent-adapter completion can reorder.
          Default HTTP requests have five-second timeout/no client retries; only status 503
          schedules up to 30 delayed retries, 404 is ignored and other errors are logged.
          Decorator units assert selected reporting/redaction and rejection handling; they
          do not establish whole-root recovery, and the two-retry unit does not pin exhaustion.
        sources:
          - core/server/services/post-scheduling/index.ts
          - core/server/services/post-scheduling/post-scheduling.ts
          - core/server/adapters/scheduling/error-capture.ts
          - core/server/adapters/scheduling/scheduling-default.ts
          - core/server/adapters/scheduling/README.md
          - core/server/services/auth/reset-authentication.ts
        tests:
          - test/unit/server/adapters/scheduling/error-capture.test.ts
          - test/unit/server/adapters/scheduling/scheduling-default.test.js
    unverified: []
    blockers:
      - >-
        Protect root/default export identity, six listener registrations and adapter registration
        through repeated construction, failed import and stop/reboot. Define ownership of
        listener removal, scheduler timers, pending HTTP work and adapter rebinding; none is
        supplied by the existing root or default adapter.
      - >-
        Cover real post/page schedule, reschedule and unschedule events through commit/rollback
        and overlapping edits, including previous timestamp preservation and key failures.
        The constructor unit drives only post.scheduled; manually called HTTP callbacks do not
        establish queue registration or event completion ordering.
      - >-
        Characterize real adapter readiness and outstanding operations during boot/rotation,
        rejection, shutdown and partial rebuild. Invocation-order assertions do not protect
        remote unschedule/schedule completion order or persistence; root calls intentionally
        return before adapter promises settle.
      - >-
        Protect scheduled callback signing/expiry and recovery for jobs overdue by more than
        six hours. Their generated expiry and URL/hash can change with the clock, which is
        outside the existing same-job key assertions and can affect dedupe or cancellation.
      - >-
        Preserve callback no-op/force/authentication/cache behavior with the separate posts
        owner, and cover publish failure/retry, process restart and cross-process duplicate
        delivery. Current overlap guard is process-local; a single email row in the HTTP test
        does not prove provider delivery exactly once or default-adapter retry of every failure.
  posts:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: c2999f4e13da6360bceced808bb52c4a04b5ad03
    entryPoints:
      - posts/posts-service-instance.js
      - posts/post-scheduling.js
    notes: >-
      Record factory-created caller lifetimes and the separate scheduling module state;
      establish which identity boundaries must survive before choosing shared composition.
      The pilot needs focused construction/readiness and retained-consumer checks, not a
      rewrite of unrelated post business logic.
    contracts:
      exports:
        summary: >-
          There is no directory index. CommonJS posts-service-instance exports a synchronous
          zero-argument factory with PostsService attached for tests. Each result exposes
          browse/read/edit, bulk operations, export, visibility mapping, copying, cache helpers
          and public collaborators including stats and postEmailHandler. Most methods require
          their receiver; generateCopiedPostLocationFromUrl is passed unbound by posts/pages.
          The separate post-scheduling module exports publish and handleCacheInvalidation.
          Units assert selected copy/cache/edit results and handler dependencies; root/factory
          export identity and repeated construction are source-only.
        sources:
          - core/server/services/posts/posts-service-instance.js
          - core/server/services/posts/posts-service.js
          - core/server/services/posts/post-email-handler.js
          - core/server/services/posts/post-scheduling.js
          - core/server/api/endpoints/posts.js
          - core/server/api/endpoints/pages.js
        tests:
          - test/unit/server/services/posts/posts-service.test.js
          - test/unit/server/services/posts/post-email-handler.test.js
      construction:
        summary: >-
          Every factory call creates PostStats, PostsExporter and PostsService, which creates
          PostEmailHandler. It captures email-service.service immediately, shares the models
          object with the handler, and gives the exporter a separate object of captured model
          constructors. PostStats retains the shared DB facade and resolves knex on use. Other
          dependencies are retained URL/settings helpers plus an isSet closure; the latter is
          stored but unused by current PostsService methods. Constructors do no queries or
          subscriptions themselves, although imports acquire shared modules. No guard, init or
          singleton cache exists in the factory. Handler constructor tests assert injected
          model/email identity; no test directly exercises the real factory dependency graph.
        sources:
          - core/server/services/posts/posts-service-instance.js
          - core/server/services/posts/posts-service.js
          - core/server/services/posts/post-email-handler.js
          - core/server/services/posts/posts-exporter.js
          - core/server/services/posts/stats/post-stats.js
        tests:
          - test/unit/server/services/posts/post-email-handler.test.js
      consumers:
        summary: >-
          Posts/pages, public-post browse, admin/public search indexes, site exports and the
          post output mapper each retain a factory result at module evaluation. Their uses
          include edit/email, bulk/copy/cache headers, browse, export and legacy visibility
          conversion; several other endpoint actions bypass this service and use models
          directly. ExplorePingService receives a new result per construction and uses stats.
          Lexical render/validate lazily creates and retains a result, but currently never
          invokes it. The schedules endpoint calls the separate publisher. Search controller
          units replace PostsService.prototype.browsePosts and assert URL-required columns;
          real HTTP tests assert search projections, CSV/copy responses and bulk DB results.
          Newsletter integration and retry HTTP tests exercise the real post/email connection
          with provider or scheduling seams. Atomic-publication integration tests also exercise
          transaction rollback and dispatch after commit. They do not pin factory/caller
          identity timing.
        sources:
          - core/server/api/endpoints/posts.js
          - core/server/api/endpoints/pages.js
          - core/server/api/endpoints/posts-public.js
          - core/server/api/endpoints/search-index.js
          - core/server/api/endpoints/search-index-public.js
          - core/server/api/endpoints/exports.js
          - core/server/api/endpoints/utils/serializers/output/mappers/posts.js
          - core/server/services/explore-ping/index.ts
          - core/server/services/explore-ping/explore-ping-service.ts
          - core/server/lib/lexical.js
          - core/server/api/endpoints/schedules.js
        tests:
          - test/unit/api/endpoints/search-index.test.js
          - test/unit/api/endpoints/search-index-public.test.js
          - test/e2e-api/admin/search-index.test.js
          - test/e2e-api/content/search-index.test.js
          - test/e2e-api/admin/posts.test.js
          - test/e2e-api/admin/posts-bulk.test.js
          - test/integration/services/email-service/batch-sending.test.js
          - test/integration/services/email-service/atomic-publish.test.ts
          - test/e2e-api/admin/email-retry.test.ts
      startup:
        summary: >-
          Boot has no posts initialization call. Factory readiness depends on the operation:
          model/DB reads can work without email, while publication preflight/create/retry needs
          the email implementation captured at construction. API pipeline getters and lazy
          routers defer many caller imports; boot initializes email before mounting/readiness,
          and Explore constructs posts during its later invocation in that service group.
          Direct/early imports and Lexical construction are not guarded against capturing an
          absent email service. Current HTTP tests prove selected normal boot/request paths,
          not initialization order for retained callers or rejection before readiness. A new
          managed root must explicitly coordinate these existing construction sites with boot.
        sources:
          - core/boot.js
          - core/server/services/posts/posts-service-instance.js
          - core/server/services/posts/post-email-handler.js
          - core/server/api/endpoints/index.js
          - core/shared/express.js
          - core/server/web/api/app.js
          - core/server/web/api/endpoints/admin/routes.js
          - core/server/lib/lexical.js
          - core/server/services/explore-ping/index.ts
        tests:
          - test/integration/services/email-service/batch-sending.test.js
          - test/e2e-api/admin/email-retry.test.ts
      lifetime:
        summary: >-
          Factory instances persist as long as callers retain them, with mutable public
          collaborator fields and an independently retained email reference inside the handler.
          Replacing email-service.service does not update either reference; replacing the
          outer PostsService.emailService alone does not update its handler. Production callers
          inspected do not replace these fields; units do replace postEmailHandler. No reset or
          shutdown is exposed. Export state is per invocation. Scheduling has a module-wide
          inFlight Set keyed by resource type/id and a shared no-op object; publish releases
          the key in finally. Its gated unit proves same-key overlap returns no-op while the
          first read is held, then one edit occurs. Error release, independent keys and
          retained-consumer behavior across initialization remain source-only.
        sources:
          - core/server/services/posts/posts-service.js
          - core/server/services/posts/post-email-handler.js
          - core/server/services/posts/posts-service-instance.js
          - core/server/services/posts/posts-exporter.js
          - core/server/services/posts/post-scheduling.js
        tests:
          - test/unit/server/services/posts/posts-service.test.js
          - test/unit/server/services/post-scheduling/post-scheduling.test.js
      configuration:
        summary: >-
          Factory captures helper/model/email objects rather than a config subtree. Export
          awaits newsletter/label/tier reads, then snapshots member, paid-member, tracking and
          feedback settings for that stream; later exports read the retained facades again.
          URL generation calls the shared output helper for each row. Scheduling reads the
          configured minute tolerance at the beginning of each publish attempt, then uses that
          captured value after its API read. PostStats has fixed published/sent filters.
          Export units assert selected column changes after fake settings changes, default
          limit 15, requested limits and order forwarding. This establishes per-call behavior
          with fakes, not config hot reload or dependency rebinding; immutable config rules
          still apply. Real factory capture/config timing lacks a dedicated test.
        sources:
          - core/server/services/posts/posts-service-instance.js
          - core/server/services/posts/posts-exporter.js
          - core/server/services/posts/post-scheduling.js
          - core/server/services/posts/stats/post-stats.js
        tests:
          - test/unit/server/services/posts/posts-exporter.test.js
      resources:
        summary: >-
          The factory graph owns no recurring timer, subscriber or provider client. It borrows
          DB/models, email and URL/settings helpers. Edit creates or borrows a transaction for
          the post and new email, then schedules or retries after commit. A caller-owned
          transaction retains that callback through its executionPromise; this service has no
          pending-callback registry or drain. Bulk operations use local transactions and dispatch
          domain events without waiting for subscribers. Export owns a Readable over an async generator, one metadata
          context and bounded pages of up to 50 rows; the HTTP serializer owns its CSV transform
          and pipeline to the response, while site export owns its enclosing pipeline. Export
          units consume the stream and assert 75 exact IDs across two 50-row queries. This does
          not establish early-close cancellation of an already-running DB query. Scheduling
          owns only the active-key guard, with no timeout/drain; queued timer ownership belongs
          to the separate post-scheduling service/adapter, not this module.
        sources:
          - core/server/services/posts/posts-service.js
          - core/server/services/posts/posts-exporter.js
          - core/server/services/posts/post-scheduling.js
          - core/server/services/posts/stats/post-stats.js
          - core/server/lib/after-commit.ts
          - core/server/api/endpoints/utils/serializers/output/posts.js
          - core/server/api/endpoints/utils/serializers/output/stream-csv-response.ts
          - core/server/api/endpoints/utils/serializers/output/stream-response.ts
          - core/server/api/endpoints/exports.js
        tests:
          - test/unit/server/services/posts/posts-exporter.test.js
          - test/e2e-api/admin/posts.test.js
      failures:
        summary: >-
          editPost awaits preflight, then saves the post and any new newsletter email in one
          transaction. With its own transaction it awaits scheduling/retry after commit,
          serializes and awaits the optional event callback. A caller-owned transaction instead
          registers scheduling/retry after its executionPromise resolves; edit does not wait
          for that commit, and later send errors are logged. Preflight failure prevents edit;
          email-insert failure rolls back publication, but a post-commit failure can reject
          after publication. Handler wraps invalid recipient-filter queries as BadRequest,
          warns without retrying an unknown delivery outcome, and tolerates a lost retry claim
          only when the refreshed email is pending/submitting/submitted. Units assert selected
          arguments, send-after-commit ordering, caller-commit gating and logged send failure.
          Integration tests assert rollback on email-insert failure and an outer transaction
          error, dispatch after caller commit, scheduled-publication retry, one email for two
          overlapping edits, and rejection after a committed post when retry scheduling fails.
          These do not prove delivery completion or every held completion/error boundary;
          rollback without an error is also not covered and the helper treats a resolved
          executionPromise as a commit.
          Bulk methods propagate write failures and dispatch after their awaited local work;
          no whole-operation/subscriber atomicity is implied. Export-context failure rejects
          before returning a stream, later page/mapping failure reaches the stream; invalid
          human-readable filters log and fall back. Scheduling treats missing/non-scheduled/
          early resources as no-op, keeps overdue non-forced publishes as errors and propagates
          other API failures. Legacy real HTTP cases assert publish/no-op/status and concurrent
          one-email outcomes with outbound scheduler/provider mocks; they do not prove every
          transaction rollback, guard-release failure or delivery completion.
        sources:
          - core/server/services/posts/posts-service.js
          - core/server/services/posts/post-email-handler.js
          - core/server/services/posts/posts-exporter.js
          - core/server/services/posts/post-scheduling.js
          - core/server/lib/after-commit.ts
          - core/server/api/endpoints/schedules.js
        tests:
          - test/unit/server/services/posts/posts-service.test.js
          - test/unit/server/services/posts/post-email-handler.test.js
          - test/unit/server/services/posts/posts-exporter.test.js
          - test/integration/services/email-service/atomic-publish.test.ts
          - test/e2e-api/admin/email-retry.test.ts
          - test/legacy/api/admin/schedules.test.js
    unverified: []
    blockers:
      - >-
        Pilot gate: characterize the real factory's fresh identities/shared collaborators and
        immediate email capture, then prove the proposed managed facade remains usable by
        retained endpoint/mapper/Explore/Lexical consumers. Import-time availability and
        call-time readiness must be explicit; current business tests do not pin those boundaries.
      - >-
        Pilot gate: add the smallest boot/consumer assertion that publication reaches the
        initialized email implementation through the retained posts service. Preserve the
        real PostEmailHandler connection and existing DTO, preflight and retry results; a
        prototype-only controller stub would miss a broken facade/dependency reference.
      - >-
        Pilot gate if edit composition changes: hold preflight/email/event-callback completion and
        assert downstream calls/results remain pending, with original failures propagated at
        each boundary. Preserve the distinction between awaited sending after a local commit
        and logged sending failures after a caller commit. Existing units hold the caller's
        commit but replace the handler and do not hold every stage unresolved; reuse the
        atomic-publication integration and existing HTTP/provider-mock coverage.
      - >-
        If migration touches the separate scheduling module, preserve its process-wide guard
        and add failure-release/independent-key checks. Do not accidentally give each factory
        its own guard. Existing overlap unit and HTTP test cover the successful same-key case.
      - >-
        Wider characterization, not a prerequisite for a composition-only pilot: export
        interruption/page failure and transaction/subscriber failure boundaries remain partly
        source-only, and PostStats real query behavior has no dedicated assertion found.
        Preserve their existing owners and behavior unless the migration changes them.
  posts-public:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - posts-public/index.js
    notes: >-
      Preserve optional public response caching, endpoint binding and invalidation identity.
      Normal cold boot has consumer regression coverage; restart, adapter failures and
      asynchronous invalidation remain separate obligations.
    contracts:
      exports:
        summary: >-
          CommonJS index forwards one PostsPublicServiceWrapper. Import exposes init but no
          api until initialization; init is receiver-dependent and resolves undefined. After
          init, api is a mutable object containing cache, including an undefined cache when
          disabled. The root has no query, reset or shutdown method. Units assert enabled and
          disabled api.cache values and endpoint identity, not exact export shape or returns.
        sources:
          - core/server/services/posts-public/index.js
          - core/server/services/posts-public/service.js
          - core/server/api/endpoints/posts-public.js
        tests:
          - test/unit/server/services/public-response-caches.test.ts
      construction:
        summary: >-
          Import constructs the wrapper only. First init requires the shared adapter manager,
          config facade and common event bus; a truthy postsPublicCache flag obtains
          cache:postsPublic and registers its reset listener before publishing api. The async
          method has no await, so this construction/publication runs synchronously. The manager
          caches adapters by requested name and class. No other production root construction
          or deep consumer was found. The endpoint separately constructs a PostsService via
          posts-service-instance; that is a posts composition, not this root's cache. Units
          inject the adapter and assert its exact name, identity and absence when disabled.
        sources:
          - core/server/services/posts-public/index.js
          - core/server/services/posts-public/service.js
          - core/server/services/adapter-manager/index.ts
          - core/server/services/adapter-manager/adapter-manager.ts
          - core/server/api/endpoints/posts-public.js
          - core/server/services/posts/posts-service-instance.js
        tests:
          - test/unit/server/services/public-response-caches.test.ts
      consumers:
        summary: >-
          Boot initializes the root. Posts browse/read capture api.cache at endpoint module
          evaluation; the shared API pipeline preserves that adapter identity and caches its
          controller wrapper. Content routes, frontend data/entry lookup, get/collection and
          prev_post/next_post helpers, and llms all reach these endpoint methods. Pages have
          no response cache. Browse delegates to a separately retained PostsService; read
          restricts identifiers, fetches a Post and applies gift access before serialization.
          Binding units check both methods with caching enabled and disabled. Isolated HTTP
          tests prove repeated MemoryCache responses avoid model calls, fields changes miss,
          and explicit site.changed refreshes; they do not prove every frontend consumer or
          ordinary Admin mutations emit invalidation. Other Content tests assert selected
          hidden-selector rejection/ignoring and gated responses without enabling this cache.
        sources:
          - core/boot.js
          - core/server/api/endpoints/index.js
          - core/server/api/endpoints/posts-public.js
          - core/server/api/endpoints/pages-public.js
          - core/server/web/api/endpoints/content/routes.js
          - core/frontend/services/proxy.js
          - core/frontend/services/routing/config.ts
          - core/frontend/services/data/fetch-data.js
          - core/frontend/services/data/entry-lookup.js
          - core/frontend/helpers/get.js
          - core/frontend/helpers/collection.js
          - core/frontend/helpers/prev_post.js
          - core/frontend/services/llms/service.js
          - core/server/web/parent/middleware/emit-events.js
        tests:
          - test/unit/server/services/public-response-caches.test.ts
          - test/e2e-server/public-response-caches.isolated.test.ts
          - test/e2e-api/content/posts.test.js
          - test/e2e-api/content/gift-links.test.ts
      startup:
        summary: >-
          Boot validates adapters and prepares models/config before calling init in its awaited
          service group, before mounting the full app. Content router construction is lazy;
          endpoint getters normally load the controller after initialization. The isolated
          HTTP suite exercises a cold boot with both cache flags enabled. Source-only: loading
          the endpoint too early captures undefined permanently for that descriptor/pipeline;
          later init cannot repair it. The root does not initialize on a request, await cache
          readiness or register cleanup. No test injects root construction failure or a later
          boot failure after this listener has been installed.
        sources:
          - core/boot.js
          - core/server/services/posts-public/service.js
          - core/server/services/adapter-manager/adapter-manager.ts
          - core/server/api/endpoints/index.js
          - core/server/api/endpoints/posts-public.js
          - core/server/web/api/app.js
          - core/server/web/api/endpoints/content/app.js
          - core/server/web/api/endpoints/content/routes.js
          - core/shared/express.js
        tests:
          - test/e2e-server/public-response-caches.isolated.test.ts
      lifetime:
        summary: >-
          Any truthy api short-circuits later init, including disabled initialization. The same
          module retains its API, adapter, entries and listener; there is no listener disposer
          or supported API reset. Clearing the manager's cache does not update retained root,
          listener or endpoint references. MemoryCache stores/returns response references and
          replaces its backing object on reset. Units assert repeat enabled init preserves
          cache identity and entries with one listener, and invoke only the newly installed
          reset callback. Isolated HTTP tests additionally emit on the real bus. Same-module
          stop/restart, forced re-init, reference mutation and overlapping reads/reset are
          source-only risks, not covered by those assertions.
        sources:
          - core/server/services/posts-public/service.js
          - core/server/api/endpoints/posts-public.js
          - core/server/services/adapter-manager/adapter-manager.ts
          - core/server/adapters/cache/MemoryCache.js
          - core/server/lib/common/events.js
          - core/server/ghost-server.ts
        tests:
          - test/unit/server/services/public-response-caches.test.ts
          - test/e2e-server/public-response-caches.isolated.test.ts
      configuration:
        summary: >-
          The root reads hostSettings:postsPublicCache:enabled only on first init, without a
          feature schema; missing/falsy disables. The manager resolves cache feature options
          and defaults to MemoryCache, retaining a constructed adapter for the same name/class.
          Config is frozen; test overrides do not establish hot reload. Request key data reads
          current options, member UUID, a free-status boolean and sorted tier slugs, plus read identifiers and resolved
          gift post ID. Key generation precedes cache lookup, so gift resolution still runs on
          a hit. Member-isolation units use real key/pipeline/gating code with an injected cache,
          fake query and skipped validation/permissions; they assert UUID separation, changed
          status/tiers and rejection of legacy entitlement-only cache entries. Gift units assert
          omission for absent gifts, unresolved-versus-absent separation and equal keys for tokens
          resolving to the same post, with stubbed resolution rather than cached revocation. Exact option normalization is source-only beyond the HTTP
          fields-variant assertion.
        sources:
          - core/server/services/posts-public/service.js
          - core/server/services/adapter-manager/utils.ts
          - core/server/services/adapter-manager/adapter-manager.ts
          - core/shared/config/defaults.json
          - core/shared/config/SCHEMA.md
          - core/server/api/endpoints/posts-public.js
          - core/server/api/endpoints/utils/public-cache-keys.ts
          - core/server/api/endpoints/utils/gift-link-access.ts
        tests:
          - test/unit/server/services/public-response-caches.test.ts
          - test/unit/api/endpoints/utils/public-cache-keys.test.ts
          - test/unit/api/endpoints/utils/gift-link-access.test.ts
          - test/e2e-server/public-response-caches.isolated.test.ts
      resources:
        summary: >-
          The root owns an unremoved common-event listener and borrows a manager-cached adapter.
          Default MemoryCache has no TTL, bound, timer or I/O. Optional memory-ttl owns a TTLCache
          with unref'd expiry timers, cleared by reset; Redis can share a process store/client,
          attaches an error listener and owns lookup timers, coalesced reads and background
          refresh tracking. Its timed-out lookup continues. Neither root nor adapter manager
          provides a cache shutdown/drain; Redis reset rotates a namespace rather than closing
          its client. Unit adapter tests assert memory clear/read/keys and selected fake-store
          Redis timeout, refresh and reset results; these do not cover a real posts endpoint
          using those adapters, resource disposal or completion at server shutdown.
        sources:
          - core/server/services/posts-public/service.js
          - core/server/services/adapter-manager/adapter-manager.ts
          - core/server/adapters/cache/MemoryCache.js
          - core/server/adapters/cache/AdapterCacheMemoryTTL.js
          - core/server/adapters/cache/memory-ttl.js
          - core/server/adapters/cache/Redis.js
          - core/server/adapters/lib/redis/AdapterCacheRedis.js
          - core/server/adapters/lib/redis/redis-store-factory.js
          - core/server/ghost-server.ts
        tests:
          - test/unit/server/adapters/cache/adapter-cache-memory-ttl.test.js
          - test/unit/server/adapters/lib/redis/adapter-cache-redis.test.js
      failures:
        summary: >-
          Source-only root behavior: dependency/adapter/listener-registration errors reject
          init before api publication; no rollback disposes a constructed adapter. A synchronous
          reset error escapes event emission and an async reset rejection is not observed by
          the listener. The pipeline propagates key/query/cache errors unless the adapter
          swallows them; a truthy cache hit bypasses query/serialization/permission stages.
          Redis logs/swallowing differs by operation: loader rejection can return undefined,
          causing the pipeline to run its response loader again; reset errors are logged and
          swallowed. Fake-store adapter units assert selected failures, not this combined
          request path. Content HTTP asserts 400 for missing public identifiers; gift units
          assert missing-key IncorrectUsage and mismatched-post 403 with no member mutation.
          Root failure/retry, asynchronous invalidation and stale in-flight writes are untested.
        sources:
          - core/server/services/posts-public/service.js
          - core/server/services/adapter-manager/adapter-manager.ts
          - core/server/api/endpoints/posts-public.js
          - core/server/api/endpoints/utils/gift-link-access.ts
          - core/server/adapters/lib/redis/AdapterCacheRedis.js
          - core/server/lib/common/events.js
          - core/boot.js
        tests:
          - test/unit/server/adapters/lib/redis/adapter-cache-redis.test.js
          - test/unit/api/endpoints/utils/gift-link-access.test.ts
          - test/e2e-api/content/posts.test.js
    unverified: []
    blockers:
      - >-
        Keep root-to-controller binding and pipeline adapter identity protected together.
        Existing cold-boot HTTP coverage uses MemoryCache and explicit site.changed, not a
        real Admin mutation, early endpoint import, same-module restart or alternative adapter.
      - >-
        Establish lifecycle ownership before adding reset/re-init: disabled first init is
        permanent, listeners are never removed, manager cache clearing leaves retained users,
        and no root cleanup runs after boot failure or shutdown.
      - >-
        Characterize asynchronous invalidation, concurrent fill/reset and background refresh.
        The event callback does not await reset; an old in-flight MemoryCache response can be
        set after reset, and Redis background refresh can publish through a newer prefix.
        These are source-established race opportunities, not reproduced delivery failures.
      - >-
        Add contract coverage for adapter construction errors, synchronous/async reset failures,
        query/cache failures and Redis's swallowed-loader retry through the real pipeline.
        Bound and drain optional adapter resources without closing a client shared by others.
      - >-
        Keep member/gift cache-key coverage distinct from real cached authorization flows.
        UUID/status/tier tests inject the cache/query and skip validation/permissions; gift-key
        tests stub resolution. Cached revocation, all key dimensions and frontend mutation of
        shared response references have no direct assertions in the inspected cache cohort.
  recommendations:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - recommendations/index.js
    notes: >-
      Preserve optional composition, database repositories, mentions integration and HTTP
      callers. Record detached startup, settings writes and notification work before changing
      lifecycle ownership; these source risks are not evidence of reproduced failures.
    contracts:
      exports:
        summary: >-
