          that the emitter does not await. There is no unsubscribe, mapper removal,
          producer drain or request cancellation on this root. Jobs own queued execution;
          shared models own database access and request-external owns keep-alive agents.
          oEmbed retains provider/storage dependencies; mention fetches skip image
          persistence but can probe favicon URLs, including a stream destroyed after
          its first chunk. Repository save awaits the model write then dispatches entity
          events without awaiting subscribers or clearing events. DomainEvents catches
          subscriber errors; its normal allSettled tracking is enabled only in tests.
          Registration units assert queue options; HTTP sender tests explicitly wrap
          raw listeners and job completion. These are test observation/drain mechanisms,
          not evidence of production shutdown or provider resource disposal.
        sources:
