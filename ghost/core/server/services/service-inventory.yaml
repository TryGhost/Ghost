    contracts:
      exports:
        summary: >-
          CommonJS exports one mutable NewslettersService instance. Its unbound async
          read/edit/add/verifyPropertyUpdate methods return models, browse returns the
          model's page result, and getAll returns a JSON array. Constructor dependencies,
          ghostMailer and magicLinkService remain accessible properties; internal methods
          are only documented private. The index test checks four truthy API properties,
          not their type, complete surface or identity. Class tests pin read/model option
          forwarding, add/edit metadata and verification-property allowlisting with fakes.
