          - test/e2e-api/admin/recommendations.test.js
          - test/e2e-server/services/recommendation-emails.test.js
      consumers:
        summary: >-
          Boot initializes the root. Admin outgoing/incoming and Content/Members endpoints
          retain its wrapper and read controller fields per call; controllers retain services.
          The theme helper calls the public API, and the frontend serves the generated well-known
          file. The mentions mapper strips its suffix; verified matching MentionCreatedEvents
          call the wrapper's current incoming service. Booted HTTP tests assert selected CRUD
          responses, duplicate rejection, count relations, Content pagination/include exclusion,
          and persisted member/anonymous tracking with authentication separation. Booted email
          tests save real mentions and assert two rendered notifications, recommendation-back
          wording and exclusion of ordinary/unverified mentions, using mocked mail transport and
          test-only event settlement. Helper tests replace the API; incoming browse units replace
          its service. Neither proves the real incoming HTTP path or well-known publication timing.
        sources:
          - core/boot.js
          - core/server/api/endpoints/recommendations.js
          - core/server/api/endpoints/recommendations-public.js
          - core/server/api/endpoints/incoming-recommendations.js
          - core/server/api/endpoints/index.js
          - core/server/web/api/endpoints/admin/routes.js
          - core/server/web/api/endpoints/content/routes.js
          - core/server/web/members/app.js
          - core/frontend/helpers/recommendations.js
          - core/frontend/web/routers/serve-public-file.js
          - core/server/services/recommendations/recommendation-service-wrapper.js
          - core/server/services/mentions/bookshelf-mention-repository.js
        tests:
          - test/e2e-api/admin/recommendations.test.js
          - test/e2e-api/content/recommendations.test.js
          - test/e2e-api/members/recommendations.test.js
          - test/e2e-server/services/recommendation-emails.test.js
          - test/unit/frontend/helpers/recommendations.test.ts
          - test/unit/server/services/recommendations/service/incoming-recommendation-controller.test.ts
      startup:
        summary: >-
          Boot invokes mentions/staff earlier in the same Promise.all group; mentions publishes
          its API/sender synchronously. Recommendations throws if those dependencies are absent,
          publishes its graph, starts both async initializers without awaiting them, then installs
          mapper/subscriber before returning. Outgoing init lists rows and writes the well-known
          file before checking recommendations_enabled and scheduling metadata refresh. Incoming
          init schedules revalidation. Direct inner-service units assert well-known invocation,
          refresh invocation after advancing a day, outgoing production/development enablement
          and test/disabled suppression. They do not establish exact jitter, wrapper readiness,
          completion before HTTP readiness or behavior when startup file/DB work fails.
        sources:
          - core/boot.js
          - core/server/services/mentions/service.js
          - core/server/services/recommendations/recommendation-service-wrapper.js
          - core/server/services/recommendations/service/recommendation-service.ts
          - core/server/services/recommendations/service/incoming-recommendation-service.ts
        tests:
          - test/unit/server/services/recommendations/service/recommendation-service.test.ts
          - test/unit/server/services/recommendations/service/incoming-recommendation-service.test.ts
      lifetime:
        summary: >-
          The repository is published before most construction and is the only initialized
          guard; later failure can leave an incomplete graph that repeated init skips. Successful
          repeated init retains objects, mapper and subscription. Disabling later only makes
          init return; it does not remove existing fields or stop work. Controllers, incoming
          service and outgoing service retain their collaborators, while the event callback
          rereads the wrapper's incoming service and the renderer rereads staff.api. Inner init
          methods have no repeat guard, and their timers are not retained. These lifecycle and
          dependency-replacement contracts are source-only; no root repeat/failure/reset tests
          were found. There is no exposed reset or shutdown method.
        sources:
          - core/server/services/recommendations/recommendation-service-wrapper.js
          - core/server/services/recommendations/service/recommendation-service.ts
          - core/server/services/recommendations/service/incoming-recommendation-service.ts
          - core/server/services/recommendations/service/incoming-recommendation-email-renderer.ts
          - core/server/services/mentions/webmention-metadata.js
        tests: []
      configuration:
        summary: >-
          Only explicit false for services:recommendations:enabled prevents root construction.
          Public-directory path, model/service references and both mail transports are captured;
          settings BREAD reads current cache synchronously, URL generation uses retained helpers,
          and notification recipients/settings/sender are read during work. Outgoing refresh is
          enabled by setting string true outside test environments after a 2–7 minute delay;
          incoming refresh excludes test and development with a 15–315 second delay. Metadata
          requests default to a 5-second request timeout and retry limit 3, then fall back to
          oEmbed mention fetching without forwarding those options. Nock metadata units use raw
          got, not production request-external. Mail integration asserts recommendation sender
          addresses under selected config overrides with mocked sendMail; it does not prove
          transport reconfiguration. Immutable config replacement does not update captured values.
        sources:
          - core/server/services/recommendations/recommendation-service-wrapper.js
          - core/server/services/recommendations/recommendation-enabler-service.js
          - core/server/services/recommendations/service/recommendation-service.ts
          - core/server/services/recommendations/service/incoming-recommendation-service.ts
          - core/server/services/recommendations/service/recommendation-metadata-service.ts
          - core/server/services/recommendations/service/well-known-service.ts
          - core/server/services/settings/settings-bread-service.js
          - core/server/data/schema/default-settings/default-settings.json
          - core/server/lib/mail/ghost-mailer.js
          - core/server/lib/request-external.js
        tests:
          - test/unit/server/services/recommendations/service/recommendation-service.test.ts
          - test/unit/server/services/recommendations/service/recommendation-metadata-service.test.ts
          - test/integration/services/q-email-addresses.test.js
      resources:
        summary: >-
          Root-owned startup timers, a DomainEvents subscription, a mentions mapper and two
          mail transports have no wrapper cleanup/drain. Repositories borrow shared models/DB;
          HTTP requests borrow shared keep-alive agents and oEmbed, whose mention fetch skips
          thumbnail storage. Outgoing webmentions run detached from mutations; incoming emails
          await recipients sequentially inside an event handler that the publisher does not await.
          WellknownService creates directories and overwrites one file without serialization or
          atomic rename. Its unit asserts actual JSON file content, not concurrent writes. Email
          tests use DomainEvents.allSettled, whose tracking is test-only. Helper timeout tests
          prove fallback HTML/logging with an injected API, not cancellation of underlying work.
          No test establishes production shutdown settlement or transport/socket disposal.
        sources:
          - core/server/services/recommendations/recommendation-service-wrapper.js
          - core/server/services/recommendations/service/recommendation-service.ts
          - core/server/services/recommendations/service/incoming-recommendation-service.ts
          - core/server/services/recommendations/service/well-known-service.ts
          - core/server/services/settings/settings-bread-service.js
          - core/server/services/mentions/webmention-metadata.js
          - core/server/services/mentions/bookshelf-mention-repository.js
          - core/server/services/mentions/mention-sending-service.js
          - core/server/services/oembed/oembed-service.js
          - core/server/lib/mail/ghost-mailer.js
          - core/server/lib/request-external.js
          - core/frontend/helpers/recommendations.js
          - package.json
        tests:
          - test/unit/server/services/recommendations/service/well-known-service.test.ts
          - test/unit/frontend/helpers/recommendations.test.ts
          - test/e2e-server/services/recommendation-emails.test.js
      failures:
        summary: >-
          Synchronous composition errors reach boot; detached inner-init/timer failures are
          logged. CRUD has no transaction spanning DB writes, well-known output, settings and
          mentions, so a later rejection can follow persistence. Enabler setSetting drops the
          BREAD edit promise; awaiting it does not await persistence or propagate its rejection.
          Existing-recommendation check starts metadata refresh without awaiting it before save.
          Other metadata failures log/fall back; malformed model mapping logs/reports then omits
          the row. Incoming conversion failure omits a recommendation; recipient/render/send
          rejection stops that handler, whose DomainEvents boundary logs it. Units assert selected
          fallback values, mapping failure/null and non-propagation of a rejected mention sender
          using fakes; timer rejection cases only assert invocation. They do not prove rollback,
          ordered persistence, notification retry or recovery from partial root construction.
        sources:
          - core/server/services/recommendations/recommendation-service-wrapper.js
          - core/server/services/recommendations/recommendation-enabler-service.js
          - core/server/services/recommendations/service/recommendation-service.ts
          - core/server/services/recommendations/service/incoming-recommendation-service.ts
          - core/server/services/recommendations/service/recommendation-metadata-service.ts
          - core/server/services/recommendations/service/bookshelf-repository.ts
          - core/server/services/recommendations/service/bookshelf-recommendation-repository.ts
          - core/server/services/settings/settings-bread-service.js
          - package.json
        tests:
          - test/unit/server/services/recommendations/service/recommendation-service.test.ts
          - test/unit/server/services/recommendations/service/incoming-recommendation-service.test.ts
          - test/unit/server/services/recommendations/service/recommendation-metadata-service.test.ts
          - test/unit/server/services/recommendations/service/bookshelf-recommendation-repository.test.ts
          - test/e2e-api/admin/recommendations.test.js
    unverified: []
    blockers:
      - >-
        Characterize root identity, first disabled initialization, dependency absence and failure
        after repository publication. Boot does not await initial DB/file work; later init skips
        partial graphs. Existing HTTP success does not establish wrapper readiness or retry.
      - >-
        Account for timers, mapper/listener retention and both mail transports when changing
        lifecycle ownership. No teardown, cancellation or production event drain is exposed;
        retained controllers/services can keep old dependencies after another root is replaced.
      - >-
        Preserve the enabler's synchronous settings read boundary and explicitly characterize
        its dropped edit promise. Current setting tests use an in-memory synchronous replacement;
        successful mutation responses do not prove settings persistence completed before return.
      - >-
        Cover held metadata/settings/file operations at the boundary being migrated. Existing
        checkRecommendation tests use immediately settled metadata and shared in-memory entities,
        so they do not expose its unawaited refresh or partial DB/file/settings side effects.
      - >-
        Real incoming browse, well-known publication readiness, live disable and captured config
        replacement lack targeted coverage. The helper test titled for a disabled setting actually
        sets it true; metadata units inject raw got and do not establish production retries,
        DNS guards, shared socket ownership or timeout completion.
  remote-flags:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - remote-flags/index.ts
    notes: >-
      Preserve config-gated background polling, stable rollout buckets and labs precedence.
      Late startup, timer bounds and writes from stopped instances remain explicit blockers.
    contracts:
      exports:
        summary: >-
          Named TypeScript exports are synchronous init(config), stop and getInstance; init
          and getInstance return the current RemoteFlagsService or null. The deep implementation
          exports a class with public configuration/state and start, stop and refresh methods;
          resolve.ts separately exports the pure resolver and bucketFor helper.
        sources:
          - core/server/services/remote-flags/index.ts
          - core/server/services/remote-flags/remote-flags-service.ts
          - core/server/services/remote-flags/resolve.ts
        tests:
          - test/unit/server/services/remote-flags/index.test.js
          - test/unit/server/services/remote-flags/resolve.test.js
      construction:
        summary: >-
          Import starts with a null instance but loads the shared request helper and override
          store even when disabled. First enabled init with a parseable URL constructs the
          service, assigns it, starts an immediate refresh without awaiting it and returns it.
          Later init returns the instance before reading config. The root is the only runtime
          construction path found; implementation tests construct the class directly.
        sources:
          - core/server/services/remote-flags/index.ts
          - core/server/services/remote-flags/remote-flags-service.ts
        tests:
          - test/unit/server/services/remote-flags/index.test.js
      consumers:
        summary: >-
          Boot is the only runtime root caller; no production stop/getInstance or deep helper
          caller was found. Accepted manifests replace the shared override store, whose runtime
          reader is labs. Effective precedence is local config over remote over GA over DB,
          with members recomputed afterwards. Labs gates, settings/public-config responses,
          theme validation and template options consume those effective values without
          importing the poller. Tests prove resolver/store/labs behavior, not those HTTP paths.
        sources:
          - core/boot.js
          - core/server/services/remote-flags/index.ts
          - core/shared/labs-flag-overrides.ts
          - core/shared/labs.js
          - core/server/services/settings/settings-bread-service.js
          - core/server/api/endpoints/settings-public.js
          - core/server/api/endpoints/utils/public-config/config.js
          - core/server/services/themes/validate.js
          - core/frontend/services/theme-engine/middleware/update-global-template-options.js
        tests:
          - test/unit/server/services/remote-flags/index.test.js
          - test/unit/shared/labs.test.js
          - test/unit/shared/labs-flag-overrides.test.ts
      startup:
        summary: >-
          Boot calls init late in detached background initialization, after readiness and
          settings setup; test environments skip this phase. An earlier uncaught background
          failure, including activitypub.init rejection, prevents the call. No startup path
          waits for a remote manifest before using flags. The root itself has no environment
          gate and works without a site UUID, applying full overrides while skipping ramps.
          The pending-refresh root test establishes nonblocking init, not boot readiness.
        sources:
          - core/boot.js
          - core/server/services/remote-flags/index.ts
          - core/server/services/remote-flags/resolve.ts
        tests:
          - test/unit/server/services/remote-flags/index.test.js
          - test/unit/server/services/remote-flags/resolve.test.js
      lifetime:
        summary: >-
          One loaded root retains the instance until stop clears it; disabling config does
          not stop it. Stop keeps applied overrides, while a new init resets ETag/change state
          and captures new config. Same-instance start is guarded; overlapping refresh calls
          skip the extra fetch and return immediately rather than join pending completion.
          Direct refresh remains callable after stop, and an old in-flight fetch can overwrite
          a replacement instance's results. The shared store copies replacements and reads.
        sources:
          - core/server/services/remote-flags/index.ts
          - core/server/services/remote-flags/remote-flags-service.ts
          - core/shared/labs-flag-overrides.ts
        tests:
          - test/unit/server/services/remote-flags/index.test.js
          - test/unit/server/services/remote-flags/remote-flags-service.test.js
          - test/unit/shared/labs-flag-overrides.test.ts
      configuration:
        summary: >-
          Enabled must be exactly true; URL, site UUID and poll interval are captured at init.
          Finite numeric intervals of at least 60 seconds are accepted with no upper bound;
          invalid supplied intervals warn and use five minutes. The class adds up to one
          minute of jitter and does not enforce the root's interval validation. Resolution
          accepts arbitrary safe flag names, skips malformed entries, clamps percent and uses
          stable MD5 flag/site buckets for partial ramps. Missing, empty or non-string site identifiers skip ramps only; any other string
          is bucketed. Invalid top-level JSON values resolve to an empty map, replacing old overrides.
        sources:
          - core/server/services/remote-flags/index.ts
          - core/server/services/remote-flags/remote-flags-service.ts
          - core/server/services/remote-flags/resolve.ts
          - core/shared/config/defaults.json
        tests:
          - test/unit/server/services/remote-flags/index.test.js
          - test/unit/server/services/remote-flags/resolve.test.js
      resources:
        summary: >-
          Start refreshes immediately and schedules an unref'ed timeout after completion;
          each timeout refreshes then schedules the next. Stop clears the timer and prevents
          rescheduling, but neither cancels nor awaits requests. GETs use a ten-second timeout,
          no redirects/retries and nonthrowing HTTP statuses through the shared request helper,
          which owns DNS/cache maintenance resources. No database connection or subscription
          is acquired, and boot registers no cleanup. Tests cover settled scheduling with fake
          timers, not in-flight stop or real transport disposal.
        sources:
          - core/server/services/remote-flags/remote-flags-service.ts
          - core/server/services/remote-flags/index.ts
          - core/boot.js
          - core/server/ghost-server.ts
          - package.json
        tests:
          - test/unit/server/services/remote-flags/remote-flags-service.test.js
      failures:
        summary: >-
          Network failures, bad statuses and invalid JSON warn and retain prior overrides;
          304 neither reapplies nor logs, while 404 clears overrides and ETag. Accepted responses
          reapply each time but log only changed resolved maps; a 2xx ETag commits after apply
          succeeds. Apply failure is caught without rollback of any already-written state.
          Root config failures can reject detached background startup. Logger failures can
          reject refresh; scheduler failures reject start or the async timeout callback. Root
          init and timers do not observe these promises, allowing unhandled rejections with
          the instance retained and polling stopped. Normal fetch/apply failures are covered with
          fake requests; these exceptional lifecycle paths are not.
        sources:
          - core/server/services/remote-flags/index.ts
          - core/server/services/remote-flags/remote-flags-service.ts
          - core/boot.js
        tests:
          - test/unit/server/services/remote-flags/index.test.js
          - test/unit/server/services/remote-flags/remote-flags-service.test.js
    unverified: []
    blockers:
      - >-
        Define cleanup and in-flight ownership. Stop returns before pending refresh completes,
        and an old instance can replace newer overrides after stop/re-init. Test this race,
        persistence of stale state through replacement-instance 304 responses, completion
        semantics for overlapping refresh/start calls, and real server shutdown;
        existing fake-timer tests only stop after a settled poll.
      - >-
        Bound the configured interval plus jitter to Node's timer range. Current validation
        accepts delays above 2147483647ms, which Node reduces to 1ms, defeating the minimum
        polling interval. Existing tests cover the lower floor, not overflow or jitter bounds.
      - >-
        Pin background boot ordering and failure behavior, including earlier activitypub
        failure and flag consumers before the first manifest arrives. Root tests mostly stub
        start; the real-start test stubs refresh. No current test connects boot, the real
        request helper and the shared store or verifies cleanup registration.
      - >-
        Add real-client contracts for timeout/no retries/no redirects, parseable but unsupported
        URLs and request disposal. Cover logger/scheduler failure and resulting retained state.
        The no-ETag test never seeds a previous ETag; add an actual old-tag-to-no-tag transition,
        404/apply failure and malformed-manifest replacement before relying on those contracts.
  route-settings:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - route-settings/index.js
    notes: >-
      Preserve separate storage configuration and router start, verbatim YAML round trips,
      live upload reload and adapters' independent parser imports. Restart, concurrent updates
      and storage/client cleanup remain unresolved migration obligations.
    contracts:
      exports:
        summary: >-
          CommonJS exports init, an eager service getter, a loadRouteSettings getter and api
          upload/download getters. Each method getter creates a fresh function bound to the
          same service; service methods otherwise require their receiver. Init/start/upload
          resolve undefined; load returns the parsed model and download returns yamlSource.
          Deep exports include DynamicRoutingService, YAML parsing, domain parsing/serialization
          and validation helpers. Parser tests pin domain shapes, ordering, coercions and
          round trips; no focused assertion pins the root getters or their binding/identity.
        sources:
          - core/server/services/route-settings/index.js
          - core/server/services/route-settings/dynamic-routing-service.js
          - core/server/services/route-settings/yaml-parser.js
          - core/server/services/route-settings/route-settings-parser.ts
          - core/server/services/route-settings/validation-errors.ts
        tests:
          - test/unit/server/services/route-settings/dynamic-routing-service.test.ts
          - test/unit/server/services/route-settings/route-settings-parser.test.ts
          - test/unit/server/services/route-settings/validate-route-settings.test.ts
      construction:
        summary: >-
          Import constructs one DynamicRoutingService with null store/routerManager/urlService.
          Async init has no await or guard: each call gets the adapter-manager route-settings
          adapter and synchronously configures that service. The adapter manager caches by
          name and selected class; FileStore captures paths, S3RouteSettingsStore captures
          options and constructs an S3Client unless injected. No separate production
          DynamicRoutingService construction was found. Both adapters import parsers directly
          without loading the root. Wiring tests assert selected adapter type/defaults and
          bad configuration; service tests construct the deep class, not the root.
        sources:
          - core/server/services/route-settings/index.js
          - core/server/services/route-settings/dynamic-routing-service.js
          - core/server/services/adapter-manager/adapter-manager.ts
          - core/server/services/adapter-manager/base-classes.ts
          - core/server/adapters/route-settings/FileStore.ts
          - core/server/adapters/route-settings/S3RouteSettingsStore.ts
        tests:
          - test/unit/server/services/adapter-manager/route-settings-wiring.test.ts
          - test/unit/server/services/route-settings/dynamic-routing-service.test.ts
          - test/integration/services/route-settings/dynamic-routing-service.test.ts
      consumers:
        summary: >-
          Boot calls root init and later service.start. Admin settings retains the root and
          reads api getters per upload/download; upload reads the HTTP temporary file before
          delegating. Exports retains the root through an exportRoutesYaml callback. Upload
          passes the implementation to bridge.reloadFrontend, which reads it before replacing
          frontend routing and restarting apps. RouterManager consumes the domain arrays/map
          and registers URL-service routes; adapters independently consume parser helpers.
          Admin file tests assert statuses/headers, not downloaded YAML bytes. Export HTTP
          tests assert routes.yaml inclusion and re-upload acceptance. Custom frontend tests
          pin changed post/RSS/taxonomy routes; comments tests exercise HTTP upload followed
          by page URL serialization, not all new collection routes.
        sources:
          - core/boot.js
          - core/server/api/endpoints/settings.js
          - core/server/api/endpoints/exports.js
          - core/server/web/api/endpoints/admin/routes.js
          - core/bridge.js
          - core/frontend/web/site.js
          - core/frontend/web/routes.js
          - core/frontend/services/routing/router-manager.js
          - core/server/adapters/route-settings/FileStore.ts
          - core/server/adapters/route-settings/S3RouteSettingsStore.ts
        tests:
          - test/e2e-api/admin/settings-files.test.js
          - test/e2e-api/admin/exports-download.test.js
          - test/e2e-frontend/custom-routes.test.js
          - test/e2e-api/members-comments/comments-lazy-url-parity.test.js
          - test/unit/frontend/services/routing/router-manager.test.js
      startup:
        summary: >-
          Boot validates adapters in initCore, configures route settings before Express apps,
          then always awaits start after apps are constructed and before disabling maintenance.
          Backend-only boot initializes RouterManager with URL service explicitly; frontend
          setup already did so. Start assigns routerManager/urlService before awaiting the
          store read, then synchronously starts the current manager. Init alone allows
          store reads/downloads; upload also requires the bridge/frontend/URL graph. Upload
          imports the global URL service, not the stored start dependency, and defers bridge
          import to avoid its API cycle. Isolated HTTP tests assert configured post/tag URLs
          in backend-only mode, refreshed URLs through the same Content API consumer after
          upload, and configured canonical URLs with only the frontend mounted. VM tests assert
          that initDynamicRouting passes the shared dependencies, awaits start and propagates
          its original error in both modes. These do not pin repeated root init/start, a
          pending real store read or top-level boot awaiting initDynamicRouting.
        sources:
          - core/boot.js
          - core/server/services/route-settings/index.js
          - core/server/services/route-settings/dynamic-routing-service.js
          - core/bridge.js
          - core/frontend/services/routing/router-manager.js
        tests:
          - test/e2e-server/boot-frontend-only.isolated.test.ts
          - test/e2e-server/boot-backend-only.isolated.test.ts
          - test/unit/boot-dynamic-routing.test.ts
          - test/e2e-frontend/custom-routes.test.js
          - test/e2e-frontend/helpers/get.test.js
          - test/e2e-frontend/member-stats.test.js
      lifetime:
        summary: >-
          Root and implementation identity survive init; configure replaces the store, start
          replaces routing references and each read fetches fresh persisted content. There is
          no readiness state, shared pending promise, stop or reset. Calling start twice
          without RouterManager.init appends routers rather than clearing the graph. Upload
          validates, awaits replace, then reloads by reading again: updates have no lock/version
          guard, so overlapping writes/reloads need not activate each caller's own content.
          Successful reload resets URL state, resets the router registry and replaces the
          site router. Store contract tests pin input/read mutation isolation and replacement
          rather than merging; bridge deferred tests pin read-before-reset and read failure,
          not root identity, concurrent reloads or successful repeated full routing.
        sources:
          - core/server/services/route-settings/index.js
          - core/server/services/route-settings/dynamic-routing-service.js
          - core/bridge.js
          - core/frontend/web/site.js
          - core/frontend/services/routing/router-manager.js
          - core/frontend/services/routing/registry.js
          - core/server/services/url/lazy-url-service.ts
          - core/server/adapters/route-settings/FileStore.ts
          - core/server/adapters/route-settings/S3RouteSettingsStore.ts
        tests:
          - test/unit/bridge.test.js
          - test/unit/server/adapters/route-settings/file-store.test.ts
          - test/unit/server/adapters/route-settings/helpers/store-contract.ts
          - test/integration/adapters/route-settings/s3-route-settings-store.test.ts
      configuration:
        summary: >-
          Root init takes no config. Adapter-manager copies configured adapter sections and
          fills absent/falsy FileStore paths from content settings/defaultRouteSettings, or
          the S3 default-file path. FileStore is the default; S3 validates bucket/prefix,
          optional tenant/endpoint/region and paired credentials, then captures those values.
          Config is a validated frozen tree; test set/reset and adapter cache clearing do not
          establish production hot reload. Even a fresh lookup reuses a cached same-class
          adapter. Routing changes are persisted data reloads, independent of frozen URL-utils
          site/subdirectory values. Parser preserves YAML source, route order, optional-field
          distinctions and brace permalinks. Config/adapter and parser tests assert these
          transformations; production reconfiguration and old/new retained stores are untested.
        sources:
          - core/server/services/route-settings/index.js
          - core/server/services/route-settings/route-settings-parser.ts
          - core/server/services/adapter-manager/utils.ts
          - core/server/services/adapter-manager/adapter-manager.ts
          - core/server/adapters/route-settings/FileStore.ts
          - core/server/adapters/route-settings/S3RouteSettingsStore.ts
          - core/shared/config/defaults.json
          - core/shared/config/overrides.json
          - core/shared/config/SCHEMA.md
          - core/shared/url-utils.ts
          - core/frontend/services/routing/parent-router.js
        tests:
          - test/unit/server/services/adapter-manager/route-settings-wiring.test.ts
          - test/unit/server/services/adapter-manager/utils.test.ts
          - test/unit/server/adapters/route-settings/s3-route-settings-store.test.ts
          - test/unit/server/services/route-settings/route-settings-parser.test.ts
          - test/unit/server/services/route-settings/validate-route-settings.test.ts
      resources:
        summary: >-
          The service owns references but no timer, listener, cache or worker. Adapter-manager
          owns cached stores: FileStore performs awaited reads and temporary-file moves;
          S3RouteSettingsStore owns an SDK client/HTTP transport without a destroy hook. Cache
          clearing drops adapters without disposal and this root registers no shutdown task.
          Backups are timestamped to seconds with no retention or write serialization, so
          same-second overwrites reuse a backup path/key. Router/URL state belongs to shared
          routing services; bridge init adds settings listeners on each boot without a matching
          removal here. File/S3 tests pin bytes, backups and mutation isolation; S3 bucket
          suites are availability-gated and their multi-backup case spaces writes apart.
          They do not prove transport release, collision safety or drain on shutdown.
        sources:
          - core/server/services/route-settings/dynamic-routing-service.js
          - core/server/services/adapter-manager/adapter-manager.ts
          - core/server/adapters/route-settings/FileStore.ts
          - core/server/adapters/route-settings/S3RouteSettingsStore.ts
          - core/server/adapters/route-settings/utils.ts
          - core/boot.js
          - core/bridge.js
          - core/frontend/services/routing/registry.js
          - core/server/services/url/lazy-url-service.ts
        tests:
          - test/unit/server/adapters/route-settings/file-store.test.ts
          - test/unit/server/adapters/route-settings/s3-route-settings-store.test.ts
          - test/unit/server/adapters/route-settings/utils.test.ts
          - test/integration/adapters/route-settings/s3-route-settings-store.test.ts
          - test/integration/adapters/route-settings/adapter-manager-wiring.test.ts
      failures:
        summary: >-
          Init rejects adapter resolution/construction failures. Stored validation/YAML errors are
          logged as ROUTE_SETTINGS_VALIDATION_ERROR by load then rethrown unchanged; other reads
          rethrow without that log, and download propagates directly. Upload validates before
          replace; missing storage falls back to bundled defaults, corrupt content does not. File
          writes attempt temporary-file cleanup on failure; S3 request failures become cloneable
          InternalServerErrors retaining stack context. Replace failure prevents reload, but
          reload failure leaves new stored bytes. Bridge read failure preserves the old graph;
          failures after URL reset/router reconstruction have no rollback. Bridge starts app
          reactivation without awaiting its promise; the app loader normally logs and swallows
          activation errors, so successful upload does not prove those apps finished restarting.
          Bridge units stub app init and do not assert this boundary. Boot surfaces fatal start
          failure through shutdown. Deep-class, real-file, parser, stubbed-S3 and bridge tests
          enforce selected failure branches. VM tests propagate a substituted start failure;
          real-root startup failure and full HTTP partial-reload recovery remain untested.
        sources:
          - core/server/services/route-settings/index.js
          - core/server/services/route-settings/dynamic-routing-service.js
          - core/server/services/route-settings/yaml-parser.js
          - core/server/services/route-settings/route-settings-parser.ts
          - core/server/services/route-settings/validation-errors.ts
          - core/server/adapters/route-settings/FileStore.ts
          - core/server/adapters/route-settings/S3RouteSettingsStore.ts
          - core/bridge.js
          - core/frontend/services/apps/index.js
          - core/boot.js
        tests:
          - test/unit/boot-dynamic-routing.test.ts
          - test/unit/server/services/route-settings/dynamic-routing-service.test.ts
          - test/integration/services/route-settings/dynamic-routing-service.test.ts
          - test/unit/server/services/route-settings/validate-route-settings.test.ts
          - test/unit/server/services/route-settings/validation-errors.test.ts
          - test/unit/server/adapters/route-settings/file-store.test.ts
          - test/unit/server/adapters/route-settings/s3-route-settings-store.test.ts
          - test/unit/bridge.test.js
    unverified: []
    blockers:
      - >-
        Pin the real root's eager identity, bound accessors, repeated/overlapping init and
        configure/start ordering during pending real-store reads, failed start and same-process
        restart. Preserve the existing backend-only/frontend-only HTTP routing assertions and
        VM start barrier/error checks; they do not establish those remaining root contracts.
      - >-
        Decide and test concurrent upload/reload semantics and failures after persistence or
        URL reset. There is no rollback or serialization, and second-resolution backup names
        collide for rapid replacements; existing multiple-backup coverage avoids that case.
      - >-
        Assign S3-client transport disposal, in-flight storage/reload draining and retained
        adapter ownership, including adapter cache clearing. Repeated boot also needs a
        contract for bridge listeners and router/URL state rather than accumulating state.
      - >-
        Add focused HTTP/root assertions for verbatim download, invalid upload leaving storage
        and active routes unchanged, store-replace failure, and successful changed routing
        after repeated uploads. Existing HTTP file tests mainly assert statuses/headers;
        the comments case does not prove each uploaded collection is activated.
  settings:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    entryPoints:
      - settings/index.js
      - settings/settings-service.js
    notes: >-
      Preserve per-boot cache rebuilding, synchronous retained readers and separate caller-owned
      BREAD instances. Utility consumers also run before ordinary service boot.
    contracts:
      exports:
        summary: >-
          CommonJS index forwards the settings-service object: init/reset, calculated fields,
          email synchronization, UUID validation, access-code operations, secret helpers and
          a receiver-independent BREAD factory. Init calls sibling methods through this; reset
          synchronously clears the shared cache/listeners. BREAD read succeeds synchronously
          but returns rejected promises for ordinary missing/core-access errors; browse returns
          an array with context and a promise without context. Units await these methods and
          assert selected results/errors, not exact return timing or complete root shape.
        sources:
          - core/server/services/settings/index.js
          - core/server/services/settings/settings-service.js
          - core/server/services/settings/settings-bread-service.js
          - core/server/services/settings/settings-utils.js
        tests:
          - test/unit/server/services/settings/settings-bread-service.test.js
          - test/unit/server/services/settings/settings-service.test.js
      construction:
        summary: >-
          Root import retains model/config/cache/helper dependencies, without initializing the
          cache. Every BREAD factory call creates a SingleUseTokenProvider and BREAD instance;
          its constructor creates GhostMailer and MagicLink. Settings/notifications endpoints
          retain separate instances at lazy module load, and recommendations constructs another
          during its init. Model/default migration use settings-utils directly to avoid full
          service boot; its generated site UUID is module-cached. Tests construct injected BREAD
          classes or boot the endpoints, not factory count, partial construction or mail cleanup.
        sources:
          - core/server/services/settings/settings-service.js
          - core/server/services/settings/settings-bread-service.js
          - core/server/services/settings/settings-utils.js
          - core/server/api/endpoints/settings.js
          - core/server/api/endpoints/notifications.js
          - core/server/api/endpoints/index.js
          - core/server/services/recommendations/recommendation-service-wrapper.js
          - core/server/models/settings.js
          - core/server/data/migrations/versions/5.124/2025-06-06-23-12-11-create-site-uuid-setting.js
        tests:
          - test/unit/server/services/settings/settings-bread-service.test.js
          - test/e2e-api/admin/settings.test.js
      consumers:
        summary: >-
          Boot awaits init and email synchronization before signing keys/i18n. API settings
          uses its retained BREAD for browse/read/edit/verification; notifications persists its
          state through a second BREAD. Recommendations requires synchronous read success, but
          setSetting discards the edit promise, so its completion does not establish persistence.
          Shared settings-cache and bound settings helpers serve many other capabilities without
          calling this root. Real Admin/Content HTTP asserts selected settings, read-only rules,
          email-verification metadata/mail interception and DB-token update outcomes. Retained
          cache/helper refresh units use fake rows; these do not cover every retained BREAD caller.
        sources:
          - core/boot.js
          - core/server/api/endpoints/settings.js
          - core/server/api/endpoints/notifications.js
          - core/server/api/endpoints/settings-public.js
          - core/server/services/recommendations/recommendation-enabler-service.js
          - core/shared/settings-cache/index.js
          - core/server/services/settings-helpers/settings-helpers.js
        tests:
          - test/unit/server/services/settings/repeated-init.test.ts
          - test/e2e-api/admin/settings.test.js
          - test/e2e-api/content/settings.test.js
      startup:
        summary: >-
          Every init obtains cache:settings, populates defaults, enforces the public-site limit,
          reads all rows and overrides, rebuilds the shared cache/calculated fields, then validates
          site_uuid. Real populateDefaults destroys and reinitializes the shared Knex pool before
          reading/inserting defaults. There is no init guard or concurrent-call serialization.
          Cache get tolerates pre-init with undefined; getAll and BREAD operations can fail early.
          Repeated-init units assert retained values/call counts with defaults/DB/adapter stubs;
          enforcement units assert selected generated/internal writes, not real pool or boot ordering.
        sources:
          - core/server/services/settings/settings-service.js
          - core/server/models/settings.js
          - core/shared/settings-cache/cache-manager.js
          - core/boot.js
          - core/server/services/settings/private-site-access-code.js
        tests:
          - test/unit/server/services/settings/repeated-init.test.ts
          - test/unit/server/services/settings/settings-service.test.js
          - test/e2e-api/admin/settings.test.js
      lifetime:
        summary: >-
          Shared CacheManager and bound helper identities survive re-init, while cache rows,
          overrides and calculated-field objects are replaced. Init publishes the new store
          before reset/population; reset clears that store and prior exact event callbacks, not
          a replaced old adapter. Reads with resolve:false expose cached objects; BREAD slack
          and labs reads mutate those objects. Calculated updates generate new IDs/timestamps.
          Units prove retained cache/helper refresh, removed rows after re-init, stable listener
          counts and calculated-handler cleanup, not overlapping init, raw-reference mutation,
          real pool restart or disposal. Root has no shutdown registration.
        sources:
          - core/server/services/settings/settings-service.js
          - core/shared/settings-cache/index.js
          - core/shared/settings-cache/cache-manager.js
          - core/server/services/settings/settings-bread-service.js
          - core/server/ghost-server.ts
        tests:
          - test/unit/server/services/settings/repeated-init.test.ts
          - test/unit/shared/settings-cache.test.js
      configuration:
        summary: >-
          Each init copies host overrides and forces transistor false only when configured custom
          integrations are strictly disabled. Cached overrides apply on read and mark rows read-only;
          changing test config alone does not refresh them. Calculated functions bind helpers that
          read current cache/config, while shared URL utilities retain frozen base URLs. BREAD
          consults current labs/limits/email-address service; its mailer retains construction-time
          transport. It reads absent defaultFromAddress for verification, with GhostMailer falling
          back to actual defaultFromEmail. Tests pin selected override refresh/removal, parsing,
          managed/self-hosted verification and masked/read-only HTTP responses, not refusal of
          underlying override-row writes. Production config hot reload
          or this sender-property mismatch in isolation is not established.
        sources:
          - core/server/services/settings/settings-service.js
          - core/shared/settings-cache/cache-manager.js
          - core/server/services/settings/settings-bread-service.js
          - core/server/services/settings-helpers/settings-helpers.js
          - core/server/services/email-address/email-address-service.ts
          - core/server/lib/mail/ghost-mailer.js
          - core/shared/url-utils.ts
          - core/shared/config/SCHEMA.md
        tests:
          - test/unit/server/services/settings/repeated-init.test.ts
          - test/unit/server/services/settings/settings-service.test.js
          - test/unit/shared/settings-cache.test.js
          - test/e2e-api/admin/settings.test.js
      resources:
        summary: >-
          Cache initialization owns common model/calculated subscriptions and borrows the manager
          adapter; its get/set/reset/keys usage is synchronous, including unawaited reset. Defaults
          initialization manages the shared Knex pool, not an isolated settings connection. Each
          BREAD owns mail/token/link helpers without stop/drain; token rows are cleaned by members
          jobs when they find rows older than 24 hours. Verification creation, mail, token usage and
          setting writes have no shared transaction. Model multi-setting edit runs row operations
          in parallel and has no implicit shared transaction; a caller may supply one. Existing local-memory cleanup and mocked-mail/real-DB HTTP tests
          do not prove alternate-adapter compatibility, in-flight pool/mail drain or atomic edits.
        sources:
          - core/shared/settings-cache/cache-manager.js
          - core/server/services/settings/settings-service.js
          - core/server/services/settings/settings-bread-service.js
          - core/server/models/settings.js
          - core/server/lib/mail/ghost-mailer.js
          - core/server/lib/magic-link/magic-link.js
          - core/server/services/members/single-use-token-provider.js
          - core/server/services/members/jobs/index.js
          - core/server/services/members/jobs/clean-tokens-task.ts
        tests:
          - test/unit/shared/settings-cache.test.js
          - test/unit/server/services/settings/settings-bread-service.test.js
          - test/e2e-api/admin/settings.test.js
      failures:
        summary: >-
          Repeated-init units prove findAll rejection preserves old cache and retry refreshes.
          Later calculated-field/adapter/UUID failures instead leave published partial/new state
          and possibly listeners; UUID units only call validation directly with a stubbed getter.
          Source applies overrides before checking a missing cached row, causing a dereference;
          the unit named for absent override behavior configures no override. BREAD can persist
          ordinary settings before token/mail failure, and token validation commits usage before
          allowed-key checks or setting persistence. Stripe connect notification precedes writes;
          post-write logging/mail errors can reject after effects. Tests assert selected validation,
          intercepted email and token outcomes, not these partial effects.
        sources:
          - core/server/services/settings/settings-service.js
          - core/shared/settings-cache/cache-manager.js
          - core/server/services/settings/settings-bread-service.js
          - core/server/services/members/single-use-token-provider.js
          - core/server/lib/magic-link/magic-link.js
          - core/server/models/settings.js
        tests:
          - test/unit/server/services/settings/repeated-init.test.ts
          - test/unit/server/services/settings/settings-service.test.js
          - test/unit/server/services/settings/settings-bread-service.test.js
          - test/unit/shared/settings-cache.test.js
          - test/e2e-api/admin/settings.test.js
    unverified: []
    blockers:
      - >-
        Cover overlapping init and failures after cache publication, including calculated fields,
        adapter reset/set and UUID validation. The existing read-retry test stubs defaults and
        cannot establish shared Knex pool safety, full restart or old-adapter disposal.
      - >-
        Protect raw-reference and mixed synchronous/promise contracts for retained BREAD callers.
        Characterize slack/labs read mutation, deleted-setting events and invalid override rows;
        the named missing-override unit does not supply the override needed to exercise that branch.
      - >-
        Cover factory/mail ownership and verification composition through an actual emailed token,
        including validity/usage boundaries, concurrency and persistence/mail failures. Current
        token HTTP creates a token directly; it does not prove the full send-to-update round trip.
      - >-
        Establish partial-effect policy for multi-setting edits, Stripe notification, token usage
        and post-write mail/log failures. Recommendations discards its settings edit promise;
        its enable completion and error propagation are not a durability guarantee.
      - >-
        Define synchronous cache-adapter requirements and shutdown ownership for listeners,
        shared pool and per-caller mail resources before adopting a common lifecycle. Preserve
        config snapshots/live reads and actual default-sender fallback without copying the stale name.
