      resources:
        summary: >-
          The root and its limit objects retain policy/dependency references and own no timers,
          subscriptions or transport. Count checks borrow the shared lazy knex connection or
          supplied transaction and await queries; newsletters forwards transaction context for
          add/reactivation. Counts cover members, active newsletters, email totals since the
          current billing-period start, and non-Contributor staff excluding inactive users plus
          non-Contributor invites. Uploads supply
          bytes instead of querying. No counter cache, lock, reservation, shutdown or drain
          is supplied. HTTP tests exercise database-backed refusals with/without newsletter
          transactions, without proving concurrent capacity or complete SQL count semantics.
        sources:
          - core/server/services/limits.ts
          - core/server/data/db/index.js
          - core/server/data/db/connection.ts
          - core/server/services/newsletters/newsletters-service.js
          - core/server/services/email-service/email-service.js
          - core/server/api/endpoints/utils/validators/input/files.ts
          - core/server/api/endpoints/utils/validators/input/media.ts
        tests:
