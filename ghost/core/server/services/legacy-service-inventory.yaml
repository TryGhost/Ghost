        tests:
          - test/e2e-api/admin/member-custom-fields.test.ts
          - test/e2e-api/members/custom-fields.test.ts
      lifetime:
        summary: >-
          Once all five bindings exist, init preserves them and their captured Knex/dependencies.
          There is no reset or shutdown hook. If construction throws after an assignment, a retry
          replaces earlier instances; retained members/CSV references would not follow that
          replacement. Definitions, bindings, values and change history
          live in tables, not an instance cache. Archiving hides values while retaining rows;
          deletion cascades values/bindings, and field-history names survive definition deletion.
          HTTP asserts selected archive/delete/readback outcomes, not identity, restart or retry.
        sources:
          - core/server/services/members-metafields/index.ts
          - core/server/services/members-metafields/values-service.ts
          - core/server/services/members-metafields/bindings-service.ts
          - core/server/services/members/service.js
