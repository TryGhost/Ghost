      Members; Stripe key selection to Stripe; donations, Social Web and analytics eligibility to
      their existing feature owners; sender defaults to shared sender policy. Only common settings
      access/calculated-field bindings stay with Shared settings. Boot injects feature-owned
      calculation callbacks so Shared does not import server features. Preserve early evaluation
      without forcing feature services to initialize first. No source has moved. Split before the initializer migration rather than migrating this facade in place; the remaining calculated-field bindings move with the settings split. Preserve the
      shared facade, exposed cache reference and calculated-field bindings. Helper reads, frozen
      URL inputs and caller-owned result caches have different lifetimes.
