    contracts:
      exports:
        summary: >-
          CommonJS index forwards the settings-service object: init/reset, calculated fields,
          email synchronization, UUID validation, access-code operations, secret helpers and
          a receiver-independent BREAD factory. Init calls sibling methods through this; reset
          synchronously clears the shared cache/listeners. BREAD read succeeds synchronously
          but returns rejected promises for ordinary missing/core-access errors; browse returns
          an array with context and a promise without context. Units await these methods and
          assert selected results/errors, not exact return timing or complete root shape.
        sources:
