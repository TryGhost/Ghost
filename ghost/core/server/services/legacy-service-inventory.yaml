          - test/integration/services/email-service/batch-sending.test.js
      lifetime:
        summary: >-
          Concurrent wrapper calls await one internal initialization; rejection clears its
          promise for retry, while success retains graph and fulfilled promise. Implementation
          init guards its subscription, but calling public subscribe again adds another listener.
          Clearing a successful wrapper's service alone cannot recreate it; event-bus resets or
