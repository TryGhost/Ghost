        tests:
          - test/e2e-api/admin/member-custom-fields.test.ts
      resources:
        summary: >-
          The root owns no timers, subscriptions, queue, transport or database pool; it borrows
          shared Knex. Definition add/reorder use transactions; addOne and value applyWrite join
          a supplied transaction or open one, while bind/remove use the supplied executor.
          Value changes and their history rows share a transaction; the members service
          composes larger writes around it, and CSV import uses per-row transactions. Definition actions
          are separate post-write work. Real HTTP proves batch rollback on a later name conflict,
          successful value/history writes and cascades; validation refusals do not prove rollback
          after a value/history write fails. Import failure units use fake commit/rollback.
        sources:
          - core/server/services/members-metafields/definitions-service.ts
          - core/server/services/members-metafields/values-service.ts
          - core/server/services/members-metafields/bindings-service.ts
          - core/server/services/members-metafields/actions.ts
          - core/server/services/members/members-api/services/member-bread-service.js
          - core/server/services/members/import-export/import/importer.ts
          - core/server/data/db/connection.ts
          - core/server/data/schema/schema.js
        tests:
          - test/e2e-api/admin/member-custom-fields.test.ts
          - test/e2e-api/members/custom-fields.test.ts
          - test/e2e-api/admin/members-import-custom-fields.test.ts
          - test/unit/server/services/members/import-export/import/error-handling.test.ts
      failures:
        summary: >-
          Invalid plans reject before writes; malformed value leaves are logged/omitted and
          malformed history field lists become empty, while invalid definition decoding rejects
          the read. Bindings skip unresolved/invalid rows, and return the plans for the values
          accepted, one per writer, beside every refusal named by port; a failed lookup rejects. Definition action failures are logged after data writes. Multi-property definition edits are not atomic; limit
          counting deliberately permits concurrent overshoot, and applying a plan does not
          revalidate its captured definition. HTTP asserts selected refusals/corrupt reads and
          successful actions; webhook HTTP and fake import tests assert continuation/reporting.
          Action failure, partial edits, stale plans and concurrency guarantees remain untested.
        sources:
          - core/server/services/members-metafields/definitions-service.ts
          - core/server/services/members-metafields/values-service.ts
          - core/server/services/members-metafields/bindings-service.ts
          - core/server/services/members-metafields/actions.ts
          - core/server/services/members/import-export/import/importer.ts
        tests:
          - test/e2e-api/admin/member-custom-fields.test.ts
          - test/e2e-api/members/custom-fields.test.ts
          - test/e2e-api/members/webhooks.test.js
          - test/unit/server/services/members/import-export/import/error-handling.test.ts
    unverified: []
    blockers:
      - >-
        Pin the real root exports, pre-init behavior, synchronous publication, repeated-init
        identities and partial-construction retry. Cover retained members/CSV consumers,
        including shared database replacement/restart;
        constructor units and successful HTTP boot do not establish those lifecycle contracts.
      - >-
        Add real database failure assertions for member/value/history writes after
        work has begun, and for post-write action-log failure. Preserve the narrower existing
        definition-batch rollback evidence; prevalidation refusals and fake transaction tests
        do not establish these outcomes or event delivery relative to commit/rollback.
      - >-
        Characterize concurrent definition edits/deletion, deliberately approximate limit
        enforcement, and plans applied after definition access/status changes. Multi-property
        edits can retain earlier writes after later failure, and feed rows/count use separate
        reads; no atomicity or snapshot guarantee should be introduced by the migration.
      - >-
        Characterize binding resolution against real archived/malformed rows before retaining
        or changing that API during migration. Existing binding units use fake query/value
        collaborators; they do not establish database behavior or in-flight work settlement.
        Confirm ownership of the constructed bindings service now that the inspected
        production consumers were removed.
  milestones:
    kind: directory
    disposition: migrate
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    migration:
      complexity: complex
      modelImpact: fits
      reason: >-
        One retained API fits defineService, but initAndRun also creates a new background
        timer on every call. Separate construction from scheduling and decide timer
        ownership and failure policy: a rejected run currently leaves scheduleRun's outer
        promise pending. Boot must keep milestone checks outside foreground readiness,
        without accidentally making successful init imply check completion.
      reviewedAt: f276513ba32b7114fd5cc4f7b02d3f82c0c31e3e
      sources:
        - core/server/services/milestones/service.js
        - core/server/services/milestones/milestones-service.js
        - core/boot.js
      dependencies:
        complexity: straightforward
        reason: >-
          Repository, queries and milestone logic already accept their dependencies. The external
          imports are confined to service.js, which acts as the legacy composition root. Moving that
          wiring to index.ts and keeping Stripe eligibility as a live settings callback is bounded;
          the timer and run failure policy are lifecycle work rather than dependency-graph
          obstacles.
        preparation:
          - >-
            Move models, database, event bus, logger and configuration wiring from service.js into
            index.ts.
          - >-
            Retain a call-time Stripe eligibility callback and the existing captured milestone
            settings when separating the runner from scheduling.
        reviewedAt: 44ad405bff4a8700af2ed51f833ebc08d25dddff
        sources:
          - core/server/services/milestones/service.js
          - core/server/services/milestones/milestones-service.js
          - core/server/services/milestones/bookshelf-milestone-repository.js
          - core/server/services/milestones/milestone-queries.js
    entryPoints:
      - milestones/index.js
    notes: >-
      Preserve background startup, captured milestone configuration and live Stripe eligibility.
      Scheduling, failure and cleanup gaps remain migration blockers.
      Slack notifications live in slack-notifications/ as the private milestone notification
      handler: they subscribe only to MilestoneCreatedEvent and read milestones host settings.
      First Milestones init starts them before any check can create a milestone, so boot no
      longer initializes them separately; migrating Milestones must also own their disposal.
      Their previous contract audit is recorded at
      https://github.com/TryGhost/Ghost/blob/33b8dabf2114676d68028d6f86c1945af4e7409c/ghost/core/server/services/service-inventory.yaml#L12917.
    contracts:
      exports:
        summary: >-
          CommonJS index forwards the cached service object, exposing mutable api, init, run,
          scheduleRun and initAndRun. Methods use this; api starts null and becomes a
          MilestonesService with checkMilestones. Runtime event consumers deep-import the
          MilestoneCreatedEvent class rather than the wrapper.
        sources:
          - core/server/services/milestones/index.js
          - core/server/services/milestones/service.js
          - core/server/services/milestones/milestones-service.js
          - core/server/services/milestones/milestone-created-event.js
        tests:
          - test/unit/server/services/milestones/index.test.ts
      construction:
        summary: >-
          Import loads models, repository and event dependencies and samples JOB_TIMEOUT.
          First init synchronously constructs BookshelfMilestoneRepository, MilestoneQueries
          and MilestonesService before its async method resolves; later calls retain api.
          Queries retain the shared db module and the repository retains models.Milestone and
          DomainEvents. InMemoryMilestoneRepository and direct implementation construction
          are used by tests, not another runtime composition path.
        sources:
          - core/server/services/milestones/service.js
          - core/server/services/milestones/milestone-queries.js
          - core/server/services/milestones/bookshelf-milestone-repository.js
          - core/server/services/milestones/in-memory-milestone-repository.js
        tests:
          - test/e2e-server/services/milestones.test.js
      consumers:
        summary: >-
          Background boot is the only runtime wrapper caller and invokes initAndRun. Staff
          and slack-notifications subscribe to the deep-imported milestone event for email
          and webhook delivery. Milestone creation records events; repository save dispatches
          them after its database write without awaiting consumers. The root has no HTTP or
          CLI caller and does not send mail itself.
        sources:
          - core/boot.js
          - core/server/services/milestones/milestone.js
          - core/server/services/milestones/bookshelf-milestone-repository.js
          - core/server/services/staff/staff-service.js
          - core/server/services/staff/staff-service-emails.js
          - core/server/services/milestones/slack-notifications/slack-notifications-service.js
        tests:
          - test/unit/server/services/milestones/milestone.test.ts
          - test/unit/server/services/staff/index.test.js
          - test/unit/server/services/milestones/slack-notifications/index.test.js
      startup:
        summary: >-
          Boot starts background services after mounting the app and notifying readiness,
          skips their main sequence in test environments, and does not await its completion.
          Milestones are started at the end of that sequence after earlier awaited services;
          initAndRun is itself unawaited. Direct run needs api initialized, whereas initAndRun
          initializes it before scheduling. Initialization performs composition, not a
          milestone query or readiness check. First init also starts the private Slack
          notification subscriber once, before any check can dispatch a milestone event.
        sources:
          - core/boot.js
          - core/server/services/milestones/service.js
          - core/server/services/milestones/slack-notifications/service.js
        tests:
          - test/unit/boot/init-background-services.test.ts
          - test/unit/server/services/milestones/index.test.ts
          - test/e2e-server/services/milestones.test.js
      lifetime:
        summary: >-
          The wrapper and api survive repeated init and server stop; no reset or shutdown is
          exposed. Each scheduleRun or initAndRun creates another independent one-shot timer,
          with no recurring registration, deduplication or overlap guard. run checks members
          before eligible ARR and reads persisted milestones to avoid recreating an already
          recorded goal during serial runs. Repository events remain on the saved entity.
        sources:
          - core/server/services/milestones/service.js
          - core/server/services/milestones/milestones-service.js
          - core/server/services/milestones/bookshelf-milestone-repository.js
          - core/server/ghost-server.ts
        tests:
          - test/e2e-server/services/milestones.test.js
          - test/unit/server/services/milestones/milestones-service.test.js
      configuration:
        summary: >-
          First init retains the milestones config object and captures
          minDaysSinceImported, using 7 for a falsy value. Each run reads current Stripe keys
          after the members check; development accepts pk_test_ and other environments
          accept pk_live_. scheduleRun rereads NODE_ENV, forces 5000 ms in development and
          otherwise uses customTimeout or the import-time random delay of 0, 1, 2 or 3 days.
          Zero customTimeout selects that fallback. Database contents and the clock are read
          when checks execute.
        sources:
          - core/server/services/milestones/service.js
          - core/server/services/milestones/milestones-service.js
          - core/server/services/milestones/milestone-queries.js
          - core/shared/config/validated.ts
          - core/shared/config/defaults.json
        tests:
          - test/e2e-server/services/milestones.test.js
          - test/unit/server/services/milestones/milestones-service.test.js
      resources:
        summary: >-
          The service owns raw timeouts but stores no handle, does not unref them and has no
          cancellation or drain hook. Boot does not register milestone cleanup with
          GhostServer; jobs-service shutdown does not own these timers. Queries borrow the
          shared db module and the repository borrows the model layer; neither opens a
          dedicated connection or starts an encompassing transaction. Event subscriptions
          and delivery resources belong to staff and slack-notifications, and run completion
          does not await their delivery.
        sources:
          - core/server/services/milestones/service.js
          - core/server/services/milestones/milestone-queries.js
          - core/server/services/milestones/bookshelf-milestone-repository.js
          - core/server/data/db/index.js
          - core/boot.js
          - core/server/ghost-server.ts
          - core/server/services/staff/staff-service.js
          - core/server/services/milestones/slack-notifications/slack-notifications-service.js
        tests: []
      failures:
        summary: >-
          Construction errors reject init before api assignment, allowing another attempt.
          Direct run rejects on query, validation or save failure and does not proceed to ARR
          after members failure. scheduleRun awaits run in an async timer callback but never
          rejects its outer promise, so a run rejection leaves callers pending and produces
          an unhandled rejection; boot installs a logging handler. Earlier persisted goals
          are not rolled back as a group. Staff and Slack handlers catch and log notification
          failures after the milestone write, without making run await delivery or retry it.
        sources:
          - core/server/services/milestones/service.js
          - core/server/services/milestones/milestones-service.js
          - core/server/services/milestones/bookshelf-milestone-repository.js
          - core/boot.js
          - core/server/services/staff/staff-service.js
          - core/server/services/milestones/slack-notifications/slack-notifications-service.js
        tests:
          - test/unit/server/services/milestones/slack-notifications/slack-notifications-service.test.js
    unverified: []
    blockers:
      - >-
        The wrapper unit test only checks that initAndRun exists. Add exact export and identity
        coverage, init failure/retry, use before init and retained consumers across restart.
        Existing E2E coverage calls initAndRun directly; it does not establish the real boot
        readiness boundary or behavior when earlier background initialization fails.
      - >-
        Characterize the existing timer rejection and pending outer promise in an isolated
        process, then decide failure policy separately. No cancellation, drain, restart or
        overlapping-schedule contract is tested; each initAndRun currently adds a timer.
      - >-
        Add configuration timing coverage for captured milestone settings, import-age fallback,
        import-time random delay, explicit zero timeout and the development overrides. Current
        tests do not establish these boundaries or Stripe changes during a pending run.
      - >-
        Characterize overlapping runs and partial persistence before choosing a concurrency
        contract. Goal lookup and saves are not one transaction, the table has no unique
        goal constraint, and saving the same entity again redispatches its retained events.
        Persistence precedes notification completion; email_sent_at is not a delivery receipt.
      - >-
        Verify production repository behavior with multiple prior emailed goals. Bookshelf
        getLastEmailSent selects email_sent_at ASC, while the fake makes value descending primary and email date
        only breaks equal-value ties. The production repository and query unit tests only assert
        method presence, and the E2E test does not distinguish these ordering rules.
      - >-
        Add a production repository-to-event-to-notification contract. Staff/Slack tests
        dispatch events manually, implementation tests use the fake repository and E2E
        does not assert delivery; removing Bookshelf event dispatch could escape those tests.
      - >-
        Slack notifications: Add wrapper contracts for exact exports, repeated init, changed
        configuration, disabled first init, partial subscription failure/retry and retained
        callbacks across restart. The existing root test proves one successful event reaches a
        webhook, not listener count, configuration lifetime or boot readiness.
      - >-
        Slack notifications: Correct the threshold test: it sets isEnabled false and omits
        minThreshold, so its no-send assertion does not establish threshold behavior. Cover
        equality, values either side of the threshold, wrapper fallback and invalid parsing
        through real composition.
      - >-
        Slack notifications: Characterize sender/request failures through the real subscriber,
        including malformed events, timeouts and pending sends during stop. Tests named Throws for
        invalid or absent URLs only assert logging after a resolved call; preserve that behavior
        unless changing it separately. Test-mode request overrides do not prove production
        transport behavior.
      - >-
        Slack notifications: Decide listener removal, pending-send drain and shared HTTP-agent
        ownership. Current class tests create subscribers directly; successful callbacks and fake
        requests do not establish disposal, duplicate delivery prevention or restart behavior.
  notifications:
    kind: directory
    disposition: migrate
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    migration:
      complexity: complex
      modelImpact: fits
      reason: >-
        The cached Notifications instance fits the helper, but its capability boundary is
        split: the API persists transformed arrays, reads can start detached repair writes,
        and update-check constructs a separate email helper. Settle which operations belong
        on the ready notification facade and which helper stays caller-owned; preserve
        persistence/error timing while moving construction behind boot.
      reviewedAt: f276513ba32b7114fd5cc4f7b02d3f82c0c31e3e
