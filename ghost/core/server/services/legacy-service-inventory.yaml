# Legacy service inventory. See README.md before updating.
# Every service check applies to every service that is not listed under `services`.
# That list only shrinks: migrating a service deletes its entry.
# `standard` records what is still open for services that already use defineService.
# Entry points are relative to this directory; evidence paths are relative to ghost.
# An unverified facet is an open audit question, not an empty/no-op contract.
services:
  activitypub:
    kind: directory
    disposition: migrate
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    migration:
      complexity: complex
      modelImpact: fits
      reason: >-
        The retained instance fits the helper, but startup currently publishes it before
        registering three settings listeners and launches enable/disable without awaiting
        it. Define readiness as composition versus remote configuration explicitly, preserve
        background boot, and add cleanup plus ordering for overlapping settings changes.
        Dynamic enable/disable can remain service behavior rather than requiring instance
        replacement.
      reviewedAt: f276513ba32b7114fd5cc4f7b02d3f82c0c31e3e
      sources:
        - core/server/services/activitypub/activity-pub-service-wrapper.js
        - core/server/services/activitypub/activity-pub-service.ts
        - core/boot.js
        - core/server/services/settings/settings-service.js
      dependencies:
        complexity: straightforward
        reason: >-
          The implementation already receives knex, site URL, logging and Identity Tokens; only the
          separate wrapper owns settings and event wiring. Moving that composition to index.ts and
          making the IdentityTokenService import type-only is bounded. The asynchronous settings
          reconciliation and subscription cleanup remain lifecycle concerns, not evidence of a
          dependency cycle.
        preparation:
          - >-
            Move wrapper composition into the root and retain signing-keys then Identity Tokens then
            ActivityPub readiness; update the instance consumer without resolving Identity Tokens
            earlier.
          - >-
            Keep settings reads live and pass or retain the event binding at the root; characterize
            background configuration separately from construction.
        reviewedAt: 44ad405bff4a8700af2ed51f833ebc08d25dddff
        sources:
          - core/server/services/activitypub/activity-pub-service-wrapper.js
          - core/server/services/activitypub/activity-pub-service.ts
          - core/server/services/identity-tokens/identity-token-service-wrapper.js
          - core/boot.js
    entryPoints:
      - activitypub/index.js
    notes: >-
      Preserve background startup and settings-driven enable/disable behavior; decide listener
      disposal, concurrent configuration and remote-failure policy before migration.
    contracts:
      exports:
        summary: >-
          CommonJS exports the wrapper class with static async init(), instance and initialised
          fields. init resolves without returning the instance. The implementation has a named
          TypeScript ActivityPubService export; the root has no shutdown method.
        sources:
          - core/server/services/activitypub/index.js
          - core/server/services/activitypub/activity-pub-service-wrapper.js
          - core/server/services/activitypub/activity-pub-service.ts
        tests: []
      construction:
        summary: >-
          The wrapper is the only production constructor found. Its first init with an available
          identity-token instance constructs ActivityPubService with shared knex and logging,
          a new URL from the site URL and the existing identity-token instance, then registers
          three settings listeners. An existing instance makes later init calls return immediately.
        sources:
          - core/server/services/activitypub/activity-pub-service-wrapper.js
          - core/server/services/activitypub/activity-pub-service.ts
          - core/server/data/db/index.js
        tests: []
      consumers:
        summary: >-
          Background boot is the only production root caller found. Settings model edits invoke
          the registered configuration callback through the shared event emitter. The separate
          webhooks service reads the persisted webhook rows and dispatches post events without
          importing this root. Direct implementation construction outside the wrapper is limited
          to unit tests in the searched repository.
        sources:
          - core/boot.js
          - core/server/services/activitypub/activity-pub-service-wrapper.js
          - core/server/models/settings.js
          - core/server/models/base/plugins/events.js
          - core/server/services/webhooks/listen.js
          - core/server/services/webhooks/webhook-trigger.js
        tests: []
      startup:
        summary: >-
          Boot initializes identity tokens before readiness, then starts unawaited background
          work which skips this root in test environments. Background boot awaits wrapper init
          after earlier recovery and scheduling. Missing identity tokens log an error and leave
          the instance unset, allowing a later explicit init attempt. Successful wrapper init
          launches configuration without awaiting enable/disable, so completion is not remote
          readiness and does not delay the server's readiness notification.
        sources:
          - core/boot.js
          - core/server/services/activitypub/activity-pub-service-wrapper.js
        tests: []
      lifetime:
        summary: >-
          The module retains the instance and initialised flag without reset or disposal.
          initialised changes only after an enable/disable promise fulfills; it is not a pending
          task guard. Settings callbacks can overlap. Repeated direct initialiseWebhooks calls
          retain existing rows when count, event, target URL and secret match; the unit test
          asserts row equality, not wrapper identity or repeated-boot behavior. Reconciliation
          ignores api_version, although inserted rows include it.
        sources:
          - core/server/services/activitypub/activity-pub-service-wrapper.js
          - core/server/services/activitypub/activity-pub-service.ts
        tests:
          - test/unit/server/services/activitypub/activity-pub-service.test.ts
      configuration:
        summary: >-
          The service captures the site URL and dependency references at construction; it queries
          the owner and obtains a fresh identity token for each remote request. Configuration
          callbacks read social_web_enabled from the settings cache on labs, social_web and
          is_private edits. This calculated setting depends on the UI setting, privacy, limits,
          subdirectory and production host checks. Helper tests cover settings, privacy, limits, subdirectory and localhost cases
          separately; they do not establish IP/IPv6 cases, wrapper events, URL capture or
          changes during pending work.
        sources:
          - core/server/services/activitypub/activity-pub-service-wrapper.js
          - core/server/services/activitypub/activity-pub-service.ts
          - core/server/services/identity-tokens/identity-token-service.ts
          - core/server/services/settings/settings-service.js
          - core/server/services/settings-helpers/settings-helpers.js
          - core/shared/settings-cache/cache-manager.js
        tests:
          - test/unit/server/services/settings-helpers/settings-helpers.test.js
      resources:
        summary: >-
          This root borrows the shared database and identity-token service. It owns three event
          subscriptions and starts HTTP/SQL work without tracking, cancelling or draining it.
          Enable reconciles four persistent webhook rows for the existing internal integration;
          replacement deletes then inserts without a transaction. Disable removes those rows
          before requesting remote site deletion. No ActivityPub cleanup task is registered.
          Implementation tests check row count, secrets, integration IDs and a DELETE request;
          they do not establish cleanup or full webhook delivery through the application.
        sources:
          - core/server/services/activitypub/activity-pub-service-wrapper.js
          - core/server/services/activitypub/activity-pub-service.ts
          - core/server/data/schema/fixtures/fixtures.json
          - core/server/lib/common/events.js
          - core/boot.js
          - core/server/ghost-server.ts
        tests:
          - test/unit/server/services/activitypub/activity-pub-service.test.ts
      failures:
        summary: >-
          Missing integration or secret logs and resolves; owner/token/fetch/JSON errors in secret
          retrieval log and return null. Remote DELETE errors log and resolve. Neither fetch
          checks HTTP success status. Other database failures reject. Configuration rejections
          are detached from wrapper init and event emitters, reaching the process rejection
          handler rather than startup's catch. A wrapper-init rejection stops later background
          startup, after readiness. Unit tests assert missing-integration and missing-owner
          handling, but not wrapper state or remote/SQL rejection policies.
        sources:
          - core/server/services/activitypub/activity-pub-service.ts
          - core/server/services/activitypub/activity-pub-service-wrapper.js
          - core/server/lib/common/events.js
          - core/boot.js
        tests:
          - test/unit/server/services/activitypub/activity-pub-service.test.ts
    unverified: []
    blockers:
      - >-
        Add wrapper and real-boot contracts for root exports, retained identity, missing identity
        tokens, repeated initialization and init returning while remote configuration is pending.
      - >-
        Decide and test concurrent settings updates: callbacks are not serialized, so repeated
        enable calls can overlap and an opposite edit during pending work can be lost.
      - >-
        Decide restart ownership and test settings-cache listener rebinding. ActivityPub retains
        its listeners and captured URL/identity instance across same-process boots, with no
        unsubscribe or in-flight drain path. Settings-cache reinit re-appends calculated-field
        listeners after retained ActivityPub listeners, creating a source-derived risk of
        reading the prior social_web_enabled value; reproduce this ordering before migration.
      - >-
        Decide failure and retry semantics. Fulfilled no-op enable can mark initialised true
        without webhooks; a fulfilled failed remote disable clears it. Neither non-success HTTP
        responses nor detached SQL rejections have wrapper-level characterization.
      - >-
        Add failure-atomicity and shutdown tests for webhook replacement and pending HTTP/SQL
        work. This root supplies no transaction, request abort signal, explicit timeout or retry.
      - >-
        Characterize reconciliation ignoring api_version. Implementation tests do not assert
        every webhook event/target/API version, disable's
        combined deletion order, real identity-token wiring or post-event delivery through the
        application. Existing row/helper tests do not make this root migration-ready.
  adapter-manager:
    kind: directory
    disposition: split
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    migration:
      complexity: complex
      modelImpact: fits
      reason: >-
        One retained manager fits; the difficult work is moving eager adapter lookups behind
        its readiness barrier across image helpers, scheduling, settings and other
        consumers. Preserve lazy per-adapter caching and keep repeated configuration
        validation distinct from one-time manager construction. Nested adapter lifetime is
        owned separately and does not itself require replacing the manager.
      reviewedAt: f276513ba32b7114fd5cc4f7b02d3f82c0c31e3e
      sources:
        - core/server/services/adapter-manager/index.ts
        - core/kernel/adapter-manager/adapter-manager.ts
        - core/server/lib/image/index.js
        - core/server/services/post-scheduling/index.ts
        - core/boot.js
      dependencies:
        complexity: complex
        reason: >-
          The manager already accepts config, base classes and a loader, but its supporting modules
          share config and Node resolution with the build-time validator. Image helpers and
          scheduling also acquire adapters during import. Moving the singleton behind readiness must
          preserve those callers, lazy adapter loading and cached identities.
        preparation:
          - >-
            Move eager getAdapter calls in image and scheduling composition behind adapter-manager
            readiness before adopting a guarded service getter.
        reviewedAt: 44ad405bff4a8700af2ed51f833ebc08d25dddff
        sources:
          - core/server/services/adapter-manager/index.ts
          - core/kernel/adapter-manager/adapter-manager.ts
          - core/server/services/adapter-manager/adapter-paths.ts
          - core/server/services/adapter-manager/base-classes.ts
          - core/kernel/adapter-manager/loader.ts
          - core/kernel/adapter-manager/options.ts
          - core/server/services/adapter-manager/config.ts
          - bin/validate-adapters.ts
          - core/server/lib/image/index.js
          - core/server/services/post-scheduling/index.ts
    entryPoints:
      - adapter-manager/index.ts
    notes: >-
      Split in progress. The reusable loading, validation and instance-management machinery
      now lives in core/kernel/adapter-manager and takes its configuration through an
      explicit getConfig callback, so it imports nothing from the application. This
      directory holds only Ghost's composition: the base-class registry, search paths, the
      legacy scheduling/storage normalization, import-storage isolation and content-path
      defaults, and the configured instance, with live resolution on each lookup. The
      remaining relocation is of that composition into boot. The dependency audit still
      counts the registry and path files as implementation because the service rule treats
      every non-root file as one; a composition-only directory has no implementation to
      isolate, which a boot home would resolve. Reassess initialization after that move
      rather than migrating this root in place. Preserve boot validation, lazy adapter
      construction, lookup precedence, live configuration resolution and cached identity.
      Consumers retain adapters outside the manager; disposal and replacement must account
      for those references and adapter-specific resource owners.
    contracts:
      exports:
        summary: >-
          TypeScript default-exports an eager AdapterManager instance; CommonJS callers read
          .default. init and clearCache return void; getAdapter synchronously returns the
          configured adapter. Methods depend on their receiver. The implementation class,
          paths, registry and resolver utilities are deep-imported by tests and the validation
          CLI. There is no manager shutdown or disposal API.
        sources:
          - core/server/services/adapter-manager/index.ts
          - core/kernel/adapter-manager/adapter-manager.ts
          - core/kernel/adapter-manager/types.ts
          - bin/validate-adapters.ts
        tests:
          - test/unit/server/services/adapter-manager/route-settings-wiring.test.ts
      construction:
        summary: >-
          The root is the only production manager constructor found. It captures shared config,
          require, import-time lookup paths and seven registered base classes. getAdapter
          resolves and loads the class before checking its name/class cache, then constructs
          an uncached adapter and validates inheritance and required methods before caching it.
          Manager and CLI accept a matching superclass name when instanceof fails, preserving
          compatibility with another loaded copy of the base package.
          Different feature names receive separate instances even for the same class/options.
          The validation CLI shares loading helpers and instantiates bases, not this manager
          or configured adapters.
        sources:
          - core/server/services/adapter-manager/index.ts
          - core/kernel/adapter-manager/adapter-manager.ts
          - core/server/services/adapter-manager/adapter-paths.ts
          - core/server/services/adapter-manager/base-classes.ts
          - core/kernel/adapter-manager/loader.ts
          - core/server/services/adapter-manager/config.ts
          - bin/validate-adapters.ts
        tests:
          - test/unit/kernel/adapter-manager/adapter-manager.test.ts
          - test/unit/server/services/adapter-manager/base-classes.test.ts
          - test/unit/server/services/adapter-manager/adapter-paths.test.ts
      consumers:
        summary: >-
          Boot validates adapters and starts scheduling. Services retain image/settings/public
          caches, scheduling wrappers, storage/import helpers, route/redirect stores, SSO-bound
          middleware and the jobs backend. Upload endpoints, image middleware, editor helpers,
          image imports and the content-import stager also resolve adapters at use time.
          Frontend site construction retains storage serve middleware. The cache compatibility
          helper delegates to this manager but has no production caller found. The CLI consumes
          deep helpers independently; no alternate runtime manager construction was found.
          Cited wiring tests cover route stores, not the complete consumer list; the S3
          integration suite runs only when GHOST_TEST_S3_AVAILABLE is 1.
        sources:
          - core/boot.js
          - core/server/lib/image/index.js
          - core/server/lib/lexical.js
          - core/server/lib/mobiledoc.js
          - core/server/api/endpoints/authentication.js
          - core/server/api/endpoints/images.js
          - core/server/api/endpoints/media.js
          - core/server/api/endpoints/files.js
          - core/frontend/web/site.js
          - core/frontend/web/middleware/handle-image-sizes.js
          - core/server/services/settings/settings-service.js
          - core/server/services/themes/validate.js
          - core/server/services/stats/index.ts
          - core/server/services/posts-public/index.ts
          - core/server/services/tags-public/index.ts
          - core/server/services/link-redirection/index.ts
          - core/server/services/post-scheduling/index.ts
          - core/server/auth/session/index.js
          - core/server/services/route-settings/index.js
          - core/server/services/custom-redirects/index.js
          - core/server/services/media-inliner/index.ts
          - core/server/services/oembed/service.js
          - core/server/services/jobs-service/index.ts
          - core/server/services/members/import-export/index.ts
          - core/server/services/content-import/index.ts
          - core/server/data/importer/index.js
          - core/server/data/importer/content-files.ts
          - core/server/data/importer/handlers/image.js
          - core/server/adapters/cache/index.js
          - bin/validate-adapters.ts
        tests:
          - test/unit/server/services/adapter-manager/route-settings-wiring.test.ts
          - test/integration/adapters/route-settings/adapter-manager-wiring.test.ts
      startup:
        summary: >-
          initCore calls synchronous init before subsequent core/service setup. Every init
          enumerates configured types/features, deduplicates type/class/serialized-options
          combinations and loads classes to call optional synchronous static validate. It
          neither constructs instances nor checks required instance methods; module loading
          can itself have effects. Unconfigured types are skipped. getAdapter has no init
          guard and import-time consumers can construct adapters independently of validation.
        sources:
          - core/boot.js
          - core/kernel/adapter-manager/adapter-manager.ts
          - core/kernel/adapter-manager/options.ts
          - core/server/services/post-scheduling/index.ts
          - core/server/api/endpoints/authentication.js
          - core/server/lib/image/index.js
        tests:
          - test/unit/kernel/adapter-manager/adapter-manager.test.ts
          - test/unit/server/services/adapter-manager/route-settings-wiring.test.ts
      lifetime:
        summary: >-
          Module and instance caches retain manager/adapters across same-process boots. init
          revalidates without clearing or refreshing instances. Cache keys include the full
          requested name and class, not options; switching away and back can reuse old state.
          clearCache only drops manager references and has no production call found; retained
          consumers, Node module cache and the Redis store singleton remain independent.
          Conditional S3 route-store integration tests clear the cache before rereading settings;
          they do not establish replacement of retained consumers or cleanup.
        sources:
          - core/kernel/adapter-manager/adapter-manager.ts
          - core/server/lib/image/index.js
          - core/server/services/jobs-service/index.ts
          - core/server/adapters/lib/redis/redis-store-factory.js
          - core/server/ghost-server.ts
        tests:
          - test/unit/kernel/adapter-manager/adapter-manager.test.ts
          - test/integration/adapters/route-settings/adapter-manager-wiring.test.ts
          - test/unit/server/adapters/lib/redis/redis-store-factory.test.ts
      configuration:
        summary: >-
          Selection/options are resolved on each call, but same-key cached instances keep
          construction-time state. Lookup paths are captured at module import in node_modules,
          internal, installed and content order, with duplicates removed. Normalization
          preserves legacy storage/scheduling config, local imports defaults and route/redirect
          paths. Feature objects merge over shared options; a string feature without its
          class config falls back to active. Config-resolution tests use stubs or test-only
          config mutation; they establish neither production hot reload nor changed options
          reaching an already retained adapter.
        sources:
          - core/kernel/adapter-manager/adapter-manager.ts
          - core/server/services/adapter-manager/adapter-paths.ts
          - core/kernel/adapter-manager/options.ts
          - core/server/services/adapter-manager/config.ts
          - core/shared/config/defaults.json
        tests:
          - test/unit/kernel/adapter-manager/adapter-manager.test.ts
          - test/unit/kernel/adapter-manager/options.test.ts
          - test/unit/server/services/adapter-manager/config.test.ts
          - test/unit/server/services/adapter-manager/adapter-paths.test.ts
          - test/integration/adapters/storage/imports-storage-config.test.ts
      resources:
        summary: >-
          The manager owns instance references, with no generic disposal contract. Nested
          adapters own memory/TTL cache state, Redis client listeners and pending reads/refreshes,
          filesystem work, S3 clients, scheduler queues/timers and jobs queues/recurring timers.
          Redis may reuse a process-wide store across feature instances. SchedulingDefault
          has no stop method; S3/Redis adapters expose no cleanup here. JobsService separately
          owns backend shutdown through GhostServer cleanup. clearCache invokes none of these
          owners and cannot drain active consumers or release custom-adapter resources.
        sources:
          - core/kernel/adapter-manager/adapter-manager.ts
          - core/kernel/adapter-manager/types.ts
          - core/server/adapters/cache/MemoryCache.js
          - core/server/adapters/cache/AdapterCacheMemoryTTL.js
          - core/server/adapters/lib/redis/AdapterCacheRedis.js
          - core/server/adapters/lib/redis/redis-store-factory.js
          - core/server/adapters/storage/LocalStorageBase.ts
          - core/server/adapters/storage/S3Storage.ts
          - core/server/adapters/route-settings/S3RouteSettingsStore.ts
          - core/server/adapters/redirects/S3RedirectsStore.ts
          - core/server/adapters/scheduling/scheduling-default.ts
          - core/server/adapters/jobs/InMemoryJobsBackend.ts
          - core/server/services/jobs-service/index.ts
          - core/boot.js
          - core/server/ghost-server.ts
        tests:
          - test/unit/server/adapters/lib/redis/redis-store-factory.test.ts
          - test/unit/server/adapters/jobs/in-memory-jobs-backend.test.ts
      failures:
        summary: >-
          getAdapter synchronously throws for unknown names, loader failures, invalid inheritance
          and missing required methods; constructor failures propagate. Invalid instances are
          not cached but can already have allocated resources, with no compensating cleanup.
          Even cached retrieval first resolves/loads and can fail. init aggregates load/static
          validation failures; earlier normalization/serialization failures escape directly.
          Static validation is synchronous and not awaited. No failed-init guard, rollback or
          manager retry exists; later calls retry uncached work using current config.
        sources:
          - core/kernel/adapter-manager/adapter-manager.ts
          - core/kernel/adapter-manager/loader.ts
          - core/server/services/adapter-manager/config.ts
          - core/kernel/adapter-manager/types.ts
        tests:
          - test/unit/kernel/adapter-manager/adapter-manager.test.ts
          - test/unit/server/services/adapter-manager/adapter-paths.test.ts
          - test/unit/server/services/adapter-manager/route-settings-wiring.test.ts
    unverified: []
    blockers:
      - >-
        Add same-manager contracts for options-only edits, class switching back, import-time
        path capture, loader failures on a cached key, repeated init and clearCache identity.
        Existing tests cover different-class selection and feature identity, not these retained
        state boundaries; normalization alone does not update a constructed adapter.
      - >-
        Characterize actual retained consumers across clearCache and same-process boot,
        especially shared image/public caches, scheduling/auth, SSO middleware and jobs.
        The jobs retained-consumer test stubs getAdapter, so it does not prove manager wiring.
      - >-
        Establish ownership and cleanup for scheduler timers, Redis shared connections and
        per-instance listeners, TTL timers, S3 clients and custom adapters before replacing
        instances. Preserve JobsService's existing backend shutdown owner; cache clearing is
        not disposal and must not silently strand active work or duplicate shared resources.
      - >-
        Cover construction or required-method validation failing after allocation, validation
        recovery, and boot failure with already retained adapters. Current static-validation
        tests do not assert absence of constructor/resource effects or real boot ordering.
      - >-
        Preserve root CommonJS/default interoperability, receiver requirements and the CLI's
        deep shared loader/registry contract. Keep required-method validation on construction
        distinct from optional static boot validation; neither proves remote readiness.
  automations:
    kind: directory
    disposition: migrate
    dependencyChecks: deferred
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    migration:
      complexity: complex
      modelImpact: fits
      reason: >-
        The retained poller fits, but its two subscriptions, timer and scheduler
        registration need failure cleanup before publication, while the API owns a separate
        eager repository. Preserve startup after jobs are ready and separate first-poll work
        from readiness. Retained API and analytics consumers must share the chosen
        composition; these are ownership and ordering changes, not evidence that the helper
        needs scheduler hooks.
      reviewedAt: f276513ba32b7114fd5cc4f7b02d3f82c0c31e3e
      sources:
        - core/server/services/automations/index.ts
        - core/server/services/automations/service.ts
        - core/server/services/automations/automations-api.ts
        - core/server/lib/soonest-timer.ts
        - core/boot.js
      dependencies:
        complexity: complex
        reason: >-
          The root exposes a poller while automations-api independently constructs repositories and
          reads config, Tinybird and settings. Polling reaches member-welcome-emails and
          email-analytics, while members, link tracking and endpoints retain the separately composed
          API. Root-only wiring requires unifying these composition paths and preserving late access
          to other services.
        preparation:
          - >-
            Turn the API/repository composition into a factory and inject it into the poller,
            members signup, analytics and link tracking instead of retaining a second eager graph.
          - >-
            Inject member lookup, welcome-email sending, analytics scheduling and live
            Tinybird/settings providers into polling and repository helpers; keep current
            configuration-read timing.
          - >-
            Wire scheduler helpers, logging and timer utilities at the root and use the existing
            kernel clock for legacy Moment operations.
        reviewedAt: 44ad405bff4a8700af2ed51f833ebc08d25dddff
        sources:
          - core/server/services/automations/index.ts
          - core/server/services/automations/service.ts
          - core/server/services/automations/automations-api.ts
          - core/server/services/automations/database-automations-repository.ts
          - core/server/services/automations/poll.ts
          - core/server/services/automations/welcome-email-automation-poll.ts
          - core/server/services/members/members-api/members-api.js
          - core/server/services/link-tracking/index.js
          - core/boot.js
    entryPoints:
      - automations/index.ts
      - automations/automations-api.ts
    notes: >-
      Manage both the polling instance and the separately composed API repository; preserve
      scheduling, automation notifications, legacy welcome runs and retained analytics/click consumers.
      Audited means investigated, not covered or ready to migrate.
    contracts:
      exports:
        summary: >-
          The root exports one named automationsService. Its receiver-dependent init returns
          synchronously; rescheduleAll and the test enqueue method return promises, but immediate
          enqueue completion means an event was dispatched, not that polls finished. The separate
          API exports receiver-independent async reads, graph edits, event notifications, step and
          recipient operations; requestPoll synchronously dispatches and returns undefined.
          Repository methods retain injected Knex/configuration in closures. API units assert
          selected validated arguments, count forwarding and add result identity with substituted
          repository methods. Add now validates the submitted status and action graph, including
          active email content, before repository insertion; units reject selected invalid graphs
          and content without calling the repository. Admin HTTP and repository integration
          assert that an active automation retains its submitted actions and edges on reread.
          The signed polling HTTP test asserts 204 and one dispatch through
          a dispatch stub, not completed work or the complete export/receiver contract.
        sources:
          - core/server/services/automations/index.ts
          - core/server/services/automations/service.ts
