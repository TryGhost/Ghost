          - test/unit/server/services/email-suppression-list/mailgun-email-suppression-list.test.ts
          - test/e2e-api/admin/members.test.js
    unverified: []
    blockers:
      - >-
        Partial init (a failing second subscription) is not characterized. Each init duplicates
        listeners (pinned as incidental) and there is no unsubscribe or production drain. Pin
        concurrent event/removal behavior and separate persistence/member-write failures before
        introducing disposal or changing event ordering.
      - >-
        Resolve the provider-to-root failure contract: MailgunClient resolves false for
        unconfigured or failed deletion and removeEmail ignores it, reporting success (pinned
        through the real client). MemberAccountService also ignores a false root result and
        reenables mail, unlike the Admin endpoint. These need an explicit decision, not an
        accidental change hidden inside lifecycle migration.
      - >-
        Invalid read/bulk inputs (non-string or non-array addresses) are not characterized.
      - >-
        Pin configuration changes between the three provider removals, malformed provider
        configuration and the fallback domain (removal targets only the primary domain).
        Establish timeout, retry/redirect, sockets and pending-operation ownership for the
        installed SDK before promising safe shutdown.
      - >-
        Duplicate rows keeping their original reason/time, database failures beyond insert and
        logging failures are not characterized. No shared transaction makes provider removal,
        suppression deletion and member reenabling atomic.
