          - core/server/services/link-tracking/index.js
          - core/server/services/link-tracking/link-click-tracking-service.js
          - core/server/services/link-redirection/index.ts
          - core/server/services/email-service/email-service-wrapper.js
          - core/server/services/member-welcome-emails/member-welcome-email-renderer.js
        tests:
