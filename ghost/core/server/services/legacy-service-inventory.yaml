        tests:
          - test/e2e-api/admin/member-custom-fields.test.ts
          - test/e2e-api/members/custom-fields.test.ts
      configuration:
        summary: >-
          Limit callbacks read members:metafields:maxDefinitions when adding custom fields or
          planning value writes; the shipped fallback is captured and validated at import.
          The parser accepts nonnegative safe integers/numeric strings, including zero, and
          falls back to the shipped 100 for invalid input. Adding counts the namespace's active and
          archived rows; lowering the limit does not remove them. HTTP asserts zero/string/fallback and
          next-request changes using test config mutation, not production hot reload of the
          immutable config tree. Constructors retain Knex; schema/type/key rules are imported.
        sources:
          - core/server/services/members-metafields/index.ts
          - core/server/services/members-metafields/config.ts
          - core/server/services/members-metafields/custom-fields.ts
          - core/server/services/members-metafields/definitions-service.ts
