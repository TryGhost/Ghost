      lifetime:
        summary: >-
          Truthy lastSeenAtUpdater makes later init a no-op, retaining its dependencies, cache and
          anonymous subscriptions across same-process boots. Replacing wrapper properties does not
          retarget subscribed closures. The members getter observes the current API and db.knex is
          accessed per operation. Cache clear drops IDs only; it neither changes listeners nor resets
          the remembered day. Cache membership expires lazily when checked after the current day
          changes. Tests pin cache clearing/rollover and direct-root daily suppression, not wrapper
          identity, replacement, repeated boot or in-flight shutdown.
        sources:
