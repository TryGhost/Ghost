          - test/integration/services/last-seen-at-updater.test.js
      failures:
        summary: >-
          Root initialization throws synchronously. Failure before updater publication permits retry;
          subscription failure leaves a truthy updater and potentially partial listeners that later
          init will not repair. Page/click transaction failures evict the cached ID and reject; cache
          checks and preliminary timezone calculations can fail before that catch. Event handlers
          catch/log errors, and DomainEvents independently catches rejected handlers. Direct updater
          calls reject. Existing error-listener tests assert true without logging assertions; the
          retry test checks a second invocation after a synchronous fake transaction throw but does
          not await assert.rejects. Real comment HTTP pins same-day no-op, not concurrent/mixed-date
          writes, partial persistence or notification-before-event failure.
        sources:
