          - test/unit/server/services/link-tracking/link-click-tracking-service.test.js
          - test/unit/server/services/member-welcome-emails/member-welcome-email-renderer.test.js
          - test/integration/services/email-service/batch-sending.test.js
          - test/unit/server/services/automations/database-automations-repository.test.ts
      resources:
        summary: >-
          Owns a RedirectEvent subscription, memoization cache and untracked async work; owns no
          database pool, timer or HTTP agent. Shared redirection owns its cache/listener, the
          default automations module imports shared request agents, and MembersEvents owns
          last-seen effects. No disposer or production drain is registered. Newsletter URL
          creation inserts a redirect then links its post separately; clicks without complete
          automation identity use a standalone insert. Automation clicks share one transaction
          with recipient/count updates, scheduling MemberLinkClickEvent only after executionPromise
          fulfillment. Tests enforce callback/options wiring and simulated commit/rollback delivery;
          a single-connection SQLite test proves lookup connection reuse, while automation SQL
          tests prove analytics rollback separately from raw click persistence.
        sources:
          - core/server/services/link-tracking/index.js
          - core/server/services/link-tracking/link-click-tracking-service.js
          - core/server/services/link-tracking/link-click-repository.js
          - core/server/services/link-tracking/post-link-repository.js
          - core/server/services/link-redirection/link-redirect-repository.js
          - core/server/services/automations/automations-api.ts
          - core/server/services/automations/database-automations-repository.ts
