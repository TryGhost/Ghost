          - test/unit/shared/settings-cache.test.js
          - test/e2e-api/admin/settings.test.js
      resources:
        summary: >-
          Cache initialization owns common model/calculated subscriptions and borrows the manager
          adapter; its get/set/reset/keys usage is synchronous, including unawaited reset. Defaults
          initialization manages the shared Knex pool, not an isolated settings connection. Each
          BREAD owns mail/token/link helpers without stop/drain; token rows are cleaned by members
          jobs when they find rows older than 24 hours. Verification creation, mail, token usage and
          setting writes have no shared transaction. Model multi-setting edit runs row operations
