        - core/server/services/offers/offers-module.js
        - core/frontend/web/site.js
        - core/server/services/members/api.js
        - core/boot.js
      dependencies:
        complexity: complex
        reason: >-
          Root composition is small, but external dependencies remain in repository/API/module
          layers and in static domain value creation: OfferCode calls slugify and the shared
          ValueObject imports lodash equality. Injecting only the repository and event bus will not
          satisfy the rule. Frontend redirects and Members capture the resulting objects, so helper
          preparation must preserve entity/event identity and the completed API/redirect graph.
        preparation:
          - >-
            Inject DomainEvents, reporting/logging and repository query transforms from index.ts,
            preserving event publication after transaction completion.
          - >-
            Give slug normalization and value comparison an explicit construction seam, or replace
            their narrow uses with characterized local behavior; avoid introducing a module-global
            dependency setter for static factories.
          - >-
            Publish one API/redirect graph after its initial load and adapt retained
            frontend/Members consumers; subscription cleanup belongs in the separate lifecycle work.
        reviewedAt: 44ad405bff4a8700af2ed51f833ebc08d25dddff
        sources:
          - core/server/services/offers/service.js
          - core/server/services/offers/offers-module.js
          - core/server/services/offers/offer-bookshelf-repository.js
          - core/server/services/offers/application/offers-api.js
          - core/server/services/offers/domain/models/offer-code.js
          - core/server/services/offers/domain/models/shared/value-object.js
          - core/frontend/web/site.js
          - core/server/services/members/api.js
    entryPoints:
      - offers/index.js
    notes: >-
      Preserve offers API, frontend redirects and retained members consumers. Repeated init
      rebuilds composition and adds domain-event listeners; redirect publication and coupon
      side effects are separate from database transaction completion.
    contracts:
      exports:
        summary: >-
          The CommonJS index forwards one mutable object with receiver-dependent async init,
          initially null api and a middleware getter. Before init the getter throws through
          undefined redirectManager; afterward it returns that manager's bound handler. API
          methods are async and receiver-dependent, returning DTOs, arrays or null for absent
          offers. Deep modules expose constructible implementation/value classes and event
          identities. There is no reset/shutdown/readiness API. Root units pin the shape and the
          pre-init throw; consumer units pin per-request endpoint reads with their receivers.
        sources:
          - core/server/services/offers/index.js
          - core/server/services/offers/service.js
          - core/server/services/offers/offers-module.js
          - core/server/services/offers/application/offers-api.js
          - core/server/services/offers/application/offer-mapper.ts
          - core/server/web/shared/dynamic-redirect-manager.js
        tests:
