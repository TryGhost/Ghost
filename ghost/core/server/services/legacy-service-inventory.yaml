          - test/unit/server/services/link-tracking/link-click-repository.test.js
          - test/unit/server/services/link-tracking/link-click-tracking-service.test.js
          - test/unit/server/services/automations/database-automations-repository.test.ts
      failures:
        summary: >-
          Missing members skip insert/analytics, optionally reporting to Sentry. Lookup/insert
          and direct subscriber errors reject; DomainEvents catches/logs handler failures so
          HTTP redirects do not wait for or report failed click work. Post-commit synchronous
          dispatch errors are captured; a rejected executionPromise suppresses delivery, while nontransactional
          dispatch throws after insertion. URL creation failures can leave an unlinked redirect;
          email LinkReplacer catches replacement errors and returns original HTML without undoing
          writes. Invalid old-link filters become BadRequestError; other URL/query failures reject,
          while bulk model errors can become unsuccessful result data. Units pin selected errors
          and simulated delivery; complete consumer/transaction failure boundaries remain open.
        sources:
          - core/server/services/link-tracking/index.js
          - core/server/services/link-tracking/link-click-tracking-service.js
          - core/server/services/link-tracking/link-click-repository.js
          - core/server/services/link-tracking/post-link-repository.js
          - core/server/services/link-redirection/link-redirects-service.js
          - core/server/lib/link-replacer.js
          - core/server/models/base/plugins/bulk-operations.js
          - package.json
        tests:
          - test/unit/server/services/link-tracking/index.test.ts
          - test/unit/server/services/link-tracking/link-click-repository.test.js
          - test/unit/server/services/link-tracking/link-click-tracking-service.test.js
          - test/unit/server/services/link-tracking/post-link-repository.test.js
    unverified: []
    blockers:
      - >-
        Pin root shape, repository publication, missing redirect prerequisite, successful repeat
        init and retained dependency identity. Define ownership for subscription disposal, bus
        reset, partial initialization and pending clicks during shutdown; fulfilled init promises
        and implementation guards currently survive independently of event-bus listeners.
      - >-
        Characterize UUID cache size/lifetime, cached null/deleted/changed members, config toggles
        and lookup reuse across transactions. Default-disabled caching still ignores transaction
        options when enabled; current tests reuse the same transaction and do not establish isolation.
      - >-
        Exercise the real automation redirect through raw click insertion, recipient analytics,
        commit and emitted last-seen work, including rollback and duplicate clicks. Explicit/manual
        rollback can fulfill executionPromise under Knex defaults; cover that separately from
        transaction callback rejection. Existing fake
        transaction tests prove arguments/rejection and repository SQLite tests prove analytics
        alone. Strengthen newsletter click assertions with actual member/redirect filters and
        row identity; current getAll calls pass ignored member_id/link_id options.
      - >-
        Pin partial URL-creation writes, renderer fallback, bulk error results, click counts and
        edit-time ordering/reset behavior through real consumers. PostLinkRepository's sole unit
        checks result shape; Admin browse uses broad ID/URL/count matchers. Preserve current
        caller-owned tracking gates, URL encoding and public redirect continuation on click failure.
      - >-
        Record data-object quirks before migration: ClickEvent without id overwrites its generated
        event_id with undefined, and repository getAll reconstructs no saved event ID/timestamp.
        save replaces event_id after persistence; no constructor/getAll assertion pins these boundaries.
  machine-payments:
    kind: directory
    disposition: migrate
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    migration:
      complexity: complex
      modelImpact: fits
      reason: >-
        Unify boot and request-owned initialization, publish after adapter setup and
        best-effort address prewarming, and decide the change from permanently cached
        startup rejection to explicit retry. Keep pre-init false guards and live enablement
        deliberate. One retained service already supports disabled operation; per-rail
        availability, lazy SDKs and provider caches can stay inside it.
      reviewedAt: f276513ba32b7114fd5cc4f7b02d3f82c0c31e3e
      sources:
        - core/server/services/machine-payments/index.js
        - core/server/services/machine-payments/service.ts
        - core/server/services/machine-payments/adapters/x402-adapter.ts
        - core/frontend/web/site.js
        - test/integration/services/machine-payments/orchestration.test.js
      dependencies:
        complexity: complex
        reason: >-
          The root composes a graph, but implementations still supply hidden defaults for models,
          settings, labs and Stripe clients. MPP and x402 load SDKs lazily, and Stripe factories
          observe credential changes. Moving imports alone would change request-time loading and
          live configuration or leave alternative composition paths behind.
        preparation:
          - >-
            Make production dependencies explicit across the orchestrator, content loader, deposit
            store and payment recorder; inject model/currency lookup and live settings providers
            from the root.
          - >-
            Supply root-owned lazy SDK loaders through the existing x402 runtime/config and MPP
            factory seams, retaining first-use loading and credential-keyed client refresh.
          - >-
            Inject logging and shared eligibility functions without capturing dynamic enablement as
            a boot-time boolean.
        reviewedAt: 44ad405bff4a8700af2ed51f833ebc08d25dddff
        sources:
          - core/server/services/machine-payments/index.js
          - core/server/services/machine-payments/service.ts
          - core/server/services/machine-payments/content-loader.ts
          - core/server/services/machine-payments/adapters/mpp-adapter.ts
          - core/server/services/machine-payments/adapters/x402-adapter.ts
          - core/server/services/machine-payments/stripe/deposit-address-store.ts
          - core/server/services/machine-payments/stripe/payment-recorder.ts
          - core/server/services/machine-payments/README.md
    entryPoints:
      - machine-payments/index.js
    notes: >-
      Preserve the boot/request initialization boundary, per-rail availability and one-request
      content unlock. Root lifecycle, credential rotation, provider resources and failures after
      settlement remain migration blockers despite substantial deep implementation coverage.
    contracts:
      exports:
        summary: >-
          CommonJS exports an eager wrapper instance with public service initially null, init,
          isEnabled, isPurchasable and async challengeOrFulfill, plus the wrapper constructor.
          Methods require their receiver. init resolves the implementation; availability methods
          return false until initialization completes, while challengeOrFulfill awaits init itself.
          The deep class exposes synchronous eligibility; getTerms resolves payment terms and
          challengeOrFulfill resolves a Fetch Response. Adapters expose canHandle/challenge/fulfill.
          Deep tests assert
          402 challenges, 200 paid markdown with private/no-store, 403 rejection and 503 unavailable
          responses; they do not pin root export shape, receiver or publication contracts.
        sources:
          - core/server/services/machine-payments/index.js
          - core/server/services/machine-payments/service.ts
          - core/server/services/machine-payments/types.ts
        tests:
          - test/unit/server/services/machine-payments/service.test.ts
          - test/unit/server/services/machine-payments/adapters.test.ts
      construction:
        summary: >-
          First init creates a deposit-address store, payment recorder, event repository retaining
          models.MachinePaymentEvent, content loader retaining the URL facade, pricing, MPP and
          x402 adapters. It awaits x402 config validation, includes that adapter only when ready,
          then publishes MachinePaymentsService with settings/labs facades and a Stripe-status
          callback. Creation occurs even when machine payments is disabled. ContentLoader and
          the store lazily retain Post/Settings models. No other production deep construction was
          found; tests construct these classes directly with fake providers and, separately, real
          database models, so they do not establish the wrapper's composition or readiness.
        sources:
          - core/server/services/machine-payments/index.js
          - core/server/services/machine-payments/content-loader.ts
          - core/server/services/machine-payments/stripe/deposit-address-store.ts
          - core/server/services/machine-payments/events/machine-payment-event-repository.ts
        tests:
          - test/integration/services/machine-payments/content-loader.test.js
          - test/integration/services/machine-payments/orchestration.test.js
      consumers:
        summary: >-
          Boot initializes the root; each site app retains it in machinePaymentsService. The
          entry markdown controller obtains that root from the app, checks isPurchasable and
          supplies render callbacks to challengeOrFulfill only on explicit .md paid/tier requests.
          It copies Fetch status/headers/body to Express; already-authorized members never receive
          their full body as an unpaid preview. HTML ghost_head uses shared eligibility directly,
          not the initialized root, for markdown alternate links. LLMS discovery uses its own
          public-preview path, not this service. Frontend HTTP tests cover delegation, rendered
          markdown/header copying, previews and HTML credential isolation but stub fulfillment;
          controller units cover the authorized-member refusal with a fake root.
        sources:
          - core/boot.js
          - core/frontend/web/site.js
          - core/frontend/services/routing/controllers/entry/markdown.ts
          - core/frontend/services/routing/controllers/entry.ts
          - core/frontend/helpers/ghost_head.js
          - core/shared/machine-payments.ts
          - core/frontend/services/llms/service.js
        tests:
          - test/e2e-frontend/machine-payments-markdown.test.js
          - test/unit/frontend/services/routing/controllers/entry.test.ts
          - test/e2e-frontend/llms-routes.test.js
      startup:
        summary: >-
          Boot awaits init in its service group after Stripe initialization. x402 init validates
          and captures config without loading its runtime. Root service publication precedes
          enabled-only prewarming of both configured network addresses, even if x402 was excluded;
          Promise.allSettled waits for both and logs rejections before opening availability gates.
          Disabled boot still constructs the graph, then request-time enablement can use it without
          prewarming. MPP loads mppx on request; x402 loads its runtime on first dispatch, which can
          be challenge or fulfill. Frontend HTTP setup boots Ghost, but tests do not isolate
          concurrent root init, prewarm completion/failure, partial publication or request-init races.
        sources:
          - core/boot.js
          - core/server/services/machine-payments/index.js
          - core/server/services/machine-payments/adapters/mpp-adapter.ts
          - core/server/services/machine-payments/adapters/x402-adapter.ts
        tests:
          - test/unit/server/services/machine-payments/adapters.test.ts
          - test/e2e-frontend/machine-payments-markdown.test.js
      lifetime:
        summary: >-
          Concurrent root init calls share one stored promise; success retains one graph and later
          init resolves it, while a rejected promise prevents retry. No reset/stop/dispose exists.
          The store retains addresses by network and deduplicates only same-instance in-flight
          creation. Store/recorder clients refresh on secret-key change when needed; MPP builds
          a Stripe client each run but its retained Mppx cache key omits that client's credentials.
          MPP keeps one replay store across runtime rebuilds. x402 attempts configuration once,
          retains runtime/facilitator/scheme and bounds route apps at 128; its cache key includes
          route, recipient, price, network and challenge/fulfill mode, not description/mimeType.
          Tests assert same-network deduplication, Mppx reuse, lazy x402 loading and LRU eviction
          with fake runtimes, not root restart, rotation, cross-process races or cleanup.
        sources:
          - core/server/services/machine-payments/index.js
          - core/server/services/machine-payments/adapters/mpp-adapter.ts
          - core/server/services/machine-payments/adapters/x402-adapter.ts
          - core/server/services/machine-payments/stripe/deposit-address-store.ts
          - core/server/services/machine-payments/stripe/payment-recorder.ts
        tests:
          - test/unit/server/services/machine-payments/adapters.test.ts
          - test/unit/server/services/machine-payments/deposit-address-store.test.ts
      configuration:
        summary: >-
          Eligibility reads labs, machine_payments_enabled === true, llms_enabled !== false and
          Stripe connectivity each call. Pricing reads current settings, validates positive safe
          integer minor units, and uses configured currency, first active paid tier currency, then
          USD; default amount is 100. SPT uses configured fiat; Tempo maps the same minor-unit
          amount to USDC without FX, while x402 accepts USD only. MPP reads current profile/secret
          settings and config getters
          per run; x402 captures a feature-local parsed config once, defaults to enabled Base
          mainnet/base/HTTPS facilitator, and rejects unsupported networks and the known mainnet
          pairing with the x402.org testnet facilitator.
          Stripe preview clients read endpoint overrides on construction. Config's validated tree
          is immutable; test stubs/set/reset do not imply production reload. Deposit addresses
          persist as a network map with legacy strings treated as Tempo-only. Deep tests cover
          selected gates, configured pricing, adapter config and endpoint options; Admin HTTP
          tests reject amount 0 and two-letter currency, not every default/setting transition.
        sources:
          - core/shared/machine-payments.ts
          - core/shared/config/SCHEMA.md
          - core/shared/config/defaults.json
          - core/server/services/machine-payments/pricing.ts
          - core/server/services/machine-payments/service.ts
          - core/server/services/machine-payments/adapters/mpp-adapter.ts
          - core/server/services/machine-payments/adapters/x402-adapter.ts
          - core/server/services/machine-payments/stripe/stripe-client-options.ts
          - core/server/services/machine-payments/stripe/deposit-address-store.ts
          - core/server/models/settings.js
          - core/server/data/schema/default-settings/default-settings.json
          - core/server/api/endpoints/utils/serializers/input/settings.js
        tests:
          - test/unit/server/services/machine-payments/service.test.ts
          - test/unit/server/services/machine-payments/eligibility.test.ts
          - test/unit/server/services/machine-payments/adapters.test.ts
          - test/unit/server/services/machine-payments/stripe-client-options.test.js
          - test/unit/server/services/machine-payments/deposit-address-store.test.ts
          - test/integration/services/machine-payments/content-loader.test.js
          - test/integration/services/machine-payments/orchestration.test.js
          - test/e2e-api/admin/settings.test.js
      resources:
        summary: >-
          The graph borrows database models, settings/labs and URL facades; owns address/in-flight
          maps, provider clients, MPP replay memory and x402 route apps. Requests can mint/persist
          addresses, call payment providers, load full published content, persist events and record
          crypto PaymentIntents; no member session or tier is granted. Installed Stripe uses
          shared keep-alive agents and default request timeouts; x402's per-app middleware starts
          facilitator discovery, with SDK fetch deadlines/retry timers; MPP's in-memory replay
          map has no expiry/size bound and Tempo uses RPC clients. Ghost supplies no cancellation,
          drain or cleanup registration for these resources. Event rows are append-only through
          the model, unique by protocol/reference, cascade with posts and enter optional backups.
          Real-DB tests prove sequential duplicate reuse and different-protocol separation, not
          concurrent unique-conflict recovery, SDK resources, restart replay or shutdown.
        sources:
          - core/server/services/machine-payments/index.js
          - core/server/services/machine-payments/content-loader.ts
          - core/server/services/machine-payments/adapters/mpp-adapter.ts
          - core/server/services/machine-payments/adapters/x402-adapter.ts
          - core/server/services/machine-payments/stripe/deposit-address-store.ts
          - core/server/services/machine-payments/stripe/payment-recorder.ts
          - core/server/services/machine-payments/events/machine-payment-event-repository.ts
          - core/server/models/machine-payment-event.js
          - core/server/data/schema/schema.js
          - core/server/data/exporter/table-lists.js
          - core/boot.js
        tests:
          - test/unit/server/services/machine-payments/deposit-address-store.test.ts
          - test/unit/server/services/machine-payments/adapters.test.ts
          - test/integration/services/machine-payments/content-loader.test.js
          - test/integration/services/machine-payments/orchestration.test.js
      failures:
        summary: >-
          Raw eligibility and full-content deliverability precede settlement; full load precedes
          fulfill despite older comments saying otherwise. First matching adapter handles credentials.
          Fulfill errors become 403 for statusCode 403 or logged 503 otherwise. Ledger save follows
          settlement: failure logs/returns 503; duplicate returns 403 before recorder/rendering.
          Recording errors log and still serve content; ledger rows are not updated with later
          recorder ids. Challenges run allSettled and use any returned response, else 503; x402
          logs/returns null on challenge failure, and MPP can retain SPT after address failure.
          Pricing, raw/full content lookup, canHandle and render exceptions propagate. No rollback
          joins provider settlement, database ledger and response delivery. Source also caches a
          new address before persistence and marks x402 runtime loaded before constructing its
          facilitator/scheme. Store/recorder update their key marker before constructing a replacement
          Stripe client; a factory throw can leave the old client associated with the new marker.
          These are untested source-only failure edges. Tests assert null-content rejection, replay
          refusal, invocation order,
          unavailable challenge and selected adapter failures, not these partial-failure channels.
        sources:
          - core/server/services/machine-payments/service.ts
          - core/server/services/machine-payments/content-loader.ts
          - core/server/services/machine-payments/adapters/mpp-adapter.ts
          - core/server/services/machine-payments/adapters/x402-adapter.ts
          - core/server/services/machine-payments/stripe/deposit-address-store.ts
          - core/server/services/machine-payments/events/machine-payment-event-repository.ts
        tests:
          - test/unit/server/services/machine-payments/service.test.ts
          - test/unit/server/services/machine-payments/adapters.test.ts
          - test/unit/server/services/machine-payments/content-loader.test.ts
          - test/integration/services/machine-payments/orchestration.test.js
    unverified: []
    blockers:
      - Pin root export/receiver behavior, concurrent boot/request init, prewarm gating, disabled boot then enablement, partial publication and retained rejection before changing initialization.
      - Resolve and test MPP retaining an old Stripe client when only active credentials change; characterize failed store/recorder client replacement, address reuse across account changes and captured x402 config versus live settings.
      - Resolve and test address caching before failed persistence, two-network or multi-instance persistence races, provider failure retry and x402 partial runtime construction.
      - Enforce awaited load/settle/ledger/record sequencing with deferred failures; current callOrder assertions prove invocation order, not completion barriers. Cover charged-but-no-content, ledger failure, recorder continuation, render failure and durable replay across restart/concurrent requests.
      - Define ownership and bounds for MPP replay memory, cached apps, SDK requests/retry timers and shared agents, including cancellation/drain on shutdown and graph replacement.
      - Add a coherent real-root HTTP/provider-fake/real-database contract for paid posts and pages, mixed tiers, signed-in previews, pricing/default currency, both-credential precedence and provider failures; existing HTTP tests stub fulfillment and deep orchestration tests stub persistence/providers.
  members:
    kind: directory
    disposition: review
    dependencyChecks: deferred
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    migration:
      complexity: complex
      modelImpact: may-change
      reason: >-
        The root retains its API and verification trigger but rebuilds SSR, integrity-token
        and import/export collaborators on each init. Other services capture its repository
        during the same boot group, and nested constructors install listeners. Decide which
        graph becomes ready once, which bindings need explicit refresh, and how failed
        composition unwinds before applying one retained instance.
      reviewedAt: f276513ba32b7114fd5cc4f7b02d3f82c0c31e3e
      sources:
        - core/server/services/members/service.js
        - core/server/services/members/api.js
        - core/server/services/members/members-api/members-api.js
        - core/server/services/members/members-api/services/payments-service.js
        - core/boot.js
      dependencies:
        complexity: complex
        reason: >-
          Composition is spread across service.js, api.js, the nested Members API, import/export and
          jobs; repositories, middleware and helpers still import models, database, events,
          configuration and other services directly. Members captures ready Offers, attribution,
          email-address and metafields, while Stripe/Gifts/Comments retain reciprocal deferred
          access. A root-only DI migration must distinguish these call-time edges from actual
          initialization prerequisites and preserve independently constructed token providers and
          request helpers.
        preparation:
          - >-
            Refactor nested API, import/export and job composition to accept explicit dependencies
            from the root, then remove direct database/model/config/event imports from
            implementations in bounded slices.
          - >-
            Record and test the actual readiness graph for Stripe, Gifts, Comments, Offers,
            newsletters, attribution, suppression and metafields; preserve lazy collaborators
            instead of eagerly resolving every service.
          - >-
            Separate shared token, filtering and verification support from boot-owned state where
            evidence supports it, preserving external constructors and deep helper consumers before
            changing the public root.
        reviewedAt: 44ad405bff4a8700af2ed51f833ebc08d25dddff
        sources:
          - core/server/services/members/service.js
          - core/server/services/members/api.js
          - core/server/services/members/members-api/members-api.js
          - core/server/services/members/members-api/repositories/member-repository.js
          - core/server/services/members/import-export/index.ts
          - core/server/services/members/jobs/index.js
          - core/server/services/members/middleware.js
          - core/server/services/stripe/stripe-service.js
          - core/boot.js
