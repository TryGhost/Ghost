          - core/server/services/tinybird-sync/tinybird-sync-service.ts
          - core/server/services/tinybird-sync/get-ingest-config.ts
          - core/server/services/jobs-service/cron.ts
          - core/server/services/jobs-service/jobs-service.ts
        tests:
          - test/unit/server/services/tinybird-sync/index.test.ts
          - test/unit/boot/init-background-services.test.ts
      lifetime:
        summary: >-
          The scheduled flag is set before registration; a second call rejects, while a rejected
          scheduleRecurring clears it for retry. Successful registration has no reset. Default
          backend shutdown removes recurring timers, so same-process restart can retain a true
          root flag without a timer; direct sync calls also have no overlap guard. Scheduled
          deliveries are serialized only as strongly as the selected jobs backend supports,
          per process for the default backend. Watermarks persist by table_name alone, survive
          new closures and are not reset for changed site/destination. SQLite tests assert
          cursor ties across batches/later invocations; factory tests cover completed duplicate
          registration and backend rejection/retry, not pending races, root restart or overlap.
        sources:
          - core/server/services/tinybird-sync/tinybird-sync-service.ts
          - core/server/services/tinybird-sync/sync-table-to-tinybird.ts
          - core/server/services/jobs-service/index.ts
          - core/server/services/jobs-service/jobs-service.ts
          - core/server/adapters/jobs/InMemoryJobsBackend.ts
          - core/server/data/schema/schema.js
        tests:
          - test/unit/server/services/tinybird-sync/index.test.ts
          - test/unit/server/services/tinybird-sync/sync-table-to-tinybird.test.ts
      configuration:
        summary: >-
          scheduleJob and sync reread the captured config/settings facades. A pass retains
          its resolved endpoint, auth and site. Ingest requires a parseable
          tracker URL containing /.ghost/analytics/, a nonempty sync auth key and a configured
          stats.id or settings site UUID. It rewrites the path and remaps development loopback
          hosts to the gateway. Factory limits are 5000 rows, 9 MiB/1000 messages per chunk and
          a five-minute request signal; each table fixes its cutoff at now minus sixty seconds.
          Helper tests assert selected URL rewrites, site fallback and invalid URL/key rejection.
          SQLite/fake-fetch tests assert selected payload/cursor/chunk behavior; timeout coverage
          spies on AbortSignal.timeout only. Fixture-field inclusion tests are not an exact
          allowlist assertion. Immutable config and captured fetch/knex are not hot reload tests.
        sources:
          - core/server/services/tinybird-sync/index.ts
          - core/server/services/tinybird-sync/get-ingest-config.ts
          - core/server/services/tinybird-sync/tinybird-sync-service.ts
          - core/server/services/tinybird-sync/sync-table-to-tinybird.ts
          - core/server/lib/db-types/date.ts
          - core/shared/config/loader.ts
        tests:
          - test/unit/server/services/tinybird-sync/get-ingest-config.test.ts
          - test/unit/server/services/tinybird-sync/index.test.ts
          - test/unit/server/services/tinybird-sync/sync-table-to-tinybird.test.ts
          - test/unit/server/services/tinybird-sync/sync-targets.test.ts
      resources:
        summary: >-
          The root borrows knex and native global fetch, owns only closure state, and supplies
          jobs-service with recurring work. The default backend owns timers/queues and bounded
          draining; boot registers its shutdown, which does not abort active handlers after
          its deadline. Sync has no stop signal or disposer and creates timeout signals per
          upload. Successful fetch responses are not explicitly consumed/cancelled; transport
          lifetime remains with native fetch. Cursor writes use shared database connections.
          Generic backend tests assert recurring ticks stop and a released delivery can finish
          after shutdown; they do not exercise an upload or cursor write during shutdown.
          Sync tests use fake fetch and establish request contents/options, not transport cleanup.
        sources:
          - core/server/services/tinybird-sync/index.ts
          - core/server/services/tinybird-sync/sync-table-to-tinybird.ts
          - core/server/services/jobs-service/jobs-service.ts
          - core/server/adapters/jobs/InMemoryJobsBackend.ts
          - core/boot.js
        tests:
          - test/unit/server/adapters/jobs/in-memory-jobs-backend.test.ts
          - test/unit/server/services/tinybird-sync/index.test.ts
          - test/unit/server/services/tinybird-sync/sync-table-to-tinybird.test.ts
      failures:
        summary: >-
          Incomplete ingest config resolves without work. Individual table
          failures settle independently, then log without rejecting sync; a failed table can
          therefore coexist with a completed recurring delivery and retry on a later tick.
          Config or final error-logging exceptions still reject. Registration failure
          propagates and resets the flag, but logging/random exceptions after setting it
          and before the try do not. Boot catches scheduling failures only once reached.
          A helper advances its watermark only after all batch chunks succeed; accepted chunks
          can replay if a later chunk or watermark write fails. There is no upload/database
          transaction, locking, tombstone sync or guarantee against commits delayed beyond the
          safety lag. SQLite tests assert a missing table is logged without rejecting and a
          503 preserves the prior last_synced_id; they do not cover partial-chunk/write failures,
          long transactions, concurrent passes, native aborts or provider acceptance.
        sources:
          - core/server/services/tinybird-sync/tinybird-sync-service.ts
          - core/server/services/tinybird-sync/sync-table-to-tinybird.ts
          - core/server/services/jobs-service/jobs-service.ts
          - core/server/adapters/jobs/InMemoryJobsBackend.ts
          - core/boot.js
        tests:
          - test/unit/server/services/tinybird-sync/index.test.ts
          - test/unit/server/services/tinybird-sync/sync-table-to-tinybird.test.ts
    unverified: []
    blockers:
      - >-
        Add real-root and boot lifecycle coverage before changing eager composition. Preserve
        captured knex/fetch and receiver-independent exports. Resolve successful scheduling
        state surviving cleared backend timers on restart, pending registration/shutdown races,
        and startup being skipped after an earlier background-service failure.
      - >-
        Cover pass overlap, per-process versus cross-process serialization, late commits beyond
        the safety lag, updates around cursor ties and partial delivery/watermark write failure.
        Define replay, remote deduplication and deletion expectations; SQLite/fake-fetch cursor
        tests do not establish MySQL concurrency or exactly-once delivery.
      - >-
        Define progress when endpoint/site configuration changes because watermarks are keyed
        only by table. Pin missing-site/invalid-override fallback, exact field allowlists for
        both targets, changing cutoffs across passes, production batch/byte limits and a single
        oversized event. Current chunking sends an individually oversized line rather than
        rejecting it.
      - >-
        Cover upload cancellation and cursor writes during bounded shutdown, response-body
        disposal, real request deadlines and native-fetch failures. Retain table-failure
        continuation and registration retry, including exceptions before its protected await;
        current units do not prove provider ingestion or clean resource release.
  update-check:
    kind: directory
    disposition: review
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    migration:
      complexity: complex
      modelImpact: fits
      reason: >-
        Ownership remains undecided between a standalone update-check capability and
        Notifications-owned remote notice ingestion. Per-invocation construction does not
        establish that this is non-service support. Either owner can expose a repeatable
        check operation without changing defineService; preserve live configuration,
        persisted due-date gating and caller-specific error policy when choosing its lifetime.
      reviewedAt: 59c26cfc276946844e0694416ead8549eb637479
      sources:
        - core/server/services/update-check/index.js
        - core/server/services/update-check/update-check-service.js
        - core/server/services/update-check/jobs/update-check-job.ts
        - core/server/services/notifications/notifications.js
        - core/server/services/jobs-service/register-job-handlers.ts
        - core/boot.js
      dependencies:
        complexity: complex
        reason: >-
          The root assembles settings, users and notifications API operations, request and
          mail collaborators. Choose the capability owner and composition boundary before
          moving those dependencies; creating a new graph per invocation does not justify
          relocation to server/lib or skipping initialization assessment.
        preparation:
          - >-
            Decide whether update-check remains a separate integration or becomes private
            Notifications support, keeping request policy, group filtering and alert delivery
            with that owner and job registration in boot.
          - >-
            Preserve per-invocation configuration and error modes, live due-date reads and
            mail dependency readiness; keep repeated checking separate from initialization.
        reviewedAt: 59c26cfc276946844e0694416ead8549eb637479
        sources:
          - core/server/services/update-check/index.js
          - core/server/services/update-check/update-check-service.js
          - core/server/services/update-check/jobs/update-check-job.ts
          - core/server/services/notifications/notification-email.ts
          - core/server/services/jobs-service/register-job-handlers.ts
          - core/boot.js
    entryPoints:
      - update-check/index.js
    notes: >-
      Ownership needs review: the checker owns remote request policy, persisted check timing,
      notification-group filtering and administrator alert delivery. Notifications is a possible
      owner, but consuming its API does not establish ownership. Per-call construction alone
      is not a reason to relocate. Boot owns job registration and scheduling; preserve a
      repeatable check operation and its dependency, readiness and error contracts at either
      destination. No source has moved.
    contracts:
      exports:
        summary: >-
          CommonJS exports an async function with scheduleJobs(jobsService). It exposes no
          checker instance, init or shutdown. The implementation file exports the checker
          constructor; the TypeScript default job export has type update-check and an empty
          serializable payload.
        sources:
          - core/server/services/update-check/index.js
          - core/server/services/update-check/update-check-service.js
          - core/server/services/update-check/jobs/update-check-job.ts
        tests:
          - test/unit/server/services/update-check/schedule-update-check.test.ts
          - test/unit/server/services/update-check/jobs/update-check-jobs.test.ts
      construction:
        summary: >-
          Every invocation passing the environment/force gate constructs GhostMailer, its
          configured transport, NotificationEmailService and UpdateCheckService. The persisted
          next_update_check gate runs afterwards, so an early check still constructs these
          objects. The checker captures internal settings read/edit, users browse and
          notifications add pipeline functions. Only the root constructs the checker in
          runtime code; unit tests also construct it directly.
        sources:
          - core/server/services/update-check/index.js
          - core/server/services/update-check/update-check-service.js
          - core/server/lib/mail/ghost-mailer.js
          - core/server/api/endpoints/index.js
        tests: []
      consumers:
        summary: >-
          Boot calls scheduleJobs and passes the root to the central UpdateCheckJob handler, which
          awaits it with rethrowErrors true on the shared default jobs lane. The current
          in-memory backend invokes that handler in-process; no separate update-check worker,
          CLI or HTTP consumer was found. The checker itself calls API pipelines with internal
          context to read/write the due date, resolve active Owner/Administrator recipients
          for alerts and store notifications. Alerts await notification email before storage.
        sources:
          - core/boot.js
          - core/server/services/jobs-service/register-job-handlers.ts
          - core/server/services/jobs-service/jobs-service.ts
          - core/server/adapters/jobs/InMemoryJobsBackend.ts
          - core/server/services/update-check/update-check-service.js
          - core/server/api/endpoints/settings.js
          - core/server/api/endpoints/users.js
          - core/server/api/endpoints/notifications.js
        tests:
          - test/unit/server/services/jobs-service/register-job-handlers.test.ts
          - test/unit/server/services/update-check.test.js
          - test/integration/jobs/update-check.test.ts
      startup:
        summary: >-
          Foreground boot registers the handler and starts jobs before mounting the app and
          signalling readiness. Unawaited background startup skips test environments; otherwise
          it reaches update-check after recovery, other schedules and ActivityPub. scheduleJobs
          awaits a random daily recurring registration before optionally enqueueing a forced
          boot check. Enqueue completion does not wait for checking. There is no root readiness
          guard; direct calls rely on initialized API/settings and mail dependencies.
        sources:
          - core/boot.js
          - core/server/services/update-check/index.js
          - core/server/services/jobs-service/jobs-service.ts
          - core/server/lib/mail/ghost-mailer.js
        tests:
          - test/unit/server/services/update-check/schedule-update-check.test.ts
          - test/unit/boot/init-background-services.test.ts
          - test/integration/jobs/update-check.test.ts
      lifetime:
        summary: >-
          The root retains no checker or local scheduling flag. Repeated calls create fresh
          collaborators; concurrent checks have no local exclusion and share the persisted due
          date and notifications. Repeated scheduling generates another cron and repeats a
          forced enqueue. The in-memory jobs backend keeps the first recurring schedule per
          type until shutdown clears it. Jobs init reuses its instance and clears handlers;
          a subsequent boot must register handlers, restart jobs and schedule again.
        sources:
          - core/server/services/update-check/index.js
          - core/server/services/update-check/update-check-service.js
          - core/server/services/jobs-service/index.ts
          - core/server/services/jobs-service/jobs-service.ts
          - core/server/adapters/jobs/InMemoryJobsBackend.ts
          - core/boot.js
        tests:
          - test/unit/server/adapters/jobs/in-memory-jobs-backend.test.ts
          - test/unit/server/services/jobs-service/jobs-service.test.ts
      configuration:
        summary: >-
          Invocation defaults reread forceUpdate and endpoint; explicit options override them.
          Without forceUpdate only config environments production/development pass. A checker
          captures endpoint, notification groups, site URL, version and error policy, then
          reads next_update_check per check; force also bypasses that due-date gate. Requests
          use GET with only ghost_version in the query and a one-second request timeout; this
          root has no privacy flag gate. Custom notifications match configured groups plus all.
          Mail transport/options are read at construction; recipients and mail template site
          details are resolved when sending. scheduleJobs separately rereads forceUpdate.
        sources:
          - core/server/services/update-check/index.js
          - core/server/services/update-check/update-check-service.js
          - core/shared/config/helpers.ts
          - core/shared/config/defaults.json
          - core/server/lib/mail/ghost-mailer.js
          - core/server/lib/mail/index.js
          - core/server/lib/mail/email-content-generator.js
          - core/server/services/notifications/notification-email.ts
        tests:
          - test/unit/server/services/update-check.test.js
          - test/unit/server/services/update-check/schedule-update-check.test.ts
          - test/unit/shared/config/helpers.test.ts
          - test/integration/jobs/update-check.test.ts
      resources:
        summary: >-
          Jobs owns recurring timers and queued deliveries. Boot registers jobs shutdown with
          the configured timeout; the in-memory backend clears timers, drops waiting jobs and
          waits for active handlers until that deadline, without cancelling their requests or
          sends. The root awaits check, which normally awaits request, settings writes and
          sequential notification/email work. Each allowed invocation owns a mail transport,
          but neither the root nor GhostMailer exposes disposal. The request function and
          template generator are shared imports; no update-check cancellation hook exists.
        sources:
          - core/boot.js
          - core/server/services/jobs-service/jobs-service.ts
          - core/server/adapters/jobs/InMemoryJobsBackend.ts
          - core/server/services/update-check/index.js
          - core/server/services/update-check/update-check-service.js
          - core/server/lib/mail/ghost-mailer.js
          - core/server/lib/mail/index.js
          - core/server/services/notifications/notification-email.ts
        tests:
          - test/unit/server/adapters/jobs/in-memory-jobs-backend.test.ts
          - test/unit/server/services/jobs-service/jobs-service.test.ts
          - test/unit/server/services/notifications/notification-email.test.ts
      failures:
        summary: >-
          Scheduling failures reject to boot, which logs and continues to later background
          services. A request 404 becomes an empty result with a next-day due date. Other
          check errors call updateCheckError: it starts an unawaited next-day settings edit,
          annotates/logs the error and rethrows only when configured. Default alert recipient
          or send errors log and continue to notification storage; job mode rethrows and stops
          that check. Successful responses write the due date before notification work, so a
          later failure can leave partial state. Constructor failures bypass the checker
          error handler. Jobs logs/reports
          propagated delivery errors; its in-memory backend catches them and continues other
          work without retrying that delivery.
        sources:
          - core/boot.js
          - core/server/services/update-check/index.js
          - core/server/services/update-check/update-check-service.js
          - core/server/services/jobs-service/register-job-handlers.ts
          - core/server/services/jobs-service/jobs-service.ts
          - core/server/adapters/jobs/InMemoryJobsBackend.ts
        tests:
          - test/unit/server/services/update-check.test.js
          - test/unit/server/services/jobs-service/jobs-service.test.ts
          - test/unit/server/adapters/jobs/in-memory-jobs-backend.test.ts
    unverified: []
    blockers:
      - >-
        Choose the application/jobs capability owner and preserve the internal API pipeline
        behavior before changing composition. Current direct checker tests do not establish
        root export shape, construction count, pre-init behavior, environment/force gates,
        explicit overrides or live configuration changes end-to-end.
      - >-
        Add update-check-specific repeated/concurrent scheduling and restart/drain contracts.
        Generic backend tests cover first-registration wins, shutdown and queue restart, not
        this root's forced dispatches, actual recurring checks or overlapping due-date writes.
      - >-
        Characterize recurring registration and forced enqueue failures, including the partial
        state when enqueue fails after scheduling succeeds. Existing boot coverage continues
        after email analytics errors, not update-check scheduling errors or earlier ActivityPub
        failure; daily cron tests do not bound seconds/minutes or assert registration ordering.
      - >-
        updateCheckError neither awaits nor catches settings.edit. Its rejection can escape
        after check/job completion and is not drained as part of the handler. Decide and test
        this behavior before migration; helper tests use resolving stubs and only check calls,
        error annotation and rethrow, not timestamp persistence or failed writes.
      - >-
        Characterize request timeout/404/malformed/error responses, settings and notification
        write failures, invalid notification groups, and alert lookup/render/send failures in
        default and job modes. Successful job integration and helper-level rethrow tests do not
        prove that the real handler reports a failed update check or preserves later work.
      - >-
        Decide ownership and disposal for per-check mail transports and in-flight HTTP/email
        work, including shutdown timeout and late completion. Existing tests do not prove
        transport release or cancellation, and the one-second request option is not evidence
        of an overall deadline or of dependency-level retry/socket cleanup behavior.
  url:
    kind: directory
    disposition: review
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    migration:
      complexity: complex
      modelImpact: may-change
      reason: >-
        The shared URL service must exist before routers are registered, becomes
        routing-ready later, and resets routing state in place during frontend reload.
        Decide how composition readiness relates to a usable router graph without breaking
        retained consumers or the maintenance gate. A stable facade may suffice, but folding
        both stages into one factory would create an ordering cycle.
      reviewedAt: f276513ba32b7114fd5cc4f7b02d3f82c0c31e3e
      sources:
        - core/server/services/url/index.js
        - core/server/services/url/lazy-url-service.ts
        - core/boot.js
        - core/bridge.js
      dependencies:
        complexity: straightforward
        reason: >-
          The URL implementation already accepts URL utilities, resource lookup and enumeration
          hooks. Remaining model/schema fallback, NQL/filter, matching and logging imports can be
          wired through those hooks and small helper factories. Router registration/reset remains a
          separate readiness contract; dependency wiring itself does not need frontend construction.
        preparation:
          - >-
            Make the root supply URL utilities and an enumeration closure over
            models/schema/database detection, removing implementation fallbacks.
          - >-
            Inject NQL, matching, logging/debug and utility operations into helper factories, while
            retaining one facade for serializers, RouterManager and bridge reload.
        reviewedAt: 44ad405bff4a8700af2ed51f833ebc08d25dddff
        sources:
          - core/server/services/url/index.js
          - core/server/services/url/lazy-url-service.ts
          - core/server/services/url/lazy-find-resource.ts
          - core/server/services/url/routable-resources.js
          - core/server/services/url/router-filter.ts
          - core/server/services/url/permalink-matcher.ts
          - core/frontend/services/proxy.js
          - core/bridge.js
    entryPoints:
      - url/index.js
    notes: >-
      Ownership needs review before an in-place initializer migration or relocation. Resource
      visibility, permalink rules and router registration belong together, but this root binds
      server models and has backend API consumers. Moving it wholesale into frontend routing would
      violate current dependency rules. Decide a backend-safe routing/data-access split and
      preserve backend-only availability first; no destination or source move is approved. One
      eager LazyUrlService owns ordered router registrations. Preserve readiness, real
      serializer/model composition and the different forward, reverse and enumeration contracts;
      registration/reset and same-process restart still need lifecycle coverage.
    contracts:
      exports:
        summary: >-
          CommonJS exports one mutable LazyUrlService instance; the deep module exports the
          constructor both directly and as LazyUrlService. Receiver-dependent registration,
          reset, readiness, field/relation requirements, forward URL and ownership methods are
          synchronous; resolveUrl and getRoutableResources return promises. No init/stop exists.
          Forward misses use /404/, reverse misses null, and enumeration returns a fresh array.
          Class units assert selected results and readiness, not barrel identity, unbound
          methods or the entire runtime surface.
        sources:
          - core/server/services/url/index.js
          - core/server/services/url/lazy-url-service.ts
          - core/server/services/url/routable-resources.js
        tests:
          - test/unit/server/services/url/lazy-url-service.test.ts
      construction:
        summary: >-
          Import constructs the service with createFindResource(models), retaining the models
          facade and shared URL helper. Its constructor requires a lookup function and builds
          empty router/relation/diagnostic state plus static base/exclusion filters. Lookup
          dereferences model properties per call; enumeration resolves models/schema/database
          helpers when called. Construction itself performs no resource query or registration.
          Units construct injected implementations and exercise model-hook calls with fake
          models; they do not establish eager barrel timing or shared module identity.
        sources:
          - core/server/services/url/index.js
          - core/server/services/url/lazy-url-service.ts
          - core/server/services/url/lazy-find-resource.ts
          - core/server/services/url/routable-resources.js
        tests:
          - test/unit/server/services/url/lazy-url-service.test.ts
          - test/unit/server/services/url/lazy-find-resource.test.ts
      consumers:
        summary: >-
          API serializers/search ask the retained root for fields/relations and URLs; frontend
          proxy/helpers/metadata, RouterManager and sitemap retain it too. Sitemap consumes and
          clears fresh enumeration arrays, then uses forward URLs to exclude /404/ resources.
          Service consumers include feedback, comments, imports, email, pings, machine payments,
          attribution, members, mentions, stats and webhooks. Real database integration drives
          input serializer/model/output mapper/root with manually registered primary-tag routes:
          full/narrow fields, internal/no tags, forced ID removal, relation IDs and tied tag order.
          HTTP asserts a page comment URL after uploading filtered routes and sitemap URLs after
