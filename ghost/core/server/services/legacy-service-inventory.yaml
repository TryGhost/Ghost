    migration:
      complexity: complex
      modelImpact: fits
      reason: >-
        One retained cache/updater pair fits defineService, but the current DomainEvents API
        wraps callbacks without exposing a disposer. Establish a removable subscription
        boundary before promising cleanup and retry after partial registration. Preserve the
        live members-API getter, optional click listener and existing cache identity; this
        is dependency ownership work rather than a need for kernel cleanup hooks.
      reviewedAt: f276513ba32b7114fd5cc4f7b02d3f82c0c31e3e
      sources:
        - core/server/services/members-events/index.js
        - core/server/services/members-events/last-seen-at-updater.js
        - core/server/services/members-events/last-seen-at-cache.js
        - core/boot.js
      dependencies:
        complexity: straightforward
        reason: >-
          The updater/cache already receive database, events, settings, config and a live Members
          API getter from the root. Remaining imports are logging, event constructors and Moment
          Timezone, which can use root binding plus the shared clock. Preserve the getter instead of
          capturing Members during construction; subscription disposal remains separate lifecycle
          work.
        preparation:
          - >-
            Inject logging and event registration capabilities or event constructors from the root,
            and use the shared clock's timezone-capable legacy Moment export in both updater and
            cache.
          - >-
            Keep the call-time Members API getter, live timezone reads and construction-time
            click-listener policy distinct.
        reviewedAt: 44ad405bff4a8700af2ed51f833ebc08d25dddff
        sources:
          - core/server/services/members-events/index.js
          - core/server/services/members-events/last-seen-at-updater.js
          - core/server/services/members-events/last-seen-at-cache.js
          - core/kernel/clock.ts
    entryPoints:
      - members-events/index.js
    notes: >-
      Preserve guarded subscriptions, live members API lookup and the distinct page/click,
      email-open and comment update paths. Establish partial-init recovery, listener ownership,
      transaction/event ordering and cache behavior before changing lifecycle.
    contracts:
      exports:
        summary: >-
          CommonJS exports one eager wrapper with receiver-dependent synchronous init and
          clearLastSeenAtCache, both returning undefined. After init, lastSeenAtCache and
          lastSeenAtUpdater are mutable public properties. Deep CommonJS classes are constructible;
          update methods resolve undefined after work; subscribe and cache methods are synchronous.
          No readiness/reset/shutdown API exists. Deep tests cover selected methods; complete
          facade shape, return values and detached invocation are source-only.
        sources:
          - core/server/services/members-events/index.js
          - core/server/services/members-events/last-seen-at-updater.js
          - core/server/services/members-events/last-seen-at-cache.js
        tests:
          - test/unit/server/services/members-events/last-seen-at-updater.test.js
          - test/unit/server/services/members-events/last-seen-at-cache.test.js
      construction:
        summary: >-
          Boot is the only production init caller found. First init creates a cache with shared
          settings, publishes it, constructs/publishes an updater borrowing config, database and
          common events, then subscribes. A callback reads members.api when needed rather than
          capturing that implementation. Cache construction reads the current day/timezone; updater
          construction requires a truthy members getter and otherwise stores dependencies, creating
          a fallback cache only for direct construction without one. Neither constructor queries
          the database. Unit tests inject collaborators and pin the missing-getter error, not the
          root graph or partial construction.
        sources:
          - core/boot.js
          - core/server/services/members-events/index.js
          - core/server/services/members-events/last-seen-at-updater.js
          - core/server/services/members-events/last-seen-at-cache.js
        tests:
          - test/unit/server/services/members-events/last-seen-at-updater.test.js
          - test/unit/server/services/members-events/last-seen-at-cache.test.js
      consumers:
        summary: >-
          Runtime use is through shared DomainEvents: frontend middleware dispatches page views,
          link tracking dispatches clicks after writes or transaction executionPromise fulfillment,
          comments dispatches after notification work, and the email processor dispatches opens
          before awaiting open-event storage. Page/click writes manually emit common member.edited,
          reaching webhooks; email SQL bypasses model events. Tests directly access the updater and
          clear the cache. Real frontend/comment HTTP tests settle events and pin selected timestamp
          changes; click HTTP pins a valid timestamp and intercepted webhook payload. Processor units
          inject dispatch/storage fakes; real provider-open to member-update composition is unproven.
        sources:
