        complexity: straightforward
        reason: >-
          Config, settings cache, URL utilities, labs and limits already enter through the
          constructor and are read when methods run. Remaining direct dependencies are
          logging/debug, IP detection and the email-address parser. Constructing the facade need not
          read populated settings, which avoids a new readiness cycle with calculated settings.
        preparation:
          - >-
            Inject logging/debug, IP detection and email parsing, and initialize the facade before
            settings binds calculated-field methods while retaining the shared cache reference.
