      construction:
        summary: >-
          Loading the root constructs AutomationsService and imports the separately cached API,
          which immediately constructs its repository with the shared Knex handle and parsed
          fakeWaitHoursMultiplier. It also loads shared request transport and other wrappers.
          First init constructs a SoonestTimer, two independently serialized event handlers and
          scheduler registration, launches an unawaited immediate enqueue, then publishes its
          private guard. No DB query or poll is required to finish for publication. Subscribing or
          registering can fail after earlier subscriptions exist, without rollback. API stats
          calls construct short-lived Tinybird clients; the service passes the ready
          welcome-email instance to both pollers. Units construct the class with fake events/scheduler and check
          two subscriptions after repeated init; they do not assert root import acquisition,
          retained collaborator identity or partial-init cleanup/retry.
