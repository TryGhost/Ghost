          - test/unit/server/services/member-welcome-emails/member-welcome-email-renderer.test.js
          - test/unit/server/services/members-events/last-seen-at-updater.test.js
      startup:
        summary: >-
          Reading an uninitialized redirection root rejects with its readiness error. Boot
          initializes redirection in its frontend-services phase before awaiting link tracking in the main
          service group and exposing the full app. Email composition earlier in that group
          retains the wrapper rather than reading its unpublished implementation. The welcome
          renderer also initializes on use, relying on the same prerequisite. Implementation
          init synchronously subscribes before its async promise resolves. Tests cover pending
          publication and one subscription for concurrent wrapper calls, not prerequisite errors,
          boot sequencing, early events or cleanup after partial subscription failure.
