          - test/unit/server/services/email-suppression-list/index.test.ts
          - test/unit/boot/init-services.test.ts
      lifetime:
        summary: >-
          Module caching and retained consumer references keep the same root and MailgunClient.
          Every init overwrites the model field and adds two fresh event handlers without a
          guard, unsubscribe or shutdown. Old handlers read this.Suppression when invoked, so
          model replacement affects them too. Persistence outlives the instance; duplicate rows
          retain their original reason/time but still cause a new suppression event. Provider
          tests pin two subscriptions per init, duplication on repeated init and handlers reading
