    migration:
      complexity: complex
      modelImpact: fits
      reason: >-
        Define a stable theme-management facade across the active theme, catalogue,
        validation cache and frontend activation bridge. Initial theme activation
        deliberately logs errors without preventing Admin from starting; preserve that
        boundary and subsequent theme changes as operations on the retained owner. The
        ownership and boot-mode work is substantial, but the active theme need not be the
        immutable service instance.
