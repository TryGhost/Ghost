      construction:
        summary: >-
          Init obtains the shared Knex getter, models and config, then publishes namespaces,
          fields, definitions, values and bindings sequentially; bindings retains that values instance.
          Namespaces is built from custom fields' policy, which holds the host limit service and a
          ceiling callback, both asked on each use.
          Definitions receives an action-recording closure over models.Action and the namespaces;
          values receives the ceiling callback; all three receive the field source. Constructors
          store dependencies without querying or starting work.
          The shared DB getter can create the module-cached Knex client if not already loaded.
          No other production construction of these classes was found. HTTP covers the
          bindings only through the published root.
        sources:
