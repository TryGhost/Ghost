          - test/unit/server/services/email-service/mailgun-email-provider.test.js
          - test/e2e-api/admin/email-previews.test.js
      resources:
        summary: >-
          Delivery borrows jobs, DB/models, image cache/storage and sibling services. It owns
          its locale listener, compiled template promise, active-send set and per-send body
          cache. Posts saves the publication and pending email in one transaction, opening one
          or joining the caller's. Scheduling follows its own transaction's completion;
          caller-owned transactions register a detached callback on executionPromise fulfillment
          through afterCommit. There is no durable outbox for this callback. Preparation retains
          the selected audience IDs, bounds page workers, writes
          each page transactionally with a stable batch identity, verifies uncertain commits,
          and drains workers on failure. Retry waits own timers/abort listeners; aborting those
          waits does not cancel an active transaction/provider request. Two workers submit
          batches per email; jobs registers two concurrent email handlers. Rendering can read
          templates/images/posts and persist tracking links through borrowed helpers; image
          lookup has shared cache/in-flight work and its own request timeout. The installed
          Mailgun SDK uses bundled Axios with configured request timeouts and default HTTP agents;
          its timeout path destroys the request, but this wrapper exposes no cancellation or
          agent-disposal handle. This is source evidence, not tested deadline/shutdown behavior.
          Analytics deep
          objects own an unbounded provider-ID map, pending timestamp maps and metric
          registrations; domain-event dispatch does not await subscribers. Units exercise
          bounded preparation workers, drain gates and cached-image fallback using fakes;
          these do not prove provider socket disposal or whole-server shutdown completion.
        sources:
