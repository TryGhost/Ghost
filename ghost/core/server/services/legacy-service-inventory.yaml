          - test/integration/services/last-seen-at-updater.test.js
      configuration:
        summary: >-
          Only explicit false disables click subscription, selected once during subscribe; other
          event types remain registered. Timezone is read per update/cache check. Cache and email SQL
          default missing timezone to Etc/UTC; page/comment paths pass the returned value directly
          to moment. Cache days follow the current clock, while writes compare the event timestamp's
          day. Config is retained as an accessor, not a subtree; no production hot reload is implied.
          Units pin disabled/missing-config click delivery and selected timezone branches. Real DB
          integration pins CET midnight and same-day suppression with direct updater calls, not
          delayed/out-of-order events, DST, same-instance timezone changes or later config replacement.
        sources:
