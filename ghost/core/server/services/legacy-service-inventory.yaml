        Root units now hold dispatch to prove request acceptance waits, then process the
        dispatched job through the real retained importer. Broader import policy, validation and pre-existing storage
        gaps belong to this service's later work and do not gate the eight-service pilot.
  custom-redirects:
    kind: directory
    disposition: migrate
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    migration:
      complexity: complex
      modelImpact: fits
      reason: >-
        Each init rebuilds the redirect graph while mounted middleware retains its manager,
        so lifetime and consumer identity need an explicit decision. A retained manager
        already supports activate() for in-place reload; preserve that operation and the
        difference between tolerant boot loading and strict uploads. This is coordinated
        wiring and failure-policy work, with no demonstrated need to extend the helper.
      reviewedAt: f276513ba32b7114fd5cc4f7b02d3f82c0c31e3e
      sources:
        - core/server/services/custom-redirects/index.js
        - core/server/services/custom-redirects/redirects-service.ts
        - core/frontend/web/site.js
        - core/server/api/endpoints/redirects.js
        - core/boot.js
      dependencies:
        complexity: complex
        reason: >-
          Store, live manager and dry-run manager are already injected, but parser and backup-path
          helpers are also imported directly by storage adapters and API endpoints. Those shared
          helpers currently load YAML, path and Moment themselves, so routing all of their
          dependencies through the service root would couple adapter construction back to its owner.
        preparation:
          - >-
            Give redirect parsing/serialization and backup-path support a shared library home used
            by adapters and endpoints; keep those operations independent of the running service.
          - >-
            Require the existing dry-run-manager injection instead of its implementation fallback,
            and inject logging, validation and error normalization from the root while retaining the
            mounted manager.
        reviewedAt: 44ad405bff4a8700af2ed51f833ebc08d25dddff
        sources:
          - core/server/services/custom-redirects/index.js
          - core/server/services/custom-redirects/redirects-service.ts
          - core/server/services/custom-redirects/redirect-config-parser.ts
          - core/server/services/custom-redirects/utils.ts
          - core/server/adapters/redirects/FileStore.ts
          - core/server/adapters/redirects/S3RedirectsStore.ts
          - core/server/api/endpoints/redirects.js
    entryPoints:
      - custom-redirects/index.js
    notes: >-
      Preserve the stable mounted redirect handler across uploads, boot's tolerant activation
      and stricter replacement validation. Repeated root initialization replaces the graph;
      persistence, activation and export are separate boundaries.
    contracts:
      exports:
        summary: >-
          CommonJS exports one object with receiver-independent init plus api/middleware getters.
          api is undefined before init; middleware throws before a manager exists. init returns
          the new service's initialization promise. The deep class has receiver-dependent async
          init, activate, replace and getAll; only getAll returns stored configuration. Parser,
          validation and backup helpers are also deep imports. Tests exercise deep service/parser
          methods and HTTP consumers, not root descriptors, pre-init access or detached API calls.
        sources:
          - core/server/services/custom-redirects/index.js
          - core/server/services/custom-redirects/redirects-service.ts
          - core/server/services/custom-redirects/redirect-config-parser.ts
          - core/server/services/custom-redirects/validation.js
          - core/server/services/custom-redirects/utils.ts
        tests:
          - test/unit/server/services/custom-redirects/redirects-service.test.ts
          - test/unit/server/services/custom-redirects/redirect-config-parser.test.ts
      construction:
        summary: >-
          Import loads dependencies without creating the manager/service. Every init replaces
          the private manager first, resolves the adapter-manager-cached redirects store, then
          publishes a new service before its asynchronous activation finishes. No guard or
          shared pending promise exists. The service retains store, manager, validator and a
          dry-run-manager factory. Adapter failure can leave a new empty manager alongside an
          older API. Boot is the sole runtime root init caller found; construction/publication
          and partial graph replacement are source-only.
        sources:
          - core/server/services/custom-redirects/index.js
          - core/server/services/custom-redirects/redirects-service.ts
          - core/server/services/adapter-manager/index.ts
          - core/kernel/adapter-manager/adapter-manager.ts
          - core/boot.js
        tests: []
      consumers:
        summary: >-
          Frontend mounting retains the current manager's bound handler after offers and tracked
          links, before static/dynamic content. Redirect upload/download and site export retain
          the root and read api per operation; file/S3 stores deep-import parsers and backup naming.
          Legacy HTTP proves two uploads update the mounted handler, disk data and backups. Admin
          HTTP proves YAML upload/download content, while site-export HTTP proves redirect-file
          presence and reupload success, not nonempty redirect equality or frontend precedence.
          Exporter failure units inject the export function, not this root.
        sources:
          - core/frontend/web/site.js
          - core/server/api/endpoints/redirects.js
          - core/server/api/endpoints/exports.js
          - core/server/data/exporter/site-exporter.ts
          - core/server/adapters/redirects/FileStore.ts
          - core/server/adapters/redirects/S3RedirectsStore.ts
        tests:
          - test/legacy/api/admin/redirects.test.js
          - test/e2e-api/admin/redirects.test.js
          - test/e2e-api/admin/exports-download.test.js
          - test/unit/server/data/exporter/site-exporter.test.ts
      startup:
        summary: >-
          Boot awaits custom redirects after route settings and before link redirection, themes,
          Express mounting and readiness, even with frontend disabled. Init reads the store before
          clearing/loading the new manager. The deep init catches/logs activation errors so unreadable
          storage normally allows boot with an empty new graph; adapter/construction failures
          occur outside that catch. API/middleware are already published while loading. Deep tests
          pin swallowed store failure and no clear on failed read, not pending root readiness,
          backend-only composition or early API calls.
        sources:
          - core/boot.js
          - core/server/services/custom-redirects/index.js
          - core/server/services/custom-redirects/redirects-service.ts
          - core/frontend/web/site.js
        tests:
          - test/unit/server/services/custom-redirects/redirects-service.test.ts
          - test/legacy/api/admin/redirects.test.js
      lifetime:
        summary: >-
          activate and replace mutate the retained manager, preserving its mounted handler within
          one graph. Re-init replaces the private graph while old mounted handlers keep their old
          manager. There is no watcher, event subscription, cross-instance notification or operation
          serialization. activate rereads storage; replace validates/dry-runs, awaits persistence,
          then loads its original array without rereading or cloning it. Concurrent operations or
          caller mutation during the await can diverge storage and active routes. The deep identity
          test only compares an injected stub method; real legacy uploads prove same-boot activation,
          not re-init, retained old APIs or concurrent consistency.
        sources:
          - core/server/services/custom-redirects/index.js
          - core/server/services/custom-redirects/redirects-service.ts
          - core/server/web/shared/dynamic-redirect-manager.js
          - core/frontend/web/site.js
        tests:
          - test/unit/server/services/custom-redirects/redirects-service.test.ts
          - test/legacy/api/admin/redirects.test.js
      configuration:
        summary: >-
          Each manager captures permanent max-age; the dry-run factory reads config when invoked.
          The subdirectory callback uses shared URL helpers, whose production URL values are frozen.
          Store selection/options are adapter-owned. FileStore prefers YAML over JSON, returns
          an empty list if neither exists and always writes JSON. S3 reads/writes JSON and treats
          NotFound/NoSuchKey as an empty list. Validation requires nonempty from/to and a
          compilable regex, without requiring boolean permanent. YAML parsing loads 302 before 301;
          serialization emits 301 before 302, retaining order within each group. Manager matching
          uses insertion order, optional case-insensitive regexes and trailing slashes; target query
          values override incoming ones and temporary redirects use max-age zero. Parser/manager
          tests pin selected encoding/status/order behavior; mixed overlaps and duplicate paths
          through full upload/download/activation remain uncovered.
        sources:
          - core/server/services/custom-redirects/index.js
          - core/server/services/custom-redirects/redirect-config-parser.ts
          - core/server/services/custom-redirects/validation.js
          - core/server/web/shared/dynamic-redirect-manager.js
          - core/shared/url-utils.ts
          - core/shared/config/validated.ts
          - core/kernel/adapter-manager/adapter-manager.ts
          - core/server/adapters/redirects/FileStore.ts
          - core/server/adapters/redirects/S3RedirectsStore.ts
        tests:
          - test/unit/server/services/custom-redirects/redirect-config-parser.test.ts
          - test/unit/server/services/custom-redirects/validation.test.ts
          - test/unit/server/web/shared/dynamic-redirect-manager.test.js
          - test/e2e-api/admin/redirects.test.js
      resources:
        summary: >-
          Each graph owns its manager/router and temporary dry-run managers, borrowing the cached
          redirects adapter; the root owns no timer, watcher, DB transaction or disposer. FileStore
          owns filesystem writes/backups; S3 store owns its SDK client and remote backup/write calls.
          Neither root nor stores expose pending-operation drain or client teardown. File and
          S3 backup names have second precision and can overwrite in that interval. Local store tests use
          temporary files; S3 integration requires GHOST_TEST_S3_AVAILABLE=1 and covers storage,
          not root lifecycle; its multi-backup test spaces writes apart. No shutdown or
          multi-instance update guarantee is inferred.
        sources:
          - core/server/services/custom-redirects/index.js
          - core/server/services/custom-redirects/redirects-service.ts
          - core/server/web/shared/dynamic-redirect-manager.js
          - core/server/adapters/redirects/FileStore.ts
          - core/server/adapters/redirects/S3RedirectsStore.ts
          - core/server/services/custom-redirects/utils.ts
          - core/server/ghost-server.ts
        tests:
          - test/unit/server/adapters/redirects/file-store.test.ts
          - test/integration/adapters/redirects/s3-redirects-store.test.ts
      failures:
        summary: >-
          activate preserves existing routes when reading fails, then clears before per-item
          validation/loading, skips/logs invalid entries and reports when none load. replace
          rejects batch/dry-run errors before writing; after persistence, live-manager failure
          rejects with partial activation and no rollback. Init swallows activation errors unless
          error handling itself throws. Units pin these stages using fake managers/in-memory storage.
          File tests prove selected backup failure recovery, but the JSON atomic-write failure fake
          fails the first backup write, not a later canonical move. HTTP success tests do not prove
          these fault paths. Site export can omit failed redirects while retaining other files.
        sources:
          - core/server/services/custom-redirects/index.js
          - core/server/services/custom-redirects/redirects-service.ts
          - core/server/services/custom-redirects/redirect-config-parser.ts
          - core/server/adapters/redirects/FileStore.ts
          - core/server/adapters/redirects/S3RedirectsStore.ts
          - core/server/data/exporter/site-exporter.ts
          - core/server/api/endpoints/redirects.js
        tests:
          - test/unit/server/services/custom-redirects/redirects-service.test.ts
          - test/unit/server/adapters/redirects/file-store.test.ts
          - test/unit/server/data/exporter/site-exporter.test.ts
          - test/unit/server/services/custom-redirects/redirect-config-parser.test.ts
    unverified: []
    blockers:
      - >-
        Pin root export/pre-init behavior, pending and failed initialization, backend-only boot
        and repeated/concurrent graph replacement. Real uploads establish one manager's activation,
        not replacement of a mounted handler; preserve tolerant store failures separately from
        construction errors that still reject boot.
      - >-
        Cover concurrent activate/replace and caller mutation while persistence is pending, with
        actual store/manager composition. Define ordering and cross-instance refresh before adding
        lifecycle ownership; there is no operation queue, watcher or notifier today.
      - >-
        Extend storage failure coverage to canonical writes/moves after successful backup, failed
        cleanup and remote partial/ambiguous writes. A rejected write can leave temporary files,
        and post-write activation failure can leave persisted config with only partial live routes.
        Existing injected store/manager tests do not establish end-to-end rollback or recovery.
      - >-
        Add real HTTP contracts for overlapping/duplicate redirects, status-group round trips,
        frontend precedence, regex captures and configured subdirectories. The manager's subdirectory
        unit uses an identity callback and preserves a prefix already in req.url, rather than
        proving root callback wiring. Preserve nonempty redirect values through site export/reimport.
      - >-
        Define ownership of borrowed adapters and pending writes before shutdown/re-init; no root
        drain or S3-client disposal exists. Conditional storage integration coverage is not proof
        of wrapper behavior or safe teardown.
  email-address:
