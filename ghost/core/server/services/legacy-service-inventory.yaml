    contracts:
      exports:
        summary: >-
          Named runtime exports are synchronous init, mutable namespaces/fields/definitions/values/bindings,
          audience/access constants, canWrite, actingContext and adminWriteOrigin. fields is the
          field source every read of a field goes through, reading a field in an unavailable
          namespace as archived. Service
          bindings are undefined before init; class methods depend on their receiver. Namespaces
          resolves a namespace's policy (owner and limits) and refuses what it doesn't allow. Definitions
          exposes asynchronous CRUD/reorder and addOne/find/recordCreated helpers; values
          exposes synchronous unwrapWire plus asynchronous read/plan/apply/feed methods; bindings exposes asynchronous
          bind/remove/planning, which of a set of ports are bound and the field each names, and
