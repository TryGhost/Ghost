          - test/e2e-api/members-comments/comments-lazy-url-parity.test.js
          - test/e2e-frontend/sitemap-slug-rename.test.js
      lifetime:
        summary: >-
          Registrations append in priority order without deduplication. reset replaces the
          router array and clears readiness/derived relations/diagnostic counters, retaining
          collaborators; onRouterUpdated only clears derived relations. Reverse memoization
          stores record/null per type and lookup within one call, not across requests. Bridge
          reads settings before reset/re-registration; its units hold/reject that read and
          assert fake reset/reload sequencing, not real HTTP availability. Class tests pin
          first-router ownership, reset and same-call lookup counts. Normal boot/stop cleanup,
          retained consumers during reset and overlapping lookups/reloads are source-only.
        sources:
          - core/server/services/url/lazy-url-service.ts
          - core/bridge.js
          - core/frontend/services/routing/router-manager.js
          - core/server/ghost-server.ts
        tests:
          - test/unit/server/services/url/lazy-url-service.test.ts
          - test/unit/bridge.test.js
      configuration:
        summary: >-
          Registration captures filter/type/permalink; current registrations determine fetched
          fields/relations. Forward routing applies published post/page and public-tag gates;
          authors have no base filter. Excluded fields are stripped before router filters.
          Reverse lookup scopes publication/visibility through model queries and validates
          captured segments against that router's permalink. Enumeration applies type gates,
          including published-post joins for tags/authors, not collection filters. Units pin
          these with fake models/URL helpers; integration pins actual primary-tag composition,
          selected columns/relations and public-tag inclusion/internal-tag exclusion. Shared
          URL bases are frozen; test config replacement is not production hot reload. This
          service passes no timezone to replacePermalink, whose package default is UTC; the
          timezone bridge event only invalidates required relations, with no cited boundary test.
        sources:
          - core/server/services/url/lazy-url-service.ts
          - core/server/services/url/config.js
          - core/server/services/url/lazy-find-resource.ts
          - core/server/services/url/routable-resources.js
          - core/server/services/url/router-filter.ts
          - core/shared/url-utils.ts
          - core/bridge.js
          - package.json
        tests:
          - test/unit/server/services/url/lazy-url-service.test.ts
          - test/unit/server/services/url/lazy-find-resource.test.ts
          - test/unit/server/services/url/router-filter.test.ts
          - test/unit/server/services/url/routable-resources.test.js
          - test/integration/url-serialization.test.js
      resources:
        summary: >-
          The root owns router/filter/diagnostic memory, with no timer, subscription, network
          client or pool. Diagnostics count distinct causes without an explicit map bound.
          Borrowed model queries and enumeration have no root cancellation/drain. SQLite
          enumeration accumulates batches of 999 until an empty batch, with no cross-batch
          snapshot; other databases fetch once. Units assert fetch options and a synthetic
          result/empty SQLite pair, not real SQLite limits or concurrent writes. Real database
          integration checks selected returned records/fields. Sitemap caches and bridge
          settings subscriptions belong to consumers and are not reset/disposed by this root.
        sources:
          - core/server/services/url/lazy-url-service.ts
          - core/server/services/url/lazy-find-resource.ts
          - core/server/services/url/routable-resources.js
          - core/frontend/services/sitemap/site-map-manager.js
          - core/bridge.js
        tests:
          - test/unit/server/services/url/routable-resources.test.js
          - test/integration/url-serialization.test.js
      failures:
        summary: >-
          Thin forward records log structured errors at occurrence counts 1,10,100 and onward,
          then return /404/; unexpected URL/logger errors propagate. Units assert exact error
          details/counts and unexpected-error propagation; real model integration asserts
          missing tags degrades with a report. NQL evaluation errors warn and fail matching.
          Reverse misses and malformed path escapes return null; template construction, lookup
          and enumeration failures can reject. Matcher units pin selected malformed values and
          captures, not all invalid templates. Unknown enumeration types reject in real database
          integration. Failed bridge settings reads preserve fake routing state; faults after
          reset and query failure/recovery through real consumers lack equivalent assertions.
        sources:
          - core/server/services/url/lazy-url-service.ts
          - core/server/services/url/router-filter.ts
          - core/server/services/url/permalink-matcher.ts
          - core/server/services/url/lazy-find-resource.ts
          - core/server/services/url/routable-resources.js
          - core/bridge.js
        tests:
          - test/unit/server/services/url/lazy-url-service.test.ts
          - test/unit/server/services/url/router-filter.test.ts
          - test/unit/server/services/url/permalink-matcher.test.ts
          - test/unit/bridge.test.js
          - test/integration/url-serialization.test.js
    unverified: []
    blockers:
      - >-
        Preserve the tested frontend-only/backend-only routing and VM startup barriers. Protect
        eager root identity, complete readiness across registration, partial registration
        failure, stop and same-process restart. Normal
        boot/stop does not reset URL registrations, and bridge.init appends settings listeners;
        define ownership before replacing the root or retaining this missing cleanup.
      - >-
        Exercise retained API/frontend/service consumers across reload and replacement, with
        pending queries and failures after reset. A reverse lookup already iterating the old
        array can continue after reset; current sequencing fakes do not prove atomic routing
        publication or protect stale results and overlapping reloads.
      - >-
        Characterize cross-router canonical ownership, subdirectory and timezone boundaries
        using actual URL helpers/models. Reverse lookup rechecks only its matched router, not
        the first forward owner; forward/reverse/enumeration gates deliberately differ. The
        date units inject a UTC helper and do not protect site-timezone changes.
      - >-
        Preserve exact serializer field/relation forwarding and response cleanup for all
        consumers before migrating. Existing database and HTTP cases cover important selected
        paths, not every service, author/page shape, malformed route or model-query failure.
        Add resource-bound and concurrent-write coverage before changing enumeration/cleanup.
  verification:
    kind: directory
    disposition: review
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    migration:
      complexity: complex
      modelImpact: fits
      reason: >-
        Review this sender with verification-trigger as one site email-verification capability.
        Its specialized delivery payload and configuration do not establish exclusive Members
        ownership. The configured collaborator can fit the chosen owner's factory without a
        defineService extension; choose that owner before a standalone migration or relocation.
      reviewedAt: 59c26cfc276946844e0694416ead8549eb637479
      sources:
        - core/server/services/verification/verification-webhook-service.ts
        - core/server/services/verification-trigger.js
        - core/server/services/members/service.js
        - core/server/services/email-service/email-service.js
        - core/server/api/endpoints/members.js
      dependencies:
        complexity: straightforward
        reason: >-
          The sender already accepts config, logging and request, but supplies global defaults and
          exports an eager singleton that Members binds into its trigger. Removing defaults and
          composing the sender in the chosen owner is a bounded dependency change; the
          signed-webhook helper is already allowlisted. This does not settle the separate question
          of whether verification remains a root or moves under Members.
        preparation:
          - >-
            Settle verification/trigger ownership before adding a root, then construct the sender
            explicitly with config, logger and request instead of its global default dependencies.
          - >-
            Preserve Members' retained sender binding and per-call configuration reads; avoid
            freezing webhook settings during construction.
        reviewedAt: 44ad405bff4a8700af2ed51f833ebc08d25dddff
        sources:
          - core/server/services/verification/verification-webhook-service.ts
          - core/server/services/verification-trigger.js
          - core/server/services/members/service.js
          - core/server/lib/signed-webhook.ts
    entryPoints:
      - verification/verification-webhook-service.ts
    notes: >-
      Review ownership together with verification-trigger. The sender implements a configured
      email-verification integration with threshold/count payloads; generic signing already
      lives in server/lib/signed-webhook. Members is its current composition point, but that
      alone does not establish private Members ownership of the site-wide email-verification
      capability. Preserve live configuration, signed delivery and delivery-before-persistence
      behavior while choosing the boundary. No source has moved.
    contracts:
      exports:
        summary: >-
          The deep TypeScript module exports VerificationWebhookService and an eager
          verificationWebhookService. There is no index, init, reset or shutdown API. The
          receiver-dependent async sendVerificationWebhook accepts amountTriggered, threshold
          and method, returning false for missing URL/type, true for a fulfilled request, or
          rejecting on failure. Payload types are compile-time constraints, not runtime
          validation. Unit tests construct injected instances; HTTP tests reach the real
          singleton but do not pin export shape or unbound invocation.
        sources:
          - core/server/services/verification/verification-webhook-service.ts
        tests:
          - test/unit/server/services/verification/verification-webhook-service.test.ts
          - test/e2e-api/admin/members.test.js
      construction:
        summary: >-
          Module import loads config, logging, signed-webhook helpers and the shared request
          module, then constructs one sender. The constructor only retains dependencies; it
          does not read feature config or send. Callers can construct the exported class with
          all three injected dependencies. Members is the only runtime importer found and
          binds the singleton method when constructing its trigger. Tests exercise injected
          construction and real consumer behavior, without a direct construction/identity test.
        sources:
          - core/server/services/verification/verification-webhook-service.ts
          - core/server/services/members/service.js
          - core/server/lib/signed-webhook.ts
        tests:
          - test/unit/server/services/verification/verification-webhook-service.test.ts
          - test/e2e-api/admin/members.test.js
      consumers:
        summary: >-
          VerificationTrigger is the sender's sole direct runtime consumer. Member-created
          events, member-import bookkeeping and newsletter preflight reach that trigger;
          methods identify admin, api, import or removed_recipients. The trigger awaits true
          before editing email_verification_required and updating the cache; false/rejection
          leaves it unmarked. Real HTTP tests assert a signed admin payload, removed-recipient
          payload/blocking and import delivery followed by suppression of another sequential
          delivery. They do not establish concurrent deduplication or every source's real
          transport behavior; trigger units use an injected webhook callback.
        sources:
          - core/server/services/members/service.js
          - core/server/services/verification-trigger.js
          - core/server/services/members/import-export/import/importer.ts
          - core/server/services/email-service/email-service.js
          - core/server/api/endpoints/members.js
        tests:
          - test/e2e-api/admin/members.test.js
          - test/legacy/api/admin/members-importer.test.js
          - test/unit/server/services/verification-trigger.test.js
      startup:
        summary: >-
          The sender is usable immediately after import and has no readiness/configuration
          guard beyond per-call URL/type checks. Boot initializes members in the required
          service batch after core settings and Stripe; members constructs its trigger after
          publishing its API and binds this sender before later asynchronous migration work.
          Standalone sender calls need no settings/database, whereas the trigger's queries and
          persistence do. HTTP tests use completed boot and do not characterize import timing,
          pre-boot direct sends or partial members initialization.
        sources:
          - core/boot.js
          - core/server/services/members/service.js
          - core/server/services/verification/verification-webhook-service.ts
        tests:
          - test/e2e-api/admin/members.test.js
          - test/legacy/api/admin/members-importer.test.js
      lifetime:
        summary: >-
          Module caching retains the singleton, and the private members trigger guard retains
          its bound sender across repeated initialization. Each send snapshots config and builds
          local body, timestamp and options; it keeps no delivery state or in-flight promise.
          There is no deduplication, cancellation or reset. Concurrent trigger calls can each
          send before either persists the required flag. Sequential suppression is tested in
          the importing consumer; singleton identity, restart and overlapping sends are not.
        sources:
          - core/server/services/verification/verification-webhook-service.ts
          - core/server/services/verification-trigger.js
          - core/server/services/members/service.js
        tests:
          - test/legacy/api/admin/members-importer.test.js
      configuration:
        summary: >-
          Each send calls the retained config accessor for webhookType, webhookUrl,
          webhookSecret and siteId. URL/type require nonempty strings, without trimming;
          non-string siteId becomes null, and absent/non-string/empty secret sends unsigned.
          The helper JSON-serializes once, signs timestamp:body using base64 HMAC-SHA256 when
          configured, and adds byte length, content type/version and timestamp headers.
          Retry-limit selection reads process.env.NODE_ENV per send. Tests configure the
          already-booted sender through test set/reset and verify signed payloads; this is
          accessor behavior, not a production reload facility. Unsigned/default/type boundaries
          and most headers are source-only.
        sources:
          - core/server/services/verification/verification-webhook-service.ts
          - core/server/lib/signed-webhook.ts
          - core/shared/config/validated.ts
          - core/shared/config/SCHEMA.md
        tests:
          - test/unit/server/services/verification/verification-webhook-service.test.ts
          - test/e2e-api/admin/members.test.js
      resources:
        summary: >-
          Each send awaits shared HTTP infrastructure with a 30-second request timeout and
          retry.limit zero in test environments or five elsewhere. The installed request/got
          defaults exclude POST from normal retries, so that option alone does not establish
          retry delivery. The request module owns a shared DNS cache/resolver and unref'd
          housekeeping timers; this root owns no dedicated transport, timer or listener.
          It exposes no abort, outstanding-request tracking or shutdown drain. Trigger event
          subscriptions and database work belong to its consumer. Existing tests intercept
          successful HTTP or inject a rejection; they do not exercise timeout/retry/drain.
        sources:
          - core/server/services/verification/verification-webhook-service.ts
          - core/server/lib/signed-webhook.ts
          - core/server/services/verification-trigger.js
          - core/server/ghost-server.ts
          - package.json
        tests: []
      failures:
        summary: >-
          Missing URL/type warns and resolves false; only missing type is unit-tested. Request
          throw/rejection is logged then rethrown, provided logging succeeds. Log prefixes use
          URL origin or an invalid-URL placeholder; error.message is appended unchanged.
          Config reads, serialization/signing and pre-request logging are outside the delivery
          catch. VerificationTrigger catches sender rejection and resolves needsVerification
          false without persisting; subsequent persistence/cache failures reject after remote
          delivery without compensation. Tests prove a logged injected request rejection and
          no-write trigger behavior, not preparation failures, post-delivery failure or exact
          error identity through the full composition.
        sources:
          - core/server/services/verification/verification-webhook-service.ts
          - core/server/lib/signed-webhook.ts
          - core/server/services/verification-trigger.js
        tests:
          - test/unit/server/services/verification/verification-webhook-service.test.ts
          - test/unit/server/services/verification-trigger.test.js
    unverified: []
    blockers:
      - >-
        Settle members ownership before relocation or a managed lifecycle. Pin the eager
        export, retained bound sender, repeated boot and direct pre-boot behavior; an audited
        entry does not establish migration readiness or authorize changing these contracts.
      - >-
        Cover missing/invalid URL and type, unsigned/non-string secrets, null/non-string siteId,
        all wire headers, exact request-error identity and preparation/logging failures. Current
        sanitization tests cover the destination prefix, not redaction of appended error text.
      - >-
        Characterize actual POST retry, timeout/redirect and pending-request shutdown behavior
        before relying on retry.limit or adding cleanup. Shared DNS/request resources need
        explicit ownership; a request timeout is not a service drain or cancellation API.
      - >-
        Test overlapping trigger sources and successful remote delivery followed by failed
        persistence/cache publication. Sequential suppression and intercepted successful
        deliveries do not prove exactly-once delivery, atomic state change or recovery.
      - >-
        Keep current source/config snapshots distinct from a future reload design. Feature
        schema validation and stricter input handling can change warn/false/reject behavior;
        introducing them during lifecycle migration needs separate compatibility evidence.
