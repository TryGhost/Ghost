          member-event browsing and import reassignment resolve the root service at use time;
          Stripe completion/refund handlers likewise use getters. Members endpoints resolve
          controller and preview handlers resolve service. Job handlers retain GiftService;
          email analytics retains GiftDeliveryService for outcomes; four event handlers close
          over the original implementations. Admin signed flush endpoints dispatch deep events
          and return before work finishes. HTTP tests exercise checkout/webhook persistence,
          redemption and a two-request redemption race with Stripe/mail mocked. Signed flush
          HTTP tests stub dispatch and assert authentication/204/event type, not delivery.
        sources:
          - core/server/services/members/api.js
          - core/server/services/members/service.js
          - core/server/services/members/members-api/members-api.js
          - core/server/services/members/members-api/controllers/router-controller.js
          - core/server/services/members/members-api/services/member-bread-service.js
          - core/server/services/members/members-api/repositories/event-repository.js
          - core/server/services/members/import-export/index.ts
          - core/server/services/members/import-export/import/importer.ts
          - core/server/services/stripe/service.js
          - core/server/services/stripe/stripe-service.js
          - core/server/services/stripe/services/webhook/checkout-session-event-service.js
          - core/server/services/stripe/services/webhook/charge-refunded-event-service.js
          - core/server/api/endpoints/gifts-members.js
          - core/server/api/endpoints/gifts.js
          - core/server/web/gift-preview/controller.js
          - core/server/services/jobs-service/register-job-handlers.ts
          - core/server/services/email-analytics/index.ts
          - core/server/services/email-analytics/gift-email-analytics-batch-processor.ts
          - core/server/services/gifts/index.ts
        tests:
          - test/e2e-api/members/gift-subscriptions.test.js
          - test/e2e-api/admin/gift-reminders.test.js
          - test/e2e-api/admin/gift-deliveries.test.ts
      startup:
        summary: >-
          Boot runs the scheduling adapter, awaits Stripe, then calls gifts init with the Stripe
          Checkout config's checkout service before members, tiers and staff initialization;
          their facades/getters defer use. It passes initialized
          delivery/service instances into analytics and job registration before starting jobs.
          A boot harness holds Stripe unresolved and asserts gifts and jobs have not started,
          using module fakes. Outside test environments background boot starts unawaited delivery
          recovery, then independently catches recurring cleanup/reminder scheduling failures.
          Recovery optionally rebuilds delivery callbacks using captured rescheduleOnBoot and
          always attempts due/stale deliveries; it does not rebuild reminder callbacks. Full
          boot consumer tests do not exercise this production-only recovery branch or failure.
        sources:
          - core/boot.js
          - core/server/services/gifts/index.ts
          - core/server/services/gifts/jobs/index.js
          - core/server/services/jobs-service/register-job-handlers.ts
        tests:
          - test/unit/boot/init-services.test.ts
      lifetime:
        summary: >-
          The service guard preserves the first graph/options and four subscriptions. Bindings
          are published before controller/subscriptions finish, so a later init can skip an
          incomplete graph. Scheduler sets, renderer template/partial promises including rejected
          promises, mail transport and recurring-job flags survive same-process stop. Flags are
          set only after successful scheduling, without an in-flight guard. Job tests assert
          sequential scheduling once and cron hour shape; they do not exercise
          concurrent calls, failed scheduling or backend replacement. Durable gifts/deliveries
          survive separately: real database tests assert single winners for concurrent pending
          and stale claims and sequential outcome precedence, not process restart or lease renewal.
        sources:
          - core/server/services/gifts/index.ts
          - core/server/services/gifts/jobs/index.js
          - core/server/services/gifts/gift-email-renderer.ts
          - core/server/services/gifts/gift-delivery-bookshelf-repository.ts
          - core/server/adapters/scheduling/signed-flush-scheduler.ts
          - core/server/ghost-server.ts
        tests:
          - test/unit/server/services/gifts/jobs/schedule-gift-cleanup.test.ts
          - test/unit/server/services/gifts/jobs/schedule-gift-reminders.test.ts
          - test/integration/services/gifts/gift-delivery-bookshelf-repository.test.ts
      configuration:
        summary: >-
          API URL, scheduling adapter/internal-key facade and rescheduleOnBoot are captured at
          init. Mail transport captures config then; email rendering reads settings, URL/from/
          reply-to/translation helpers per send and the bulk client resolves config/settings per
          call. The retained shared URL facade freezes base URLs. Config is immutable; injected
          test getters do not establish production hot reload.
          There is no root feature gate: checkout's member caller checks paid-members enablement,
          then GiftService validates tier, duration and Portal plans, preserving the cadence-only
          plan-gate exception. Settings supply timezone with UTC fallback; delivery is immediate
          today or 09:00 site time within 365 days. Unit fakes assert selected plan/date cases,
          mail tags, content, sender and transport selection; they do not prove root config capture.
        sources:
          - core/server/services/gifts/index.ts
          - core/server/services/gifts/gift-service.ts
          - core/server/services/gifts/gift-checkout-offer.ts
          - core/server/services/gifts/gift-date.ts
          - core/server/services/gifts/constants.ts
          - core/server/services/gifts/gift-email-service.ts
          - core/server/lib/mail/ghost-mailer.js
          - core/server/lib/mailgun/mailgun-client.js
          - core/server/services/members/members-api/controllers/router-controller.js
          - core/shared/config/loader.ts
          - core/shared/url-utils.ts
        tests:
          - test/unit/server/services/gifts/gift-service-interface.test.ts
          - test/unit/server/services/gifts/gift-email-service.test.ts
      resources:
        summary: >-
          Gifts owns its graph, mail transport, template promises, scheduler registrations/sets
          and four domain subscriptions; it borrows database, event bus, Stripe, settings, tiers,
          members/staff and scheduling/jobs backends. The bulk wrapper creates an SDK client per
          use with a 60-second timeout. Signed callbacks use current internal keys and a one-second
          offset; production error capture reports adapter failures without propagating them.
          Delivery recovery uses up to ten concurrent sends per invocation, batches of 1000 and
          at most 100 batches; unit fakes assert the concurrency bound and multi-batch continuation. Jobs own
          recurring execution, but gifts supplies no stop-claiming, drain, unregister or mail-close
          hook. DomainEvents allSettled tracks test work only and is not a production drain.
        sources:
          - core/server/services/gifts/index.ts
          - core/server/services/gifts/gift-delivery-service.ts
          - core/server/services/gifts/gift-email-renderer.ts
          - core/server/lib/mail/ghost-mailer.js
          - core/server/lib/mailgun/mailgun-client.js
          - core/server/adapters/scheduling/signed-flush-scheduler.ts
          - core/server/adapters/scheduling/error-capture.ts
          - core/server/adapters/scheduling/scheduling-default.ts
          - core/server/services/jobs-service/register-job-handlers.ts
          - core/server/ghost-server.ts
          - package.json
        tests:
          - test/unit/server/services/gifts/gift-delivery-service.test.ts
          - test/unit/server/adapters/scheduling/signed-flush-scheduler.test.ts
      failures:
        summary: >-
          Checkout persists gift/delivery before Stripe and attempts pending-row deletion on
          session failure; later session-binding failure has no compensation. Completion commits
          before best-effort dispatch/staff/buyer notices. Redemption updates member/gift/delivery
          and automation in a transaction; external transactions defer notification through an
          unreturned executionPromise continuation. Reminders commit their marker before mail,
          count per-gift failures and propagate poll failure; cleanup catches each phase and
          continues. Delivery claims pending or hour-stale sending rows, records acceptance with
          one persistence retry, and excludes failed/cancelled rows from recovery. Best-effort
          buyer/analytics failures do not undo acceptance. Unit fakes assert selected failure
          results/calls, not SQL rollback. Booted job tests assert expiry, reminder mail/markers,
          repeated-run suppression and injected failure logs; event integration asserts durable
          acceptance/cancellation with mail mocked, not exactly-once external delivery.
        sources:
          - core/server/services/gifts/gift-service.ts
          - core/server/services/gifts/gift-delivery-service.ts
          - core/server/services/gifts/gift-delivery-bookshelf-repository.ts
          - core/server/services/gifts/gift-bookshelf-repository.ts
          - core/server/services/gifts/gift-email-service.ts
          - core/server/services/gifts/index.ts
          - core/server/data/schema/schema.js
        tests:
          - test/unit/server/services/gifts/gift-service-interface.test.ts
          - test/unit/server/services/gifts/gift-service.test.ts
          - test/unit/server/services/gifts/gift-delivery-service.test.ts
          - test/integration/services/gifts/clean-gifts.test.ts
          - test/integration/services/gifts/send-gift-reminders.test.ts
          - test/integration/services/members/send-gift-reminders.test.js
          - test/integration/services/gifts/gift-delivery-processing.test.ts
    unverified: []
    blockers:
      - >-
        Add real-root export, repeated-init/changed-options, pre-init and partial-failure contracts.
        Failure after mail/scheduler construction can leave retained resources; failure after
        service publication suppresses retry and can leave missing subscriptions. Existing boot
        dependency fakes prove Stripe ordering, not construction rollback or readiness guards.
      - >-
        Define and test shutdown/restart ownership across domain handlers, unawaited boot recovery,
        external-transaction continuations, mail transport and signed scheduler registrations.
        Captured controller/job/event/analytics implementations do not follow replacement bindings.
        Per-invocation recovery limits do not bound overlapping recovery calls globally.
      - >-
        Cover production recovery's reschedule flag, error continuation, initial delivery/reminder
        registrations and key rotation using real root wiring. Only delivery callbacks are rebuilt
        by recoverPendingDeliveries; reminders rely on existing callbacks, key rotation or the daily
        job after restart. Deep scheduler tests and HTTP tests with dispatch stubbed do not prove
        the full callback-to-delivery path.
      - >-
        Characterize recurring-job concurrent scheduling, retry after rejection and same-process
        backend restart. Successful module flags are never reset; current cron regex bounds hours
        but not seconds/minutes. The production error wrapper can leave a signed time marked armed
        after a reported adapter failure; daily recovery is the backstop, not immediate retry.
      - >-
        Protect transaction/side-effect boundaries with real persistence fault tests: checkout
        delivery creation, Stripe session binding, member/gift/automation redemption, refund races
        and import reassignment. Unit transaction tokens/fulfilled executionPromise and invocation
        order do not prove commit/rollback; sequential webhook duplicate-row coverage does not prove
        concurrent completion or notification uniqueness.
      - >-
        Preserve and decide failure semantics explicitly: reminders may be missed after their
        marker commits; buyer notices have no durable retry; recipient mail can repeat after a
        crash or a send outlasting the one-hour stale threshold. Claims have no heartbeat/fencing
        token, and acceptance can precede failed persistence. Existing claim races and mocked mail
        are not evidence of crash-safe or exactly-once transport behavior.
      - >-
        Cover failed template/partial loads retained in renderer caches, real-root mail/config
        capture and delivery/analytics failure interaction. Existing policy/transport fakes and
        test config changes do not establish replacement behavior or production hot reload.
  identity-tokens:
    kind: directory
    disposition: migrate
    futureHome: core/server/auth/identity-tokens
    status: audited
    auditedAt: 5dae46983fe5423a900214dfc1906f5d14e637d2
    migration:
      complexity: straightforward
      modelImpact: fits
      reason: >-
        The guarded wrapper retains one token service with a captured issuer and live
        signing-key provider, and owns no resources. Replace instance access with the ready
        service, retain signing-keys-before-identity boot order, and update the identities
        endpoint and ActivityPub consumer. The merged root tests now characterize retention,
        live keys, pre-init access and retry after failed composition.
      reviewedAt: 61ac1e5058fa4657def92d7b362e197314b1a88d
      sources:
        - core/server/services/identity-tokens/identity-token-service-wrapper.js
        - core/server/services/identity-tokens/identity-token-service.ts
        - core/server/api/endpoints/identities.js
        - core/server/services/activitypub/activity-pub-service-wrapper.js
        - test/unit/server/services/identity-tokens/index.test.ts
      dependencies:
        complexity: straightforward
        reason: >-
          The wrapper already supplies the signing-key provider and captured issuer;
          jsonwebtoken.sign is the only remaining runtime library import in the implementation. The
          signing provider is read per token, so root wiring must preserve key rotation rather than
          capture a key. ActivityPub and the identities endpoint are the two production instance
          consumers to adapt.
        preparation:
          - >-
            Inject the token-signing function from the root, retaining direct imports of allowlisted
            libraries and the live signing-key provider.
          - >-
            Preserve signing-keys readiness before Identity Tokens and adapt ActivityPub and the
            identities endpoint together with the root export change.
        reviewedAt: 44ad405bff4a8700af2ed51f833ebc08d25dddff
        sources:
          - core/server/services/identity-tokens/identity-token-service-wrapper.js
          - core/server/services/identity-tokens/identity-token-service.ts
          - core/server/services/activitypub/activity-pub-service-wrapper.js
          - core/server/api/endpoints/identities.js
          - core/boot.js
    entryPoints:
      - identity-tokens/index.js
    notes: >-
      Suggested future home after this migration: server/auth/identity-tokens; Admin issuer, staff email/role claims and
      short token expiry are authentication policy. ActivityPub consumes that identity capability
      rather than owning it. Preserve the configured service at its destination; no source has
      moved. Staff identity-token issuance is boot-owned; preserve the captured issuer and
      identity provider while keeping signing-key selection live.
    contracts:
      exports:
        summary: >-
          The CommonJS root re-exports IdentityTokenServiceWrapper with static async init and
          writable instance, initially undefined. The implementation file separately exports
          the IdentityTokenService constructor and getTokenForUser instance method; there is
          no validation API or shutdown hook.
        sources:
          - core/server/services/identity-tokens/index.js
          - core/server/services/identity-tokens/identity-token-service-wrapper.js
          - core/server/services/identity-tokens/identity-token-service.ts
        tests:
          - test/unit/server/services/identity-tokens/index.test.ts
      construction:
        summary: >-
          The wrapper is the only production construction site found. First init captures the
          absolute admin URL and signingKeys.service.forPurpose(staff), then publishes
          IdentityTokenService synchronously within the async method. A truthy instance makes
          later calls return without reconstructing dependencies.
        sources:
          - core/server/services/identity-tokens/identity-token-service-wrapper.js
          - core/server/services/signing-keys/signing-key-service.ts
        tests:
          - test/unit/server/services/identity-tokens/index.test.ts
      consumers:
        summary: >-
          Boot calls init. The authenticated identities endpoint reads the current instance
          for each request, passing the user's email and loaded role; failed role loading logs
          a warning and passes null. ActivityPub instead retains the instance supplied during
          its initialization and uses it to sign an Owner token for remote configuration.
          Existing API tests verify Owner/Administrator JWTs through HTTP JWKS and reject an
          Editor; they do not cover wrapper replacement or ActivityPub's real token connection.
          Root tests cover successful role loading through the identities controller; the
          failed-role fallback and ActivityPub's dependency hand-off are source evidence.
        sources:
          - core/boot.js
          - core/server/api/endpoints/identities.js
          - core/server/web/api/endpoints/admin/routes.js
          - core/server/services/activitypub/activity-pub-service-wrapper.js
          - core/server/services/activitypub/activity-pub-service.ts
        tests:
          - test/legacy/api/admin/identities.test.js
          - test/unit/server/services/identity-tokens/index.test.ts
      startup:
        summary: >-
          initCore awaits signing-key initialization before initServices awaits identity init
          with other prerequisites. ActivityPub background init checks instance and logs then
          returns if it is absent; the identities endpoint dereferences it without that guard.
          Importing this root alone does not initialize signing keys or issue a token.
          Root tests cover import behavior, endpoint signing after explicit initialization,
          and retry after missing signing keys or provider-selection failure. Production boot
          ordering, ActivityPub's background startup guard and the endpoint's unguarded
          pre-init access are source evidence.
        sources:
          - core/boot.js
          - core/server/services/identity-tokens/identity-token-service-wrapper.js
          - core/server/api/endpoints/identities.js
          - core/server/services/activitypub/activity-pub-service-wrapper.js
        tests:
          - test/unit/server/services/identity-tokens/index.test.ts
      lifetime:
        summary: >-
          Normal repeated initialization retains one process-local instance, issuer and
          purpose provider, with no reset path. The provider closes over its SigningKeyService
          and reads that service's settings cache on use. Each token call allocates its own
          claims object; no user or role is stored on the shared service. Root tests verify
          retained instance, issuer and provider identity, with live signing-key lookups.
          The absence of a reset path, the provider's settings-cache access and isolation
          between calls for different users and roles are source evidence.
        sources:
          - core/server/services/identity-tokens/identity-token-service-wrapper.js
          - core/server/services/identity-tokens/identity-token-service.ts
          - core/server/services/signing-keys/signing-key-service.ts
        tests:
          - test/unit/server/services/identity-tokens/index.test.ts
      configuration:
        summary: >-
          The issuer URL is captured at construction; the retained provider supplies a key
          per call. Tokens use email as sub, include role only for string arguments, and use
          RS256, a five-minute expiry and the provider's kid. The unit test verifies a token's
          subject, role, issuer and kid. Root tests additionally verify a five-minute expiry,
          omitted role, retained issuer and use of the provider's changed signing key through
          a retained instance. This does not exercise a full signing-key rotation workflow.
        sources:
          - core/server/services/identity-tokens/identity-token-service-wrapper.js
          - core/server/services/identity-tokens/identity-token-service.ts
          - core/server/services/signing-keys/signing-key-service.ts
        tests:
          - test/unit/server/services/identity-tokens/identity-token-service.test.ts
          - test/unit/server/services/identity-tokens/index.test.ts
      resources:
        summary: >-
          This service stores only issuer and provider references; it acquires no timer,
          listener, network client or database connection. Signing uses the shared key
          service and its public-key metadata cache. The wrapper has no cleanup registration
          or tracking of in-flight token calls; key storage and rotation belong to dependencies.
        sources:
          - core/server/services/identity-tokens/identity-token-service-wrapper.js
          - core/server/services/identity-tokens/identity-token-service.ts
          - core/server/services/signing-keys/signing-key-service.ts
          - core/server/lib/public-jwk.ts
        tests: []
      failures:
        summary: >-
          Dependency lookup or construction failure rejects init before instance assignment,
          leaving a later call able to try again. Missing/invalid signing keys and JWT signing
          failures reject token issuance without a local retry or fallback. The endpoint only
          catches role lookup failures; ActivityPub catches token/request failures in its own
          remote-configuration methods. Root tests assert missing-prerequisite and provider
          selection retries, plus token lookup failure and later success on the same instance.
        sources:
          - core/server/services/identity-tokens/identity-token-service-wrapper.js
          - core/server/services/identity-tokens/identity-token-service.ts
          - core/server/api/endpoints/identities.js
          - core/server/services/activitypub/activity-pub-service.ts
        tests:
          - test/unit/server/services/identity-tokens/index.test.ts
    unverified: []
    blockers:
      - >-
        Preserve real boot ordering and retained consumers through a complete signing-key
        rotation or same-process restart. Root tests now cover missing-prerequisite retry,
        repeated init, captured issuer and a changed key returned by the retained provider;
        they do not exercise the full rotation workflow or define restart ownership.
      - >-
        Characterize concurrent token calls and ActivityPub's real token connection. The root
        suite verifies the real identities controller response, optional role, exact expiry
        and key lookup failure recovery. Actual JWT signing failure recovery remains untested;
        ActivityPub's implementation tests use a fake token service.

  jobs-service:
    kind: directory
    disposition: split
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    migration:
      complexity: complex
      modelImpact: may-change
      reason: >-
        Initialization intentionally reuses the same object but clears handlers on every
        boot; consumers retain it through shutdown, then boot registers handlers and starts
        its backend again. Decide how one-time construction relates to per-boot reset,
        readiness and restart. A memoized init alone would skip required reset, while
        replacing the object would strand retained consumers.
      reviewedAt: f276513ba32b7114fd5cc4f7b02d3f82c0c31e3e
      sources:
        - core/server/services/jobs-service/index.ts
        - core/server/services/jobs-service/jobs-service.ts
        - core/boot.js
        - test/unit/server/services/jobs-service/index.test.js
        - test/unit/server/services/jobs-service/retained-consumer.test.ts
      dependencies:
        complexity: complex
        reason: >-
          Queue/backend, logging, reporting and outbox dependencies are mostly injected, but
          register-job-handlers imports job classes across services and receives every handler's
          service from boot. It is application composition inside the queue
          implementation, and registration must occur after its service dependencies exist.
        preparation:
          - >-
            Move cross-service handler registration to application boot composition, keeping
            queue-specific implementation independent of other service roots.
          - >-
            Inject cron validation and after-commit scheduling into JobsService; preserve
            transaction boundaries and registration-before-start on the retained queue.
          - >-
            Keep per-boot handler reset and activation separate from one-time dependency
            construction.
        reviewedAt: 44ad405bff4a8700af2ed51f833ebc08d25dddff
        sources:
          - core/server/services/jobs-service/index.ts
          - core/server/services/jobs-service/jobs-service.ts
          - core/server/services/jobs-service/register-job-handlers.ts
          - core/server/services/jobs-service/jobs-outbox.ts
          - core/server/services/jobs-service/outbox-relay.ts
          - core/boot.js
    entryPoints:
      - jobs-service/index.ts
      - jobs-service/register-job-handlers.ts
    notes: >-
      Planned split and relocation out of services: generic scheduling, dispatch, execution
      and outbox machinery belong in kernel; application configuration, registration and
      activation belong in boot; job definitions and handlers belong with their owning
      services. The kernel boundary must exclude Ghost's config/schema imports and concrete
      database wiring, including outbox availability checks and the jobs_outbox mapping. No
      source has moved. Reassess initialization after separating ownership rather than
      migrating this root in place. Preserve the retained process instance, per-boot handler
      reset, registration-before-start and backend-specific shutdown. Relocation does not
      remove the queue's dependency, readiness or lifetime contracts.
    contracts:
      exports:
        summary: >-
          Named TypeScript init/getInstance/shutdown exports. getInstance throws before
          initialization; shutdown before initialization resolves without constructing a
          service. Boot separately imports register-job-handlers to wire domain handlers.
        sources:
          - core/server/services/jobs-service/index.ts
          - core/server/services/jobs-service/register-job-handlers.ts
          - core/boot.js
        tests:
          - test/unit/server/services/jobs-service/index.test.js
      construction:
        summary: >-
          The first init constructs JobsService with the configured jobs adapter. Subsequent
          init calls clear handler and queue declarations and reuse the same service and
          backend rather than looking up a new adapter.
        sources:
          - core/server/services/jobs-service/index.ts
          - core/server/services/jobs-service/jobs-service.ts
        tests:
          - test/unit/server/services/jobs-service/index.test.js
          - test/unit/server/services/jobs-service/jobs-service.test.ts
      startup:
        summary: >-
          Boot registers handlers after asynchronous service prerequisites settle, awaits
          jobs.start, then starts automation polling.
        sources:
          - core/boot.js
          - core/server/services/jobs-service/jobs-service.ts
        tests:
          - test/unit/boot/init-services.test.ts
          - test/e2e-server/boot-readiness.isolated.test.ts
      lifetime:
        summary: >-
          The wrapper retains its jobs instance through shutdown. MentionController
          retains the injected instance and calls dispatch; reinitialization clears
          handlers and queue declarations before registration.
        sources:
          - core/server/services/jobs-service/index.ts
          - core/server/services/jobs-service/jobs-service.ts
          - core/server/services/mentions/mention-controller.js
        tests:
          - test/unit/server/services/jobs-service/index.test.js
          - test/unit/server/services/jobs-service/jobs-service.test.ts
          - test/unit/server/services/jobs-service/retained-consumer.test.ts
      consumers:
        summary: >-
          Source inspection establishes these callers: boot injects the instance into
          retained mentions and email consumers and a fresh site importer. Members, content CSV imports, the media inliner and email analytics
          resolve it when dispatching or scheduling. Gift/member cleanup, signing keys,
          update checks and Tinybird schedule through boot-supplied references. The default
          backend runs jobs in-process; registered handlers call initialized domain services.
          The cited tests cover dispatch through a retained MentionController across restart
          and handler registration. The other consumer wiring is source-only evidence here.
        sources:
          - core/boot.js
