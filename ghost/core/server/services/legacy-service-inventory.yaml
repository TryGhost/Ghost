          - test/e2e-api/admin/member-custom-fields.test.ts
          - test/unit/server/services/newsletters/service.test.js
          - test/unit/server/services/email-service/email-service.test.js
    unverified: []
    blockers:
      - >-
        Pin root construction/export identity, pre-init behavior, exact load arguments and boot
        ordering, including strict billing-enabled/default help and subscription defaults.
        Characterize retained callers, the public theme allowlist and in-flight checks across
        reload/restart before replacing the shared instance or map.
      - >-
        Characterize failed reload after earlier valid entries and recovery, config-read failure
        and query rejection. First-entry failure tests do not prove atomic load or rollback.
        Treat string false, noncanonical names, invalid periodic dates and partial loading as
        recorded compatibility hazards; fix them separately from initialization if desired.
      - >-
        Extend real-root consumer assertions for staff reactivation/promotion/import, integration
        creation, public-site/social/analytics policy, media/thumbnail uploads, theme-install
        exceptions and webhook filtering. Existing helper, webhook and theme-install tests use
        injected/stubbed limits; add targeted tests for the retained production compositions.
      - >-
        Verify counted-query boundaries, periodic history and recipient addedCount through real
        consumers, plus retry/resume differences and concurrent capacity decisions. A max-zero
        refusal and package query stubs do not prove date filtering, staff exclusions or safe
        concurrent check-then-write behavior. Initialization must keep borrowing database/transaction
        ownership without adding untested cancellation or cleanup behavior.
      - >-
        Keep host-policy business logic outside HTTP; moving the root wholesale into API would
        conflict with the placement rules. Recorded facets do not establish migration readiness.
