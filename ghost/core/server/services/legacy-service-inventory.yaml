      consumers:
        summary: >-
          Boot retains the root and injects the API into email analytics. Admin automation,
          statistics, run/history and action-link controllers import that API directly; member
          repository and link tracking retain it for signup and transactional click recording.
          Scheduler registration retains the service. Member signup captures member/tier data:
          with an outer transaction, new automation creation runs in a detached post-commit
          callback; otherwise it is awaited. Legacy signup writes its run in the caller's
          transaction and dispatches after commit. Member-flow tests use the real member API,
          signed poll HTTP, subscriptions, DB and renderer, asserting two email payloads/counts
          while replacing scheduler/provider sends. Analytics integration asserts persisted
          delivery/open results with provider events and cursors substituted. These establish
          selected wiring, not replacement compatibility or a durable signup-to-run outbox.
