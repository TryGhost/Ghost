          CommonJS exports one eager SettingsHelpers instance; the deep module exports its
          constructor. Synchronous instance methods require their receiver and return settings
          decisions, Stripe keys, addresses, domains or signed URLs. Five injected properties
          are public and mutable; the themes endpoint destructures settingsCache directly.
          There is no init/reset/shutdown API. Deep-class tests exercise selected methods,
