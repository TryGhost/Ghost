          cache. Every BREAD factory call creates a SingleUseTokenProvider and BREAD instance;
          its constructor creates GhostMailer and MagicLink. Settings/notifications endpoints
          retain separate instances at lazy module load, and recommendations constructs another
          during its init. Model/default migration use settings-utils directly to avoid full
          service boot; its generated site UUID is module-cached. Tests construct injected BREAD
          classes or boot the endpoints, not factory count, partial construction or mail cleanup.
        sources:
