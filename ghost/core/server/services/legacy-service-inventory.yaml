    notes: >-
      Suggested future home after this migration: Ghost-wide entitlement/quota policy belongs in
      core/shared/limits. The reusable limit engine stays in @tryghost/limit-service. Boot
      injects configuration and database dependencies so Shared does not import server code. No
      source has moved. Boot loads host policy into an eagerly exported, widely retained
      instance. Preserve per-consumer enforcement and existing configuration quirks.
    contracts:
      exports:
        summary: >-
          Named TypeScript exports are limitService and synchronous receiver-independent init
          returning undefined. Callers use the instance's synchronous isLimited/isDisabled, async
          throwing and boolean checks, and public limits map; the theme installer reads an
          allowlist directly. Package instance methods depend on their receiver. No test pins
          the root's exact export or receiver surface.
        sources:
