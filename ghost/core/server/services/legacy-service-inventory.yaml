        - core/server/services/update-check/index.js
      dependencies:
        complexity: straightforward
        reason: >-
          The retained notifications instance already receives its cache and Settings model.
          Remaining dependencies are version comparison, utility and HTML-sanitizing functions, plus
          legacy Moment. The separately constructed email helper uses the same sanitizer, so its
          caller must retain an explicit composition path; no service cycle is needed for these
          dependencies.
        preparation:
          - >-
            Inject version/comparison, utility and sanitizing operations, and use the existing
            kernel clock for Moment.
          - >-
            Give the caller-constructed email helper an explicit sanitizer dependency or a shared
            library home; update Update Check without making it depend on notification-service
            readiness.
        reviewedAt: 44ad405bff4a8700af2ed51f833ebc08d25dddff
        sources:
          - core/server/services/notifications/index.js
          - core/server/services/notifications/notifications.js
          - core/server/services/notifications/notification-email.ts
          - core/server/services/notifications/sanitize-notification-html.ts
