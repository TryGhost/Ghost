          - test/e2e-api/members/member-answers.test.ts
          - test/e2e-api/members/webhooks.test.js
      startup:
        summary: >-
          Boot calls init during initCore after database/settings/signing-key/i18n setup and
          before members/tiers composition. Initialization has no feature gate, database-ready
          validation or rollback. API callers assume exported instances exist. Definition reads
          remain available when direct definition writes are blocked by Labs or a namespace's
          limits.
          HTTP tests assert those direct route responses, not dependency ordering, pre-init
          calls or startup faults. Shipped ceiling validation runs at import.
        sources:
          - core/boot.js
          - core/server/services/members-metafields/index.ts
          - core/server/services/members-metafields/config.ts
