      startup:
        summary: >-
          Boot loads both compositions during initServices and calls automations init after
          dependent service initialization, job-handler registration and awaited jobs.start,
          before conditional post rescheduling. Boot's await of synchronous init cannot establish
          first-poll completion. Both new and legacy pollers are subscribed regardless of the
          automations flag; that flag chooses signup enrollment paths, not whether persisted
          work is processed. Browsing the repository also creates missing default automations
          and copies eligible legacy email content, so it is not a read-only readiness check.
          Boot units hold jobs startup and assert synchronous init error identity/short-circuit;
          real boot HTTP holds jobs startup and asserts maintenance before automation init.
          Service units assert deferred dispatch, and Admin HTTP checks default creation/copying.
          None asserts failed first-poll recovery or first-poll completion as readiness.
