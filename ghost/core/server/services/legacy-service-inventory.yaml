      failures:
        summary: >-
          Synchronous init failure reaches boot; later poll-level rejection is swallowed by
          oneAtATime. Scheduler/key failure logs after the local timer is armed. New polling logs
          per-step failures and continues peers; send/advance failures retry after ten minutes
          up to ten attempts, but recipient or analytics-scheduling failure is logged and allows
          completion without retrying the sent mail. Email sending is outside DB transactions:
          failure advancing an already sent step can retry its send. Legacy polling sends before
          its recipient/completion transaction, retries that failure, and discards per-run rejected
          allSettled results. Tests assert selected stubbed retry/continuation paths; legacy DB
          integration injects completion failure and asserts recipient rollback plus retry with
          fake sending. Real execution/history HTTP asserts a recorded send followed by final
          advancement failure using a fake sender. Browse falls back to SQL on unusable Tinybird
          stats, while performance/run endpoints fail; intercepted HTTP asserts fallback without
          retry and retains zero stats for a successful empty response. These do not guarantee
          exactly-once delivery, crash recovery or drain completion.
