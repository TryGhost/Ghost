        - core/boot.js
        - test/unit/server/services/content-import/index.test.ts
      dependencies:
        complexity: complex
        reason: >-
          The root injects the importer collaborators, but ZIP preparation still constructs archive
          and storage-backed asset collaborators below it. CSV, HTML and row-validation helpers also
          import libraries directly. Moving those dependencies requires preserving per-import
          acquisition and the existing call-time jobs, media, storage, URL and timezone lookups
          rather than capturing them at boot.
        preparation:
          - >-
            Make source and asset preparation accept root-wired factories, retaining new archive and
            asset-importer state per import and the existing storage acquisition timing.
          - >-
            Expose parser, filesystem, HTML, string and validation operations through local helper
            factories; preserve the row schemas and validate any proposed stateless-library
            allowance individually.
          - >-
            Use the existing clock compatibility export for Moment and inject logging without
            replacing the existing lazy jobs/media/storage callbacks.
        reviewedAt: 44ad405bff4a8700af2ed51f833ebc08d25dddff
        sources:
