    blockers:
      - >-
        Preserve both composition paths and retained callers; pin import-time repository and
        transport acquisition, synchronous init/dispatch return behavior, dependency capture,
        root identity and partial-subscription/registration failure before changing lifecycle.
        Current boot barrier/error tests already cover orchestration with substituted services.
      - >-
        Define stop-accepting, timer cancellation, subscription/scheduler ownership and in-flight
        draining before supporting reinitialization. The oneAtATime completion promise does not
        include a held queued invocation; add that assertion before relying on it for draining.
        Existing event settlement and timer tests do not establish production shutdown.
      - >-
        Preserve failure/recovery semantics across both pollers: detached post-commit signup,
        fetch/lookup/claim failure, fresh-lock recovery without another event, partial init,
        legacy concurrent claims and sends that outlive locks remain lifecycle obligations.
        Sending and completion are separate effects; test crash/advance-failure duplication
        boundaries rather than promising exactly-once provider delivery.
      - >-
        Characterize captured multiplier/URL/site identity versus accessor-based flags, keys and
        wrapper dependencies. Keep the existing API validation, statistics fallback, run history,
        tracking transactions and HTTP-owned add gates/soft count limit intact during migration;
        do not move further business policy into HTTP or make unrelated gaps pilot prerequisites.
  content-import:
