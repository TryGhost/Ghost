  webhooks:
    kind: directory
    disposition: migrate
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    migration:
      complexity: complex
      modelImpact: fits
      reason: >-
        Unify the dispatch graph and separately constructed management API under a clear
        root. Listener registration currently keeps existing named callbacks, so rebuilding
        the trigger graph does not replace what those callbacks capture; preserve
        intentional identity and remove only newly acquired registrations after a failed
        start. One returned composition can fit, but consumer and listener ownership need
        coordinated changes.
      reviewedAt: f276513ba32b7114fd5cc4f7b02d3f82c0c31e3e
      sources:
        - core/server/services/webhooks/index.js
        - core/server/services/webhooks/listen.js
        - core/server/services/webhooks/webhooks-service.js
        - core/server/api/endpoints/webhooks.js
        - core/boot.js
      dependencies:
        complexity: straightforward
        reason: >-
          The root already composes the serializer, payload builder and trigger. Remaining
          dependencies are a deferred API serializer lookup, member-metafield filtering and trigger
          transport/logging/config helpers. They fit those existing seams if API and Members access
          remains deferred; listener lifetime and duplicate registration are separate migration
          concerns.
        preparation:
          - >-
            Inject serializer operations and member-metafield filtering from index.ts, preserving
            deferred API/Members access rather than loading the API graph during root construction.
          - >-
            Select the transport in the root using the current internal-IP policy, and inject
            debug/logger/version plus collection helpers without moving crypto out of its direct
            allowance.
        reviewedAt: 44ad405bff4a8700af2ed51f833ebc08d25dddff
        sources:
          - core/server/services/webhooks/index.js
          - core/server/services/webhooks/serialize.js
          - core/server/services/webhooks/webhook-trigger.js
          - core/server/services/webhooks/listen.js
          - core/boot.js
    entryPoints:
      - webhooks/index.js
      - webhooks/webhooks-service.js
    notes: >-
      Boot owns event dispatch; a separate deep factory supplies the Admin management endpoint.
      Preserve both compositions and distinguish transaction-deferred events from durable delivery.
    contracts:
      exports:
        summary: >-
          CommonJS root exports synchronous, receiver-independent listen, returning undefined.
          It exposes no trigger instance, init or disposer. The deep webhooks-service factory
          returns a fresh receiver-dependent WebhooksService with async add; the trigger class
          and serialize/payload/listener factories are private support. The endpoint retains
          one management instance and uses its add, while edit/destroy call the model directly.
          HTTP tests cover selected management results. Root units pin the exact export, listen
          only and returning undefined, with nothing registered before it; endpoint units pin add
          through the management service, which reads the shared Webhook model per call, duplicate
          rejection, the three foreign-key translations and rethrow of other failures.
        sources:
          - core/server/services/webhooks/index.js
          - core/server/services/webhooks/webhooks-service.js
          - core/server/services/webhooks/webhook-trigger.js
          - core/server/api/endpoints/webhooks.js
        tests:
          - test/unit/server/services/webhooks/index.test.ts
          - test/unit/server/api/endpoints/webhooks.test.ts
          - test/unit/server/services/webhooks/webhook-service.test.js
          - test/e2e-api/admin/webhooks.test.js
      construction:
        summary: >-
          Every listen call requires models/limits/events/URL/member dependencies, creates a
          serializer and payload closure plus WebhookTrigger, then registers event callbacks.
          Transport is selected once per trigger unless injected. Member metafields use a
          callback reading membersService.api when invoked, rather than a captured member API.
          The management endpoint constructs its own service at module evaluation, normally
          reached during lazy Admin router setup. No other production constructor/deep consumer
          was found. Units test injected trigger and serializer construction, including transport
          choice. Root units compose the real root: transport follows the config set before listen
          (user agent on the wire), and URL relations and the members API are read when an event
          is serialized. Whether a repeated listen's new trigger reaches any listener is not
          observable through the root, since its listeners are not replaced (see lifetime).
        sources:
          - core/server/services/webhooks/index.js
          - core/server/services/webhooks/webhook-trigger.js
          - core/server/services/webhooks/serialize.js
          - core/server/api/endpoints/webhooks.js
          - core/server/api/endpoints/index.js
          - core/server/web/api/app.js
          - core/server/web/api/endpoints/admin/app.js
          - core/shared/express.js
        tests:
          - test/unit/server/services/webhooks/index.test.ts
          - test/unit/server/api/endpoints/webhooks.test.ts
          - test/unit/server/services/webhooks/trigger.test.js
          - test/unit/server/services/webhooks/serialize.test.js
      consumers:
        summary: >-
          Boot calls listen. Common model events drive post/page/tag/member delivery; response
          finish with full cache invalidation emits site.changed. Listeners skip importing and
          launch trigger without awaiting it. The Admin endpoint separately adds definitions
          and authorizes management. Root units pin the 29-event mapping, one named listener per
          event, lookups for the emitted event and import suppression. HTTP suites exercise selected publish/add/edit payloads
          through real API/model composition and a Nock-backed receiver; custom-field tests
          assert current/previous values and omissions. Import suppression is checked after
          importer settlement plus a bounded wait, not a webhook drain. These tests establish
          intercepted payloads, not durable delivery, every event or external receiver behavior.
          A focused local run completed custom-field payload assertions but reproducibly timed
          out draining DomainEvents after the create-with-fields case; settlement remains a gap.
        sources:
          - core/boot.js
          - core/server/services/webhooks/listen.js
          - core/server/models/post.js
          - core/server/models/tag.js
          - core/server/models/member.js
          - core/server/web/parent/middleware/emit-events.js
          - core/server/api/endpoints/webhooks.js
        tests:
          - test/e2e-webhooks/posts.test.js
          - test/e2e-webhooks/pages.test.js
          - test/e2e-webhooks/tags.test.js
          - test/e2e-webhooks/members.test.js
          - test/e2e-webhooks/site.test.js
          - test/e2e-webhooks/zapier-custom-fields.test.ts
          - test/e2e-webhooks/posts-importer.test.ts
          - test/e2e-api/admin/webhooks.test.js
          - test/unit/server/services/webhooks/index.test.ts
      startup:
        summary: >-
          Importing the root defers model/service construction until listen. Boot prepares
          models, limits and dynamic routing before invoking listen alongside service init;
          member access is deferred until serialization. Listen registers synchronously and
          does not wait for any delivery. Management construction has no boot hook and can
          occur on the first Admin request. Existing HTTP suites exercise a normal booted
          pipeline. Boot units pin one listen after Mentions init, boot awaiting what it returns
          before jobs and a failure stopping jobs. Explicit settings/member/URL readiness failures
          and rollback after a later initializer fails remain untested.
        sources:
          - core/boot.js
          - core/server/services/webhooks/index.js
          - core/server/services/webhooks/listen.js
          - core/server/web/parent/backend.js
          - core/server/web/api/app.js
          - core/server/web/api/endpoints/admin/routes.js
        tests:
          - test/unit/boot/init-services.test.ts
          - test/unit/server/services/webhooks/index.test.ts
          - test/e2e-webhooks/members.test.js
          - test/e2e-api/admin/webhooks.test.js
      lifetime:
        summary: >-
          Registration skips any event already having a callback named processWebhookTrigger;
          repeated listen therefore creates new collaborators but retains previous callbacks
          and triggers for registered events. No unsubscribe/reset exists. Each trigger queries
          definitions afresh, builds one payload, and awaits sends serially; separate events
          can overlap without a shared queue. Models are retained by reference across async
          serialization. Model transactions defer event emission until committed=true, using
          mutable model state, not a persisted delivery record. Units assert one payload for
          two hooks and serial delivery: the next request starts once the previous settles. Root
          units pin that a repeated listen adds no listener. Members HTTP tests capture an emitted model then
          call the serializer directly; they do not prove rollback-safe network delivery.
        sources:
          - core/server/services/webhooks/index.js
          - core/server/services/webhooks/listen.js
          - core/server/services/webhooks/webhook-trigger.js
          - core/server/services/webhooks/serialize.js
          - core/server/lib/common/events.js
          - core/server/models/base/plugins/events.js
          - core/server/models/base/bookshelf.js
        tests:
          - test/unit/server/services/webhooks/index.test.ts
          - test/unit/server/services/webhooks/trigger.test.js
          - test/e2e-api/members/webhooks.test.js
      configuration:
        summary: >-
          The trigger captures transport according to security:allowWebhookInternalIPs:
          default false uses request-external; true uses @tryghost/request. Existing listeners
          retain that choice. Limits are consulted per event; URL relations and the current
          members API are read during serialization. Every delivery reads stored target/secret,
          sends current Ghost Content-Version rather than stored api_version, and optionally
          signs JSON body plus timestamp with HMAC-SHA256. Request options ask for two seconds
          and retry limit five outside tests, zero in tests; installed Got excludes POST from
          retry methods, so the limit alone does not enable retries. Units assert transport,
          exact request options and retry limits, body/headers and exact signature; root units
          assert each transport's user agent and the safe-version Content-Version on the wire;
          the integration suite shows @tryghost/request abandoning a target slower than two
          seconds and not retrying a POST outside tests. request-external's test-only init hook
          replaces the timeout, so its production timeout is source-only.
          Test config replacement does not establish hot reload of captured collaborators.
        sources:
          - core/server/services/webhooks/index.js
          - core/server/services/webhooks/webhook-trigger.js
          - core/server/services/webhooks/serialize.js
          - core/server/services/limits.ts
          - core/server/lib/request-external.js
          - core/shared/config/defaults.json
        tests:
          - test/unit/server/services/webhooks/trigger.test.js
          - test/unit/server/services/webhooks/serialize.test.js
          - test/unit/server/services/webhooks/index.test.ts
          - test/integration/services/webhook-request.test.ts
          - test/e2e-webhooks/site.test.js
      resources:
        summary: >-
          The root retains common EventEmitter callbacks and borrows shared models/services
          and HTTP transports. There is no jobs-service queue, delivery outbox, replay worker,
          in-flight registry, stop hook or drain. Transaction event deferral is memory-only.
          request-external owns shared keep-alive agents; @tryghost/request owns a shared DNS
          cache with unref'd cleanup timers. Neither is disposed by this root. Trigger awaits
          each request and a 410 destroy, but last-triggered edits are launched without awaiting
          persistence. Nock transport tests use fake models/payload/limits and prove POST routing
          and outcomes for both clients, not socket cleanup or database completion; units pin that
          the trigger does not wait for the last-triggered write.
        sources:
          - core/server/services/webhooks/index.js
          - core/server/services/webhooks/listen.js
          - core/server/services/webhooks/webhook-trigger.js
          - core/server/lib/common/events.js
          - core/server/lib/request-external.js
          - core/server/models/base/plugins/events.js
          - core/server/data/schema/schema.js
        tests:
          - test/integration/services/webhook-request.test.ts
      failures:
        summary: >-
          Lookup/payload failures log and return without sends. Ordinary asynchronous request
          failures call onError and allow the loop to continue; JSON/HMAC/model-getter, synchronous
          request or callback/logger exceptions outside preparation can reject an unobserved
          trigger. Update/destroy rejection only warns. Source reveals a transport mismatch:
          default request-external retains HTTP status on error.response.statusCode, while
          onError reads error.statusCode for 410 removal and status persistence; the alternate
          request wrapper flattens response fields. The integration suite reproduces it with real
          Got errors and pins today's behavior: through request-external a 410 records an
          undefined status instead of destroying the webhook, and other error statuses record
          as undefined; through @tryghost/request a 410 destroys and a 500 records 500. Units pin
          awaited 410 removal, write and removal failure warnings, failure continuation and
          lookup failure logging.
          Management rejects duplicates and translates selected foreign-key errors; check/add
          has no atomic uniqueness guard. HTTP tests assert duplicate/orphan 422 and selected
          management statuses; units assert payload failure logging and injected error text,
          and endpoint units assert duplicate and foreign-key translation.
        sources:
          - core/server/services/webhooks/webhook-trigger.js
          - core/server/services/webhooks/webhooks-service.js
          - core/server/models/webhook.js
          - core/server/lib/request-external.js
          - core/server/data/schema/schema.js
          - core/server/api/endpoints/webhooks.js
        tests:
          - test/unit/server/services/webhooks/trigger.test.js
          - test/unit/server/services/webhooks/webhook-service.test.js
          - test/integration/services/webhook-request.test.ts
          - test/unit/server/api/endpoints/webhooks.test.ts
          - test/e2e-api/admin/webhooks.test.js
    unverified: []
    blockers:
      - >-
        Partial registration after a failure part-way through listen is unpinned. Decide how
        retained listener dependencies and captured transport survive restart without duplicates
        or leaked listeners.
      - >-
        Add real commit/rollback-to-delivery coverage and shutdown assertions. Preserve import suppression and current/previous payloads
        without assuming mutable event models are snapshots or intercepted sends are durable.
        On committed=false the model retains ghostEvents; reuse would skip registering another
        transaction callback. No production reuse path or reproduction has been established.
      - >-
        Resolve default-transport error status handling: request-external errors carry the status
        on error.response, so a 410 is not deleted and the recorded status is undefined. Real Got
        errors reproduce it; the tests pin today's behavior.
      - >-
        Cover synchronous/post-preparation exceptions and concurrent duplicate creation. Define delivery/replay and disposal ownership
        before adding a lifecycle; existing code has no durable queue or drain.
standard:
  app-installations:
    extras:
      actingContext:
        purpose: Convert API authentication context into the staff actor recorded in installation history.
        callers:
          - core/server/api/endpoints/app-installations.ts
        timing: Pure conversion when an API command runs; it does not require initialization.
        dependencies: []
        failurePolicy: A missing staff user or an integration yields a null actor; permission checks remain with the API.
        destination: A normalized request actor supplied by the API framework Frame, with actor policy owned by the application.
  comments:
    lifecycle:
      - >-
        Establish mail-transport ownership on replacement/shutdown and behavior of pending
        notification/domain-event work. Comments closes no transport and registers no cleanup;
        test DomainEvents settlement and HTTP response assertions are not production drain
        guarantees. Preserve the email renderer/i18n/email-address prerequisites.
  explore-ping:
    lifecycle:
      - >-
        Decide ownership of overlapping pings, unfinished queries/requests, cancellation and
        shutdown. No service drain exists, and the request has no configured timeout; current
        tests do not establish stalled-request, HTTP-status, redirect or transport cleanup behavior.
      - >-
        Root units now pin a detached payload error rejecting ping while init resolves.
        Serialization failures, MRR rejection, post-date errors, sibling queries continuing
        after Promise.all rejects, warning details for statistics failures and boot's handling
        of the detached rejection remain uncharacterized.
  export-requests:
    lifecycle:
      - >-
        Establish pending-delivery and shared transport ownership before adding disposal.
        Retry limit zero is asserted, but actual timeout, redirect and shutdown behavior is
        not. The installed transport follows redirects; zero retries alone is not proof of
        one outbound request or safe cancellation after a lost response.
  gift-links:
    lifecycle:
      - >-
        Characterize early or failed init and a real repeated boot with changed shared dependencies.
        Root tests already assert deferred database acquisition, retained captured knex, earlier
        public/Admin consumers and propagated query errors; they do not establish recovery from init
        before DB readiness.
  indexnow-ping:
    lifecycle:
      - >-
        Decide listener disposal, restart after external listener removal and pending-request
        drain ownership. Partial-startup cleanup and repeated init are covered; normal shutdown
        has no cleanup hook. Backend-only startup and failed required boot still need coverage.
  integrations:
    lifecycle:
      - >-
        Preparation now pins direct model-failure translation and pending edit/rotation
        settlement. Resource drain, cleanup, same-process reboot and transaction rollback remain
        unproven; do not introduce those guarantees as part of initializer adoption.
  internal-keys:
    futureHome: core/server/auth/internal-keys
    lifecycle:
      - >-
        Same-process reboot remains untested. The initializer retains the same map after
        successful init and shutdown still leaves its contents intact. Actual-root units cover
        slug/type mapping, shared pending lookups, rejection retention until invalidation and
        the retained frontend consumer. Cold-boot HTTP covers real key availability and rotation.
      - >-
        Settle cache ownership and invalidation before introducing restart/replacement or
        external key refresh. This initializer migration preserves the existing policy: no
        automatic expiry, failure eviction or shutdown clear. TypeScript slug types do not
        enforce valid keys at runtime.
  invites:
    lifecycle:
      - >-
        Resolve API-mail orchestration and transport ownership without moving business logic
        into HTTP. Preserve role/limit checks and successful behavior while introducing boot
        composition; test readiness and shutdown of pending work separately.
  link-redirection:
    extras:
      linkRedirectRepository:
        purpose: Hand the ready repository to link tracking, which rebuilds post links from redirect rows, and to newsletter integration tests.
        callers:
          - core/server/services/link-tracking/index.js
          - test/integration/services/email-service/batch-sending.test.js
        timing: >-
          Available once the factory has run, which happens synchronously inside the first
          init() call and so before init resolves; until then it throws the same readiness
          error as the service getter. Boot awaits init before link tracking's init reads it.
        dependencies:
          - The repository constructed by the factory, including its optional cache adapter and site.changed listener.
        failurePolicy: Throws IncorrectUsageError before initialization; after init it only returns the retained instance and never constructs.
        destination: Retire by narrowing link tracking to the service API or moving post-link reconstruction behind a service method.
    lifecycle:
      - >-
        Root units pin both readiness guards, repeated-init identity and failed adapter
        acquisition with retry. Pin retained frontend/link tracking consumers after root
        replacement and backend-only boot. Decide how to restore invalidation after an event-bus
        reset and dispose partially constructed repositories without changing identity. Retire
        the transitional repository accessor by narrowing link tracking to the service API.
  media-inliner:
    lifecycle:
      - >-
        Establish shared request/storage ownership and pending-work shutdown before adding disposal.
        Production timeout/retry/redirect behavior differs from the test harness; cancellation
        and orphan cleanup cannot be inferred from a bounded request or successful queue drain.
  member-welcome-emails:
    lifecycle:
      - >-
        Define and cover shutdown ownership for the locale listener, i18n, mail transport and
        outstanding sends. Failed-init retry without a stale listener is characterized; no
        root cleanup or shutdown assertion exists and the locale read at init is not refreshed
        by a later boot in the same process.
  mentions:
    lifecycle:
      - >-
        Cover listener/mapper ownership and overlapping work before introducing reset or
        shutdown. Raw event preparation and recommendation sendAll calls run outside the
        jobs backend's drain; queued processing can finish before domain subscribers.
        Root units pin one owned listener per event across repeated init and metadata
        units pin recursive mapper application, but repeated addMapper calls still
        accumulate, an unconditional mapper recurses until the stack overflows, and
        retained-controller jobs coverage does not cover the sender through a jobs restart.
        HTTP tests supply their own observation/settlement mechanisms.
  newsletters:
    lifecycle:
      - >-
        Boot now owns construction, but the initServices harness does not pin this root's
        ordering. Still protect the exact public surface and retained Admin/member consumers
        through stop/reboot and dependency failure, and define ownership/drain of the mail
        transport.
  posts-public:
    futureHome: core/server/api/endpoints/utils/public-response-cache
    lifecycle:
      - >-
        Establish lifecycle ownership before adding reset/re-init: disabled first init is
        permanent, listeners are never removed, manager cache clearing leaves retained users,
        and no root cleanup runs after boot failure or shutdown.
  recommendations:
    lifecycle:
      - >-
        Boot still does not await the initial metadata and revalidation refreshes, which the
        root starts as detached work; existing HTTP success does not establish their
        completion.
      - >-
        Timers, the mentions mapper, the event subscription and both mail transports have no
        teardown, cancellation or production event drain; defineService has no stop hook, so
        the retained graph keeps them for the process lifetime. A shutdown owner must release
        the subscription and refreshes before the root can support stop or restart.
  signing-keys:
    futureHome: core/server/auth/signing-keys
    extras:
      scheduleCheckJob:
        purpose: Attach the jobs backend and register recurring checks for an active or subsequent key rotation.
        callers:
          - core/boot.js
        timing: Background boot after signing-key readiness and jobs startup; initialization alone does not register jobs.
        dependencies:
          - A ready signing-key instance and the supplied jobs backend.
        failurePolicy: Registration errors propagate to background boot, which logs and continues; a later explicit call can retry.
        destination: A declared domain jobs contribution or shared background-activation interface, preserving the rotation callback.
    lifecycle:
      - >-
        Characterize retry after a partially completed initial check. Concurrent publication
        and retry after a rejected check are covered with a stubbed check; they do not prove
        recovery when earlier rotation steps committed before a later step failed.
      - >-
        Characterize scheduling failure after a rotation commits, concurrent registration and
        recurrence restoration across jobs restart. The module keeps scheduled after shutdown
        and has no wrapper reset; do not infer custom backend behavior from the default backend.
      - >-
        Decide ownership/drain of rotations and shared public-key cache lifetime during an
        in-process restart. Existing integration tests use injected keys and class instances,
        not root scheduling, shutdown or crypto-generation failure paths. The public-jwk
        failure test only checks repeated rejection, so it does not prove failed entries
        are evicted rather than returning the same rejected promise.
  slack-ping:
    lifecycle:
      - >-
        Decide and test listener ownership across restart/replacement and externally cleared
        emitters. Stable callbacks prevent duplication only for one implementation object;
        successful init does not restore externally removed callbacks. Failed-start rollback
        and explicit retry are covered, but there is still no normal shutdown/reset contract.
      - >-
        Characterize shutdown with pending or overlapping sends through the real request helper,
        plus production timeout, cancellation, DNS and shared-agent disposal behavior. The HTTP
        suite verifies pending delivery and logged rejection under test hooks, and root tests
        overlap stubbed requests; neither establishes shutdown draining or production HTTP policy.
        Keep per-request timeout distinct from an overall deadline.
  staff:
    lifecycle:
      - >-
        Decide an owned cleanup boundary for domain-event subscriptions. The event bus has no
        unsubscribe, so the root can only refuse a retry after a partial subscription; it
        cannot release the handlers that attempt registered.
      - >-
        Decide restart, subscription disposal, provider transport cleanup and pending-delivery
        drain ownership. Server stop currently does not reset staff or wait for its detached
        event work.
  stats:
    lifecycle:
      - >-
        Stop/reboot is not pinned: the aggregate persists across the e2e lane's reboots with the
        settings and Tinybird instance captured at first init, and a retry after a failed init
        rebuilds Tinybird's shared instance and a new query client.
      - >-
        Establish ownership and limits for optional cache/HTTP resources, in-flight queries,
        unbounded date ranges and lookup fan-out. A stopped shared database or replaced token
        root does not reset this graph; no cancellation or cache/client disposal is exposed.
  stripe-checkout-config:
    extras:
      actingContext:
        purpose: Convert API authentication context into the staff actor recorded in the config's history.
        callers:
          - core/server/api/endpoints/stripe-checkout-config.ts
        timing: Pure conversion when an API command runs; it does not require initialization.
        dependencies: []
        failurePolicy: A missing staff user or an integration yields a null actor; permission checks remain with the API.
        destination: A normalized request actor supplied by the API framework Frame, with actor policy owned by the application.
  tags-public:
    futureHome: core/server/api/endpoints/utils/public-response-cache
    lifecycle:
      - >-
        Establish lifecycle ownership before adding reset/re-init: disabled first init is
        permanent, listeners are never removed, manager cache clearing leaves retained users,
        and no root cleanup runs after boot failure or shutdown. Current tests manually restore
        global state rather than exercise production restart.
  users:
    lifecycle:
      - >-
        Test repeated boot for the shared composition. Units pin one retained instance across
        both endpoints within a single module instance, not module reload or same-process
        reboot.
