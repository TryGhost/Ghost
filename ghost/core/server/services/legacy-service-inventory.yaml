    notes: >-
      Decide which parts are built once before migrating: the API and verification trigger
      survive repeated init, while SSR, integrity-token and import/export collaborators are
      rebuilt with the secrets and settings they capture. Record the composite facade,
      retained API graph, per-init bindings and separate cleanup jobs together. All facets are source-checked; selected operation tests do not establish a
      uniform initialization, restart or drain contract.
    contracts:
      exports:
        summary: >-
          Source-checked: index re-exports one mutable CommonJS facade with async init, a getter
          returning the existing API, config, stats, middleware, stripeConnect, contentGating
          and createPaidMemberShim. SSR, verification, integrity-token,
          importCSV/importInline/handleImportJob and export start null and are published during
          init. The API is a concrete object, despite callers sometimes awaiting its getter; it
          exposes repositories, account/BREAD services, Express routers, identity/magic-link
          methods, paymentsService and an EventEmitter. The ready event is emitted inside the
          factory before callers receive the bus. Export resolves a readable before its contents
          finish; importCSV distinguishes inline results from accepted deferred work. HTTP
          asserts selected session, signup and import/export behavior, not facade identity or
          complete pre-init compatibility.
        sources:
