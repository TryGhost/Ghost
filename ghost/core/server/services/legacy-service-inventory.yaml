          list, frontend or settings changes, and rollback errors can replace the
          original error. Validation units assert injected ZIP rejection, fatal-result
          predicates, cached result reuse and fallback after a throwing cache get;
          they do not test real fatal checkSafe cleanup or cache-set failure. Storage
          units assert copy-before-rename, no rename on failed copy and restore invocation
          before delete on promotion failure, using fake filesystem collaborators.
