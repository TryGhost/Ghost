          - test/unit/server/services/oembed/twitter-embed.test.js
          - test/unit/server/services/oembed/index.test.ts
          - test/unit/server/services/oembed/nft-oembed.test.ts
          - test/e2e-api/admin/oembed.test.js
    unverified: []
    blockers:
      - >-
        Custom providers bypass mention and bookmark dispatch, so WebmentionMetadata throws on
        their results while recommendation fallback reads null fields. Root units pin this as
        current behaviour; whether mention requests should skip custom providers is undecided.
      - >-
        NFT calls Got json() then reads result.body, although the installed client's shortcut
        returns the parsed body. Units pin its request and failure propagation, not a
