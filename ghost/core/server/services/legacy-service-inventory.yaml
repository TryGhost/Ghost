      startup:
        summary: >-
          Boot imports the root before dynamic routing, passes it to RouterManager even in
          backend-only mode, and awaits route-settings start/read before synchronous router
          registration. App maintenance checks hasFinished along with its other maintenance
          gates. Each individual registration sets readiness, rather than a separate completed
