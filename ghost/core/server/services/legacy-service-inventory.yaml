          API import captures the parsed positive integer fake wait multiplier, otherwise wait
          hours use real milliseconds. Init captures API URL and site UUID/API-URL fallback for
          scheduler jitter, but retrieves the current scheduler key for each future enqueue.
          Polls read current member status/preferences, action revision and settings; click
          tracking uses email_track_clicks, while opens use
          email_track_opens and recipient open tracking additionally requires a Mailgun ID.
          API stats checks current Tinybird config, wrapper instance/token and
          site ID; shared request agents and frozen URL helpers retain earlier configuration.
          Welcome-email caches/transports belong to that wrapper. Parser/timing units assert
          value validation and cadence; fake poll units assert tracking arguments. HTTP stats
          tests use test configuration overrides/provider responses, not production hot reload
          or full captured-versus-accessor replacement coverage.
