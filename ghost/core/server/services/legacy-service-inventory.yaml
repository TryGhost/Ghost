    migration:
      complexity: straightforward
      modelImpact: fits
      reason: >-
        Already retains one boot-created importer and rejects use before init. Move that
        composition behind the helper and adapt the request/job forwarding methods while
        keeping validation at the boundary. Jobs and media are deliberately looked up when
        work runs; per-import stores, staging and cleanup remain with the importer and do
        not require a new root lifecycle.
