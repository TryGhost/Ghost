          - test/e2e-api/admin/notifications.test.js
          - test/unit/server/services/notifications/notifications.test.js
      configuration:
        summary: >-
          The index reads no config snapshot. Each operation reads current cached notification
          data; add reads the current Ghost version and time for defaults, while browse applies
          version/seen filters and sorts by addedAt. Sanitization uses a fixed semantic-tag and
          URL-scheme allowlist on add, browse and email rendering. The email helper captures
          dependencies, resolves its URL callback once per nonempty send, then renders and
          sends separately for each recipient; update-check resolves recipient addresses.
        sources:
          - core/server/services/notifications/notifications.js
          - core/server/services/notifications/sanitize-notification-html.ts
          - core/server/services/notifications/notification-email.ts
          - core/server/services/update-check/update-check-service.js
          - core/server/lib/mail/index.js
