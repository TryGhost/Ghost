          - test/e2e-api/content/key-authentication.test.js
          - test/e2e-api/admin/posts-legacy.test.js
      startup:
        summary: >-
          initCore awaits init before settings initialization: settings enforce public-site
          privacy and derive social/analytics availability using loaded limits. The eager
          instance is callable before init and has no limits then. The root does not await a
          loadLimits return value; the current package method is synchronous. Boot-based
          authentication/newsletter/email tests exercise configured startup, but do not assert
          the ordering or pre-init contract explicitly. Public-site startup tests stub the
          limit method, so they do not prove real configuration reaches that consumer.
