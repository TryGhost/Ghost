          CommonJS exports an eager wrapper with async receiver-dependent init and a
          LinkTrackingServiceWrapper constructor property used by tests. service and
          linkClickRepository publish only after implementation init resolves. Deep modules
          export constructible tracking/repository/data classes. Service methods return links,
