      configuration:
        summary: >-
          Root captures the URL and resolved adapter at import; later adapter-manager cache
          clearing does not rebind it. Shared URL bases/config are frozen, so repeated facade
          calls and test replacement are not hot reload. Internal keys are read per event or
          rebuild through a retained promise cache, cleared by auth rotation. Jobs use current
          published_at, previous published_at for unscheduling, PUT and oldTime metadata;
          callback URL/time determine the namespaced hash. JWTs start ten minutes before
          publish and normally expire six hours after; sufficiently overdue jobs instead
          expire six hours from signing, so later rebuilds can change their URL/hash even
