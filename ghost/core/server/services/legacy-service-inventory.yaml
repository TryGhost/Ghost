        - core/server/services/themes/activation-bridge.js
        - core/server/services/themes/validate.js
        - core/boot.js
      dependencies:
        complexity: complex
        reason: >-
          The catalogue, lazy ThemeStorage instance and validation-cache adapter live in different
          modules. Activation reaches bridge and Custom Theme Settings, while validation loads gscan
          lazily and reads live labs/config. Shared upload-reporting is also imported by HTTP
          middleware. These are multiple composition and ownership boundaries, not just logger
          imports.
        preparation:
          - >-
            Create one explicit composition for catalogue, storage, validation and activation,
            injecting filesystem, configuration, logging and the Custom Theme Settings/bridge
            operations.
          - >-
            Keep gscan behind a root-owned lazy loader and preserve when storage paths versus live
            validation settings are read.
          - >-
            Separate the upload-limit reporter shared with HTTP middleware from the running theme
            graph; reconsider ThemeStorage's external adapter inheritance as a storage dependency
            boundary.
        reviewedAt: 44ad405bff4a8700af2ed51f833ebc08d25dddff
        sources:
