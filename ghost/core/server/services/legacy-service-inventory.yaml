          - test/integration/services/email-service/resume-interrupted-sends.test.js
          - test/integration/services/email-service/newsletter-email-event-storage.test.js
    unverified: []
    blockers:
      - >-
        Add wrapper identity/initialization assertions: missing dependencies, repeated init,
        captured versus current sibling references, partial publication and retry after each
        acquisition boundary. Existing wrapper units only assert URL-helper dispatch.
      - >-
        Preserve the tested boot email-init, jobs-readiness and pending-recovery barriers;
        characterize sibling publication timing and actual recovery failure/late-work behavior.
        The VM harness substitutes dependency implementations, and the real-boot HTTP witness
        controls recovery and subsequent external effects rather than exercising provider work.
      - >-
        Characterize locale-listener ownership, overlapping language changes and rejected
        changes; cleanup never removes the listener. Verify template compilation rejection
        retention and whether any supported lifecycle can recover from it.
      - >-
        Verify whole-server shutdown through final parent status persistence and late work.
        Batch cleanup snapshots sendEmail promises before emailJob's final write; current
        gated units cover nested work, not that final write or work admitted after the snapshot.
      - >-
        Test same-process restart through the retained wrapper: re-arming after stop, cleanup
        registration on the new server, repeated init on one server and restart while earlier
        work is pending. Captured consumers remain attached to the original graph. Accounting
        integration reconstructs a sender; existing wrapper units only assert URL-helper calls.
      - >-
        Preserve uncertainty at provider acceptance/database persistence and recovery boundaries;
        no tested cross-process ownership fence or exactly-once guarantee exists. Verify SDK
        deadline/socket settlement and DB failure behavior before changing shutdown ownership;
        the delivery wrapper currently provides no provider-request cancellation handle.
      - >-
        Characterize immutable-config replacement against captured helpers, concurrency/retry
        policy and queued/rendered snapshots. In particular, prepared recipients and cached
        bodies have different lifetimes from call-time provider/settings reads.
      - >-
        Retain analytics deep-export obligations: metric/provider-cache ownership, partial
        flush failure, concurrent pending-map changes and unawaited subscriber work. The
        delivery wrapper's cleanup does not own these separately composed objects.
      - >-
        Source-only recovery edge: stale and fresh queries use strict less-than/greater-than
        around one cutoff, so an exactly equal created_at matches neither query. This has
        not been reproduced and is not covered by the filter-string unit assertions.
  email-suppression-list:
    kind: directory
    disposition: migrate
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    migration:
      complexity: complex
      modelImpact: fits
      reason: >-
        Move eager provider composition and two domain-event subscriptions into one owned
        startup path. Members and analytics currently capture the eager instance before its
        init, so preserve dependency order and adapt those consumers. Repeated init
        duplicates handlers; introduce idempotent registration and partial-start cleanup
        while retaining suppression failure behavior. A single retained instance fits once
        those subscription responsibilities are explicit.
      reviewedAt: f276513ba32b7114fd5cc4f7b02d3f82c0c31e3e
      sources:
        - core/server/services/email-suppression-list/service.js
        - core/server/services/email-suppression-list/mailgun-email-suppression-list.js
        - core/server/services/members/api.js
        - core/server/services/email-analytics/index.ts
        - core/boot.js
      dependencies:
        complexity: straightforward
        reason: >-
          The provider already takes a Suppression model and Mailgun client, but init replaces the
          injected model from a global import and directly binds shared email events, DomainEvents
          and logging. These are bounded root-wiring changes. Members and Email Analytics currently
          capture the eager root, so they must receive its ready instance after migration;
          duplicated subscriptions are a separate lifecycle problem.
        preparation:
          - >-
            Acquire the ready Suppression model once in the root, remove init's global replacement,
            and inject logging and the email-event subscription/dispatch capability.
          - Update Members and Email Analytics to consume the ready provider after its boot barrier.
          - >-
            Keep the shared suppression event/data constructors independent; handle their
            non-allowlisted assertion helper explicitly rather than hiding it through the root.
        reviewedAt: 44ad405bff4a8700af2ed51f833ebc08d25dddff
        sources:
          - core/server/services/email-suppression-list/service.js
          - core/server/services/email-suppression-list/mailgun-email-suppression-list.js
          - core/server/services/email-suppression-list/email-suppression-list.js
          - core/server/services/members/api.js
          - core/server/services/email-analytics/index.ts
          - core/boot.js
    entryPoints:
      - email-suppression-list/index.js
    notes: >-
      Preserve eager provider composition, suppression fallback behavior and domain-event
      subscription behavior.
    contracts:
      exports:
        summary: >-
          CommonJS root and service.js expose one MailgunEmailSuppressionList object with init,
          getSuppressionData, getBulkSuppressionData and three removal methods. Methods use their
          receiver; Suppression and apiClient are mutable public fields. The deep helper exports
          EmailSuppressionData and EmailSuppressedEvent; members imports the latter directly.
          Reads return suppressed/info with spam or fail reasons, and bulk results preserve
          input order with an empty-array shortcut. Root tests pin one instance shared by
          index.js and service.js. Provider tests pin single reads and the bulk contract: one
          interpolated filter with quotes left unescaped, input order, duplicates, case-sensitive
          matching and whole-result fallback on query or mapping failure.
        sources:
