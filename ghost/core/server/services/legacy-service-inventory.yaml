        elements and email parser/fallback edge cases. Social-web coverage's localhost/IP-named
        test only supplies localhost; add IPv4/IPv6 and bracketed-host cases before changing
        that guard. These source risks have not been reproduced by this audit.
  stripe:
    kind: directory
    disposition: migrate
    dependencyChecks: deferred
    status: audited
    auditedAt: bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e
    migration:
      complexity: complex
      modelImpact: fits
      reason: >-
        The retained controller graph already owns configure, connect, disconnect and
        shutdown operations. Preserve per-boot configuration, tolerated configuration
        failures, ephemeral-webhook cleanup and deferred Members/Gifts/Staff access outside
        one-time construction. This requires careful ordering and failure-policy work, but
        reconfiguration of a stable owner does not itself require a kernel change.
      reviewedAt: f276513ba32b7114fd5cc4f7b02d3f82c0c31e3e
      sources:
        - core/server/services/stripe/service.js
        - core/server/services/stripe/stripe-service.js
        - core/boot.js
      dependencies:
        complexity: complex
        reason: >-
          Stripe builds API, webhook and billing collaborators before Members, Gifts, Staff and
          checkout configuration are ready, deliberately using getters for later operations. Nested
          code still imports those services, Welcome Emails, config/labs/i18n, event dispatch,
          Stripe SDK and rate-limit construction. Configuration replaces provider clients later, so
          eagerly moving every require to a one-time factory would change both availability and
          configuration timing.
        preparation:
          - >-
            Pass explicit deferred member/gift/staff/checkout/metafield capabilities from index.ts
            and remove nested service imports without turning operation-time getters into startup
            reads.
          - >-
            Inject SDK and rate-limit factories plus logging/config/translation/event dependencies,
            retaining configuration-time acquisition and live tax-policy behavior.
          - >-
            Separate one-time graph construction from configure/reconfigure.
        reviewedAt: 44ad405bff4a8700af2ed51f833ebc08d25dddff
        sources:
          - core/server/services/stripe/service.js
          - core/server/services/stripe/stripe-service.js
          - core/server/services/stripe/stripe-api.js
          - core/server/services/stripe/config.js
          - core/server/services/stripe/services/webhook/checkout-session-event-service.js
          - core/server/services/members/api.js
          - core/boot.js
    entryPoints:
      - stripe/index.js
    notes: >-
      Preserve the eager composite, stable API/controller references and deferred dependency
      getters. Configuration changes nested clients and remote registration; shutdown only
      removes an ephemeral webhook. These are separate lifetimes, not one disposable instance.
    contracts:
      exports:
        summary: >-
          CommonJS index forwards one StripeService instance with an added async init method. It
          exposes api, webhookController, webhookManager, billingPortalManager, migrations,
          models and async configure/connect/disconnect/shutdown methods. Configure, disconnect
          and shutdown require their receiver; connect does not, and added init closes over the
          module export. API configuration is synchronous; before configuration configured is
          false, mode reports live and testEnv dereferences absent config. Most operations have
          no shared readiness guard. Deep class units assert selected API arguments/results and
          controller status codes, not the real root shape, method binding, pre-init behavior or
          retained identity.
        sources:
          - core/server/services/stripe/index.js
          - core/server/services/stripe/service.js
          - core/server/services/stripe/stripe-service.js
          - core/server/services/stripe/stripe-api.js
          - core/server/services/stripe/webhook-controller.js
        tests:
          - test/unit/server/services/stripe/stripe-api.test.js
          - test/unit/server/services/stripe/webhook-controller.test.js
      construction:
        summary: >-
          Import eagerly constructs the service, API, migrations, webhook and billing managers,
          four event services and controller. Picked models and the API object are retained.
          Getter dependencies defer members repositories, donation repository, gifts service,
          staff emails until handler work; the welcome-email check reads the ready root per call.
          The API holds no checkout config: whatever opens each Checkout session passes the
          checkout the checkout-config's checkout service decided. The SDK
          client and two rate buckets are acquired by each successful non-null API configure. No
          guard coalesces repeated or overlapping root init/configure, and no rollback covers
          partially configured collaborators. No focused real-root
          construction/dependency-capture or WebhookManager lifecycle test was found; injected
          handler tests do not protect these getters against eager capture.
        sources:
          - core/server/services/stripe/service.js
          - core/server/services/stripe/stripe-service.js
          - core/server/services/stripe/stripe-api.js
          - core/server/services/stripe/webhook-manager.js
          - core/server/services/stripe/services/webhook/checkout-session-event-service.js
          - core/server/services/stripe/services/webhook/invoice-event-service.js
          - core/server/services/stripe/checkout-session-params.ts
        tests:
          - >-
            test/unit/server/services/stripe/services/webhooks/checkout-session-event-service.test.js
          - test/unit/server/services/stripe/services/webhooks/invoice-event-service.test.js
      consumers:
        summary: >-
          The members app retains a bound webhook-controller method when constructed before
          initServices. Members API/import dependencies retain stripe.api; members startup
          invokes migrations. Gifts resolves the API through a getter. Checkout previews read
          the current Stripe API configured flag through a callback, then create a session
          through members payments. Settings BREAD awaits connect before persisting changed
          settings; the settings endpoint awaits disconnect before clearing keys. These bindings
          are source-checked. Signed webhook HTTP tests exercise the real
          parser/controller/model graph and assert invalid-signature refusal, unknown-event
          success and selected subscription/member persistence with provider calls intercepted.
          Donation/gift checkout HTTP suites then use StripeMocker.sendWebhook, which directly
          invokes the real controller's handleEvent, bypassing HTTP signature parsing. They
          prove selected persistence/mail outcomes, not all retained bindings, replacement
          behavior or remote provider delivery.
        sources:
          - core/server/web/members/app.js
          - core/server/services/members/api.js
          - core/server/services/members/service.js
          - core/server/services/members/members-api/members-api.js
          - core/server/services/gifts/index.ts
          - core/server/services/settings/settings-bread-service.js
          - core/server/api/endpoints/settings.js
          - core/server/services/stripe/stripe-service.js
          - core/server/services/stripe-checkout-config/index.ts
          - core/server/services/stripe-checkout-config/preview-service.ts
        tests:
          - test/e2e-api/members/webhooks.test.js
          - test/e2e-api/members/donation-checkout-session.test.js
          - test/e2e-api/members/gift-subscriptions.test.js
          - test/utils/stripe-mocker.js
      startup:
        summary: >-
          Boot awaits init before gifts and the remaining Promise.all group, including members,
          donations and staff. A held-promise boot harness asserts gifts, mentions, analytics,
          media and job registration/start remain untouched until Stripe resolves, using fake
          collaborators; members/donations/staff ordering is source-established. Real init logs
          configuration failures and still registers the settings listener, so this barrier is
          not a guarantee of successful Stripe readiness. Configure replaces the API client
          first, configures the controller and managers, awaits webhook start, then awaits
          billing start outside test environments. Boot registers Stripe cleanup only after
          gifts initializes successfully. Normal booted webhook tests establish working
          composition, not failure at every acquisition stage or real remote registration.
        sources:
          - core/boot.js
          - core/server/services/stripe/service.js
          - core/server/services/stripe/stripe-service.js
          - core/server/services/stripe/webhook-manager.js
          - core/server/services/stripe/billing-portal-manager.js
        tests:
          - test/unit/boot/init-services.test.ts
          - test/e2e-api/members/webhooks.test.js
      lifetime:
        summary: >-
          Root, API and controller identities survive init/configure; successful API configure
          replaces nested SDK/buckets. Init removes and re-adds the same settings listener;
          relevant edits share a 600ms debounce whose asynchronous configuration can overlap
          earlier work. No keys makes configureApi return without disabling an existing client;
          disconnect explicitly disables it but retains prior API config/mode/buckets. Supplying
          a webhook secret switches the manager to local mode; a later absent secret does not
          restore network mode or clear it. Stop does not clear the in-memory secret. Pending
          throttled operations use whichever SDK exists after waiting. These are source-only
          contracts, without root reconfiguration, restart or concurrent-work assertions. Gift
          HTTP's sequential duplicate dispatch asserts one row for the existing gift ID, not
          concurrent webhook exclusion or once-only notification effects.
        sources:
          - core/server/services/stripe/service.js
          - core/server/services/stripe/stripe-service.js
          - core/server/services/stripe/stripe-api.js
          - core/server/services/stripe/webhook-manager.js
        tests:
          - test/e2e-api/members/gift-subscriptions.test.js
      configuration:
        summary: >-
          Configuration reads active settings keys and the immutable config facade when invoked,
          then captures key, URL, promo and environment values; shared URL helpers freeze their
          base URLs. Automatic-tax remains a labs getter and additional-payment-method checks
          happen per call. Whatever opens each checkout passes the saved design from the
          checkout-config's checkout service, and a preview passes the design being previewed.
          Checkout HTTP tests assert saved/cleared designs and malformed stored-design fallback
          with Stripe mocked, not real root replacement or
          provider acceptance. Nonproduction normally supplies a local placeholder secret;
          explicit remote-webhook mode omits it and marks registration ephemeral. Production
          registration remains persistent. Config units inject key/URL helpers and test-only
          config/environment changes, asserting exact webhook URL, secret/mode flags and
          normalized ignore lists; they do not establish production hot reload. API units
          replace the SDK and assert selected checkout/customer/metadata/tax fields and gift
          idempotency-key forwarding; translated gift titles use a stubbed translator. They do
          not prove real SDK client rotation, rate limiting or preservation of current/captured
          configuration boundaries.
        sources:
          - core/server/services/stripe/config.js
          - core/server/services/stripe/service.js
          - core/server/services/stripe/stripe-service.js
          - core/server/services/stripe/stripe-api.js
          - core/server/services/settings-helpers/settings-helpers.js
          - core/shared/config/loader.ts
          - core/shared/url-utils.ts
          - core/server/services/stripe-checkout-config/index.ts
          - core/server/services/stripe-checkout-config/checkout-service.ts
        tests:
          - test/unit/server/services/stripe/config.test.js
          - test/unit/server/services/stripe/stripe-api.test.js
          - test/e2e-api/members/create-stripe-checkout-session.test.js
      resources:
        summary: >-
          The composite borrows model connections, settings and domain events; it owns nested
          clients, rate queues, debounced configuration and remote webhook/billing registration
          work. Installed Stripe uses shared keep-alive agents, an 80-second socket-inactivity
          timeout and zero default network retries; the root supplies no transport timeout/retry
          override or drain. LeakyBucket retains callbacks and timers while queued; replacement
          does not cancel old buckets. Shutdown only awaits stop for ephemeral registrations: it
          leaves the settings listener/debounce, clients, pending HTTP/handlers and remote
          billing state. Production webhook registration is retained. Manager stop swallows
          deletion/persistence failures as false, which shutdown/disconnect ignore. Domain
          dispatch is unawaited and test allSettled is not a production drain. Paid signup mail
          is launched without awaiting its promise inside the checkout handler, so it can
          outlive the webhook response and reject outside its catch; handler units assert
          invocation only. Billing units assert fake API/settings registration paths, not actual
          sockets, timer cancellation or remote cleanup.
        sources:
          - core/server/services/stripe/service.js
          - core/server/services/stripe/stripe-service.js
          - core/server/services/stripe/stripe-api.js
          - core/server/services/stripe/webhook-manager.js
          - core/server/services/stripe/billing-portal-manager.js
          - core/server/services/stripe/services/webhook/checkout-session-event-service.js
          - core/server/ghost-server.ts
          - package.json
        tests:
          - test/unit/server/services/stripe/billing-portal-manager.test.js
          - >-
            test/unit/server/services/stripe/services/webhooks/checkout-session-event-service.test.js
      failures:
        summary: >-
          Callers pass each session's checkout; the checkout-config's checkout service logs a
          config read failure and gives none. Refusal of a checkout's design retries once without
          it; refusal of a preview's design becomes ValidationError
          and other provider errors propagate. SDK-fake units assert these branches, but do not
          check fallback preservation of request options or idempotency keys. Root init logs
          configuration errors; direct configure rejects after any earlier client, manager or
          remote effects. Webhook creation precedes saving its ID/secret, and failed persistence
          can leave remote state without publication. Billing update/replacement failures can
          retain the old ID; initial creation and settings-save errors propagate. Disconnect
          performs sequential database changes without one encompassing transaction, then
          attempts webhook removal and disables the API. Migrations catch their sequence's
          errors internally, so the members runner can record finished after a logged failure.
          Controller source awaits handlers before responding, logs version mismatch but still
          processes, and returns error status or 500; no root event-ID deduplication exists.
          Controller units inject a parser and synchronous handler failure; real signed HTTP
          covers selected success/refusal paths. Migration units use fake transactions and pin
          skipping/default-name behavior. Booted members-runner tests use real job rows but
          substitute execute, proving skip/retry, caught rejection and selected insert-failure
          behavior; they do not exercise a real Stripe migration sequence failure. Two
          duplicate-subscription units assert truthy err.name rather than equality and catch
          their own assert.fail, so they do not even guarantee the expected rejection or its
          ConflictError type.
          Historical evidence removed after auditedAt: [Stripe migration source](https://github.com/TryGhost/Ghost/blob/bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e/ghost/core/core/server/services/stripe/stripe-migrations.js), [Stripe migration tests](https://github.com/TryGhost/Ghost/blob/bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e/ghost/core/test/unit/server/services/stripe/migrations.test.js), [Members migration tests](https://github.com/TryGhost/Ghost/blob/bf6a3ea2e32b7b551980c02c745e3c9b74e3ea0e/ghost/core/test/e2e-server/services/members-migrations.test.ts).
        sources:
          - core/server/services/stripe/service.js
          - core/server/services/stripe/stripe-service.js
          - core/server/services/stripe/webhook-manager.js
          - core/server/services/stripe/billing-portal-manager.js
          - core/server/services/stripe/webhook-controller.js
          - core/server/services/members/service.js
          - core/server/services/stripe/services/webhook/subscription-event-service.js
          - core/server/services/stripe/stripe-api.js
        tests:
          - test/unit/server/services/stripe/webhook-controller.test.js
          - test/unit/server/services/stripe/billing-portal-manager.test.js
          - >-
            test/unit/server/services/stripe/services/webhooks/subscription-event-service.test.js
          - test/e2e-api/members/webhooks.test.js
          - test/unit/server/services/stripe/stripe-api.test.js
    unverified: []
    blockers:
      - >-
        Before changing initialization, pin real import/graph identity, receiver contracts,
        pre-init access, deferred dependency getters, retained members/webhook consumers and
        partial construction. Existing fake boot barriers protect awaited ordering, not real
        root publication or successful dependency readiness. Include the checkout-config
        preview callbacks into members payments; current checkout tests do not hold or replace
        those roots.
      - >-
        Characterize repeated/overlapping init and reconfiguration, no-key and local/network
        transitions, queued old-client work and retry after each partial failure. Decide changed
        semantics separately; preserving current behavior must not silently clear or replace
        objects that consumers retain.
      - >-
        Establish shutdown ownership with held debounce, throttle, provider and handler work;
        test ephemeral cleanup failure, same-process restart and persistent registration reuse.
        Remote registration/settings persistence and disconnect are not atomic, and current
        shutdown provides neither a complete drain nor client/listener disposal.
      - >-
        Add held-handler and actual persistence failure assertions before changing webhook or
        migration orchestration. Repair weak duplicate-error assertions; cover concurrent and
        out-of-order effects in the relevant owning services. Broader payment business behavior
        and unrelated existing gaps do not gate a composition-only eight-service pilot. Pin
        fallback request options and idempotency-key forwarding before changing checkout retry
        composition.
  themes:
    kind: directory
    disposition: migrate
    status: audited
