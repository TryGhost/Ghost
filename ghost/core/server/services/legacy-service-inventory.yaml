    blockers:
      - >-
        Protect the actual facade/import graph, pre-init exports, captured consumers and
        synchronous publication before changing init. Hold/fail dependencies and migrations to
        distinguish graph availability from init completion. Pin retained API/verification
        versus replaced SSR/import/export state, partial-init retry and concurrent init;
        existing migration-row tests do not cover these lifecycle contracts.
      - >-
        Decide ownership/disposal for payment/suppression/verification subscriptions and two
        mail transports. No root stop removes or drains them; API construction failure can leave
        subscriptions before publication. Preserve conditional verification subscription and
        error policy. Event dispatch and test-only allSettled do not make production subscriber
        work durable or awaitable by callers. The shared afterCommit helper gates on
        executionPromise fulfillment; the fake rejected-promise cases do not establish actual
        Knex manual-rollback behavior.
      - >-
        Preserve separate publication, token, member, gift, Stripe and mail boundaries. Token
        consumption precedes member/login work, account unsuppression performs two separate
        writes, and post-commit effects can fail after the caller completes. Real cleanup
        rollback evidence is specific to the cleanup task; fake API/import transactions do not
        establish whole-workflow rollback or concurrent token locking.
      - >-
        Characterize queued import restart/redelivery, partial spool writes/removal failure,
        repeated handler invocation and shutdown while mail/rows are pending. A JSON spool and
        serializable job do not by themselves establish durable delivery. Revue import uses
        independent row transactions and retains its converted CSV; no outer import transaction
        or members cleanup owns that file in the inspected path. Characterize the directly
        mounted JWKS rejection path separately from the forwardError-wrapped member routers
        before changing HTTP composition.
      - >-
        Protect stream acquisition/failure/abort with the real exporter and database before
        changing resource ownership; current CSV content and fake Writable tests do not
        demonstrate pool release under disconnect. Pin cleanup scheduling retry/concurrency and
        restart flags; successful scheduling flags survive independently of the jobs backend,
        and members exposes no cancellation/reset for them.
      - >-
        Preserve Stripe environment checks and mixed config capture: immutable config/URL
        values, captured mail/issuer/secrets/dialect and request-time settings access are
        different contracts. Direct token-provider constructors in settings/newsletters/ welcome
        emails remain separate owners. Keep these members obligations scoped to its migration;
        unrelated member business changes are not pilot prerequisites.
