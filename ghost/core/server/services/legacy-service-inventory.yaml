          - test/e2e-server/click-tracking.isolated.test.js
          - test/unit/server/services/email-service/email-event-processor.test.js
      startup:
        summary: >-
          Foreground boot calls synchronous init in the service Promise.all argument list after
          members.init is invoked, before newsletter analytics setup and HTTP readiness. Subscribing
          does not read members.api or validate database readiness; the getter is used on later
          page/click/comment work. Email updates use the borrowed database directly. Before init,
          public collaborators are absent and no handlers exist. Booted tests prove usable completed
