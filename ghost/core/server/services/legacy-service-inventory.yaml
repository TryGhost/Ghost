      lifetime:
        summary: >-
          Successful init keeps its original callbacks, scheduler, key owner and timer; there is
          no reset, stop or restart hook. The separate repository persists for module lifetime;
          persisted runs, revisions and claim markers survive process replacement. New steps use 30-minute claims,
          lock-token-checked updates and transactional completion/next-step insertion; next
          actions use the current graph/revision, not a whole-run snapshot. Enrollment locks the
          member and avoids a second run for the same automation/member. Real DB integration
          holds locks to test same-member duplicate prevention and different-member concurrency;
          selected-tier fetch tests are sequential. SQLite repository tests assert stale/fresh
          claim handling and refusal of an obsolete lock owner, not multi-process execution.
          Same-process restart, legacy concurrent claiming, crash recovery, long sends exceeding
