          - test/e2e-api/admin/newsletters.test.js
          - test/e2e-api/admin/posts-legacy.test.js
          - test/unit/server/services/settings/settings-service.test.js
      lifetime:
        summary: >-
          Module caching retains the exported instance and callers' references across init.
          Each load replaces its limits map and creates new limit objects, rather than
          updating old ones; an already-started check can finish against its former object.
          There is no automatic host-config subscription, reset/stop, query cancellation or
          cross-request reservation. Core host-limit helpers explicitly call init after
          changing/restoring config, and tests assert removal of a prior limit. Retained
          references, concurrent checks/reloads and restart identity are source-only findings.
        sources:
          - core/server/services/limits.ts
          - core/server/services/newsletters/index.ts
          - core/server/services/settings-helpers/index.js
          - core/server/services/email-service/email-service-wrapper.js
          - core/server/services/themes/installer.js
        tests:
          - test/e2e-api/admin/host-limits.test.ts
      configuration:
        summary: >-
          init uses hostSettings:limits or {}, a billing URL only when enabled is boolean true,
          otherwise https://ghost.org/help/, and a truthy subscription object supplies start
          with interval fixed to month. Package loading recognizes configured names and chooses
          allowlist, max, maxPeriodic, then flag by property presence. Unknown names are ignored;
          noncanonical names can load without their supplied settings. Flags use truthiness,
          so string false disables too. Scalar policy is captured on load, allowlist arrays
          are retained, and counts/current monthly period are evaluated per check. API config
          separately exposes host configuration, not proof a limit loaded. Tests pin several
          quirks and billing-enabled output, not every default or configuration boundary.
