          Models gate publishing, staff invites/reactivation/promotion and integration creation;
          imports become Contributors whenever staff is configured. API-key authentication
          exempts internal/core integrations, whereas limited webhooks retain only internal
          integrations. Retained dependencies in newsletters, email, settings and settings
          helpers govern active newsletters, send/retry checks, Stripe connection, private-site
          settings and social/analytics availability. Theme endpoints/installer and file/media
          validators enforce values/sizes. Custom fields' namespace policy asks isDisabled on
          every member metafield read and errorIfWouldGoOverLimit on every change to a field.
          HTTP assertions cover integration creation/authentication, newsletter add/reactivation,
          member-limit publishing, staff invitations, theme/file limits and member-field guards.
          Privacy, social/analytics, importer demotion and several user-model paths remain source-only.
        sources:
