    unverified: []
    blockers:
      - >-
        Characterize partial root initialization and retry, including metric registration
        before publication and a later wrapper constructor failing after newsletters is set.
        Current identity tests replace all wrapper constructors with successful fakes.
      - >-
        Define shutdown/restart for retained wrappers and the separately composed scheduler.
        Successful schedule flags outlive backend timer clearing; registration after backend
        stop may resolve without a timer. Guards do not re-read config for existing schedules.
      - >-
        Test overlapping first startFetch calls while restoration is pending and failure on
        that first restore. Restoration is marked attempted before the await and is not retried;
        ordinary direct fetch methods bypass the wrapper guard and share newsletter buffers.
      - >-
        Cover HTTP backfill/cancel completion, detached metadata writes and DB failure status.
        Timestamp/metadata persistence can fail while calls resolve; status-write or processor
        construction failure can leave a fetch status running. Existing cancel assertions check
        calls/state, not durable cancellation before return or shutdown.
      - >-
        Verify actual analytics continuation and provider/DB work across job shutdown deadlines,
        plus downstream DomainEvents and pending newsletter updates. Injected waiting tests and
        successful booted job persistence do not prove a full drain or atomic replay behavior.
      - >-
        Preserve provider paging/cursor behavior and captured-versus-current configuration
        boundaries. Changing credentials/domain while retaining cursors or site tags has no
        migration coverage; batch failures can retain pending writes and emit events before
        final storage/aggregation without rollback of earlier effects.
