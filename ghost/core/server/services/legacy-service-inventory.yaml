          token/signing providers, member/product/event repositories,
          BREAD/account/payments/geolocation/MagicLink services and controllers/routers.
          Payments construction subscribes to four offer/tier events; the API subscribes to
          email suppression. VerificationTrigger is constructed once and conditionally
          subscribes to MemberCreatedEvent. Each init builds SSR, integrity and import/export
