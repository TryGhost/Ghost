          - core/server/services/themes/installer.js
        tests:
          - test/e2e-api/admin/host-limits.test.ts
      construction:
        summary: >-
          Import constructs one empty LimitService from the workspace package. Every init
          reloads that same object with current host limits, subscription, help link, the
          shared db module and Ghost errors. There is no initialized guard, promise or
          configurable factory. Loading synchronously constructs per-limit implementations;
          neither construction nor loading queries the database. Core init tests stub
          loadLimits and test error handling, without asserting its full argument object.
        sources:
          - core/server/services/limits.ts
          - core/server/data/db/index.js
        tests:
          - test/unit/server/services/limits.test.js
      consumers:
