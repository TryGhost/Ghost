      configuration:
        summary: >-
          Each init copies host overrides and forces transistor false only when configured custom
          integrations are strictly disabled. Cached overrides apply on read and mark rows read-only;
          changing test config alone does not refresh them. Calculated functions bind helpers that
          read current cache/config, while shared URL utilities retain frozen base URLs. BREAD
          consults current labs/limits/email-address service; its mailer retains construction-time
          transport. Verification omits from; GhostMailer delegates default sender selection to
