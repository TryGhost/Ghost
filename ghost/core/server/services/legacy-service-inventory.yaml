      modelImpact: fits
      reason: >-
        Models retain the eager policy instance and boot loads it before settings, so
        construction and consumer ordering need coordinated changes. Keep policy reload as
        an explicit operation on that retained instance and preserve tolerated
        invalid-configuration behavior. These are boundary and error-policy decisions;
        mutable policy does not require replacing the service or changing the helper.
      reviewedAt: f276513ba32b7114fd5cc4f7b02d3f82c0c31e3e
      sources:
        - core/server/services/limits.ts
        - core/server/models/integration.js
        - core/boot.js
        - test/utils/host-limits-utils.ts
        - test/unit/server/services/limits.test.js
      dependencies:
        complexity: straightforward
        reason: >-
          This file is already the composition point for LimitService, config, database and logging.
          A root index.ts can keep that wiring together; the main dependency constraint is making
          model and route consumers obtain the initialized instance after limits boot, rather than
          evaluating its guarded getter during import.
        preparation:
          - >-
            Move the composition into a service root and update eager model/API bindings to use the
            ready policy instance at operation time, retaining boot-before-settings order and live
            policy reload.
        reviewedAt: 44ad405bff4a8700af2ed51f833ebc08d25dddff
        sources:
