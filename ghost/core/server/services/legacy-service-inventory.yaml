          - test/unit/server/services/members-events/last-seen-at-cache.test.js
          - test/integration/services/last-seen-at-updater.test.js
      resources:
        summary: >-
          The graph owns a Set of member IDs and three or four DomainEvents handlers with no
          unsubscribe, timer, transport, pending-work registry or shutdown drain. Page/click work
          preemptively caches the ID, locks/rereads the row in a shared-database transaction, refreshes
          relations and saves, then emits member.edited before the transaction completes. Concurrent
          cached calls skip without awaiting the first write. Email opens use conditional raw SQL;
          comments read then update both fields if either is stale, without a shared transaction or
          monotonicity guard. Unit race tests program fake reads/transactions; real integration
          pins one update invocation under a shared cache, not independent-connection locking or
          rollback. DomainEvents allSettled is test tracking, not production drain.
