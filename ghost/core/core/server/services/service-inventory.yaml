          - core/server/services/explore-ping/explore-ping-service.ts
          - core/server/services/members/service.js
          - core/server/services/stats/service.js
        tests: []
      startup:
        summary: >-
          Foreground boot calls init after database/settings setup, before app mounting and
          readiness. Only production/development proceed. Member stats already exists at import;
