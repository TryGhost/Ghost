          - test/unit/server/services/stripe/services/webhooks/checkout-session-event-service.test.js
          - test/unit/server/services/members/members-api/repositories/event-repository.test.js
      startup:
        summary: >-
          Boot constructs/configures Stripe before calling donations init in its main Promise.all
          group; the getter defers repository access until after publication. Synchronous init
          finishes before app readiness, even when frontend is disabled. The root has no readiness
          guard for consumers beyond an absent repository. Completed-boot HTTP tests exercise real
          Stripe-to-repository wiring, not early webhook delivery, retained lookup after replacing
          repository, backend-only initialization or a focused dependency-order contract.
        sources:
          - core/boot.js
          - core/server/services/donations/donation-service-wrapper.js
          - core/server/services/stripe/service.js
          - core/server/services/stripe/stripe-service.js
          - core/server/services/stripe/services/webhook/checkout-session-event-service.js
        tests:
          - test/e2e-api/members/donation-checkout-session.test.js
      lifetime:
        summary: >-
          The wrapper/repository retain identity through repeated init and have no reset/cache.
          Stripe's getter would observe replacement of the public repository, while the repository
          keeps its original model object. Saves issue independent model adds with no serialization,
          transaction argument, idempotency key or compensation. Donation rows have a generated
          primary key but no checkout/event identifier or unique donation constraint; the webhook
          controller does not deduplicate incoming event IDs. Existing HTTP tests exercise single
          deliveries and cannot establish duplicate or concurrent delivery behavior.
        sources:
          - core/server/services/donations/donation-service-wrapper.js
          - core/server/services/donations/donation-bookshelf-repository.ts
          - core/server/services/stripe/stripe-service.js
          - core/server/services/stripe/webhook-controller.js
          - core/server/data/schema/schema.js
        tests:
          - test/e2e-api/members/donation-checkout-session.test.js
      configuration:
        summary: >-
          The root/repository reads no config or settings. Save maps donation, member, attribution,
          referrer and all five UTM fields to model columns; it ignores event.timestamp and leaves
          created_at/ID generation to the model. Checkout policy and supported donation metadata
          belong to members/Stripe callers; staff formatting and notification preferences belong
          to staff. Schema validation applies at persistence, not event construction. HTTP tests
          pin real stored fields and reserved gift metadata separation. Handler units pin completed
          payment-mode donation routing for true/string-true metadata, ignoring sessions with conflicting
          donation/gift markers and async-payment-success events; donation routing does not check payment_status.
          Handler fakes can accept
          empty email or attribution types that the real model would reject. No timestamp mapping
          or complete invalid-input repository test exists.
        sources:
          - core/server/services/donations/donation-bookshelf-repository.ts
          - core/server/services/donations/donation-payment-event.ts
          - core/server/models/donation-payment-event.js
          - core/server/models/base/index.js
          - core/server/models/base/bookshelf.js
          - core/server/data/schema/schema.js
          - core/server/data/schema/validator.ts
          - core/server/models/base/plugins/events.js
          - core/server/services/members/members-api/services/payments-service.js
          - core/server/services/stripe/services/webhook/checkout-session-event-service.js
          - core/server/services/staff/staff-service-emails.js
        tests:
          - test/e2e-api/members/donation-checkout-session.test.js
          - test/unit/server/services/stripe/services/webhooks/checkout-session-event-service.test.js
      resources:
        summary: >-
          Owns only wrapper/repository/data references; no timer, subscription, transport or pool
          is created here. Shared models own database work, Stripe owns webhook handling and staff
          owns mail delivery. Save does not expose a transaction or pending-operation registry, and
          no root shutdown/drain exists. Staff notification runs after the durable add; no event-bus
          delivery is required for it. Real HTTP tests inspect persisted rows and mocked mail, not
          pending-write shutdown, provider completion or atomicity between storage and notification.
        sources:
          - core/server/services/donations/donation-service-wrapper.js
          - core/server/services/donations/donation-bookshelf-repository.ts
          - core/server/services/stripe/services/webhook/checkout-session-event-service.js
          - core/server/services/staff/staff-service-emails.js
          - core/server/ghost-server.ts
        tests:
          - test/e2e-api/members/donation-checkout-session.test.js
      failures:
        summary: >-
          Repository model rejection propagates unchanged and stops subsequent staff notification.
          Failure during notification cannot undo the inserted row. Staff awaits each sendMail
          before pushing its result into allSettled, so send rejection can escape immediately,
          like user/template/formatting failures; that collector does not catch it. Webhook controller
          logs handler errors and responds
          with their status or 500, permitting another delivery without local deduplication. Model
          edit/destroy methods reject, but persistence has no workflow rollback. Existing positive
          HTTP tests and handler units do not establish these real failure/retry boundaries.
        sources:
          - core/server/services/donations/donation-bookshelf-repository.ts
          - core/server/models/donation-payment-event.js
          - core/server/services/stripe/services/webhook/checkout-session-event-service.js
          - core/server/services/stripe/webhook-controller.js
          - core/server/services/staff/staff-service-emails.js
        tests:
          - test/e2e-api/members/donation-checkout-session.test.js
          - test/unit/server/services/stripe/services/webhooks/checkout-session-event-service.test.js
    unverified: []
    blockers:
      - >-
        Pin root identity, synchronous guarded init, model capture and Stripe's getter across
        early composition, repeated boot and repository replacement. Capturing repository while
        composing Stripe would observe undefined before current boot initializes donations.
      - >-
        Add direct real-repository contracts for complete mapping, timestamp/created_at behavior,
        return/error identity and schema-invalid input. Handler fakes permit empty email and an
        attribution type outside the real schema, so their success is not persistence evidence.
      - >-
        Characterize duplicate/concurrent webhook delivery, database rejection and failure after
        persistence but before notification completes. Decide whether idempotency/atomicity should
        change separately; the current path has no checkout/event key or shared transaction.
      - >-
        Cover saved-event browsing/export and staff failure channels through real consumers,
        including retained references and pending shutdown. Existing single-delivery HTTP tests
        prove selected rows and mail subject/to values, not durable exactly-once delivery or drain.
