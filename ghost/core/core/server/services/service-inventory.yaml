  auth:
    kind: directory
    disposition: review
    status: auditing
    entryPoints:
      - auth/index.js
      - auth/session/index.js
      - auth/session/express-session.js
      - auth/members/index.js
    notes: >-
      Review an interim auth subsystem outside services. Keep authentication policy outside
      the HTTP layer and identify each nested instance owner.
    contracts:
      exports:
        summary: >-
          The CommonJS root exposes lazy getters for authorize, authenticate, session, setup,
          passwordreset and resetAuthentication. These include middleware and workflow
          functions, rather than one initialized service instance.
        sources:
          - core/server/services/auth/index.js
          - core/server/services/auth/authenticate.js
          - core/server/services/auth/authorize.js
          - core/server/services/auth/setup.js
