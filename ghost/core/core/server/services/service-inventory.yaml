  donations:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: c2999f4e13da6360bceced808bb52c4a04b5ad03
    entryPoints:
      - donations/index.js
    notes: >-
      Preserve the guarded repository and Stripe's late-bound lookup. Donation persistence
      precedes staff notification without a shared transaction or webhook deduplication key.
    contracts:
      exports:
        summary: >-
          CommonJS index exports one eager wrapper with synchronous receiver-dependent init and
          an initially undefined public repository. Init returns undefined. Deep modules export
          the wrapper constructor, DonationBookshelfRepository and DonationPaymentEvent classes.
          Repository save is async, requires its receiver, and resolves without returning the
          model. The data object is mutable; create uses a supplied timestamp or the current time.
          Consumer tests construct events indirectly, with no direct root/repository shape test.
        sources:
          - core/server/services/donations/index.js
          - core/server/services/donations/donation-service-wrapper.js
          - core/server/services/donations/donation-bookshelf-repository.ts
          - core/server/services/donations/donation-payment-event.ts
        tests:
