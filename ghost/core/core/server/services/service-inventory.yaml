        sources:
          - core/server/services/app-installations/index.ts
          - core/server/data/schema/in-development.ts
        tests:
          - test/e2e-api/admin/app-installations.test.ts
    unverified:
      - consumers
      - startup
      - lifetime
      - resources
      - failures
    blockers: []
  audience-feedback:
    kind: directory
    disposition: retain
    status: auditing
    entryPoints:
