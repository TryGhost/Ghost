# Temporary migration inventory. See README.md before updating.
# Entry points are relative to this directory; evidence paths are relative to ghost/core.
# An unverified facet is an open audit question, not an empty/no-op contract.
version: 1
services:
  activitypub:
    kind: directory
    disposition: retain
    status: auditing
    entryPoints:
      - activitypub/index.js
    notes: >-
      Preserve background startup and settings-driven enable/disable behavior; audit listener
      disposal and in-flight configuration.
    contracts:
      exports:
        summary: >-
          CommonJS exports the wrapper class itself, with static init(), instance and
          initialised fields.
        sources:
          - core/server/services/activitypub/index.js
          - core/server/services/activitypub/activity-pub-service-wrapper.js
        tests: []
      construction:
        summary: >-
          The first init with an available identity-token instance constructs
          ActivityPubService, captures the site URL and subscribes three settings listeners. A
          retained instance makes later init calls return immediately.
        sources:
          - core/server/services/activitypub/activity-pub-service-wrapper.js
          - core/server/services/activitypub/activity-pub-service.ts
        tests: []
      startup:
        summary: >-
          Background boot awaits wrapper init after earlier recovery and scheduling work. The
          wrapper logs and returns if identity tokens are absent, and starts
          configureActivityPub without awaiting enable/disable completion.
        sources:
          - core/boot.js
          - core/server/services/activitypub/activity-pub-service-wrapper.js
        tests: []
    unverified:
      - consumers
      - lifetime
      - configuration
      - resources
      - failures
    blockers:
      - >-
        Characterize settings-task failures and concurrent edits; init completion does not
        establish completed remote configuration.
      - The wrapper registers settings listeners without a shutdown or unsubscribe path.
  adapter-manager:
    kind: directory
    disposition: retain
    status: auditing
    entryPoints:
      - adapter-manager/index.ts
    notes: >-
      Preserve boot validation, lazy adapter construction and cached instance identity; decide
      disposal ownership for adapters.
    contracts:
      exports:
        summary: >-
          The TypeScript default export is an eager AdapterManager instance; CommonJS callers
          read .default. Its public methods are init(), getAdapter() and clearCache().
        sources:
          - core/server/services/adapter-manager/index.ts
          - core/server/services/adapter-manager/adapter-manager.ts
          - core/boot.js
        tests: []
      construction:
        summary: >-
          The root constructs one manager with config, require, adapter paths and registered
          base classes. getAdapter constructs adapters lazily and caches them by requested
          name and selected class name.
        sources:
          - core/server/services/adapter-manager/index.ts
          - core/server/services/adapter-manager/adapter-manager.ts
        tests: []
      startup:
        summary: >-
          initCore calls init synchronously to load configured adapter classes and run
          optional static validation. It skips unconfigured types, deduplicates class/config
          pairs and aggregates failures; actual instances are constructed on getAdapter.
        sources:
          - core/boot.js
          - core/server/services/adapter-manager/adapter-manager.ts
        tests:
          - test/unit/server/services/adapter-manager/adapter-manager.test.ts
      configuration:
        summary: >-
          getAdapter resolves selection and options from config on every call, but returns the
          cached instance for the same requested name and class. Changed options alone do not
          reconstruct it; clearCache drops cached references.
        sources:
          - core/server/services/adapter-manager/adapter-manager.ts
        tests: []
    unverified:
      - consumers
      - lifetime
      - resources
      - failures
    blockers:
      - Add same-manager configuration-change and retained-consumer tests.
      - >-
        clearCache does not dispose adapters; audit resource ownership and callers retaining
        old instances.
  announcement-bar-service:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: 7d311731a562faf8184ef92b93455ac590761c1d
    entryPoints:
      - announcement-bar-service/index.js
    notes: >-
      Uses shared construction and access without lifecycle hooks. Preserve live settings,
      request-local visibility and the validator's separate class import.
    contracts:
      exports:
        summary: >-
          CommonJS exports init() and service, with no shutdown hook. init returns a promise;
          getAnnouncementSettings(member) remains synchronous and returns undefined or a fresh
          announcement/background object. Controller and root tests cover retained methods and
          live calls with the private-field receiver. The separate implementation class still
          exports VisibilityValues; class tests check their values, not static-property mutation.
        sources:
          - core/server/services/announcement-bar-service/index.js
          - core/server/services/announcement-bar-service/announcement-bar-settings.js
          - core/server/services/announcement-bar-service/announcement-visibility-values.js
          - core/server/lib/service-lifecycle/index.ts
        tests:
          - test/unit/server/services/announcement-bar/announcement-bar-settings.test.js
          - test/unit/server/services/announcement-bar/index.test.ts
          - test/unit/api/endpoints/announcements.test.ts
      construction:
        summary: >-
          Source defines the root without constructing its implementation and places boot's
          init call after core/settings initialization. It constructs AnnouncementBarSettings
          with a callback into the shared settings cache. Root tests show init does not read
          settings; helper tests cover deferred construction and repeated init retaining one
          instance. The validator imports the separate class without constructing it (source-only).
        sources:
          - core/boot.js
          - core/server/services/announcement-bar-service/index.js
          - core/server/lib/service-lifecycle/index.ts
          - core/server/api/endpoints/utils/validators/input/settings.js
        tests:
          - test/unit/server/services/announcement-bar/index.test.ts
          - test/unit/server/lib/service-lifecycle.test.ts
      consumers:
        summary: >-
          The announcements endpoint retains service and forwards frame.options.context.member.
          HTTP tests alternate anonymous, free, paid and comped sessions through the real
          member-session route and assert private/no-store responses. Source inspection finds
          no other runtime instance consumer: settings validation uses class constants, while
          ghost_head reads settings directly and injects the frontend HTTP client.
        sources:
          - core/server/api/endpoints/announcements.js
          - core/server/web/members/app.js
          - core/server/web/announcement/routes.js
          - core/server/api/endpoints/utils/validators/input/settings.js
          - core/frontend/helpers/ghost_head.js
        tests:
          - test/e2e-api/members/announcement.test.js
          - test/e2e-api/admin/settings.test.js
      startup:
        summary: >-
          Boot awaits initialization before readiness. A real-boot test holds init pending,
          checks the next routing stage has not run, observes HTTP 503 and no readiness
          notification, then releases it and gets an announcement over HTTP. Helper tests
          allow retaining service before init but reject member access before it is ready.
        sources:
          - core/boot.js
          - core/server/lib/service-lifecycle/index.ts
          - core/server/lib/service-lifecycle/boot.ts
        tests:
          - test/e2e-server/announcement-lifecycle.isolated.test.ts
          - test/unit/server/lib/service-lifecycle.test.ts
          - test/unit/server/lib/service-lifecycle-boot.test.ts
      lifetime:
        summary: >-
          The facade and implementation persist for the module lifetime; repeated init does
          not replace them. Helper tests assert once-only construction. Root/controller tests
          cover retained methods, synchronous live reads and fresh result objects. A real-server
          stop followed by a no-server reboot keeps the retained controller and method reading
          changed settings over HTTP and direct calls. The no-server result remains a callable
          Express app without an added stop method.
        sources:
          - core/boot.js
          - core/server/lib/service-lifecycle/index.ts
          - core/server/services/announcement-bar-service/announcement-bar-settings.js
        tests:
          - test/unit/server/lib/service-lifecycle.test.ts
          - test/unit/server/services/announcement-bar/index.test.ts
          - test/unit/api/endpoints/announcements.test.ts
          - test/e2e-server/announcement-lifecycle.isolated.test.ts
      configuration:
        summary: >-
          Every call reads content, background and visibility from settings. Falsy content or
          empty visibility suppresses output. Visitors have no member; free visibility matches
          status free; paid visibility accepts any truthy member whose status is not free,
          including comped. Class tests cover representative visible/suppressed combinations;
          controller and HTTP tests cover live changes through the real root and unchanged raw output.
        sources:
          - core/server/services/announcement-bar-service/index.js
          - core/server/services/announcement-bar-service/announcement-bar-settings.js
          - core/server/services/announcement-bar-service/announcement-visibility-values.js
        tests:
          - test/unit/server/services/announcement-bar/announcement-bar-settings.test.js
          - test/unit/api/endpoints/announcements.test.ts
          - test/e2e-api/members/announcement.test.js
      resources:
        summary: >-
          Source inspection shows the implementation borrows the cache and owns only its callback;
          it starts no timers, subscriptions, database or network work. Root tests assert there
          is no shutdown export. The boot initializer's unit tests assert it registers no cleanup
          for a root without shutdown. Stopping Ghost does not retire announcement-bar.
        sources:
          - core/server/services/announcement-bar-service/index.js
          - core/server/services/announcement-bar-service/announcement-bar-settings.js
          - core/server/lib/service-lifecycle/boot.ts
        tests:
          - test/unit/server/services/announcement-bar/index.test.ts
          - test/unit/server/lib/service-lifecycle-boot.test.ts
          - test/e2e-server/announcement-lifecycle.isolated.test.ts
      failures:
        summary: >-
          Controller tests preserve synchronous settings-read errors. Shared-helper tests cover
          initialization failure and explicit retry. Announcement-bar acquires no resources to
          roll back. Corrupt cache values and member-session lookup failures retain their existing
          source behavior; those paths are not characterized here.
        sources:
          - core/server/lib/service-lifecycle/index.ts
          - core/server/services/announcement-bar-service/announcement-bar-settings.js
          - core/server/services/members/middleware.js
        tests:
          - test/unit/api/endpoints/announcements.test.ts
          - test/unit/server/lib/service-lifecycle.test.ts
    unverified: []
    blockers:
      - >-
        Malformed cache values, unbound implementation calls and mutation of the shared
        visibility constants remain source-only. The implementation and validator class
        import are unchanged by the initialization adoption.
  app-installations:
