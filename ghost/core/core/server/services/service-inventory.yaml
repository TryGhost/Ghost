  indexnow-ping:
    kind: directory
    disposition: retain
    status: audited
    auditedAt: c2999f4e13da6360bceced808bb52c4a04b5ad03
    entryPoints:
      - indexnow-ping/index.ts
    notes: >-
      Preserve post-event gating, live settings and request error reporting. Root lifecycle,
      verification-route compatibility and production retry behavior still need contracts.
    contracts:
      exports:
        summary: >-
          The TypeScript default export is one wrapper exposing synchronous init and a public
          writable service field, initially undefined. CommonJS boot uses .default; init
          returns no instance. The implementation exports IndexNowPingService for direct
          construction and exposes its dependencies, bound listener and operation methods.
        sources:
          - core/server/services/indexnow-ping/index.ts
          - core/server/services/indexnow-ping/indexnow-ping-service.ts
          - core/boot.js
        tests: []
      construction:
        summary: >-
          Import constructs only the wrapper. First init loads shared settings/config, URL
          services, request, logging and model events, constructs the implementation, assigns
          service, then subscribes. Later init calls skip construction and subscription.
          The wrapper is the only runtime construction path found; class tests inject fakes
          except for the real request helper.
        sources:
          - core/server/services/indexnow-ping/index.ts
          - core/server/services/indexnow-ping/indexnow-ping-service.ts
        tests: []
      consumers:
        summary: >-
          Boot is the only runtime root importer. Post model events invoke the listener for
          post.published and post.published.edited, after commit when a transaction is supplied.
          Import events and events without changed SEO fields return early; others pass post
          JSON plus authors and tags to a detached ping. No runtime deep constructor or direct
          ping caller was found. The frontend key-verification middleware independently reads
          the same setting; it does not import this service.
        sources:
          - core/boot.js
          - core/server/models/post.js
          - core/server/models/base/plugins/events.js
          - core/server/services/indexnow-ping/indexnow-ping-service.ts
          - core/server/services/indexnow-ping/constants.ts
          - core/server/services/content-import/import/importer.ts
          - core/frontend/web/middleware/serve-indexnow-key.js
        tests:
          - test/unit/server/services/indexnow-ping/indexnow-ping-service.test.js
      startup:
        summary: >-
          Boot initializes settings and dynamic routing before calling init in its required
          service Promise.all, before readiness, including backend-only boot. Subscription
          completes synchronously without checking key availability or sending a request;
          disabled/private/development configurations still subscribe. The settings model
          generates the key as a default, and frontend middleware serves its matching path.
          Synchronous init failure rejects required startup.
        sources:
          - core/boot.js
          - core/server/services/indexnow-ping/index.ts
          - core/server/services/indexnow-ping/indexnow-ping-service.ts
          - core/server/models/settings.js
          - core/frontend/web/site.js
          - core/frontend/web/middleware/serve-indexnow-key.js
        tests: []
      lifetime:
        summary: >-
          The wrapper retains one implementation and its bound listener. Direct subscribeEvents
          removes that same callback before registering it for each event, but cannot remove
          another instance's callback. Repeated wrapper init does not restore externally
          removed listeners. Neither wrapper nor implementation exposes reset, unsubscribe or
          shutdown. EventEmitter delivery is synchronous; ping completion is detached, with no
          serialization, deduplication of pending work or retained completion handle.
        sources:
          - core/server/services/indexnow-ping/index.ts
          - core/server/services/indexnow-ping/indexnow-ping-service.ts
          - core/server/lib/common/events.js
          - core/boot.js
          - core/server/ghost-server.ts
        tests: []
      configuration:
        summary: >-
          Each ping reads live environment, site privacy, privacy.useIndexNow, key and URL
          providers. Development, pages, private sites, disabled privacy and listed default
          slugs skip delivery. SEO fields and the IndexNow endpoint are module constants.
          Requests carry url, key and keyLocation with a five-second request timeout. Key
          lookup accepts any truthy value, while the verification middleware requires an exact
          matching 32-character lowercase hex path. Class tests cover representative gates
          and the url query, but not live changes, keyLocation or the verification route.
        sources:
          - core/server/services/indexnow-ping/indexnow-ping-service.ts
          - core/server/services/indexnow-ping/constants.ts
          - core/frontend/web/middleware/serve-indexnow-key.js
          - core/server/models/settings.js
        tests:
          - test/unit/server/services/indexnow-ping/indexnow-ping-service.test.js
      resources:
        summary: >-
          The implementation owns two model-event registrations and starts untracked HTTP
          requests. Boot registers no cleanup; no cancellation or drain is exposed. The shared
          request dependency owns DNS lookup/cache state and unref'ed cache-maintenance timers;
          HTTP timeout and retry work belongs to that helper and Got. This root creates no
          database connection, dedicated HTTP agent, scheduler or durable queue. Its borrowed
          settings, URL services and event bus outlive individual deliveries.
        sources:
          - core/server/services/indexnow-ping/index.ts
          - core/server/services/indexnow-ping/indexnow-ping-service.ts
          - core/server/lib/common/events.js
          - core/boot.js
          - core/server/ghost-server.ts
          - package.json
        tests: []
      failures:
        summary: >-
          Subscription failure leaves service assigned, so another init skips retry.
          Missing/unresolved URLs and absent keys warn and return; 200/202 log success, 429
          logs rate_limited, 403/422 key_validation_failed and other errors ping_failed.
          Ordinary URL-resolution/request errors are logged and swallowed. Model access in
          the synchronous listener can throw; config gates precede ping's try and their
          rejection is silently swallowed by the listener. Production GETs inherit Got
          retries despite the no-retry comment; the request helper disables retries under
          test environments. Class HTTP tests establish final classification, not production
          attempts, timeout duration or event-to-persistence failure isolation.
        sources:
          - core/server/services/indexnow-ping/index.ts
          - core/server/services/indexnow-ping/indexnow-ping-service.ts
          - core/server/models/base/plugins/events.js
          - package.json
          - vitest.config.ts
        tests:
          - test/unit/server/services/indexnow-ping/indexnow-ping-service.test.js
    unverified: []
    blockers:
      - >-
        Add root/boot contracts for exports, initialization identity, disabled first init,
        partial subscription failure and restart after listener removal. The class subscription
        test only checks event names and call count on a fake bus, not callback identity or
        duplicate prevention. Decide listener disposal and pending-request drain ownership.
      - >-
        Pin the real post-model/event/URL-service boundary, including transactional publication,
        import suppression and author/tag-filtered routes. Current tests invoke the class with
        fake models and URL services; no assertion establishes full publishing-path behavior.
        Characterize synchronous model errors, pre-try config failures and logging failures.
      - >-
        Cover live setting changes, complete query encoding/keyLocation, subdirectory sites
        and the actual key-verification route. The route and ping accept different key shapes;
        existing getApiKey tests deliberately accept a non-hex key. Test the generated-key
        contract before changing either side.
      - >-
        Resolve the no-retry comment against actual transport behavior: production Got GETs
        permit two retries for eligible statuses/errors, while test mode disables retries.
        Characterize production backoff/timeouts and stop with pending requests; the current
        HTTP classification tests do not establish these lifecycle contracts.
