      construction:
        summary: >-
          Wrapper module evaluation destructures and retains the shared DonationPaymentEvent
          model. First init constructs a repository with that reference; its truthy repository
          guard makes later calls no-ops. Construction only stores a private model reference and
          performs no write. Boot is the only runtime init caller found; Stripe imports the eager
          wrapper before initialization. No focused assertions pin import timing, model identity,
          guarded construction or recovery after construction failure.
        sources:
          - core/server/services/donations/index.js
          - core/server/services/donations/donation-service-wrapper.js
          - core/server/services/donations/donation-bookshelf-repository.ts
          - core/server/services/stripe/service.js
          - core/boot.js
        tests: []
      consumers:
        summary: >-
          Stripe retains the wrapper but supplies checkout handling with a getter that reads its
          current repository at donation time. The handler creates the event, awaits save, then
          directly awaits staff notification; the event class is not dispatched through DomainEvents.
          Members event browsing reads the same model independently, without using this repository;
          optional full database backup also includes the table. Real donation checkout/webhook HTTP tests prove
          anonymous/member fields, attribution/UTM persistence and staff-mail subjects through
          mocked Stripe/mail transports. Handler units inject the repository, and browsing units
          pin requested relations rather than real saved-event projection.
        sources:
          - core/server/services/stripe/service.js
          - core/server/services/stripe/stripe-service.js
          - core/server/services/stripe/services/webhook/checkout-session-event-service.js
          - core/server/services/staff/staff-service-emails.js
          - core/server/services/members/api.js
          - core/server/services/members/members-api/repositories/event-repository.js
          - core/server/data/exporter/table-lists.js
        tests:
