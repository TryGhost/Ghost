          Loading session eagerly constructs GhostMailer, the session service, middleware and
          SessionStore. Express-session middleware is cached on first getSession; member-token
          middleware is cached after the first request builds it. The backend also imports
          session directly to create SSO middleware.
        sources:
          - core/server/services/auth/session/index.js
          - core/server/services/auth/session/express-session.js
          - core/server/services/auth/members/index.js
          - core/server/web/parent/backend.js
        tests: []
    unverified:
