# Temporary migration inventory. See README.md before updating.
# Entry points are relative to this directory; evidence paths are relative to ghost/core.
# An unverified facet is an open audit question, not an empty/no-op contract.
version: 1
services:
  activitypub:
    kind: directory
    disposition: retain
    status: auditing
    entryPoints:
      - activitypub/index.js
    notes: >-
      Preserve background startup and settings-driven enable/disable behavior; audit listener
      disposal and in-flight configuration.
    contracts:
      exports:
        summary: >-
          CommonJS exports the wrapper class itself, with static init(), instance and
          initialised fields.
        sources:
          - core/server/services/activitypub/index.js
          - core/server/services/activitypub/activity-pub-service-wrapper.js
        tests: []
      construction:
        summary: >-
          The first init with an available identity-token instance constructs
          ActivityPubService, captures the site URL and subscribes three settings listeners. A
          retained instance makes later init calls return immediately.
        sources:
          - core/server/services/activitypub/activity-pub-service-wrapper.js
          - core/server/services/activitypub/activity-pub-service.ts
        tests: []
      startup:
        summary: >-
          Background boot awaits wrapper init after earlier recovery and scheduling work. The
          wrapper logs and returns if identity tokens are absent, and starts
          configureActivityPub without awaiting enable/disable completion.
        sources:
          - core/boot.js
          - core/server/services/activitypub/activity-pub-service-wrapper.js
        tests: []
    unverified:
      - consumers
      - lifetime
      - configuration
      - resources
      - failures
    blockers:
      - >-
        Characterize settings-task failures and concurrent edits; init completion does not
        establish completed remote configuration.
      - The wrapper registers settings listeners without a shutdown or unsubscribe path.
  adapter-manager:
    kind: directory
    disposition: retain
    status: auditing
    entryPoints:
      - adapter-manager/index.ts
    notes: >-
      Preserve boot validation, lazy adapter construction and cached instance identity; decide
      disposal ownership for adapters.
    contracts:
      exports:
        summary: >-
          The TypeScript default export is an eager AdapterManager instance; CommonJS callers
          read .default. Its public methods are init(), getAdapter() and clearCache().
        sources:
          - core/server/services/adapter-manager/index.ts
          - core/server/services/adapter-manager/adapter-manager.ts
          - core/boot.js
        tests: []
      construction:
        summary: >-
          The root constructs one manager with config, require, adapter paths and registered
          base classes. getAdapter constructs adapters lazily and caches them by requested
          name and selected class name.
        sources:
          - core/server/services/adapter-manager/index.ts
          - core/server/services/adapter-manager/adapter-manager.ts
        tests: []
      startup:
        summary: >-
          initCore calls init synchronously to load configured adapter classes and run
          optional static validation. It skips unconfigured types, deduplicates class/config
          pairs and aggregates failures; actual instances are constructed on getAdapter.
        sources:
          - core/boot.js
          - core/server/services/adapter-manager/adapter-manager.ts
        tests:
          - test/unit/server/services/adapter-manager/adapter-manager.test.ts
      configuration:
        summary: >-
          getAdapter resolves selection and options from config on every call, but returns the
          cached instance for the same requested name and class. Changed options alone do not
          reconstruct it; clearCache drops cached references.
        sources:
          - core/server/services/adapter-manager/adapter-manager.ts
        tests: []
    unverified:
      - consumers
      - lifetime
      - resources
      - failures
    blockers:
      - Add same-manager configuration-change and retained-consumer tests.
      - >-
        clearCache does not dispose adapters; audit resource ownership and callers retaining
        old instances.
  announcement-bar-service:
    kind: directory
    disposition: retain
    status: auditing
    entryPoints:
      - announcement-bar-service/index.js
    notes: >-
      Preserve live settings reads and visibility decisions; account for the validator using
      the implementation class directly.
    contracts:
      exports:
        summary: >-
          CommonJS exports one AnnouncementBarSettings instance with
          getAnnouncementSettings(). The implementation class is also imported directly for
          its static VisibilityValues.
        sources:
          - core/server/services/announcement-bar-service/index.js
          - core/server/services/announcement-bar-service/announcement-bar-settings.js
          - core/server/api/endpoints/utils/validators/input/settings.js
        tests: []
      construction:
        summary: >-
          The root constructs the instance at module evaluation with a settings-reader
          callback. The announcements endpoint retains that instance; the settings validator
          reads the class without constructing another.
        sources:
          - core/server/services/announcement-bar-service/index.js
          - core/server/api/endpoints/announcements.js
          - core/server/api/endpoints/utils/validators/input/settings.js
        tests: []
      configuration:
        summary: >-
          Every getAnnouncementSettings call invokes the callback to read content, background
          and visibility from settingsCache; these values are not captured at construction.
        sources:
          - core/server/services/announcement-bar-service/index.js
          - core/server/services/announcement-bar-service/announcement-bar-settings.js
        tests: []
    unverified:
      - consumers
      - startup
      - lifetime
      - resources
      - failures
    blockers:
      - >-
        Add same-instance settings-change and root export characterization before moving
        construction to boot.
  audience-feedback:
    kind: directory
    disposition: retain
    status: auditing
    entryPoints:
      - audience-feedback/index.js
    notes: >-
      Preserve the service, controller and repository surfaces, including feedback links and
      the captured fallback URL.
    contracts:
      exports:
        summary: >-
          CommonJS exports an eager wrapper with async init(); initialization publishes
          repository, service and controller properties.
        sources:
          - core/server/services/audience-feedback/index.js
        tests: []
      construction:
        summary: >-
          Boot calls init, which constructs the model-backed repository,
          AudienceFeedbackService and controller. A truthy service guards repeat calls. Email
          rendering retains service; the members app and feedback endpoint use
          controller/repository through the wrapper.
        sources:
          - core/boot.js
          - core/server/services/audience-feedback/index.js
          - core/server/services/email-service/email-service-wrapper.js
          - core/server/web/members/app.js
          - core/server/api/endpoints/feedback-members.js
        tests: []
      configuration:
        summary: >-
          Initialization captures the home URL as baseURL. Link building asks the URL service
          for the current post URL, while fallback and email links use that captured base.
        sources:
          - core/server/services/audience-feedback/index.js
          - core/server/services/audience-feedback/audience-feedback-service.js
        tests: []
    unverified:
      - consumers
      - startup
      - lifetime
      - resources
      - failures
    blockers:
      - >-
        Characterize repeated init, retained consumers and constructor failures; the service
        guard is set before controller construction finishes.
  auth:
    kind: directory
    disposition: review
    status: auditing
    entryPoints:
      - auth/index.js
      - auth/session/index.js
      - auth/session/express-session.js
      - auth/members/index.js
    notes: >-
      Review an interim auth subsystem outside services. Keep authentication policy outside
      the HTTP layer and identify each nested instance owner.
    contracts:
      exports:
        summary: >-
          The CommonJS root exposes lazy getters for authorize, authenticate, session, setup,
          passwordreset and resetAuthentication. These include middleware and workflow
          functions, rather than one initialized service instance.
        sources:
          - core/server/services/auth/index.js
          - core/server/services/auth/authenticate.js
          - core/server/services/auth/authorize.js
          - core/server/services/auth/setup.js
          - core/server/services/auth/passwordreset.js
          - core/server/services/auth/reset-authentication.ts
        tests: []
      construction:
        summary: >-
          Loading session eagerly constructs GhostMailer, the session service, middleware and
          SessionStore. Express-session middleware is cached on first getSession; member-token
          middleware is cached after the first request builds it. The backend also imports
          session directly to create SSO middleware.
        sources:
          - core/server/services/auth/session/index.js
          - core/server/services/auth/session/express-session.js
          - core/server/services/auth/members/index.js
          - core/server/web/parent/backend.js
        tests: []
    unverified:
      - consumers
      - startup
      - lifetime
      - configuration
      - resources
      - failures
    blockers:
      - >-
        Complete the nested middleware, session-store, mailer and SSO adapter ownership audit
        before relocating auth.
      - >-
        Characterize first-request configuration capture, concurrent first use and
        reset-authentication ordering before changing initialization.
  automations:
    kind: directory
    disposition: retain
    status: auditing
    entryPoints:
      - automations/index.ts
      - automations/automations-api.ts
    notes: >-
      Manage both the polling instance and the separately composed API repository; preserve
      scheduling and signup-trigger behavior.
    contracts:
      exports:
        summary: >-
          The root exports the named automationsService instance. Callers also import
          automations-api directly for reads, writes, signup triggers and email analytics
          operations.
        sources:
          - core/server/services/automations/index.ts
          - core/server/services/automations/automations-api.ts
          - core/server/api/endpoints/automations.ts
          - core/server/services/members/members-api/members-api.js
          - core/boot.js
        tests: []
      construction:
        summary: >-
          The root eagerly constructs AutomationsService. Loading automations-api separately
          constructs a database repository and captures fakeWaitHoursMultiplier. First init
          creates a timer, two poll subscriptions and scheduler registration, launches the
          first poll asynchronously, then sets its initialization guard.
        sources:
          - core/server/services/automations/index.ts
          - core/server/services/automations/automations-api.ts
          - core/server/services/automations/service.ts
        tests: []
      startup:
        summary: >-
          Boot calls and awaits automationsService.init after jobs.start and before post
          rescheduling. The implementation is synchronous and launches the first poll
          asynchronously, so this await does not wait for poll completion.
        sources:
          - core/boot.js
          - core/server/services/automations/service.ts
        tests:
          - test/unit/server/services/automations/service.test.ts
      lifetime:
        summary: >-
          After successful init, later calls return without replacing the timer, subscriptions
          or captured scheduler dependencies. rescheduleAll is a no-op before init and
          otherwise enqueues a fresh poll.
        sources:
          - core/server/services/automations/service.ts
        tests:
          - test/unit/server/services/automations/service.test.ts
      failures:
        summary: >-
          Synchronous init errors escape to boot. Analytics scheduling failure during a poll
          is caught and logged; it does not retry the already sent email or prevent step
          completion.
        sources:
          - core/server/services/automations/service.ts
          - core/server/services/automations/poll.ts
          - core/boot.js
        tests:
          - test/unit/server/services/automations/poll.test.ts
    unverified:
      - consumers
      - configuration
      - resources
    blockers:
      - >-
        No stop/dispose method releases the timer or poll subscriptions; audit in-flight
        polling and scheduler ownership.
      - >-
        Characterize module-level repository configuration and partially completed init
        before migrating both composition paths.
      - >-
        Test boot ordering with pending jobs startup and propagation of synchronous
        automation initialization errors; the existing boot stub incorrectly models
        initialization as asynchronous.
  comments:
    kind: directory
    disposition: retain
    status: auditing
    entryPoints:
      - comments/index.js
    notes: >-
      Preserve API/controller replacement on init and account for the nested mailer and
      email-rendering dependencies.
    contracts:
      exports:
        summary: >-
          CommonJS exports one wrapper with init(), api and controller; api and controller are
          assigned during initialization.
        sources:
          - core/server/services/comments/index.js
        tests: []
      construction:
        summary: >-
          Each init constructs GhostMailer, CommentsService, CommentsStats and
          CommentsController. CommentsService also constructs its email helper and renderer.
          Boot calls init; comment endpoints and the post serializer retain the wrapper.
        sources:
          - core/server/services/comments/index.js
          - core/server/services/comments/comments-service.js
          - core/server/services/comments/comments-service-emails.js
          - core/boot.js
          - core/server/api/endpoints/comments.js
          - core/server/api/endpoints/utils/serializers/output/mappers/posts.js
        tests: []
      lifetime:
        summary: >-
          The wrapper has no init guard: every call replaces api and controller. Previously
          retained implementation references are not updated by that replacement.
        sources:
          - core/server/services/comments/index.js
        tests: []
    unverified:
      - consumers
      - startup
      - configuration
      - resources
      - failures
    blockers:
      - >-
        Add root initialization and retained-consumer tests; audit nested mail transport
        lifetime and failure behavior.
  content-import:
    kind: directory
    disposition: retain
    status: auditing
    entryPoints:
      - content-import/index.ts
    notes: >-
      Preserve boot-created importer state, request validation, job dispatch, staging and
      completion reporting.
    contracts:
      exports:
        summary: >-
          The TypeScript root exports init, importCSV, handleJob and allSettled functions. The
          separately exported ContentCSVImportJob class is registered by the jobs composition
          module.
        sources:
          - core/server/services/content-import/index.ts
          - core/server/services/content-import/jobs/content-csv-import-job.ts
          - core/server/services/jobs-service/register-job-handlers.ts
        tests: []
      construction:
        summary: >-
          The first init constructs ContentCSVImporter with a run store, model repository,
          GhostMailer and staging callbacks; later init calls retain it. Media inliners are
          created through a callback, and jobs/storage adapters are resolved when their
          callbacks run.
        sources:
          - core/server/services/content-import/index.ts
        tests: []
      startup:
        summary: >-
          Boot initializes the importer before registering and starting job handlers.
          importCSV and handleJob throw before init, while allSettled resolves without an
          importer; the existing root test checks the pre-init job error and allSettled path.
        sources:
          - core/boot.js
          - core/server/services/content-import/index.ts
          - core/server/services/jobs-service/register-job-handlers.ts
        tests:
          - test/unit/server/services/content-import/index.test.ts
    unverified:
      - consumers
      - lifetime
      - configuration
      - resources
      - failures
    blockers:
      - >-
        Characterize repeated init, retained run state and same-instance configuration
        changes.
      - >-
        Complete the staging, in-flight import, mailer and shutdown audit; allSettled is
        test-facing and is not a boot cleanup hook.
  custom-redirects:
    kind: directory
    disposition: retain
    status: auditing
    entryPoints:
      - custom-redirects/index.js
    notes: >-
      Preserve the distinction between rebuilding the wrapper on init and mutating the
      existing router during configuration reload.
    contracts:
      exports:
        summary: >-
          CommonJS exports init() plus api and middleware getters. The middleware getter
          exposes the current DynamicRedirectManager handleRequest function.
        sources:
          - core/server/services/custom-redirects/index.js
        tests: []
      construction:
        summary: >-
          Each init constructs a redirect manager and RedirectsService around the selected
          redirects adapter, then returns the service initialization promise. The same manager
          factory supplies fresh dry-run managers for replace validation.
        sources:
          - core/server/services/custom-redirects/index.js
          - core/server/services/custom-redirects/redirects-service.ts
        tests: []
      startup:
        summary: >-
          Frontend service boot awaits init before building the site app.
          RedirectsService.init catches and logs activation errors; adapter lookup or
          construction errors before that call still propagate.
        sources:
          - core/boot.js
          - core/server/services/custom-redirects/index.js
          - core/server/services/custom-redirects/redirects-service.ts
          - core/frontend/web/site.js
        tests: []
      lifetime:
        summary: >-
          activate and replace mutate the manager retained by the mounted middleware. Calling
          root init again replaces both service and manager, while an already mounted
          handleRequest still refers to its previous manager.
        sources:
          - core/server/services/custom-redirects/index.js
          - core/server/services/custom-redirects/redirects-service.ts
          - core/frontend/web/site.js
        tests: []
    unverified:
      - consumers
      - configuration
      - resources
      - failures
    blockers:
      - >-
        Add a retained-middleware repeated-init test; do not equate reload through activate
        with a fresh init.
      - >-
        Audit redirect-store ownership and parser/helper imports used by adapters and
        endpoints.
  custom-theme-settings.js:
    kind: file
    disposition: retain
    status: auditing
    entryPoints:
      - custom-theme-settings.js
    notes: >-
      Preserve initialization before theme activation and API replacement on repeated init;
      later migrate the standalone wrapper into the agreed root pattern.
    contracts:
      exports:
        summary: >-
          The CommonJS file exports one wrapper with init() and an api property assigned
          during initialization.
        sources:
          - core/server/services/custom-theme-settings.js
        tests: []
      construction:
        summary: >-
          Every init constructs CustomThemeSettingsService with the shared cache and model.
          Boot initializes it before themes; theme activation/storage and the
          custom-theme-settings endpoint use the wrapper.
        sources:
          - core/server/services/custom-theme-settings.js
          - core/boot.js
          - core/server/services/themes/activation-bridge.js
          - core/server/services/themes/storage.js
          - core/server/api/endpoints/custom-theme-settings.js
        tests: []
      lifetime:
        summary: >-
          The wrapper has no init guard and replaces api on every call while reusing the
          imported model and shared cache.
        sources:
          - core/server/services/custom-theme-settings.js
        tests: []
    unverified:
      - consumers
      - startup
      - configuration
      - resources
      - failures
    blockers:
      - >-
        Add wrapper repeated-init and retained-consumer characterization; existing
        cache/service tests do not prove wrapper lifecycle.
  donations:
    kind: directory
    disposition: retain
    status: auditing
    entryPoints:
      - donations/index.js
    notes: >-
      Preserve the guarded repository and the Stripe wrapper reference that resolves it after
      early imports.
    contracts:
      exports:
        summary: >-
          CommonJS exports one DonationServiceWrapper with init() and a repository property;
          this root does not expose a service or controller property.
        sources:
          - core/server/services/donations/index.js
          - core/server/services/donations/donation-service-wrapper.js
        tests: []
      construction:
        summary: >-
          The root eagerly creates its wrapper, whose module captures the DonationPaymentEvent
          model. The first init constructs DonationBookshelfRepository and later calls retain
          it. Stripe retains the wrapper and resolves repository through a webhook-dependency
          getter.
        sources:
          - core/server/services/donations/index.js
          - core/server/services/donations/donation-service-wrapper.js
          - core/server/services/donations/donation-bookshelf-repository.ts
          - core/server/services/stripe/service.js
          - core/server/services/stripe/stripe-service.js
        tests: []
      startup:
        summary: >-
          Boot initializes Stripe before donations, then initializes donations in the main
          service group. The deferred Stripe repository getter allows the earlier construction
          to see the repository after donations init.
        sources:
          - core/boot.js
          - core/server/services/stripe/stripe-service.js
          - core/server/services/donations/donation-service-wrapper.js
        tests: []
    unverified:
      - consumers
      - lifetime
      - configuration
      - resources
      - failures
    blockers:
      - >-
        Add a real retained Stripe consumer test across donation initialization; audit webhook
        operation and error contracts.
  email-address:
    kind: directory
    disposition: retain
    status: auditing
    entryPoints:
      - email-address/index.js
    notes: >-
      Preserve one composed email-address implementation and live configuration/settings
      callbacks, including disabled managed-email behavior.
    contracts:
      exports:
        summary: >-
          CommonJS exports one wrapper with init() and service. Callers use the service
          property; email-address-parser also supplies parse/stringify helpers to other
          services and mail support.
        sources:
          - core/server/services/email-address/index.js
          - core/server/services/email-address/email-address-service-wrapper.js
          - core/server/services/email-address/email-address-parser.ts
          - core/server/lib/mail/ghost-mailer.js
        tests: []
      construction:
        summary: >-
          The root eagerly creates the wrapper, and the first init creates
          EmailAddressService. A service guard retains it. Boot initializes it before Stripe
          and the main service group; email sending and members capture service, while
          newsletters retains the wrapper.
        sources:
          - core/server/services/email-address/index.js
          - core/server/services/email-address/email-address-service-wrapper.js
          - core/boot.js
          - core/server/services/email-service/email-service-wrapper.js
          - core/server/services/members/api.js
          - core/server/services/newsletters/index.js
        tests: []
      configuration:
        summary: >-
          The wrapper passes callbacks that read managed-email enablement/domains, fallback
          address and settings-helper addresses at use time, rather than capturing their
          values during init.
        sources:
          - core/server/services/email-address/email-address-service-wrapper.js
          - core/server/services/email-address/email-address-service.ts
        tests: []
    unverified:
      - consumers
      - startup
      - lifetime
      - resources
      - failures
    blockers:
      - >-
        Add same-loaded-wrapper identity and configuration-change tests; implementation tests
        alone do not cover the composition callbacks.
  email-analytics:
    kind: directory
    disposition: retain
    status: auditing
    entryPoints:
      - email-analytics/index.ts
      - email-analytics/jobs/index.js
    notes: >-
      Preserve three independent pipelines and the separate scheduling entry point;
      characterize partial initialization and job drain behavior.
    contracts:
      exports:
        summary: >-
          The TypeScript root exports init and guarded getNewsletters/getAutomations/getGifts
          accessors. The CommonJS jobs entry exposes three recurring-schedule functions used
          by boot, email sending, gifts and automations.
        sources:
          - core/server/services/email-analytics/index.ts
          - core/server/services/email-analytics/jobs/index.js
          - core/boot.js
          - core/server/services/email-service/email-service-wrapper.js
          - core/server/services/gifts/index.ts
          - core/server/services/automations/service.ts
        tests: []
      construction:
        summary: >-
          init constructs shared queries, newsletter event storage/processing and three
          wrapper instances from injected dependencies, guarded by newsletters. Loading
          jobs/index.js separately constructs EmailAnalyticsJobScheduler, whose jobs-service
          callback resolves the current instance when scheduling.
        sources:
          - core/server/services/email-analytics/index.ts
          - core/server/services/email-analytics/jobs/index.js
        tests: []
      startup:
        summary: >-
          The synchronous init call precedes job-handler registration. Background scheduling
          uses Promise.allSettled and logs individual failures while later background services
          continue.
        sources:
          - core/boot.js
          - core/server/services/email-analytics/index.ts
        tests:
          - test/unit/boot-email-analytics.test.ts
      lifetime:
        summary: >-
          Before init, all three accessors assert. After successful init they return distinct
          retained wrappers, and later init calls preserve them; unit tests substitute wrapper
          constructors to check this publication contract.
        sources:
          - core/server/services/email-analytics/index.ts
        tests:
          - test/unit/server/services/email-analytics/index.test.ts
    unverified:
      - consumers
      - configuration
      - resources
      - failures
    blockers:
      - >-
        Publication is sequential and guarded only by newsletters; characterize a later
        constructor failure leaving earlier state initialized.
      - >-
        Finish same-instance config and real job continuation/drain characterization,
        including the separately composed scheduler.
  email-service:
    kind: directory
    disposition: retain
    status: auditing
    entryPoints:
      - email-service/index.js
      - email-service/newsletter-email-event-storage.js
      - email-service/email-event-processor.js
    notes: >-
      Preserve the wrapper, newsletter job behavior and cleanup phases; include
      event-processing constructors composed by email analytics.
    contracts:
      exports:
        summary: >-
          CommonJS exports one wrapper with init(), getPostUrl(), renderer, service and
          controller. Email analytics also constructs NewsletterEmailEventStorage and
          EmailEventProcessor through deep imports.
        sources:
          - core/server/services/email-service/index.js
          - core/server/services/email-service/email-service-wrapper.js
          - core/server/services/email-analytics/index.ts
          - core/server/services/email-service/newsletter-email-event-storage.js
          - core/server/services/email-service/email-event-processor.js
        tests: []
      construction:
        summary: >-
          The first init requires jobsService and constructs Mailgun, rendering, sending,
          segmentation, warming, batch, status and controller dependencies. It captures member
          and sibling-service references, adds a locale listener and optionally registers
          GhostServer pre-stop/cleanup tasks. A service guard skips later calls.
        sources:
          - core/server/services/email-service/email-service-wrapper.js
          - core/boot.js
        tests: []
    unverified:
      - consumers
      - startup
      - lifetime
      - configuration
      - resources
      - failures
    blockers:
      - >-
        Characterize wrapper initialization and partial-construction failures; its existing
        wrapper tests cover getPostUrl only.
      - >-
        Audit locale-listener disposal and retained batch-sender state across restart, plus
        the final status write after tracked batch work.
  email-suppression-list:
    kind: directory
    disposition: retain
    status: auditing
    entryPoints:
      - email-suppression-list/index.js
    notes: >-
      Preserve eager provider composition, suppression fallback behavior and domain-event
      subscription behavior.
    contracts:
