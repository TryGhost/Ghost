        summary: >-
          Boot registers handlers after asynchronous service prerequisites settle, awaits
          jobs.start, then starts automation polling.
        sources:
          - core/boot.js
          - core/server/services/jobs-service/jobs-service.ts
        tests:
          - test/unit/boot-email-analytics.test.ts
          - test/e2e-server/boot-readiness.isolated.test.ts
      lifetime:
        summary: >-
          The wrapper retains its jobs instance through shutdown. MentionController
          retains the injected instance and calls dispatch; reinitialization clears
          handlers and queue declarations before registration.
        sources:
          - core/server/services/jobs-service/index.ts
          - core/server/services/jobs-service/jobs-service.ts
          - core/server/services/mentions/mention-controller.js
        tests:
          - test/unit/server/services/jobs-service/index.test.js
          - test/unit/server/services/jobs-service/jobs-service.test.ts
          - test/unit/server/services/jobs-service/retained-consumer.test.ts
      consumers:
        summary: >-
          Source inspection establishes these callers: boot injects the instance into
          retained mentions and email consumers and a fresh site importer. Members, content CSV imports, the media API and email analytics
          resolve it when dispatching or scheduling. Gift/member cleanup, signing keys,
          update checks and Tinybird schedule through boot-supplied references. The default
          backend runs jobs in-process; registered handlers call initialized domain services.
          The cited tests cover dispatch through a retained MentionController across restart
          and handler registration. The other consumer wiring is source-only evidence here.
        sources:
          - core/boot.js
          - core/server/adapters/jobs/InMemoryJobsBackend.ts
          - core/server/services/jobs-service/register-job-handlers.ts
          - core/server/services/mentions/mention-controller.js
          - core/server/services/mentions/mention-sending-service.js
          - core/server/services/email-service/batch-sending-service.js
          - core/server/data/importer/import-manager.js
          - core/server/data/importer/index.js
          - core/server/services/members/service.js
          - core/server/services/content-import/index.ts
          - core/server/api/endpoints/db.js
          - core/server/services/email-analytics/jobs/index.js
          - core/server/services/email-analytics/jobs/email-analytics-job-scheduler.ts
          - core/server/services/gifts/jobs/index.js
          - core/server/services/members/jobs/index.js
          - core/server/services/signing-keys/index.ts
          - core/server/services/update-check/index.js
          - core/server/services/tinybird-sync/tinybird-sync-service.ts
        tests:
          - test/unit/server/services/jobs-service/register-job-handlers.test.ts
          - test/unit/server/services/jobs-service/retained-consumer.test.ts
      configuration:
        summary: >-
          The wrapper looks up the jobs adapter on first init; reinit reuses the same
          service and backend. Checked-in defaults select InMemoryJobsBackend with
          concurrency 3. Registration declares separate queue limits. Boot passes
          server:shutdownTimeout to jobs shutdown when its cleanup task runs; the in-memory
          backend otherwise waits 10 seconds.
        sources:
          - core/server/services/jobs-service/index.ts
          - core/server/services/jobs-service/register-job-handlers.ts
          - core/shared/config/defaults.json
          - core/server/adapters/jobs/InMemoryJobsBackend.ts
          - core/boot.js
        tests:
          - test/unit/server/services/jobs-service/index.test.js
          - test/unit/server/services/jobs-service/register-job-handlers.test.ts
          - test/unit/server/adapters/jobs/in-memory-jobs-backend.test.ts
          - test/e2e-server/boot-readiness.isolated.test.ts
      resources:
        summary: >-
          The in-memory backend reads recurring schedules in local time and keeps the first
          registration per job type. Shutdown stops accepting work, clears recurring timers,
          drops queued work and bounds the wait for active deliveries, then discards its
          queues so a re-boot starts with empty lanes. Enqueue or schedule before start
          throws; after shutdown both are dropped. A passed deadline does not cancel active
          deliveries, and an early drain leaves its deadline timer pending. GhostServer
          drains HTTP before starting its concurrent cleanup tasks, and jobs shut down in a
          cleanup task after the HTTP drain.
        sources:
          - core/server/adapters/jobs/InMemoryJobsBackend.ts
          - core/server/services/jobs-service/jobs-service.ts
          - core/boot.js
          - core/server/ghost-server.ts
        tests:
          - test/unit/server/adapters/jobs/in-memory-jobs-backend.test.ts
          - test/unit/server/services/jobs-service/jobs-service.test.ts
          - test/unit/server/ghost-server.test.ts
          - test/e2e-server/boot-readiness.isolated.test.ts
      failures:
        summary: >-
          Invalid declarations, duplicate handler types and conflicting queue limits fail.
          Dispatch and recurring scheduling propagate payload serialization, validation
          and backend errors.
          Deliveries for unknown job types are logged and dropped. Handler errors are
          logged, reported and rethrown to the backend; the in-memory backend logs them and
          continues other deliveries without retrying. A recurring tick whose enqueue throws
          is logged and the schedule keeps running.
        sources:
          - core/server/services/jobs-service/jobs-service.ts
          - core/server/adapters/jobs/InMemoryJobsBackend.ts
        tests:
          - test/unit/server/services/jobs-service/jobs-service.test.ts
          - test/unit/server/adapters/jobs/in-memory-jobs-backend.test.ts
    unverified: []
    blockers:
      - >-
        Before changing consumer wiring, add contract tests for the boot-injected email
        and site-importer references, dispatch-time lookups and boot-supplied scheduling
        references identified above. The cited consumer tests do not cover these paths.
        Custom jobs adapters need their own evidence.
      - >-
        Recurring scheduling guards in gifts, members, signing keys, email analytics and
        Tinybird survive backend shutdown, which removes their timers. Recurrence after
        in-process restart is not established; resolve this legacy limitation explicitly.
      - >-
        Timed-out handlers can outlive cleanup, and an early drain leaves its deadline
        timer pending. Do not claim cancellation or safe dependency disposal from bounded
        shutdown alone. Domain handlers such as the site importer may absorb their own
        failures, so settlement is not proof of successful domain work. Cross-service drain
        ordering and full-boot failure remain open.
